<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>סולם · sulam</title>
<style>
:root{
  --bg:#0e0f12; --panel:#16181d; --ink:#e8e6e0; --dim:#8a8a92; --faint:#4a4a52;
  --warm:#e0a458; --cool:#6aa5c8; --good:#7dc47d; --bad:#c4707d; --line:#26282e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:baseline;gap:12px;padding:14px 16px 8px}
#top h1{font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--dim)}
#top .sub{font-size:11px;color:var(--faint)}
#tabs{display:flex;gap:6px;padding:0 12px 10px}
.tab{flex:1;text-align:center;padding:9px 4px 7px;border:1px solid var(--line);border-radius:10px;
  color:var(--dim);cursor:pointer;user-select:none;-webkit-user-select:none}
.tab .heb{font-size:15px;display:block}
.tab .lat{font-size:9px;color:var(--faint);letter-spacing:.08em}
.tab.on{color:var(--ink);border-color:var(--warm);background:var(--panel)}
#stage{flex:1;overflow-y:auto;padding:6px 16px 24px;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.meta{font-size:11px;color:var(--faint);letter-spacing:.05em;max-width:360px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:active{transform:scale(.97)}
.bigbtn{padding:13px 20px;font-size:16px;min-width:90px}
.bigbtn .lat{display:block;font-size:9px;color:var(--faint);letter-spacing:.08em;margin-top:2px}
#controls{display:flex;gap:10px;justify-content:center;padding:10px 16px calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap}
.g-good{border-color:var(--good)} .g-bad{border-color:var(--bad)} .g-skip{border-color:var(--faint);color:var(--dim)}
.verblist{width:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-top:6px}
.vrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;cursor:pointer}
.vrow .he{font-size:22px;direction:rtl;min-width:96px;text-align:right}
.vrow .en{font-size:12px;color:var(--dim);flex:1}
.vrow .cond{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--dim)}
.vrow .cond.c{color:var(--warm);border-color:var(--warm)}
.vrow .mast{font-size:11px;color:var(--good);min-width:38px;text-align:right}
.binhead{font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin:10px 2px 2px}
#ladder{display:flex;flex-direction:column-reverse;gap:5px;direction:rtl;margin:4px 0}
.rung{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;
  padding:6px 12px;min-width:250px;transition:border-color .15s, background .15s}
.rung.now{border-color:var(--warm);background:#1e1a14}
.rung.hole .form{color:transparent;text-shadow:0 0 14px rgba(232,230,224,.55)}
.rung.hole.revealed .form{color:var(--ink);text-shadow:none}
.rung .pers{font-size:10px;color:var(--faint);min-width:52px;direction:ltr;text-align:left}
.rung .form{font-size:22px;flex:1;text-align:right}
.rung .tr{font-size:11px;color:var(--warm);direction:ltr;min-width:70px;text-align:left}
.rung.hole:not(.revealed) .tr{visibility:hidden}
.stagebar{display:flex;gap:6px;justify-content:center;margin:2px 0 6px}
.stagebar span{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--faint)}
.stagebar span.on{color:var(--warm);border-color:var(--warm)}
.dash{width:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:600;margin-bottom:8px;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--dim)}
.kv b{color:var(--ink);font-weight:500}
.exp{font-size:12px;color:var(--dim);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;direction:rtl}
.grid .cell{aspect-ratio:1;border-radius:3px;background:var(--faint);opacity:.35}
.grid .cell.l1{opacity:.7;background:var(--cool)}
.grid .cell.l2{opacity:1;background:var(--good)}
.grid .vlabel{font-size:12px;direction:rtl;align-self:center;opacity:1;background:none;aspect-ratio:auto}
.footrow{display:flex;gap:10px;margin-top:4px}
.footrow button{flex:1;padding:10px;font-size:13px}
.pill{font-size:11px;color:var(--faint)}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:13px;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
input[type=file]{display:none}
</style>
</head>

  VERBS.forEach(v => { (by[v.binyan] = by[v.binyan] || []).push(v); });
  let html = '<div class="verblist">';
  html += `<div class="meta" style="margin:4px 2px">one melody per binyan — forever. Learn the tune once, sing every verb on it.<br>C = chanted ladder · S = spoken rhythm (the experiment's two arms)<br>-tem forms: the voice sings the formal -tém; street Hebrew says -á-tem — both are right, sing with the voice</div>`;
  for (const bin of ["pa'al", "pi'el", "hif'il"]) {
    html += `<div class="binhead">${bin} · ladder ${LADDERS[bin].join('·')}</div>`;
    (by[bin] || []).forEach(v => {
      const m = mastery(v.id);
      html += `<div class="vrow" data-v="${v.id}"><span class="he">${v.inf}</span>
        <span class="en">${v.en}</span>
        <span class="cond ${COND[v.id] === 'C' ? 'c' : ''}">${COND[v.id]}</span>
        <span class="mast">${m ? m + '/8' : ''}</span></div>`;
    });
  }
  html += '</div>';
  stage.innerHTML = html;
  document.querySelectorAll('.vrow').forEach(r => r.onclick = () => startRun(r.dataset.v));
}

/* ============ the chant run ============ */
let runT = null;
function stopRun() { if (runT) { clearTimeout(runT); runT = null; } }
function startRun(vid) {
  audioInit(); ctx.resume();
  const v = VERBS.find(x => x.id === vid);
  run = { v, stage: 0, idx: -1, holes: [], done: {}, awaiting: null };
  view = 'verbs'; render();
}
const STAGES = [
  { key: 'listen', he: 'הַאֲזֵן', lat: 'ha\'azén · listen', holes: 0 },
  { key: 'complete', he: 'הַשְׁלֵם', lat: 'hashlém · complete', holes: 3 },
  { key: 'alone', he: 'לְבַד', lat: 'levád · alone', holes: 8 },
];
function pickHoles(n, vid, pass) {
  if (n >= 8) return [0,1,2,3,4,5,6,7];
  // deterministic rotation seeded by stored pass count
  const start = ((state.passes[vid] || 0) * 3) % 8;
  const hs = []; for (let i = 0; i < n; i++) hs.push((start + i * 3) % 8);
  return hs;
}
function renderRun() {
  const v = run.v, st = STAGES[run.stage], cond = COND[v.id];
  const rungs = v.past.map((f, k) => {
    const hole = run.holes.includes(k) && !run.done[k];
    const revealed = run.done[k] === 'r';
    return `<div class="rung${run.idx === k ? ' now' : ''}${hole || revealed ? ' hole' : ''}${revealed ? ' revealed' : ''}" id="rung${k}">
      <span class="form">${f.he}</span><span class="tr">${f.translit}</span><span class="pers">${PERS_LABEL[f.person] || f.person}</span></div>`;
  }).join('');
  stage.innerHTML = `<div class="center" style="justify-content:flex-start;padding-top:6px">
    <div class="meta"><span style="font-size:20px;color:var(--ink)">${v.inf}</span> · ${v.en} · ${v.binyan} · ${cond === 'C' ? 'chanted' : 'spoken rhythm'}</div>
    <div class="stagebar">${STAGES.map((s, i) => `<span class="${i === run.stage ? 'on' : ''}">${s.lat.split(' · ')[1]}</span>`).join('')}</div>
    <div id="ladder">${rungs}</div>
    <div class="meta" id="runmsg">${run.stage === 0 ? 'listen — the melody is this binyan\'s voice' : 'sing the hidden rungs aloud when the tune stops'}</div>
  </div>`;
  controls.innerHTML = '';
  if (run.awaiting !== null) {
    const k = run.awaiting;
    controls.appendChild(btn('הַרְאֵה', "har'é · reveal", '', () => {
      run.done[k] = 'r';
      $('#rung' + k).classList.add('revealed');
      playClip(v.id + '_p' + k, null);
      controls.innerHTML = '';
      controls.appendChild(btn('טָעִיתִי', "ta'íti · missed", 'g-bad', () => gradeHole(k, false)));
      controls.appendChild(btn('נָכוֹן', 'nachón · correct', 'g-good', () => gradeHole(k, true)));
    }));
  } else if (run.idx < 0) {
    controls.appendChild(btn('נַגֵּן', 'nagén · play', 'g-good', playPass));
    if (run.stage > 0) controls.appendChild(btn('חֲזֹר', 'chazór · back', 'g-skip', () => { run.stage--; run.holes = []; run.done = {}; renderRun(); }));
    controls.appendChild(btn('סִיּוּם', 'siyúm · done', 'g-skip', () => { run = null; render(); }));
  }
}
function playPass() {
  const v = run.v, st = STAGES[run.stage], cond = COND[v.id];
  run.holes = pickHoles(st.holes, v.id, 0); run.done = {}; run.idx = -1; run.awaiting = null;
  const beatMs = 6e4 / state.bpm * 2; // one form per 2 beats
  const step = () => {
    run.idx++;
    if (run.idx >= 8) { finishPass(); return; }
    const k = run.idx;
    document.querySelectorAll('.rung').forEach((r, i) => r.classList.toggle('now', i === k));
    const t = ctx.currentTime + 0.03;
    if (cond === 'C') qrVoice(t, LADDERS[v.binyan][k], 0.30, beatMs / 1000 * 0.85);
    else clickTone(t, 0.25);
    if (run.holes.includes(k)) {
      // the hole: tune sounds, voice silent — the learner sings; playback waits
      run.awaiting = k;
      renderRun();
      const msg = $('#runmsg'); if (msg) msg.textContent = 'sing it aloud: ' + (PERS_LABEL[v.past[k].person] || '') + ' — then reveal';
      return;
    }
    playClip(v.id + '_p' + k, null);
    runT = setTimeout(step, beatMs);
  };
  step();
}
function gradeHole(k, ok) {
  const v = run.v;
  const cells = state.cells[v.id] = state.cells[v.id] || {};
  cells[k] = Math.max(0, (cells[k] || 0) + (ok ? 1 : -1));
  log.push({ t: now(), vid: v.id, cell: k, ok, stage: STAGES[run.stage].key, cond: COND[v.id] });
  save();
  run.awaiting = null;
  // resume the tune after the hole
  const beatMs = 6e4 / state.bpm * 2;
  renderRun();
  document.querySelectorAll('.rung').forEach((r, i) => r.classList.toggle('now', i === run.idx));
  runT = setTimeout(() => {
    const step = () => {
      run.idx++;
      if (run.idx >= 8) { finishPass(); return; }
      const kk = run.idx;
      document.querySelectorAll('.rung').forEach((r, i) => r.classList.toggle('now', i === kk));
      const t = ctx.currentTime + 0.03;
      if (COND[v.id] === 'C') qrVoice(t, LADDERS[v.binyan][kk], 0.30, beatMs / 1000 * 0.85);
      else clickTone(t, 0.25);
      if (run.holes.includes(kk) && !run.done[kk]) { run.awaiting = kk; renderRun(); const m = $('#runmsg'); if (m) m.textContent = 'sing it aloud: ' + (PERS_LABEL[v.past[kk].person] || '') + ' — then reveal'; return; }
      playClip(v.id + '_p' + kk, null);
      runT = setTimeout(step, beatMs);
    };
    step();
  }, 600);
}
function finishPass() {
  const v = run.v;
  state.passes[v.id] = (state.passes[v.id] || 0) + 1;
  log.push({ t: now(), vid: v.id, pass: STAGES[run.stage].key, cond: COND[v.id] });
  save();
  run.idx = -1; run.awaiting = null;
  document.querySelectorAll('.rung').forEach(r => r.classList.remove('now'));
  const holesOk = run.holes.length === 0 || run.holes.every(k => run.done[k]);
  if (run.stage < 2 && holesOk) run.stage++;
  run.holes = []; run.done = {};
  renderRun();
  toast(STAGES[run.stage].lat.split(' · ')[1] + ' →');
}

/* ============ gauges ============ */
function renderDash() {
  const t = now();
  // condition comparison on DELAYED holes: first hole-grade of a cell >= 24h after that cell's previous grade
  const lastSeen = {}, arm = { C: [0, 0], S: [0, 0] };
  log.filter(e => e.cell != null).forEach(e => {
    const key = e.vid + ':' + e.cell;
    if (lastSeen[key] && e.t - lastSeen[key] > 24 * 36e5) { const a = arm[e.cond]; if (a) { a[1]++; if (e.ok) a[0]++; } }
    lastSeen[key] = e.t;
  });
  const etLine = (arm.C[1] >= 15 && arm.S[1] >= 15)
    ? `chanted: <b>${Math.round(100 * arm.C[0] / arm.C[1])}%</b> (n=${arm.C[1]}) · spoken: <b>${Math.round(100 * arm.S[0] / arm.S[1])}%</b> (n=${arm.S[1]})`
    : `accumulating delayed recalls: chanted n=${arm.C[1]}, spoken n=${arm.S[1]} — verdict from n≥15 per arm`;
  const grid = VERBS.map(v => {
    const c = state.cells[v.id] || {};
    return `<span class="cell vlabel">${v.inf_plain}</span>` + v.past.map((f, k) =>
      `<span class="cell ${c[k] >= 2 ? 'l2' : c[k] >= 1 ? 'l1' : ''}"></span>`).join('');
  }).join('');
  const cellsTotal = VERBS.length * 8;
  const solid = VERBS.reduce((a, v) => a + mastery(v.id), 0);
  stage.innerHTML = `<div class="dash">
    <div class="card"><h3>paradigm lattice · ${solid}/${cellsTotal} cells solid</h3>
      <div class="grid">${grid}</div>
      <div class="pill" style="margin-top:6px">blue = recalled once · green = twice+ · a hole in the tune you can always sing</div></div>
    <div class="card"><h3>étude 2 · ladder chant</h3>
      <div class="exp">Pre-registered: paradigm cells drilled on the binyan's fixed melody (C) should hold better at a day's delay than cells drilled on bare rhythm (S) — the Wallace condition: same tune every time, or it doesn't work. Metric: delayed hole accuracy (≥24 h). This is a genuinely open question in the literature — your data is real data.</div>
      <div class="exp" style="margin-top:6px">${etLine}</div></div>
    <div class="card"><h3>settings · export</h3>
      <div class="kv"><span>tempo</span><b><button style="padding:2px 10px" onclick="cycleBpm()">${state.bpm} bpm</button></b></div>
      <div class="kv"><span>room (A/B by ear)</span><b><button style="padding:2px 10px" onclick="cycleMix()">${state.mix === 'engine' ? 'engine · n²-mod-p' : 'guide · approved 14.08'}</button></b></div>
      <div class="footrow">
        <button onclick="exportJSON()">⇩ log</button>
        <button onclick="document.getElementById('imp').click()">⇪ import</button>
      </div>
      <input type="file" id="imp" accept=".json" onchange="importJSON(this)">
      <div class="pill" style="margin-top:8px">daily dose: two verbs, one from each arm · sing aloud, always</div></div>
  </div>`;
}
function cycleBpm() { const s = [60, 72, 84]; state.bpm = s[(s.indexOf(state.bpm) + 1) % s.length]; save(); renderDash(); }
function cycleMix() { state.mix = state.mix === 'engine' ? 'guide' : 'engine'; save(); renderDash(); }
function exportJSON() {
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), state, log }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'sulam-' + dayKey(now()) + '.json'; a.click();
}
function importJSON(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(txt => { const d = JSON.parse(txt);
    if (d.state && d.state.cells) { state = d.state; log = d.log || []; save(); render(); toast('restored'); }
    else toast('not a sulam log'); }).catch(() => toast('unreadable file'));
}

/* ============ boot ============ */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { view = t.dataset.v; run = null; render(); });
load(); render();
window.cycleBpm = cycleBpm; window.cycleMix = cycleMix; window.exportJSON = exportJSON; window.importJSON = importJSON;
</script>
</body>
</html>
