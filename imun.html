<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>אימון · imun</title>
<style>
:root{
  --bg:#0e0f12; --panel:#16181d; --ink:#e8e6e0; --dim:#8a8a92; --faint:#4a4a52;
  --warm:#e0a458; --cool:#6aa5c8; --good:#7dc47d; --bad:#c4707d; --line:#26282e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:baseline;gap:12px;padding:14px 16px 8px}
#top h1{font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--dim)}
#top .sub{font-size:11px;color:var(--faint)}
#streak{margin-inline-start:auto;font-size:12px;color:var(--dim)}
#tabs{display:flex;gap:6px;padding:0 12px 10px}
.tab{flex:1;text-align:center;padding:9px 4px 7px;border:1px solid var(--line);border-radius:10px;
  color:var(--dim);cursor:pointer;user-select:none;-webkit-user-select:none}
.tab .heb{font-size:15px;display:block}
.tab .lat{font-size:9px;color:var(--faint);letter-spacing:.08em}
.tab.on{color:var(--ink);border-color:var(--warm);background:var(--panel)}
#stage{flex:1;overflow-y:auto;padding:6px 16px 24px;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}
.he{font-size:40px;line-height:1.3;direction:rtl;font-weight:500}
.translit{font-size:16px;color:var(--warm);direction:ltr}
.gloss{font-size:17px;color:var(--dim);direction:ltr}
.meta{font-size:11px;color:var(--faint);letter-spacing:.05em;max-width:340px}
.bignum{font-size:34px;font-weight:600}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:active{transform:scale(.97)}
.bigbtn{padding:14px 22px;font-size:17px;min-width:96px}
.bigbtn .lat{display:block;font-size:9px;color:var(--faint);letter-spacing:.08em;margin-top:2px}
#controls{display:flex;gap:10px;justify-content:center;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.g-good{border-color:var(--good)} .g-bad{border-color:var(--bad)} .g-skip{border-color:var(--faint);color:var(--dim)}
#breathc{width:170px;height:170px;border-radius:50%;border:2px solid var(--cool);
  transition:transform 4.6s cubic-bezier(.4,0,.6,1), border-color 4.6s;transform:scale(.62)}
#breathc.in{transform:scale(1);border-color:var(--warm)}
#tapzone{width:200px;height:200px;border-radius:50%;border:2px solid var(--warm);display:flex;
  align-items:center;justify-content:center;font-size:15px;color:var(--dim);flex-direction:column;gap:6px}
#tapzone.hit{background:#1e1a14}
.dots{display:flex;gap:8px;justify-content:center;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--faint);font-style:normal}
.dots i.on{background:var(--warm)}
.digits{display:flex;gap:12px;justify-content:center;direction:ltr;flex-wrap:wrap}
.digit{border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center}
.digit .d{font-size:26px}
.digit small{display:block;font-size:10px;color:var(--dim);direction:ltr}
.pair{display:flex;gap:26px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.pair>div{max-width:150px}
.dash{width:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:600;margin-bottom:8px;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--dim)}
.kv b{color:var(--ink);font-weight:500}
.exp{font-size:12px;color:var(--dim);line-height:1.5}
#bars{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:6px}
#bars .bar{flex:1;background:var(--faint);border-radius:2px 2px 0 0;min-height:2px}
#bars .bar.today{background:var(--warm)}
.footrow{display:flex;gap:10px;margin-top:4px}
.footrow button{flex:1;padding:10px;font-size:13px}
.pill{font-size:11px;color:var(--faint)}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:13px;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
input[type=file]{display:none}
.hearted{color:var(--bad)}
</style>
</head>

/* ============ utils ============ */
const $ = s => document.querySelector(s);
const now = () => Date.now();
const DAY = 864e5;
const dayKey = t => { const d = new Date(t - 4 * 36e5); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1800); };
const rnd = n => Math.floor(Math.random() * n);

/* ============ state ============ */
const SKEY = 'imun-state-v1';
let state;
function load() {
  try { state = JSON.parse(localStorage.getItem(SKEY)) || null; } catch (e) { state = null; }
  if (!state) state = { day0: now(), p: 61, sessions: [], loved: [] };
}
function save() { localStorage.setItem(SKEY, JSON.stringify(state)); }

/* ============ QR sound: rational ladder over prime p, timbre by Legendre chi ============ */
let ctx = null, master = null, musicIn = null, _conv = null, _comp = null;
function modpow(b, e, m) { let r = 1; b %= m; while (e > 0) { if (e & 1) r = r * b % m; b = b * b % m; e >>= 1; } return r; }
function chi(r, p) { if (r % p === 0) return 0; return modpow(r % p, (p - 1) / 2, p) === 1 ? 1 : -1; }
const F0 = 196; // G3
/* ==== the accepted sulam sound (v0.10 canon, 14.08): calm voices + the engine's
   n²-mod-p room. Digits stay bone-dry (measurement material); music gets the room. */
function qrRT60(p) {
  const s = Math.sqrt(Math.max(2, p | 0));
  const n = Math.min(1, Math.log2(s) / Math.log2(48));
  return 0.4 + n * (1.1 - 0.4);
}
function qrCompRelease(p) {
  const beat = 60 / 72;
  const n = Math.min(1, Math.sqrt(Math.max(2, p)) / 24);
  return Math.max(0.08, Math.min(0.5, beat * (0.18 + 0.5 * n)));
}
function buildQRImpulse(ac, p) { // engine verbatim: Schroeder n²-mod-p diffusor
  p = Math.max(2, p | 0);
  const SR = ac.sampleRate, rt = qrRT60(p), len = Math.max(1, Math.floor(rt * SR));
  const ir = ac.createBuffer(2, len, SR);
  const nCap = Math.min(p - 1, 9e7);
  const stride = Math.max(1, Math.floor(nCap / 8192));
  const lat = []; for (let n = 1; n <= nCap; n += stride) { lat.push(((n * n) % p) / p); }
  const uniq = Array.from(new Set(lat)).sort((a, b) => a - b);
  const early = Math.max(1, Math.floor(0.18 * SR));
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const x = i / len;
      const e = Math.pow(1 - x, x < 0.3 ? 2.2 : 3.1);
      const a = 0.62 - 0.56 * x;
      const w = (Math.random() * 2 - 1) * e * 0.28;
      lp += (w - lp) * Math.max(0.06, a);
      d[i] = lp;
    }
    for (let k = 0; k < uniq.length; k++) {
      const frac = (ch === 0) ? uniq[k] : (1 - uniq[k]);
      const pos = Math.floor(frac * early);
      if (pos > 0 && pos < len) { d[pos] += ((k & 1) ? -1 : 1) * 0.5 * Math.pow(1 - pos / len, 1.5); }
    }
  }
  return ir;
}
function audioInit() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination); // digits: dry
  const eIn = ctx.createGain(); eIn.gain.value = 0.57;
  const dry = ctx.createGain(); dry.gain.value = 0.82;
  const sum = ctx.createGain();
  eIn.connect(dry); dry.connect(sum);
  const snd = ctx.createGain(); snd.gain.value = 0.24;
  _conv = ctx.createConvolver(); _conv.normalize = true; _conv.buffer = buildQRImpulse(ctx, state.p);
  const wHP = ctx.createBiquadFilter(); wHP.type = 'highpass'; wHP.frequency.value = 150; wHP.Q.value = 0.5;
  const wLP = ctx.createBiquadFilter(); wLP.type = 'lowpass'; wLP.frequency.value = 5000; wLP.Q.value = 0.4;
  const wet = ctx.createGain(); wet.gain.value = 1.0;
  eIn.connect(snd); snd.connect(_conv); _conv.connect(wHP); wHP.connect(wLP); wLP.connect(wet); wet.connect(sum);
  const headroom = ctx.createGain(); headroom.gain.value = 0.55;
  const tame = ctx.createGain(); tame.gain.value = 0.9;
  _comp = ctx.createDynamicsCompressor();
  _comp.threshold.value = -10; _comp.knee.value = 12; _comp.ratio.value = 10;
  _comp.attack.value = 0.004; _comp.release.value = qrCompRelease(state.p);
  const eMaster = ctx.createGain(); eMaster.gain.value = 0.72;
  sum.connect(headroom); headroom.connect(tame); tame.connect(_comp); _comp.connect(eMaster); eMaster.connect(ctx.destination);
  musicIn = eIn;
}
function roomSetP(p) { // prime change rebuilds the room, as the engine does
  if (!ctx) return;
  try { _conv.buffer = buildQRImpulse(ctx, p); } catch (e) {}
  try { _comp.release.value = qrCompRelease(p); } catch (e) {}
}
let _waves = null;
function _mkWaves() {
  if (_waves) return _waves;
  const amps = [0, 1.0, 0.06, 0.40, 0.03, 0.20, 0.02, 0.09, 0.01, 0.04];
  const M = amps.length, r2 = new Float32Array(M), i2 = new Float32Array(M);
  for (let k = 1; k < M; k++) i2[k] = amps[k] * ((k & 1) ? 1 : -1);
  const wood = ctx.createPeriodicWave(r2, i2);
  const vr = new Float32Array(10), vi = new Float32Array(10);
  vi[1] = 1.0; vi[2] = 0.18; vi[4] = 0.35; vi[9] = 0.08;
  const vibe = ctx.createPeriodicWave(vr, vi);
  const fa = [0, 1.0, 0.16, 0.06, 0.025, 0.012];
  const fr = new Float32Array(6), fi = new Float32Array(6);
  for (let k = 1; k < 6; k++) fi[k] = fa[k] * ((k & 1) ? 1 : -1);
  const flute = ctx.createPeriodicWave(fr, fi);
  _waves = { wood, vibe, flute }; return _waves;
}
const _FORMANTS = {
  wood: [[1500, 3, 1.3], [2400, 2, 2.0], [3600, -5, 1.4]],
  flute: [[700, 2, 1.0], [2200, 1.5, 1.4]],
};
function _body(inst) {
  const spec = _FORMANTS[inst];
  if (!spec) { const gg = ctx.createGain(); return { head: gg, out: gg }; }
  let head = null, tail = null, boost = 0;
  spec.forEach(fgq => {
    const n = ctx.createBiquadFilter(); n.type = 'peaking';
    n.frequency.value = fgq[0]; n.gain.value = fgq[1]; n.Q.value = fgq[2];
    if (fgq[1] > 0) boost += fgq[1];
    if (tail) tail.connect(n); else head = n; tail = n;
  });
  const trim = ctx.createGain(); trim.gain.value = Math.pow(10, -Math.min(6, boost * 0.18) / 20);
  tail.connect(trim);
  return { head, out: trim };
}
// one calm tone: inst ∈ vibe|wood|flute, panned, through the engine room
function qrTone(t, r, vol, dur, inst, pan) {
  if (!ctx) return;
  const p = state.p, rr = ((r % p) + p) % p || 1;
  const f = F0 * (p + rr) / p;
  inst = inst || (chi(rr, p) >= 0 ? 'vibe' : 'wood');
  const d = dur || 0.5;
  const osc = ctx.createOscillator(); osc.setPeriodicWave(_mkWaves()[inst]); osc.frequency.value = f;
  const k2 = ((Math.round(f) % p) + p) % p || 1;
  osc.detune.value = (chi(k2, p) === 1 ? 1 : -1) * 2.5 * 0.5;
  const vv = inst === 'wood' ? vol * 0.72 : inst === 'flute' ? vol * 0.85 : vol * 0.9;
  const env = ctx.createGain();
  if (inst === 'vibe') {
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vv, t + 0.010);
    env.gain.exponentialRampToValueAtTime(Math.max(1e-4, vv * 0.22), t + d);
    env.gain.exponentialRampToValueAtTime(1e-4, t + d + 0.12);
  } else {
    const a = Math.min(0.6, Math.max(0.10, d * 0.16));
    const rl = Math.min(0.9, Math.max(0.16, d * 0.18));
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vv, t + a);
    env.gain.setValueAtTime(vv, t + Math.max(a + 0.001, d - rl));
    env.gain.exponentialRampToValueAtTime(1e-4, t + d);
  }
  env.gain.setValueAtTime(0, t + d + 0.15);
  const body = _body(inst);
  if (inst === 'wood') {
    const soft = ctx.createBiquadFilter(); soft.type = 'lowpass';
    soft.frequency.value = Math.min(4200, f * 5); soft.Q.value = 0.5;
    osc.connect(soft); soft.connect(body.head);
  } else {
    osc.connect(body.head);
  }
  let sink = musicIn;
  try { const pn = ctx.createStereoPanner(); pn.pan.value = pan || 0; pn.connect(sink); sink = pn; } catch (e) {}
  body.out.connect(env); env.connect(sink);
  osc.start(t); osc.stop(t + d + 0.2);
}
/* clips go through WebAudio buffers, NOT <audio>: Safari blocks HTMLAudio.play()
   outside a direct tap, but a running AudioContext plays buffers freely */
const bufCache = {};
function b64buf(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
function getBuf(key, cb) {
  if (bufCache[key]) { cb(bufCache[key]); return; }
  const b64 = AUDIO[key]; if (!b64 || !ctx) { cb(null); return; }
  ctx.decodeAudioData(b64buf(b64), buf => { bufCache[key] = buf; cb(buf); }, () => cb(null));
}
function playClip(key, onend) {
  getBuf(key, buf => {
    if (!buf) { if (onend) setTimeout(onend, 700); return; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(master);
    if (onend) src.onended = onend;
    src.start();
  });
}

/* ============ flow ============ */
const stage = $('#stage'), controls = $('#controls');
let view = 'flow', block = -1, session = null, cleanup = null;
function stopBlock() { if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; } }
function setTabs() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === view));
  const days = [...new Set(state.sessions.map(s => s.d))].sort(); let streak = 0;
  for (let i = days.length - 1; i >= 0; i--) { if (i === days.length - 1 || (new Date(days[i + 1]) - new Date(days[i])) <= DAY * 1.5) streak++; else break; }
  $('#streak').textContent = streak > 1 ? '≡ ' + streak + 'd' : '';
}
function render() { stopBlock(); setTabs(); controls.innerHTML = ''; stage.innerHTML = '';
  if (view === 'dash') return renderDash();
  if (block < 0) return renderStart();
  [blockBreath, blockPulse, blockNumbers, blockImagery, renderSummary][block]();
}
function btn(heb, lat, cls, fn) {
  const b = document.createElement('button'); b.className = 'bigbtn ' + (cls || '');
  b.innerHTML = heb + `<span class="lat">${lat}</span>`; b.onclick = fn; return b;
}
function skipBtn() { return btn('דַּלֵּג', 'dalég · skip', 'g-skip', next); }
function next() { block++; render(); }
function dots(k) { return `<div class="dots">${[0,1,2,3].map(i => `<i class="${i === k ? 'on' : ''}"></i>`).join('')}</div>`; }

function renderStart() {
  stage.innerHTML = `<div class="center">
    <div class="he" style="font-size:34px">אִמּוּן</div>
    <div class="meta">four blocks · ~10 min · sound on<br>
    breath → pulse of ${state.p} → numbers backward → imagery<br>
    difficulty lives inside the material — trends over weeks, not miracles</div></div>`;
  controls.appendChild(btn('הַתְחֵל', "hatchél · begin", 'g-good', () => {
    audioInit(); ctx.resume();
    session = { d: dayKey(now()), t: now() };
    block = 0; render();
  }));
}

/* ---- block 1: breath, 6/min, chi-order: rise on inhale ---- */
function blockBreath() {
  // 4 s in / 6 s out per evidence doc (rate is the active ingredient; long exhale aids relaxation)
  const CYCLES = 12; let c = 0, inhale = false, tm = null;
  stage.innerHTML = `<div class="center">${dots(0)}
    <div class="meta">נְשִׁימָה · neshimá — breathe with the circle · in 4 s, out 6 s<br>slow and light · seated · stop if dizzy</div>
    <div id="breathc"></div><div class="meta" id="bc"></div></div>`;
  controls.appendChild(skipBtn());
  const el = $('#breathc'), bc = $('#bc');
  const QRs = []; for (let r = 1; r < state.p; r++) if (chi(r, state.p) === 1) QRs.push(r);
  const tick = () => {
    inhale = !inhale;
    if (inhale) { c++; if (c > CYCLES) { session.breath = CYCLES; next(); return; } bc.textContent = c + ' / ' + CYCLES; }
    el.style.transitionDuration = (inhale ? 3.6 : 5.6) + 's';
    el.classList.toggle('in', inhale);
    const t = ctx.currentTime + 0.03;
    qrTone(t, inhale ? QRs[c % QRs.length] : 1, 0.16, inhale ? 2.0 : 2.8, 'flute', 0); // breath floats
    tm = setTimeout(tick, inhale ? 4000 : 6000);
  };
  tick();
  cleanup = () => clearTimeout(tm);
}

/* ---- block 2: pulse — tap the QR ladder beat ---- */
function blockPulse() {
  const BPM = 72, IV = 60 / BPM, COUNT_IN = 8, MEASURED = 32;
  let beats = [], taps = [], beatN = 0, r = 1, running = true;
  stage.innerHTML = `<div class="center">${dots(1)}
    <div class="meta">דֹּפֶק · dófek — tap the circle (or Space) on every beat · p = ${state.p}</div>
    <div id="tapzone"><span id="tz1">listen…</span><span class="pill" id="tz2">8 beats count-in</span></div>
    <div class="meta" id="pc"></div></div>`;
  controls.appendChild(skipBtn());
  const zone = $('#tapzone'), tz1 = $('#tz1'), pc = $('#pc');
  const t0 = ctx.currentTime + 0.4;
  const schedule = () => {
    if (!running) return;
    while (beatN < COUNT_IN + MEASURED && t0 + beatN * IV < ctx.currentTime + 0.3) {
      const bt = t0 + beatN * IV;
      // beat = struck bell (crisp onset for the tap measure); χ shows as the stereo mirror
      qrTone(bt, r, beatN < COUNT_IN ? 0.18 : 0.30, 0.35, 'vibe', chi(((r % state.p) + state.p) % state.p || 1, state.p) >= 0 ? -0.3 : 0.3);
      if (beatN >= COUNT_IN) beats.push(bt);
      r = (r % (state.p - 1)) + 1; beatN++;
    }
    if (beatN >= COUNT_IN + MEASURED && ctx.currentTime > t0 + beatN * IV + 0.4) { finishPulse(); return; }
  };
  const iv = setInterval(schedule, 90); schedule();
  const onTap = e => {
    if (e && e.code && e.code !== 'Space') return;
    if (e) e.preventDefault();
    if (!running) return;
    taps.push(ctx.currentTime);
    zone.classList.add('hit'); setTimeout(() => zone.classList.remove('hit'), 90);
    const measured = taps.filter(t => t >= t0 + COUNT_IN * IV - IV / 2).length;
    tz1.textContent = measured + ' / ' + MEASURED;
    $('#tz2').textContent = 'tap on the beat';
  };
  zone.addEventListener('pointerdown', () => onTap());
  document.addEventListener('keydown', onTap);
  function finishPulse() {
    running = false;
    const offs = [];
    taps.forEach(tp => {
      let best = null, bo = 1e9;
      beats.forEach(bt => { const o = (tp - bt) * 1000; if (Math.abs(o) < Math.abs(bo)) { bo = o; best = bt; } });
      if (best !== null && Math.abs(bo) <= IV * 500) offs.push(bo);
    });
    if (offs.length >= 8) {
      const mean = offs.reduce((a, b) => a + b, 0) / offs.length;
      const sd = Math.sqrt(offs.map(o => (o - mean) ** 2).reduce((a, b) => a + b, 0) / offs.length);
      session.tapMean = Math.round(mean); session.tapSd = Math.round(sd); session.tapN = offs.length;
      pc.textContent = `mean ${Math.round(mean)} ms · spread ±${Math.round(sd)} ms · ${offs.length} taps`;
    } else pc.textContent = 'too few taps to measure';
    setTimeout(next, 1600);
  }
  cleanup = () => { running = false; clearInterval(iv); document.removeEventListener('keydown', onTap); };
}

/* ---- block 3: numbers backward (adaptive span, silence under encoding) ---- */
function blockNumbers() {
  const TRIALS = 8; let trial = 0, span = 3, streakOk = 0, best = 0, sum = 0, asked = false, wd = null;
  stage.innerHTML = `<div class="center">${dots(2)}
    <div class="meta">מִסְפָּרִים · misparím — hear the chain, say it BACKWARD aloud, then check</div>
    <div id="numarea" class="center" style="flex:0;gap:14px"></div></div>`;
  const area = $('#numarea');
  let seq = [];
  function trialStart() {
    if (trial >= TRIALS) { session.span = best; session.spanAvg = +(sum / TRIALS).toFixed(1); next(); return; }
    trial++;
    seq = []; while (seq.length < span) { const d = rnd(10); if (seq[seq.length - 1] !== d) seq.push(d); }
    area.innerHTML = `<div class="meta">trial ${trial}/${TRIALS} · span ${span}</div><div class="bignum" id="np">🔊</div>`;
    controls.innerHTML = '';
    let i = 0; asked = false;
    clearTimeout(wd); wd = setTimeout(askRecall, span * 1500 + 4000); // never hang on a blocked clip
    const playNext = () => {
      if (asked) return;
      if (i >= seq.length) { askRecall(); return; }
      playClip('d' + seq[i], () => setTimeout(playNext, 260)); i++;
    };
    setTimeout(playNext, 500);
  }
  function askRecall() {
    if (asked) return; asked = true; clearTimeout(wd);
    area.innerHTML = `<div class="meta">trial ${trial}/${TRIALS} · span ${span}</div>
      <div class="gloss">say it backward — aloud</div>`;
    controls.innerHTML = '';
    controls.appendChild(btn('הַרְאֵה', "har'é · reveal", '', revealSeq));
  }
  function revealSeq() {
    const rev = [...seq].reverse();
    area.innerHTML = `<div class="meta">backward:</div>
      <div class="digits">${rev.map(d => `<span class="digit"><span class="d">${d}</span><small>${DIGITS[d].tr}</small></span>`).join('')}</div>`;
    controls.innerHTML = '';
    controls.appendChild(btn('טָעִיתִי', 'ta\'íti · missed', 'g-bad', () => grade(false)));
    controls.appendChild(btn('נָכוֹן', 'nachón · correct', 'g-good', () => grade(true)));
  }
  function grade(ok) {
    sum += ok ? span : span - 1;
    if (ok) { best = Math.max(best, span); streakOk++; if (streakOk >= 2) { span++; streakOk = 0; } qrTone(ctx.currentTime, 1, 0.2, 0.6, 'vibe', 0); }
    else { span = Math.max(2, span - 1); streakOk = 0; qrTone(ctx.currentTime, 2, 0.16, 0.8, 'wood', 0); }
    trialStart();
  }
  trialStart();
  cleanup = () => clearTimeout(wd);
}

/* ---- block 4: imagery — two words, one bridge, spoken aloud ---- */
function blockImagery() {
  const ROUNDS = 3, SECS = 40; let round = 0, iv = null;
  stage.innerHTML = `<div class="center">${dots(3)}
    <div class="meta">דִּמְיוֹן · dimyón — say aloud one image that joins the two · any language</div>
    <div id="imarea" class="center" style="flex:0;gap:14px"></div><div class="meta" id="imt"></div></div>`;
  const area = $('#imarea'), imt = $('#imt');
  let a, b;
  function roundStart() {
    clearInterval(iv);
    if (round >= ROUNDS) { session.imagery = ROUNDS; next(); return; }
    round++;
    a = POOL[rnd(POOL.length)]; do { b = POOL[rnd(POOL.length)]; } while (b === a);
    qrTone(ctx.currentTime, 4, 0.16, 1.4, 'flute', 0);
    area.innerHTML = `<div class="meta">${round} / ${ROUNDS}</div><div class="pair">
      <div><div class="he" style="font-size:30px">${a.he}</div><div class="translit">${a.tr}</div><div class="gloss">${a.en}</div></div>
      <div><div class="he" style="font-size:30px">${b.he}</div><div class="translit">${b.tr}</div><div class="gloss">${b.en}</div></div></div>`;
    controls.innerHTML = '';
    const hb = btn('♥', 'keep this pair', '', () => { state.loved.push({ a: a.he, b: b.he, d: dayKey(now()) }); save(); hb.classList.add('hearted'); toast('kept'); });
    controls.appendChild(hb);
    controls.appendChild(btn('הָלְאָה', "hál'a · onward", 'g-good', roundStart));
    let left = SECS; imt.textContent = left + 's';
    iv = setInterval(() => { left--; imt.textContent = left > 0 ? left + 's' : 'onward when ready'; if (left <= 0) clearInterval(iv); }, 1000);
  }
  roundStart();
  cleanup = () => clearInterval(iv);
}

/* ---- summary ---- */
function renderSummary() {
  state.sessions.push(session); save();
  const s = session;
  stage.innerHTML = `<div class="center">
    <div class="he" style="font-size:30px">כָּל הַכָּבוֹד</div>
    <div class="meta">kol hakavód — session saved</div>
    <div class="gloss">${s.tapSd != null ? `pulse ±${s.tapSd} ms` : 'pulse —'} · span ${s.span || '—'} · ${s.imagery || 0} images</div>
    <div class="meta">now open zov — the mind is warm</div></div>`;
  controls.appendChild(btn('מַדָּדִים', 'gauges', '', () => { view = 'dash'; block = -1; render(); }));
  controls.appendChild(btn('סִיּוּם', 'siyúm · done', 'g-good', () => { block = -1; render(); }));
}

/* ---- gauges ---- */
function renderDash() {
  const ss = state.sessions;
  const last = ss[ss.length - 1];
  const l14 = ss.slice(-14);
  const maxSd = Math.max(30, ...l14.map(s => s.tapSd || 0));
  const sdBars = l14.map((s, i) => `<div class="bar${i === l14.length - 1 ? ' today' : ''}" style="height:${s.tapSd ? Math.round(52 * s.tapSd / maxSd) : 2}px" title="±${s.tapSd || '—'}ms"></div>`).join('');
  const maxSp = Math.max(4, ...l14.map(s => s.span || 0));
  const spBars = l14.map((s, i) => `<div class="bar${i === l14.length - 1 ? ' today' : ''}" style="height:${s.span ? Math.round(52 * s.span / maxSp) : 2}px" title="${s.span || '—'}"></div>`).join('');
  const day0d = Math.floor((now() - state.day0) / DAY);
  stage.innerHTML = `<div class="dash">
    <div class="card"><h3>last session</h3>
      <div class="kv"><span>pulse precision (±ms, lower = tighter)</span><b>${last && last.tapSd != null ? '±' + last.tapSd : '—'}</b></div>
      <div class="kv"><span>backward span (best)</span><b>${last && last.span || '—'}</b></div>
      <div class="kv"><span>sessions total · day ${day0d}</span><b>${ss.length}</b></div></div>
    <div class="card"><h3>pulse spread · last 14</h3><div id="bars">${sdBars}</div>
      <div class="exp">the ensemble gauge — beat-lock with dancers and Markova needs exactly this. Watch the trend, not the day. Musician home range: ±25–42 ms; over 85 ms reads as fatigue, not verdict.</div></div>
    <div class="card"><h3>backward span · last 14</h3><div id="bars">${spBars}</div>
      <div class="exp">Hebrew numbers under load — retrograde as depth of encoding. Span 5–6 is strong.</div></div>
    <div class="card"><h3>♥ kept pairs</h3>
      <div class="exp" style="direction:rtl">${state.loved.slice(-8).map(l => `${l.a} ↔ ${l.b}`).join(' · ') || '<span style="direction:ltr">none yet — ♥ in the imagery block</span>'}</div></div>
    <div class="card"><h3>settings · export</h3>
      <div class="kv"><span>prime of the pulse</span><b><button style="padding:2px 10px" onclick="cycleP()">${state.p}</button></b></div>
      <div class="footrow">
        <button onclick="exportJSON()">⇩ log</button>
        <button onclick="document.getElementById('imp').click()">⇪ import</button>
      </div>
      <input type="file" id="imp" accept=".json" onchange="importJSON(this)">
      <div class="pill" style="margin-top:8px">honest note: trained gains are in the material itself — these gauges track your grip, they don't promise transfer</div></div>
  </div>`;
}
function cycleP() { const ps = [61, 109, 137]; state.p = ps[(ps.indexOf(state.p) + 1) % ps.length]; save(); roomSetP(state.p); renderDash(); }
function exportJSON() {
  const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), state }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'imun-' + dayKey(now()) + '.json'; a.click();
}
function importJSON(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(txt => { const d = JSON.parse(txt);
    if (d.state && d.state.sessions) { state = d.state; save(); render(); toast('restored'); }
    else toast('not an imun log'); }).catch(() => toast('unreadable file'));
}

/* ============ boot ============ */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { view = t.dataset.v; if (view === 'flow') block = -1; render(); });
load(); render();
window.cycleP = cycleP; window.exportJSON = exportJSON; window.importJSON = importJSON;
