<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>שמיעה · shmia</title>
<style>
:root{
  --bg:#0f1211; --panel:#171b19; --ink:#e6e8e4; --dim:#8a928c; --faint:#4a524c;
  --gold:#c9a44c; --good:#7dc47d; --bad:#c4707d; --cool:#6aa5c8; --line:#252b27;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,sans-serif;
  display:flex;flex-direction:column;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;align-items:baseline;gap:12px;padding:14px 16px 8px}
#top h1{font-size:16px;font-weight:600;color:var(--dim)}
#top .sub{font-size:11px;color:var(--faint)}
#tabs{display:flex;gap:6px;padding:0 12px 10px}
.tab{flex:1;text-align:center;padding:9px 4px 7px;border:1px solid var(--line);border-radius:10px;color:var(--dim);cursor:pointer}
.tab .heb{font-size:15px;display:block}
.tab .lat{font-size:9px;color:var(--faint);letter-spacing:.08em}
.tab.on{color:var(--ink);border-color:var(--gold);background:var(--panel)}
#stage{flex:1;overflow-y:auto;padding:6px 16px 24px;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}
.meta{font-size:12px;color:var(--faint);max-width:340px;line-height:1.5}
.bigheb{font-size:30px;direction:rtl}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer}
button:active{transform:scale(.97)}
.bigbtn{padding:14px 22px;font-size:16px;min-width:110px}
.bigbtn .lat{display:block;font-size:9px;color:var(--faint);letter-spacing:.08em;margin-top:2px}
.bigbtn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.choice{padding:14px 10px;font-size:15px;min-width:130px}
.choice .lat{display:block;font-size:10px;color:var(--faint);margin-top:2px}
#controls{display:flex;gap:10px;justify-content:center;padding:10px 16px calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap}
.prog{font-size:11px;color:var(--faint);letter-spacing:.06em}
.dash{width:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:600;margin-bottom:8px;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--dim)}
.kv b{color:var(--ink);font-weight:500}
.footrow{display:flex;gap:10px;margin-top:4px}
.footrow button{flex:1;padding:10px;font-size:13px}
.pill{font-size:11px;color:var(--faint);line-height:1.5}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:13px;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
input[type=file]{display:none}
.fb-ok{color:var(--good)} .fb-no{color:var(--bad)}
</style>
</head>

const $ = s => document.querySelector(s);
const now = () => Date.now();
const dayKey = t => { const d = new Date(t - 4 * 36e5); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 1800); };

const SKEY = 'shmia-state-v1', LKEY = 'shmia-log-v1';
let state, log = [];
function load() {
  try { state = JSON.parse(localStorage.getItem(SKEY)) || null; } catch (e) { state = null; }
  if (!state) state = { day0: now(), thresholds: [] }; // thresholds: {date, block, value}
  try { log = JSON.parse(localStorage.getItem(LKEY)) || []; } catch (e) { log = []; }
}
function save() { localStorage.setItem(SKEY, JSON.stringify(state)); localStorage.setItem(LKEY, JSON.stringify(log)); }

/* ============ audio: dry, exact ============ */
let ctx = null, master = null;
const P = 61, F0 = 196;
function modpow(b, e, m) { let r = 1; b %= m; while (e > 0) { if (e & 1) r = r * b % m; b = b * b % m; e >>= 1; } return r; }
function chi(r, p) { if (r % p === 0) return 0; return modpow(r % p, (p - 1) / 2, p) === 1 ? 1 : -1; }
const QRs = [1, 12, 15, 20, 41, 49], NQRs = [8, 31, 37, 51];
function audioInit() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
}
function tone(t, f, dur, vol, pan) {
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.setValueAtTime(vol, t + dur - 0.03);
  g.gain.linearRampToValueAtTime(0, t + dur);
  const pn = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  o.connect(g);
  if (pn) { pn.pan.value = pan || 0; g.connect(pn); pn.connect(master); } else g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
// chi-sequence noise burst: the engine's arithmetic friction as broadband material
function chiNoise(t, dur, vol, gapAt, gapMs) {
  const n = Math.floor(dur * ctx.sampleRate);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let x = 2;
  for (let i = 0; i < n; i++) {
    x = (x + 1) % P || 1;
    const c = chi((x * x + i) % P || 1, P);
    d[i] = (Math.random() * 2 - 1) * 0.6 + c * 0.4 * (Math.random());
  }
  if (gapAt > 0) {
    const g0 = Math.floor(gapAt * ctx.sampleRate), g1 = Math.min(n, g0 + Math.floor(gapMs / 1000 * ctx.sampleRate));
    const rmp = Math.floor(0.001 * ctx.sampleRate);
    for (let i = g0; i < g1; i++) d[i] = 0;
    for (let i = 0; i < rmp; i++) {
      if (g0 - i > 0) d[g0 - i] *= i / rmp;
      if (g1 + i < n) d[g1 + i] *= i / rmp;
    }
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.setValueAtTime(vol, t + dur - 0.01); g.gain.linearRampToValueAtTime(0, t + dur);
  src.connect(g); g.connect(master);
  src.start(t);
}
// decoded clip cache (Safari lesson: buffers, never HTMLAudio on timers)
const bufCache = {};
function b64buf(b64) {
  const bin = atob(b64), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a.buffer;
}
function getBuf(key, b64) {
  if (bufCache[key]) return Promise.resolve(bufCache[key]);
  return ctx.decodeAudioData(b64buf(b64)).then(b => (bufCache[key] = b));
}

/* ============ staircases ============ */
// generic: dir -1 = smaller-is-harder (dv%, gap ms, level gap), +1 = SNR (smaller/negative harder)
function makeStair(start, stepFactorOrDb, min, max, isDb) {
  return { v: start, ok: 0, rev: [], lastDir: 0, done: false,
    stepF: stepFactorOrDb, min, max, isDb, trials: 0 };
}
function stairStep(st, correct, rule) { // rule: 3 = 3-down-1-up (79.4%), 2 = 2-down-1-up... we use 3 and (1-up-2-down for SNR = rule 2)
  st.trials++;
  let dir = 0;
  // FAST DESCENT (27.08): until the first miss the ladder is above threshold by
  // construction, and demanding three corrects per step there is paying triple
  // for information that costs one. On 27.08 three of the four ladders spent the
  // whole 26-trial block descending from a high start — 96% correct, two
  // reversals, and NO NUMBER stored, three times over. One correct = one step
  // down until the first miss; the textbook rule takes over from there.
  if (correct) {
    st.ok++;
    // (28.08) the fast phase demands TWO in a row, not one: on 2AFC a single
    // correct is a coin flip half the time, and the 28.08 session rode lucky
    // guesses straight to the 0.15% floor, then spent the block climbing back —
    // 27 trials, 3 reversals, null. Two-in-a-row cuts the guess-overshoot to a
    // quarter per step and still descends twice as fast as the textbook rule.
    if (st.noMissYet !== false) { if (st.ok >= 2) { st.ok = 0; dir = -1; } }
    else if (st.ok >= rule) { st.ok = 0; dir = -1; }
  }
  else { st.ok = 0; dir = +1; st.noMissYet = false; }
  if (dir !== 0) {
    if (st.lastDir && dir !== st.lastDir) st.rev.push(st.v);
    st.lastDir = dir;
    const coarse = st.rev.length < 2;
    if (st.isDb) { const step = coarse ? st.stepF * 2 : st.stepF; st.v += dir * step; }
    else { const f = coarse ? st.stepF : Math.sqrt(st.stepF); st.v = dir < 0 ? st.v / f : st.v * f; }
    st.v = Math.min(st.max, Math.max(st.min, st.v));

}
function stairThreshold(st) {
  const r = st.rev.slice(-6);

  // nothing rather than the average of whatever happened at the top.
  if (st.rev.length < 4) return null;
  if (!r.length) return st.v;
  if (st.isDb) return Math.round(r.reduce((a, b) => a + b, 0) / r.length * 10) / 10;
  return Math.round(Math.exp(r.reduce((a, b) => a + Math.log(b), 0) / r.length) * 100) / 100;
}

/* ============ ears: interaural balance ============ */
// A browser cannot know the SPL in the AirPods, so an absolute threshold in dB HL
// is not measurable here. The DIFFERENCE between the ears is: same hardware, same
// output, only the channel changes. This is the classical alternate-binaural
// loudness balance, and it is the only thing in this app that can see one ear
// sagging — every other block is diotic and therefore tracks the better ear.
const EAR_FREQS = [500, 1000, 2000, 4000, 6000, 8000];
function earTone(t, f, dur, vol, side) {           // side -1 = left, +1 = right
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.03);
  g.gain.setValueAtTime(vol, t + dur - 0.04);
  g.gain.linearRampToValueAtTime(0, t + dur);
  const m = ctx.createChannelMerger(2);
  const sil = ctx.createGain(); sil.gain.value = 0;
  o.connect(g);
  g.connect(m, 0, side < 0 ? 0 : 1);              // hard to one ear, silence in the other
  sil.connect(m, 0, side < 0 ? 1 : 0);

}
function makeEarStair() {

}

  if (st.lastDir && dir !== st.lastDir) st.rev.push(st.d);
  st.lastDir = dir;
  st.step = st.rev.length < 2 ? 6 : 2;
  st.d = Math.max(-30, Math.min(30, st.d + dir * st.step));

}

  const r = st.rev.slice(-4);

  return Math.round(r.reduce((a, b) => a + b, 0) / r.length * 10) / 10;

/* ============ session flow ============ */
const BLOCKS = [
  { key: 'hevdel', he: 'הֶבְדֵּל', lat: 'hevdél · pitch difference', unit: '%',
    intro: 'Two tones. Which one is HIGHER - the first or the second?' },
  { key: 'revach', he: 'רֶוַח', lat: 'révach · the gap', unit: 'ms',
    intro: 'Two noise breaths. One has a tiny SILENT GAP inside. Which one?' },
  { key: 'kolot', he: 'שְׁנֵי קוֹלוֹת', lat: 'shnei kolót · two voices', unit: 'dB gap',
    intro: 'Two voices at once. Follow the HIGH voice: did it end UP or DOWN?' },
  { key: 'ivrit', he: 'עִבְרִית בְּרַעַשׁ', lat: 'ivrít bara\'ash · Hebrew in noise', unit: 'dB SNR',

  { key: 'oznayim', he: 'אָזְנַיִם', lat: 'oznáyim · the two ears', unit: 'dB L−R',
    intro: 'One tone, right ear then left. Which side sounded LOUDER? Six pitches. '

let view = 'flow', bi = -1, stair = null, trial = null, babbleBuf = null, ears = null;

// Start each ladder just above where it landed last time. On 16.08 the first

const APP_VER = '0.1.6';   // (28.08) every stored number carries the build that made it:
                           // on 27.08 a session ran on a stale build and nobody could tell
                           // from the export — that ambiguity is now impossible
const RAIL_TOP = { hevdel: 30, revach: 120, kolot: 18, ivrit: 18 };
function lastThreshold(key) {
  for (let i = state.thresholds.length - 1; i >= 0; i--) {
    const t = state.thresholds[i];

    // a value ON the clamp is the rail, not the ear. The phone carried

function startBlock(i) {

  if (b.key === 'revach') stair = makeStair(L ? Math.min(120, L * 4) : 24, 2, 1, 120, false);
  if (b.key === 'kolot') { stair = makeStair(L != null ? Math.min(18, L + 12) : 6, 2, -26, 18, true); stair.stepF = 2; }
  if (b.key === 'ivrit') stair = makeStair(L != null ? Math.min(18, L + 8) : 6, 2, -18, 18, true);

function nextTrial() {

  } else if (stair.done) { finishBlock(); return; }

    const f = F0 * (P + r) / P;
    const hi = Math.random() < 0.5 ? 1 : 2;
    const f2 = f * (1 + stair.v / 100);

    tone(t0 + 0.75, hi === 2 ? f2 : f, 0.5, 0.22, 0);

    chiNoise(t0 + 0.9, 0.6, 0.2, which === 2 ? 0.25 : 0, stair.v);
    trial.correct = which;
    renderTrial(['רִאשׁוֹן|rishón · first|1', 'שֵׁנִי|shení · second|2'], 'which one had the gap?');

    const up = Math.random() < 0.5;
    const hiSeq = up ? [15, 20, 41, 49] : [49, 41, 20, 15];
    const loSeq = [8, 31, 37, 51].sort(() => Math.random() - 0.5);

    while (foils.length < 3) { const f = foilsPool[Math.floor(Math.random() * foilsPool.length)]; if (!foils.includes(f)) foils.push(f); }

    // rail — hard clipping into a 0.9 master exactly where a big imbalance

    // worst case is 0.79: clean at every reachable d, and the measured
    // quantity — the relative L−R difference — is unchanged to the decibel.

// A trial lost to a phone call is not a trial. On 16.08 two such lapses at the

function lapse() {

  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    navigator.share({ files: [f], title: 'shmia log' }).catch(() => {});
  } else exportJSON();
}
function importJSON(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(txt => { const d = JSON.parse(txt);
    if (d.state && d.state.thresholds) { state = d.state; log = d.log || []; save(); render(); toast('restored'); }
    else toast('not a shmia log'); }).catch(() => toast('unreadable file'));
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => { view = t.dataset.v; render(); });
load(); render();
window.answer = answer; window.lapse = lapse; window.startBlock = startBlock; window.beginSession = beginSession; window.setDevice = setDevice;
window.exportJSON = exportJSON; window.shareJSON = shareJSON; window.importJSON = importJSON;
window.render = render;
</script>
