<script id="data" type="application/json">[{"n":1,"he":["אַשְֽׁרֵי־הָאִישׁ אֲשֶׁר לֹא הָלַךְ בַּעֲצַת רְשָׁעִים וּבְדֶרֶךְ חַטָּאִים לֹא עָמָד וּבְמוֹשַׁב לֵצִים לֹא יָשָֽׁב׃","כִּי אִם־בְּתוֹרַת יְהֹוָה חֶפְצוֹ וּֽבְתוֹרָתוֹ יֶהְגֶּה יוֹמָם וָלָֽיְלָה׃","וְֽהָיָה כְּעֵץ שָׁתוּל עַֽל־פַּלְגֵי־מָיִם אֲשֶׁר פִּרְיוֹ יִתֵּן בְּעִתּוֹ וְעָלֵהוּ לֹֽא־יִבּוֹל וְכֹל אֲשֶׁר־יַעֲשֶׂה יַצְלִֽיחַ׃","לֹא־כֵן הָרְשָׁעִים כִּי אִם־כַּמֹּץ אֲֽשֶׁר־תִּדְּפֶנּוּ רֽוּחַ׃","עַל־כֵּן לֹא־יָקֻמוּ רְשָׁעִים בַּמִּשְׁפָּט וְחַטָּאִים בַּעֲדַת צַדִּיקִֽים׃","כִּֽי־יוֹדֵעַ יְהֹוָה דֶּרֶךְ צַדִּיקִים וְדֶרֶךְ רְשָׁעִים תֹּאבֵֽד׃ {פ}"],"lat":["ashrei-ha'ish asher lo halakh ba'atsat resha'im uvderekh chata'im lo amad uvmoshav letsim lo yashav","ki im-betorat Adonai cheftso uvtorato yehge yomam valayla","vehaya ke'ets shatul al-palgei-mayim asher piryo yiten be'ito ve'alehu lo-yibol vekhol asher-ya'ase yatsliach","lo-khen harsha'im ki im-kamots asher-tidfenu ruach","al-ken lo-yakumu resha'im bamishpat vechata'im ba'adat tsadikim","ki-yodea' Adonai derekh tsadikim vederekh resha'im toved f"],"en":["HAPPY IS the man that hath not walked in the counsel of the wicked, Nor stood in the way of sinners, nor sat in the seat of the scornful.","But his delight is in the law of the LORD; and in His law doth he meditate day and night.","And he shall be like a tree planted by streams of water, that bringeth forth its fruit in its season, and whose leaf doth not wither; and in whatsoever he doeth he shall prosper.","Not so the wicked; but they are like the chaff which the wind driveth away.","Therefore the wicked shall not stand in the judgment, nor sinners in the congregation of the righteous.","For the LORD regardeth the way of the righteous; but the way of the wicked shall perish."]},{"n":2,"he":["לָמָּה רָגְשׁוּ גוֹיִם וּלְאֻמִּים יֶהְגּוּ־רִֽיק׃","יִתְיַצְּבוּ מַלְכֵי־אֶרֶץ וְרוֹזְנִים נֽוֹסְדוּ־יָחַד עַל־יְהֹוָה וְעַל־מְשִׁיחֽוֹ׃","נְֽנַתְּקָה אֶת־מֽוֹסְרוֹתֵימוֹ וְנַשְׁלִיכָה מִמֶּנּוּ עֲבֹתֵֽימוֹ׃","יוֹשֵׁב בַּשָּׁמַיִם יִשְׂחָק אֲדֹנָי יִלְעַג־לָֽמוֹ׃","אָז יְדַבֵּר אֵלֵימוֹ בְאַפּוֹ וּֽבַחֲרוֹנוֹ יְבַהֲלֵֽמוֹ׃","וַאֲנִי נָסַכְתִּי מַלְכִּי עַל־צִיּוֹן הַר־קׇדְשִֽׁי׃","אֲסַפְּרָה אֶֽל־חֹק יְֽהֹוָה אָמַר־אֵלַי בְּנִי אַתָּה אֲנִי הַיּוֹם יְלִדְתִּֽיךָ׃","שְׁאַל מִמֶּנִּי וְאֶתְּנָה גוֹיִם נַחֲלָתֶךָ וַאֲחֻזָּתְךָ אַפְסֵי־אָֽרֶץ׃","תְּרֹעֵם בְּשֵׁבֶט בַּרְזֶל כִּכְלִי יוֹצֵר תְּנַפְּצֵֽם׃","וְעַתָּה מְלָכִים הַשְׂכִּילוּ הִוָּסְרוּ שֹׁפְטֵי אָֽרֶץ׃","עִבְדוּ אֶת־יְהֹוָה בְּיִרְאָה וְגִילוּ בִּרְעָדָֽה׃","נַשְּׁקוּ־בַר פֶּן־יֶאֱנַף וְתֹאבְדוּ דֶרֶךְ כִּֽי־יִבְעַר כִּמְעַט אַפּוֹ אַשְׁרֵי כׇּל־חוֹסֵי בֽוֹ׃ {פ}"],"lat":["lama ragshu goyim ul'umim yehgu-rik","yityatsvu malkhei-erets veroznim nosdu-yachad al-Adonai ve'al-meshicho","nenatka et-mosroteimo venashlikha mimenu avoteimo","yoshev bashamayim yischak adonai yil'ag-lamo","az yedaber eleimo ve'apo uvacharono yevahalemo","va'ani nasakhti malki al-tsiyon har-kodshi","asapra el-chok Adonai amar-elai beni ata ani hayom yelidtikha","she'al mimeni ve'etna goyim nachalatekha va'achuzatkha afsei-arets","tero'em beshevet barzel kikhli yotser tenaptsem","ve'ata melakhim haskilu hivasru shoftei arets","ivdu et-Adonai beyir'a vegilu bir'ada","nashku-var pen-ye'enaf vetovdu derekh ki-yiv'ar kim'at apo ashrei kol-chosei vo f"],"en":["Why are the nations in an uproar? And why do the peoples mutter in vain?","The kings of the earth stand up, And the rulers take counsel together, Against the LORD, and against His anointed:","'Let us break their bands asunder, and cast away their cords from us.'","He that sitteth in heaven laugheth, the Lord hath them in derision.","Then will He speak unto them in His wrath, and affright them in His sore displeasure:","'Truly it is I that have established My king upon Zion, My holy mountain.'","I will tell of the decree: The LORD said unto me: 'Thou art My son, this day have I begotten thee.","Ask of Me, and I will give the nations for thine inheritance, and the ends of the earth for thy possession.","Thou shalt break them with a rod of iron; Thou shalt dash them in pieces like a potter's vessel.'","Now therefore, O ye kings, be wise; be admonished, ye judges of the earth.","Serve the LORD with fear, and rejoice with trembling.","Do homage in purity, lest He be angry, and ye perish in the way, when suddenly His wrath is kindled. Happy are all they that take refuge in Him."]},{"n":3,"he":["מִזְמוֹר לְדָוִד בְּבׇרְחוֹ מִפְּנֵי אַבְשָׁלוֹם בְּנֽוֹ׃","יְהֹוָה מָה־רַבּוּ צָרָי רַבִּים קָמִים עָלָֽי׃","רַבִּים אֹמְרִים לְנַפְשִׁי אֵין יְֽשׁוּעָתָה לּוֹ בֵאלֹהִים סֶֽלָה׃","וְאַתָּה יְהֹוָה מָגֵן בַּעֲדִי כְּבוֹדִי וּמֵרִים רֹאשִֽׁי׃","קוֹלִי אֶל־יְהֹוָה אֶקְרָא וַיַּעֲנֵנִי מֵהַר קׇדְשׁוֹ סֶֽלָה׃","אֲנִי שָׁכַבְתִּי וָאִישָׁנָה הֱקִיצוֹתִי כִּי יְהֹוָה יִסְמְכֵֽנִי׃","לֹֽא־אִירָא מֵרִבְבוֹת עָם אֲשֶׁר סָבִיב שָׁתוּ עָלָֽי׃","קוּמָה יְהֹוָה הוֹשִׁיעֵנִי אֱלֹהַי כִּֽי־הִכִּיתָ אֶת־כׇּל־אֹיְבַי לֶחִי שִׁנֵּי רְשָׁעִים שִׁבַּֽרְתָּ׃","לַֽיהֹוָה הַיְשׁוּעָה עַֽל־עַמְּךָ בִרְכָתֶךָ סֶּֽלָה׃ {פ}"],"lat":["mizmor ledavid bevorcho mipnei avshalom beno","Adonai ma-rabu tsarai rabim kamim alai","rabim omrim lenafshi ein yeshu'ata lo velohim sela","ve'ata Adonai magen ba'adi kevodi umerim roshi","koli el-Adonai ekra vaya'aneni mehar kodsho sela","ani shakhavti va'ishana hekitsoti ki Adonai yismkheni","lo-ira merivevot am asher saviv shatu alai","kuma Adonai hoshi'eni elohai ki-hikita et-kol-oyvai lechi shinei resha'im shibarta","laihova hayshu'a al-amkha virkhatekha sela f"],"en":["A Psalm of David, when he fled from Absalom his son.","LORD, how many are mine adversaries become! Many are they that rise up against me.","Many there are that say of my soul: 'There is no salvation for him in God.' Selah","But thou, O LORD, art a shield about me; My glory, and the lifter up of my head.","With my voice I call unto the LORD, and He answereth me out of His holy mountain. Selah","I lay me down, and I sleep; I awake, for the LORD sustaineth me.","I am not afraid of ten thousands of people, that have set themselves against me round about.","Arise, O LORD; save me, O my God; for Thou hast smitten all mine enemies upon the cheek, Thou hast broken the teeth of the wicked.","Salvation belongeth unto the LORD; Thy blessing be upon Thy people. Selah"]},{"n":4,"he":["לַמְנַצֵּחַ בִּנְגִינוֹת מִזְמוֹר לְדָוִֽד׃","בְּקׇרְאִי עֲנֵנִי אֱלֹהֵי צִדְקִי בַּצָּר הִרְחַבְתָּ לִּי חׇנֵּנִי וּשְׁמַע תְּפִלָּתִֽי׃","בְּנֵי אִישׁ עַד־מֶה כְבוֹדִי לִכְלִמָּה תֶּאֱהָבוּן רִיק תְּבַקְשׁוּ כָזָב סֶֽלָה׃","וּדְעוּ כִּֽי־הִפְלָה יְהֹוָה חָסִיד לוֹ יְהֹוָה יִשְׁמַע בְּקׇרְאִי אֵלָֽיו׃","רִגְזוּ וְֽאַל־תֶּחֱטָאוּ אִמְרוּ בִלְבַבְכֶם עַֽל־מִשְׁכַּבְכֶם וְדֹמּוּ סֶֽלָה׃","זִבְחוּ זִבְחֵי־צֶדֶק וּבִטְחוּ אֶל־יְהֹוָֽה׃","רַבִּים אֹמְרִים מִֽי־יַרְאֵנוּ טוֹב נְֽסָה־עָלֵינוּ אוֹר פָּנֶיךָ יְהֹוָֽה׃","נָתַתָּה שִׂמְחָה בְלִבִּי מֵעֵת דְּגָנָם וְתִירוֹשָׁם רָֽבּוּ׃","בְּשָׁלוֹם יַחְדָּו אֶשְׁכְּבָה וְאִישָׁן כִּֽי־אַתָּה יְהֹוָה לְבָדָד לָבֶטַח תּוֹשִׁיבֵֽנִי׃ {פ}"],"lat":["lamnatseach binginot mizmor ledavid","bekor'i aneni elohei tsidki batsar hirchavta li choneni ushma' tefilati","benei ish ad-me khevodi likhlima te'ehavun rik tevakshu khazav sela","ud'u ki-hifla Adonai chasid lo Adonai yishma' bekor'i elaiv","rigzu ve'al-techetau imru vilvavkhem al-mishkavkhem vedomu sela","zivchu zivchei-tsedek uvitchu el-Adonai","rabim omrim mi-yar'enu tov nesa-aleinu or paneikha Adonai","natata simcha velibi me'et deganam vetirosham rabu","beshalom yachdav eshkva ve'ishan ki-ata Adonai levadad lavetach toshiveni f"],"en":["For the Leader; with string-music. A Psalm of David.","Answer me when I call, O God of my righteousness, Thou who didst set me free when I was in distress; be gracious unto me, and hear my prayer.","O ye sons of men, how long shall my glory be put to shame, in that ye love vanity, and seek after falsehood? Selah","But know that the LORD hath set apart the godly man as His own; The LORD will hear when I call unto Him.","Tremble, and sin not; commune with your own heart upon your bed, and be still. Selah","Offer the sacrifices of righteousness, and put your trust in the LORD.","Many there are that say: 'Oh that we could see some good!' LORD, lift Thou up the light of Thy countenance upon us.","Thou hast put gladness in my heart, more than when their corn and their wine increase.","In peace will I both lay me down and sleep; for Thou, LORD, makest me dwell alone in safety."]},{"n":5,"he":["לַמְנַצֵּחַ אֶֽל־הַנְּחִילוֹת מִזְמוֹר לְדָוִֽד׃","אֲמָרַי הַאֲזִינָה יְהֹוָה בִּינָה הֲגִיגִֽי׃","הַקְשִׁיבָה לְקוֹל שַׁוְעִי מַלְכִּי וֵאלֹהָי כִּֽי־אֵלֶיךָ אֶתְפַּלָּֽל׃","יְֽהֹוָה בֹּקֶר תִּשְׁמַע קוֹלִי בֹּקֶר אֶעֱרׇךְ־לְךָ וַאֲצַפֶּֽה׃","כִּי לֹא אֵֽל־חָפֵץ־רֶשַׁע אָתָּה לֹא יְגֻרְךָ רָֽע׃","לֹֽא־יִתְיַצְּבוּ הוֹלְלִים לְנֶגֶד עֵינֶיךָ שָׂנֵאתָ כׇּל־פֹּעֲלֵי אָֽוֶן׃","תְּאַבֵּד דֹּבְרֵי כָזָב אִישׁ־דָּמִים וּמִרְמָה יְתָעֵב יְהֹוָֽה׃","וַאֲנִי בְּרֹב חַסְדְּךָ אָבוֹא בֵיתֶךָ אֶשְׁתַּחֲוֶה אֶל־הֵֽיכַל־קׇדְשְׁךָ בְּיִרְאָתֶֽךָ׃","יְהֹוָה נְחֵנִי בְצִדְקָתֶךָ לְמַעַן שׁוֹרְרָי (הושר) [הַיְשַׁר] לְפָנַי דַּרְכֶּֽךָ׃","כִּי אֵין בְּפִיהוּ נְכוֹנָה קִרְבָּם הַוּוֹת קֶֽבֶר־פָּתוּחַ גְּרֹנָם לְשׁוֹנָם יַחֲלִיקֽוּן׃","הַאֲשִׁימֵם אֱֽלֹהִים יִפְּלוּ מִֽמֹּעֲצוֹתֵיהֶם בְּרֹב פִּשְׁעֵיהֶם הַדִּיחֵמוֹ כִּי־מָרוּ בָֽךְ׃","וְיִשְׂמְחוּ כׇל־חוֹסֵי בָךְ לְעוֹלָם יְרַנֵּנוּ וְתָסֵךְ עָלֵימוֹ וְֽיַעְלְצוּ בְךָ אֹהֲבֵי שְׁמֶֽךָ׃","כִּֽי־אַתָּה תְּבָרֵךְ צַדִּיק יְהֹוָה כַּצִּנָּה רָצוֹן תַּעְטְרֶֽנּוּ׃ {פ}"],"lat":["lamnatseach el-hanchilot mizmor ledavid","amarai ha'azina Adonai bina hagigi","hakshiva lekol shav'i malki velohai ki-eleikha etpalal","Adonai boker tishma' koli boker e'erokh-lekha va'atsape","ki lo el-chafets-resha' ata lo yegurkha ra'","lo-yityatsvu holelim leneged eineikha saneta kol-po'alei aven","te'abed dovrei khazav ish-damim umirma yeta'ev Adonai","va'ani berov chasdkha avo veitekha eshtachave el-heikhal-kodshkha beyir'atekha","Adonai necheni vetsidkatekha lema'an shorerai hvshr hayshar lefanai darkekha","ki ein befihu nekhona kirbam hauot kever-patuach geronam leshonam yachalikun","ha'ashimem elohim yiplu mimo'atsoteihem berov pish'eihem hadichemo ki-maru vakh","veyismchu khol-chosei vakh le'olam yeranenu vetasekh aleimo veya'ltsu vekha ohavei shemekha","ki-ata tevarekh tsadik Adonai katsina ratson ta'trenu f"],"en":["For the Leader; upon the Nehiloth. A Psalm of David.","Give ear to my words, O LORD, consider my meditation.","Hearken unto the voice of my cry, my King, and my God; For unto Thee do I pray.","O LORD, in the morning shalt Thou hear my voice; In the morning will I order my prayer unto Thee, and will look forward.","For Thou art not a God that hath pleasure in wickedness; Evil shall not sojourn with Thee.","The boasters shall not stand in Thy sight; Thou hatest all workers of iniquity.","Thou destroyest them that speak falsehood; The LORD abhorreth the man of blood and of deceit.","But as for me, in the abundance of Thy lovingkindness will I come into Thy house; I will bow down toward Thy holy temple in the fear of Thee.","O LORD, lead me in Thy righteousness because of them that lie in wait for me; Make Thy way straight before my face.","For there is no sincerity in their mouth; Their inward part is a yawning gulf, Their throat is an open sepulchre; They make smooth their tongue.","Hold them guilty, O God, Let them fall by their own counsels; Cast them down in the multitude of their transgressions; For they have rebelled against Thee.","So shall all those that take refuge in Thee rejoice, They shall ever shout for joy, And Thou shalt shelter them; Let them also that love Thy name exult in Thee.","For Thou dost bless the righteous; O LORD, Thou dost encompass him with favour as with a shield."]},{"n":6,"he":["לַמְנַצֵּחַ בִּנְגִינוֹת עַֽל־הַשְּׁמִינִית מִזְמוֹר לְדָוִֽד׃","יְֽהֹוָה אַל־בְּאַפְּךָ תוֹכִיחֵנִי וְֽאַל־בַּחֲמָתְךָ תְיַסְּרֵֽנִי׃","חׇנֵּנִי יְהֹוָה כִּי אֻמְלַל־אָנִי רְפָאֵנִי יְהֹוָה כִּי נִבְהֲלוּ עֲצָמָֽי׃","וְנַפְשִׁי נִבְהֲלָה מְאֹד (ואת) [וְאַתָּה] יְהֹוָה עַד־מָתָֽי׃","שׁוּבָה יְהֹוָה חַלְּצָה נַפְשִׁי הוֹשִׁיעֵנִי לְמַעַן חַסְדֶּֽךָ׃","כִּי אֵין בַּמָּוֶת זִכְרֶךָ בִּשְׁאוֹל מִי יֽוֹדֶה־לָּֽךְ׃","יָגַעְתִּי בְּֽאַנְחָתִי אַשְׂחֶה בְכׇל־לַיְלָה מִטָּתִי בְּדִמְעָתִי עַרְשִׂי אַמְסֶֽה׃","עָשְׁשָׁה מִכַּעַס עֵינִי עָתְקָה בְּכׇל־צוֹרְרָֽי׃","סוּרוּ מִמֶּנִּי כׇּל־פֹּעֲלֵי אָוֶן כִּֽי־שָׁמַע יְהֹוָה קוֹל בִּכְיִֽי׃","שָׁמַע יְהֹוָה תְּחִנָּתִי יְהֹוָה תְּֽפִלָּתִי יִקָּֽח׃","יֵבֹשׁוּ וְיִבָּהֲלוּ מְאֹד כׇּל־אֹיְבָי יָשֻׁבוּ יֵבֹשׁוּ רָֽגַע׃ {פ}"],"lat":["lamnatseach binginot al-hashminit mizmor ledavid","Adonai al-be'apkha tokhicheni ve'al-bachamatkha teyasreni","choneni Adonai ki umlal-ani refa'eni Adonai ki nivhalu atsamai","venafshi nivhala me'od vt v'atah Adonai ad-matai","shuva Adonai chaltsa nafshi hoshi'eni lema'an chasdekha","ki ein bamavet zikhrekha bishol mi yode-lakh","yaga'ti be'anchati asche vekhol-layla mitati bedim'ati arsi amse","ashesha mika'as eini atka bekhol-tsorerai","suru mimeni kol-po'alei aven ki-shama' Adonai kol bikhyi","shama' Adonai techinati Adonai tefilati yikach","yevoshu veyibahalu me'od kol-oyvai yashuvu yevoshu raga' f"],"en":["For the Leader; with string-music; on the Sheminith. A Psalm of David.","O LORD, rebuke me not in Thine anger, Neither chasten me in Thy wrath.","Be gracious unto me, O LORD, for I languish away; Heal me, O LORD, for my bones are affrighted.","My soul also is sore affrighted; And Thou, O LORD, how long?","Return, O LORD, deliver my soul; Save me for Thy mercy's sake.","For in death there is no remembrance of Thee; In the nether-world who will give Thee thanks?","I am weary with my groaning; Every night make I my bed to swim; I melt away my couch with my tears.","Mine eye is dimmed because of vexation; It waxeth old because of all mine adversaries.","Depart from me, all ye workers of iniquity; For the LORD hath heard the voice of my weeping.","The LORD hath heard my supplication; The LORD receiveth my prayer.","All mine enemies shall be ashamed and sore affrighted; They shall turn back, they shall be ashamed suddenly."]},{"n":7,"he":["שִׁגָּיוֹן לְדָוִד אֲשֶׁר־שָׁר לַֽיהֹוָה עַל־דִּבְרֵי־כוּשׁ בֶּן־יְמִינִֽי׃","יְהֹוָה אֱלֹהַי בְּךָ חָסִיתִי הוֹשִׁיעֵנִי מִכׇּל־רֹדְפַי וְהַצִּילֵֽנִי׃","פֶּן־יִטְרֹף כְּאַרְיֵה נַפְשִׁי פֹּרֵק וְאֵין מַצִּֽיל׃","יְהֹוָה אֱלֹהַי אִם־עָשִׂיתִי זֹאת אִֽם־יֶשׁ־עָוֶל בְּכַפָּֽי׃","אִם־גָּמַלְתִּי שֽׁוֹלְמִי רָע וָאֲחַלְּצָה צֽוֹרְרִי רֵיקָֽם׃","יִרַדֹּֽף־אוֹיֵב נַפְשִׁי וְיַשֵּׂג וְיִרְמֹס לָאָרֶץ חַיָּי וּכְבוֹדִי לֶעָפָר יַשְׁכֵּן סֶֽלָה׃","קוּמָה יְהֹוָה בְּאַפֶּךָ הִנָּשֵׂא בְּעַבְרוֹת צוֹרְרָי וְעוּרָה אֵלַי מִשְׁפָּט צִוִּֽיתָ׃","וַעֲדַת לְאֻמִּים תְּסֽוֹבְבֶךָּ וְעָלֶיהָ לַמָּרוֹם שֽׁוּבָה׃","יְהֹוָה יָדִין עַמִּים שׇׁפְטֵנִי יְהֹוָה כְּצִדְקִי וּכְתֻמִּי עָלָֽי׃","יִגְמׇר־נָא רַע רְשָׁעִים וּתְכוֹנֵן צַדִּיק וּבֹחֵן לִבּוֹת וּכְלָיוֹת אֱלֹהִים צַדִּֽיק׃","מָגִנִּי עַל־אֱלֹהִים מוֹשִׁיעַ יִשְׁרֵי־לֵֽב׃","אֱלֹהִים שׁוֹפֵט צַדִּיק וְאֵל זֹעֵם בְּכׇל־יֽוֹם׃","אִם־לֹא יָשׁוּב חַרְבּוֹ יִלְטוֹשׁ קַשְׁתּוֹ דָרַךְ וַֽיְכוֹנְנֶֽהָ׃","וְלוֹ הֵכִין כְּלֵי־מָוֶת חִצָּיו לְֽדֹלְקִים יִפְעָֽל׃","הִנֵּה יְחַבֶּל־אָוֶן וְהָרָה עָמָל וְיָלַד שָֽׁקֶר׃","בּוֹר כָּרָה וַֽיַּחְפְּרֵהוּ וַיִּפֹּל בְּשַׁחַת יִפְעָֽל׃","יָשׁוּב עֲמָלוֹ בְרֹאשׁוֹ וְעַל קׇדְקֳדוֹ חֲמָסוֹ יֵרֵֽד׃","אוֹדֶה יְהֹוָה כְּצִדְקוֹ וַאֲזַמְּרָה שֵֽׁם־יְהֹוָה עֶלְיֽוֹן׃ {פ}"],"lat":["shigaion ledavid asher-shar laihova al-divrei-khush ben-yemini","Adonai elohai bekha chasiti hoshi'eni mikol-rodfai vehatsileni","pen-yitrof ke'arye nafshi porek ve'ein matsil","Adonai elohai im-asiti zot im-yesh-avel bekhapai","im-gamalti sholmi ra' va'achaltsa tsoreri reikam","yiradof-oyev nafshi veyaseg veyirmos la'arets chayai ukhvodi le'afar yashken sela","kuma Adonai be'apekha hinase be'avrot tsorerai ve'ura elai mishpat tsivita","va'adat le'umim tesoveveka ve'aleiah lamarom shuva","Adonai yadin amim shofteni Adonai ketsidki ukhtumi alai","yigmor-na ra' resha'im utkhonen tsadik uvochen libot ukhlaiot elohim tsadik","magini al-elohim moshia' yishrei-lev","elohim shofet tsadik ve'el zo'em bekhol-yom","im-lo yashuv charbo yiltosh kashto darakh vaykhoneneah","velo hekhin kelei-mavet chitsaiv ledolkim yif'al","hine yechabel-aven vehara amal veyalad shaker","bor kara vayachprehu vayipol beshachat yif'al","yashuv amalo verosho ve'al kodkodo chamaso yered","ode Adonai ketsidko va'azamra shem-Adonai elyon f"],"en":["Shiggaion of David, which he sang unto the LORD, concerning Cush a Benjamite.","O LORD my God, in Thee have I taken refuge; Save me from all them that pursue me, and deliver me;","Lest he tear my soul like a lion, Rending it in pieces, while there is none to deliver.","O LORD my God, if I have done this; If there be iniquity in my hands;","If I have requited him that did evil unto me, Or spoiled mine adversary unto emptiness;","Let the enemy pursue my soul, and overtake it, And tread my life down to the earth; Yea, let him lay my glory in the dust. Selah","Arise, O LORD, in Thine anger, Lift up Thyself in indignation against mine adversaries; Yea, awake for me at the judgment which Thou hast commanded.","And let the congregation of the peoples compass Thee about, And over them return Thou on high.","O LORD, who ministerest judgment to the peoples, Judge me, O LORD, According to my righteousness, and according to mine integrity that is in me.","Oh that a full measure of evil might come upon the wicked, And that Thou wouldest establish the righteous; For the righteous God trieth the heart and reins.","My shield is with God, Who saveth the upright in heart.","God is a righteous judge, Yea, a God that hath indignation every day:","If a man turn not, He will whet His sword, He hath bent His bow, and made it ready;","He hath also prepared for him the weapons of death, Yea, His arrows which He made sharp.","Behold, he travaileth with iniquity; Yea, he conceiveth mischief, and bringeth forth falsehood.","He hath digged a pit, and hollowed it, And is fallen into the ditch which he made.","His mischief shall return upon his own head, And his violence shall come down upon his own pate.","I will give thanks unto the LORD according to His righteousness; And will sing praise to the name of the LORD Most High."]},{"n":8,"he":["לַמְנַצֵּחַ עַֽל־הַגִּתִּית מִזְמוֹר לְדָוִֽד׃","יְהֹוָה אֲדֹנֵינוּ מָה־אַדִּיר שִׁמְךָ בְּכׇל־הָאָרֶץ אֲשֶׁר תְּנָה הוֹדְךָ עַל־הַשָּׁמָֽיִם׃","מִפִּי עוֹלְלִים וְֽיֹנְקִים יִסַּדְתָּ עֹז לְמַעַן צוֹרְרֶיךָ לְהַשְׁבִּית אוֹיֵב וּמִתְנַקֵּֽם׃","כִּֽי־אֶרְאֶה שָׁמֶיךָ מַעֲשֵׂה אֶצְבְּעֹתֶיךָ יָרֵחַ וְכוֹכָבִים אֲשֶׁר כּוֹנָֽנְתָּה׃","מָה־אֱנוֹשׁ כִּֽי־תִזְכְּרֶנּוּ וּבֶן־אָדָם כִּי תִפְקְדֶֽנּוּ׃","וַתְּחַסְּרֵהוּ מְּעַט מֵאֱלֹהִים וְכָבוֹד וְהָדָר תְּעַטְּרֵֽהוּ׃","תַּמְשִׁילֵהוּ בְּמַעֲשֵׂי יָדֶיךָ כֹּל שַׁתָּה תַֽחַת־רַגְלָֽיו׃","צֹנֶה וַאֲלָפִים כֻּלָּם וְגַם בַּהֲמוֹת שָׂדָֽי׃","צִפּוֹר שָׁמַיִם וּדְגֵי הַיָּם עֹבֵר אׇרְחוֹת יַמִּֽים׃","יְהֹוָה אֲדֹנֵינוּ מָה־אַדִּיר שִׁמְךָ בְּכׇל־הָאָֽרֶץ׃ {פ}"],"lat":["lamnatseach al-hagitit mizmor ledavid","Adonai adoneinu ma-adir shimkha bekhol-ha'arets asher tena hodkha al-hashamayim","mipi olelim veyonkim yisadta oz lema'an tsorereikha lehashbit oyev umitnakem","ki-er'e shameikha ma'ase etsb'oteikha yareach vekhokhavim asher konanta","ma-enosh ki-tizkrenu uven-adam ki tifkdenu","vatchasrehu me'at me'elohim vekhavod vehadar te'atrehu","tamshilehu bema'asei yadeikha kol shata tachat-raglaiv","tsone va'alafim kulam vegam bahamot sadai","tsipor shamayim udgei hayam over orchot yamim","Adonai adoneinu ma-adir shimkha bekhol-ha'arets f"],"en":["For the Leader; upon the Gittith. A Psalm of David.","O LORD, our Lord, How glorious is Thy name in all the earth! Whose majesty is rehearsed above the heavens.","Out of the mouth of babes and sucklings hast Thou founded strength, Because of Thine adversaries; That Thou mightest still the enemy and the avenger.","When I behold Thy heavens, the work of Thy fingers, The moon and the stars, which Thou hast established;","What is man, that Thou art mindful of him? And the son of man, that Thou thinkest of him?","Yet Thou hast made him but little lower than the angels, And hast crowned him with glory and honour.","Thou hast made him to have dominion over the works of Thy hands; Thou hast put all things under His feet:","Sheep and oxen, all of them, Yea, and the beasts of the field;","The fowl of the air, and the fish of the sea; Whatsoever passeth through the paths of the seas.","O LORD, our Lord, How glorious is Thy name in all the earth!"]},{"n":9,"he":["לַמְנַצֵּחַ עַל־מוּת לַבֵּן מִזְמוֹר לְדָוִֽד׃","אוֹדֶה יְהֹוָה בְּכׇל־לִבִּי אֲסַפְּרָה כׇּל־נִפְלְאוֹתֶֽיךָ׃","אֶשְׂמְחָה וְאֶעֶלְצָה בָךְ אֲזַמְּרָה שִׁמְךָ עֶלְיֽוֹן׃","בְּשׁוּב־אוֹיְבַי אָחוֹר יִכָּשְׁלוּ וְיֹאבְדוּ מִפָּנֶֽיךָ׃","כִּֽי־עָשִׂיתָ מִשְׁפָּטִי וְדִינִי יָשַׁבְתָּ לְכִסֵּא שׁוֹפֵט צֶֽדֶק׃","גָּעַרְתָּ גוֹיִם אִבַּדְתָּ רָשָׁע שְׁמָם מָחִיתָ לְעוֹלָם וָעֶֽד׃","הָֽאוֹיֵב תַּמּוּ חֳרָבוֹת לָנֶצַח וְעָרִים נָתַשְׁתָּ אָבַד זִכְרָם הֵֽמָּה׃","וַֽיהֹוָה לְעוֹלָם יֵשֵׁב כּוֹנֵן לַמִּשְׁפָּט כִּסְאֽוֹ׃","וְהוּא יִשְׁפֹּֽט־תֵּבֵל בְּצֶדֶק יָדִין לְאֻמִּים בְּמֵישָׁרִֽים׃","וִיהִי יְהֹוָה מִשְׂגָּב לַדָּךְ מִשְׂגָּב לְעִתּוֹת בַּצָּרָֽה׃","וְיִבְטְחוּ בְךָ יוֹדְעֵי שְׁמֶךָ כִּי לֹֽא־עָזַבְתָּ דֹרְשֶׁיךָ יְהֹוָֽה׃","זַמְּרוּ לַיהֹוָה יֹשֵׁב צִיּוֹן הַגִּידוּ בָעַמִּים עֲלִֽילוֹתָֽיו׃","כִּֽי־דֹרֵשׁ דָּמִים אוֹתָם זָכָר לֹֽא־שָׁכַח צַעֲקַת (עניים) [עֲנָוִֽים]׃","חָֽנְנֵנִי יְהֹוָה רְאֵה עׇנְיִי מִשֹּׂנְאָי מְרוֹמְמִי מִשַּׁעֲרֵי מָֽוֶת׃","לְמַעַן אֲסַפְּרָה כׇּֽל־תְּהִלָּתֶיךָ בְּשַׁעֲרֵי בַת־צִיּוֹן אָגִילָה בִּישׁוּעָתֶֽךָ׃","טָבְעוּ גוֹיִם בְּשַׁחַת עָשׂוּ בְּרֶֽשֶׁת־זוּ טָמָנוּ נִלְכְּדָה רַגְלָֽם׃","נוֹדַע יְהֹוָה מִשְׁפָּט עָשָׂה בְּפֹעַל כַּפָּיו נוֹקֵשׁ רָשָׁע הִגָּיוֹן סֶֽלָה׃","יָשׁוּבוּ רְשָׁעִים לִשְׁאוֹלָה כׇּל־גּוֹיִם שְׁכֵחֵי אֱלֹהִֽים׃","כִּי לֹא לָנֶצַח יִשָּׁכַח אֶבְיוֹן תִּקְוַת (ענוים) [עֲנִיִּים] תֹּאבַד לָעַֽד׃","קוּמָה יְהֹוָה אַל־יָעֹז אֱנוֹשׁ יִשָּׁפְטוּ גוֹיִם עַל־פָּנֶֽיךָ׃","שִׁיתָה יְהֹוָה מוֹרָה לָהֶם יֵדְעוּ גוֹיִם אֱנוֹשׁ הֵמָּה סֶּֽלָה׃ {פ}"],"lat":["lamnatseach al-mut laben mizmor ledavid","ode Adonai bekhol-libi asapra kol-nifloteikha","esmcha ve'e'eltsa vakh azamra shimkha elyon","beshuv-oyvai achor yikashlu veyovdu mipaneikha","ki-asita mishpati vedini yashavta lekhise shofet tsedek","ga'arta goyim ibadta rasha' shemam machita le'olam va'ed","haoyev tamu choravot lanetsach ve'arim natashta avad zikhram hema","vaihova le'olam yeshev konen lamishpat kiso","vehu yishpot-tevel betsedek yadin le'umim bemeisharim","vihi Adonai misgav ladakh misgav le'itot batsara","veyivtchu vekha yod'ei shemekha ki lo-azavta dorsheikha Adonai","zamru laihova yoshev tsiyon hagidu va'amim alilotaiv","ki-doresh damim otam zakhar lo-shakhach tsa'akat 'nyym 'anavim","chaneneni Adonai re'e onyi mison'ai meromemi misha'arei mavet","lema'an asapra kol-tehilateikha besha'arei vat-tsiyon agila bishu'atekha","tav'u goyim beshachat asu bereshet-zu tamanu nilkda raglam","noda' Adonai mishpat asa befo'al kapaiv nokesh rasha' higaion sela","yashuvu resha'im lishola kol-goyim shekhechei elohim","ki lo lanetsach yishakhach evyon tikvat 'nvym 'aniyim tovad la'ad","kuma Adonai al-ya'oz enosh yishaftu goyim al-paneikha","shita Adonai mora lahem yed'u goyim enosh hema sela f"],"en":["For the Leader; upon Muthlabben. A Psalm of David.","I will give thanks unto the LORD with my whole heart; I will tell of all Thy marvellous works.","I will be glad and exult in Thee; I will sing praise to Thy name, O Most High:","When mine enemies are turned back, They stumble and perish at Thy presence;","For Thou hast maintained my right and my cause; Thou sattest upon the throne as the righteous Judge.","Thou hast rebuked the nations, Thou hast destroyed the wicked, Thou hast blotted out their name for ever and ever.","O thou enemy, the waste places are come to an end for ever; And the cities which thou didst uproot, Their very memorial is perished.","But the LORD is enthroned for ever; He hath established His throne for judgment.","And He will judge the world in righteousness, He will minister judgment to the peoples with equity.","The LORD also will be a high tower for the oppressed, A high tower in times of trouble;","And they that know Thy name will put their trust in Thee; For thou, LORD, hast not forsaken them that seek Thee.","Sing praises to the LORD, who dwelleth in Zion; Declare among the peoples His doings.","For He that avengeth blood hath remembered them; He hath not forgotten the cry of the humble.","Be gracious unto me, O LORD, Behold mine affliction at the hands of them that hate me; Thou that liftest me up from the gates of death;","That I may tell of all Thy praise in the gates of the daughter of Zion, That I may rejoice in Thy salvation.","The nations are sunk down in the pit that they made; In the net which they hid is their own foot taken.","The LORD hath made Himself known, He hath executed judgment, The wicked is snared in the work of his own hands. Higgaion. Selah","The wicked shall return to the nether-world, Even all the nations that forget God.","For the needy shall not alway be forgotten, Nor the expectation of the poor perish for ever.","Arise, O LORD, let not man prevail; Let the nations be judged in Thy sight.","Set terror over them, O LORD; Let the nations know they are but men. Selah"]},{"n":10,"he":["לָמָה יְהֹוָה תַּעֲמֹד בְּרָחוֹק תַּעְלִים לְעִתּוֹת בַּצָּרָֽה׃","בְּגַאֲוַת רָשָׁע יִדְלַק עָנִי יִתָּפְשׂוּ בִּמְזִמּוֹת זוּ חָשָֽׁבוּ׃","כִּֽי־הִלֵּל רָשָׁע עַל־תַּאֲוַת נַפְשׁוֹ וּבֹצֵעַ בֵּרֵךְ נִאֵץ יְהֹוָֽה׃","רָשָׁע כְּגֹבַהּ אַפּוֹ בַּל־יִדְרֹשׁ אֵין אֱלֹהִים כׇּל־מְזִמּוֹתָֽיו׃","יָחִילוּ דְרָכָו בְּכׇל־עֵת מָרוֹם מִשְׁפָּטֶיךָ מִנֶּגְדּוֹ כׇּל־צוֹרְרָיו יָפִיחַ בָּהֶֽם׃","אָמַר בְּלִבּוֹ בַּל־אֶמּוֹט לְדֹר וָדֹר אֲשֶׁר לֹֽא־בְרָֽע׃","אָלָה פִּיהוּ מָלֵא וּמִרְמוֹת וָתֹךְ תַּחַת לְשׁוֹנוֹ עָמָל וָאָֽוֶן׃","יֵשֵׁב בְּמַאְרַב חֲצֵרִים בַּֽמִּסְתָּרִים יַהֲרֹג נָקִי עֵינָיו לְֽחֵלְכָה יִצְפֹּֽנוּ׃","יֶאֱרֹב בַּמִּסְתָּר כְּאַרְיֵה בְסֻכֹּה יֶאֱרֹב לַחֲטוֹף עָנִי יַחְטֹף עָנִי בְּמׇשְׁכוֹ בְרִשְׁתּֽוֹ׃","(ודכה) [יִדְכֶּה] יָשֹׁחַ וְנָפַל בַּעֲצוּמָיו (חלכאים) [חֵל כָּאִֽים]׃","אָמַר בְּלִבּוֹ שָׁכַֽח אֵל הִסְתִּיר פָּנָיו בַּל־רָאָה לָנֶֽצַח׃","קוּמָה יְהֹוָה אֵל נְשָׂא יָדֶךָ אַל־תִּשְׁכַּח (עניים) [עֲנָוִֽים]׃","עַל־מֶה נִאֵץ רָשָׁע אֱלֹהִים אָמַר בְּלִבּוֹ לֹא תִדְרֹֽשׁ׃","רָאִתָה כִּי־אַתָּה עָמָל וָכַעַס תַּבִּיט לָתֵת בְּיָדֶךָ עָלֶיךָ יַעֲזֹב חֵלֵכָה יָתוֹם אַתָּה הָיִיתָ עוֹזֵֽר׃","שְׁבֹר זְרוֹעַ רָשָׁע וָרָע תִּֽדְרוֹשׁ־רִשְׁעוֹ בַל־תִּמְצָֽא׃","יְהֹוָה מֶלֶךְ עוֹלָם וָעֶד אָבְדוּ גוֹיִם מֵאַרְצֽוֹ׃","תַּאֲוַת עֲנָוִים שָׁמַעְתָּ יְהֹוָה תָּכִין לִבָּם תַּקְשִׁיב אׇזְנֶֽךָ׃","לִשְׁפֹּט יָתוֹם וָדָךְ בַּל־יוֹסִיף עוֹד לַעֲרֹץ אֱנוֹשׁ מִן־הָאָֽרֶץ׃ {פ}"],"lat":["lama Adonai ta'amod berachok ta'lim le'itot batsara","bega'avat rasha' yidlak ani yitafsu bimzimot zu chashavu","ki-hilel rasha' al-ta'avat nafsho uvotsea' berekh ni'ets Adonai","rasha' kegovah apo bal-yidrosh ein elohim kol-mezimotaiv","yachilu derakhav bekhol-et marom mishpateikha minegdo kol-tsoreraiv yafiach bahem","amar belibo bal-emot ledor vador asher lo-vera'","ala pihu male umirmot vatokh tachat leshono amal va'aven","yeshev bema'rav chatserim bamistarim yaharog naki einaiv lechelkha yitsponu","ye'erov bamistar ke'arye vesuko ye'erov lachatof ani yachtof ani bemoshkho verishto","vdkhh yidkeh yashoach venafal ba'atsumaiv chlkhym chel ka'im","amar belibo shakhach el histir panaiv bal-ra'a lanetsach","kuma Adonai el nesa yadekha al-tishkach 'nyym 'anavim","al-me ni'ets rasha' elohim amar belibo lo tidrosh","ra'ita ki-ata amal vakha'as tabit latet beyadekha aleikha ya'azov chelekha yatom ata hayita ozer","shevor zeroa' rasha' vara' tidrosh-rish'o val-timtsa","Adonai melekh olam va'ed avdu goyim me'artso","ta'avat anavim shama'ta Adonai takhin libam takshiv oznekha","lishpot yatom vadakh bal-yosif od la'arots enosh min-ha'arets f"],"en":["Why standest Thou afar off, O LORD? Why hidest Thou Thyself in times of trouble?","Through the pride of the wicked the poor is hotly pursued, They are taken in the devices that they have imagined.","For the wicked boasteth of his heart's desire, And the covetous vaunteth himself, though he contemn the LORD.","The wicked, in the pride of his countenance [, saith]: 'He will not require'; All his thoughts are: 'There is no God.'","His ways prosper at all times; Thy judgments are far above out of his sight; As for all his adversaries, he puffeth at them.","He saith in his heart: 'I shall not be moved, I who to all generations shall not be in adversity.'","His mouth is full of cursing and deceit and oppression; Under his tongue is mischief and iniquity.","He sitteth in the lurking-places of the villages; In secret places doth he slay the innocent; His eyes are on the watch for the helpless.","He lieth in wait in a secret place as a lion in his lair, He lieth in wait to catch the poor; He doth catch the poor, when he draweth him up in his net.","He croucheth, he boweth down, And the helpless fall into his mighty claws.","He hath said in his heart: 'God hath forgotten; He hideth His face; He will never see.'","Arise, O LORD; O God, lift up Thy hand; Forget not the humble.","Wherefore doth the wicked contemn God, And say in his heart: 'Thou wilt not require'?","Thou hast seen; for Thou beholdest trouble and vexation, to requite them with Thy hand; Unto Thee the helpless committeth himself; Thou hast been the helper of the fatherless.","Break Thou the arm of the wicked; And as for the evil man, search out his wickedness, till none be found.","The LORD is King for ever and ever; The nations are perished out of His land.","LORD, Thou hast heard the desire of the humble: Thou wilt direct their heart, Thou wilt cause Thine ear to attend;","To right the fatherless and the oppressed, That man who is of the earth may be terrible no more."]},{"n":11,"he":["לַמְנַצֵּחַ לְדָוִד בַּֽיהֹוָה חָסִיתִי אֵיךְ תֹּאמְרוּ לְנַפְשִׁי (נודו) [נוּדִי] הַרְכֶם צִפּֽוֹר׃","כִּי הִנֵּה הָרְשָׁעִים יִדְרְכוּן קֶשֶׁת כּוֹנְנוּ חִצָּם עַל־יֶתֶר לִירוֹת בְּמוֹ־אֹפֶל לְיִשְׁרֵי־לֵֽב׃","כִּי הַשָּׁתוֹת יֵהָרֵסוּן צַדִּיק מַה־פָּעָֽל׃","יְהֹוָה בְּֽהֵיכַל קׇדְשׁוֹ יְהֹוָה בַּשָּׁמַיִם כִּסְאוֹ עֵינָיו יֶחֱזוּ עַפְעַפָּיו יִבְחֲנוּ בְּנֵי אָדָֽם׃","יְהֹוָה צַדִּיק יִבְחָן וְרָשָׁע וְאֹהֵב חָמָס שָֽׂנְאָה נַפְשֽׁוֹ׃","יַמְטֵר עַל־רְשָׁעִים פַּחִים אֵשׁ וְגׇפְרִית וְרוּחַ זִלְעָפוֹת מְנָת כּוֹסָֽם׃","כִּֽי־צַדִּיק יְהֹוָה צְדָקוֹת אָהֵב יָשָׁר יֶחֱזוּ פָנֵֽימוֹ׃ {פ}"],"lat":["lamnatseach ledavid baihova chasiti eikh tomru lenafshi nvdv nudi harkhem tsipor","ki hine harsha'im yidrkhun keshet konenu chitsam al-yeter lirot bemo-ofel leyishrei-lev","ki hashatot yeharesun tsadik ma-pa'al","Adonai beheikhal kodsho Adonai bashamayim kiso einaiv yechezu af'apaiv yivchanu benei adam","Adonai tsadik yivchan verasha' ve'ohev chamas san'a nafsho","yamter al-resha'im pachim esh vegofrit veruach zil'afot menat kosam","ki-tsadik Adonai tsedakot ahev yashar yechezu faneimo f"],"en":["For the Leader. [A Psalm] of David. In the LORD have I taken refuge; how say ye to my soul: 'Flee thou! to your mountain, ye birds'?","For, lo, the wicked bend the bow, they have made ready their arrow upon the string, that they may shoot in darkness at the upright in heart.","When the foundations are destroyed, what hath the righteous wrought?","The LORD is in His holy temple, the LORD, His throne is in heaven; His eyes behold, His eyelids try, the children of men.","The LORD trieth the righteous; but the wicked and him that loveth violence His soul hateth.","Upon the wicked He will cause to rain coals; fire and brimstone and burning wind shall be the portion of their cup.","For the LORD is righteous, He loveth righteousness; the upright shall behold His face."]},{"n":12,"he":["לַמְנַצֵּחַ עַֽל־הַשְּׁמִינִית מִזְמוֹר לְדָוִֽד׃","הוֹשִׁיעָה יְהֹוָה כִּֽי־גָמַר חָסִיד כִּי־פַסּוּ אֱמוּנִים מִבְּנֵי אָדָֽם׃","שָׁוְא יְֽדַבְּרוּ אִישׁ אֶת־רֵעֵהוּ שְׂפַת חֲלָקוֹת בְּלֵב וָלֵב יְדַבֵּֽרוּ׃","יַכְרֵת יְהֹוָה כׇּל־שִׂפְתֵי חֲלָקוֹת לָשׁוֹן מְדַבֶּרֶת גְּדֹלֽוֹת׃","אֲשֶׁר אָמְרוּ לִלְשֹׁנֵנוּ נַגְבִּיר שְׂפָתֵינוּ אִתָּנוּ מִי אָדוֹן לָֽנוּ׃","מִשֹּׁד עֲנִיִּים מֵאֶנְקַת אֶבְיוֹנִים עַתָּה אָקוּם יֹאמַר יְהֹוָה אָשִׁית בְּיֵשַׁע יָפִיחַֽ־לֽוֹ׃","אִמְרוֹת יְהֹוָה אֲמָרוֹת טְהֹרוֹת כֶּסֶף צָרוּף בַּעֲלִיל לָאָרֶץ מְזֻקָּק שִׁבְעָתָֽיִם׃","אַתָּֽה־יְהֹוָה תִּשְׁמְרֵם תִּצְּרֶנּוּ מִן־הַדּוֹר זוּ לְעוֹלָֽם׃","סָבִיב רְשָׁעִים יִתְהַלָּכוּן כְּרֻם זֻלּוּת לִבְנֵי אָדָֽם׃ {פ}"],"lat":["lamnatseach al-hashminit mizmor ledavid","hoshi'a Adonai ki-gamar chasid ki-fasu emunim mibnei adam","shav yedabru ish et-re'ehu sefat chalakot belev valev yedaberu","yakhret Adonai kol-siftei chalakot lashon medaberet gedolot","asher amru lilshonenu nagbir sefateinu itanu mi adon lanu","mishod aniyim me'enkat evyonim ata akum yomar Adonai ashit beyesha' yafiach-lo","imrot Adonai amarot tehorot kesef tsaruf ba'alil la'arets mezukak shiv'atayim","ata-Adonai tishmrem titsrenu min-hador zu le'olam","saviv resha'im yithalakhun kerum zulut livnei adam f"],"en":["For the Leader; on the Sheminith. A Psalm of David.","Help, LORD; for the godly man ceaseth; For the faithful fail from among the children of men.","They speak falsehood every one with his neighbour; With flattering lip, and with a double heart, do they speak.","May the LORD cut off all flattering lips, The tongue that speaketh proud things!","Who have said: 'Our tongue will we make mighty; Our lips are with us: who is lord over us?'","'For the oppression of the poor, for the sighing of the needy, Now will I arise', saith the LORD; 'I will set him in safety at whom they puff.' .","The words of the LORD are pure words, As silver tried in a crucible on the earth, refined seven times.","Thou wilt keep them, O LORD; Thou wilt preserve us from this generation for ever.","The wicked walk on every side, When vileness is exalted among the sons of men."]},{"n":13,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃","עַד־אָנָה יְהֹוָה תִּשְׁכָּחֵנִי נֶצַח עַד־אָנָה תַּסְתִּיר אֶת־פָּנֶיךָ מִמֶּֽנִּי׃","עַד־אָנָה אָשִׁית עֵצוֹת בְּנַפְשִׁי יָגוֹן בִּלְבָבִי יוֹמָם עַד־אָנָה יָרוּם אֹיְבִי עָלָֽי׃","הַבִּיטָֽה עֲנֵנִי יְהֹוָה אֱלֹהָי הָאִירָה עֵינַי פֶּן־אִישַׁן הַמָּֽוֶת׃","פֶּן־יֹאמַר אֹיְבִי יְכׇלְתִּיו צָרַי יָגִילוּ כִּי אֶמּֽוֹט׃","וַאֲנִי בְּחַסְדְּךָ בָטַחְתִּי יָגֵל לִבִּי בִּישׁוּעָתֶךָ אָשִׁירָה לַֽיהֹוָה כִּי גָמַל עָלָֽי׃ {פ}"],"lat":["lamnatseach mizmor ledavid","ad-ana Adonai tishkacheni netsach ad-ana tastir et-paneikha mimeni","ad-ana ashit etsot benafshi yagon bilvavi yomam ad-ana yarum oyvi alai","habita aneni Adonai elohai ha'ira einai pen-ishan hamavet","pen-yomar oyvi yekholtiv tsarai yagilu ki emot","va'ani bechasdkha vatachti yagel libi bishu'atekha ashira laihova ki gamal alai f"],"en":["For the Leader. A Psalm of David.","How long, O LORD, wilt Thou forget me for ever? How long wilt Thou hide Thy face from me?","How long shall I take counsel in my soul, having sorrow in my heart by day? How long shall mine enemy be exalted over me?","Behold Thou, and answer me, O LORD my God; Lighten mine eyes, lest I sleep the sleep of death;","Lest mine enemy say: 'I have prevailed against him'; Lest mine adversaries rejoice when I am moved.","But as for me, in Thy mercy do I trust; My heart shall rejoice in Thy salvation. I will sing unto the LORD, Because He hath dealt bountifully with me."]},{"n":14,"he":["לַמְנַצֵּחַ לְדָוִד אָמַר נָבָל בְּלִבּוֹ אֵין אֱלֹהִים הִֽשְׁחִיתוּ הִֽתְעִיבוּ עֲלִילָה אֵין עֹֽשֵׂה־טֽוֹב׃","יְֽהֹוָה מִשָּׁמַיִם הִשְׁקִיף עַֽל־בְּנֵי־אָדָם לִרְאוֹת הֲיֵשׁ מַשְׂכִּיל דֹּרֵשׁ אֶת־אֱלֹהִֽים׃","הַכֹּל סָר יַחְדָּו נֶאֱלָחוּ אֵין עֹֽשֵׂה־טוֹב אֵין גַּם־אֶחָֽד׃","הֲלֹא יָדְעוּ כׇּל־פֹּעֲלֵי אָוֶן אֹכְלֵי עַמִּי אָכְלוּ לֶחֶם יְהֹוָה לֹא קָרָֽאוּ׃","שָׁם פָּחֲדוּ פָחַד כִּֽי־אֱלֹהִים בְּדוֹר צַדִּֽיק׃","עֲצַת־עָנִי תָבִישׁוּ כִּי יְהֹוָה מַחְסֵֽהוּ׃","מִי־יִתֵּן מִצִּיּוֹן יְשׁוּעַת יִשְׂרָאֵל בְּשׁוּב יְהֹוָה שְׁבוּת עַמּוֹ יָגֵל יַעֲקֹב יִשְׂמַח יִשְׂרָאֵֽל׃ {פ}"],"lat":["lamnatseach ledavid amar naval belibo ein elohim hishchitu hit'ivu alila ein ose-tov","Adonai mishamayim hishkif al-benei-adam lirot hayesh maskil doresh et-elohim","hakol sar yachdav ne'elachu ein ose-tov ein gam-echad","halo yad'u kol-po'alei aven okhlei ami akhlu lechem Adonai lo karau","sham pachadu fachad ki-elohim bedor tsadik","atsat-ani tavishu ki Adonai machsehu","mi-yiten mitsiyon yeshu'at yisra'el beshuv Adonai shevut amo yagel ya'akov yismach yisra'el f"],"en":["For the Leader. [A Psalm] of David. The fool hath said in his heart: 'There is no God'; they have dealt corruptly, they have done abominably; there is none that doeth good.","The LORD looked forth from heaven upon the children of men, to see if there were any man of understanding, that did seek after God.","They are all corrupt, they are together become impure; there is none that doeth good, no, not one.","’Shall not all the workers of iniquity know it, who eat up My people as they eat bread, and call not upon the LORD?'","There are they in great fear; for God is with the righteous generation.","Ye would put to shame the counsel of the poor, but the LORD is his refuge.","Oh that the salvation of Israel were come out of Zion! When the LORD turneth the captivity of His people, let Jacob rejoice, let Israel be glad."]},{"n":15,"he":["מִזְמוֹר לְדָוִד יְהֹוָה מִי־יָגוּר בְּאׇהֳלֶךָ מִֽי־יִשְׁכֹּן בְּהַר קׇדְשֶֽׁךָ׃","הוֹלֵךְ תָּמִים וּפֹעֵל צֶדֶק וְדֹבֵר אֱמֶת בִּלְבָבֽוֹ׃","לֹֽא־רָגַל עַל־לְשֹׁנוֹ לֹא־עָשָׂה לְרֵעֵהוּ רָעָה וְחֶרְפָּה לֹא־נָשָׂא עַל־קְרֹבֽוֹ׃","נִבְזֶה בְּֽעֵינָיו נִמְאָס וְאֶת־יִרְאֵי יְהֹוָה יְכַבֵּד נִשְׁבַּע לְהָרַע וְלֹא יָמִֽר׃","כַּסְפּוֹ לֹא־נָתַן בְּנֶשֶׁךְ וְשֹׁחַד עַל־נָקִי לֹא־לָקָח עֹֽשֵׂה־אֵלֶּה לֹא יִמּוֹט לְעוֹלָֽם׃ {פ}"],"lat":["mizmor ledavid Adonai mi-yagur be'oholekha mi-yishkon behar kodshekha","holekh tamim ufo'el tsedek vedover emet bilvavo","lo-ragal al-leshono lo-asa lere'ehu ra'a vecherpa lo-nasa al-kerovo","nivze be'einaiv nim'as ve'et-yir'ei Adonai yekhabed nishba' lehara' velo yamir","kaspo lo-natan beneshekh veshochad al-naki lo-lakach ose-ele lo yimot le'olam f"],"en":["A Psalm of David. LORD, who shall sojourn in Thy tabernacle? Who shall dwell upon Thy holy mountain?","He that walketh uprightly, and worketh righteousness, And speaketh truth in his heart;","That hath no slander upon his tongue, Nor doeth evil to his fellow, Nor taketh up a reproach against his neighbour;","In whose eyes a vile person is despised, But he honoureth them that fear the LORD; He that sweareth to his own hurt, and changeth not;","He that putteth not out his money on interest, Nor taketh a bribe against the innocent. He that doeth these things shall never be moved."]},{"n":16,"he":["מִכְתָּם לְדָוִד שׇֽׁמְרֵנִי אֵל כִּֽי־חָסִיתִי בָֽךְ׃","אָמַרְתְּ לַֽיהֹוָה אֲדֹנָי אָתָּה טוֹבָתִי בַּל־עָלֶֽיךָ׃","לִקְדוֹשִׁים אֲשֶׁר־בָּאָרֶץ הֵמָּה וְאַדִּירֵי כׇּל־חֶפְצִי־בָֽם׃","יִרְבּוּ עַצְּבוֹתָם אַחֵר מָהָרוּ בַּל־אַסִּיךְ נִסְכֵּיהֶם מִדָּם וּֽבַל־אֶשָּׂא אֶת־שְׁמוֹתָם עַל־שְׂפָתָֽי׃","יְֽהֹוָה מְנָת־חֶלְקִי וְכוֹסִי אַתָּה תּוֹמִיךְ גּוֹרָלִֽי׃","חֲבָלִים נָֽפְלוּ־לִי בַּנְּעִמִים אַף־נַחֲלָת שָֽׁפְרָה עָלָֽי׃","אֲבָרֵךְ אֶת־יְהֹוָה אֲשֶׁר יְעָצָנִי אַף־לֵילוֹת יִסְּרוּנִי כִלְיוֹתָֽי׃","שִׁוִּיתִי יְהֹוָה לְנֶגְדִּי תָמִיד כִּי מִֽימִינִי בַּל־אֶמּֽוֹט׃","לָכֵן שָׂמַח לִבִּי וַיָּגֶל כְּבוֹדִי אַף־בְּשָׂרִי יִשְׁכֹּן לָבֶֽטַח׃","כִּי לֹא־תַעֲזֹב נַפְשִׁי לִשְׁאוֹל לֹֽא־תִתֵּן חֲסִידְךָ לִרְאוֹת שָֽׁחַת׃","תּֽוֹדִיעֵנִי אֹרַח חַיִּים שֹׂבַע שְׂמָחוֹת אֶת־פָּנֶיךָ נְעִמוֹת בִּימִינְךָ נֶֽצַח׃ {פ}"],"lat":["mikhtam ledavid shomreni el ki-chasiti vakh","amart laihova adonai ata tovati bal-aleikha","likdoshim asher-ba'arets hema ve'adirei kol-cheftsi-vam","yirbu atsvotam acher maharu bal-asikh niskeihem midam uval-esa et-shemotam al-sefatai","Adonai menat-chelki vekhosi ata tomikh gorali","chavalim naflu-li ban'imim af-nachalat shafra alai","avarekh et-Adonai asher ye'atsani af-leilot yisruni khilyotai","shiviti Adonai lenegdi tamid ki mimini bal-emot","lakhen samach libi vayagel kevodi af-besari yishkon lavetach","ki lo-ta'azov nafshi lishol lo-titen chasidkha lirot shachat","todi'eni orach chayim sova' semachot et-paneikha ne'imot biminkha netsach f"],"en":["Michtam of David. Keep me, O God; for I have taken refuge in Thee.","I have said unto the LORD: 'Thou art my Lord; I have no good but in Thee';","As for the holy that are in the earth, They are the excellent in whom is all my delight.","Let the idols of them be multiplied that make suit unto another; Their drink-offerings of blood will I not offer, Nor take their names upon my lips.","O LORD, the portion of mine inheritance and of my cup, Thou maintainest my lot.","The lines are fallen unto me in pleasant places; Yea, I have a goodly heritage.","I will bless the LORD, who hath given me counsel; Yea, in the night seasons my reins instruct me.","I have set the LORD always before me; Surely He is at my right hand, I shall not be moved.","Therefore my heart is glad, and my glory rejoiceth; my flesh also dwelleth in safety;","For Thou wilt not abandon my soul to the nether-world; Neither wilt Thou suffer Thy godly one to see the pit.","Thou makest me to know the path of life; In Thy presence is fulness of joy, In Thy right hand bliss for evermore."]},{"n":17,"he":["תְּפִלָּה לְדָוִד שִׁמְעָה יְהֹוָה צֶדֶק הַקְשִׁיבָה רִנָּתִי הַאֲזִינָה תְפִלָּתִי בְּלֹא שִׂפְתֵי מִרְמָֽה׃","מִלְּפָנֶיךָ מִשְׁפָּטִי יֵצֵא עֵינֶיךָ תֶּחֱזֶינָה מֵישָׁרִֽים׃","בָּחַנְתָּ לִבִּי פָּקַדְתָּ לַּיְלָה צְרַפְתַּנִי בַל־תִּמְצָא זַמֹּתִי בַּל־יַעֲבׇר־פִּֽי׃","לִפְעֻלּוֹת אָדָם בִּדְבַר שְׂפָתֶיךָ אֲנִי שָׁמַרְתִּי אׇרְחוֹת פָּרִֽיץ׃","תָּמֹךְ אֲשֻׁרַי בְּמַעְגְּלוֹתֶיךָ בַּל־נָמוֹטּוּ פְעָמָֽי׃","אֲנִֽי־קְרָאתִיךָ כִֽי־תַעֲנֵנִי אֵל הַֽט־אׇזְנְךָ לִי שְׁמַע אִמְרָתִֽי׃","הַפְלֵה חֲסָדֶיךָ מוֹשִׁיעַ חוֹסִים מִמִּתְקוֹמְמִים בִּֽימִינֶֽךָ׃","שׇׁמְרֵנִי כְּאִישׁוֹן בַּת־עָיִן בְּצֵל כְּנָפֶיךָ תַּסְתִּירֵֽנִי׃","מִפְּנֵי רְשָׁעִים זוּ שַׁדּוּנִי אֹיְבַי בְּנֶפֶשׁ יַקִּיפוּ עָלָֽי׃","חֶלְבָּמוֹ סָּגְרוּ פִּימוֹ דִּבְּרוּ בְגֵאֽוּת׃","אַשֻּׁרֵינוּ עַתָּה (סבבוני) [סְבָבוּנוּ] עֵינֵיהֶם יָשִׁיתוּ לִנְטוֹת בָּאָֽרֶץ׃","דִּמְיֹנוֹ כְּאַרְיֵה יִכְסוֹף לִטְרֹף וְכִכְפִיר יֹשֵׁב בְּמִסְתָּרִֽים׃","קוּמָה יְהֹוָה קַדְּמָה פָנָיו הַכְרִיעֵהוּ פַּלְּטָה נַפְשִׁי מֵרָשָׁע חַרְבֶּֽךָ׃","מִמְתִֽים־יָדְךָ יְהֹוָה מִֽמְתִים מֵחֶלֶד חֶלְקָם בַּֽחַיִּים (וצפינך) [וּֽצְפוּנְךָ] תְּמַלֵּא בִטְנָם יִשְׂבְּעוּ בָנִים וְהִנִּיחוּ יִתְרָם לְעוֹלְלֵיהֶֽם׃","אֲנִי בְּצֶדֶק אֶחֱזֶה פָנֶיךָ אֶשְׂבְּעָה בְהָקִיץ תְּמוּנָתֶֽךָ׃ {פ}"],"lat":["tefila ledavid shim'a Adonai tsedek hakshiva rinati ha'azina tefilati belo siftei mirma","milfaneikha mishpati yetse eineikha techezeina meisharim","bachanta libi pakadta layla tseraftani val-timtsa zamoti bal-ya'avor-pi","lif'ulot adam bidvar sefateikha ani shamarti orchot parits","tamokh ashurai bema'gloteikha bal-namotu fe'amai","ani-keratikha khi-ta'aneni el hat-oznkha li shema' imrati","hafle chasadeikha moshia' chosim mimitkomemim biminekha","shomreni ke'ishon bat-ayin betsel kenafeikha tastireni","mipnei resha'im zu shaduni oyvai benefesh yakifu alai","chelbamo sagru pimo dibru vegeut","ashureinu ata svvvny svavunu eineihem yashitu lintot ba'arets","dimyono ke'arye yikhsof litrof vekhikhfir yoshev bemistarim","kuma Adonai kadma fanaiv hakhri'ehu palta nafshi merasha' charbekha","mimtim-yadkha Adonai mimtim mecheled chelkam bachayim vtsfynkh utsfunkha temale vitnam yisb'u vanim vehinichu yitram le'oleleihem","ani betsedek echeze faneikha esb'a vehakits temunatekha f"],"en":["A Prayer of David. Hear the right, O LORD, attend unto my cry; Give ear unto my prayer from lips without deceit.","Let my judgment come forth from Thy presence; Let Thine eyes behold equity.","Thou hast tried my heart, Thou hast visited it in the night; Thou hast tested me, and Thou findest not That I had a thought which should not pass my mouth.","As for the doings of men, by the word of Thy lips I have kept me from the ways of the violent.","My steps have held fast to Thy paths, My feet have not slipped.","As for me, I call upon Thee, for Thou wilt answer me, O God; Incline Thine ear unto me, hear my speech.","Make passing great Thy mercies, O Thou that savest by Thy right hand From assailants them that take refuge in Thee.","Keep me as the apple of the eye, Hide me in the shadow of Thy wings,","From the wicked that oppress, My deadly enemies, that compass me about.","Their gross heart they have shut tight, With their mouth they speak proudly.","At our every step they have now encompassed us; They set their eyes to cast us down to the earth.","He is like a lion that is eager to tear in pieces, And like a young lion lurking in secret places.","Arise, O LORD, confront him, cast him down; Deliver my soul from the wicked, by Thy sword;","From men, by Thy hand, O LORD, From men of the world, whose portion is in this life, And whose belly Thou fillest with Thy treasure; Who have children in plenty, And leave their abundance to their babes.","As for me, I shall behold Thy face in righteousness; I shall be satisfied, when I awake, with Thy likeness."]},{"n":18,"he":["לַמְנַצֵּחַ לְעֶבֶד יְהֹוָה לְדָוִד אֲשֶׁר דִּבֶּר לַיהֹוָה אֶת־דִּבְרֵי הַשִּׁירָה הַזֹּאת בְּיוֹם הִֽצִּיל־יְהֹוָה־אוֹתוֹ מִכַּף כׇּל־אֹיְבָיו וּמִיַּד שָׁאֽוּל׃","וַיֹּאמַר אֶרְחׇמְךָ יְהֹוָה חִזְקִֽי׃","יְהֹוָה סַלְעִי וּמְצוּדָתִי וּמְפַלְטִי אֵלִי צוּרִי אֶֽחֱסֶה־בּוֹ מָֽגִנִּי וְקֶֽרֶן־יִשְׁעִי מִשְׂגַּבִּֽי׃","מְהֻלָּל אֶקְרָא יְהֹוָה וּמִן־אֹיְבַי אִוָּשֵֽׁעַ׃","אֲפָפוּנִי חֶבְלֵי־מָוֶת וְֽנַחֲלֵי בְלִיַּעַל יְבַֽעֲתֽוּנִי׃","חֶבְלֵי שְׁאוֹל סְבָבוּנִי קִדְּמוּנִי מוֹקְשֵׁי מָֽוֶת׃","בַּצַּר־לִי אֶקְרָא יְהֹוָה וְאֶל־אֱלֹהַי אֲשַׁוֵּעַ יִשְׁמַע מֵהֵיכָלוֹ קוֹלִי וְשַׁוְעָתִי לְפָנָיו תָּבוֹא בְאׇזְנָֽיו׃","וַתִּגְעַשׁ וַתִּרְעַשׁ הָאָרֶץ וּמוֹסְדֵי הָרִים יִרְגָּזוּ וַיִּתְגָּֽעֲשׁוּ כִּי־חָרָה לֽוֹ׃","עָלָה עָשָׁן בְּאַפּוֹ וְאֵשׁ־מִפִּיו תֹּאכֵל גֶּחָלִים בָּעֲרוּ מִמֶּֽנּוּ׃","וַיֵּט שָׁמַיִם וַיֵּרַד וַעֲרָפֶל תַּחַת רַגְלָֽיו׃","וַיִּרְכַּב עַל־כְּרוּב וַיָּעֹף וַיֵּדֶא עַל־כַּנְפֵי־רֽוּחַ׃","יָשֶׁת־חֹשֶׁךְ סִתְרוֹ סְבִֽיבוֹתָיו סֻכָּתוֹ חֶשְׁכַת־מַיִם עָבֵי שְׁחָקִֽים׃","מִנֹּגַהּ נֶגְדּוֹ עָבָיו עָבְרוּ בָּרָד וְגַֽחֲלֵי־אֵֽשׁ׃","וַיַּרְעֵם בַּשָּׁמַיִם יְֽהֹוָה וְעֶלְיוֹן יִתֵּן קֹלוֹ בָּרָד וְגַֽחֲלֵי־אֵֽשׁ׃","וַיִּשְׁלַח חִצָּיו וַיְפִיצֵם וּבְרָקִים רָב וַיְהֻמֵּֽם׃","וַיֵּרָאוּ אֲפִיקֵי מַיִם וַֽיִּגָּלוּ מוֹסְדוֹת תֵּבֵל מִגַּעֲרָתְךָ יְהֹוָה מִנִּשְׁמַת רוּחַ אַפֶּֽךָ׃","יִשְׁלַח מִמָּרוֹם יִקָּחֵנִי יַֽמְשֵׁנִי מִמַּיִם רַבִּֽים׃","יַצִּילֵנִי מֵאֹיְבִי עָז וּמִשֹּׂנְאַי כִּֽי־אָמְצוּ מִמֶּֽנִּי׃","יְקַדְּמוּנִי בְיוֹם־אֵידִי וַֽיְהִי־יְהֹוָה לְמִשְׁעָן לִֽי׃","וַיּוֹצִיאֵנִי לַמֶּרְחָב יְחַלְּצֵנִי כִּי־חָפֵֽץ־בִּֽי׃","יִגְמְלֵנִי יְהֹוָה כְּצִדְקִי כְּבֹר יָדַי יָשִׁיב לִֽי׃","כִּֽי־שָׁמַרְתִּי דַּרְכֵי יְהֹוָה וְלֹֽא־רָשַׁעְתִּי מֵאֱלֹהָֽי׃","כִּי כׇל־מִשְׁפָּטָיו לְנֶגְדִּי וְחֻקֹּתָיו לֹא־אָסִיר מֶֽנִּי׃","וָאֱהִי תָמִים עִמּוֹ וָאֶשְׁתַּמֵּר מֵעֲוֺנִֽי׃","וַיָּֽשֶׁב־יְהֹוָה לִי כְצִדְקִי כְּבֹר יָדַי לְנֶגֶד עֵינָֽיו׃","עִם־חָסִיד תִּתְחַסָּד עִם־גְּבַר תָּמִים תִּתַּמָּֽם׃","עִם־נָבָר תִּתְבָּרָר וְעִם־עִקֵּשׁ תִּתְפַּתָּֽל׃","כִּֽי־אַתָּה עַם־עָנִי תוֹשִׁיעַ וְעֵינַיִם רָמוֹת תַּשְׁפִּֽיל׃","כִּֽי־אַתָּה תָּאִיר נֵרִי יְהֹוָה אֱלֹהַי יַגִּיהַּ חׇשְׁכִּֽי׃","כִּֽי־בְךָ אָרֻץ גְּדוּד וּבֵֽאלֹהַי אֲדַלֶּג־שֽׁוּר׃","הָאֵל תָּמִים דַּרְכּוֹ אִמְרַֽת־יְהֹוָה צְרוּפָה מָגֵן הוּא לְכֹל הַחֹסִים בּֽוֹ׃","כִּי מִי אֱלוֹהַּ מִבַּלְעֲדֵי יְהֹוָה וּמִי צוּר זוּלָתִי אֱלֹהֵֽינוּ׃","הָאֵל הַמְאַזְּרֵנִי חָיִל וַיִּתֵּן תָּמִים דַּרְכִּֽי׃","מְשַׁוֶּה רַגְלַי כָּאַיָּלוֹת וְעַל בָּמֹתַי יַעֲמִידֵֽנִי׃","מְלַמֵּד יָדַי לַמִּלְחָמָה וְֽנִחֲתָה קֶֽשֶׁת־נְחוּשָׁה זְרוֹעֹתָֽי׃","וַתִּתֶּן־לִי מָגֵן יִשְׁעֶךָ וִֽימִינְךָ תִסְעָדֵנִי וְֽעַנְוַתְךָ תַרְבֵּֽנִי׃","תַּרְחִיב צַעֲדִי תַחְתָּי וְלֹא מָעֲדוּ קַרְסֻלָּֽי׃","אֶרְדּוֹף אוֹיְבַי וְאַשִּׂיגֵם וְלֹֽא־אָשׁוּב עַד־כַּלּוֹתָֽם׃","אֶמְחָצֵם וְלֹא־יֻכְלוּ קוּם יִפְּלוּ תַּחַת רַגְלָֽי׃","וַתְּאַזְּרֵנִי חַיִל לַמִּלְחָמָה תַּכְרִיעַ קָמַי תַּחְתָּֽי׃","וְֽאֹיְבַי נָתַתָּה לִּי עֹרֶף וּמְשַׂנְאַי אַצְמִיתֵֽם׃","יְשַׁוְּעוּ וְאֵין־מוֹשִׁיעַ עַל־יְהֹוָה וְלֹא עָנָֽם׃","וְֽאֶשְׁחָקֵם כְּעָפָר עַל־פְּנֵי־רוּחַ כְּטִיט חוּצוֹת אֲרִיקֵֽם׃","תְּפַלְּטֵנִי מֵרִיבֵי עָם תְּשִׂימֵנִי לְרֹאשׁ גּוֹיִם עַם לֹא־יָדַעְתִּי יַֽעַבְדֽוּנִי׃","לְשֵׁמַֽע אֹזֶן יִשָּׁמְעוּ לִי בְּנֵֽי־נֵכָר יְכַחֲשׁוּ־לִֽי׃","בְּנֵי־נֵכָר יִבֹּלוּ וְיַחְרְגוּ מִֽמִּסְגְּרֽוֹתֵיהֶֽם׃","חַי־יְהֹוָה וּבָרוּךְ צוּרִי וְיָרוּם אֱלוֹהֵי יִשְׁעִֽי׃","הָאֵל הַנּוֹתֵן נְקָמוֹת לִי וַיַּדְבֵּר עַמִּים תַּחְתָּֽי׃","מְפַלְּטִי מֵאֹיְבָי אַף מִן־קָמַי תְּרוֹמְמֵנִי מֵאִישׁ חָמָס תַּצִּילֵֽנִי׃","עַל־כֵּן אוֹדְךָ בַגּוֹיִם יְהֹוָה וּלְשִׁמְךָ אֲזַמֵּֽרָה׃","מַגְדִּל יְשׁוּעוֹת מַלְכּוֹ וְעֹשֶׂה חֶסֶד לִמְשִׁיחוֹ לְדָוִד וּלְזַרְעוֹ עַד־עוֹלָֽם׃ {פ}"],"lat":["lamnatseach le'eved Adonai ledavid asher diber laihova et-divrei hashira hazot beiom hitsil-Adonai-oto mikaf kol-oyvaiv umiyad shaul","vayomar erchomkha Adonai chizki","Adonai sal'i umtsudati umfalti eli tsuri echese-bo magini vekeren-yish'i misgabi","mehulal ekra Adonai umin-oyvai ivashea'","afafuni chevlei-mavet venachalei veliya'al yeva'atuni","chevlei sheol sevavuni kidmuni mokshei mavet","batsar-li ekra Adonai ve'el-elohai ashavea' yishma' meheikhalo koli veshav'ati lefanaiv tavo ve'oznaiv","vatig'ash vatir'ash ha'arets umosdei harim yirgazu vayitga'ashu ki-chara lo","ala ashan be'apo ve'esh-mipiv tokhel gechalim ba'aru mimenu","vayet shamayim vayerad va'arafel tachat raglaiv","vayirkav al-keruv vaya'of vayede al-kanfei-ruach","yashet-choshekh sitro sevivotaiv sukato cheshkhat-mayim avei shechakim","minogah negdo avaiv avru barad vegachalei-esh","vayar'em bashamayim Adonai ve'elyon yiten kolo barad vegachalei-esh","vayishlach chitsaiv vayfitsem uvrakim rav vayhumem","vayerau afikei mayim vayigalu mosdot tevel miga'aratkha Adonai minishmat ruach apekha","yishlach mimarom yikacheni yamsheni mimayim rabim","yatsileni me'oyvi az umison'ai ki-amtsu mimeni","yekadmuni veiom-eidi vayhi-Adonai lemish'an li","vayotsi'eni lamerchav yechaltseni ki-chafets-bi","yigmleni Adonai ketsidki kevor yadai yashiv li","ki-shamarti darkhei Adonai velo-rasha'ti me'elohai","ki khol-mishpataiv lenegdi vechukotaiv lo-asir meni","va'ehi tamim imo va'eshtamer me'aoni","vayashev-Adonai li khetsidki kevor yadai leneged einaiv","im-chasid titchasad im-gevar tamim titamam","im-navar titbarar ve'im-ikesh titpatal","ki-ata am-ani toshia' ve'einayim ramot tashpil","ki-ata ta'ir neri Adonai elohai yagiah choshki","ki-vekha aruts gedud uvelohai adaleg-shur","ha'el tamim darko imrat-Adonai tserufa magen hu lekhol hachosim bo","ki mi eloah mibal'adei Adonai umi tsur zulati eloheinu","ha'el ham'azreni chayil vayiten tamim darki","meshave raglai ka'ayalot ve'al bamotai ya'amideni","melamed yadai lamilchama venichata keshet-nechusha zero'otai","vatiten-li magen yish'ekha viminkha tis'adeni ve'anvatkha tarbeni","tarchiv tsa'adi tachtai velo ma'adu karsulai","erdof oyvai ve'asigem velo-ashuv ad-kalotam","emchatsem velo-yukhlu kum yiplu tachat raglai","vat'azreni chayil lamilchama takhria' kamai tachtai","ve'oyvai natata li oref umsan'ai atsmitem","yeshav'u ve'ein-moshia' al-Adonai velo anam","ve'eshchakem ke'afar al-penei-ruach ketit chutsot arikem","tefalteni merivei am tesimeni lerosh goyim am lo-yada'ti ya'avduni","leshema' ozen yisham'u li benei-nekhar yekhachashu-li","benei-nekhar yibolu veyachrgu mimisgroteihem","chai-Adonai uvarukh tsuri veyarum elohei yish'i","ha'el hanoten nekamot li vayadber amim tachtai","mefalti me'oyvai af min-kamai teromemeni me'ish chamas tatsileni","al-ken odkha vagoyim Adonai ulshimkha azamera","magdil yeshu'ot malko ve'ose chesed limshicho ledavid ulzar'o ad-olam f"],"en":["For the Leader. [A Psalm] of David the servant of the LORD, who spoke unto the LORD the words of this song in the day that the LORD delivered him from the hand of all his enemies, and from the hand of Saul;","And he said: I love thee, O LORD, my strength.","The LORD is my rock, and my fortress, and my deliverer; My God, my rock, in Him I take refuge; my shield, and my horn of salvation, my high tower.","Praised, I cry, is the LORD, and I am saved from mine enemies. .","The cords of Death compassed me, and the floods of Belial assailed me.","The cords of Sheol surrounded me; the snares of Death confronted me.","In my distress I called upon the LORD, and cried unto my God; out of His temple He heard my voice, and my cry came before Him unto His ears.","Then the earth did shake and quake, the foundations also of the mountains did tremble; they were shaken, because He was wroth.","Smoke arose up in His nostrils, and fire out of His mouth did devour; coals flamed forth from Him.","He bowed the heavens also, and came down; and thick darkness was under His feet.","And He rode upon a cherub, and did fly; yea, He did swoop down upon the wings of the wind.","He made darkness His hiding-place, His pavilion round about Him; darkness of waters, thick clouds of the skies.","At the brightness before Him, there passed through His thick clouds Hailstones and coals of fire.","The LORD also thundered in the heavens, and the Most High gave forth His voice; hailstones and coals of fire.","And He sent out His arrows, and scattered them; and He shot forth lightnings, and discomfited them.","And the channels of waters appeared, and the foundations of the world were laid bare, at Thy rebuke, O LORD, at the blast of the breath of Thy nostrils.","He sent from on high, He took me; He drew me out of many waters.","He delivered me from mine enemy most strong, and from them that hated me, for they were too mighty for me.","They confronted me in the day of my calamity; but the LORD was a stay unto me.","He brought me forth also into a large place; He delivered me, because He delighted in me.","The LORD rewarded me according to my righteousness; according to the cleanness of my hands hath He recompensed me. .","For I have kept the ways of the LORD, and have not wickedly departed from my God.","For all His ordinances were before me, and I put not away His statutes from me.","And I was single-hearted with Him, and I kept myself from mine iniquity.","Therefore hath the LORD recompensed me according to my righteousness, according to the cleanness of my hands in His eyes.","With the merciful Thou dost show Thyself merciful, with the upright man Thou dost show Thyself upright;","With the pure Thou dost show Thyself pure; and with the crooked Thou dost show Thyself subtle.","For Thou dost save the afflicted people; but the haughty eyes Thou dost humble.","For Thou dost light my lamp; the LORD my God doth lighten my darkness.","For by Thee I run upon a troop; and by my God do I scale a wall.","As for God, His way is perfect; the word of the LORD is tried; He is a shield unto all them that take refuge in Him.","For who is God, save the LORD? And who is a Rock, except our God?","The God that girdeth me with strength, and maketh my way straight;","Who maketh my feet like hinds', and setteth me upon my high places;","Who traineth my hands for war, so that mine arms do bend a bow of brass.","Thou hast also given me Thy shield of salvation, and Thy right hand hath holden me up; and Thy condescension hath made me great.","Thou hast enlarged my steps under me, and my feet have not slipped.","I have pursued mine enemies, and overtaken them; neither did I turn back till they were consumed.","I have smitten them through, so that they are not able to rise; they are fallen under my feet.","For Thou hast girded me with strength unto the battle; Thou hast subdued under me those that rose up against me.","Thou hast also made mine enemies turn their backs unto me, and I did cut off them that hate me.","They cried, but there was none to save; even unto the LORD, but He answered them not.","Then did I beat them small as the dust before the wind; I did cast them out as the mire of the streets.","Thou hast delivered me from the contentions of the people; Thou hast made me the head of the nations; a people whom I have not known serve me.","As soon as they hear of me, they obey me; The sons of the stranger dwindle away before me.","The sons of the stranger fade away, and come trembling out of their close places.","The LORD liveth, and blessed be my Rock; and exalted be the God of my salvation;","Even the God that executeth vengeance for me, and subdueth peoples under me.","He delivereth me from mine enemies; yea, Thou liftest me up above them that rise up against me; Thou deliverest me from the violent man.","Therefore I will give thanks unto Thee, O LORD, among the nations, and will sing praises unto Thy name.","Great salvation giveth He to His king; and showeth mercy to His anointed, To David and to his seed, for evermore."]},{"n":19,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃","הַשָּׁמַיִם מְֽסַפְּרִים כְּבֽוֹד־אֵל וּֽמַעֲשֵׂה יָדָיו מַגִּיד הָרָקִֽיעַ׃","יוֹם לְיוֹם יַבִּיעַֽ אֹמֶר וְלַיְלָה לְּלַיְלָה יְחַוֶּה־דָּֽעַת׃","אֵֽין־אֹמֶר וְאֵין דְּבָרִים בְּלִי נִשְׁמָע קוֹלָֽם׃","בְּכׇל־הָאָרֶץ יָצָא קַוָּם וּבִקְצֵה תֵבֵל מִלֵּיהֶם לַשֶּׁמֶשׁ שָֽׂם־אֹהֶל בָּהֶֽם׃","וְהוּא כְּחָתָן יֹצֵא מֵחֻפָּתוֹ יָשִׂישׂ כְּגִבּוֹר לָרוּץ אֹֽרַח׃","מִקְצֵה הַשָּׁמַיִם מֽוֹצָאוֹ וּתְקוּפָתוֹ עַל־קְצוֹתָם וְאֵין נִסְתָּר מֵחַמָּתֽוֹ׃","תּוֹרַת יְהֹוָה תְּמִימָה מְשִׁיבַת נָפֶשׁ עֵדוּת יְהֹוָה נֶאֱמָנָה מַחְכִּימַת פֶּֽתִי׃","פִּקּוּדֵי יְהֹוָה יְשָׁרִים מְשַׂמְּחֵי־לֵב מִצְוַת יְהֹוָה בָּרָה מְאִירַת עֵינָֽיִם׃","יִרְאַת יְהֹוָה טְהוֹרָה עוֹמֶדֶת לָעַד מִֽשְׁפְּטֵי־יְהֹוָה אֱמֶת צָֽדְקוּ יַחְדָּֽו׃","הַֽנֶּחֱמָדִים מִזָּהָב וּמִפַּז רָב וּמְתוּקִים מִדְּבַשׁ וְנֹפֶת צוּפִֽים׃","גַּֽם־עַבְדְּךָ נִזְהָר בָּהֶם בְּשׇׁמְרָם עֵקֶב רָֽב׃","שְׁגִיאוֹת מִֽי־יָבִין מִֽנִּסְתָּרוֹת נַקֵּֽנִי׃","גַּם מִזֵּדִים חֲשֹׂךְ עַבְדֶּךָ אַֽל־יִמְשְׁלוּ־בִי אָז אֵיתָם וְנִקֵּיתִי מִפֶּשַֽׁע רָֽב׃","יִהְיֽוּ־לְרָצוֹן אִמְרֵי־פִי וְהֶגְיוֹן לִבִּי לְפָנֶיךָ יְהֹוָה צוּרִי וְגֹאֲלִֽי׃ {פ}"],"lat":["lamnatseach mizmor ledavid","hashamayim mesaprim kevod-el uma'ase yadaiv magid harakia'","yom leiom yabia' omer velayla lelayla yechave-da'at","ein-omer ve'ein devarim beli nishma' kolam","bekhol-ha'arets yatsa kavam uviktse tevel mileihem lashemesh sam-ohel bahem","vehu kechatan yotse mechupato yasis kegibor laruts orach","miktse hashamayim motsao utkufato al-ketsotam ve'ein nistar mechamato","torat Adonai temima meshivat nafesh edut Adonai ne'emana machkimat peti","pikudei Adonai yesharim mesamchei-lev mitsvat Adonai bara me'irat einayim","yir'at Adonai tehora omedet la'ad mishptei-Adonai emet tsadku yachdav","hanechemadim mizahav umipaz rav umtukim midvash venofet tsufim","gam-avdkha nizhar bahem beshomram ekev rav","shegiot mi-yavin ministarot nakeni","gam mizedim chasokh avdekha al-yimshlu-vi az eitam venikeiti mipesha' rav","yihyu-leratson imrei-fi vehegyon libi lefaneikha Adonai tsuri vego'ali f"],"en":["For the Leader. A Psalm of David.","The heavens declare the glory of God, and the firmament showeth His handiwork;","Day unto day uttereth speech, and night unto night revealeth knowledge;","There is no speech, there are no words, neither is their voice heard.","Their line is gone out through all the earth, and their words to the end of the world. In them hath He set a tent for the sun,","Which is as a bridegroom coming out of his chamber, and rejoiceth as a strong man to run his course.","His going forth is from the end of the heaven, and his circuit unto the ends of it; and there is nothing hid from the heat thereof.","The law of the LORD is perfect, restoring the soul; the testimony of the LORD is sure, making wise the simple. .","The precepts of the LORD are right, rejoicing the heart; the commandment of the LORD is pure, enlightening the eyes.","The fear of the LORD is clean, enduring for ever; the ordinances of the LORD are true, they are righteous altogether;","More to be desired are they than gold, yea, than much fine gold; sweeter also than honey and the honeycomb.","Moreover by them is Thy servant warned; in keeping of them there is great reward.","Who can discern his errors? Clear Thou me from hidden faults.","Keep back Thy servant also from presumptuous sins, that they may not have dominion over me; then shall I be faultless, and I shall be clear from great transgression.","Let the words of my mouth and the meditation of my heart be acceptable before Thee, O LORD, my Rock, and my Redeemer."]},{"n":20,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃","יַֽעַנְךָ יְהֹוָה בְּיוֹם צָרָה יְשַׂגֶּבְךָ שֵׁם אֱלֹהֵי יַעֲקֹֽב׃","יִשְׁלַֽח־עֶזְרְךָ מִקֹּדֶשׁ וּמִצִּיּוֹן יִסְעָדֶֽךָּ׃","יִזְכֹּר כׇּל־מִנְחֹתֶךָ וְעוֹלָתְךָ יְדַשְּׁנֶה סֶֽלָה׃","יִֽתֶּן־לְךָ כִלְבָבֶךָ וְֽכׇל־עֲצָתְךָ יְמַלֵּֽא׃","נְרַנְּנָה בִּישׁוּעָתֶךָ וּבְשֵֽׁם־אֱלֹהֵינוּ נִדְגֹּל יְמַלֵּא יְהֹוָה כׇּל־מִשְׁאֲלוֹתֶֽיךָ׃","עַתָּה יָדַעְתִּי כִּי הוֹשִׁיעַ יְהֹוָה מְשִׁיחוֹ יַעֲנֵהוּ מִשְּׁמֵי קׇדְשׁוֹ בִּגְבֻרוֹת יֵשַׁע יְמִינֽוֹ׃","אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים וַאֲנַחְנוּ בְּשֵׁם־יְהֹוָה אֱלֹהֵינוּ נַזְכִּֽיר׃","הֵמָּה כָּרְעוּ וְנָפָלוּ וַאֲנַחְנוּ קַּמְנוּ וַנִּתְעוֹדָֽד׃","יְהֹוָה הוֹשִׁיעָה הַמֶּלֶךְ יַעֲנֵנוּ בְיוֹם־קׇרְאֵֽנוּ׃ {פ}"],"lat":["lamnatseach mizmor ledavid","ya'ankha Adonai beiom tsara yesagevkha shem elohei ya'akov","yishlach-ezrkha mikodesh umitsiyon yis'adeka","yizkor kol-minchotekha ve'olatkha yedashne sela","yiten-lekha khilvavekha vekhol-atsatkha yemale","neranena bishu'atekha uvshem-eloheinu nidgol yemale Adonai kol-mish'aloteikha","ata yada'ti ki hoshia' Adonai meshicho ya'anehu mishmei kodsho bigvurot yesha' yemino","ele varekhev ve'ele vasusim va'anachnu beshem-Adonai eloheinu nazkir","hema kar'u venafalu va'anachnu kamnu vanit'odad","Adonai hoshi'a hamelekh ya'anenu veiom-kor'enu f"],"en":["For the Leader. A Psalm of David.","The LORD answer thee in the day of trouble; The name of the God of Jacob set thee up on high;","Send forth thy help from the sanctuary, And support thee out of Zion;","Receive the memorial of all thy meal-offerings, And accept the fat of thy burnt-sacrifice; Selah","Grant thee according to thine own heart, And fulfil all thy counsel.","We will shout for joy in thy victory, And in the name of our God we will set up our standards; The LORD fulfil all thy petitions.","Now know I that the LORD saveth His anointed; He will answer him from His holy heaven With the mighty acts of His saving right hand.","Some trust in chariots, and some in horses; But we will make mention of the name of the LORD our God.","They are bowed down and fallen; But we are risen, and stand upright.","Save, LORD; Let the King answer us in the day that we call."]},{"n":21,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃","יְֽהֹוָה בְּעׇזְּךָ יִשְׂמַח־מֶלֶךְ וּבִישׁוּעָתְךָ מַה־[יָּגֶל] (יגיל) מְאֹֽד׃","תַּאֲוַת לִבּוֹ נָתַתָּה לּוֹ וַאֲרֶשֶׁת שְׂפָתָיו בַּל־מָנַעְתָּ סֶּֽלָה׃","כִּֽי־תְקַדְּמֶנּוּ בִּרְכוֹת טוֹב תָּשִׁית לְרֹאשׁוֹ עֲטֶרֶת פָּֽז׃","חַיִּים שָׁאַל מִמְּךָ נָתַתָּה לּוֹ אֹרֶךְ יָמִים עוֹלָם וָעֶֽד׃","גָּדוֹל כְּבוֹדוֹ בִּישׁוּעָתֶךָ הוֹד וְהָדָר תְּשַׁוֶּה עָלָֽיו׃","כִּֽי־תְשִׁיתֵהוּ בְרָכוֹת לָעַד תְּחַדֵּהוּ בְשִׂמְחָה אֶת־פָּנֶֽיךָ׃","כִּֽי־הַמֶּלֶךְ בֹּטֵחַ בַּיהֹוָה וּבְחֶסֶד עֶלְיוֹן בַּל־יִמּֽוֹט׃","תִּמְצָא יָדְךָ לְכׇל־אֹיְבֶיךָ יְמִֽינְךָ תִּמְצָא שֹׂנְאֶֽיךָ׃","תְּשִׁיתֵמוֹ כְּתַנּוּר אֵשׁ לְעֵת פָּנֶיךָ יְהֹוָה בְּאַפּוֹ יְבַלְּעֵם וְֽתֹאכְלֵם אֵֽשׁ׃","פִּרְיָמוֹ מֵאֶרֶץ תְּאַבֵּד וְזַרְעָם מִבְּנֵי אָדָֽם׃","כִּי־נָטוּ עָלֶיךָ רָעָה חָֽשְׁבוּ מְזִמָּה בַּל־יוּכָֽלוּ׃","כִּי תְּשִׁיתֵמוֹ שֶׁכֶם בְּמֵֽיתָרֶיךָ תְּכוֹנֵן עַל־פְּנֵיהֶֽם׃","רוּמָה יְהֹוָה בְּעֻזֶּךָ נָשִׁירָה וּֽנְזַמְּרָה גְּבוּרָתֶֽךָ׃ {פ}"],"lat":["lamnatseach mizmor ledavid","Adonai be'ozkha yismach-melekh uvishu'atkha ma-yagel ygyl me'od","ta'avat libo natata lo va'areshet sefataiv bal-mana'ta sela","ki-tekadmenu birkhot tov tashit lerosho ateret paz","chayim sha'al mimkha natata lo orekh yamim olam va'ed","gadol kevodo bishu'atekha hod vehadar teshave alaiv","ki-teshitehu verakhot la'ad techadehu vesimcha et-paneikha","ki-hamelekh boteach baihova uvchesed elyon bal-yimot","timtsa yadkha lekhol-oyveikha yeminkha timtsa son'eikha","teshitemo ketanur esh le'et paneikha Adonai be'apo yeval'em vetokhlem esh","piryamo me'erets te'abed vezar'am mibnei adam","ki-natu aleikha ra'a chashvu mezima bal-yukhalu","ki teshitemo shekhem bemeitareikha tekhonen al-peneihem","ruma Adonai be'uzekha nashira unzamra gevuratekha f"],"en":["For the Leader. A Psalm of David.","O LORD, in Thy strength the king rejoiceth; and in Thy salvation how greatly doth he exult!","Thou hast given him his heart's desire, and the request of his lips Thou hast not withholden. Selah","For Thou meetest him with choicest blessings; Thou settest a crown of fine gold on his head.","He asked life of Thee, Thou gavest it him; even length of days for ever and ever.","His glory is great through Thy salvation; Honour and majesty dost Thou lay upon him.","For Thou makest him most blessed for ever; Thou makest him glad with joy in Thy presence.","For the king trusteth in the LORD, yea, in the mercy of the Most High; he shall not be moved.","Thy hand shall be equal to all thine enemies; Thy right hand shall overtake those that hate thee.","Thou shalt make them as a fiery furnace in the time of thine anger; The LORD shall swallow them up in His wrath, and the fire shall devour them.","Their fruit shalt thou destroy from the earth, and their seed from among the children of men.","For they intended evil against thee, They imagined a device, wherewith they shall not prevail.","For thou shalt make them turn their back, Thou shalt make ready with thy bowstrings against the face of them.","Be Thou exalted, O LORD, in Thy strength; so will we sing and praise Thy power."]},{"n":22,"he":["לַמְנַצֵּחַ עַל־אַיֶּלֶת הַשַּׁחַר מִזְמוֹר לְדָוִֽד׃","אֵלִי אֵלִי לָמָה עֲזַבְתָּנִי רָחוֹק מִֽישׁוּעָתִי דִּבְרֵי שַׁאֲגָתִֽי׃","אֱֽלֹהַי אֶקְרָא יוֹמָם וְלֹא תַעֲנֶה וְלַיְלָה וְֽלֹא־דֻֽמִיָּה לִֽי׃","וְאַתָּה קָדוֹשׁ יוֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵֽל׃","בְּךָ בָּטְחוּ אֲבֹתֵינוּ בָּטְחוּ וַֽתְּפַלְּטֵֽמוֹ׃","אֵלֶיךָ זָעֲקוּ וְנִמְלָטוּ בְּךָ בָטְחוּ וְלֹא־בֽוֹשׁוּ׃","וְאָנֹכִי תוֹלַעַת וְלֹא־אִישׁ חֶרְפַּת אָדָם וּבְזוּי עָֽם׃","כׇּל־רֹאַי יַלְעִגוּ לִי יַפְטִירוּ בְשָׂפָה יָנִיעוּ רֹֽאשׁ׃","גֹּל אֶל־יְהֹוָה יְפַלְּטֵהוּ יַצִּילֵהוּ כִּי־חָפֵֽץ־בּֽוֹ׃","כִּֽי־אַתָּה גֹחִי מִבָּטֶן מַבְטִיחִי עַל־שְׁדֵי אִמִּֽי׃","עָלֶיךָ הׇשְׁלַכְתִּי מֵרָחֶם מִבֶּטֶן אִמִּי אֵלִי אָֽתָּה׃","אַל־תִּרְחַק מִמֶּנִּי כִּי־צָרָה קְרוֹבָה כִּי־אֵין עוֹזֵֽר׃","סְבָבוּנִי פָּרִים רַבִּים אַבִּירֵי בָשָׁן כִּתְּרֽוּנִי׃","פָּצוּ עָלַי פִּיהֶם אַרְיֵה טֹרֵף וְשֹׁאֵֽג׃","כַּמַּיִם נִשְׁפַּכְתִּי וְהִתְפָּֽרְדוּ כׇּֽל־עַצְמוֹתָי הָיָה לִבִּי כַּדּוֹנָג נָמֵס בְּתוֹךְ מֵעָֽי׃","יָבֵשׁ כַּחֶרֶשׂ כֹּחִי וּלְשׁוֹנִי מֻדְבָּק מַלְקוֹחָי וְֽלַעֲפַר־מָוֶת תִּשְׁפְּתֵֽנִי׃","כִּי סְבָבוּנִי כְּלָבִים עֲדַת מְרֵעִים הִקִּיפוּנִי כָּאֲרִי יָדַי וְרַגְלָֽי׃","אֲסַפֵּר כׇּל־עַצְמוֹתָי הֵמָּה יַבִּיטוּ יִרְאוּ־בִֽי׃","יְחַלְּקוּ בְגָדַי לָהֶם וְעַל־לְבוּשִׁי יַפִּילוּ גוֹרָֽל׃","וְאַתָּה יְהֹוָה אַל־תִּרְחָק אֱיָלוּתִי לְעֶזְרָתִי חֽוּשָׁה׃","הַצִּילָה מֵחֶרֶב נַפְשִׁי מִיַּד־כֶּלֶב יְחִידָתִֽי׃","הוֹשִׁיעֵנִי מִפִּי אַרְיֵה וּמִקַּרְנֵי רֵמִים עֲנִיתָֽנִי׃","אֲסַפְּרָה שִׁמְךָ לְאֶחָי בְּתוֹךְ קָהָל אֲהַלְלֶֽךָּ׃","יִרְאֵי יְהֹוָה הַֽלְלוּהוּ כׇּל־זֶרַע יַעֲקֹב כַּבְּדוּהוּ וְגוּרוּ מִמֶּנּוּ כׇּל־זֶרַע יִשְׂרָאֵֽל׃","כִּי לֹֽא־בָזָה וְלֹא שִׁקַּץ עֱנוּת עָנִי וְלֹא־הִסְתִּיר פָּנָיו מִמֶּנּוּ וּֽבְשַׁוְּעוֹ אֵלָיו שָׁמֵֽעַ׃","מֵאִתְּךָ תְּֽהִלָּתִי בְּקָהָל רָב נְדָרַי אֲשַׁלֵּם נֶגֶד יְרֵאָֽיו׃","יֹאכְלוּ עֲנָוִים וְיִשְׂבָּעוּ יְהַֽלְלוּ יְהֹוָה דֹּרְשָׁיו יְחִי לְבַבְכֶם לָעַֽד׃","יִזְכְּרוּ וְיָשֻׁבוּ אֶל־יְהֹוָה כׇּל־אַפְסֵי־אָרֶץ וְיִֽשְׁתַּחֲווּ לְפָנֶיךָ כׇּֽל־מִשְׁפְּחוֹת גּוֹיִֽם׃","כִּי לַיהֹוָה הַמְּלוּכָה וּמֹשֵׁל בַּגּוֹיִֽם׃","אָכְלוּ וַיִּֽשְׁתַּחֲווּ כׇּֽל־דִּשְׁנֵי־אֶרֶץ לְפָנָיו יִכְרְעוּ כׇּל־יוֹרְדֵי עָפָר וְנַפְשׁוֹ לֹא חִיָּֽה׃","זֶרַע יַֽעַבְדֶנּוּ יְסֻפַּר לַֽאדֹנָי לַדּֽוֹר׃","יָבֹאוּ וְיַגִּידוּ צִדְקָתוֹ לְעַם נוֹלָד כִּי עָשָֽׂה׃ {פ}"],"lat":["lamnatseach al-ayelet hashachar mizmor ledavid","eli eli lama azavtani rachok mishu'ati divrei sha'agati","elohai ekra yomam velo ta'ane velayla velo-dumiya li","ve'ata kadosh yoshev tehilot yisra'el","bekha batchu avoteinu batchu vatfaltemo","eleikha za'aku venimlatu bekha vatchu velo-voshu","ve'anokhi tola'at velo-ish cherpat adam uvzuy am","kol-ro'ai yal'igu li yaftiru vesafa yani'u rosh","gol el-Adonai yefaltehu yatsilehu ki-chafets-bo","ki-ata gochi mibaten mavtichi al-shedei imi","aleikha hoshlakhti merachem mibeten imi eli ata","al-tirchak mimeni ki-tsara kerova ki-ein ozer","sevavuni parim rabim abirei vashan kitruni","patsu alai pihem arye toref vesho'eg","kamayim nishpakhti vehitpardu kol-atsmotai haya libi kadonag names betokh me'ai","yavesh kacheres kochi ulshoni mudbak malkochai vela'afar-mavet tishpteni","ki sevavuni kelavim adat mere'im hikifuni ka'ari yadai veraglai","asaper kol-atsmotai hema yabitu yiru-vi","yechalku vegadai lahem ve'al-levushi yapilu goral","ve'ata Adonai al-tirchak eyaluti le'ezrati chusha","hatsila mecherev nafshi miyad-kelev yechidati","hoshi'eni mipi arye umikarnei remim anitani","asapra shimkha le'echai betokh kahal ahaleleka","yir'ei Adonai haleluhu kol-zera' ya'akov kabduhu veguru mimenu kol-zera' yisra'el","ki lo-vaza velo shikats enut ani velo-histir panaiv mimenu uvshav'o elaiv shamea'","me'itkha tehilati bekahal rav nedarai ashalem neged yere'aiv","yokhlu anavim veyisba'u yehalelu Adonai dorshaiv yechi levavkhem la'ad","yizkru veyashuvu el-Adonai kol-afsei-arets veyishtachavu lefaneikha kol-mishpchot goyim","ki laihova hamlukha umoshel bagoyim","akhlu vayishtachavu kol-dishnei-erets lefanaiv yikhr'u kol-yordei afar venafsho lo chiya","zera' ya'avdenu yesupar ladonai lador","yavou veyagidu tsidkato le'am nolad ki asa f"],"en":["For the Leader; upon Aijeleth ha-Shahar. A Psalm of David.","My God, my God, why hast Thou forsaken me, and art far from my help at the words of my cry?","O my God, I call by day, but Thou answerest not; and at night, and there is no surcease for me.","Yet Thou art holy, O Thou that art enthroned upon the praises of Israel.","In Thee did our fathers trust; they trusted, and Thou didst deliver them.","Unto Thee they cried, and escaped; in Thee did they trust, and were not ashamed.","But I am a worm, and no man; a reproach of men, and despised of the people.","All they that see me laugh me to scorn; they shoot out the lip, they shake the head:","'Let him commit himself unto the LORD! let Him rescue him; let Him deliver him, seeing He delighteth in him.'","For Thou art He that took me out of the womb; Thou madest me trust when I was upon my mother's breasts.","Upon Thee I have been cast from my birth; Thou art my God from my mother's womb.","Be not far from me; for trouble is near; for there is none to help.","Many bulls have encompassed me; strong bulls of Bashan have beset me round.","They open wide their mouth against me, as a ravening and a roaring lion.","I am poured out like water, and all my bones are out of joint; my heart is become like wax; it is melted in mine inmost parts.","My strength is dried up like a potsherd; and my tongue cleaveth to my throat; and Thou layest me in the dust of death.","For dogs have encompassed me; a company of evil-doers have inclosed me; like a lion, they are at my hands and my feet.","I may count all my bones; they look and gloat over me.","They part my garments among them, and for my vesture do they cast lots.","But Thou, O LORD, be not far off; O Thou my strength, hasten to help me.","Deliver my soul from the sword; mine only one from the power of the dog.","Save me from the lion's mouth; yea, from the horns of the wild-oxen do Thou answer me.","I will declare Thy name unto my brethren; in the midst of the congregation will I praise Thee.","'Ye that fear the LORD, praise Him; all ye the seed of Jacob, glorify Him; and stand in awe of Him, all ye the seed of Israel.","For He hath not despised nor abhorred the lowliness of the poor; neither hath He hid His face from him; but when he cried unto Him, He heard.'","From Thee cometh my praise in the great congregation; I will pay my vows before them that fear Him.","Let the humble eat and be satisfied; let them praise the LORD that seek after Him; may your heart be quickened for ever!","All the ends of the earth shall remember and turn unto the LORD; and all the kindreds of the nations shall worship before Thee.","For the kingdom is the LORD’S; and He is the ruler over the nations.","All the fat ones of the earth shall eat and worship; all they that go down to the dust shall kneel before Him, even he that cannot keep his soul alive.","A seed shall serve him; It shall be told of the Lord unto the next generation.","They shall come and shall declare His righteousness Unto a people that shall be born, that He hath done it."]},{"n":23,"he":["מִזְמוֹר לְדָוִד יְהֹוָה רֹעִי לֹא אֶחְסָֽר׃","בִּנְאוֹת דֶּשֶׁא יַרְבִּיצֵנִי עַל־מֵי מְנֻחוֹת יְנַהֲלֵֽנִי׃","נַפְשִׁי יְשׁוֹבֵב יַֽנְחֵנִי בְמַעְגְּלֵי־צֶדֶק לְמַעַן שְׁמֽוֹ׃","גַּם כִּֽי־אֵלֵךְ בְּגֵיא צַלְמָוֶת לֹא־אִירָא רָע כִּי־אַתָּה עִמָּדִי שִׁבְטְךָ וּמִשְׁעַנְתֶּךָ הֵמָּה יְנַֽחֲמֻֽנִי׃","תַּעֲרֹךְ לְפָנַי שֻׁלְחָן נֶגֶד צֹרְרָי דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי כּוֹסִי רְוָיָֽה׃","אַךְ טוֹב וָחֶסֶד יִרְדְּפוּנִי כׇּל־יְמֵי חַיָּי וְשַׁבְתִּי בְּבֵית־יְהֹוָה לְאֹרֶךְ יָמִֽים׃ {פ}"],"lat":["mizmor ledavid Adonai ro'i lo echsar","binot deshe yarbitseni al-mei menuchot yenahaleni","nafshi yeshovev yancheni vema'glei-tsedek lema'an shemo","gam ki-elekh begei tsalmavet lo-ira ra' ki-ata imadi shivtkha umish'antekha hema yenachamuni","ta'arokh lefanai shulchan neged tsorerai dishanta vashemen roshi kosi revaya","akh tov vachesed yirdfuni kol-yemei chayai veshavti beveit-Adonai le'orekh yamim f"],"en":["A Psalm of David. The LORD is my shepherd; I shall not want.","He maketh me to lie down in green pastures; He leadeth me beside the still waters.","He restoreth my soul; He guideth me in straight paths for His name's sake.","Yea, though I walk through the valley of the shadow of death, I will fear no evil, for Thou art with me; Thy rod and Thy staff, they comfort me.","Thou preparest a table before me in the presence of mine enemies; Thou hast anointed my head with oil; my cup runneth over.","Surely goodness and mercy shall follow me all the days of my life; And I shall dwell in the house of the LORD for ever."]},{"n":24,"he":["לְדָוִד מִזְמוֹר לַֽיהֹוָה הָאָרֶץ וּמְלוֹאָהּ תֵּבֵל וְיֹשְׁבֵי בָֽהּ׃","כִּי־הוּא עַל־יַמִּים יְסָדָהּ וְעַל־נְהָרוֹת יְכוֹנְנֶֽהָ׃","מִֽי־יַעֲלֶה בְהַר־יְהֹוָה וּמִי־יָקוּם בִּמְקוֹם קׇדְשֽׁוֹ׃","נְקִי כַפַּיִם וּֽבַר־לֵבָב אֲשֶׁר לֹא־נָשָׂא לַשָּׁוְא נַפְשִׁי וְלֹא נִשְׁבַּע לְמִרְמָֽה׃","יִשָּׂא בְרָכָה מֵאֵת יְהֹוָה וּצְדָקָה מֵאֱלֹהֵי יִשְׁעֽוֹ׃","זֶה דּוֹר דֹּרְשָׁו מְבַקְשֵׁי פָנֶיךָ יַעֲקֹב סֶֽלָה׃","שְׂאוּ שְׁעָרִים רָֽאשֵׁיכֶם וְֽהִנָּשְׂאוּ פִּתְחֵי עוֹלָם וְיָבוֹא מֶלֶךְ הַכָּבֽוֹד׃","מִי זֶה מֶלֶךְ הַכָּבוֹד יְהֹוָה עִזּוּז וְגִבּוֹר יְהֹוָה גִּבּוֹר מִלְחָמָֽה׃","שְׂאוּ שְׁעָרִים רָֽאשֵׁיכֶם וּשְׂאוּ פִּתְחֵי עוֹלָם וְיָבֹא מֶלֶךְ הַכָּבֽוֹד׃","מִי־הוּא זֶה מֶלֶךְ הַכָּבוֹד יְהֹוָה צְבָאוֹת הוּא מֶלֶךְ הַכָּבוֹד סֶֽלָה׃ {פ}"],"lat":["ledavid mizmor laihova ha'arets umlo'ah tevel veyoshvei vah","ki-hu al-yamim yesadah ve'al-neharot yekhoneneah","mi-ya'ale vehar-Adonai umi-yakum bimkom kodsho","neki khapayim uvar-levav asher lo-nasa lashav nafshi velo nishba' lemirma","yisa verakha me'et Adonai utsdaka me'elohei yish'o","ze dor dorshav mevakshei faneikha ya'akov sela","seu she'arim rasheikhem vehinasu pitchei olam veyavo melekh hakavod","mi ze melekh hakavod Adonai izuz vegibor Adonai gibor milchama","seu she'arim rasheikhem usu pitchei olam veyavo melekh hakavod","mi-hu ze melekh hakavod Adonai tsevaot hu melekh hakavod sela f"],"en":["A Psalm of David. The earth is the LORD’S, and the fulness thereof; the world, and they that dwell therein.","For He hath founded it upon the seas, and established it upon the floods.","Who shall ascend into the mountain of the LORD? And who shall stand in His holy place?","He that hath clean hands, and a pure heart; Who hath not taken My name in vain, and hath not sworn deceitfully.","He shall receive a blessing from the LORD, and righteousness from the God of his salvation.","Such is the generation of them that seek after Him, that seek Thy face, even Jacob. Selah","Lift up your heads, O ye gates, and be ye lifted up, ye everlasting doors; that the King of glory may come in.","'Who is the King of glory?' 'The LORD strong and mighty, The LORD mighty in battle.'","Lift up your heads, O ye gates, Yea, lift them up, ye everlasting doors; That the King of glory may come in.","'Who then is the King of glory?' 'The LORD of hosts; He is the King of glory.' Selah"]},{"n":25,"he":["לְדָוִד אֵלֶיךָ יְהֹוָה נַפְשִׁי אֶשָּֽׂא׃","אֱֽלֹהַי בְּךָ בָטַחְתִּי אַל־אֵבוֹשָׁה אַל־יַעַלְצוּ אוֹיְבַי לִֽי׃","גַּם כׇּל־קֹוֶיךָ לֹא יֵבֹשׁוּ יֵבֹשׁוּ הַבּוֹגְדִים רֵיקָֽם׃","דְּרָכֶיךָ יְהֹוָה הוֹדִיעֵנִי אֹרְחוֹתֶיךָ לַמְּדֵֽנִי׃","הַדְרִיכֵנִי בַאֲמִתֶּךָ וְֽלַמְּדֵנִי כִּֽי־אַתָּה אֱלֹהֵי יִשְׁעִי אוֹתְךָ קִוִּיתִי כׇּל־הַיּֽוֹם׃","זְכֹר־רַחֲמֶיךָ יְהֹוָה וַחֲסָדֶיךָ כִּי מֵעוֹלָם הֵֽמָּה׃","חַטֹּאות נְעוּרַי וּפְשָׁעַי אַל־תִּזְכֹּר כְּחַסְדְּךָ זְכׇר־לִי־אַתָּה לְמַעַן טוּבְךָ יְהֹוָֽה׃","טוֹב־וְיָשָׁר יְהֹוָה עַל־כֵּן יוֹרֶה חַטָּאִים בַּדָּֽרֶךְ׃","יַדְרֵךְ עֲנָוִים בַּמִּשְׁפָּט וִילַמֵּד עֲנָוִים דַּרְכּֽוֹ׃","כׇּל־אׇרְחוֹת יְהֹוָה חֶסֶד וֶאֱמֶת לְנֹצְרֵי בְרִיתוֹ וְעֵדֹתָֽיו׃","לְמַֽעַן־שִׁמְךָ יְהֹוָה וְֽסָלַחְתָּ לַעֲוֺנִי כִּי רַב־הֽוּא׃","מִי־זֶה הָאִישׁ יְרֵא יְהֹוָה יוֹרֶנּוּ בְּדֶרֶךְ יִבְחָֽר׃","נַפְשׁוֹ בְּטוֹב תָּלִין וְזַרְעוֹ יִירַשׁ אָֽרֶץ׃","סוֹד יְהֹוָה לִירֵאָיו וּבְרִיתוֹ לְהוֹדִיעָֽם׃","עֵינַי תָּמִיד אֶל־יְהֹוָה כִּי הֽוּא־יוֹצִיא מֵרֶשֶׁת רַגְלָֽי׃","פְּנֵֽה־אֵלַי וְחׇנֵּנִי כִּֽי־יָחִיד וְעָנִי אָֽנִי׃","צָרוֹת לְבָבִי הִרְחִיבוּ מִמְּצוּקוֹתַי הוֹצִיאֵֽנִי׃","רְאֵה עׇנְיִי וַעֲמָלִי וְשָׂא לְכׇל־חַטֹּאותָֽי׃","רְאֵֽה־אֹיְבַי כִּי־רָבּוּ וְשִׂנְאַת חָמָס שְׂנֵאֽוּנִי׃","שׇׁמְרָה נַפְשִׁי וְהַצִּילֵנִי אַל־אֵבוֹשׁ כִּֽי־חָסִיתִי בָֽךְ׃","תֹּם־וָיֹשֶׁר יִצְּרוּנִי כִּי קִוִּיתִֽיךָ׃","פְּדֵה אֱלֹהִים אֶת־יִשְׂרָאֵל מִכֹּל צָרוֹתָֽיו׃ {פ}"],"lat":["ledavid eleikha Adonai nafshi esa","elohai bekha vatachti al-evosha al-ya'altsu oyvai li","gam kol-koveikha lo yevoshu yevoshu habogdim reikam","derakheikha Adonai hodi'eni orchoteikha lamdeni","hadrikheni va'amitekha velamdeni ki-ata elohei yish'i otkha kiviti kol-hayom","zekhor-rachameikha Adonai vachasadeikha ki me'olam hema","chatovt ne'urai ufsha'ai al-tizkor kechasdkha zekhor-li-ata lema'an tuvkha Adonai","tov-veyashar Adonai al-ken yore chata'im badarekh","yadrekh anavim bamishpat vilamed anavim darko","kol-orchot Adonai chesed ve'emet lenotsrei verito ve'edotaiv","lema'an-shimkha Adonai vesalachta la'aoni ki rav-hu","mi-ze ha'ish yere Adonai yorenu bederekh yivchar","nafsho betov talin vezar'o yirash arets","sod Adonai lire'aiv uvrito lehodi'am","einai tamid el-Adonai ki hu-yotsi mereshet raglai","pene-elai vechoneni ki-yachid ve'ani ani","tsarot levavi hirchivu mimtsukotai hotsi'eni","re'e onyi va'amali vesa lekhol-chatovtai","re'e-oyvai ki-rabu vesin'at chamas seneuni","shomra nafshi vehatsileni al-evosh ki-chasiti vakh","tom-vayosher yitsruni ki kivitikha","pede elohim et-yisra'el mikol tsarotaiv f"],"en":["[A Psalm] of David. Unto Thee, O LORD, do I lift up my soul.","O my God, in Thee have I trusted, let me not be ashamed; Let not mine enemies triumph over me.","Yea, none that wait for Thee shall be ashamed; They shall be ashamed that deal treacherously without cause.","Show me Thy ways, O LORD; teach me Thy paths.","Guide me in Thy truth, and teach me; For Thou art the God of my salvation; For Thee do I wait all the day.","Remember, O LORD, Thy compassions and Thy mercies; For they have been from of old.","Remember not the sins of my youth, nor my transgressions; According to Thy mercy remember Thou me, For Thy goodness' sake, O LORD.","Good and upright is the LORD; Therefore doth He instruct sinners in the way.","He guideth The humble in justice; And He teacheth the humble His way.","All the paths of the LORD are mercy and truth Unto such as
