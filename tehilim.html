evatim shivtei-yah edut leyisra'el lehodot leshem Adonai","ki shama yashvu khisot lemishpat kisot leveit david","sha'alu shelom yerushalam yishlaiu ohavayikh","yehi-shalom becheilekh shalva be'armnotayikh","lema'an achai vere'ai adabra-na shalom bakh","lema'an beit-Adonai eloheinu avaksha tov lakh f"],"en":["A Song of Ascents; of David. I rejoiced when they said unto me: 'Let us go unto the house of the LORD.'","Our feet are standing within thy gates, O Jerusalem;","Jerusalem, that art builded as a city that is compact together;","Whither the tribes went up, even the tribes of the LORD, as a testimony unto Israel, to give thanks unto the name of the LORD.","For there were set thrones for judgment, the thrones of the house of David.","Pray for the peace of Jerusalem; May they prosper that love thee.","Peace be within thy walls, and prosperity within thy palaces.","For my brethren and companions' sakes, I will now say: 'Peace be within thee.'","For the sake of the house of the LORD our God I will seek thy good."]},{"n":123,"he":["שִׁיר הַֽמַּעֲלוֹת אֵלֶיךָ נָשָׂאתִי אֶת־עֵינַי הַיֹּשְׁבִי בַּשָּׁמָֽיִם׃","הִנֵּה כְעֵינֵי עֲבָדִים אֶל־יַד אֲֽדוֹנֵיהֶם כְּעֵינֵי שִׁפְחָה אֶל־יַד גְּבִרְתָּהּ כֵּן עֵינֵינוּ אֶל־יְהֹוָה אֱלֹהֵינוּ עַד שֶׁיְּחׇנֵּֽנוּ׃","חׇנֵּנוּ יְהֹוָה חׇנֵּנוּ כִּי־רַב שָׂבַעְנוּ בֽוּז׃","רַבַּת שָֽׂבְעָה־לָּהּ נַפְשֵׁנוּ הַלַּעַג הַשַּֽׁאֲנַנִּים הַבּוּז (לגאיונים) [לִגְאֵי יוֹנִֽים]׃ {פ}"],"lat":["shir hama'alot eleikha nasati et-einai hayoshvi bashamayim","hine khe'einei avadim el-yad adoneihem ke'einei shifcha el-yad gevirtah ken eineinu el-Adonai eloheinu ad sheychonenu","chonenu Adonai chonenu ki-rav sava'nu vuz","rabat sav'a-lah nafshenu hala'ag hasha'ananim habuz lgyvnym lig'ei yonim f"],"en":["A Song of Ascents. Unto Thee I lift up mine eyes, O Thou that art enthroned in the heavens.","Behold, as the eyes of servants unto the hand of their master, As the eyes of a maiden unto the hand of her mistress; So our eyes look unto the LORD our God, Until He be gracious unto us.","Be gracious unto us, O LORD, be gracious unto us; For we are full sated with contempt.","Our soul is full sated With the scorning of those that are at ease, And with the contempt of the proud oppressors."]},{"n":124,"he":["שִׁיר הַֽמַּעֲלוֹת לְדָוִד לוּלֵי יְהֹוָה שֶׁהָיָה לָנוּ יֹאמַר־נָא יִשְׂרָאֵֽל׃","לוּלֵי יְהֹוָה שֶׁהָיָה לָנוּ בְּקוּם עָלֵינוּ אָדָֽם׃","אֲזַי חַיִּים בְּלָעוּנוּ בַּחֲרוֹת אַפָּם בָּֽנוּ׃","אֲזַי הַמַּיִם שְׁטָפוּנוּ נַחְלָה עָבַר עַל־נַפְשֵֽׁנוּ׃","אֲזַי עָבַר עַל־נַפְשֵׁנוּ הַמַּיִם הַזֵּידוֹנִֽים׃","בָּרוּךְ יְהֹוָה שֶׁלֹּא נְתָנָנוּ טֶרֶף לְשִׁנֵּיהֶֽם׃","נַפְשֵׁנוּ כְּצִפּוֹר נִמְלְטָה מִפַּח יוֹקְשִׁים הַפַּח נִשְׁבָּר וַאֲנַחְנוּ נִמְלָֽטְנוּ׃","עֶזְרֵנוּ בְּשֵׁם יְהֹוָה עֹשֵׂה שָׁמַיִם וָאָֽרֶץ׃ {פ}"],"lat":["shir hama'alot ledavid lulei Adonai shehaya lanu yomar-na yisra'el","lulei Adonai shehaya lanu bekum aleinu adam","azai chayim bela'unu bacharot apam banu","azai hamayim shetafunu nachla avar al-nafshenu","azai avar al-nafshenu hamayim hazeidonim","barukh Adonai shelo netananu teref leshineihem","nafshenu ketsipor nimlta mipach yokshim hapach nishbar va'anachnu nimlatnu","ezrenu beshem Adonai ose shamayim va'arets f"],"en":["A Song of Ascents; of David. 'If it had not been the LORD who was for us', Let Israel now say;","'If it had not been the LORD who was for us, When men rose up against us,","Then they had swallowed us up alive, when their wrath was kindled against us;","Then the waters had overwhelmed us, the stream had gone over our soul;","Then the proud waters Had gone over our soul.'","Blessed be the LORD, who hath not given us as a prey to their teeth.","Our soul is escaped as a bird out of the snare of the fowlers; The snare is broken, and we are escaped.","Our help is in the name of the LORD, Who made heaven and earth."]},{"n":125,"he":["שִׁיר הַֽמַּעֲלוֹת הַבֹּטְחִים בַּיהֹוָה כְּֽהַר־צִיּוֹן לֹא־יִמּוֹט לְעוֹלָם יֵשֵֽׁב׃","יְֽרוּשָׁלַ͏ִם הָרִים סָבִיב לָהּ וַיהֹוָה סָבִיב לְעַמּוֹ מֵעַתָּה וְעַד־עוֹלָֽם׃","כִּי לֹא יָנוּחַ שֵׁבֶט הָרֶשַׁע עַל גּוֹרַל הַֽצַּדִּיקִים לְמַעַן לֹא־יִשְׁלְחוּ הַצַּדִּיקִים בְּעַוְלָתָה יְדֵיהֶֽם׃","הֵיטִיבָה יְהֹוָה לַטּוֹבִים וְלִישָׁרִים בְּלִבּוֹתָֽם׃","וְהַמַּטִּים עֲֽקַלְקַלּוֹתָם יוֹלִיכֵם יְהֹוָה אֶת־פֹּעֲלֵי הָאָוֶן שָׁלוֹם עַל־יִשְׂרָאֵֽל׃ {פ}"],"lat":["shir hama'alot habotchim baihova kehar-tsiyon lo-yimot le'olam yeshev","yerushalam harim saviv lah vaihova saviv le'amo me'ata ve'ad-olam","ki lo yanuach shevet haresha' al goral hatsadikim lema'an lo-yishlchu hatsadikim be'avlata yedeihem","heitiva Adonai latovim velisharim belibotam","vehamatim akalkalotam yolikhem Adonai et-po'alei ha'aven shalom al-yisra'el f"],"en":["A Song of Ascents. They that trust in the LORD Are as mount Zion, which cannot be moved, but abideth for ever.","As the mountains are round about Jerusalem, So the LORD is round about His people, From this time forth and for ever.","For the rod of wickedness shall not rest upon the lot of the righteous; That the righteous put not forth their hands unto iniquity.","Do good, O LORD, unto the good, And to them that are upright in their hearts.","But as for such as turn aside unto their crooked ways, The LORD will lead them away with the workers of iniquity. Peace be upon Israel."]},{"n":126,"he":["שִׁיר הַֽמַּעֲלוֹת בְּשׁוּב יְהֹוָה אֶת־שִׁיבַת צִיּוֹן הָיִינוּ כְּחֹלְמִֽים׃","אָז יִמָּלֵא שְׂחוֹק פִּינוּ וּלְשׁוֹנֵנוּ רִנָּה אָז יֹאמְרוּ בַגּוֹיִם הִגְדִּיל יְהֹוָה לַעֲשׂוֹת עִם־אֵֽלֶּה׃","הִגְדִּיל יְהֹוָה לַעֲשׂוֹת עִמָּנוּ הָיִינוּ שְׂמֵחִֽים׃","שׁוּבָה יְהֹוָה אֶת־[שְׁבִיתֵנוּ] (שבותנו) כַּאֲפִיקִים בַּנֶּֽגֶב׃","הַזֹּרְעִים בְּדִמְעָה בְּרִנָּה יִקְצֹֽרוּ׃","הָלוֹךְ יֵלֵךְ וּבָכֹה נֹשֵׂא מֶשֶׁךְ־הַזָּרַע בֹּא־יָבֹא בְרִנָּה נֹשֵׂא אֲלֻמֹּתָֽיו׃ {פ}"],"lat":["shir hama'alot beshuv Adonai et-shivat tsiyon hayinu kecholmim","az yimale sechok pinu ulshonenu rina az yomru vagoyim higdil Adonai la'asot im-ele","higdil Adonai la'asot imanu hayinu semechim","shuva Adonai et-shvitenu shvvtnv ka'afikim banegev","hazor'im bedim'a berina yiktsoru","halokh yelekh uvakho nose meshekh-hazara' bo-yavo verina nose alumotaiv f"],"en":["A Song of Ascents. When the LORD brought back those that returned to Zion, We were like unto them that dream.","Then was our mouth filled with laughter, and our tongue with singing; then said they among the nations: 'The LORD hath done great things with these.'","The LORD hath done great things with us; we are rejoiced.","Turn our captivity, O LORD, as the streams in the dry land.","They that sow in tears Shall reap in joy.","Though he goeth on his way weeping that beareth the measure of seed, He shall come home with joy, bearing his sheaves."]},{"n":127,"he":["שִׁיר הַֽמַּעֲלוֹת לִשְׁלֹמֹה אִם־יְהֹוָה לֹא־יִבְנֶה בַיִת שָׁוְא עָמְלוּ בוֹנָיו בּוֹ אִם־יְהֹוָה לֹא־יִשְׁמׇר־עִיר שָׁוְא שָׁקַד שׁוֹמֵֽר׃","שָׁוְא לָכֶם מַשְׁכִּימֵֽי קוּם מְאַחֲרֵי־שֶׁבֶת אֹכְלֵי לֶחֶם הָעֲצָבִים כֵּן יִתֵּן לִידִידוֹ שֵׁנָֽא׃","הִנֵּה נַחֲלַת יְהֹוָה בָּנִים שָׂכָר פְּרִי הַבָּֽטֶן׃","כְּחִצִּים בְּיַד־גִּבּוֹר כֵּן בְּנֵי הַנְּעוּרִֽים׃","אַשְׁרֵי הַגֶּבֶר אֲשֶׁר מִלֵּא אֶת־אַשְׁפָּתוֹ מֵהֶם לֹֽא־יֵבֹשׁוּ כִּֽי־יְדַבְּרוּ אֶת־אוֹיְבִים בַּשָּֽׁעַר׃ {פ}"],"lat":["shir hama'alot lishlomo im-Adonai lo-yivne vayit shav amlu vonaiv bo im-Adonai lo-yishmor-ir shav shakad shomer","shav lakhem mashkimei kum me'acharei-shevet okhlei lechem ha'atsavim ken yiten lidido shena","hine nachalat Adonai banim sakhar peri habaten","kechitsim beyad-gibor ken benei han'urim","ashrei hagever asher mile et-ashpato mehem lo-yevoshu ki-yedabru et-oyvim basha'ar f"],"en":["A Song of Ascents; of Solomon. Except the LORD build the house, They labour in vain that build it; Except the LORD keep the city, The watchman waketh but in vain.","It is vain for you that ye rise early, and sit up late, Ye that eat the bread of toil; So He giveth unto His beloved in sleep.","Lo, children are a heritage of the LORD; The fruit of the womb is a reward.","As arrows in the hand of a mighty man, So are the children of one's youth.","Happy is the man that hath his quiver full of them; They shall not be put to shame, When they speak with their enemies in the gate."]},{"n":128,"he":["שִׁיר הַֽמַּעֲלוֹת אַשְׁרֵי כׇּל־יְרֵא יְהֹוָה הַהֹלֵךְ בִּדְרָכָֽיו׃","יְגִיעַ כַּפֶּיךָ כִּי תֹאכֵל אַשְׁרֶיךָ וְטוֹב לָֽךְ׃","אֶשְׁתְּךָ כְּגֶפֶן פֹּרִיָּה בְּיַרְכְּתֵי בֵיתֶךָ בָּנֶיךָ כִּשְׁתִלֵי זֵיתִים סָבִיב לְשֻׁלְחָנֶֽךָ׃","הִנֵּה כִי־כֵן יְבֹרַךְ גָּבֶר יְרֵא יְהֹוָֽה׃","יְבָרֶכְךָ יְהֹוָה מִצִּיּוֹן וּרְאֵה בְּטוּב יְרוּשָׁלָ͏ִם כֹּל יְמֵי חַיֶּֽיךָ׃","וּרְאֵֽה־בָנִים לְבָנֶיךָ שָׁלוֹם עַל־יִשְׂרָאֵֽל׃ {פ}"],"lat":["shir hama'alot ashrei kol-yere Adonai haholekh bidrakhaiv","yegia' kapeikha ki tokhel ashreikha vetov lakh","eshtkha kegefen poriya beyarktei veitekha baneikha kishtilei zeitim saviv leshulchanekha","hine khi-khen yevorakh gaver yere Adonai","yevarekhkha Adonai mitsiyon ur'e betuv yerushalam kol yemei chayeikha","ur'e-vanim levaneikha shalom al-yisra'el f"],"en":["A Song of Ascents. Happy is every one that feareth the LORD, That walketh in His ways.","When thou eatest the labour of thy hands, Happy shalt thou be, and it shall be well with thee.","Thy wife shall be as a fruitful vine, in the innermost parts of thy house; Thy children like olive plants, round about thy table.","Behold, surely thus shall the man be blessed That feareth the LORD.","The LORD bless thee out of Zion; And see thou the good of Jerusalem all the days of thy life;","And see thy children's children. Peace be upon Israel!"]},{"n":129,"he":["שִׁיר הַֽמַּעֲלוֹת רַבַּת צְרָרוּנִי מִנְּעוּרַי יֹאמַר־נָא יִשְׂרָאֵֽל׃","רַבַּת צְרָרוּנִי מִנְּעוּרָי גַּם לֹא־יָכְלוּ לִֽי׃","עַל־גַּבִּי חָרְשׁוּ חֹרְשִׁים הֶאֱרִיכוּ (למענותם) [לְמַעֲנִיתָֽם]׃","יְהֹוָה צַדִּיק קִצֵּץ עֲבוֹת רְשָׁעִֽים׃","יֵבֹשׁוּ וְיִסֹּגוּ אָחוֹר כֹּל שֹׂנְאֵי צִיּֽוֹן׃","יִהְיוּ כַּחֲצִיר גַּגּוֹת שֶׁקַּדְמַת שָׁלַף יָבֵֽשׁ׃","שֶׁלֹּא מִלֵּא כַפּוֹ קוֹצֵר וְחִצְנוֹ מְעַמֵּֽר׃","וְלֹא אָמְרוּ הָעֹבְרִים בִּרְכַּֽת־יְהֹוָה אֲלֵיכֶם בֵּרַכְנוּ אֶתְכֶם בְּשֵׁם יְהֹוָֽה׃ {פ}"],"lat":["shir hama'alot rabat tseraruni min'urai yomar-na yisra'el","rabat tseraruni min'urai gam lo-yakhlu li","al-gabi charshu chorshim he'erikhu lm'nvtm lma'anitam","Adonai tsadik kitsets avot resha'im","yevoshu veyisogu achor kol son'ei tsiyon","yihyu kachatsir gagot shekadmat shalaf yavesh","shelo mile khapo kotser vechitsno me'amer","velo amru ha'ovrim birkat-Adonai aleikhem berakhnu etkhem beshem Adonai f"],"en":["A Song of Ascents. 'Much have they afflicted me from my youth up', Let Israel now say;","'Much have they afflicted me from my youth up; But they have not prevailed against me.","The plowers plowed upon my back; They made long their furrows.","The LORD is righteous; He hath cut asunder the cords of the wicked.'","Let them be ashamed and turned backward, All they that hate Zion.","Let them be as the grass upon the housetops, Which withereth afore it springeth up;","Wherewith the reaper filleth not his hand, Nor he that bindeth sheaves his bosom.","Neither do they that go by say: ‘The blessing of the LORD be upon you; We bless you in the name of the LORD.'"]},{"n":130,"he":["שִׁיר הַֽמַּעֲלוֹת מִמַּעֲמַקִּים קְרָאתִיךָ יְהֹוָֽה׃","אֲדֹנָי שִׁמְעָה בְקוֹלִי תִּהְיֶינָה אׇזְנֶיךָ קַשֻּׁבוֹת לְקוֹל תַּחֲנוּנָֽי׃","אִם־עֲוֺנוֹת תִּשְׁמׇר־יָהּ אֲדֹנָי מִי יַעֲמֹֽד׃","כִּֽי־עִמְּךָ הַסְּלִיחָה לְמַעַן תִּוָּרֵֽא׃","קִוִּיתִי יְהֹוָה קִוְּתָה נַפְשִׁי וְֽלִדְבָרוֹ הוֹחָֽלְתִּי׃","נַפְשִׁי לַאדֹנָי מִשֹּׁמְרִים לַבֹּקֶר שֹׁמְרִים לַבֹּֽקֶר׃","יַחֵל יִשְׂרָאֵל אֶל־יְהֹוָה כִּֽי־עִם־יְהֹוָה הַחֶסֶד וְהַרְבֵּה עִמּוֹ פְדֽוּת׃","וְהוּא יִפְדֶּה אֶת־יִשְׂרָאֵל מִכֹּל עֲוֺנֹתָֽיו׃ {פ}"],"lat":["shir hama'alot mima'amakim keratikha Adonai","adonai shim'a vekoli tihyeina ozneikha kashuvot lekol tachanunai","im-aonot tishmor-yah adonai mi ya'amod","ki-imkha haslicha lema'an tivare","kiviti Adonai kivta nafshi velidvaro hochalti","nafshi ladonai mishomrim laboker shomrim laboker","yachel yisra'el el-Adonai ki-im-Adonai hachesed veharbe imo fedut","vehu yifde et-yisra'el mikol aonotaiv f"],"en":["A Song of Ascents. Out of the depths have I called Thee, O LORD.","Lord, hearken unto my voice; let Thine ears be attentive to the voice of my supplications.","If Thou, LORD, shouldest mark iniquities, O Lord, who could stand?","For with Thee there is forgiveness, that Thou mayest be feared.","I wait for the LORD, my soul doth wait, and in His word do I hope.","My soul waiteth for the Lord, more than watchmen for the morning; yea, more than watchmen for the morning.","O Israel, hope in the LORD; for with the LORD there is mercy, and with Him is plenteous redemption.","And He will redeem Israel from all his iniquities."]},{"n":131,"he":["שִׁיר הַֽמַּעֲלוֹת לְדָוִד יְהֹוָה לֹא־גָבַהּ לִבִּי וְלֹא־רָמוּ עֵינַי וְלֹֽא־הִלַּכְתִּי בִּגְדֹלוֹת וּבְנִפְלָאוֹת מִמֶּֽנִּי׃","אִם־לֹא שִׁוִּיתִי וְדוֹמַמְתִּי נַפְשִׁי כְּגָמֻל עֲלֵי אִמּוֹ כַּגָּמֻל עָלַי נַפְשִֽׁי׃","יַחֵל יִשְׂרָאֵל אֶל־יְהֹוָה מֵעַתָּה וְעַד־עוֹלָֽם׃ {פ}"],"lat":["shir hama'alot ledavid Adonai lo-gavah libi velo-ramu einai velo-hilakhti bigdolot uvniflaot mimeni","im-lo shiviti vedomamti nafshi kegamul alei imo kagamul alai nafshi","yachel yisra'el el-Adonai me'ata ve'ad-olam f"],"en":["A Song of Ascents; of David. LORD, my heart is not haughty, nor mine eyes lofty; Neither do I exercise myself in things too great, or in things too wonderful for me.","Surely I have stilled and quieted my soul; Like a weaned child with his mother; My soul is with me like a weaned child.","O Israel, hope in the LORD From this time forth and for ever."]},{"n":132,"he":["שִׁיר הַֽמַּעֲלוֹת זְכוֹר־יְהֹוָה לְדָוִד אֵת כׇּל־עֻנּוֹתֽוֹ׃","אֲשֶׁר נִשְׁבַּע לַֽיהֹוָה נָדַר לַאֲבִיר יַעֲקֹֽב׃","אִם־אָבֹא בְּאֹהֶל בֵּיתִי אִם־אֶעֱלֶה עַל־עֶרֶשׂ יְצוּעָֽי׃","אִם־אֶתֵּן שְׁנַת לְעֵינָי לְֽעַפְעַפַּי תְּנוּמָֽה׃","עַד־אֶמְצָא מָקוֹם לַיהֹוָה מִשְׁכָּנוֹת לַאֲבִיר יַעֲקֹֽב׃","הִנֵּֽה־שְׁמַעֲנוּהָ בְאֶפְרָתָה מְצָאנוּהָ בִּשְׂדֵי־יָֽעַר׃","נָבוֹאָה לְמִשְׁכְּנוֹתָיו נִשְׁתַּחֲוֶה לַהֲדֹם רַגְלָֽיו׃","קוּמָה יְהֹוָה לִמְנוּחָתֶךָ אַתָּה וַאֲרוֹן עֻזֶּֽךָ׃","כֹּהֲנֶיךָ יִלְבְּשׁוּ־צֶדֶק וַחֲסִידֶיךָ יְרַנֵּֽנוּ׃","בַּעֲבוּר דָּוִד עַבְדֶּךָ אַל־תָּשֵׁב פְּנֵי מְשִׁיחֶֽךָ׃","נִשְׁבַּֽע־יְהֹוָה לְדָוִד אֱמֶת לֹא־יָשׁוּב מִמֶּנָּה מִפְּרִי בִטְנְךָ אָשִׁית לְכִסֵּא־לָֽךְ׃","אִֽם־יִשְׁמְרוּ בָנֶיךָ בְּרִיתִי וְעֵדֹתִי זוֹ אֲלַמְּדֵם גַּם־בְּנֵיהֶם עֲדֵי־עַד יֵשְׁבוּ לְכִסֵּא־לָֽךְ׃","כִּי־בָחַר יְהֹוָה בְּצִיּוֹן אִוָּהּ לְמוֹשָׁב לֽוֹ׃","זֹאת־מְנוּחָתִי עֲדֵי־עַד פֹּה־אֵשֵׁב כִּי אִוִּתִֽיהָ׃","צֵידָהּ בָּרֵךְ אֲבָרֵךְ אֶבְיוֹנֶיהָ אַשְׂבִּיעַֽ לָֽחֶם׃","וְֽכֹהֲנֶיהָ אַלְבִּישׁ יֶשַׁע וַחֲסִידֶיהָ רַנֵּן יְרַנֵּֽנוּ׃","שָׁם אַצְמִיחַ קֶרֶן לְדָוִד עָרַכְתִּי נֵר לִמְשִׁיחִֽי׃","אוֹיְבָיו אַלְבִּישׁ בֹּשֶׁת וְעָלָיו יָצִיץ נִזְרֽוֹ׃ {פ}"],"lat":["shir hama'alot zekhor-Adonai ledavid et kol-unoto","asher nishba' laihova nadar la'avir ya'akov","im-avo be'ohel beiti im-e'ele al-eres yetsu'ai","im-eten shenat le'einai le'af'apai tenuma","ad-emtsa makom laihova mishkanot la'avir ya'akov","hine-shema'anuah ve'efrata metsanuah bisdei-ya'ar","navo'a lemishknotaiv nishtachave lahadom raglaiv","kuma Adonai limnuchatekha ata va'aron uzekha","kohaneikha yilbshu-tsedek vachasideikha yeranenu","ba'avur david avdekha al-tashev penei meshichekha","nishba'-Adonai ledavid emet lo-yashuv mimena mipri vitnkha ashit lekhise-lakh","im-yishmru vaneikha beriti ve'edoti zo alamdem gam-beneihem adei-ad yeshvu lekhise-lakh","ki-vachar Adonai betsiyon ivah lemoshav lo","zot-menuchati adei-ad po-eshev ki ivitiah","tseidah barekh avarekh evyoneiah asbia' lachem","vekhohaneiah albish yesha' vachasideiah ranen yeranenu","sham atsmiach keren ledavid arakhti ner limshichi","oyvaiv albish boshet ve'alaiv yatsits nizro f"],"en":["A Song of Ascents. LORD, remember unto David All his affliction;","How he swore unto the LORD, And vowed unto the Mighty One of Jacob:","‘Surely I will not come into the tent of my house, Nor go up into the bed that is spread for me;","I will not give sleep to mine eyes, Nor slumber to mine eyelids;","Until I find out a place for the LORD, A dwelling-place for the Mighty One of Jacob.'","Lo, we heard of it as being in Ephrath; We found it in the field of athe wood.","Let us go into His dwelling-place; Let us worship at His footstool. .","Arise, O LORD, unto Thy resting-place; Thou, and the ark of Thy strength.","Let Thy priests be clothed with righteousness; And let Thy saints shout for joy.","For Thy servant David's sake Turn not away the face of Thine anointed.","The LORD swore unto David in truth; He will not turn back from it: 'Of the fruit of thy body will I set upon thy throne.","If thy children keep My covenant And My testimony that I shall teach them, Their children also for ever shall sit upon thy throne.'","For the LORD hath chosen Zion; He hath desired it for His habitation:","'This is My resting-place for ever; Here will I dwell; for I have desired it.","I will abundantly bless her provision; I will give her needy bread in plenty.","Her priests also will I clothe with salvation; And her saints shall shout aloud for joy.","There will I make a horn to shoot up unto David, There have I ordered a lamp for Mine anointed.","His enemies will I clothe with shame; But upon himself shall his crown shine.'"]},{"n":133,"he":["שִׁיר הַֽמַּעֲלוֹת לְדָוִד הִנֵּה מַה־טּוֹב וּמַה־נָּעִים שֶׁבֶת אַחִים גַּם־יָֽחַד׃","כַּשֶּׁמֶן הַטּוֹב עַל־הָרֹאשׁ יֹרֵד עַֽל־הַזָּקָן זְקַֽן־אַהֲרֹן שֶׁיֹּרֵד עַל־פִּי מִדּוֹתָֽיו׃","כְּטַל־חֶרְמוֹן שֶׁיֹּרֵד עַל־הַרְרֵי צִיּוֹן כִּי שָׁם צִוָּה יְהֹוָה אֶת־הַבְּרָכָה חַיִּים עַד־הָעוֹלָֽם׃ {פ}"],"lat":["shir hama'alot ledavid hine ma-tov uma-na'im shevet achim gam-yachad","kashemen hatov al-harosh yored al-hazakan zekan-aharon sheyored al-pi midotaiv","ketal-chermon sheyored al-harerei tsiyon ki sham tsiva Adonai et-habrakha chayim ad-ha'olam f"],"en":["A Song of Ascents; of David. Behold, how good and how pleasant it is For brethren to dwell together in unity!","It is like the precious oil upon the head, Coming down upon the beard; Even Aaron's beard, That cometh down upon the collar of his garments;","Like the dew of Hermon, That cometh down upon the mountains of Zion; For there the LORD commanded the blessing, Even life for ever."]},{"n":134,"he":["שִׁיר הַֽמַּעֲלוֹת הִנֵּה בָּרְכוּ אֶת־יְהֹוָה כׇּל־עַבְדֵי יְהֹוָה הָעֹמְדִים בְּבֵית־יְהֹוָה בַּלֵּילֽוֹת׃","שְׂאֽוּ־יְדֵכֶם קֹדֶשׁ וּבָרְכוּ אֶת־יְהֹוָֽה׃","יְבָרֶכְךָ יְהֹוָה מִצִּיּוֹן עֹשֵׂה שָׁמַיִם וָאָֽרֶץ׃ {פ}"],"lat":["shir hama'alot hine barkhu et-Adonai kol-avdei Adonai ha'omdim beveit-Adonai baleilot","seu-yedekhem kodesh uvarkhu et-Adonai","yevarekhkha Adonai mitsiyon ose shamayim va'arets f"],"en":["A Song of Ascents. Behold, bless ye the LORD, all ye servants of the LORD, That stand in the house of the LORD in the night seasons.","Lift up your hands to the sanctuary, And bless ye the LORD.","The LORD bless thee out of Zion; Even He that made heaven and earth."]},{"n":135,"he":["הַלְלוּ־יָהּ הַֽלְלוּ אֶת־שֵׁם יְהֹוָה הַֽלְלוּ עַבְדֵי יְהֹוָֽה׃","שֶׁעֹמְדִים בְּבֵית יְהֹוָה בְּחַצְרוֹת בֵּית אֱלֹהֵֽינוּ׃","הַֽלְלוּ־יָהּ כִּֽי־טוֹב יְהֹוָה זַמְּרוּ לִשְׁמוֹ כִּי נָעִֽים׃","כִּֽי־יַעֲקֹב בָּחַר לוֹ יָהּ יִשְׂרָאֵל לִסְגֻלָּתֽוֹ׃","כִּי אֲנִי יָדַעְתִּי כִּֽי־גָדוֹל יְהֹוָה וַאֲדֹנֵינוּ מִכׇּל־אֱלֹהִֽים׃","כֹּל אֲשֶׁר־חָפֵץ יְהֹוָה עָשָׂה בַּשָּׁמַיִם וּבָאָרֶץ בַּיַּמִּים וְכׇל־תְּהֹמֽוֹת׃","מַעֲלֶה נְשִׂאִים מִקְצֵה הָאָרֶץ בְּרָקִים לַמָּטָר עָשָׂה מֽוֹצֵא־רוּחַ מֵאֽוֹצְרוֹתָֽיו׃","שֶׁהִכָּה בְּכוֹרֵי מִצְרָיִם מֵאָדָם עַד־בְּהֵמָֽה׃","שָׁלַח אוֹתֹת וּמֹפְתִים בְּתוֹכֵכִי מִצְרָיִם בְּפַרְעֹה וּבְכׇל־עֲבָדָֽיו׃","שֶׁהִכָּה גּוֹיִם רַבִּים וְהָרַג מְלָכִים עֲצוּמִֽים׃","לְסִיחוֹן מֶלֶךְ הָאֱמֹרִי וּלְעוֹג מֶלֶךְ הַבָּשָׁן וּלְכֹל מַמְלְכוֹת כְּנָֽעַן׃","וְנָתַן אַרְצָם נַחֲלָה נַחֲלָה לְיִשְׂרָאֵל עַמּֽוֹ׃","יְהֹוָה שִׁמְךָ לְעוֹלָם יְהֹוָה זִכְרְךָ לְדֹר־וָדֹֽר׃","כִּֽי־יָדִין יְהֹוָה עַמּוֹ וְעַל־עֲבָדָיו יִתְנֶחָֽם׃","עֲצַבֵּי הַגּוֹיִם כֶּסֶף וְזָהָב מַעֲשֵׂה יְדֵי אָדָֽם׃","פֶּֽה־לָהֶם וְלֹא יְדַבֵּרוּ עֵינַיִם לָהֶם וְלֹא יִרְאֽוּ׃","אׇזְנַיִם לָהֶם וְלֹא יַאֲזִינוּ אַף אֵין־יֶשׁ־רוּחַ בְּפִיהֶֽם׃","כְּמוֹהֶם יִהְיוּ עֹשֵׂיהֶם כֹּל אֲשֶׁר־בֹּטֵחַ בָּהֶֽם׃","בֵּית יִשְׂרָאֵל בָּרְכוּ אֶת־יְהֹוָה בֵּית אַהֲרֹן בָּרְכוּ אֶת־יְהֹוָֽה׃","בֵּית הַלֵּוִי בָּרְכוּ אֶת־יְהֹוָה יִֽרְאֵי יְהֹוָה בָּרְכוּ אֶת־יְהֹוָֽה׃","בָּרוּךְ יְהֹוָה מִצִּיּוֹן שֹׁכֵן יְֽרוּשָׁלָ͏ִם הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["halelu-yah halelu et-shem Adonai halelu avdei Adonai","she'omdim beveit Adonai bechatsrot beit eloheinu","halelu-yah ki-tov Adonai zamru lishmo ki na'im","ki-ya'akov bachar lo yah yisra'el lisgulato","ki ani yada'ti ki-gadol Adonai va'adoneinu mikol-elohim","kol asher-chafets Adonai asa bashamayim uva'arets bayamim vekhol-tehomot","ma'ale nesi'im miktse ha'arets berakim lamatar asa motse-ruach meotsrotaiv","shehika bekhorei mitsrayim me'adam ad-behema","shalach otot umoftim betokhekhi mitsrayim befar'o uvkhol-avadaiv","shehika goyim rabim veharag melakhim atsumim","lesichon melekh ha'emori ul'og melekh habashan ulkhol mamlkhot kena'an","venatan artsam nachala nachala leyisra'el amo","Adonai shimkha le'olam Adonai zikhrkha ledor-vador","ki-yadin Adonai amo ve'al-avadaiv yitnecham","atsabei hagoyim kesef vezahav ma'ase yedei adam","pe-lahem velo yedaberu einayim lahem velo yiru","oznayim lahem velo ya'azinu af ein-yesh-ruach befihem","kemohem yihyu oseihem kol asher-boteach bahem","beit yisra'el barkhu et-Adonai beit aharon barkhu et-Adonai","beit halevi barkhu et-Adonai yir'ei Adonai barkhu et-Adonai","barukh Adonai mitsiyon shokhen yerushalam halelu-yah f"],"en":["Hallelujah. Praise ye the name of the LORD; Give praise, O ye servants of the LORD,","Ye that stand in the house of the LORD, In the courts of the house of our God.","Praise ye the LORD, for the LORD is good; Sing praises unto His name, for it is pleasant.","For the LORD hath chosen Jacob unto Himself, And Israel for His own treasure.","For I know that the LORD is great, And that our Lord is above all gods.","Whatsoever the LORD pleased, that hath He done, In heaven and in earth, in the seas and in all deeps;","Who causeth the vapours to ascend from the ends of the earth; He maketh lightnings for the rain; He bringeth forth the wind out of His treasuries.","Who smote the first-born of Egypt, Both of man and beast.","He sent signs and wonders into the midst of thee, O Egypt, Upon Pharaoh, and upon all his servants.","Who smote many nations, And slew mighty kings:","Sihon king of the Amorites, And Og king of Bashan, And all the kingdoms of Canaan;","And gave their land for a heritage, A heritage unto Israel His people.","O LORD, Thy name endureth for ever; Thy memorial, O LORD, throughout all generations.","For the LORD will judge His people, And repent Himself for His servants.","The idols of the nations are silver and gold, The work of men's hands.","They have mouths, but they speak not; Eyes have they, but they see not;","They have ears, but they hear not; Neither is there any breath in their mouths.","They that make them shall be like unto them; Yea, every one that trusteth in them.","O house of Israel, bless ye the LORD; O house of Aaron, bless ye the LORD;","O house of Levi, bless ye the LORD; Ye that fear the LORD, bless ye the LORD.","Blessed be the LORD out of Zion, Who dwelleth at Jerusalem. Hallelujah."]},{"n":136,"he":["הוֹדוּ לַיהֹוָה כִּי־טוֹב כִּי לְעוֹלָם חַסְדּֽוֹ׃","הוֹדוּ לֵאלֹהֵי הָאֱלֹהִים כִּי לְעוֹלָם חַסְדּֽוֹ׃","הוֹדוּ לַאֲדֹנֵי הָאֲדֹנִים כִּי לְעוֹלָם חַסְדּֽוֹ׃","לְעֹשֵׂה נִפְלָאוֹת גְּדֹלוֹת לְבַדּוֹ כִּי לְעוֹלָם חַסְדּֽוֹ׃","לְעֹשֵׂה הַשָּׁמַיִם בִּתְבוּנָה כִּי לְעוֹלָם חַסְדּֽוֹ׃","לְרֹקַע הָאָרֶץ עַל־הַמָּיִם כִּי לְעוֹלָם חַסְדּֽוֹ׃","לְעֹשֵׂה אוֹרִים גְּדֹלִים כִּי לְעוֹלָם חַסְדּֽוֹ׃","אֶת־הַשֶּׁמֶשׁ לְמֶמְשֶׁלֶת בַּיּוֹם כִּי לְעוֹלָם חַסְדּֽוֹ׃","אֶת־הַיָּרֵחַ וְכוֹכָבִים לְמֶמְשְׁלוֹת בַּלָּיְלָה כִּי לְעוֹלָם חַסְדּֽוֹ׃","לְמַכֵּה מִצְרַיִם בִּבְכוֹרֵיהֶם כִּי לְעוֹלָם חַסְדּֽוֹ׃","וַיּוֹצֵא יִשְׂרָאֵל מִתּוֹכָם כִּי לְעוֹלָם חַסְדּֽוֹ׃","בְּיָד חֲזָקָה וּבִזְרוֹעַ נְטוּיָה כִּי לְעוֹלָם חַסְדּֽוֹ׃","לְגֹזֵר יַם־סוּף לִגְזָרִים כִּי לְעוֹלָם חַסְדּֽוֹ׃","וְהֶעֱבִיר יִשְׂרָאֵל בְּתוֹכוֹ כִּי לְעוֹלָם חַסְדּֽוֹ׃","וְנִעֵר פַּרְעֹה וְחֵילוֹ בְיַם־סוּף כִּי לְעוֹלָם חַסְדּֽוֹ׃","לְמוֹלִיךְ עַמּוֹ בַּמִּדְבָּר כִּי לְעוֹלָם חַסְדּֽוֹ׃","לְמַכֵּה מְלָכִים גְּדֹלִים כִּי לְעוֹלָם חַסְדּֽוֹ׃","וַֽיַּהֲרֹג מְלָכִים אַדִּירִים כִּי לְעוֹלָם חַסְדּֽוֹ׃","לְסִיחוֹן מֶלֶךְ הָאֱמֹרִי כִּי לְעוֹלָם חַסְדּֽוֹ׃","וּלְעוֹג מֶלֶךְ הַבָּשָׁן כִּי לְעוֹלָם חַסְדּֽוֹ׃","וְנָתַן אַרְצָם לְנַחֲלָה כִּי לְעוֹלָם חַסְדּֽוֹ׃","נַחֲלָה לְיִשְׂרָאֵל עַבְדּוֹ כִּי לְעוֹלָם חַסְדּֽוֹ׃","שֶׁבְּשִׁפְלֵנוּ זָכַר לָנוּ כִּי לְעוֹלָם חַסְדּֽוֹ׃","וַיִּפְרְקֵנוּ מִצָּרֵינוּ כִּי לְעוֹלָם חַסְדּֽוֹ׃","נֹתֵן לֶחֶם לְכׇל־בָּשָׂר כִּי לְעוֹלָם חַסְדּֽוֹ׃","הוֹדוּ לְאֵל הַשָּׁמָיִם כִּי לְעוֹלָם חַסְדּֽוֹ׃ {פ}"],"lat":["hodu laihova ki-tov ki le'olam chasdo","hodu lelohei ha'elohim ki le'olam chasdo","hodu la'adonei ha'adonim ki le'olam chasdo","le'ose niflaot gedolot levado ki le'olam chasdo","le'ose hashamayim bitvuna ki le'olam chasdo","leroka' ha'arets al-hamayim ki le'olam chasdo","le'ose orim gedolim ki le'olam chasdo","et-hashemesh lememshelet bayom ki le'olam chasdo","et-hayareach vekhokhavim lememshlot balayla ki le'olam chasdo","lemake mitsrayim bivkhoreihem ki le'olam chasdo","vayotse yisra'el mitokham ki le'olam chasdo","beyad chazaka uvizroa' netuya ki le'olam chasdo","legozer yam-suf ligzarim ki le'olam chasdo","vehe'evir yisra'el betokho ki le'olam chasdo","veni'er par'o vecheilo veyam-suf ki le'olam chasdo","lemolikh amo bamidbar ki le'olam chasdo","lemake melakhim gedolim ki le'olam chasdo","vayaharog melakhim adirim ki le'olam chasdo","lesichon melekh ha'emori ki le'olam chasdo","ul'og melekh habashan ki le'olam chasdo","venatan artsam lenachala ki le'olam chasdo","nachala leyisra'el avdo ki le'olam chasdo","shebshiflenu zakhar lanu ki le'olam chasdo","vayifrkenu mitsareinu ki le'olam chasdo","noten lechem lekhol-basar ki le'olam chasdo","hodu le'el hashamayim ki le'olam chasdo f"],"en":["O give thanks unto the LORD, for He is good, For His mercy endureth for ever. .","O give thanks unto the God of gods, For His mercy endureth for ever.","O give thanks unto the Lord of lords, For His mercy endureth for ever.","To Him who alone doeth great wonders, For His mercy endureth for ever.","To Him that by understanding made the heavens, for His mercy endureth for ever.","To Him that spread forth the earth above the waters, For His mercy endureth for ever.","To Him that made great lights, For His mercy endureth for ever;","The sun to rule by day, For His mercy endureth for ever;","The moon and stars to rule by night, For His mercy endureth for ever.","To Him that smote Egypt in their first-born, For His mercy endureth for ever;","And brought out Israel from among them, For His mercy endureth for ever;","With a strong hand, and with an outstretched arm, For His mercy endureth for ever.","To Him who divided the Red Sea in sunder, For His mercy endureth for ever;","And made Israel to pass through the midst of it, For His mercy endureth for ever;","But overthrew Pharaoh and his host in the Red Sea, For His mercy endureth for ever.","To Him that led His people through the wilderness, For His mercy endureth for ever.","To Him that smote great kings; For His mercy endureth for ever;","And slew mighty kings, For His mercy endureth for ever.","Sihon king of the Amorites, For His mercy endureth for ever;","And Og king of Bashan, For His mercy endureth for ever;","And gave their land for a heritage, For His mercy endureth for ever;","Even a heritage unto Israel His servant, For His mercy endureth for ever.","Who remembered us in our low estate, For His mercy endureth for ever;","And hath delivered us from our adversaries, For His mercy endureth for ever.","Who giveth food to all flesh, For His mercy endureth for ever.","O give thanks unto the God of heaven, For His mercy endureth for ever."]},{"n":137,"he":["עַל־נַהֲרוֹת בָּבֶל שָׁם יָשַׁבְנוּ גַּם־בָּכִינוּ בְּזׇכְרֵנוּ אֶת־צִיּֽוֹן׃","עַֽל־עֲרָבִים בְּתוֹכָהּ תָּלִינוּ כִּנֹּרוֹתֵֽינוּ׃","כִּי שָׁם שְֽׁאֵלוּנוּ שׁוֹבֵינוּ דִּבְרֵי־שִׁיר וְתוֹלָלֵינוּ שִׂמְחָה שִׁירוּ לָנוּ מִשִּׁיר צִיּֽוֹן׃","אֵיךְ נָשִׁיר אֶת־שִׁיר־יְהֹוָה עַל אַדְמַת נֵכָֽר׃","אִֽם־אֶשְׁכָּחֵךְ יְֽרוּשָׁלָ͏ִם תִּשְׁכַּח יְמִינִֽי׃","תִּדְבַּֽק־לְשׁוֹנִי לְחִכִּי אִם־לֹא אֶזְכְּרֵכִי אִם־לֹא אַעֲלֶה אֶת־יְרוּשָׁלַ͏ִם עַל רֹאשׁ שִׂמְחָתִֽי׃","זְכֹר יְהֹוָה לִבְנֵי אֱדוֹם אֵת יוֹם יְֽרוּשָׁלָ͏ִם הָאֹמְרִים עָרוּ עָרוּ עַד הַיְסוֹד בָּֽהּ׃","בַּת־בָּבֶל הַשְּׁדוּדָה אַשְׁרֵי שֶׁיְשַׁלֶּם־לָךְ אֶת־גְּמוּלֵךְ שֶׁגָּמַלְתְּ לָֽנוּ׃","אַשְׁרֵי שֶׁיֹּאחֵז וְנִפֵּץ אֶֽת־עֹלָלַיִךְ אֶל־הַסָּֽלַע׃ {פ}"],"lat":["al-naharot bavel sham yashavnu gam-bakhinu bezokhrenu et-tsiyon","al-aravim betokhah talinu kinoroteinu","ki sham she'elunu shoveinu divrei-shir vetolaleinu simcha shiru lanu mishir tsiyon","eikh nashir et-shir-Adonai al admat nekhar","im-eshkachekh yerushalam tishkach yemini","tidbak-leshoni lechiki im-lo ezkrekhi im-lo a'ale et-yerushalam al rosh simchati","zekhor Adonai livnei edom et yom yerushalam ha'omrim aru aru ad haysod bah","bat-bavel hashduda ashrei sheyshalem-lakh et-gemulekh shegamalt lanu","ashrei sheyochez venipets et-olalayikh el-hasala' f"],"en":["By the rivers of Babylon, There we sat down, yea, we wept, When we remembered Zion.","Upon the willows in the midst thereof We hanged up our harps.","For there they that led us captive asked of us words of song, And our tormentors asked of us mirth: ‘Sing us one of the songs of Zion.'","How shall we sing the LORD’S song In a foreign land?","If I forget thee, O Jerusalem, Let my right hand forget her cunning.","Let my tongue cleave to the roof of my mouth, If I remember thee not; If I set not Jerusalem Above my chiefest joy.","Remember, O LORD, against the children of Edom The day of Jerusalem; Who said: 'Rase it, rase it, Even to the foundation thereof.'","O daughter of Babylon, that art to be destroyed; Happy shall he be, that repayeth thee As thou hast served us.","Happy shall he be, that taketh and dasheth thy little ones Against the rock."]},{"n":138,"he":["לְדָוִד אוֹדְךָ בְכׇל־לִבִּי נֶגֶד אֱלֹהִים אֲזַמְּרֶֽךָּ׃","אֶשְׁתַּחֲוֶה אֶל־הֵיכַל קׇדְשְׁךָ וְאוֹדֶה אֶת־שְׁמֶךָ עַל־חַסְדְּךָ וְעַל־אֲמִתֶּךָ כִּֽי־הִגְדַּלְתָּ עַל־כׇּל־שִׁמְךָ אִמְרָתֶֽךָ׃","בְּיוֹם קָרָֽאתִי וַֽתַּעֲנֵנִי תַּרְהִבֵנִי בְנַפְשִׁי עֹֽז׃","יוֹדוּךָ יְהֹוָה כׇּל־מַלְכֵי־אָרֶץ כִּי שָׁמְעוּ אִמְרֵי־פִֽיךָ׃","וְיָשִׁירוּ בְּדַרְכֵי יְהֹוָה כִּֽי־גָדוֹל כְּבוֹד יְהֹוָֽה׃","כִּי־רָם יְהֹוָה וְשָׁפָל יִרְאֶה וְגָבֹהַּ מִמֶּרְחָק יְיֵדָֽע׃","אִם־אֵלֵךְ בְּקֶרֶב צָרָה תְּחַיֵּנִי עַל אַף אֹיְבַי תִּשְׁלַח יָדֶךָ וְתוֹשִׁיעֵנִי יְמִינֶֽךָ׃","יְהֹוָה יִגְמֹר בַּעֲדִי יְהֹוָה חַסְדְּךָ לְעוֹלָם מַעֲשֵׂי יָדֶיךָ אַל־תֶּֽרֶף׃ {פ}"],"lat":["ledavid odkha vekhol-libi neged elohim azamreka","eshtachave el-heikhal kodshkha veode et-shemekha al-chasdkha ve'al-amitekha ki-higdalta al-kol-shimkha imratekha","beiom karati vata'aneni tarhiveni venafshi oz","yodukha Adonai kol-malkhei-arets ki sham'u imrei-fikha","veyashiru bedarkhei Adonai ki-gadol kevod Adonai","ki-ram Adonai veshafal yir'e vegavoah mimerchak yeyeda'","im-elekh bekerev tsara techayeni al af oyvai tishlach yadekha vetoshi'eni yeminekha","Adonai yigmor ba'adi Adonai chasdkha le'olam ma'asei yadeikha al-teref f"],"en":["[A Psalm] of David. I will give Thee thanks with my whole heart, In the presence of the mighty will I sing praises unto Thee.","I will bow down toward Thy holy temple, And give thanks unto Thy name for Thy mercy and for Thy truth; For Thou hast magnified Thy word above all Thy name.","In the day that I called, Thou didst answer me; Thou didst encourage me in my soul with strength.","All the kings of the earth shall give Thee thanks, O LORD, For they have heard the words of Thy mouth.","Yea, they shall sing of the ways of the LORD; For great is the glory of the LORD.","For though the LORD be high, yet regardeth He the lowly, And the haughty He knoweth from afar.","Though I walk in the midst of trouble, Thou quickenest me; Thou stretchest forth Thy hand against the wrath of mine enemies, And Thy right hand doth save me.","The LORD will accomplish that which concerneth me; Thy mercy, O LORD, endureth for ever; Forsake not the work of Thine own hands."]},{"n":139,"he":["לַמְנַצֵּחַ לְדָוִד מִזְמוֹר יְהֹוָה חֲקַרְתַּנִי וַתֵּדָֽע׃","אַתָּה יָדַעְתָּ שִׁבְתִּי וְקוּמִי בַּנְתָּה לְרֵעִי מֵרָחֽוֹק׃","אׇרְחִי וְרִבְעִי זֵרִיתָ וְֽכׇל־דְּרָכַי הִסְכַּֽנְתָּה׃","כִּי אֵין מִלָּה בִּלְשׁוֹנִי הֵן יְהֹוָה יָדַעְתָּ כֻלָּֽהּ׃","אָחוֹר וָקֶדֶם צַרְתָּנִי וַתָּשֶׁת עָלַי כַּפֶּֽכָה׃","(פלאיה) [פְּלִיאָֽה] דַעַת מִמֶּנִּי נִשְׂגְּבָה לֹא־אוּכַֽל לָֽהּ׃","אָנָֽה אֵלֵךְ מֵרוּחֶךָ וְאָנָה מִפָּנֶיךָ אֶבְרָֽח׃","אִם־אֶסַּק שָׁמַיִם שָׁם אָתָּה וְאַצִּיעָה שְּׁאוֹל הִנֶּֽךָּ׃","אֶשָּׂא כַנְפֵי־שָׁחַר אֶשְׁכְּנָה בְּאַחֲרִית יָֽם׃","גַּם־שָׁם יָדְךָ תַנְחֵנִי וְֽתֹאחֲזֵנִי יְמִינֶֽךָ׃","וָאֹמַר אַךְ־חֹשֶׁךְ יְשׁוּפֵנִי וְלַיְלָה אוֹר בַּעֲדֵֽנִי׃","גַּם־חֹשֶׁךְ לֹא־יַחְשִׁיךְ מִמֶּךָּ וְלַיְלָה כַּיּוֹם יָאִיר כַּחֲשֵׁיכָה כָּאוֹרָֽה׃","כִּֽי־אַתָּה קָנִיתָ כִלְיֹתָי תְּסֻכֵּנִי בְּבֶטֶן אִמִּֽי׃","אוֹדְךָ עַל כִּי נוֹרָאוֹת נִפְלֵיתִי נִפְלָאִים מַעֲשֶׂיךָ וְנַפְשִׁי יֹדַעַת מְאֹֽד׃","לֹֽא־נִכְחַד עׇצְמִי מִמֶּךָּ אֲשֶׁר־עֻשֵּׂיתִי בַסֵּתֶר רֻקַּמְתִּי בְּֽתַחְתִּיּוֹת אָֽרֶץ׃","גׇּלְמִי רָאוּ עֵינֶיךָ וְעַֽל־סִפְרְךָ כֻּלָּם יִכָּתֵבוּ יָמִים יֻצָּרוּ (ולא) [וְלוֹ] אֶחָד בָּהֶֽם׃","וְלִי מַה־יָּקְרוּ רֵעֶיךָ אֵל מֶה עָצְמוּ רָאשֵׁיהֶֽם׃","אֶסְפְּרֵם מֵחוֹל יִרְבּוּן הֱקִיצֹתִי וְעוֹדִי עִמָּֽךְ׃","אִם־תִּקְטֹל אֱלוֹהַּ רָשָׁע וְאַנְשֵׁי דָמִים סוּרוּ מֶֽנִּי׃","אֲשֶׁר יֹמְרוּךָ לִמְזִמָּה נָשׂוּא לַשָּׁוְא עָרֶֽיךָ׃","הֲלֽוֹא־מְשַׂנְאֶיךָ יְהֹוָה אֶשְׂנָא וּבִתְקוֹמְמֶיךָ אֶתְקוֹטָֽט׃","תַּכְלִית שִׂנְאָה שְׂנֵאתִים לְאוֹיְבִים הָיוּ לִֽי׃","חׇקְרֵנִי אֵל וְדַע לְבָבִי בְּחָנֵנִי וְדַע שַׂרְעַפָּֽי׃","וּרְאֵה אִם־דֶּֽרֶךְ־עֹצֶב בִּי וּנְחֵנִי בְּדֶרֶךְ עוֹלָֽם׃ {פ}"],"lat":["lamnatseach ledavid mizmor Adonai chakartani vateda'","ata yada'ta shivti vekumi banta lere'i merachok","orchi veriv'i zerita vekhol-derakhai hiskanta","ki ein mila bilshoni hen Adonai yada'ta khulah","achor vakedem tsartani vatashet alai kapekha","flyh pli'ah da'at mimeni nisgva lo-ukhal lah","ana elekh meruchekha ve'ana mipaneikha evrach","im-esak shamayim sham ata ve'atsi'a sheol hineka","esa khanfei-shachar eshkna be'acharit yam","gam-sham yadkha tancheni vetochazeni yeminekha","va'omar akh-choshekh yeshufeni velayla or ba'adeni","gam-choshekh lo-yachshikh mimeka velayla kayom ya'ir kachasheikha kaora","ki-ata kanita khilyotai tesukeni beveten imi","odkha al ki noraot nifleiti nifla'im ma'aseikha venafshi yoda'at me'od","lo-nikhchad otsmi mimeka asher-useiti vaseter rukamti betachtiyot arets","golmi rau eineikha ve'al-sifrkha kulam yikatevu yamim yutsaru vl vlo echad bahem","veli ma-yakru re'eikha el me atsmu rasheihem","esprem mechol yirbun hekitsoti ve'odi imakh","im-tiktol eloah rasha' ve'anshei damim suru meni","asher yomrukha limzima nasu lashav areikha","halo-mesan'eikha Adonai esna uvitkomemeikha etkotat","takhlit sin'a senetim leoyvim haiu li","chokreni el veda' levavi bechaneni veda' sar'apai","ur'e im-derekh-otsev bi uncheni bederekh olam f"],"en":["For the Leader. A Psalm of David. O LORD, Thou hast searched me, and known me. .","Thou knowest my downsitting and mine uprising, Thou understandest my thought afar off.","Thou measurest my going about and my lying down, And art acquainted with all my ways.","For there is not a word in my tongue, But, lo, O LORD, Thou knowest it altogether.","Thou hast hemmed me in behind and before, And laid Thy hand upon me.","Such knowledge is too wonderful for me; Too high, I cannot attain unto it.","Whither shall I go from Thy spirit? Or whither shall I flee from Thy presence?","If I ascend up into heaven, Thou art there; If I make my bed in the nether-world, behold, Thou art there.","If I take the wings of the morning, And dwell in the uttermost parts of the sea;","Even there would Thy hand lead me, And Thy right hand would hold me.","And if I say: ‘Surely the darkness shall envelop me, And the light about me shall be night';","Even the darkness is not too dark for Thee, But the night shineth as the day; The darkness is even as the light.","For Thou hast made my reins; Thou hast knit me together in my mother's womb.","I will give thanks unto Thee, for I am fearfully and wonderfully made; Wonderful are Thy works; and that my soul knoweth right well.","My frame was not hidden from Thee, When I was made in secret, And curiously wrought in the lowest parts of the earth.","Thine eyes did see mine unformed substance, And in Thy book they were all written— Even the days that were fashioned, When as yet there was none of them.","How weighty also are Thy thoughts unto me, O God! How great is the sum of them!","If I would count them, they are more in number than the sand; Were I to come to the end of them, I would still be with Thee.","If Thou but wouldest slay the wicked, O God— Depart from me therefore, ye men of blood;","Who utter Thy name with wicked thought, They take it for falsehood, even Thine enemies— .","Do not I hate them, O LORD, that hate Thee? And do not I strive with those that rise up against Thee?","I hate them with utmost hatred; I count them mine enemies.","Search me, O God, and know my heart, Try me, and know my thoughts;","And see if there be any way in me that is grievous, And lead me in the way everlasting."]},{"n":140,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃","חַלְּצֵנִי יְהֹוָה מֵאָדָם רָע מֵאִישׁ חֲמָסִים תִּנְצְרֵֽנִי׃","אֲשֶׁר חָשְׁבוּ רָעוֹת בְּלֵב כׇּל־יוֹם יָגוּרוּ מִלְחָמֽוֹת׃","שָׁנְנוּ לְשׁוֹנָם כְּֽמוֹ־נָחָשׁ חֲמַת עַכְשׁוּב תַּחַת שְׂפָתֵימוֹ סֶֽלָה׃","שׇׁמְרֵנִי יְהֹוָה מִידֵי רָשָׁע מֵאִישׁ חֲמָסִים תִּנְצְרֵנִי אֲשֶׁר חָשְׁבוּ לִדְחוֹת פְּעָמָֽי׃","טָמְנֽוּ־גֵאִים פַּח לִי וַחֲבָלִים פָּרְשׂוּ רֶשֶׁת לְיַד־מַעְגָּל מֹקְשִׁים שָׁתוּ־לִי סֶֽלָה׃","אָמַרְתִּי לַיהֹוָה אֵלִי אָתָּה הַאֲזִינָה יְהֹוָה קוֹל תַּחֲנוּנָֽי׃","יֱהֹוִה אֲדֹנָי עֹז יְשׁוּעָתִי סַכֹּתָה לְרֹאשִׁי בְּיוֹם נָֽשֶׁק׃","אַל־תִּתֵּן יְהֹוָה מַאֲוַיֵּי רָשָׁע זְמָמוֹ אַל־תָּפֵק יָרוּמוּ סֶֽלָה׃","רֹאשׁ מְסִבָּי עֲמַל שְׂפָתֵימוֹ (יכסומו) [יְכַסֵּֽימוֹ]׃","(ימיטו) [יִמּוֹטוּ] עֲלֵיהֶם גֶּחָלִים בָּאֵשׁ יַפִּלֵם בְּמַהֲמֹרוֹת בַּל־יָקֽוּמוּ׃","אִישׁ לָשׁוֹן בַּל־יִכּוֹן בָּאָרֶץ אִישׁ־חָמָס רָע יְצוּדֶנּוּ לְמַדְחֵפֹֽת׃","(ידעת) [יָדַעְתִּי] כִּֽי־יַעֲשֶׂה יְהֹוָה דִּין עָנִי מִשְׁפַּט אֶבְיֹנִֽים׃","אַךְ צַדִּיקִים יוֹדוּ לִשְׁמֶךָ יֵשְׁבוּ יְשָׁרִים אֶת־פָּנֶֽיךָ׃ {פ}"],"lat":["lamnatseach mizmor ledavid","chaltseni Adonai me'adam ra' me'ish chamasim tintsreni","asher chashvu ra'ot belev kol-yom yaguru milchamot","shanenu leshonam kemo-nachash chamat akhshuv tachat sefateimo sela","shomreni Adonai midei rasha' me'ish chamasim tintsreni asher chashvu lidchot pe'amai","tamnu-ge'im pach li vachavalim parsu reshet leyad-ma'gal mokshim shatu-li sela","amarti laihova eli ata ha'azina Adonai kol tachanunai","Adonai adonai oz yeshu'ati sakota leroshi beiom nashek","al-titen Adonai ma'avayei rasha' zemamo al-tafek yarumu sela","rosh mesibai amal sefateimo ykhsvmv ykhaseimo","ymytv yimotu aleihem gechalim ba'esh yapilem bemahamorot bal-yakumu","ish lashon bal-yikon ba'arets ish-chamas ra' yetsudenu lemadchefot","yd't yada'ti ki-ya'ase Adonai din ani mishpat evyonim","akh tsadikim yodu lishmekha yeshvu yesharim et-paneikha f"],"en":["For the Leader. A Psalm of David.","Deliver me, O LORD, from the evil man; Preserve me from the violent man;","Who devise evil things in their heart; Every day do they stir up wars.","They have sharpened their tongue like a serpent; Vipers' venom is under their lips. Selah","Keep me, O LORD, from the hands of the wicked; Preserve me from the violent man; Who have purposed to make my steps slip.","The proud have hid a snare for me, and cords; They have spread a net by the wayside; They have set gins for me. Selah","I have said unto the LORD: 'Thou art my God'; Give ear, O LORD, unto the voice of my supplications.","O GOD the Lord, the strength of my salvation, Who hast screened my head in the day of battle,","Grant not, O LORD, the desires of the wicked; Further not his evil device, so that they exalt themselves. Selah","As for the head of those that compass me about, Let the mischief of their own lips cover them.","Let burning coals fall upon them; Let them be cast into the fire, Into deep pits, that they rise not up again.","A slanderer shall not be established in the earth; The violent and evil man shall be hunted with thrust upon thrust.","I know that the LORD will maintain the cause of the poor, And the right of the needy.","Surely the righteous shall give thanks unto Thy name; The upright shall dwell in Thy presence."]},{"n":141,"he":["מִזְמוֹר לְדָוִד יְהֹוָה קְרָאתִיךָ חוּשָׁה לִּי הַאֲזִינָה קוֹלִי בְּקׇרְאִי־לָֽךְ׃","תִּכּוֹן תְּפִלָּתִי קְטֹרֶת לְפָנֶיךָ מַֽשְׂאַת כַּפַּי מִנְחַת־עָֽרֶב׃","שִׁיתָה יְהֹוָה שׇׁמְרָה לְפִי נִצְּרָה עַל־דַּל שְׂפָתָֽי׃","אַל־תַּט־לִבִּי לְדָבָר רָע לְהִתְעוֹלֵל עֲלִלוֹת בְּרֶשַׁע אֶת־אִישִׁים פֹּעֲלֵי־אָוֶן וּבַל־אֶלְחַם בְּמַנְעַמֵּיהֶֽם׃","יֶהֶלְמֵֽנִי־צַדִּיק חֶסֶד וְֽיוֹכִיחֵנִי שֶׁמֶן רֹאשׁ אַל־יָנִי רֹאשִׁי כִּי־עוֹד וּתְפִלָּתִי בְּרָעוֹתֵיהֶֽם׃","נִשְׁמְטוּ בִֽידֵי־סֶלַע שֹׁפְטֵיהֶם וְשָׁמְעוּ אֲמָרַי כִּי נָעֵֽמוּ׃","כְּמוֹ פֹלֵחַ וּבֹקֵעַ בָּאָרֶץ נִפְזְרוּ עֲצָמֵינוּ לְפִי שְׁאֽוֹל׃","כִּי אֵלֶיךָ יֱהֹוִה אֲדֹנָי עֵינָי בְּכָה חָסִיתִי אַל־תְּעַר נַפְשִֽׁי׃","שׇׁמְרֵנִי מִידֵי פַח יָקְשׁוּ לִי וּמֹקְשׁוֹת פֹּעֲלֵי אָֽוֶן׃","יִפְּלוּ בְמַכְמֹרָיו רְשָׁעִים יַחַד אָנֹכִי עַֽד־אֶעֱבֽוֹר׃ {פ}"],"lat":["mizmor ledavid Adonai keratikha chusha li ha'azina koli bekor'i-lakh","tikon tefilati ketoret lefaneikha mas'at kapai minchat-arev","shita Adonai shomra lefi nitsra al-dal sefatai","al-tat-libi ledavar ra' lehit'olel alilot beresha' et-ishim po'alei-aven uval-elcham beman'ameihem","yehelmeni-tsadik chesed veiokhicheni shemen rosh al-yani roshi ki-od utfilati bera'oteihem","nishmtu videi-sela' shofteihem vesham'u amarai ki na'emu","kemo foleach uvokea' ba'arets nifzru atsameinu lefi sheol","ki eleikha Adonai adonai einai bekha chasiti al-te'ar nafshi","shomreni midei fach yakshu li umokshot po'alei aven","yiplu vemakhmoraiv resha'im yachad anokhi ad-e'evor f"],"en":["A Psalm of David. LORD, I have called Thee; make haste unto me; Give ear unto my voice, when I call unto Thee.","Let my prayer be set forth as incense before Thee, The lifting up of my hands as the evening sacrifice.","Set a guard, O LORD, to my mouth; Keep watch at the door of my lips.","Incline not my heart to any evil thing, To be occupied in deeds of wickedness With men that work iniquity; And let me not eat of their dainties.","Let the righteous smite me in kindness, and correct me; Oil so choice let not my head refuse; For still is my prayer because of their wickedness.","Their judges are thrown down by the sides of the rock; And they shall hear my words, that they are sweet.","As when one cleaveth and breaketh up the earth, Our bones are scattered at the grave's mouth.","For mine eyes are unto Thee, O GOD the Lord; In Thee have I taken refuge, O pour not out my soul.","Keep me from the snare which they have laid for me, And from the gins of the workers of iniquity.","Let the wicked fall into their own nets, Whilst I withal escape."]},{"n":142,"he":["מַשְׂכִּיל לְדָוִד בִּֽהְיוֹתוֹ בַמְּעָרָה תְפִלָּֽה׃","קוֹלִי אֶל־יְהֹוָה אֶזְעָק קוֹלִי אֶל־יְהֹוָה אֶתְחַנָּֽן׃","אֶשְׁפֹּךְ לְפָנָיו שִׂיחִי צָרָתִי לְפָנָיו אַגִּֽיד׃","בְּהִתְעַטֵּף עָלַי רוּחִי וְאַתָּה יָדַעְתָּ נְֽתִיבָתִי בְּאֹֽרַח־זוּ אֲהַלֵּךְ טָמְנוּ פַח לִֽי׃","הַבֵּיט יָמִין וּרְאֵה וְאֵֽין־לִי מַכִּיר אָבַד מָנוֹס מִמֶּנִּי אֵין דּוֹרֵשׁ לְנַפְשִֽׁי׃","זָעַקְתִּי אֵלֶיךָ יְהֹוָה אָמַרְתִּי אַתָּה מַחְסִי חֶלְקִי בְּאֶרֶץ הַחַיִּֽים׃","הַקְשִׁיבָה אֶֽל־רִנָּתִי כִּֽי־דַלּוֹתִי מְאֹד הַצִּילֵנִי מֵרֹדְפַי כִּי אָמְצוּ מִמֶּֽנִּי׃","הוֹצִיאָה מִמַּסְגֵּר נַפְשִׁי לְהוֹדוֹת אֶת־שְׁמֶךָ בִּי יַכְתִּרוּ צַדִּיקִים כִּי תִגְמֹל עָלָֽי׃ {פ}"],"lat":["maskil ledavid bihyoto vam'ara tefila","koli el-Adonai ez'ak koli el-Adonai etchanan","eshpokh lefanaiv sichi tsarati lefanaiv agid","behit'atef alai ruchi ve'ata yada'ta netivati be'orach-zu ahalekh tamnu fach li","habeit yamin ur'e ve'ein-li makir avad manos mimeni ein doresh lenafshi","za'akti eleikha Adonai amarti ata machsi chelki be'erets hachayim","hakshiva el-rinati ki-daloti me'od hatsileni merodfai ki amtsu mimeni","hotsi'a mimasger nafshi lehodot et-shemekha bi yakhtiru tsadikim ki tigmol alai f"],"en":["Maschil of David, when he was in the cave; a Prayer.","With my voice I cry unto the LORD; With my voice I make supplication unto the LORD.","I pour out my complaint before Him, I declare before Him my trouble;","When my spirit fainteth within me— Thou knowest my path— In the way wherein I walk Have they hidden a snare for me.","Look on my right hand, and see, For there is no man that knoweth me; I have no way to flee; No man careth for my soul.","I have cried unto Thee, O LORD; I have said: 'Thou art my refuge, My portion in the land of the living.'","Attend unto my cry; For I am brought very low; Deliver me from my persecutors; For they are too strong for me.","Bring my soul out of prison, That I may give thanks unto Thy name; The righteous shall crown themselves because of me; For Thou wilt deal bountifully with me."]},{"n":143,"he":["מִזְמוֹר לְדָוִד יְהֹוָה שְׁמַע תְּפִלָּתִי הַאֲזִינָה אֶל־תַּחֲנוּנַי בֶּאֱמֻנָתְךָ עֲנֵנִי בְּצִדְקָתֶֽךָ׃","וְאַל־תָּבוֹא בְמִשְׁפָּט אֶת־עַבְדֶּךָ כִּי לֹֽא־יִצְדַּק לְפָנֶיךָ כׇל־חָֽי׃","כִּי רָדַף אוֹיֵב נַפְשִׁי דִּכָּא לָאָרֶץ חַיָּתִי הוֹשִׁבַנִי בְמַחֲשַׁכִּים כְּמֵתֵי עוֹלָֽם׃","וַתִּתְעַטֵּף עָלַי רוּחִי בְּתוֹכִי יִשְׁתּוֹמֵם לִבִּֽי׃","זָכַרְתִּי יָמִים מִקֶּדֶם הָגִיתִי בְכׇל־פׇּעֳלֶךָ בְּֽמַעֲשֵׂה יָדֶיךָ אֲשׂוֹחֵֽחַ׃","פֵּרַשְׂתִּי יָדַי אֵלֶיךָ נַפְשִׁי כְּאֶרֶץ־עֲיֵפָה לְךָ סֶֽלָה׃","מַהֵר עֲנֵנִי יְהֹוָה כָּלְתָה רוּחִי אַל־תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי וְנִמְשַׁלְתִּי עִם־יֹרְדֵי בֽוֹר׃","הַשְׁמִיעֵנִי בַבֹּקֶר חַסְדֶּךָ כִּֽי־בְךָ בָטָחְתִּי הוֹדִיעֵנִי דֶּרֶךְ־זוּ אֵלֵךְ כִּי־אֵלֶיךָ נָשָׂאתִי נַפְשִֽׁי׃","הַצִּילֵנִי מֵאֹיְבַי יְהֹוָה אֵלֶיךָ כִסִּֽתִי׃","לַמְּדֵנִי לַעֲשׂוֹת רְצוֹנֶךָ כִּֽי־אַתָּה אֱלוֹהָי רוּחֲךָ טוֹבָה תַּנְחֵנִי בְּאֶרֶץ מִישֽׁוֹר׃","לְמַעַן־שִׁמְךָ יְהֹוָה תְּחַיֵּנִי בְּצִדְקָתְךָ תּוֹצִיא מִצָּרָה נַפְשִֽׁי׃","וּֽבְחַסְדְּךָ תַּצְמִית אֹיְבָי וְֽהַאֲבַדְתָּ כׇּל־צֹרְרֵי נַפְשִׁי כִּי אֲנִי עַבְדֶּֽךָ׃ {פ}"],"lat":["mizmor ledavid Adonai shema' tefilati ha'azina el-tachanunai be'emunatkha aneni betsidkatekha","ve'al-tavo vemishpat et-avdekha ki lo-yitsdak lefaneikha khol-chai","ki radaf oyev nafshi dika la'arets chayati hoshivani vemachashakim kemetei olam","vatit'atef alai ruchi betokhi yishtomem libi","zakharti yamim mikedem hagiti vekhol-po'olekha bema'ase yadeikha asocheach","perasti yadai eleikha nafshi ke'erets-ayefa lekha sela","maher aneni Adonai kalta ruchi al-taster paneikha mimeni venimshalti im-yordei vor","hashmi'eni vaboker chasdekha ki-vekha vatachti hodi'eni derekh-zu elekh ki-eleikha nasati nafshi","hatsileni me'oyvai Adonai eleikha khisiti","lamdeni la'asot retsonekha ki-ata elohai ruchakha tova tancheni be'erets mishor","lema'an-shimkha Adonai techayeni betsidkatkha totsi mitsara nafshi","uvchasdkha tatsmit oyvai veha'avadta kol-tsorerei nafshi ki ani avdekha f"],"en":["A Psalm of David. O LORD, hear my prayer, give ear to my supplications; In Thy faithfulness answer me, and in Thy righteousness.","And enter not into judgment with Thy servant; For in Thy sight shall no man living be justified.","For the enemy hath persecuted my soul; He hath crushed my life down to the ground; He hath made me to dwell in darkness, as those that have been long dead.","And my spirit fainteth within me; My heart within me is appalled.","I remember the days of old; I meditate on all Thy doing; I muse on the work of Thy hands.","I spread forth my hands unto Thee; My soul [thirsteth] after Thee, as a weary land. Selah","Answer me speedily, O LORD, My spirit faileth; Hide not Thy face from me; Lest I become like them that go down into the pit.","Cause me to hear Thy lovingkindness in the morning, For in Thee do I trust; Cause me to know the way wherein I should walk, For unto Thee have I lifted up my soul.","Deliver me from mine enemies, O LORD; With Thee have I hidden myself.","Teach me to do Thy will, For Thou art my God; Let Thy good spirit Lead me in an even land.","For Thy name's sake, O LORD, quicken me; In Thy righteousness bring my soul out of trouble.","And in Thy mercy cut off mine enemies, And destroy all them that harass my soul; For I am Thy servant."]},{"n":144,"he":["לְדָוִד בָּרוּךְ יְהֹוָה צוּרִי הַֽמְלַמֵּד יָדַי לַקְרָב אֶצְבְּעוֹתַי לַמִּלְחָמָֽה׃","חַסְדִּי וּמְצוּדָתִי מִשְׂגַּבִּי וּֽמְפַלְטִי־לִי מָגִנִּי וּבוֹ חָסִיתִי הָרוֹדֵד עַמִּי תַחְתָּֽי׃","יְֽהֹוָה מָֽה־אָדָם וַתֵּדָעֵהוּ בֶּן־אֱנוֹשׁ וַֽתְּחַשְּׁבֵֽהוּ׃","אָדָם לַהֶבֶל דָּמָה יָמָיו כְּצֵל עוֹבֵֽר׃","יְהֹוָה הַט־שָׁמֶיךָ וְתֵרֵד גַּע בֶּהָרִים וְֽיֶעֱשָֽׁנוּ׃","בְּרוֹק בָּרָק וּתְפִיצֵם שְׁלַח חִצֶּיךָ וּתְהֻמֵּֽם׃","שְׁלַח יָדֶיךָ מִמָּרוֹם פְּצֵנִי וְהַצִּילֵנִי מִמַּיִם רַבִּים מִיַּד בְּנֵי נֵכָֽר׃","אֲשֶׁר פִּיהֶם דִּבֶּר־שָׁוְא וִימִינָם יְמִין שָֽׁקֶר׃","אֱֽלֹהִים שִׁיר חָדָשׁ אָשִׁירָה לָּךְ בְּנֵבֶל עָשׂוֹר אֲזַמְּרָה־לָּֽךְ׃","הַנּוֹתֵן תְּשׁוּעָה לַמְּלָכִים הַפּוֹצֶה אֶת־דָּוִד עַבְדּוֹ מֵחֶרֶב רָעָֽה׃","פְּצֵנִי וְהַצִּילֵנִי מִיַּד בְּֽנֵי־נֵכָר אֲשֶׁר פִּיהֶם דִּבֶּר־שָׁוְא וִימִינָם יְמִין שָֽׁקֶר׃","אֲשֶׁר בָּנֵינוּ כִּנְטִעִים מְגֻדָּלִים בִּֽנְעוּרֵיהֶם בְּנוֹתֵינוּ כְזָוִיֹּת מְחֻטָּבוֹת תַּבְנִית הֵיכָֽל׃","מְזָוֵינוּ מְלֵאִים מְפִיקִים מִזַּן אֶל־זַן צֹאונֵנוּ מַאֲלִיפוֹת מְרֻבָּבוֹת בְּחוּצוֹתֵֽינוּ׃","אַלּוּפֵינוּ מְֽסֻבָּלִים אֵֽין־פֶּרֶץ וְאֵין יוֹצֵאת וְאֵין צְוָחָה בִּרְחֹבֹתֵֽינוּ׃","אַשְׁרֵי הָעָם שֶׁכָּכָה לּוֹ אַֽשְׁרֵי הָעָם שֱׁיְהֹוָה אֱלֹהָֽיו׃ {פ}"],"lat":["ledavid barukh Adonai tsuri hamlamed yadai lakrav etsb'otai lamilchama","chasdi umtsudati misgabi umfalti-li magini uvo chasiti haroded ami tachtai","Adonai ma-adam vateda'ehu ben-enosh vatchashvehu","adam lahevel dama yamaiv ketsel over","Adonai hat-shameikha vetered ga' beharim veye'eshanu","berok barak utfitsem shelach chitseikha uthumem","shelach yadeikha mimarom petseni vehatsileni mimayim rabim miyad benei nekhar","asher pihem diber-shav viminam yemin shaker","elohim shir chadash ashira lakh benevel asor azamra-lakh","hanoten teshu'a lamlakhim hapotse et-david avdo mecherev ra'a","petseni vehatsileni miyad benei-nekhar asher pihem diber-shav viminam yemin shaker","asher baneinu kinti'im megudalim bin'ureihem benoteinu khezaviyot mechutavot tavnit heikhal","mezaveinu mele'im mefikim mizan el-zan tsovnenu ma'alifot merubavot bechutsoteinu","alufeinu mesubalim ein-perets ve'ein yotset ve'ein tsevacha birchovoteinu","ashrei ha'am shekakha lo ashrei ha'am sheyhova elohaiv f"],"en":["[A Psalm] of David. Blessed be the LORD my Rock, Who traineth my hands for war, And my fingers for battle;","My lovingkindness, and my fortress, My high tower, and my deliverer; My shield, and He in whom I take refuge; Who subdueth my people under me.","LORD, what is man, that Thou takest knowledge of him? Or the son of man, that Thou makest account of him?","Man is like unto a breath; His days are as a shadow that passeth away.","O LORD, bow Thy heavens, and come down; Touch the mountains, that they may smoke.","Cast forth lightning, and scatter them; Send out Thine arrows, and discomfit them.","Stretch forth Thy hands from on high; Rescue me, and deliver me out of many waters, Out of the hand of strangers;","Whose mouth speaketh falsehood, And their right hand is a right hand of lying.","O God, I will sing a new song unto Thee, Upon a psaltery of ten strings will I sing praises unto Thee;","Who givest salvation unto kings, Who rescuest David Thy servant from the hurtful sword.","Rescue me, and deliver me out of the hand of strangers, Whose mouth speaketh falsehood, And their right hand is a right hand of lying.","We whose sons are as plants grown up in their youth; Whose daughters are as corner-pillars carved after the fashion of a palace;","Whose garners are full, affording all manner of store; Whose sheep increase by thousands and ten thousands in our fields;","Whose oxen are well laden; With no breach, and no going forth, And no outcry in our broad places;","Happy is the people that is in such a case. Yea, happy is the people whose God is the LORD."]},{"n":145,"he":["תְּהִלָּה לְדָוִד אֲרוֹמִמְךָ אֱלוֹהַי הַמֶּלֶךְ וַאֲבָרְכָה שִׁמְךָ לְעוֹלָם וָעֶֽד׃","בְּכׇל־יוֹם אֲבָרְכֶךָּ וַאֲהַלְלָה שִׁמְךָ לְעוֹלָם וָעֶֽד׃","גָּדוֹל יְהֹוָה וּמְהֻלָּל מְאֹד וְלִגְדֻלָּתוֹ אֵין חֵֽקֶר׃","דּוֹר לְדוֹר יְשַׁבַּח מַעֲשֶׂיךָ וּגְבוּרֹתֶיךָ יַגִּֽידוּ׃","הֲדַר כְּבוֹד הוֹדֶךָ וְדִבְרֵי נִפְלְאֹתֶיךָ אָשִֽׂיחָה׃","וֶעֱזוּז נֽוֹרְאֹתֶיךָ יֹאמֵרוּ (וגדלותיך) [וּגְדֻלָּתְךָ] אֲסַפְּרֶֽנָּה׃","זֵכֶר רַב־טוּבְךָ יַבִּיעוּ וְצִדְקָתְךָ יְרַנֵּֽנוּ׃","חַנּוּן וְרַחוּם יְהֹוָה אֶרֶךְ אַפַּיִם וּגְדׇל־חָֽסֶד׃","טוֹב־יְהֹוָה לַכֹּל וְרַחֲמָיו עַל־כׇּל־מַעֲשָֽׂיו׃","יוֹדוּךָ יְהֹוָה כׇּל־מַעֲשֶׂיךָ וַחֲסִידֶיךָ יְבָרְכֽוּכָה׃","כְּבוֹד מַלְכוּתְךָ יֹאמֵרוּ וּגְבוּרָתְךָ יְדַבֵּֽרוּ׃","לְהוֹדִיעַ לִבְנֵי הָאָדָם גְּבוּרֹתָיו וּכְבוֹד הֲדַר מַלְכוּתֽוֹ׃","מַֽלְכוּתְךָ מַלְכוּת כׇּל־עֹלָמִים וּמֶֽמְשַׁלְתְּךָ בְּכׇל־דּוֹר וָדֹֽר׃","סוֹמֵךְ יְהֹוָה לְכׇל־הַנֹּפְלִים וְזוֹקֵף לְכׇל־הַכְּפוּפִֽים׃","עֵֽינֵי־כֹל אֵלֶיךָ יְשַׂבֵּרוּ וְאַתָּה נֽוֹתֵן־לָהֶם אֶת־אׇכְלָם בְּעִתּֽוֹ׃","פּוֹתֵחַ אֶת־יָדֶךָ וּמַשְׂבִּיעַ לְכׇל־חַי רָצֽוֹן׃","צַדִּיק יְהֹוָה בְּכׇל־דְּרָכָיו וְחָסִיד בְּכׇל־מַעֲשָֽׂיו׃","קָרוֹב יְהֹוָה לְכׇל־קֹרְאָיו לְכֹל אֲשֶׁר יִקְרָאֻהוּ בֶאֱמֶֽת׃","רְצוֹן־יְרֵאָיו יַעֲשֶׂה וְֽאֶת־שַׁוְעָתָם יִשְׁמַע וְיוֹשִׁיעֵֽם׃","שׁוֹמֵר יְהֹוָה אֶת־כׇּל־אֹהֲבָיו וְאֵת כׇּל־הָרְשָׁעִים יַשְׁמִֽיד׃","תְּהִלַּת יְהֹוָה יְֽדַבֶּר־פִּי וִיבָרֵךְ כׇּל־בָּשָׂר שֵׁם קׇדְשׁוֹ לְעוֹלָם וָעֶֽד׃ {פ}"],"lat":["tehila ledavid aromimkha elohai hamelekh va'avarkha shimkha le'olam va'ed","bekhol-yom avarkheka va'ahalela shimkha le'olam va'ed","gadol Adonai umhulal me'od veligdulato ein cheker","dor ledor yeshabach ma'aseikha ugvuroteikha yagidu","hadar kevod hodekha vedivrei nifl'oteikha asicha","ve'ezuz nor'oteikha yomeru vgdlvtykh ugdulatkha asaprena","zekher rav-tuvkha yabi'u vetsidkatkha yeranenu","chanun verachum Adonai erekh apayim ugdol-chased","tov-Adonai lakol verachamaiv al-kol-ma'asaiv","yodukha Adonai kol-ma'aseikha vachasideikha yevarkhukha","kevod malkhutkha yomeru ugvuratkha yedaberu","lehodia' livnei ha'adam gevurotaiv ukhvod hadar malkhuto","malkhutkha malkhut kol-olamim umemshaltkha bekhol-dor vador","somekh Adonai lekhol-hanoflim vezokef lekhol-hakfufim","einei-khol eleikha yesaberu ve'ata noten-lahem et-okhlam be'ito","poteach et-yadekha umasbia' lekhol-chai ratson","tsadik Adonai bekhol-derakhaiv vechasid bekhol-ma'asaiv","karov Adonai lekhol-kor'aiv lekhol asher yikra'uhu ve'emet","retson-yere'aiv ya'ase ve'et-shav'atam yishma' veioshi'em","shomer Adonai et-kol-ohavaiv ve'et kol-harsha'im yashmid","tehilat Adonai yedaber-pi vivarekh kol-basar shem kodsho le'olam va'ed f"],"en":["[A Psalm of] praise; of David. I will extol Thee, my God, O King; And I will bless Thy name for ever and ever.","Every day will I bless Thee; And I will praise Thy name for ever and ever.","Great is the LORD, and highly to be praised; And His greatness is unsearchable.","One generation shall laud Thy works to another, And shall declare Thy mighty acts.","The glorious splendour of Thy majesty, And Thy wondrous works, will I rehearse.","And men shall speak of the might of Thy tremendous acts; And I will tell of Thy greatness.","They shall utter the fame of Thy great goodness, And shall sing of Thy righteousness.","The LORD is gracious, and full of compassion; Slow to anger, and of great mercy.","The LORD is good to all; And His tender mercies are over all His works.","All Thy works shall praise Thee, O LORD; And Thy saints shall bless Thee.","They shall speak of the glory of Thy kingdom, And talk of Thy might;","To make known to the sons of men His mighty acts, And the glory of the majesty of His kingdom.","Thy kingdom is a kingdom for all ages, And Thy dominion endureth throughout all generations.","The LORD upholdeth all that fall, And raiseth up all those that are bowed down.","The eyes of all wait for Thee, And Thou givest them their food in due season.","Thou openest Thy hand, And satisfiest every living thing with favour.","The LORD is righteous in all His ways, And gracious in all His works.","The LORD is nigh unto all them that call upon Him, To all that call upon Him in truth.","He will fulfil the desire of them that fear Him; He also will hear their cry, and will save them.","The LORD preserveth all them that love Him; But all the wicked will He destroy.","My mouth shall speak the praise of the LORD; And let all flesh bless His holy name for ever and ever."]},{"n":146,"he":["הַֽלְלוּ־יָהּ הַֽלְלִי נַפְשִׁי אֶת־יְהֹוָֽה׃","אֲהַלְלָה יְהֹוָה בְּחַיָּי אֲזַמְּרָה לֵאלֹהַי בְּעוֹדִֽי׃","אַל־תִּבְטְחוּ בִנְדִיבִים בְּבֶן־אָדָם שֶׁאֵין לוֹ תְשׁוּעָֽה׃","תֵּצֵא רוּחוֹ יָשֻׁב לְאַדְמָתוֹ בַּיּוֹם הַהוּא אָבְדוּ עֶשְׁתֹּנֹתָֽיו׃","אַשְׁרֵי שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ שִׂבְרוֹ עַל־יְהֹוָה אֱלֹהָֽיו׃","עֹשֶׂה שָׁמַיִם וָאָרֶץ אֶת־הַיָּם וְאֶת־כׇּל־אֲשֶׁר־בָּם הַשֹּׁמֵר אֱמֶת לְעוֹלָֽם׃","עֹשֶׂה מִשְׁפָּט לָעֲשׁוּקִים נֹתֵן לֶחֶם לָרְעֵבִים יְהֹוָה מַתִּיר אֲסוּרִֽים׃","יְהֹוָה פֹּקֵחַ עִוְרִים יְהֹוָה זֹקֵף כְּפוּפִים יְהֹוָה אֹהֵב צַדִּיקִֽים׃","יְהֹוָה שֹׁמֵר אֶת־גֵּרִים יָתוֹם וְאַלְמָנָה יְעוֹדֵד וְדֶרֶךְ רְשָׁעִים יְעַוֵּֽת׃","יִמְלֹךְ יְהֹוָה לְעוֹלָם אֱלֹהַיִךְ צִיּוֹן לְדֹר וָדֹר הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["halelu-yah haleli nafshi et-Adonai","ahalela Adonai bechayai azamra lelohai be'odi","al-tivtchu vindivim beven-adam she'ein lo teshu'a","tetse rucho yashuv le'admato bayom hahu avdu eshtonotaiv","ashrei she'el ya'akov be'ezro sivro al-Adonai elohaiv","ose shamayim va'arets et-hayam ve'et-kol-asher-bam hashomer emet le'olam","ose mishpat la'ashukim noten lechem lar'evim Adonai matir asurim","Adonai pokeach ivrim Adonai zokef kefufim Adonai ohev tsadikim","Adonai shomer et-gerim yatom ve'almana ye'oded vederekh resha'im ye'avet","yimlokh Adonai le'olam elohayikh tsiyon ledor vador halelu-yah f"],"en":["Hallelujah. Praise the LORD, O my soul.","I will praise the LORD while I live; I will sing praises unto my God while I have my being.","Put not your trust in princes, Nor in the son of man, in whom there is no help.","His breath goeth forth, he returneth to his dust; In that very day his thoughts perish.","Happy is he whose help is the God of Jacob, Whose hope is in the LORD his God,","Who made heaven and earth, The sea, and all that in them is; Who keepeth truth for ever;","Who executeth justice for the oppressed; Who giveth bread to the hungry. The LORD looseth the prisoners;","The LORD openeth the eyes of the blind; The LORD raiseth up them that are bowed down; The LORD loveth the righteous;","The LORD preserveth the strangers; He upholdeth the fatherless and the widow; But the way of the wicked He maketh crooked.","The LORD will reign for ever, Thy God, O Zion, unto all generations. Hallelujah."]},{"n":147,"he":["הַלְלוּ־יָהּ כִּי־טוֹב זַמְּרָה אֱלֹהֵינוּ כִּי־נָעִים נָאוָה תְהִלָּֽה׃","בּוֹנֵה יְרוּשָׁלַ͏ִם יְהֹוָה נִדְחֵי יִשְׂרָאֵל יְכַנֵּֽס׃","הָרֹפֵא לִשְׁבוּרֵי לֵב וּמְחַבֵּשׁ לְעַצְּבוֹתָֽם׃","מוֹנֶה מִסְפָּר לַכּוֹכָבִים לְכֻלָּם שֵׁמוֹת יִקְרָֽא׃","גָּדוֹל אֲדוֹנֵינוּ וְרַב־כֹּחַ לִתְבוּנָתוֹ אֵין מִסְפָּֽר׃","מְעוֹדֵד עֲנָוִים יְהֹוָה מַשְׁפִּיל רְשָׁעִים עֲדֵי־אָֽרֶץ׃","עֱנוּ לַֽיהֹוָה בְּתוֹדָה זַמְּרוּ לֵאלֹהֵינוּ בְכִנּֽוֹר׃","הַֽמְכַסֶּה שָׁמַיִם בְּעָבִים הַמֵּכִין לָאָרֶץ מָטָר הַמַּצְמִיחַ הָרִים חָצִֽיר׃","נוֹתֵן לִבְהֵמָה לַחְמָהּ לִבְנֵי עֹרֵב אֲשֶׁר יִקְרָֽאוּ׃","לֹא בִגְבוּרַת הַסּוּס יֶחְפָּץ לֹא־בְשׁוֹקֵי הָאִישׁ יִרְצֶֽה׃","רוֹצֶה יְהֹוָה אֶת־יְרֵאָיו אֶת־הַֽמְיַחֲלִים לְחַסְדּֽוֹ׃","שַׁבְּחִי יְרוּשָׁלַ͏ִם אֶת־יְהֹוָה הַֽלְלִי אֱלֹהַיִךְ צִיּֽוֹן׃","כִּֽי־חִזַּק בְּרִיחֵי שְׁעָרָיִךְ בֵּרַךְ בָּנַיִךְ בְּקִרְבֵּֽךְ׃","הַשָּׂם־גְּבוּלֵךְ שָׁלוֹם חֵלֶב חִטִּים יַשְׂבִּיעֵֽךְ׃","הַשֹּׁלֵחַ אִמְרָתוֹ אָרֶץ עַד־מְהֵרָה יָרוּץ דְּבָרֽוֹ׃","הַנֹּתֵן שֶׁלֶג כַּצָּמֶר כְּפוֹר כָּאֵפֶר יְפַזֵּֽר׃","מַשְׁלִיךְ קַֽרְחוֹ כְפִתִּים לִפְנֵי קָרָתוֹ מִי יַעֲמֹֽד׃","יִשְׁלַח דְּבָרוֹ וְיַמְסֵם יַשֵּׁב רוּחוֹ יִזְּלוּ־מָֽיִם׃","מַגִּיד דְּבָרָו לְיַעֲקֹב חֻקָּיו וּמִשְׁפָּטָיו לְיִשְׂרָאֵֽל׃","לֹא־עָשָׂה כֵן לְכׇל־גּוֹי וּמִשְׁפָּטִים בַּל־יְדָעוּם הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["halelu-yah ki-tov zamra eloheinu ki-na'im nava tehila","bone yerushalam Adonai nidchei yisra'el yekhanes","harofe lishvurei lev umchabesh le'atsvotam","mone mispar lakokhavim lekhulam shemot yikra","gadol adoneinu verav-koach litvunato ein mispar","me'oded anavim Adonai mashpil resha'im adei-arets","enu laihova betoda zamru leloheinu vekhinor","hamkhase shamayim be'avim hamekhin la'arets matar hamatsmiach harim chatsir","noten livhema lachmah livnei orev asher yikrau","lo vigvurat hasus yechpats lo-veshokei ha'ish yirtse","rotse Adonai et-yere'aiv et-hamyachalim lechasdo","shabchi yerushalam et-Adonai haleli elohayikh tsiyon","ki-chizak berichei she'arayikh berakh banayikh bekirbekh","hasam-gevulekh shalom chelev chitim yasbi'ekh","hasholeach imrato arets ad-mehera yaruts devaro","hanoten sheleg katsamer kefor ka'efer yefazer","mashlikh karcho khefitim lifnei karato mi ya'amod","yishlach devaro veyamsem yashev rucho yizlu-mayim","magid devarav leya'akov chukaiv umishpataiv leyisra'el","lo-asa khen lekhol-goy umishpatim bal-yeda'um halelu-yah f"],"en":["Hallelujah; For it is good to sing praises unto our God; For it is pleasant, and praise is comely.","The LORD doth build up Jerusalem, He gathereth together the dispersed of Israel;","Who healeth the broken in heart, And bindeth up their wounds.","He counteth the number of the stars; He giveth them all their names.","Great is our Lord, and mighty in power; His understanding is infinite.","The LORD upholdeth the humble; He bringeth the wicked down to the ground.","Sing unto the LORD with thanksgiving, Sing praises upon the harp unto our God;","Who covereth the heaven with clouds, Who prepareth rain for the earth, Who maketh the mountains to spring with grass.","He giveth to the beast his food, And to the young ravens which cry.","He delighteth not in the strength of the horse; He taketh no pleasure in the legs of a man.","The LORD taketh pleasure in them that fear Him, In those that wait for His mercy.","Glorify the LORD, O Jerusalem; Praise thy God, O Zion.","For He hath made strong the bars of thy gates; He hath blessed thy children within thee.","He maketh thy borders peace; He giveth thee in plenty the fat of wheat.","He sendeth out His commandment upon earth; His word runneth very swiftly.","He giveth snow like wool; He scattereth the hoar-frost like ashes.","He casteth forth His ice like crumbs; Who can stand before His cold?","He sendeth forth His word, and melteth them; He causeth His wind to blow, and the waters flow.","He declareth His word unto Jacob, His statutes and His ordinances unto Israel.","He hath not dealt so with any nation; And as for His ordinances, they have not known them. Hallelujah."]},{"n":148,"he":["הַלְלוּ־יָהּ הַֽלְלוּ אֶת־יְהֹוָה מִן־הַשָּׁמַיִם הַֽלְלוּהוּ בַּמְּרוֹמִֽים׃","הַֽלְלוּהוּ כׇל־מַלְאָכָיו הַלְלוּהוּ כׇּל־צְבָאָֽו׃","הַֽלְלוּהוּ שֶׁמֶשׁ וְיָרֵחַ הַֽלְלוּהוּ כׇּל־כּוֹכְבֵי אֽוֹר׃","הַֽלְלוּהוּ שְׁמֵי הַשָּׁמָיִם וְהַמַּיִם אֲשֶׁר מֵעַל הַשָּׁמָֽיִם׃","יְֽהַלְלוּ אֶת־שֵׁם יְהֹוָה כִּי הוּא צִוָּה וְנִבְרָֽאוּ׃","וַיַּעֲמִידֵם לָעַד לְעוֹלָם חׇק־נָתַן וְלֹא יַעֲבֽוֹר׃","הַֽלְלוּ אֶת־יְהֹוָה מִן־הָאָרֶץ תַּנִּינִים וְכׇל־תְּהֹמֽוֹת׃","אֵשׁ וּבָרָד שֶׁלֶג וְקִיטוֹר רוּחַ סְעָרָה עֹשָׂה דְבָרֽוֹ׃","הֶהָרִים וְכׇל־גְּבָעוֹת עֵץ פְּרִי וְכׇל־אֲרָזִֽים׃","הַחַיָּה וְכׇל־בְּהֵמָה רֶמֶשׂ וְצִפּוֹר כָּנָֽף׃","מַלְכֵי־אֶרֶץ וְכׇל־לְאֻמִּים שָׂרִים וְכׇל־שֹׁפְטֵי אָֽרֶץ׃","בַּחוּרִים וְגַם־בְּתוּלוֹת זְקֵנִים עִם־נְעָרִֽים׃","יְהַלְלוּ אֶת־שֵׁם יְהֹוָה כִּֽי־נִשְׂגָּב שְׁמוֹ לְבַדּוֹ הוֹדוֹ עַל־אֶרֶץ וְשָׁמָֽיִם׃","וַיָּרֶם קֶרֶן לְעַמּוֹ תְּהִלָּה לְֽכׇל־חֲסִידָיו לִבְנֵי יִשְׂרָאֵל עַם קְרֹבוֹ הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["halelu-yah halelu et-Adonai min-hashamayim haleluhu bamromim","haleluhu khol-mal'akhaiv haleluhu kol-tseva'av","haleluhu shemesh veyareach haleluhu kol-kokhvei or","haleluhu shemei hashamayim vehamayim asher me'al hashamayim","yehalelu et-shem Adonai ki hu tsiva venivrau","vaya'amidem la'ad le'olam chok-natan velo ya'avor","halelu et-Adonai min-ha'arets taninim vekhol-tehomot","esh uvarad sheleg vekitor ruach se'ara osa devaro","heharim vekhol-geva'ot ets peri vekhol-arazim","hachaya vekhol-behema remes vetsipor kanaf","malkhei-erets vekhol-le'umim sarim vekhol-shoftei arets","bachurim vegam-betulot zekenim im-ne'arim","yehalelu et-shem Adonai ki-nisgav shemo levado hodo al-erets veshamayim","vayarem keren le'amo tehila lekhol-chasidaiv livnei yisra'el am kerovo halelu-yah f"],"en":["Hallelujah. Praise ye the LORD from the heavens; Praise Him in the heights.","Praise ye Him, all His angels; Praise ye Him, all His hosts.","Praise ye Him, sun and moon; Praise Him, all ye stars of light.","Praise Him, ye heavens of heavens, And ye waters that are above the heavens.","Let them praise the name of the LORD; For He commanded, and they were created.","He hath also established them for ever and ever; He hath made a decree which shall not be transgressed.","Praise the LORD from the earth, Ye sea-monsters, and all deeps;","Fire and hail, snow and vapour, Stormy wind, fulfilling His word;","Mountains and all hills, Fruitful trees and all cedars;","Beasts and all cattle, Creeping things and winged fowl;","Kings of the earth and all peoples, Princes and all judges of the earth;","Both young men and maidens, Old men and children;","Let them praise the name of the LORD, For His name alone is exalted; His glory is above the earth and heaven.","And He hath lifted up a horn for His people, A praise for all His saints, Even for the children of Israel, a people near unto Him. Hallelujah."]},{"n":149,"he":["הַלְלוּ־יָהּ שִׁירוּ לַֽיהֹוָה שִׁיר חָדָשׁ תְּהִלָּתוֹ בִּקְהַל חֲסִידִֽים׃","יִשְׂמַח יִשְׂרָאֵל בְּעֹשָׂיו בְּנֵֽי־צִיּוֹן יָגִילוּ בְמַלְכָּֽם׃","יְהַלְלוּ שְׁמוֹ בְמָחוֹל בְּתֹף וְכִנּוֹר יְזַמְּרוּ־לֽוֹ׃","כִּֽי־רוֹצֶה יְהֹוָה בְּעַמּוֹ יְפָאֵר עֲנָוִים בִּישׁוּעָֽה׃","יַעְלְזוּ חֲסִידִים בְּכָבוֹד יְרַנְּנוּ עַל־מִשְׁכְּבוֹתָֽם׃","רוֹמְמוֹת אֵל בִּגְרוֹנָם וְחֶרֶב פִּיפִיּוֹת בְּיָדָֽם׃","לַעֲשׂוֹת נְקָמָה בַּגּוֹיִם תּוֹכֵחוֹת בַּלְאֻמִּֽים׃","לֶאְסֹר מַלְכֵיהֶם בְּזִקִּים וְנִכְבְּדֵיהֶם בְּכַבְלֵי בַרְזֶֽל׃","לַעֲשׂוֹת בָּהֶם מִשְׁפָּט כָּתוּב הָדָר הוּא לְכׇל־חֲסִידָיו הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["halelu-yah shiru laihova shir chadash tehilato bikhal chasidim","yismach yisra'el be'osaiv benei-tsiyon yagilu vemalkam","yehalelu shemo vemachol betof vekhinor yezamru-lo","ki-rotse Adonai be'amo yefa'er anavim bishu'a","ya'lzu chasidim bekhavod yeranenu al-mishkvotam","romemot el bigronam vecherev pifiyot beyadam","la'asot nekama bagoyim tokhechot bal'umim","le'sor malkheihem bezikim venikhbdeihem bekhavlei varzel","la'asot bahem mishpat katuv hadar hu lekhol-chasidaiv halelu-yah f"],"en":["Hallelujah. Sing unto the LORD a new song, And His praise in the assembly of the saints.","Let Israel rejoice in his Maker; Let the children of Zion be joyful in their King.","Let them praise His name in the dance; Let them sing praises unto Him with the timbrel and harp.","For the LORD taketh pleasure in His people; He adorneth the humble with salvation.","Let the saints exult in glory; Let them sing for joy upon their beds.","Let the high praises of God be in their mouth, And a two-edged sword in their hand;","To execute vengeance upon the nations, And chastisements upon the peoples;","To bind their kings with chains, And their nobles with fetters of iron;","To execute upon them the judgment written; He is the glory of all His saints. Hallelujah."]},{"n":150,"he":["הַלְלוּ־יָהּ הַֽלְלוּ־אֵל בְּקׇדְשׁוֹ הַֽלְלוּהוּ בִּרְקִיעַ עֻזּֽוֹ׃","הַלְלוּהוּ בִגְבוּרֹתָיו הַלְלוּהוּ כְּרֹב גֻּדְלֽוֹ׃","הַלְלוּהוּ בְּתֵקַע שׁוֹפָר הַלְלוּהוּ בְּנֵבֶל וְכִנּֽוֹר׃","הַלְלוּהוּ בְּתֹף וּמָחוֹל הַֽלְלוּהוּ בְּמִנִּים וְעֻגָֽב׃","הַלְלוּהוּ בְצִלְצְלֵי־שָׁמַע הַֽלְלוּהוּ בְּֽצִלְצְלֵי תְרוּעָֽה׃","כֹּל הַנְּשָׁמָה תְּהַלֵּל יָהּ הַֽלְלוּ־יָֽהּ׃"],"lat":["halelu-yah halelu-el bekodsho haleluhu birkia' uzo","haleluhu vigvurotaiv haleluhu kerov gudlo","haleluhu beteka' shofar haleluhu benevel vekhinor","haleluhu betof umachol haleluhu beminim ve'ugav","haleluhu vetsiltslei-shama' haleluhu betsiltslei teru'a","kol hanshama tehalel yah halelu-yah"],"en":["Hallelujah. Praise God in His sanctuary; Praise Him in the firmament of His power.","Praise Him for His mighty acts; Praise Him according to His abundant greatness.","Praise Him with the blast of the horn; Praise Him with the psaltery and harp.","Praise Him with the timbrel and dance; Praise Him with stringed instruments and the pipe.","Praise Him with the loud-sounding cymbals; Praise Him with the clanging cymbals.","Let every thing that hath breath praise the LORD. Hallelujah."]}]</script>
<script>
(function () {
  'use strict';
  var PS = JSON.parse(document.getElementById('data').textContent);
  var $ = function (s) { return document.querySelector(s); };
  var PREF = 'tehilim-prefs-v1', MK = 'machon-state-v1';
  var prefs; try { prefs = JSON.parse(localStorage.getItem(PREF) || '{}'); } catch (e) { prefs = {}; }
  if (prefs.lat === undefined) prefs.lat = true;
  if (prefs.en === undefined) prefs.en = true;

  function machon() { try { return JSON.parse(localStorage.getItem(MK) || 'null'); } catch (e) { return null; } }
  function todayN() { var m = machon(); return (m && m.psalms && m.psalms.next) || 1; }

  var cur = 1;
  function heNum(n) { return n; }
  function render(n) {
    n = Math.max(1, Math.min(150, n | 0)); cur = n;
    var p = PS[n - 1];
    document.title = 'תְּהִלִּים · ' + n;
    $('#title .lat').textContent = 'psalm ' + n + ' · ' + p.he.length + ' verses';
    $('#num').value = n;
    if (location.hash !== '#' + n) { try { history.replaceState(null, '', '#' + n); } catch (e) {} }
    var host = $('#verses'); host.innerHTML = '';
    p.he.forEach(function (h, i) {
      var v = document.createElement('div'); v.className = 'verse';
      v.innerHTML = '<span class="vn">' + (i + 1) + '</span>' +
        '<div class="he-line">' + h + '</div>' +
        '<div class="lat-line">' + p.lat[i] + '</div>' +
        (p.en[i] ? '<div class="en-line">' + p.en[i] + '</div>' : '');
      host.appendChild(v);
    });
    var m = machon();
    var read = m && m.psalms && m.psalms.log && m.psalms.log.some(function (r) { return r.n === n; });
    $('#marknote').textContent = read ? 'read before · next in the cycle: ' + todayN() : 'next in the cycle: ' + todayN();
    window.scrollTo(0, 0);
  }
  function applyPrefs() {
    document.body.classList.toggle('no-lat', !prefs.lat);
    document.body.classList.toggle('no-en', !prefs.en);
    $('#tg-lat').classList.toggle('on', prefs.lat);
    $('#tg-en').classList.toggle('on', prefs.en);
    try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch (e) {}
  }
  $('#tg-lat').addEventListener('click', function () { prefs.lat = !prefs.lat; applyPrefs(); });
  $('#tg-en').addEventListener('click', function () { prefs.en = !prefs.en; applyPrefs(); });
  $('#prev').addEventListener('click', function () { render(cur - 1); });
  $('#next').addEventListener('click', function () { render(cur + 1); });
  $('#num').addEventListener('change', function () { render(parseInt(this.value, 10) || 1); });
  $('#today-link').addEventListener('click', function (e) { e.preventDefault(); render(todayN()); });
  $('#mark').addEventListener('click', function () {
    // writes into the machon's own store (same origin), so the hub's counter moves too
    var m = machon() || { place: 'bayit', listen: [], body: {} };
    if (!m.psalms) m.psalms = { next: 1, log: [] };
    m.psalms.log.push({ d: new Date().toISOString().slice(0, 10), n: cur });
    if (m.psalms.next === cur) m.psalms.next = cur % 150 + 1;
    try { localStorage.setItem(MK, JSON.stringify(m)); } catch (e) {}
    render(cur % 150 + 1);
  });
  window.addEventListener('hashchange', function () {
    var n = parseInt(location.hash.slice(1), 10);
    if (n && n !== cur) render(n);
  });
  applyPrefs();
  var h = parseInt(location.hash.slice(1), 10);
  render(h || todayN());
})();
</script>
</body>
