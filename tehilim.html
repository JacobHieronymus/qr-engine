.","Sing unto God, sing praises to His name; Extol Him that rideth upon the skies, whose name is the LORD; And exult ye before Him.","A father of the fatherless, and a judge of the widows, Is God in His holy habitation.","God maketh the solitary to dwell in a house; He bringeth out the prisoners into prosperity; The rebellious dwell but in a parched land.","O God, when Thou wentest forth before Thy people, When Thou didst march through the wilderness; Selah","The earth trembled, the heavens also dropped at the presence of God; Even yon Sinai trembled at the presence of God, the God of Israel.","A bounteous rain didst Thou pour down, O God; When Thine inheritance was weary, Thou didst confirm it.","Thy flock settled therein; Thou didst prepare in Thy goodness for the poor, O God.","The Lord giveth the word; The women that proclaim the tidings are a great host.","Kings of armies flee, they flee; And she that tarrieth at home divideth the spoil.","When ye lie among the sheepfolds, The wings of the dove are covered with silver, And her pinions with the shimmer of gold. .","When the Almighty scattereth kings therein, It snoweth in Zalmon.","A mountain of God is the mountain of Bashan; A mountain of peaks is the mountain of Bashan.","Why look ye askance, ye mountains of peaks, At the mountain which God hath desired for His abode? Yea, the LORD will dwell therein for ever.","The chariots of God are myriads, even thousands upon thousands; The Lord is among them, as in Sinai, in holiness.","Thou hast ascended on high, Thou hast led captivity captive; Thou hast received gifts among men, Yea, among the rebellious also, that the LORD God might dwell there.","Blessed be the Lord, day by day He beareth our burden, Even the God who is our salvation. Selah","God is unto us a God of deliverances; And unto GOD the Lord belong the issues of death.","Surely God will smite through the head of His enemies, The hairy scalp of him that goeth about in his guiltiness.","The Lord said: 'I will bring back from Bashan, I will bring them back from the depths of the sea;","That thy foot may wade through blood, That the tongue of thy dogs may have its portion from thine enemies.'","They see Thy goings, O God, Even the goings of my God, my King, in holiness.","The singers go before, the minstrels follow after, In the midst of damsels playing upon timbrels.","'Bless ye God in full assemblies, Even the Lord, ye that are from the fountain of Israel.'","There is Benjamin, the youngest, ruling them, The princes of Judah their council, The princes of Zebulun, the princes of Naphtali.","Thy God hath commanded thy strength; Be strong, O God, Thou that hast wrought for us","Out of Thy temple at Jerusalem, Whither kings shall bring presents unto Thee.","Rebuke the wild beast of the reeds, The multitude of the bulls, with the calves of the peoples, Every one submitting himself with pieces of silver; He hath scattered the peoples that delight in war!","Nobles shall come out of Egypt; Ethiopia shall hasten to stretch out her hands unto God.","Sing unto God, ye kingdoms of the earth; O sing praises unto the Lord; Selah","To Him that rideth upon the heavens of heavens, which are of old; Lo, He uttereth His voice, a mighty voice.","Ascribe ye strength unto God; His majesty is over Israel, And His strength is in the skies.","Awful is God out of thy holy places; The God of Israel, He giveth strength and power unto the people; Blessed be God."]},{"n":69,"he":["לַמְנַצֵּחַ עַֽל־שׁוֹשַׁנִּים לְדָוִֽד׃","הוֹשִׁיעֵנִי אֱלֹהִים כִּי בָאוּ מַיִם עַד־נָֽפֶשׁ׃","טָבַעְתִּי בִּיוֵן מְצוּלָה וְאֵין מׇעֳמָד בָּאתִי בְמַעֲמַקֵּי־מַיִם וְשִׁבֹּלֶת שְׁטָפָֽתְנִי׃","יָגַעְתִּי בְקׇרְאִי נִחַר גְּרוֹנִי כָּלוּ עֵינַי מְיַחֵל לֵאלֹהָֽי׃","רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי שֹׂנְאַי חִנָּם עָצְמוּ מַצְמִיתַי אֹיְבַי שֶׁקֶר אֲשֶׁר לֹֽא־גָזַלְתִּי אָז אָשִֽׁיב׃","אֱֽלֹהִים אַתָּה יָדַעְתָּ לְאִוַּלְתִּי וְאַשְׁמוֹתַי מִמְּךָ לֹֽא־נִכְחָֽדוּ׃","אַל־יֵבֹשׁוּ בִי קֹוֶיךָ אֲדֹנָי יֱהֹוִה צְבָאוֹת אַל־יִכָּלְמֽוּ בִי מְבַקְשֶׁיךָ אֱלֹהֵי יִשְׂרָאֵֽל׃","כִּֽי־עָלֶיךָ נָשָׂאתִי חֶרְפָּה כִּסְּתָה כְלִמָּה פָנָֽי׃","מוּזָר הָיִיתִי לְאֶחָי וְנׇכְרִי לִבְנֵי אִמִּֽי׃","כִּֽי־קִנְאַת בֵּיתְךָ אֲכָלָתְנִי וְחֶרְפּוֹת חוֹרְפֶיךָ נָפְלוּ עָלָֽי׃","וָאֶבְכֶּה בַצּוֹם נַפְשִׁי וַתְּהִי לַחֲרָפוֹת לִֽי׃","וָאֶתְּנָה לְבוּשִׁי שָׂק וָאֱהִי לָהֶם לְמָשָֽׁל׃","יָשִׂיחוּ בִי יֹשְׁבֵי שָׁעַר וּנְגִינוֹת שׁוֹתֵי שֵׁכָֽר׃","וַאֲנִי תְפִלָּֽתִי־לְךָ יְהֹוָה עֵת רָצוֹן אֱלֹהִים בְּרׇב־חַסְדֶּךָ עֲנֵנִי בֶּאֱמֶת יִשְׁעֶֽךָ׃","הַצִּילֵנִי מִטִּיט וְאַל־אֶטְבָּעָה אִנָּצְלָה מִשֹּׂנְאַי וּמִמַּעֲמַקֵּי־מָֽיִם׃","אַל־תִּשְׁטְפֵנִי שִׁבֹּלֶת מַיִם וְאַל־תִּבְלָעֵנִי מְצוּלָה וְאַל־תֶּאְטַר־עָלַי בְּאֵר פִּֽיהָ׃","עֲנֵנִי יְהֹוָה כִּי־טוֹב חַסְדֶּךָ כְּרֹב רַחֲמֶיךָ פְּנֵה אֵלָֽי׃","וְאַל־תַּסְתֵּר פָּנֶיךָ מֵעַבְדֶּךָ כִּי־צַר־לִי מַהֵר עֲנֵֽנִי׃","קׇרְבָה אֶל־נַפְשִׁי גְאָלָהּ לְמַעַן אֹיְבַי פְּדֵֽנִי׃","אַתָּה יָדַעְתָּ חֶרְפָּתִי וּבׇשְׁתִּי וּכְלִמָּתִי נֶגְדְּךָ כׇּל־צוֹרְרָֽי׃","חֶרְפָּה שָׁבְרָה לִבִּי וָאָנוּשָׁה וָאֲקַוֶּה לָנוּד וָאַיִן וְלַמְנַחֲמִים וְלֹא מָצָֽאתִי׃","וַיִּתְּנוּ בְּבָרוּתִי רֹאשׁ וְלִצְמָאִי יַשְׁקוּנִי חֹֽמֶץ׃","יְהִי־שֻׁלְחָנָם לִפְנֵיהֶם לְפָח וְלִשְׁלוֹמִים לְמוֹקֵֽשׁ׃","תֶּחְשַׁכְנָה עֵינֵיהֶם מֵרְאוֹת וּמׇתְנֵיהֶם תָּמִיד הַמְעַֽד׃","שְׁפׇךְ־עֲלֵיהֶם זַעְמֶךָ וַחֲרוֹן אַפְּךָ יַשִּׂיגֵֽם׃","תְּהִי־טִירָתָם נְשַׁמָּה בְּאׇהֳלֵיהֶם אַל־יְהִי יֹשֵֽׁב׃","כִּי־אַתָּה אֲשֶׁר־הִכִּיתָ רָדָפוּ וְאֶל־מַכְאוֹב חֲלָלֶיךָ יְסַפֵּֽרוּ׃","תְּֽנָה־עָוֺן עַל־עֲוֺנָם וְאַל־יָבֹאוּ בְּצִדְקָתֶֽךָ׃","יִמָּחֽוּ מִסֵּפֶר חַיִּים וְעִם צַדִּיקִים אַל־יִכָּתֵֽבוּ׃","וַאֲנִי עָנִי וְכוֹאֵב יְשׁוּעָתְךָ אֱלֹהִים תְּשַׂגְּבֵֽנִי׃","אֲהַלְלָה שֵׁם־אֱלֹהִים בְּשִׁיר וַאֲגַדְּלֶנּוּ בְתוֹדָֽה׃","וְתִיטַב לַיהֹוָה מִשּׁוֹר פָּר מַקְרִן מַפְרִֽיס׃","רָאוּ עֲנָוִים יִשְׂמָחוּ דֹּרְשֵׁי אֱלֹהִים וִיחִי לְבַבְכֶֽם׃","כִּי־שֹׁמֵעַ אֶל־אֶבְיוֹנִים יְהֹוָה וְאֶת־אֲסִירָיו לֹא בָזָֽה׃","יְֽהַלְלוּהוּ שָׁמַיִם וָאָרֶץ יַמִּים וְֽכׇל־רֹמֵשׂ בָּֽם׃","כִּי אֱלֹהִים יוֹשִׁיעַ צִיּוֹן וְיִבְנֶה עָרֵי יְהוּדָה וְיָשְׁבוּ שָׁם וִירֵשֽׁוּהָ׃","וְזֶרַע עֲבָדָיו יִנְחָלוּהָ וְאֹהֲבֵי שְׁמוֹ יִשְׁכְּנוּ־בָֽהּ׃ {פ}"],"lat":["lamnatseach al-shoshanim ledavid","hoshi'eni elohim ki vau mayim ad-nafesh","tava'ti biven metsula ve'ein mo'omad bati vema'amakei-mayim veshibolet shetafatni","yaga'ti vekor'i nichar geroni kalu einai meyachel lelohai","rabu misa'arot roshi son'ai chinam atsmu matsmitai oyvai sheker asher lo-gazalti az ashiv","elohim ata yada'ta le'ivalti ve'ashmotai mimkha lo-nikhchadu","al-yevoshu vi koveikha adonai Adonai tsevaot al-yikalmu vi mevaksheikha elohei yisra'el","ki-aleikha nasati cherpa kista khelima fanai","muzar hayiti le'echai venokhri livnei imi","ki-kin'at beitkha akhalatni vecherpot chorfeikha naflu alai","va'evke vatsom nafshi vathi lacharafot li","va'etna levushi sak va'ehi lahem lemashal","yasichu vi yoshvei sha'ar unginot shotei shekhar","va'ani tefilati-lekha Adonai et ratson elohim berov-chasdekha aneni be'emet yish'ekha","hatsileni mitit ve'al-etba'a inatsla mison'ai umima'amakei-mayim","al-tishtfeni shibolet mayim ve'al-tivla'eni metsula ve'al-te'tar-alai be'er piah","aneni Adonai ki-tov chasdekha kerov rachameikha pene elai","ve'al-taster paneikha me'avdekha ki-tsar-li maher aneni","korva el-nafshi ge'alah lema'an oyvai pedeni","ata yada'ta cherpati uvoshti ukhlimati negdkha kol-tsorerai","cherpa shavra libi va'anusha va'akave lanud va'ayin velamnachamim velo matsati","vayitnu bevaruti rosh velitsma'i yashkuni chomets","yehi-shulchanam lifneihem lefach velishlomim lemokesh","techshakhna eineihem merot umotneihem tamid ham'ad","shefokh-aleihem za'mekha vacharon apkha yasigem","tehi-tiratam neshama be'oholeihem al-yehi yoshev","ki-ata asher-hikita radafu ve'el-makhov chalaleikha yesaperu","tena-aon al-aonam ve'al-yavou betsidkatekha","yimachu misefer chayim ve'im tsadikim al-yikatevu","va'ani ani vekho'ev yeshu'atkha elohim tesagveni","ahalela shem-elohim beshir va'agadlenu vetoda","vetitav laihova mishor par makrin mafris","rau anavim yismachu dorshei elohim vichi levavkhem","ki-shomea' el-evyonim Adonai ve'et-asiraiv lo vaza","yehaleluhu shamayim va'arets yamim vekhol-romes bam","ki elohim yoshia' tsiyon veyivne arei yehuda veyashvu sham vireshuah","vezera' avadaiv yinchaluah ve'ohavei shemo yishknu-vah f"],"en":["For the Leader; upon Shoshannim. [A Psalm] of David.","Save me, O God; For the waters are come in even unto the soul.","I am sunk in deep mire, where there is no standing; I am come into deep waters, and the flood overwhelmeth me.","I am weary of my crying; my throat is dried; Mine eyes fail while I wait for my God.","They that hate me without a cause are more than the hairs of my head; They that would cut me off, being mine enemies wrongfully, are many; Should I restore that which I took not away?","O God, Thou knowest my folly; And my trespasses are not hid from Thee.","Let not them that wait for Thee be ashamed through me, O Lord GOD of hosts; Let not those that seek Thee be brought to confusion through me, O God of Israel.","Because for Thy sake I have borne reproach; Confusion hath covered my face.","I am become a stranger unto my brethren, And an alien unto my mother's children.","Because zeal for Thy house hath eaten me up, And the reproaches of them that reproach Thee are fallen upon me.","And I wept with my soul with fasting, And that became unto me a reproach.","I made sackcloth also my garment, And I became a byword unto them.","They that sit in the gate talk of me; And I am the song of the drunkards. .","But as for me, let my prayer be unto Thee, O LORD, in an acceptable time; O God, in the abundance of Thy mercy, Answer me with the truth of Thy salvation.","Deliver me out of the mire, and let me not sink; Let me be delivered from them that hate me, and out of the deep waters.","Let not the waterflood overwhelm me, Neither let the deep swallow me up; And let not the pit shut her mouth upon me.","Answer me, O LORD, for Thy mercy is good; According to the multitude of Thy compassions turn Thou unto me.","And hide not Thy face from Thy servant; For I am in distress; answer me speedily.","Draw nigh unto my soul, and redeem it; Ransom me because of mine enemies.","Thou knowest my reproach, and my shame, and my confusion; Mine adversaries are all before Thee.","Reproach hath broken my heart; and I am sore sick; And I looked for some to show compassion, but there was none; And for comforters, but I found none.","Yea, they put poison into my food; And in my thirst they gave me vinegar to drink.","Let their table before them become a snare; And when they are in peace, let it become a trap.","Let their eyes be darkened, that they see not; And make their loins continually to totter.","Pour out Thine indignation upon them, And let the fierceness of Thine anger overtake them.","Let their encampment be desolate; Let none dwell in their tents.","For they persecute him whom Thou hast smitten; And they tell of the pain of those whom Thou hast wounded.","Add iniquity unto their iniquity; And let them not come into Thy righteousness.","Let them be blotted out of the book of the living, And not be written with the righteous.","But I am afflicted and in pain; Let Thy salvation, O God, set me up on high.","I will praise the name of God with a song, And will magnify Him with thanksgiving. .","And it shall please the LORD better than a bullock That hath horns and hoofs.","The humble shall see it, and be glad; Ye that seek after God, let your heart revive.","For the LORD hearkeneth unto the needy, And despiseth not His prisoners.","Let heaven and earth praise Him, The seas, and every thing that moveth therein.","For God will save Zion, and build the cities of Judah; And they shall abide there, and have it in possession.","The seed also of His servants shall inherit it; And they that love His name shall dwell therein."]},{"n":70,"he":["לַמְנַצֵּחַ לְדָוִד לְהַזְכִּֽיר׃","אֱלֹהִים לְהַצִּילֵנִי יְהֹוָה לְעֶזְרָתִי חֽוּשָׁה׃","יֵבֹשׁוּ וְיַחְפְּרוּ מְבַקְשֵׁי נַפְשִׁי יִסֹּגוּ אָחוֹר וְיִכָּלְמוּ חֲפֵצֵי רָעָתִֽי׃","יָשׁוּבוּ עַל־עֵקֶב בׇּשְׁתָּם הָאֹמְרִים הֶאָח הֶאָֽח׃","יָשִׂישׂוּ וְיִשְׂמְחוּ בְּךָ כׇּֽל־מְבַקְשֶׁיךָ וְיֹאמְרוּ תָמִיד יִגְדַּל אֱלֹהִים אֹהֲבֵי יְשׁוּעָתֶֽךָ׃","וַאֲנִי עָנִי וְאֶבְיוֹן אֱלֹהִים חוּשָׁה־לִּי עֶזְרִי וּמְפַלְטִי אַתָּה יְהֹוָה אַל־תְּאַחַֽר׃ {פ}"],"lat":["lamnatseach ledavid lehazkir","elohim lehatsileni Adonai le'ezrati chusha","yevoshu veyachpru mevakshei nafshi yisogu achor veyikalmu chafetsei ra'ati","yashuvu al-ekev boshtam ha'omrim he'ach he'ach","yasisu veyismchu bekha kol-mevaksheikha veyomru tamid yigdal elohim ohavei yeshu'atekha","va'ani ani ve'evyon elohim chusha-li ezri umfalti ata Adonai al-te'achar f"],"en":["For the Leader. [A Psalm] of David; to make memorial.","O God, to deliver me, O LORD, to help me, make haste.","Let them be ashamed and abashed That seek after my soul; Let them be turned backward and brought to confusion That delight in my hurt.","Let them be turned back by reason of their shame That say: 'Aha, aha.'","Let all those that seek Thee rejoice and be glad in Thee; And let such as love Thy salvation say continually: 'Let God be magnified.'","But I am poor and needy; O God, make haste unto me; Thou art my help and my deliverer; O LORD, tarry not."]},{"n":71,"he":["בְּךָֽ־יְהֹוָה חָסִיתִי אַל־אֵבוֹשָׁה לְעוֹלָֽם׃","בְּצִדְקָתְךָ תַּצִּילֵנִי וּֽתְפַלְּטֵנִי הַטֵּֽה־אֵלַי אׇזְנְךָ וְהוֹשִׁיעֵֽנִי׃","הֱיֵה לִי לְצוּר מָעוֹן לָבוֹא תָּמִיד צִוִּיתָ לְהוֹשִׁיעֵנִי כִּֽי־סַלְעִי וּמְצוּדָתִי אָֽתָּה׃","אֱֽלֹהַי פַּלְּטֵנִי מִיַּד רָשָׁע מִכַּף מְעַוֵּל וְחוֹמֵֽץ׃","כִּֽי־אַתָּה תִקְוָתִי אֲדֹנָי יֱהֹוִה מִבְטַחִי מִנְּעוּרָֽי׃","עָלֶיךָ נִסְמַכְתִּי מִבֶּטֶן מִמְּעֵי אִמִּי אַתָּה גוֹזִי בְּךָ תְהִלָּתִי תָמִֽיד׃","כְּמוֹפֵת הָיִיתִי לְרַבִּים וְאַתָּה מַֽחֲסִי־עֹֽז׃","יִמָּלֵא פִי תְּהִלָּתֶךָ כׇּל־הַיּוֹם תִּפְאַרְתֶּֽךָ׃","אַֽל־תַּשְׁלִיכֵנִי לְעֵת זִקְנָה כִּכְלוֹת כֹּחִי אַֽל־תַּעַזְבֵֽנִי׃","כִּֽי־אָמְרוּ אוֹיְבַי לִי וְשֹׁמְרֵי נַפְשִׁי נוֹעֲצוּ יַחְדָּֽו׃","לֵאמֹר אֱלֹהִים עֲזָבוֹ רִֽדְפוּ וְתִפְשׂוּהוּ כִּי־אֵין מַצִּֽיל׃","אֱלֹהִים אַל־תִּרְחַק מִמֶּנִּי אֱלֹהַי לְעֶזְרָתִי (חישה) [חֽוּשָׁה]׃","יֵבֹשׁוּ יִכְלוּ שֹׂטְנֵי נַפְשִׁי יַעֲטוּ חֶרְפָּה וּכְלִמָּה מְבַקְשֵׁי רָעָתִֽי׃","וַאֲנִי תָּמִיד אֲיַחֵל וְהוֹסַפְתִּי עַל־כׇּל־תְּהִלָּתֶֽךָ׃","פִּי יְסַפֵּר צִדְקָתֶךָ כׇּל־הַיּוֹם תְּשׁוּעָתֶךָ כִּי לֹא יָדַעְתִּי סְפֹרֽוֹת׃","אָבוֹא בִּגְבֻרוֹת אֲדֹנָי יֱהֹוִה אַזְכִּיר צִדְקָתְךָ לְבַדֶּֽךָ׃","אֱֽלֹהִים לִמַּדְתַּנִי מִנְּעוּרָי וְעַד־הֵנָּה אַגִּיד נִפְלְאוֹתֶֽיךָ׃","וְגַם עַד־זִקְנָה וְשֵׂיבָה אֱלֹהִים אַֽל־תַּעַזְבֵנִי עַד־אַגִּיד זְרוֹעֲךָ לְדוֹר לְכׇל־יָבוֹא גְּבוּרָתֶֽךָ׃","וְצִדְקָתְךָ אֱלֹהִים עַד־מָרוֹם אֲשֶׁר־עָשִׂיתָ גְדֹלוֹת אֱלֹהִים מִי כָמֽוֹךָ׃","אֲשֶׁר (הראיתנו) [הִרְאִיתַנִי ] צָרוֹת רַבּוֹת וְרָעוֹת תָּשׁוּב (תחינו) [תְּחַיֵּנִי] וּֽמִתְּהֹמוֹת הָאָרֶץ תָּשׁוּב תַּעֲלֵֽנִי׃","תֶּרֶב גְּֽדֻלָּתִי וְתִסֹּב תְּֽנַחֲמֵֽנִי׃","גַּם־אֲנִי אוֹדְךָ בִכְלִי־נֶבֶל אֲמִתְּךָ אֱלֹהָי אֲזַמְּרָה לְךָ בְכִנּוֹר קְדוֹשׁ יִשְׂרָאֵֽל׃","תְּרַנֵּנָּה שְׂפָתַי כִּי אֲזַמְּרָה־לָּךְ וְנַפְשִׁי אֲשֶׁר פָּדִֽיתָ׃","גַּם־לְשׁוֹנִי כׇּל־הַיּוֹם תֶּהְגֶּה צִדְקָתֶךָ כִּי־בֹשׁוּ כִי־חָפְרוּ מְבַקְשֵׁי רָעָתִֽי׃ {פ}"],"lat":["bekha-Adonai chasiti al-evosha le'olam","betsidkatkha tatsileni utfalteni hate-elai oznkha vehoshi'eni","heye li letsur ma'on lavo tamid tsivita lehoshi'eni ki-sal'i umtsudati ata","elohai palteni miyad rasha' mikaf me'avel vechomets","ki-ata tikvati adonai Adonai mivtachi min'urai","aleikha nismakhti mibeten mim'ei imi ata gozi bekha tehilati tamid","kemofet hayiti lerabim ve'ata machasi-oz","yimale fi tehilatekha kol-hayom tif'artekha","al-tashlikheni le'et zikna kikhlot kochi al-ta'azveni","ki-amru oyvai li veshomrei nafshi no'atsu yachdav","lemor elohim azavo ridfu vetifsuhu ki-ein matsil","elohim al-tirchak mimeni elohai le'ezrati chyshh chushah","yevoshu yikhlu sotnei nafshi ya'atu cherpa ukhlima mevakshei ra'ati","va'ani tamid ayachel vehosafti al-kol-tehilatekha","pi yesaper tsidkatekha kol-hayom teshu'atekha ki lo yada'ti seforot","avo bigvurot adonai Adonai azkir tsidkatkha levadekha","elohim limadtani min'urai ve'ad-hena agid nifloteikha","vegam ad-zikna veseiva elohim al-ta'azveni ad-agid zero'akha ledor lekhol-yavo gevuratekha","vetsidkatkha elohim ad-marom asher-asita gedolot elohim mi khamokha","asher hrytnv hir'itani tsarot rabot vera'ot tashuv tchynv tchayeni umithomot ha'arets tashuv ta'aleni","terev gedulati vetisov tenachameni","gam-ani odkha vikhli-nevel amitkha elohai azamra lekha vekhinor kedosh yisra'el","teranena sefatai ki azamra-lakh venafshi asher padita","gam-leshoni kol-hayom tehge tsidkatekha ki-voshu khi-chafru mevakshei ra'ati f"],"en":["In Thee, O LORD, have I taken refuge; Let me never be ashamed.","Deliver me in Thy righteousness, and rescue me; Incline Thine ear unto me, and save me.","Be Thou to me a sheltering rock, whereunto I may continually resort, Which Thou hast appointed to save me; For Thou art my rock and my fortress.","O my God, rescue me out of the hand of the wicked, Out of the grasp of the unrighteous and ruthless man.","For Thou art my hope; O Lord GOD, my trust from my youth.","Upon Thee have I stayed myself from birth; Thou art he that took me out of my mother's womb; My praise is continually of Thee.","I am as a wonder unto many; But Thou art my strong refuge.","My mouth shall be filled with Thy praise, And with Thy glory all the day. .","Cast me not off in the time of old age; When my strength faileth, forsake me not.","For mine enemies speak concerning me, And they that watch for my soul take counsel together,","Saying: 'God hath forsaken him; Pursue and take him; for there is none to deliver.'","O God, be not far from me; O my God, make haste to help me.","Let them be ashamed and consumed that are adversaries to my soul; Let them be covered with reproach and confusion that seek my hurt.","But as for me, I will hope continually, And will praise Thee yet more and more.","My mouth shall tell of Thy righteousness, And of Thy salvation all the day; For I know not the numbers thereof.","I will come with Thy mighty acts, O Lord GOD; I will make mention of Thy righteousness, even of Thine only.","O God, Thou hast taught me from my youth; And until now do I declare Thy wondrous works.","And even unto old age and hoary hairs, O God, forsake me not; Until I have declared Thy strength unto the next generation, Thy might to every one that is to come.","Thy righteousness also, O God, which reacheth unto high heaven; Thou who hast done great things, O God, who is like unto Thee?","Thou, who hast made me to see many and sore troubles, Wilt quicken me again, and bring me up again from the depths of the earth.","Thou wilt increase my greatness, And turn and comfort me.","I also will give thanks unto Thee with the psaltery, Even unto Thy truth, O my God; I will sing praises unto Thee with the harp, O Thou Holy One of Israel.","My lips shall greatly rejoice when I sing praises unto Thee; And my soul, which Thou hast redeemed.","My tongue also shall tell of Thy righteousness all the day; For they are ashamed, for they are abashed, that seek my hurt."]},{"n":72,"he":["לִשְׁלֹמֹה אֱֽלֹהִים מִשְׁפָּטֶיךָ לְמֶלֶךְ תֵּן וְצִדְקָתְךָ לְבֶן־מֶֽלֶךְ׃","יָדִין עַמְּךָ בְצֶדֶק וַעֲנִיֶּיךָ בְמִשְׁפָּֽט׃","יִשְׂאוּ הָרִים שָׁלוֹם לָעָם וּגְבָעוֹת בִּצְדָקָֽה׃","יִשְׁפֹּט עֲֽנִיֵּי־עָם יוֹשִׁיעַ לִבְנֵי אֶבְיוֹן וִידַכֵּא עוֹשֵֽׁק׃","יִירָאוּךָ עִם־שָׁמֶשׁ וְלִפְנֵי יָרֵחַ דּוֹר דּוֹרִֽים׃","יֵרֵד כְּמָטָר עַל־גֵּז כִּרְבִיבִים זַרְזִיף אָֽרֶץ׃","יִֽפְרַח־בְּיָמָיו צַדִּיק וְרֹב שָׁלוֹם עַד־בְּלִי יָרֵֽחַ׃","וְיֵרְדְּ מִיָּם עַד־יָם וּמִנָּהָר עַד־אַפְסֵי־אָֽרֶץ׃","לְפָנָיו יִכְרְעוּ צִיִּים וְאֹיְבָיו עָפָר יְלַחֵֽכוּ׃","מַלְכֵי תַרְשִׁישׁ וְאִיִּים מִנְחָה יָשִׁיבוּ מַלְכֵי שְׁבָא וּסְבָא אֶשְׁכָּר יַקְרִֽיבוּ׃","וְיִשְׁתַּחֲווּ־לוֹ כׇל־מְלָכִים כׇּל־גּוֹיִם יַעַבְדֽוּהוּ׃","כִּֽי־יַצִּיל אֶבְיוֹן מְשַׁוֵּעַ וְעָנִי וְֽאֵין־עֹזֵר לֽוֹ׃","יָחֹס עַל־דַּל וְאֶבְיוֹן וְנַפְשׁוֹת אֶבְיוֹנִים יוֹשִֽׁיעַ׃","מִתּוֹךְ וּמֵחָמָס יִגְאַל נַפְשָׁם וְיֵיקַר דָּמָם בְּעֵינָֽיו׃","וִיחִי וְיִתֶּן־לוֹ מִזְּהַב שְׁבָא וְיִתְפַּלֵּל בַּעֲדוֹ תָמִיד כׇּל־הַיּוֹם יְבָרְכֶֽנְהוּ׃","יְהִי פִסַּת־בַּר בָּאָרֶץ בְּרֹאשׁ הָרִים יִרְעַשׁ כַּלְּבָנוֹן פִּרְיוֹ וְיָצִיצוּ מֵעִיר כְּעֵשֶׂב הָאָֽרֶץ׃","יְהִי שְׁמוֹ לְֽעוֹלָם לִפְנֵי־שֶׁמֶשׁ (ינין) [יִנּוֹן] שְׁמוֹ וְיִתְבָּרְכוּ בוֹ כׇּל־גּוֹיִם יְאַשְּׁרֽוּהוּ׃","בָּרוּךְ יְהֹוָה אֱלֹהִים אֱלֹהֵי יִשְׂרָאֵל עֹשֵׂה נִפְלָאוֹת לְבַדּֽוֹ׃","וּבָרוּךְ שֵׁם כְּבוֹדוֹ לְעוֹלָם וְיִמָּלֵא כְבוֹדוֹ אֶת־כֹּל הָאָרֶץ אָמֵן וְאָמֵֽן׃","כׇּלּוּ תְפִלּוֹת דָּוִד בֶּן־יִשָֽׁי׃"],"lat":["lishlomo elohim mishpateikha lemelekh ten vetsidkatkha leven-melekh","yadin amkha vetsedek va'aniyeikha vemishpat","yisu harim shalom la'am ugva'ot bitsdaka","yishpot aniyei-am yoshia' livnei evyon vidake oshek","yiraukha im-shamesh velifnei yareach dor dorim","yered kematar al-gez kirvivim zarzif arets","yifrach-beyamaiv tsadik verov shalom ad-beli yareach","veyerd miyam ad-yam uminahar ad-afsei-arets","lefanaiv yikhr'u tsiyim ve'oyvaiv afar yelachekhu","malkhei tarshish ve'iyim mincha yashivu malkhei sheva usva eshkar yakrivu","veyishtachavu-lo khol-melakhim kol-goyim ya'avduhu","ki-yatsil evyon meshavea' ve'ani ve'ein-ozer lo","yachos al-dal ve'evyon venafshot evyonim yoshia'","mitokh umechamas yig'al nafsham veyeikar damam be'einaiv","vichi veyiten-lo mizhav sheva veyitpalel ba'ado tamid kol-hayom yevarkhenhu","yehi fisat-bar ba'arets berosh harim yir'ash kalvanon piryo veyatsitsu me'ir ke'esev ha'arets","yehi shemo le'olam lifnei-shemesh ynyn yinon shemo veyitbarkhu vo kol-goyim ye'ashruhu","barukh Adonai elohim elohei yisra'el ose niflaot levado","uvarukh shem kevodo le'olam veyimale khevodo et-kol ha'arets amen ve'amen","kolu tefilot david ben-yishai"],"en":["[A Psalm] of Solomon. Give the king Thy judgments, O God, and Thy righteousness unto the king's son;","That he may judge Thy people with righteousness, and Thy poor with justice.","Let the mountains bear peace to the people, and the hills, through righteousness.","May he judge the poor of the people, and save the children of the needy, And crush the oppressor.","They shall fear Thee while the sun endureth, and so long as the moon, throughout all generations.","May he come down like rain upon the mown grass, as showers that water the earth.","In his days let the righteous flourish, and abundance of peace, till the moon be no more.","May he have dominion also from sea to sea, and from the River unto the ends of the earth.","Let them that dwell in the wilderness bow before him; and his enemies lick the dust.","The kings of Tarshish and of the isles shall render tribute; the kings of Sheba and Seba shall offer gifts.","Yea, all kings shall prostrate themselves before him; All nations shall serve him.","For he will deliver the needy when he crieth; the poor also, and him that hath no helper.","He will have pity on the poor and needy, And the souls of the needy he will save.","He will redeem their soul from oppression and violence, And precious will their blood be in his sight.","That they may live, and that he may give them of the gold of Sheba, That they may pray for him continually, Yea, bless him all the day.","May he be as a rich cornfield in the land upon the top of the mountains; May his fruit rustle like Lebanon; And may they blossom out of the city like grass of the earth.","May his name endure for ever; May his name be continued as long as the sun; May men also bless themselves by him; May all nations call him happy.","Blessed be the LORD God, the God of Israel, Who only doeth wondrous things;","And blessed be His glorious name for ever; And let the whole earth be filled with His glory. Amen, and Amen.","The prayers of David the son of Jesse are ended."]},{"n":73,"he":["מִזְמוֹר לְאָסָף אַךְ טוֹב לְיִשְׂרָאֵל אֱלֹהִים לְבָרֵי לֵבָֽב׃","וַאֲנִי כִּמְעַט (נטוי) [נָטָיוּ] רַגְלָי כְּאַיִן (שפכה) [שֻׁפְּכוּ] אֲשֻׁרָֽי׃","כִּֽי־קִנֵּאתִי בַּהוֹלְלִים שְׁלוֹם רְשָׁעִים אֶרְאֶֽה׃","כִּי אֵין חַרְצֻבּוֹת לְמוֹתָם וּבָרִיא אוּלָֽם׃","בַּעֲמַל אֱנוֹשׁ אֵינֵמוֹ וְעִם־אָדָם לֹא יְנֻגָּֽעוּ׃","לָכֵן עֲנָקַתְמוֹ גַאֲוָה יַעֲטָף־שִׁית חָמָס לָֽמוֹ׃","יָצָא מֵחֵלֶב עֵינֵמוֹ עָבְרוּ מַשְׂכִּיּוֹת לֵבָֽב׃","יָמִיקוּ וִידַבְּרוּ בְרָע עֹשֶׁק מִמָּרוֹם יְדַבֵּֽרוּ׃","שַׁתּוּ בַשָּׁמַיִם פִּיהֶם וּלְשׁוֹנָם תִּהֲלַךְ בָּאָֽרֶץ׃","לָכֵן (ישיב) [יָשׁוּב] עַמּוֹ הֲלֹם וּמֵי מָלֵא יִמָּצוּ לָֽמוֹ׃","וְֽאָמְרוּ אֵיכָה יָדַֽע־אֵל וְיֵשׁ דֵּעָה בְעֶלְיֽוֹן׃","הִנֵּה־אֵלֶּה רְשָׁעִים וְשַׁלְוֵי עוֹלָם הִשְׂגּוּ־חָֽיִל׃","אַךְ־רִיק זִכִּיתִי לְבָבִי וָאֶרְחַץ בְּנִקָּיוֹן כַּפָּֽי׃","וָאֱהִי נָגוּעַ כׇּל־הַיּוֹם וְתוֹכַחְתִּי לַבְּקָרִֽים׃","אִם־אָמַרְתִּי אֲסַפְּרָה כְמוֹ הִנֵּה דוֹר בָּנֶיךָ בָגָֽדְתִּי׃","וָאֲחַשְּׁבָה לָדַעַת זֹאת עָמָל (היא) [הוּא] בְעֵינָֽי׃","עַד־אָבוֹא אֶל־מִקְדְּשֵׁי־אֵל אָבִינָה לְאַחֲרִיתָֽם׃","אַךְ בַּחֲלָקוֹת תָּשִׁית לָמוֹ הִפַּלְתָּם לְמַשּׁוּאֽוֹת׃","אֵיךְ הָיוּ לְשַׁמָּה כְרָגַע סָפוּ תַמּוּ מִן־בַּלָּהֽוֹת׃","כַּחֲלוֹם מֵהָקִיץ אֲדֹנָי בָּעִיר צַלְמָם תִּבְזֶֽה׃","כִּי יִתְחַמֵּץ לְבָבִי וְכִלְיוֹתַי אֶשְׁתּוֹנָֽן׃","וַאֲנִי־בַעַר וְלֹא אֵדָע בְּהֵמוֹת הָיִיתִי עִמָּֽךְ׃","וַאֲנִי תָמִיד עִמָּךְ אָחַזְתָּ בְּיַד־יְמִינִֽי׃","בַּעֲצָתְךָ תַנְחֵנִי וְאַחַר כָּבוֹד תִּקָּחֵֽנִי׃","מִי־לִי בַשָּׁמָיִם וְעִמְּךָ לֹא־חָפַצְתִּי בָאָֽרֶץ׃","כָּלָה שְׁאֵרִי וּלְבָבִי צוּר־לְבָבִי וְחֶלְקִי אֱלֹהִים לְעוֹלָֽם׃","כִּֽי־הִנֵּה רְחֵקֶיךָ יֹאבֵדוּ הִצְמַתָּה כׇּל־זוֹנֶה מִמֶּֽךָּ׃","וַאֲנִי קִרְבַת אֱלֹהִים לִי־טוֹב שַׁתִּי בַּאדֹנָי יֱהֹוִה מַחְסִי לְסַפֵּר כׇּל־מַלְאֲכוֹתֶֽיךָ׃ {פ}"],"lat":["mizmor le'asaf akh tov leyisra'el elohim levarei levav","va'ani kim'at ntvy nataiu raglai ke'ayin shfkhh shupkhu ashurai","ki-kineti baholelim shelom resha'im er'e","ki ein chartsubot lemotam uvari ulam","ba'amal enosh einemo ve'im-adam lo yenuga'u","lakhen anakatmo ga'ava ya'ataf-shit chamas lamo","yatsa mechelev einemo avru maskiyot levav","yamiku vidabru vera' oshek mimarom yedaberu","shatu vashamayim pihem ulshonam tihalakh ba'arets","lakhen yshyv yashuv amo halom umei male yimatsu lamo","ve'amru eikha yada'-el veyesh de'a ve'elyon","hine-ele resha'im veshalvei olam hisgu-chayil","akh-rik zikiti levavi va'erchats benikaion kapai","va'ehi nagua' kol-hayom vetokhachti labkarim","im-amarti asapra khemo hine dor baneikha vagadti","va'achashva lada'at zot amal hy hu ve'einai","ad-avo el-mikdshei-el avina le'acharitam","akh bachalakot tashit lamo hipaltam lemashuot","eikh haiu leshama kheraga' safu tamu min-balahot","kachalom mehakits adonai ba'ir tsalmam tivze","ki yitchamets levavi vekhilyotai eshtonan","va'ani-va'ar velo eda' behemot hayiti imakh","va'ani tamid imakh achazta beyad-yemini","ba'atsatkha tancheni ve'achar kavod tikacheni","mi-li vashamayim ve'imkha lo-chafatsti va'arets","kala she'eri ulvavi tsur-levavi vechelki elohim le'olam","ki-hine rechekeikha yovedu hitsmata kol-zone mimeka","va'ani kirvat elohim li-tov shati badonai Adonai machsi lesaper kol-mal'akhoteikha f"],"en":["A Psalm of Asaph. Surely God is good to Israel, even to such as are pure in heart.","But as for me, my feet were almost gone; my steps had well nigh slipped.","For I was envious at the arrogant, when I saw the prosperity of the wicked.","For there are no pangs at their death, and their body is sound.","In the trouble of man they are not; neither are they plagued like men.","Therefore pride is as a chain about their neck; violence covereth them as a garment.","Their eyes stand forth from fatness; they are gone beyond the imaginations of their heart.","They scoff, and in wickedness utter oppression; they speak as if there were none on high.","They have set their mouth against the heavens, And their tongue walketh through the earth.","Therefore His people return hither; And waters of fullness are drained out by them.","And they say: 'How doth God know? And is there knowledge in the Most High?'","Behold, such are the wicked; And they that are always at ease increase riches.","Surely in vain have I cleansed my heart, And washed my hands in innocency;","For all the day have I been plagued, And my chastisement came every morning.","If I had said: 'I will speak thus', Behold, I had been faithless to the generation of Thy children.","And when I pondered how I might know this, It was wearisome in mine eyes;","Until I entered into the sanctuary of God, And considered their end.","Surely Thou settest them in slippery places; Thou hurlest them down to utter ruin.","How are they become a desolation in a moment! They are wholly consumed by terrors.","As a dream when one awaketh, So, O Lord, when Thou arousest Thyself, Thou wilt despise their semblance.","For my heart was in a ferment, And I was pricked in my reins. .","But I was brutish, and ignorant; I was as a beast before Thee.","Nevertheless I am continually with Thee; Thou holdest my right hand.","Thou wilt guide me with Thy counsel, And afterward receive me with glory.","Whom have I in heaven but Thee? And beside Thee I desire none upon earth.","My flesh and my heart faileth; But God is the rock of my heart and my portion for ever.","For, lo, they that go far from Thee shall perish; Thou dost destroy all them that go astray from Thee.","But as for me, the nearness of God is my good; I have made the Lord GOD my refuge, That I may tell of all Thy works."]},{"n":74,"he":["מַשְׂכִּיל לְאָסָף לָמָה אֱלֹהִים זָנַחְתָּ לָנֶצַח יֶעְשַׁן אַפְּךָ בְּצֹאן מַרְעִיתֶֽךָ׃","זְכֹר עֲדָתְךָ קָנִיתָ קֶּדֶם גָּאַלְתָּ שֵׁבֶט נַחֲלָתֶךָ הַר־צִיּוֹן זֶה שָׁכַנְתָּ בּֽוֹ׃","הָרִימָה פְעָמֶיךָ לְמַשֻּׁאוֹת נֶצַח כׇּל־הֵרַע אוֹיֵב בַּקֹּֽדֶשׁ׃","שָׁאֲגוּ צֹרְרֶיךָ בְּקֶרֶב מוֹעֲדֶךָ שָׂמוּ אוֹתֹתָם אֹתֽוֹת׃","יִוָּדַע כְּמֵבִיא לְמָעְלָה בִּסְבׇךְ־עֵץ קַרְדֻּמּֽוֹת׃","(ועת) [וְעַתָּה] פִּתּוּחֶיהָ יָּחַד בְּכַשִּׁיל וְכֵילַפּוֹת יַהֲלֹמֽוּן׃","שִׁלְחוּ בָאֵשׁ מִקְדָּשֶׁךָ לָאָרֶץ חִלְּלוּ מִֽשְׁכַּן־שְׁמֶֽךָ׃","אָמְרוּ בְלִבָּם נִינָם יָחַד שָׂרְפוּ כׇל־מוֹעֲדֵי־אֵל בָּאָֽרֶץ׃","אֽוֹתֹתֵינוּ לֹא־רָאִינוּ אֵֽין־עוֹד נָבִיא וְלֹֽא־אִתָּנוּ יֹדֵעַ עַד־מָֽה׃","עַד־מָתַי אֱלֹהִים יְחָרֶף צָר יְנָאֵץ אוֹיֵב שִׁמְךָ לָנֶֽצַח׃","לָמָּה תָשִׁיב יָדְךָ וִימִינֶךָ מִקֶּרֶב (חוקך) [חֵיקְךָ] כַלֵּֽה׃","וֵאלֹהִים מַלְכִּי מִקֶּדֶם פֹּעֵל יְשׁוּעוֹת בְּקֶרֶב הָאָֽרֶץ׃","אַתָּה פוֹרַרְתָּ בְעׇזְּךָ יָם שִׁבַּרְתָּ רָאשֵׁי תַנִּינִים עַל־הַמָּֽיִם׃","אַתָּה רִצַּצְתָּ רָאשֵׁי לִוְיָתָן תִּתְּנֶנּוּ מַאֲכָל לְעָם לְצִיִּֽים׃","אַתָּה בָקַעְתָּ מַעְיָן וָנָחַל אַתָּה הוֹבַשְׁתָּ נַהֲרוֹת אֵיתָֽן׃","לְךָ יוֹם אַף־לְךָ לָיְלָה אַתָּה הֲכִינוֹתָ מָאוֹר וָשָֽׁמֶשׁ׃","אַתָּה הִצַּבְתָּ כׇּל־גְּבוּלוֹת אָרֶץ קַיִץ וָחֹרֶף אַתָּה יְצַרְתָּֽם׃","זְכׇר־זֹאת אוֹיֵב חֵרֵף יְהֹוָה וְעַם נָבָל נִאֲצוּ שְׁמֶֽךָ׃","אַל־תִּתֵּן לְחַיַּת נֶפֶשׁ תּוֹרֶךָ חַיַּת עֲנִיֶּיךָ אַל־תִּשְׁכַּח לָנֶֽצַח׃","הַבֵּט לַבְּרִית כִּי מָלְאוּ מַחֲשַׁכֵּי־אֶרֶץ נְאוֹת חָמָֽס׃","אַל־יָשֹׁב דַּךְ נִכְלָם עָנִי וְאֶבְיוֹן יְֽהַלְלוּ שְׁמֶֽךָ׃","קוּמָה אֱלֹהִים רִיבָה רִיבֶךָ זְכֹר חֶרְפָּתְךָ מִנִּי־נָבָל כׇּל־הַיּֽוֹם׃","אַל־תִּשְׁכַּח קוֹל צֹרְרֶיךָ שְׁאוֹן קָמֶיךָ עֹלֶה תָמִֽיד׃ {פ}"],"lat":["maskil le'asaf lama elohim zanachta lanetsach ye'shan apkha betson mar'itekha","zekhor adatkha kanita kedem ga'alta shevet nachalatekha har-tsiyon ze shakhanta bo","harima fe'ameikha lemashuot netsach kol-hera' oyev bakodesh","sha'agu tsorereikha bekerev mo'adekha samu ototam otot","yivada' kemevi lema'la bisvokh-ets kardumot","v't v'atah pitucheiah yachad bekhashil vekheilapot yahalomun","shilchu va'esh mikdashekha la'arets chilelu mishkan-shemekha","amru velibam ninam yachad sarfu khol-mo'adei-el ba'arets","ototeinu lo-ra'inu ein-od navi velo-itanu yodea' ad-ma","ad-matai elohim yecharef tsar yena'ets oyev shimkha lanetsach","lama tashiv yadkha viminekha mikerev chvkkh cheikkha khale","velohim malki mikedem po'el yeshu'ot bekerev ha'arets","ata forarta ve'ozkha yam shibarta rashei taninim al-hamayim","ata ritsatsta rashei livyatan titnenu ma'akhal le'am letsiyim","ata vaka'ta ma'yan vanachal ata hovashta naharot eitan","lekha yom af-lekha layla ata hakhinota maor vashamesh","ata hitsavta kol-gevulot arets kayits vachoref ata yetsartam","zekhor-zot oyev cheref Adonai ve'am naval ni'atsu shemekha","al-titen lechayat nefesh torekha chayat aniyeikha al-tishkach lanetsach","habet labrit ki malu machashakei-erets neot chamas","al-yashov dakh nikhlam ani ve'evyon yehalelu shemekha","kuma elohim riva rivekha zekhor cherpatkha mini-naval kol-hayom","al-tishkach kol tsorereikha sheon kameikha ole tamid f"],"en":["Maschil of Asaph. Why, O God, hast Thou cast us off for ever? Why doth Thine anger smoke against the flock of Thy pasture?","Remember Thy congregation, which Thou hast gotten of old, Which Thou hast redeemed to be the tribe of Thine inheritance; And mount Zion, wherein Thou hast dwelt.","Lift up Thy steps because of the perpetual ruins, Even all the evil that the enemy hath done in the sanctuary.","Thine adversaries have roared in the midst of Thy meeting-place; They have set up their own signs for signs.","It seemed as when men wield upwards Axes in a thicket of trees.","And now all the carved work thereof together They strike down with hatchet and hammers.","They have set Thy sanctuary on fire; They have profaned the dwelling-place of Thy name even to the ground.","They said in their heart: 'Let us make havoc of them altogether'; They have burned up all the meeting-places of God in the land.","We see not our signs; There is no more any prophet; Neither is there among us any that knoweth how long.","How long, O God, shall the adversary reproach? Shall the enemy blaspheme Thy name for ever?","Why withdrawest Thou Thy hand, even Thy right hand? Draw it out of Thy bosom and consume them.","Yet God is my King of old, Working salvation in the midst of the earth.","Thou didst break the sea in pieces by Thy strength; Thou didst shatter the heads of the sea-monsters in the waters.","Thou didst crush the heads of leviathan, Thou gavest him to be food to the folk inhabiting the wilderness.","Thou didst cleave fountain and brook; Thou driedst up ever-flowing rivers.","Thine is the day, Thine also the night; Thou hast established luminary and sun.","Thou hast set all the borders of the earth; Thou hast made summer and winter.","Remember this, how the enemy hath reproached the LORD, And how a base people have blasphemed Thy name.","O deliver not the soul of Thy turtle-dove unto the wild beast; Forget not the life of Thy poor for ever.","Look upon the covenant; For the dark places of the land are full of the habitations of violence.","O let not the oppressed turn back in confusion; Let the poor and needy praise Thy name.","Arise, O God, plead Thine own cause; Remember Thy reproach all the day at the hand of the base man.","Forget not the voice of Thine adversaries, The tumult of those that rise up against Thee which ascendeth continually."]},{"n":75,"he":["לַמְנַצֵּחַ אַל־תַּשְׁחֵת מִזְמוֹר לְאָסָף שִֽׁיר׃","הוֹדִינוּ לְּךָ אֱֽלֹהִים הוֹדִינוּ וְקָרוֹב שְׁמֶךָ סִפְּרוּ נִפְלְאוֹתֶֽיךָ׃","כִּי אֶקַּח מוֹעֵד אֲנִי מֵישָׁרִים אֶשְׁפֹּֽט׃","נְֽמֹגִים אֶרֶץ וְכׇל־יֹשְׁבֶיהָ אָנֹכִי תִכַּנְתִּי עַמּוּדֶיהָ סֶּֽלָה׃","אָמַרְתִּי לַהוֹלְלִים אַל־תָּהֹלּוּ וְלָרְשָׁעִים אַל־תָּרִימוּ קָֽרֶן׃","אַל־תָּרִימוּ לַמָּרוֹם קַרְנְכֶם תְּדַבְּרוּ בְצַוָּאר עָתָֽק׃","כִּי לֹא מִמּוֹצָא וּמִֽמַּעֲרָב וְלֹא מִמִּדְבַּר הָרִֽים׃","כִּֽי־אֱלֹהִים שֹׁפֵט זֶה יַשְׁפִּיל וְזֶה יָרִֽים׃","כִּי כוֹס בְּֽיַד־יְהֹוָה וְיַיִן חָמַר מָלֵא מֶסֶךְ וַיַּגֵּר מִזֶּה אַךְ־שְׁמָרֶיהָ יִמְצוּ יִשְׁתּוּ כֹּל רִשְׁעֵי־אָֽרֶץ׃","וַאֲנִי אַגִּיד לְעֹלָם אֲזַמְּרָה לֵאלֹהֵי יַעֲקֹֽב׃","וְכׇל־קַרְנֵי רְשָׁעִים אֲגַדֵּעַ תְּרוֹמַמְנָה קַֽרְנוֹת צַדִּֽיק׃ {פ}"],"lat":["lamnatseach al-tashchet mizmor le'asaf shir","hodinu lekha elohim hodinu vekarov shemekha sipru nifloteikha","ki ekach mo'ed ani meisharim eshpot","nemogim erets vekhol-yoshveiah anokhi tikanti amudeiah sela","amarti laholelim al-taholu velarsha'im al-tarimu karen","al-tarimu lamarom karnkhem tedabru vetsavar atak","ki lo mimotsa umima'arav velo mimidbar harim","ki-elohim shofet ze yashpil veze yarim","ki khos beyad-Adonai veyayin chamar male mesekh vayager mize akh-shemareiah yimtsu yishtu kol rish'ei-arets","va'ani agid le'olam azamra lelohei ya'akov","vekhol-karnei resha'im agadea' teromamna karnot tsadik f"],"en":["For the Leader; Al-tashheth. A Psalm of Asaph, a Song.","We give thanks unto Thee, O God, We give thanks, and Thy name is near; Men tell of Thy wondrous works.","'When I take the appointed time, I Myself will judge with equity.","When the earth and all the inhabitants thereof are dissolved, I Myself establish the pillars of it.' Selah","I say unto the arrogant 'Deal not arrogantly'; And to the wicked 'Lift not up the horn.'","Lift not up your horn on high; Speak not insolence with a haughty neck.","For neither from the east, nor from the west, Nor yet from the wilderness, cometh lifting up.","For God is judge; He putteth down one, and lifteth up another.","For in the hand of the LORD there is a cup, with foaming wine, full of mixture, And He poureth out of the same; Surely the dregs thereof, all the wicked of the earth shall drain them, and drink them.","But as for me, I will declare for ever, I will sing praises to the God of Jacob.","All the horns of the wicked also will I cut off; But the horns of the righteous shall be lifted up."]},{"n":76,"he":["לַמְנַצֵּחַ בִּנְגִינֹת מִזְמוֹר לְאָסָף שִֽׁיר׃","נוֹדָע בִּיהוּדָה אֱלֹהִים בְּיִשְׂרָאֵל גָּדוֹל שְׁמֽוֹ׃","וַיְהִי בְשָׁלֵם סוּכּוֹ וּמְעוֹנָתוֹ בְצִיּֽוֹן׃","שָׁמָּה שִׁבַּר רִשְׁפֵי־קָשֶׁת מָגֵן וְחֶרֶב וּמִלְחָמָה סֶֽלָה׃","נָאוֹר אַתָּה אַדִּיר מֵֽהַרְרֵי־טָֽרֶף׃","אֶשְׁתּֽוֹלְלוּ אַבִּירֵי לֵב נָמוּ שְׁנָתָם וְלֹֽא־מָצְאוּ כׇל־אַנְשֵׁי־חַיִל יְדֵיהֶֽם׃","מִגַּעֲרָתְךָ אֱלֹהֵי יַעֲקֹב נִרְדָּם וְרֶכֶב וָסֽוּס׃","אַתָּה נוֹרָא אַתָּה וּמִֽי־יַעֲמֹד לְפָנֶיךָ מֵאָז אַפֶּֽךָ׃","מִשָּׁמַיִם הִשְׁמַעְתָּ דִּין אֶרֶץ יָֽרְאָה וְשָׁקָֽטָה׃","בְּקוּם־לַמִּשְׁפָּט אֱלֹהִים לְהוֹשִׁיעַ כׇּל־עַנְוֵי־אֶרֶץ סֶֽלָה׃","כִּֽי־חֲמַת אָדָם תּוֹדֶךָּ שְׁאֵרִית חֵמֹת תַּחְגֹּֽר׃","נִדְרוּ וְשַׁלְּמוּ לַיהֹוָה אֱֽלֹהֵיכֶם כׇּל־סְבִיבָיו יֹבִילוּ שַׁי לַמּוֹרָֽא׃","יִבְצֹר רוּחַ נְגִידִים נוֹרָא לְמַלְכֵי־אָֽרֶץ׃ {פ}"],"lat":["lamnatseach binginot mizmor le'asaf shir","noda' bihuda elohim beyisra'el gadol shemo","vayhi veshalem suko um'onato vetsiyon","shama shibar rishfei-kashet magen vecherev umilchama sela","naor ata adir meharerei-taref","eshtolelu abirei lev namu shenatam velo-matsu khol-anshei-chayil yedeihem","miga'aratkha elohei ya'akov nirdam verekhev vasus","ata nora ata umi-ya'amod lefaneikha me'az apekha","mishamayim hishma'ta din erets yar'a veshakata","bekum-lamishpat elohim lehoshia' kol-anvei-erets sela","ki-chamat adam todeka she'erit chemot tachgor","nidru veshalmu laihova eloheikhem kol-sevivaiv yovilu shai lamora","yivtsor ruach negidim nora lemalkhei-arets f"],"en":["For the Leader; with string-music. A Psalm of Asaph, a Song.","In Judah is God known; His name is great in Israel.","In Salem also is set His tabernacle, And His dwelling-place in Zion.","There He broke the fiery shafts of the bow; The shield, and the sword, and the battle. Selah","Glorious art Thou and excellent, coming down from the mountains of prey.","The stout-hearted are bereft of sense, they sleep their sleep; And none of the men of might have found their hands.","At Thy rebuke, O God of Jacob, They are cast into a dead sleep, the riders also and the horses.","Thou, even Thou, art terrible; And who may stand in Thy sight when once Thou art angry?","Thou didst cause sentence to be heard from heaven; The earth feared, and was still,","When God arose to judgment, To save all the humble of the earth. Selah","Surely the wrath of man shall praise Thee; The residue of wrath shalt Thou gird upon Thee.","Vow, and pay unto the LORD your God; Let all that are round about Him bring presents unto Him that is to be feared;","He minisheth the spirit of princes; He is terrible to the kings of the earth."]},{"n":77,"he":["לַמְנַצֵּחַ עַֽל־[יְדוּתוּן] (ידיתון) לְאָסָף מִזְמֽוֹר׃","קוֹלִי אֶל־אֱלֹהִים וְאֶצְעָקָה קוֹלִי אֶל־אֱלֹהִים וְהַאֲזִין אֵלָֽי׃","בְּיוֹם צָרָתִי אֲדֹנָי דָּרָשְׁתִּי יָדִי לַיְלָה נִגְּרָה וְלֹא תָפוּג מֵאֲנָה הִנָּחֵם נַפְשִֽׁי׃","אֶזְכְּרָה אֱלֹהִים וְאֶהֱמָיָה אָשִׂיחָה וְתִתְעַטֵּף רוּחִי סֶֽלָה׃","אָחַזְתָּ שְׁמֻרוֹת עֵינָי נִפְעַמְתִּי וְלֹא אֲדַבֵּֽר׃","חִשַּׁבְתִּי יָמִים מִקֶּדֶם שְׁנוֹת עוֹלָמִֽים׃","אֶזְכְּרָה נְגִינָתִי בַּלָּיְלָה עִם־לְבָבִי אָשִׂיחָה וַיְחַפֵּשׂ רוּחִֽי׃","הַֽלְעוֹלָמִים יִזְנַח אֲדֹנָי וְלֹא־יֹסִיף לִרְצוֹת עֽוֹד׃","הֶאָפֵס לָנֶצַח חַסְדּוֹ גָּמַר אֹמֶר לְדֹר וָדֹֽר׃","הֲשָׁכַח חַנּוֹת אֵל אִם־קָפַץ בְּאַף רַחֲמָיו סֶֽלָה׃","וָאֹמַר חַלּוֹתִי הִיא שְׁנוֹת יְמִין עֶלְיֽוֹן׃","(אזכיר) [אֶזְכּוֹר] מַעַלְלֵי־יָהּ כִּֽי־אֶזְכְּרָה מִקֶּדֶם פִּלְאֶֽךָ׃","וְהָגִיתִי בְכׇל־פׇּעֳלֶךָ וּֽבַעֲלִילוֹתֶיךָ אָשִֽׂיחָה׃","אֱלֹהִים בַּקֹּדֶשׁ דַּרְכֶּךָ מִי־אֵל גָּדוֹל כֵּאלֹהִֽים׃","אַתָּה הָאֵל עֹשֵׂה פֶלֶא הוֹדַעְתָּ בָעַמִּים עֻזֶּֽךָ׃","גָּאַלְתָּ בִּזְרוֹעַ עַמֶּךָ בְּנֵֽי־יַעֲקֹב וְיוֹסֵף סֶֽלָה׃","רָאוּךָ מַּיִם אֱֽלֹהִים רָאוּךָ מַּיִם יָחִילוּ אַף יִרְגְּזוּ תְהֹמֽוֹת׃","זֹרְמוּ מַיִם עָבוֹת קוֹל נָתְנוּ שְׁחָקִים אַף־חֲצָצֶיךָ יִתְהַלָּֽכוּ׃","קוֹל רַעַמְךָ בַּגַּלְגַּל הֵאִירוּ בְרָקִים תֵּבֵל רָגְזָה וַתִּרְעַשׁ הָאָֽרֶץ׃","בַּיָּם דַּרְכֶּךָ (ושביליך) [וּֽשְׁבִילְךָ] בְּמַיִם רַבִּים וְעִקְּבוֹתֶיךָ לֹא נֹדָֽעוּ׃","נָחִיתָ כַצֹּאן עַמֶּךָ בְּֽיַד־מֹשֶׁה וְאַהֲרֹֽן׃ {פ}"],"lat":["lamnatseach al-ydutun ydytvn le'asaf mizmor","koli el-elohim ve'ets'aka koli el-elohim veha'azin elai","beiom tsarati adonai darashti yadi layla nigra velo tafug me'ana hinachem nafshi","ezkra elohim ve'ehemaya asicha vetit'atef ruchi sela","achazta shemurot einai nif'amti velo adaber","chishavti yamim mikedem shenot olamim","ezkra neginati balayla im-levavi asicha vaychapes ruchi","hal'olamim yiznach adonai velo-yosif lirtsot od","he'afes lanetsach chasdo gamar omer ledor vador","hashakhach chanot el im-kafats be'af rachamaiv sela","va'omar chaloti hi shenot yemin elyon","zkhyr 'ezkor ma'alelei-yah ki-ezkra mikedem pil'ekha","vehagiti vekhol-po'olekha uva'aliloteikha asicha","elohim bakodesh darkekha mi-el gadol kelohim","ata ha'el ose fele hoda'ta va'amim uzekha","ga'alta bizroa' amekha benei-ya'akov veiosef sela","raukha mayim elohim raukha mayim yachilu af yirgzu tehomot","zormu mayim avot kol natnu shechakim af-chatsatseikha yithalakhu","kol ra'amkha bagalgal he'iru verakim tevel ragza vatir'ash ha'arets","bayam darkekha vshvylykh ushvilkha bemayim rabim ve'ikvoteikha lo noda'u","nachita khatson amekha beyad-moshe ve'aharon f"],"en":["For the Leader; for Jeduthun. A Psalm of Asaph.","I will lift up my voice unto God, an cry; I will lift up my voice unto God, that He may give ear unto me.","In the day of my trouble I seek the Lord; With my hand uplifted, [mine eye] streameth in the night without ceasing; My soul refuseth to be comforted.","When I think thereon, O God, I must moan; When I muse thereon, my spirit fainteth. Selah .","Thou holdest fast the lids of mine eyes; I am troubled, and cannot speak.","I have pondered the days of old, the years of ancient times.","In the night I will call to remembrance my song; I will commune with mine own heart; And my spirit maketh diligent search","'Will the Lord cast off for ever? And will He be favourable no more?","Is His mercy clean gone for ever? Is His promise come to an end for evermore?","Hath God forgotten to be gracious? Hath He in anger shut up his compassions?' Selah","And I say 'This is my weakness, That the right hand of the Most High could change.","I will make mention of the deeds of the LORD; Yea, I will remember Thy wonders of old.","I will meditate also upon all Thy work, And muse on Thy doings.'","O God, Thy way is in holiness; Who is a great god like unto God?","Thou art the God that doest wonders; Thou hast made known Thy strength among the peoples.","Thou hast with Thine arm redeemed Thy people, The sons of Jacob and Joseph. Selah","The waters saw Thee, O God; The waters saw Thee, they were in pain; The depths also trembled.","The clouds flooded forth waters; The skies sent out a sound; Thine arrows also went abroad.","The voice of Thy thunder was in the whirlwind; The lightnings lighted up the world; The earth trembled and shook.","Thy way was in the sea, And Thy path in the great waters, And Thy footsteps were not known.","Thou didst lead Thy people like a flock, By the hand of Moses and Aaron."]},{"n":78,"he":["מַשְׂכִּיל לְאָסָף הַאֲזִינָה עַמִּי תּוֹרָתִי הַטּוּ אׇזְנְכֶם לְאִמְרֵי־פִֽי׃","אֶפְתְּחָה בְמָשָׁל פִּי אַבִּיעָה חִידוֹת מִנִּי־קֶֽדֶם׃","אֲשֶׁר שָׁמַעְנוּ וַנֵּדָעֵם וַאֲבוֹתֵינוּ סִפְּרוּ־לָֽנוּ׃","לֹא נְכַחֵד מִבְּנֵיהֶם לְדוֹר אַחֲרוֹן מְֽסַפְּרִים תְּהִלּוֹת יְהֹוָה וֶעֱזוּזוֹ וְנִפְלְאֹתָיו אֲשֶׁר עָשָֽׂה׃","וַיָּקֶם עֵדוּת בְּֽיַעֲקֹב וְתוֹרָה שָׂם בְּיִשְׂרָאֵל אֲשֶׁר צִוָּה אֶת־אֲבוֹתֵינוּ לְהוֹדִיעָם לִבְנֵיהֶֽם׃","לְמַעַן יֵדְעוּ דּוֹר אַחֲרוֹן בָּנִים יִוָּלֵדוּ יָקֻמוּ וִיסַפְּרוּ לִבְנֵיהֶֽם׃","וְיָשִׂימוּ בֵאלֹהִים כִּסְלָם וְלֹא יִשְׁכְּחוּ מַעַלְלֵי־אֵל וּמִצְוֺתָיו יִנְצֹֽרוּ׃","וְלֹא יִהְיוּ כַּאֲבוֹתָם דּוֹר סוֹרֵר וּמֹרֶה דּוֹר לֹא־הֵכִין לִבּוֹ וְלֹֽא־נֶאֶמְנָה אֶת־אֵל רוּחֽוֹ׃","בְּֽנֵי־אֶפְרַיִם נוֹשְׁקֵי רֽוֹמֵי־קָשֶׁת הָפְכוּ בְּיוֹם קְרָֽב׃","לֹא שָׁמְרוּ בְּרִית אֱלֹהִים וּבְתוֹרָתוֹ מֵאֲנוּ לָלֶֽכֶת׃","וַיִּשְׁכְּחוּ עֲלִילוֹתָיו וְנִפְלְאוֹתָיו אֲשֶׁר הֶרְאָֽם׃","נֶגֶד אֲבוֹתָם עָשָׂה פֶלֶא בְּאֶרֶץ מִצְרַיִם שְׂדֵה־צֹֽעַן׃","בָּקַע יָם וַיַּעֲבִירֵם וַֽיַּצֶּב־מַיִם כְּמוֹ־נֵֽד׃","וַיַּנְחֵם בֶּעָנָן יוֹמָם וְכׇל־הַלַּיְלָה בְּאוֹר אֵֽשׁ׃","יְבַקַּע צֻרִים בַּמִּדְבָּר וַיַּשְׁקְ כִּתְהֹמוֹת רַבָּֽה׃","וַיּוֹצִא נוֹזְלִים מִסָּלַע וַיּוֹרֶד כַּנְּהָרוֹת מָֽיִם׃","וַיּוֹסִיפוּ עוֹד לַחֲטֹא־לוֹ לַֽמְרוֹת עֶלְיוֹן בַּצִּיָּֽה׃","וַיְנַסּוּ־אֵל בִּלְבָבָם לִֽשְׁאׇל־אֹכֶל לְנַפְשָֽׁם׃","וַֽיְדַבְּרוּ בֵּאלֹהִים אָמְרוּ הֲיוּכַל אֵל לַעֲרֹךְ שֻׁלְחָן בַּמִּדְבָּֽר׃","הֵן הִכָּה־צוּר וַיָּזוּבוּ מַיִם וּנְחָלִים יִשְׁטֹפוּ הֲגַם־לֶחֶם יוּכַל תֵּת אִם־יָכִין שְׁאֵר לְעַמּֽוֹ׃","לָכֵן שָׁמַע יְהֹוָה וַֽיִּתְעַבָּר וְאֵשׁ נִשְּׂקָה בְיַעֲקֹב וְגַם־אַף עָלָה בְיִשְׂרָאֵֽל׃","כִּי לֹא הֶאֱמִינוּ בֵּאלֹהִים וְלֹא בָטְחוּ בִּישׁוּעָתֽוֹ׃","וַיְצַו שְׁחָקִים מִמָּעַל וְדַלְתֵי שָׁמַיִם פָּתָֽח׃","וַיַּמְטֵר עֲלֵיהֶם מָן לֶאֱכֹל וּדְגַן־שָׁמַיִם נָתַן לָֽמוֹ׃","לֶחֶם אַבִּירִים אָכַל אִישׁ צֵידָה שָׁלַח לָהֶם לָשֹֽׂבַע׃","יַסַּע קָדִים בַּשָּׁמָיִם וַיְנַהֵג בְּעֻזּוֹ תֵימָֽן׃","וַיַּמְטֵר עֲלֵיהֶם כֶּעָפָר שְׁאֵר וּֽכְחוֹל יַמִּים עוֹף כָּנָֽף׃","וַיַּפֵּל בְּקֶרֶב מַחֲנֵהוּ סָבִיב לְמִשְׁכְּנֹתָֽיו׃","וַיֹּאכְלוּ וַיִּשְׂבְּעוּ מְאֹד וְתַאֲוָתָם יָבִא לָהֶֽם׃","לֹא־זָרוּ מִתַּאֲוָתָם עוֹד אׇכְלָם בְּפִיהֶֽם׃","וְאַף אֱלֹהִים עָלָה בָהֶם וַֽיַּהֲרֹג בְּמִשְׁמַנֵּיהֶם וּבַחוּרֵי יִשְׂרָאֵל הִכְרִֽיעַ׃","בְּכׇל־זֹאת חָֽטְאוּ־עוֹד וְלֹֽא־הֶאֱמִינוּ בְּנִפְלְאוֹתָֽיו׃","וַיְכַל־בַּהֶבֶל יְמֵיהֶם וּשְׁנוֹתָם בַּבֶּהָלָֽה׃","אִם־הֲרָגָם וּדְרָשׁוּהוּ וְשָׁבוּ וְשִֽׁחֲרוּ־אֵֽל׃","וַֽיִּזְכְּרוּ כִּֽי־אֱלֹהִים צוּרָם וְאֵל עֶלְיוֹן גֹּאֲלָֽם׃","וַיְפַתּוּהוּ בְּפִיהֶם וּבִלְשׁוֹנָם יְכַזְּבוּ־לֽוֹ׃","וְלִבָּם לֹא־נָכוֹן עִמּוֹ וְלֹא נֶאֶמְנוּ בִּבְרִיתֽוֹ׃","וְהוּא רַחוּם יְכַפֵּר עָוֺן וְֽלֹא־יַֽשְׁחִית וְהִרְבָּה לְהָשִׁיב אַפּוֹ וְלֹא־יָעִיר כׇּל־חֲמָתֽוֹ׃","וַיִּזְכֹּר כִּֽי־בָשָׂר הֵמָּה רוּחַ הוֹלֵךְ וְלֹא יָשֽׁוּב׃","כַּמָּה יַמְרוּהוּ בַמִּדְבָּר יַעֲצִיבוּהוּ בִּישִׁימֽוֹן׃","וַיָּשׁוּבוּ וַיְנַסּוּ אֵל וּקְדוֹשׁ יִשְׂרָאֵל הִתְוֽוּ׃","לֹא־זָכְרוּ אֶת־יָדוֹ יוֹם אֲֽשֶׁר־פָּדָם מִנִּי־צָֽר׃","אֲשֶׁר־שָׂם בְּמִצְרַיִם אֹתוֹתָיו וּמוֹפְתָיו בִּשְׂדֵה־צֹֽעַן׃","וַיַּהֲפֹךְ לְדָם יְאֹרֵיהֶם וְנֹזְלֵיהֶם בַּל־יִשְׁתָּיֽוּן׃","יְשַׁלַּח בָּהֶם עָרֹב וַיֹּאכְלֵם וּצְפַרְדֵּעַ וַתַּשְׁחִיתֵֽם׃","וַיִּתֵּן לֶחָסִיל יְבוּלָם וִיגִיעָם לָאַרְבֶּֽה׃","יַהֲרֹג בַּבָּרָד גַּפְנָם וְשִׁקְמוֹתָם בַּחֲנָמַֽל׃","וַיַּסְגֵּר לַבָּרָד בְּעִירָם וּמִקְנֵיהֶם לָרְשָׁפִֽים׃","יְשַׁלַּח־בָּם חֲרוֹן אַפּוֹ עֶבְרָה וָזַעַם וְצָרָה מִשְׁלַחַת מַלְאֲכֵי רָעִֽים׃","יְפַלֵּס נָתִיב לְאַפּוֹ לֹא־חָשַׂךְ מִמָּוֶת נַפְשָׁם וְחַיָּתָם לַדֶּבֶר הִסְגִּֽיר׃","וַיַּךְ כׇּל־בְּכוֹר בְּמִצְרָיִם רֵאשִׁית אוֹנִים בְּאׇהֳלֵי־חָֽם׃","וַיַּסַּע כַּצֹּאן עַמּוֹ וַֽיְנַהֲגֵם כַּעֵדֶר בַּמִּדְבָּֽר׃","וַיַּנְחֵם לָבֶטַח וְלֹא פָחָדוּ וְאֶת־אוֹיְבֵיהֶם כִּסָּה הַיָּֽם׃","וַיְבִיאֵם אֶל־גְּבוּל קׇדְשׁוֹ הַר־זֶה קָנְתָה יְמִינֽוֹ׃","וַיְגָרֶשׁ מִפְּנֵיהֶם גּוֹיִם וַֽיַּפִּילֵם בְּחֶבֶל נַחֲלָה וַיַּשְׁכֵּן בְּאׇהֳלֵיהֶם שִׁבְטֵי יִשְׂרָאֵֽל׃","וַיְנַסּוּ וַיַּמְרוּ אֶת־אֱלֹהִים עֶלְיוֹן וְעֵדוֹתָיו לֹא שָׁמָֽרוּ׃","וַיִּסֹּגוּ וַֽיִּבְגְּדוּ כַּאֲבוֹתָם נֶהְפְּכוּ כְּקֶשֶׁת רְמִיָּֽה׃","וַיַּכְעִיסוּהוּ בְּבָמוֹתָם וּבִפְסִילֵיהֶם יַקְנִיאֽוּהוּ׃","שָׁמַע אֱלֹהִים וַֽיִּתְעַבָּר וַיִּמְאַס מְאֹד בְּיִשְׂרָאֵֽל׃","וַיִּטֹּשׁ מִשְׁכַּן שִׁלוֹ אֹהֶל שִׁכֵּן בָּאָדָֽם׃","וַיִּתֵּן לַשְּׁבִי עֻזּוֹ וְֽתִפְאַרְתּוֹ בְיַד־צָֽר׃","וַיַּסְגֵּר לַחֶרֶב עַמּוֹ וּבְנַחֲלָתוֹ הִתְעַבָּֽר׃","בַּחוּרָיו אָכְלָה־אֵשׁ וּבְתוּלֹתָיו לֹא הוּלָּֽלוּ׃","כֹּהֲנָיו בַּחֶרֶב נָפָלוּ וְאַלְמְנֹתָיו לֹא תִבְכֶּֽינָה׃","וַיִּקַץ כְּיָשֵׁן אֲדֹנָי כְּגִבּוֹר מִתְרוֹנֵן מִיָּֽיִן׃","וַיַּךְ־צָרָיו אָחוֹר חֶרְפַּת עוֹלָם נָתַן לָֽמוֹ׃","וַיִּמְאַס בְּאֹהֶל יוֹסֵף וּֽבְשֵׁבֶט אֶפְרַיִם לֹא בָחָֽר׃","וַיִּבְחַר אֶת־שֵׁבֶט יְהוּדָה אֶֽת־הַר צִיּוֹן אֲשֶׁר אָהֵֽב׃","וַיִּבֶן כְּמֽוֹ־רָמִים מִקְדָּשׁוֹ כְּאֶרֶץ יְסָדָהּ לְעוֹלָֽם׃","וַיִּבְחַר בְּדָוִד עַבְדּוֹ וַיִּקָּחֵהוּ מִֽמִּכְלְאֹת צֹֽאן׃","מֵאַחַר עָלוֹת הֱבִיאוֹ לִרְעוֹת בְּיַעֲקֹב עַמּוֹ וּבְיִשְׂרָאֵל נַחֲלָתֽוֹ׃","וַיִּרְעֵם כְּתֹם לְבָבוֹ וּבִתְבוּנוֹת כַּפָּיו יַנְחֵֽם׃ {פ}"],"lat":["maskil le'asaf ha'azina ami torati hatu oznkhem le'imrei-fi","eftcha vemashal pi abi'a chidot mini-kedem","asher shama'nu vaneda'em va'avoteinu sipru-lanu","lo nekhached mibneihem ledor acharon mesaprim tehilot Adonai ve'ezuzo venifl'otaiv asher asa","vayakem edut beya'akov vetora sam beyisra'el asher tsiva et-avoteinu lehodi'am livneihem","lema'an yed'u dor acharon banim yivaledu yakumu visapru livneihem","veyasimu velohim kislam velo yishkchu ma'alelei-el umitsotaiv yintsoru","velo yihyu ka'avotam dor sorer umore dor lo-hekhin libo velo-ne'emna et-el rucho","benei-efrayim noshkei romei-kashet hafkhu beiom kerav","lo sh chanamal","vayasger labarad be'iram umikneihem larshafim","yeshalach-bam charon apo evra vaza'am vetsara mishlachat mal'akhei ra'im","yefales nativ le'apo lo-chasakh mimavet nafsham vechayatam ladever hisgir","vayakh kol-bekhor bemitsrayim reshit onim be'oholei-cham","vayasa' katson amo vaynahagem ka'eder bamidbar","vayanchem lavetach velo fachadu ve'et-oyveihem kisa hayam","vayvi'em el-gevul kodsho har-ze kanta yemino","vaygaresh mipneihem goyim vayapilem bechevel nachala vayashken be'oholeihem shivtei yisra'el","vaynasu vayamru et-elohim elyon ve'edotaiv lo shamaru","vayisogu vayivgdu ka'avotam nehpkhu kekeshet remiya","vayakh'isuhu bevamotam uvifsileihem yakniuhu","shama' elohim vayit'abar vayim'as me'od beyisra'el","vayitosh mishkan shilo ohel shiken ba'adam","vayiten lashvi uzo vetif'arto veyad-tsar","vayasger lacherev amo uvnachalato hit'abar","bachuraiv akhla-esh uvtulotaiv lo hulalu","kohanaiv bacherev nafalu ve'almnotaiv lo tivkeina","vayikats keyashen adonai kegibor mitronen miyayin","vayakh-tsaraiv achor cherpat olam natan lamo","vayim'as be'ohel yosef uvshevet efrayim lo vachar","vayivchar et-shevet yehuda et-har tsiyon asher ahev","vayiven kemo-ramim mikdasho ke'erets yesadah le'olam","vayivchar bedavid avdo vayikachehu mimikhl'ot tson","me'achar alot hevio lir'ot beya'akov amo uvyisra'el nachalato","vayir'em ketom levavo uvitvunot kapaiv yanchem f"],"en":["Maschil of Asaph. Give ear, O my people, to my teaching; Incline your ears to the words of my mouth.","I will open my mouth with a parable; I will utter dark sayings concerning days of old;","That which we have heard and known, And our fathers have told us,","We will not hide from their children, Telling to the generation to come the praises of the LORD, And His strength, and His wondrous works that He hath done. .","For He established a testimony in Jacob, And appointed a law in Israel, Which He commanded our fathers, That they should make them known to their children;","That the generation to come might know them, even the children that should be born; Who should arise and tell them to their children,","That they might put their confidence in God, And not forget the works of God, But keep His commandments;","And might not be as their fathers, A stubborn and rebellious generation; A generation that set not their heart aright, And whose spirit was not stedfast with God.","The children of Ephraim were as archers handling the bow, That turned back in the day of battle.","They kept not the covenant of God, And refused to walk in His law;","And they forgot His doings, And His wondrous works that He had shown them.","Marvellous things did He in the sight of their fathers, In the land of Egypt, in the field of Zoan.","He cleaved the sea, and caused them to pass through; And He made the waters to stand as a heap.","By day also He led them with a cloud, And all the night with a light of fire.","He cleaved rocks in the wilderness, And gave them drink abundantly as out of the great deep.","He brought streams also out of the rock, And caused waters to run down like rivers.","Yet went they on still to sin against Him, To rebel against the Most High in the desert.","And they tried God in their heart By asking food for their craving.","Yea, they spoke against God; They said 'Can God prepare a table in the wilderness?","Behold, He smote the rock, that waters gushed out, And streams overflowed; Can He give bread also? Or will He provide flesh for His people?'","Therefore the LORD heard, and was wroth; And a fire was kindled against Jacob, And anger also went up against Israel;","Because they believed not in God, And trusted not in His salvation.","And He commanded the skies above, And opened the doors of heaven;","And He caused manna to rain upon them for food, And gave them of the corn of heaven.","Man did eat the bread of the mighty; He sent them provisions to the full.","He caused the east wind to set forth in heaven; And by His power He brought on the south wind.","He caused flesh also to rain upon them as the dust, And winged fowl as the sand of the seas;","And He let it fall in the midst of their camp, Round about their dwellings.","So they did eat, and were well filled; And He gave them that which they craved.","They were not estranged from their craving, Their food was yet in their mouths,","When the anger of God went up against them, And slew of the lustieth among them, And smote down the young men of Israel.","For all this they sinned still, And believed not in His wondrous works.","Therefore He ended their days as a breath, And their years in terror.","When He slew them, then they would inquire after Him, And turn back and seek God earnestly.","And they remembered that God was their Rock, And the Most High God their redeemer.","But they beguiled Him with their mouth, And lied unto Him with their tongue.","For their heart was not stedfast with Him, Neither were they faithful in His covenant.","But He, being full of compassion, forgiveth iniquity, and destroyeth not; Yea, many a time doth He turn His anger away, And doth not stir up all His wrath.","So He remembered that they were but flesh, A wind that passeth away, and cometh not again.","How oft did they rebel against Him in the wilderness, And grieve Him in the desert!","And still again they tried God, And set bounds to the Holy One of Israel.","They remembered not His hand, Nor the day when He redeemed them from the adversary.","How He set His signs in Egypt, And His wonders in the field of Zoan; .","And turned their rivers into blood, So that they could not drink their streams.","He sent among them swarms of flies, which devoured them; And frogs, which destroyed them.","He gave also their increase unto the caterpillar, And their labour unto the locust.","He destroyed their vines with hail, And their sycamore-trees with frost.","He gave over their cattle also to the hail, And their flocks to fiery bolts.","He sent forth upon them the fierceness of His anger, Wrath, and indignation, and trouble, A sending of messengers of evil.","He levelled a path for His anger; He spared not their soul from death, But gave their life over to the pestilence;","And smote all the first-born in Egypt, The first-fruits of their strength in the tents of Ham;","But He made His own people to go forth like sheep, And guided them in the wilderness like a flock.","And He led them safely, and they feared not; But the sea overwhelmed their enemies.","And He brought them to His holy border, To the mountain, which His right hand had gotten.","He drove out the nations also before them, And allotted them for an inheritance by line, And made the tribes of Israel to dwell in their tents.","Yet they tried and provoked God, the Most High, And kept not His testimonies;","But turned back, and dealt treacherously like their fathers; They were turned aside like a deceitful bow.","For they provoked Him with their high places, And moved Him to jealousy with their graven images.","God heard, and was wroth, And He greatly abhorred Israel;","And He forsook the tabernacle of Shiloh, The tent which He had made to dwell among men;","And delivered His strength into captivity, And His glory into the adversary's hand.","He gave His people over also unto the sword; And was wroth with His inheritance.","Fire devoured their young men; And their virgins had no marriage-song.","Their priests fell by the sword; And their widows made no lamentation. .","Then the Lord awaked as one asleep, Like a mighty man recovering from wine.","And He smote His adversaries backward; He put upon them a perpetual reproach.","Moreover He abhorred the tent of Joseph, And chose not the tribe of Ephraim;","But chose the tribe of Judah, The mount Zion which He loved.","And He built His sanctuary like the heights, Like the earth which He hath founded for ever.","He chose David also His servant, And took him from the sheepfolds;","From following the ewes that give suck He brought him, To be shepherd over Jacob His people, and Israel His inheritance.","So he shepherded them according to the integrity of his heart; And lead them by the skilfulness of his hands."]},{"n":79,"he":["מִזְמוֹר לְאָסָף אֱֽלֹהִים בָּאוּ גוֹיִם בְּֽנַחֲלָתֶךָ טִמְּאוּ אֶת־הֵיכַל קׇדְשֶׁךָ שָׂמוּ אֶת־יְרוּשָׁלַ͏ִם לְעִיִּֽים׃","נָתְנוּ אֶת־נִבְלַת עֲבָדֶיךָ מַאֲכָל לְעוֹף הַשָּׁמָיִם בְּשַׂר חֲסִידֶיךָ לְחַיְתוֹ־אָֽרֶץ׃","שָׁפְכוּ דָמָם כַּמַּיִם סְֽבִיבוֹת יְֽרוּשָׁלָ͏ִם וְאֵין קוֹבֵֽר׃","הָיִינוּ חֶרְפָּה לִשְׁכֵנֵינוּ לַעַג וָקֶלֶס לִסְבִיבוֹתֵֽינוּ׃","עַד־מָה יְהֹוָה תֶּאֱנַף לָנֶצַח תִּֽבְעַר כְּמוֹ־אֵשׁ קִנְאָתֶֽךָ׃","שְׁפֹךְ חֲמָתְךָ אֶֽל־הַגּוֹיִם אֲשֶׁר לֹא־יְדָעוּךָ וְעַל מַמְלָכוֹת אֲשֶׁר בְּשִׁמְךָ לֹא קָרָֽאוּ׃","כִּי אָכַל אֶֽת־יַעֲקֹב וְֽאֶת־נָוֵהוּ הֵשַֽׁמּוּ׃","אַֽל־תִּזְכׇּר־לָנוּ עֲוֺנֹת רִאשֹׁנִים מַהֵר יְקַדְּמוּנוּ רַחֲמֶיךָ כִּי דַלּוֹנוּ מְאֹֽד׃","עׇזְרֵנוּ אֱלֹהֵי יִשְׁעֵנוּ עַֽל־דְּבַר כְּבֽוֹד־שְׁמֶךָ וְהַצִּילֵנוּ וְכַפֵּר עַל־חַטֹּאתֵינוּ לְמַעַן שְׁמֶֽךָ׃","לָמָּה יֹאמְרוּ הַגּוֹיִם אַיֵּה אֱֽלֹהֵיהֶם יִוָּדַע (בגיים) [בַּגּוֹיִם] לְעֵינֵינוּ נִקְמַת דַּֽם־עֲבָדֶיךָ הַשָּׁפֽוּךְ׃","תָּבוֹא לְפָנֶיךָ אֶנְקַת אָסִיר כְּגֹדֶל זְרוֹעֲךָ הוֹתֵר בְּנֵי תְמוּתָֽה׃","וְהָשֵׁב לִשְׁכֵנֵינוּ שִׁבְעָתַיִם אֶל־חֵיקָם חֶרְפָּתָם אֲשֶׁר חֵרְפוּךָ אֲדֹנָֽי׃","וַאֲנַחְנוּ עַמְּךָ וְצֹאן מַרְעִיתֶךָ נוֹדֶה לְּךָ לְעוֹלָם לְדוֹר וָדֹר נְסַפֵּר תְּהִלָּתֶֽךָ׃ {פ}"],"lat":["mizmor le'asaf elohim bau goyim benachalatekha timu et-heikhal kodshekha samu et-yerushalam le'iyim","natnu et-nivlat avadeikha ma'akhal le'of hashamayim besar chasideikha lechayto-arets","shafkhu damam kamayim sevivot yerushalam ve'ein kover","hayinu cherpa lishkheneinu la'ag vakeles lisvivoteinu","ad-ma Adonai te'enaf lanetsach tiv'ar kemo-esh kin'atekha","shefokh chamatkha el-hagoyim asher lo-yeda'ukha ve'al mamlakhot asher beshimkha lo karau","ki akhal et-ya'akov ve'et-navehu heshamu","al-tizkor-lanu aonot rishonim maher yekadmunu rachameikha ki dalonu me'od","ozrenu elohei yish'enu al-devar kevod-shemekha vehatsilenu vekhaper al-chatoteinu lema'an shemekha","lama yomru hagoyim aye eloheihem yivada' vgyym bagoyim le'eineinu nikmat dam-avadeikha hashafukh","tavo lefaneikha enkat asir kegodel zero'akha hoter benei temuta","vehashev lishkheneinu shiv'atayim el-cheikam cherpatam asher cherfukha adonai","va'anachnu amkha vetson mar'itekha node lekha le'olam ledor vador nesaper tehilatekha f"],"en":["A Psalm of Asaph. O God, the heathen are come into Thine inheritance; They have defiled Thy holy temple; They have made Jerusalem into heaps.","They have given the dead bodies of Thy servants to be food unto the fowls of the heaven, The flesh of Thy saints unto the beasts of the earth.","They have shed their blood like water Round about Jerusalem, with none to bury them.","We are become a taunt to our neighbours, A scorn and derision to them that are round about us.","How long, O LORD, wilt Thou be angry for ever? How long will Thy jealousy burn like fire?","Pour out Thy wrath upon the nations that know Thee not, And upon the kingdoms that call not upon Thy name.","For they have devoured Jacob, And laid waste his habitation.","Remember not against us the iniquities of our forefathers; Let Thy compassions speedily come to meet us; For we are brought very low.","Help us, O God of our salvation, for the sake of the glory of Thy name; And deliver us, and forgive our sins, for Thy name's sake.","Wherefore should the nations say: 'Where is their God?' Let the avenging of Thy servants' blood that is shed Be made known among the nations in our sight. .","Let the groaning of the prisoner come before Thee; According to the greatness of Thy power set free those that are appointed to death;","And render unto our neighbours sevenfold into their bosom Their reproach, wherewith they have reproached Thee, O Lord.","So we that are Thy people and the flock of Thy pasture Will give Thee thanks for ever; We will tell of Thy praise to all generations."]},{"n":80,"he":["לַמְנַצֵּחַ אֶל־שֹׁשַׁנִּים עֵדוּת לְאָסָף מִזְמֽוֹר׃","רֹעֵה יִשְׂרָאֵל הַאֲזִינָה נֹהֵג כַּצֹּאן יוֹסֵף יֹשֵׁב הַכְּרוּבִים הוֹפִֽיעָה׃","לִפְנֵי אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה עוֹרְרָה אֶת־גְּבוּרָתֶךָ וּלְכָה לִישֻׁעָתָה לָּֽנוּ׃","אֱלֹהִים הֲשִׁיבֵנוּ וְהָאֵר פָּנֶיךָ וְנִוָּשֵֽׁעָה׃","יְהֹוָה אֱלֹהִים צְבָאוֹת עַד־מָתַי עָשַׁנְתָּ בִּתְפִלַּת עַמֶּֽךָ׃","הֶאֱכַלְתָּם לֶחֶם דִּמְעָה וַתַּשְׁקֵמוֹ בִּדְמָעוֹת שָׁלִֽישׁ׃","תְּשִׂימֵנוּ מָדוֹן לִשְׁכֵנֵינוּ וְאֹיְבֵינוּ יִלְעֲגוּ־לָֽמוֹ׃","אֱלֹהִים צְבָאוֹת הֲשִׁיבֵנוּ וְהָאֵר פָּנֶיךָ וְנִוָּשֵֽׁעָה׃","גֶּפֶן מִמִּצְרַיִם תַּסִּיעַ תְּגָרֵשׁ גּוֹיִם וַתִּטָּעֶֽהָ׃","פִּנִּיתָ לְפָנֶיהָ וַתַּשְׁרֵשׁ שׇׁרָשֶׁיהָ וַתְּמַלֵּא־אָֽרֶץ׃","כׇּסּוּ הָרִים צִלָּהּ וַעֲנָפֶיהָ אַֽרְזֵי־אֵֽל׃","תְּשַׁלַּח קְצִירֶהָ עַד־יָם וְאֶל־נָהָר יוֹנְקוֹתֶֽיהָ׃","לָמָּה פָּרַצְתָּ גְדֵרֶיהָ וְאָרוּהָ כׇּל־עֹבְרֵי דָֽרֶךְ׃","יְכַרְסְמֶנָּֽה חֲזִיר מִיָּעַר וְזִיז שָׂדַי יִרְעֶֽנָּה׃","אֱלֹהִים צְבָאוֹת שֽׁוּב־נָא הַבֵּט מִשָּׁמַיִם וּרְאֵה וּפְקֹד גֶּפֶן זֹֽאת׃","וְכַנָּה אֲשֶׁר־נָטְעָה יְמִינֶךָ וְעַל־בֵּן אִמַּצְתָּה לָּֽךְ׃","שְׂרֻפָה בָאֵשׁ כְּסוּחָה מִגַּעֲרַת פָּנֶיךָ יֹאבֵֽדוּ׃","תְּֽהִי־יָדְךָ עַל־אִישׁ יְמִינֶךָ עַל־בֶּן־אָדָם אִמַּצְתָּ לָּֽךְ׃","וְלֹא־נָסוֹג מִמֶּךָּ תְּחַיֵּנוּ וּבְשִׁמְךָ נִקְרָֽא׃","יְהֹוָה אֱלֹהִים צְבָאוֹת הֲשִׁיבֵנוּ הָאֵר פָּנֶיךָ וְנִוָּשֵֽׁעָה׃ {פ}"],"lat":["lamnatseach el-shoshanim edut le'asaf mizmor","ro'e yisra'el ha'azina noheg katson yosef yoshev hakruvim hofi'a","lifnei efrayim uvinyamin umnashe orera et-gevuratekha ulkha lishu'ata lanu","elohim hashivenu veha'er paneikha venivashe'a","Adonai elohim tsevaot ad-matai ashanta bitfilat amekha","he'ekhaltam lechem dim'a vatashkemo bidma'ot shalish","tesimenu madon lishkheneinu ve'oyveinu yil'agu-lamo","elohim tsevaot hashivenu veha'er paneikha venivashe'a","gefen mimitsrayim tasia' tegaresh goyim vatita'eah","pinita lefaneiah vatashresh shorasheiah vatmale-arets","kosu harim tsilah va'anafeiah arzei-el","teshalach ketsireah ad-yam ve'el-nahar yonkoteiah","lama paratsta gedereiah ve'aruah kol-ovrei darekh","yekharsmena chazir miya'ar veziz sadai yir'ena","elohim tsevaot shuv-na habet mishamayim ur'e ufkod gefen zot","vekhana asher-nat'a yeminekha ve'al-ben imatsta lakh","serufa va'esh kesucha miga'arat paneikha yovedu","tehi-yadkha al-ish yeminekha al-ben-adam imatsta lakh","velo-nasog mimeka techayenu uvshimkha nikra","Adonai elohim tsevaot hashivenu ha'er paneikha venivashe'a f"],"en":["For the Leader; upon Shoshannim. A testimony. A Psalm of Asaph.","Give ear, O Shepherd of Israel, Thou that leadest Joseph like a flock; Thou that art enthroned upon the cherubim, shine forth.","Before Ephraim and Benjamin and Manasseh, stir up Thy might, And come to save us.","O God, restore us; And cause Thy face to shine, and we shall be saved.","O LORD God of hosts, How long wilt Thou be angry against the prayer of Thy people?","Thou hast fed them with the bread of tears, And given them tears to drink in large measure.","Thou makest us a strife unto our neighbours; And our enemies mock as they please.","O God of hosts, restore us; And cause Thy face to shine, and we shall be saved.","Thou didst pluck up a vine out of Egypt; Thou didst drive out the nations, and didst plant it.","Thou didst clear a place before it, And it took deep root, and filled the land.","The mountains were covered with the shadow of it, And the mighty cedars with the boughs thereof.","She sent out her branches unto the sea, And her shoots unto the River.","Why hast Thou broken down her fences, So that all they that pass by the way do pluck her?","The boar out of the wood doth ravage it, That which moveth in the field feedeth on it.","O God of hosts, return, we beseech Thee; Look from heaven, and behold, and be mindful of this vine,","And of the stock which Thy right hand hath planted, And the branch that Thou madest strong for Thyself. .","It is burned with fire, it is cut down; They perish at the rebuke of Thy countenance.","Let Thy hand be upon the man of Thy right hand, Upon the son of man whom Thou madest strong for Thyself.","So shall we not turn back from Thee; Quicken Thou us, and we will call upon Thy name.","O LORD God of hosts, restore us; Cause Thy face to shine, and we shall be saved."]},{"n":81,"he":["לַמְנַצֵּחַ עַֽל־הַגִּתִּית לְאָסָֽף׃","הַרְנִינוּ לֵאלֹהִים עוּזֵּנוּ הָרִיעוּ לֵאלֹהֵי יַעֲקֹֽב׃","שְֽׂאוּ־זִמְרָה וּתְנוּ־תֹף כִּנּוֹר נָעִים עִם־נָֽבֶל׃","תִּקְעוּ בַחֹדֶשׁ שׁוֹפָר בַּכֵּסֶה לְיוֹם חַגֵּֽנוּ׃","כִּי חֹק לְיִשְׂרָאֵל הוּא מִשְׁפָּט לֵאלֹהֵי יַעֲקֹֽב׃","עֵדוּת בִּיהוֹסֵף שָׂמוֹ בְּצֵאתוֹ עַל־אֶרֶץ מִצְרָיִם שְׂפַת לֹא־יָדַעְתִּי אֶשְׁמָֽע׃","הֲסִירוֹתִי מִסֵּבֶל שִׁכְמוֹ כַּפָּיו מִדּוּד תַּעֲבֹֽרְנָה׃","בַּצָּרָה קָרָאתָ וָאֲחַלְּצֶךָּ אֶעֶנְךָ בְּסֵתֶר רַעַם אֶבְחׇנְךָ עַל־מֵי מְרִיבָה סֶֽלָה׃","שְׁמַע עַמִּי וְאָעִידָה בָּךְ יִשְׂרָאֵל אִם־תִּֽשְׁמַֽע־לִֽי׃","לֹא־יִהְיֶה בְךָ אֵל זָר וְלֹא תִשְׁתַּחֲוֶה לְאֵל נֵכָֽר׃","אָֽנֹכִי יְהֹוָה אֱלֹהֶיךָ הַֽמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם הַרְחֶב־פִּיךָ וַאֲמַלְאֵֽהוּ׃","וְלֹא־שָׁמַע עַמִּי לְקוֹלִי וְיִשְׂרָאֵל לֹא־אָבָה לִֽי׃","וָאֲשַׁלְּחֵהוּ בִּשְׁרִירוּת לִבָּם יֵלְכוּ בְּֽמוֹעֲצוֹתֵיהֶֽם׃","לוּ עַמִּי שֹׁמֵעַֽ לִי יִשְׂרָאֵל בִּדְרָכַי יְהַלֵּֽכוּ׃","כִּמְעַט אוֹיְבֵיהֶם אַכְנִיעַ וְעַל צָרֵיהֶם אָשִׁיב יָדִֽי׃","מְשַׂנְאֵי יְהֹוָה יְכַחֲשׁוּ־לוֹ וִיהִי עִתָּם לְעוֹלָֽם׃","וַֽיַּאֲכִילֵהוּ מֵחֵלֶב חִטָּה וּמִצּוּר דְּבַשׁ אַשְׂבִּיעֶֽךָ׃ {פ}"],"lat":["lamnatseach al-hagitit le'asaf","harninu lelohim uzenu hari'u lelohei ya'akov","seu-zimra utnu-tof kinor na'im im-navel","tik'u vachodesh shofar bakese leiom chagenu","ki chok leyisra'el hu mishpat lelohei ya'akov","edut bihosef samo betseto al-erets mitsrayim sefat lo-yada'ti eshma'","hasiroti misevel shikhmo kapaiv midud ta'avorna","batsara karata va'achaltseka e'enkha beseter ra'am evchonkha al-mei meriva sela","shema' ami ve'a'ida bakh yisra'el im-tishma'-li","lo-yihye vekha el zar velo tishtachave le'el nekhar","anokhi Adonai eloheikha hama'alkha me'erets mitsrayim harchev-pikha va'amal'ehu","velo-shama' ami lekoli veyisra'el lo-ava li","va'ashalchehu bishrirut libam yelkhu bemo'atsoteihem","lu ami shomea' li yisra'el bidrakhai yehalekhu","kim'at oyveihem akhnia' ve'al tsareihem ashiv yadi","mesan'ei Adonai yekhachashu-lo vihi itam le'olam","vaya'akhilehu mechelev chita umitsur devash asbi'ekha f"],"en":["For the Leader; upon the Gittith. [A Psalm] of Asaph.","Sing aloud unto God our strength; shout unto the God of Jacob.","Take up the melody, and sound the timbrel, the sweet harp with the psaltery.","Blow the horn at the new moon, at the full moon for our feast-day.","For it is a statute for Israel, an ordinance of the God of Jacob.","He appointed it in Joseph for a testimony, when He went forth against the land of Egypt. The speech of one that I knew not did I hear:","'I removed his shoulder from the burden; His hands were freed from the basket.","Thou didst call in trouble, and I rescued thee; I answered thee in the secret place of thunder; I proved thee at the waters of Meribah. Selah","Hear, O My people, and I will admonish thee: O Israel, if thou wouldest hearken unto Me!","There shall no strange god be in thee; neither shalt thou worship any foreign god.","I am the LORD thy God, who brought thee up out of the land of Egypt; open thy mouth wide, and I will fill it.","But My people hearkened not to My voice; And Israel would none of Me.","So I let them go after the stubbornness of their heart, That they might walk in their own counsels.","Oh that My people would hearken unto Me, That Israel would walk in My ways!","I would soon subdue their enemies, And turn My hand against their adversaries.","The haters of the LORD should dwindle away before Him; And their punishment should endure for ever.","They should also be fed with the fat of wheat; and with honey out of the rock would I satisfy thee.'"]},{"n":82,"he":["מִזְמוֹר לְאָסָף אֱֽלֹהִים נִצָּב בַּעֲדַת־אֵל בְּקֶרֶב אֱלֹהִים יִשְׁפֹּֽט׃","עַד־מָתַי תִּשְׁפְּטוּ־עָוֶל וּפְנֵי רְשָׁעִים תִּשְׂאוּ־סֶֽלָה׃","שִׁפְטוּ־דַל וְיָתוֹם עָנִי וָרָשׁ הַצְדִּֽיקוּ׃","פַּלְּטוּ־דַל וְאֶבְיוֹן מִיַּד רְשָׁעִים הַצִּֽילוּ׃","לֹא יָדְעוּ וְלֹא יָבִינוּ בַּחֲשֵׁכָה יִתְהַלָּכוּ יִמּוֹטוּ כׇּל־מוֹסְדֵי אָֽרֶץ׃","אֲֽנִי־אָמַרְתִּי אֱלֹהִים אַתֶּם וּבְנֵי עֶלְיוֹן כֻּלְּכֶֽם׃","אָכֵן כְּאָדָם תְּמוּתוּן וּכְאַחַד הַשָּׂרִים תִּפֹּֽלוּ׃","קוּמָה אֱלֹהִים שׇׁפְטָה הָאָרֶץ כִּֽי־אַתָּה תִנְחַל בְּכׇל־הַגּוֹיִֽם׃ {פ}"],"lat":["mizmor le'asaf elohim nitsav ba'adat-el bekerev elohim yishpot","ad-matai tishptu-avel ufnei resha'im tisu-sela","shiftu-dal veyatom ani varash hatsdiku","paltu-dal ve'evyon miyad resha'im hatsilu","lo yad'u velo yavinu bachashekha yithalakhu yimotu kol-mosdei arets","ani-amarti elohim atem uvnei elyon kulkhem","akhen ke'adam temutun ukh'achad hasarim tipolu","kuma elohim shofta ha'arets ki-ata tinchal bekhol-hagoyim f"],"en":["A Psalm of Asaph. God standeth in the congregation of God; in the midst of the judges He judgeth:","'How long will ye judge unjustly, and respect the persons of the wicked? Selah","Judge the poor and fatherless; do justice to the afflicted and destitute.","Rescue the poor and needy; deliver them out of the hand of the wicked.","They know not, neither do they understand; they go about in darkness; all the foundations of the earth are moved.","I said: Ye are godlike beings, and all of you sons of the Most High.","Nevertheless ye shall die like men, and fall like one of the princes.'","Arise, O God, judge the earth; for Thou shalt possess all the nations."]},{"n":83,"he":["שִׁיר מִזְמוֹר לְאָסָֽף׃","אֱלֹהִים אַל־דֳּמִי־לָךְ אַל־תֶּחֱרַשׁ וְאַל־תִּשְׁקֹט אֵֽל׃","כִּֽי־הִנֵּה אוֹיְבֶיךָ יֶהֱמָיוּן וּמְשַׂנְאֶיךָ נָשְׂאוּ רֹֽאשׁ׃","עַֽל־עַמְּךָ יַעֲרִימוּ סוֹד וְיִתְיָעֲצוּ עַל־צְפוּנֶֽיךָ׃","אָמְרוּ לְכוּ וְנַכְחִידֵם מִגּוֹי וְלֹֽא־יִזָּכֵר שֵֽׁם־יִשְׂרָאֵל עֽוֹד׃","כִּי נוֹעֲצוּ לֵב יַחְדָּו עָלֶיךָ בְּרִית יִכְרֹֽתוּ׃","אׇהֳלֵי אֱדוֹם וְיִשְׁמְעֵאלִים מוֹאָב וְהַגְרִֽים׃","גְּבָל וְעַמּוֹן וַעֲמָלֵק פְּלֶשֶׁת עִם־יֹשְׁבֵי צֽוֹר׃","גַּם־אַשּׁוּר נִלְוָה עִמָּם הָיֽוּ־זְרוֹעַ לִבְנֵי־לוֹט סֶֽלָה׃","עֲשֵֽׂה־לָהֶם כְּמִדְיָן כְּֽסִיסְרָא כְיָבִין בְּנַחַל קִישֽׁוֹן׃","נִשְׁמְדוּ בְֽעֵין־דֹּאר הָיוּ דֹמֶן לָאֲדָמָֽה׃","שִׁיתֵמוֹ נְדִיבֵימוֹ כְּעֹרֵב וְכִזְאֵב וּֽכְזֶבַח וּכְצַלְמֻנָּע כׇּל־נְסִיכֵֽימוֹ׃","אֲשֶׁר אָמְרוּ נִירְשָׁה לָּנוּ אֵת נְאוֹת אֱלֹהִֽים׃","אֱֽלֹהַי שִׁיתֵמוֹ כַגַּלְגַּל כְּקַשׁ לִפְנֵי־רֽוּחַ׃","כְּאֵשׁ תִּבְעַר־יָעַר וּכְלֶהָבָה תְּלַהֵט הָרִֽים׃","כֵּן תִּרְדְּפֵם בְּסַעֲרֶךָ וּבְסוּפָתְךָ תְבַהֲלֵֽם׃","מַלֵּא פְנֵיהֶם קָלוֹן וִיבַקְשׁוּ שִׁמְךָ יְהֹוָֽה׃","יֵבֹשׁוּ וְיִבָּהֲלוּ עֲדֵי־עַד וְֽיַחְפְּרוּ וְיֹאבֵֽדוּ׃","וְֽיֵדְעוּ כִּי־אַתָּה שִׁמְךָ יְהֹוָה לְבַדֶּךָ עֶלְיוֹן עַל־כׇּל־הָאָֽרֶץ׃ {פ}"],"lat":["shir mizmor le'asaf","elohim al-domi-lakh al-techerash ve'al-tishkot el","ki-hine oyveikha yehemaiun umsan'eikha nasu rosh","al-amkha ya'arimu sod veyitya'atsu al-tsefuneikha","amru lekhu venakhchidem migoy velo-yizakher shem-yisra'el od","ki no'atsu lev yachdav aleikha berit yikhrotu","oholei edom veyishm'elim mo'av vehagrim","geval ve'amon va'amalek peleshet im-yoshvei tsor","gam-ashur nilva imam haiu-zeroa' livnei-lot sela","ase-lahem kemidyan kesisra kheyavin benachal kishon","nishmdu ve'ein-dor haiu domen la'adama","shitemo nediveimo ke'orev vekhiz'ev ukhzevach ukhtsalmuna' kol-nesikheimo","asher amru nirsha lanu et neot elohim","elohai shitemo khagalgal kekash lifnei-ruach","ke'esh tiv'ar-ya'ar ukhlehava telahet harim","ken tirdfem besa'arekha uvsufatkha tevahalem","male feneihem kalon vivakshu shimkha Adonai","yevoshu veyibahalu adei-ad veyachpru veyovedu","veyed'u ki-ata shimkha Adonai levadekha elyon al-kol-ha'arets f"],"en":["A Song, a Psalm of Asaph.","O God, keep not Thou silence; Hold not Thy peace, and be not still, O God.","For, lo, Thine enemies are in an uproar; And they that hate Thee have lifted up the head.","They hold crafty converse against Thy people, And take counsel against Thy treasured ones.","They have said: 'Come, and let us cut them off from being a nation; That the name of Israel may be no more in remembrance.'","For they have consulted together with one consent; Against Thee do they make a covenant;","The tents of Edom and the Ishmaelites; Moab, and the Hagrites;","Gebal, and Ammon, and Amalek; Philistia with the inhabitants of Tyre;","Assyria also is joined with them; They have been an arm to the children of Lot. Selah","Do Thou unto them as unto Midian; As to Sisera, as to Jabin, at the brook Kishon;","Who were destroyed at En-dor; They became as dung for the earth.","Make their nobles like Oreb and Zeeb, And like Zebah and Zalmunna all their princes;","Who said: 'Let us take to ourselves in possession The habitations of God.'","O my God, make them like the whirling dust; As stubble before the wind.","As the fire that burneth the forest, And as the flame that setteth the mountains ablaze;","So pursue them with Thy tempest, And affright them with Thy storm.","Fill their faces with shame; That they may seek Thy name, O LORD.","Let them be ashamed and affrighted for ever; Yea, let them be abashed and perish;","That they may know that it is Thou alone whose name is the LORD, The Most High over all the earth."]},{"n":84,"he":["לַמְנַצֵּחַ עַֽל־הַגִּתִּית לִבְנֵי־קֹרַח מִזְמֽוֹר׃","מַה־יְּדִידוֹת מִשְׁכְּנוֹתֶיךָ יְהֹוָה צְבָאֽוֹת׃","נִכְסְפָה וְגַם־כָּלְתָה נַפְשִׁי לְחַצְרוֹת יְהֹוָה לִבִּי וּבְשָׂרִי יְרַנְּנוּ אֶל אֵֽל־חָֽי׃","גַּם־צִפּוֹר מָצְאָה בַיִת וּדְרוֹר קֵן לָהּ אֲשֶׁר־שָׁתָה אֶפְרֹחֶיהָ אֶֽת־מִזְבְּחוֹתֶיךָ יְהֹוָה צְבָאוֹת מַלְכִּי וֵאלֹהָֽי׃","אַשְׁרֵי יוֹשְׁבֵי בֵיתֶךָ עוֹד יְֽהַלְלוּךָ סֶּֽלָה׃","אַשְׁרֵי אָדָם עֽוֹז־לוֹ בָךְ מְסִלּוֹת בִּלְבָבָֽם׃","עֹבְרֵי בְּעֵמֶק הַבָּכָא מַעְיָן יְשִׁיתוּהוּ גַּם־בְּרָכוֹת יַעְטֶה מוֹרֶֽה׃","יֵלְכוּ מֵחַיִל אֶל־חָיִל יֵרָאֶה אֶל־אֱלֹהִים בְּצִיּֽוֹן׃","יְהֹוָה אֱלֹהִים צְבָאוֹת שִׁמְעָה תְפִלָּתִי הַאֲזִינָה אֱלֹהֵי יַעֲקֹב סֶֽלָה׃","מָגִנֵּנוּ רְאֵה אֱלֹהִים וְהַבֵּט פְּנֵי מְשִׁיחֶֽךָ׃","כִּי טֽוֹב־יוֹם בַּחֲצֵרֶיךָ מֵאָלֶף בָּחַרְתִּי הִסְתּוֹפֵף בְּבֵית אֱלֹהַי מִדּוּר בְּאׇהֳלֵי־רֶֽשַׁע׃","כִּי שֶׁמֶשׁ וּמָגֵן יְהֹוָה אֱלֹהִים חֵן וְכָבוֹד יִתֵּן יְהֹוָה לֹא יִמְנַע־טוֹב לַֽהֹלְכִים בְּתָמִֽים׃","יְהֹוָה צְבָאוֹת אַֽשְׁרֵי אָדָם בֹּטֵחַ בָּֽךְ׃ {פ}"],"lat":["lamnatseach al-hagitit livnei-korach mizmor","ma-yedidot mishknoteikha Adonai tsevaot","nikhsfa vegam-kalta nafshi lechatsrot Adonai libi uvsari yeranenu el el-chai","gam-tsipor mats'a vayit udror ken lah asher-shata efrocheiah et-mizbchoteikha Adonai tsevaot malki velohai","ashrei yoshvei veitekha od yehalelukha sela","ashrei adam oz-lo vakh mesilot bilvavam","ovrei be'emek habakha ma'yan yeshituhu gam-berakhot ya'te more","yelkhu mechayil el-chayil yera'e el-elohim betsiyon","Adonai elohim tsevaot shim'a tefilati ha'azina elohei ya'akov sela","maginenu re'e elohim vehabet penei meshichekha","ki tov-yom bachatsereikha me'alef bacharti histofef beveit elohai midur be'oholei-resha'","ki shemesh umagen Adonai elohim chen vekhavod yiten Adonai lo yimna'-tov laholkhim betamim","Adonai tsevaot ashrei adam boteach bakh f"],"en":["For the Leader; upon the Gittith. A Psalm of the sons of Korah.","How lovely are Thy tabernacles, O LORD of hosts!","My soul yearneth, yea, even pineth for the courts of the LORD; my heart and my flesh sing for joy unto the living God.","Yea, the sparrow hath found a house, and the swallow a nest for herself, Where she may lay her young; Thine altars, O LORD of hosts, My King, and my God—","Happy are they that dwell in Thy house, they are ever praising Thee. Selah","Happy is the man whose strength is in Thee; in whose heart are the highways.","Passing through the valley of Baca they make it a place of springs; yea, the early rain clotheth it with blessings.","They go from strength to strength, every one of them appeareth before God in Zion.","O LORD God of hosts, hear my prayer; give ear, O God of Jacob. Selah","Behold, O God our shield, and look upon the face of Thine anointed.","For a day in Thy courts is better than a thousand; I had rather stand at the threshold of the house of my God, than to dwell in the tents of wickedness.","For the LORD God is a sun and a shield; the LORD giveth grace and glory; No good thing will He withhold from them that walk uprightly.","O LORD of hosts, happy is the man that trusteth in Thee."]},{"n":85,"he":["לַמְנַצֵּחַ לִבְנֵי־קֹרַח מִזְמֽוֹר׃","רָצִיתָ יְהֹוָה אַרְצֶךָ שַׁבְתָּ (שבות) [שְׁבִית] יַעֲקֹֽב׃","נָשָׂאתָ עֲוֺן עַמֶּךָ כִּסִּיתָ כׇל־חַטָּאתָם סֶֽלָה׃","אָסַפְתָּ כׇל־עֶבְרָתֶךָ הֱשִׁיבוֹתָ מֵחֲרוֹן אַפֶּֽךָ׃","שׁוּבֵנוּ אֱלֹהֵי יִשְׁעֵנוּ וְהָפֵר כַּעַסְךָ עִמָּֽנוּ׃","הַלְעוֹלָם תֶּאֱנַף־בָּנוּ תִּמְשֹׁךְ אַפְּךָ לְדֹר וָדֹֽר׃","הֲֽלֹא־אַתָּה תָּשׁוּב תְּחַיֵּנוּ וְעַמְּךָ יִשְׂמְחוּ־בָֽךְ׃","הַרְאֵנוּ יְהֹוָה חַסְדֶּךָ וְיֶשְׁעֲךָ תִּתֶּן־לָֽנוּ׃","אֶשְׁמְעָה מַה־יְדַבֵּר הָאֵל יְהֹוָה כִּי יְדַבֵּר שָׁלוֹם אֶל־עַמּוֹ וְאֶל־חֲסִידָיו וְאַל־יָשׁוּבוּ לְכִסְלָֽה׃","אַךְ קָרוֹב לִירֵאָיו יִשְׁעוֹ לִשְׁכֹּן כָּבוֹד בְּאַרְצֵֽנוּ׃","חֶסֶד־וֶאֱמֶת נִפְגָּשׁוּ צֶדֶק וְשָׁלוֹם נָשָֽׁקוּ׃","אֱמֶת מֵאֶרֶץ תִּצְמָח וְצֶדֶק מִשָּׁמַיִם נִשְׁקָֽף׃","גַּם־יְהֹוָה יִתֵּן הַטּוֹב וְאַרְצֵנוּ תִּתֵּן יְבוּלָֽהּ׃","צֶדֶק לְפָנָיו יְהַלֵּךְ וְיָשֵׂם לְדֶרֶךְ פְּעָמָֽיו׃ {פ}"],"lat":["lamnatseach livnei-korach mizmor","ratsita Adonai artsekha shavta shvvt shvit ya'akov","nasata aon amekha kisita khol-chatatam sela","asafta khol-evratekha heshivota mecharon apekha","shuvenu elohei yish'enu vehafer ka'askha imanu","hal'olam te'enaf-banu timshokh apkha ledor vador","halo-ata tashuv techayenu ve'amkha yismchu-vakh","har'enu Adonai chasdekha veyesh'akha titen-lanu","eshm'a ma-yedaber ha'el Adonai ki yedaber shalom el-amo ve'el-chasidaiv ve'al-yashuvu lekhisla","akh karov lire'aiv yish'o lishkon kavod be'artsenu","chesed-ve'emet nifgashu tsedek veshalom nashaku","emet me'erets titsmach vetsedek mishamayim nishkaf","gam-Adonai yiten hatov ve'artsenu titen yevulah","tsedek lefanaiv yehalekh veyasem lederekh pe'amaiv f"],"en":["For the Leader. A Psalm of the sons of Korah.","LORD, Thou hast been favourable unto Thy
