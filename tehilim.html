 keep His covenant and His testimonies.","For Thy name's sake, O LORD, Pardon mine iniquity, for it is great.","What man is he that feareth the LORD? Him will He instruct in the way that He should choose.","His soul shall abide in prosperity; And his seed shall inherit the land.","The counsel of the LORD is with them that fear Him; And His covenant, to make them know it.","Mine eyes are ever toward the LORD; For He will bring forth my feet out of the net.","Turn Thee unto me, and be gracious unto me; For I am solitary and afflicted.","The troubles of my heart are enlarged; O bring Thou me out of my distresses.","See mine affliction and my travail; And forgive all my sins.","Consider how many are mine enemies, And the cruel hatred wherewith they hate me. .","O keep my soul, and deliver me; Let me not be ashamed, for I have taken refuge in Thee.","Let integrity and uprightness preserve me, Because I wait for Thee.","Redeem Israel, O God, out of all his troubles."]},{"n":26,"he":["לְדָוִד שׇׁפְטֵנִי יְהֹוָה כִּֽי־אֲנִי בְּתֻמִּי הָלַכְתִּי וּבַיהֹוָה בָּטַחְתִּי לֹא אֶמְעָֽד׃","בְּחָנֵנִי יְהֹוָה וְנַסֵּנִי (צרופה) [צׇרְפָה] כִלְיוֹתַי וְלִבִּֽי׃","כִּֽי־חַסְדְּךָ לְנֶגֶד עֵינָי וְהִתְהַלַּכְתִּי בַּאֲמִתֶּֽךָ׃","לֹֽא־יָשַׁבְתִּי עִם־מְתֵי־שָׁוְא וְעִם נַעֲלָמִים לֹא אָבֽוֹא׃","שָׂנֵאתִי קְהַל מְרֵעִים וְעִם־רְשָׁעִים לֹא אֵשֵֽׁב׃","אֶרְחַץ בְּנִקָּיוֹן כַּפָּי וַאֲסֹבְבָה אֶת־מִזְבַּחֲךָ יְהֹוָֽה׃","לַשְׁמִעַ בְּקוֹל תּוֹדָה וּלְסַפֵּר כׇּל־נִפְלְאוֹתֶֽיךָ׃","יְֽהֹוָה אָהַבְתִּי מְעוֹן בֵּיתֶךָ וּמְקוֹם מִשְׁכַּן כְּבוֹדֶֽךָ׃","אַל־תֶּאֱסֹף עִם־חַטָּאִים נַפְשִׁי וְעִם־אַנְשֵׁי דָמִים חַיָּֽי׃","אֲשֶׁר־בִּידֵיהֶם זִמָּה וִימִינָם מָלְאָה שֹּֽׁחַד׃","וַאֲנִי בְּתֻמִּי אֵלֵךְ פְּדֵנִי וְחׇנֵּֽנִי׃","רַגְלִי עָמְדָה בְמִישׁוֹר בְּמַקְהֵלִים אֲבָרֵךְ יְהֹוָֽה׃ {פ}"],"lat":["ledavid shofteni Adonai ki-ani betumi halakhti uvaihova batachti lo em'ad","bechaneni Adonai venaseni tsrvfh tsorfah khilyotai velibi","ki-chasdkha leneged einai vehithalakhti ba'amitekha","lo-yashavti im-metei-shav ve'im na'alamim lo avo","saneti kehal mere'im ve'im-resha'im lo eshev","erchats benikaion kapai va'asoveva et-mizbachakha Adonai","lashmia' bekol toda ulsaper kol-nifloteikha","Adonai ahavti me'on beitekha umkom mishkan kevodekha","al-te'esof im-chata'im nafshi ve'im-anshei damim chayai","asher-bideihem zima viminam mal'a shochad","va'ani betumi elekh pedeni vechoneni","ragli amda vemishor bemakhelim avarekh Adonai f"],"en":["[A Psalm] of David. Judge me, O LORD, for I have walked in mine integrity, and I have trusted in the LORD without wavering.","Examine me, O LORD, and try me; test my reins and my heart.","For Thy mercy is before mine eyes; and I have walked in Thy truth.","I have not sat with men of falsehood; neither will I go in with dissemblers.","I hate the gathering of evil doers, and will not sit with the wicked.","I will wash my hands in innocency; so will I compass Thine altar, O LORD,","That I may make the voice of thanksgiving to be heard, and tell of all Thy wondrous works.","LORD, I love the habitation of Thy house, and the place where Thy glory dwelleth.","Gather not my soul with sinners, nor my life with men of blood;","In whose hands is craftiness, and their right hand is full of bribes.","But as for me, I will walk in mine integrity; Redeem me, and be gracious unto me.","My foot standeth in an even place; in the congregations will I bless the LORD."]},{"n":27,"he":["לְדָוִד יְהֹוָה אוֹרִי וְיִשְׁעִי מִמִּי אִירָא יְהֹוָה מָעוֹז־חַיַּי מִמִּי אֶפְחָֽד׃","בִּקְרֹב עָלַי מְרֵעִים לֶאֱכֹל אֶת־בְּשָׂרִי צָרַי וְאֹיְבַי לִי הֵמָּה כָשְׁלוּ וְנָפָֽלוּ׃","אִם־תַּחֲנֶה עָלַי מַחֲנֶה לֹא־יִירָא לִבִּי אִם־תָּקוּם עָלַי מִלְחָמָה בְּזֹאת אֲנִי בוֹטֵֽחַ׃","אַחַת שָׁאַלְתִּי מֵאֵת־יְהֹוָה אוֹתָהּ אֲבַקֵּשׁ שִׁבְתִּי בְּבֵית־יְהֹוָה כׇּל־יְמֵי חַיַּי לַחֲזוֹת בְּנֹעַם־יְהֹוָה וּלְבַקֵּר בְּהֵֽיכָלֽוֹ׃","כִּי יִצְפְּנֵנִי בְּסֻכֹּה בְּיוֹם רָעָה יַסְתִּרֵנִי בְּסֵתֶר אׇהֳלוֹ בְּצוּר יְרוֹמְמֵֽנִי׃","וְעַתָּה יָרוּם רֹאשִׁי עַל אֹיְבַי סְֽבִיבוֹתַי וְאֶזְבְּחָה בְאׇהֳלוֹ זִבְחֵי תְרוּעָה אָשִׁירָה וַאֲזַמְּרָה לַֽיהֹוָֽה׃","שְׁמַע־יְהֹוָה קוֹלִי אֶקְרָא וְחׇנֵּנִי וַעֲנֵֽנִי׃","לְךָ אָמַר לִבִּי בַּקְּשׁוּ פָנָי אֶת־פָּנֶיךָ יְהֹוָה אֲבַקֵּֽשׁ׃","אַל־תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי אַל תַּט־בְּאַף עַבְדֶּךָ עֶזְרָתִי הָיִיתָ אַֽל־תִּטְּשֵׁנִי וְאַל־תַּעַזְבֵנִי אֱלֹהֵי יִשְׁעִֽי׃","כִּֽי־אָבִי וְאִמִּי עֲזָבוּנִי וַֽיהֹוָה יַאַסְפֵֽנִי׃","הוֹרֵנִי יְהֹוָה דַּרְכֶּךָ וּנְחֵנִי בְּאֹרַח מִישׁוֹר לְמַעַן שֽׁוֹרְרָֽי׃","אַֽל־תִּתְּנֵנִי בְּנֶפֶשׁ צָרָי כִּי קָמוּ־בִי עֵדֵי־שֶׁקֶר וִיפֵחַ חָמָֽס׃","לׅׄוּׅׄלֵׅׄאׅׄ הֶאֱמַנְתִּי לִרְאוֹת בְּֽטוּב־יְהֹוָה בְּאֶרֶץ חַיִּֽים׃","קַוֵּה אֶל־יְהֹוָה חֲזַק וְיַאֲמֵץ לִבֶּךָ וְקַוֵּה אֶל־יְהֹוָֽה׃ {פ}"],"lat":["ledavid Adonai ori veyish'i mimi ira Adonai ma'oz-chayai mimi efchad","bikrov alai mere'im le'ekhol et-besari tsarai ve'oyvai li hema khashlu venafalu","im-tachane alai machane lo-yira libi im-takum alai milchama bezot ani voteach","achat sha'alti me'et-Adonai otah avakesh shivti beveit-Adonai kol-yemei chayai lachazot beno'am-Adonai ulvaker beheikhalo","ki yitspneni besuko beiom ra'a yastireni beseter oholo betsur yeromemeni","ve'ata yarum roshi al oyvai sevivotai ve'ezbcha ve'oholo zivchei teru'a ashira va'azamra laihova","shema'-Adonai koli ekra vechoneni va'aneni","lekha amar libi bakshu fanai et-paneikha Adonai avakesh","al-taster paneikha mimeni al tat-be'af avdekha ezrati hayita al-titsheni ve'al-ta'azveni elohei yish'i","ki-avi ve'imi azavuni vaihova ya'asfeni","horeni Adonai darkekha uncheni be'orach mishor lema'an shorerai","al-titneni benefesh tsarai ki kamu-vi edei-sheker vifeach chamas","lule he'emanti lirot betuv-Adonai be'erets chayim","kave el-Adonai chazak veya'amets libekha vekave el-Adonai f"],"en":["[A Psalm] of David. The LORD is my light and my salvation; whom shall I fear? The LORD is the stronghold of my life; of whom shall I be afraid?","When evil-doers came upon me to eat up my flesh, Even mine adversaries and my foes, they stumbled and fell.","Though a host should encamp against me, My heart shall not fear; Though war should rise up against me, Even then will I be confident.","One thing have I asked of the LORD, that will I seek after: That I may dwell in the house of the LORD all the days of my life, To behold the graciousness of the LORD, and to visit early in His temple.","For He concealeth me in His pavilion in the day of evil; He hideth me in the covert of His tent; He lifteth me up upon a rock. .","And now shall my head be lifted up above mine enemies round about me; And I will offer in His tabernacle sacrifices with trumpet-sound; I will sing, yea, I will sing praises unto the LORD.","Hear, O LORD, when I call with my voice, And be gracious unto me, and answer me.","In Thy behalf my heart hath said: ‘Seek ye My face'; Thy face, LORD, will I seek.","Hide not Thy face far from me; Put not Thy servant away in anger; Thou hast been my help; Cast me not off, neither forsake me, O God of my salvation.","For though my father and my mother have forsaken me, The LORD will take me up.","Teach me Thy way, O LORD; And lead me in an even path, Because of them that lie in wait for me.","Deliver me not over unto the will of mine adversaries; For false witnesses are risen up against me, and such as breathe out violence.","If I had not believed to look upon the goodness of the LORD In the land of the living!—","Wait on the LORD; Be strong, and let thy heart take courage; Yea, wait thou for the LORD."]},{"n":28,"he":["לְדָוִד אֵלֶיךָ יְהֹוָה אֶקְרָא צוּרִי אַֽל־תֶּחֱרַשׁ מִמֶּנִּי פֶּן־תֶּחֱשֶׁה מִמֶּנִּי וְנִמְשַׁלְתִּי עִם־יוֹרְדֵי בֽוֹר׃","שְׁמַע קוֹל תַּחֲנוּנַי בְּשַׁוְּעִי אֵלֶיךָ בְּנׇשְׂאִי יָדַי אֶל־דְּבִיר קׇדְשֶֽׁךָ׃","אַל־תִּמְשְׁכֵנִי עִם־רְשָׁעִים וְעִם־פֹּעֲלֵי אָוֶן דֹּבְרֵי שָׁלוֹם עִם־רֵעֵיהֶם וְרָעָה בִּלְבָבָֽם׃","תֶּן־לָהֶם כְּפׇעֳלָם וּכְרֹעַ מַעַלְלֵיהֶם כְּמַעֲשֵׂה יְדֵיהֶם תֵּן לָהֶם הָשֵׁב גְּמוּלָם לָהֶֽם׃","כִּי לֹא יָבִינוּ אֶל־פְּעֻלֹּת יְהֹוָה וְאֶל־מַעֲשֵׂה יָדָיו יֶהֶרְסֵם וְלֹא יִבְנֵֽם׃","בָּרוּךְ יְהֹוָה כִּי־שָׁמַע קוֹל תַּחֲנוּנָֽי׃","יְהֹוָה עֻזִּי וּמָגִנִּי בּוֹ בָטַח לִבִּי וְֽנֶעֱזָרְתִּי וַיַּעֲלֹז לִבִּי וּֽמִשִּׁירִי אֲהוֹדֶֽנּוּ׃","יְהֹוָה עֹֽז־לָמוֹ וּמָעוֹז יְשׁוּעוֹת מְשִׁיחוֹ הֽוּא׃","הוֹשִׁיעָה אֶת־עַמֶּךָ וּבָרֵךְ אֶת־נַחֲלָתֶךָ וּֽרְעֵם וְנַשְּׂאֵם עַד־הָעוֹלָֽם׃ {פ}"],"lat":["ledavid eleikha Adonai ekra tsuri al-techerash mimeni pen-techeshe mimeni venimshalti im-yordei vor","shema' kol tachanunai beshav'i eleikha benos'i yadai el-devir kodshekha","al-timshkheni im-resha'im ve'im-po'alei aven dovrei shalom im-re'eihem vera'a bilvavam","ten-lahem kefo'olam ukhroa' ma'aleleihem kema'ase yedeihem ten lahem hashev gemulam lahem","ki lo yavinu el-pe'ulot Adonai ve'el-ma'ase yadaiv yehersem velo yivnem","barukh Adonai ki-shama' kol tachanunai","Adonai uzi umagini bo vatach libi vene'ezarti vaya'aloz libi umishiri ahodenu","Adonai oz-lamo uma'oz yeshu'ot meshicho hu","hoshi'a et-amekha uvarekh et-nachalatekha ur'em venas'em ad-ha'olam f"],"en":["[A Psalm] of David. Unto thee, O LORD, do I call; My Rock, be not Thou deaf unto me; Lest, if Thou be silent unto me, I become like them that go down into the pit.","Hear the voice of my supplications, when I cry unto Thee, When I lift up my hands toward Thy holy Sanctuary.","Draw me not away with the wicked, And with the workers of iniquity; Who speak peace with their neighbours, But evil is in their hearts.","Give them according to their deeds, and according to the evil of their endeavours; Give them after the work of their hands; Render to them their desert.","Because they give no heed to the works of the LORD, Nor to the operation of His hands; He will break them down and not build them up.","Blessed be the LORD, Because He hath heard the voice of my supplications.","The LORD is my strength and my shield, In Him hath my heart trusted, And I am helped; Therefore my heart greatly rejoiceth, And with my song will I praise Him.","The LORD is a strength unto them; And He is a stronghold of salvation to His anointed.","Save Thy people, and bless Thine inheritance; And tend them, and carry them for ever."]},{"n":29,"he":["מִזְמוֹר לְדָוִד הָבוּ לַיהֹוָה בְּנֵי אֵלִים הָבוּ לַיהֹוָה כָּבוֹד וָעֹֽז׃","הָבוּ לַיהֹוָה כְּבוֹד שְׁמוֹ הִשְׁתַּחֲווּ לַיהֹוָה בְּהַדְרַת־קֹֽדֶשׁ׃","קוֹל יְהֹוָה עַל־הַמָּיִם אֵֽל־הַכָּבוֹד הִרְעִים יְהֹוָה עַל־מַיִם רַבִּֽים׃","קוֹל־יְהֹוָה בַּכֹּחַ קוֹל יְהֹוָה בֶּהָדָֽר׃","קוֹל יְהֹוָה שֹׁבֵר אֲרָזִים וַיְשַׁבֵּר יְהֹוָה אֶת־אַרְזֵי הַלְּבָנֽוֹן׃","וַיַּרְקִידֵם כְּמוֹ־עֵגֶל לְבָנוֹן וְשִׂרְיֹן כְּמוֹ בֶן־רְאֵמִֽים׃","קוֹל־יְהֹוָה חֹצֵב לַהֲבוֹת אֵֽשׁ׃","קוֹל יְהֹוָה יָחִיל מִדְבָּר יָחִיל יְהֹוָה מִדְבַּר קָדֵֽשׁ׃","קוֹל יְהֹוָה יְחוֹלֵל אַיָּלוֹת וַֽיֶּחֱשֹׂף יְעָרוֹת וּבְהֵיכָלוֹ כֻּלּוֹ אֹמֵר כָּבֽוֹד׃","יְהֹוָה לַמַּבּוּל יָשָׁב וַיֵּשֶׁב יְהֹוָה מֶלֶךְ לְעוֹלָֽם׃","יְֽהֹוָה עֹז לְעַמּוֹ יִתֵּן יְהֹוָה יְבָרֵךְ אֶת־עַמּוֹ בַשָּׁלֽוֹם׃ {פ}"],"lat":["mizmor ledavid havu laihova benei elim havu laihova kavod va'oz","havu laihova kevod shemo hishtachavu laihova behadrat-kodesh","kol Adonai al-hamayim el-hakavod hir'im Adonai al-mayim rabim","kol-Adonai bakoach kol Adonai behadar","kol Adonai shover arazim vayshaber Adonai et-arzei halvanon","vayarkidem kemo-egel levanon vesiryon kemo ven-re'emim","kol-Adonai chotsev lahavot esh","kol Adonai yachil midbar yachil Adonai midbar kadesh","kol Adonai yecholel ayalot vayechesof ye'arot uvheikhalo kulo omer kavod","Adonai lamabul yashav vayeshev Adonai melekh le'olam","Adonai oz le'amo yiten Adonai yevarekh et-amo vashalom f"],"en":["A Psalm of David. Ascribe unto the LORD, O ye sons of might, Ascribe unto the LORD glory and strength.","Ascribe unto the LORD the glory due unto His name; Worship the LORD in the beauty of holiness.","The voice of the LORD is upon the waters; The God of glory thundereth, Even the LORD upon many waters.","The voice of the LORD is powerful; The voice of the LORD is full of majesty.","The voice of the LORD breaketh the cedars; yea, the LORD breaketh in pieces the cedars of Lebanon.","He maketh them also to skip like a calf; Lebanon and Sirion like a young wild-ox.","The voice of the LORD heweth out flames of fire.","The voice of the LORD shaketh the wilderness; The LORD shaketh the wilderness of Kadesh.","The voice of the LORD maketh the hinds to calve, And strippeth the forests bare; And in His temple all say: 'Glory.'","The LORD sat enthroned at the flood; Yea, the LORD sitteth as King for ever.","The LORD will give strength unto His people; The LORD will bless his people with peace."]},{"n":30,"he":["מִזְמוֹר שִׁיר־חֲנֻכַּת הַבַּיִת לְדָוִֽד׃","אֲרוֹמִמְךָ יְהֹוָה כִּי דִלִּיתָנִי וְלֹֽא־שִׂמַּחְתָּ אֹיְבַי לִֽי׃","יְהֹוָה אֱלֹהָי שִׁוַּעְתִּי אֵלֶיךָ וַתִּרְפָּאֵֽנִי׃","יְֽהֹוָה הֶעֱלִיתָ מִן־שְׁאוֹל נַפְשִׁי חִיִּיתַנִי (מיורדי) [מִיׇּֽרְדִי־]בֽוֹר׃","זַמְּרוּ לַיהֹוָה חֲסִידָיו וְהוֹדוּ לְזֵכֶר קׇדְשֽׁוֹ׃","כִּי רֶגַע בְּאַפּוֹ חַיִּים בִּרְצוֹנוֹ בָּעֶרֶב יָלִין בֶּכִי וְלַבֹּקֶר רִנָּֽה׃","וַאֲנִי אָמַרְתִּי בְשַׁלְוִי בַּל־אֶמּוֹט לְעוֹלָֽם׃","יְֽהֹוָה בִּרְצוֹנְךָ הֶעֱמַדְתָּה לְֽהַרְרִי־עֹז הִסְתַּרְתָּ פָנֶיךָ הָיִיתִי נִבְהָֽל׃","אֵלֶיךָ יְהֹוָה אֶקְרָא וְאֶל־אֲדֹנָי אֶתְחַנָּֽן׃","מַה־בֶּצַע בְּדָמִי בְּרִדְתִּי אֶל־שָׁחַת הֲיוֹדְךָ עָפָר הֲיַגִּיד אֲמִתֶּֽךָ׃","שְׁמַע־יְהֹוָה וְחׇנֵּנִי יְהֹוָה הֱֽיֵה־עֹזֵר לִֽי׃","הָפַכְתָּ מִסְפְּדִי לְמָחוֹל לִי פִּתַּחְתָּ שַׂקִּי וַֽתְּאַזְּרֵנִי שִׂמְחָֽה׃","לְמַעַן יְזַמֶּרְךָ כָבוֹד וְלֹא יִדֹּם יְהֹוָה אֱלֹהַי לְעוֹלָם אוֹדֶֽךָּ׃ {פ}"],"lat":["mizmor shir-chanukat habayit ledavid","aromimkha Adonai ki dilitani velo-simachta oyvai li","Adonai elohai shiva'ti eleikha vatirpa'eni","Adonai he'elita min-sheol nafshi chiyitani myvrdy miyordi-vor","zamru laihova chasidaiv vehodu lezekher kodsho","ki rega' be'apo chayim birtsono ba'erev yalin bekhi velaboker rina","va'ani amarti veshalvi bal-emot le'olam","Adonai birtsonkha he'emadta lehareri-oz histarta faneikha hayiti nivhal","eleikha Adonai ekra ve'el-adonai etchanan","ma-betsa' bedami beridti el-shachat haiodkha afar hayagid amitekha","shema'-Adonai vechoneni Adonai heye-ozer li","hafakhta mispdi lemachol li pitachta saki vat'azreni simcha","lema'an yezamerkha khavod velo yidom Adonai elohai le'olam odeka f"],"en":["A Psalm; a Song at the Dedication of the House; of David.","I will extol thee, O LORD, for Thou hast raised me up, and hast not suffered mine enemies to rejoice over me.","O LORD my God, I cried unto Thee, and Thou didst heal me;","O LORD, Thou broughtest up my soul from the nether-world; Thou didst kept me alive, that I should not go down to the pit.","Sing praise unto the LORD, O ye His godly ones, and give thanks to His holy name.","For His anger is but for a moment, His favour is for a life-time; weeping may tarry for the night, but joy cometh in the morning.","Now I had said in my security: 'I shall never be moved.'","Thou hadst established, O LORD, in Thy favour my mountain as a stronghold— Thou didst hide Thy face; I was affrighted.","Unto Thee, O LORD, did I call, And unto the LORD I made supplication:","'What profit is there in my blood, when I go down to the pit? Shall the dust praise Thee? shall it declare Thy truth?","Hear, O LORD, and be gracious unto me; LORD, be Thou my helper.'","Thou didst turn for me my mourning into dancing; Thou didst loose my sackcloth, and gird me with gladness;","So that my glory may sing praise to Thee, and not be silent; O LORD my God, I will give thanks unto Thee for ever."]},{"n":31,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃","בְּךָֽ־יְהֹוָה חָסִיתִי אַל־אֵבוֹשָׁה לְעוֹלָם בְּצִדְקָתְךָ פַלְּטֵֽנִי׃","הַטֵּה אֵלַי אׇזְנְךָ מְהֵרָה הַצִּילֵנִי הֱיֵה לִי לְֽצוּר־מָעוֹז לְבֵית מְצוּדוֹת לְהוֹשִׁיעֵֽנִי׃","כִּֽי־סַלְעִי וּמְצוּדָתִי אָתָּה וּלְמַעַן שִׁמְךָ תַּֽנְחֵנִי וּֽתְנַהֲלֵֽנִי׃","תּוֹצִיאֵנִי מֵרֶשֶׁת זוּ טָמְנוּ לִי כִּי־אַתָּה מָעוּזִּֽי׃","בְּיָדְךָ אַפְקִיד רוּחִי פָּדִיתָ אוֹתִי יְהֹוָה אֵל אֱמֶֽת׃","שָׂנֵאתִי הַשֹּׁמְרִים הַבְלֵי־שָׁוְא וַאֲנִי אֶל־יְהֹוָה בָּטָֽחְתִּי׃","אָגִילָה וְאֶשְׂמְחָה בְּחַסְדֶּךָ אֲשֶׁר רָאִיתָ אֶת־עׇנְיִי יָדַעְתָּ בְּצָרוֹת נַפְשִֽׁי׃","וְלֹא הִסְגַּרְתַּנִי בְּיַד־אוֹיֵב הֶעֱמַדְתָּ בַמֶּרְחָב רַגְלָֽי׃","חׇנֵּנִי יְהֹוָה כִּי צַר־לִי עָשְׁשָׁה בְכַעַס עֵינִי נַפְשִׁי וּבִטְנִֽי׃","כִּי כָלוּ בְיָגוֹן חַיַּי וּשְׁנוֹתַי בַּאֲנָחָה כָּשַׁל בַּעֲוֺנִי כֹחִי וַעֲצָמַי עָשֵֽׁשׁוּ׃","מִכׇּל־צֹרְרַי הָיִיתִי חֶרְפָּה וְלִשְׁכֵנַי מְאֹד וּפַחַד לִֽמְיֻדָּעָי רֹאַי בַּחוּץ נָדְדוּ מִמֶּֽנִּי׃","נִשְׁכַּחְתִּי כְּמֵת מִלֵּב הָיִיתִי כִּכְלִי אֹבֵֽד׃","כִּי שָׁמַעְתִּי דִּבַּת רַבִּים מָגוֹר מִסָּבִיב בְּהִוָּסְדָם יַחַד עָלַי לָקַחַת נַפְשִׁי זָמָֽמוּ׃","וַאֲנִי עָלֶיךָ בָטַחְתִּי יְהֹוָה אָמַרְתִּי אֱלֹהַי אָֽתָּה׃","בְּיָדְךָ עִתֹּתָי הַצִּילֵנִי מִיַּד־אוֹיְבַי וּמֵֽרֹדְפָֽי׃","הָאִירָה פָנֶיךָ עַל־עַבְדֶּךָ הוֹשִׁיעֵנִי בְחַסְדֶּֽךָ׃","יְֽהֹוָה אַל־אֵבוֹשָׁה כִּי קְרָאתִיךָ יֵבֹשׁוּ רְשָׁעִים יִדְּמוּ לִשְׁאֽוֹל׃","תֵּאָלַמְנָה שִׂפְתֵי־שָׁקֶר הַדֹּבְרוֹת עַל־צַדִּיק עָתָק בְּגַאֲוָה וָבֽוּז׃","מָה רַֽב־טוּבְךָ אֲשֶׁר־צָפַנְתָּ לִּירֵאֶיךָ פָּעַלְתָּ לַחֹסִים בָּךְ נֶגֶד בְּנֵי אָדָֽם׃","תַּסְתִּירֵם בְּסֵתֶר פָּנֶיךָ מֵרֻכְסֵי־אִישׁ תִּצְפְּנֵם בְּסֻכָּה מֵרִיב לְשֹׁנֽוֹת׃","בָּרוּךְ יְהֹוָה כִּי הִפְלִיא־חַסְדּוֹ לִי בְּעִיר מָצֽוֹר׃","וַאֲנִי אָמַרְתִּי בְחׇפְזִי נִגְרַזְתִּי מִנֶּגֶד עֵינֶיךָ אָכֵן שָׁמַעְתָּ קוֹל תַּחֲנוּנַי בְּשַׁוְּעִי אֵלֶֽיךָ׃","אֶהֱבוּ אֶֽת־יְהֹוָה כׇּֽל־חֲסִידָיו אֱמוּנִים נֹצֵר יְהֹוָה וּמְשַׁלֵּם עַל־יֶתֶר עֹשֵׂה גַאֲוָֽה׃","חִזְקוּ וְיַאֲמֵץ לְבַבְכֶם כׇּל־הַמְיַחֲלִים לַֽיהֹוָֽה׃ {פ}"],"lat":["lamnatseach mizmor ledavid","bekha-Adonai chasiti al-evosha le'olam betsidkatkha falteni","hate elai oznkha mehera hatsileni heye li letsur-ma'oz leveit metsudot lehoshi'eni","ki-sal'i umtsudati ata ulma'an shimkha tancheni utnahaleni","totsi'eni mereshet zu tamnu li ki-ata ma'uzi","beyadkha afkid ruchi padita oti Adonai el emet","saneti hashomrim havlei-shav va'ani el-Adonai batachti","agila ve'esmcha bechasdekha asher ra'ita et-onyi yada'ta betsarot nafshi","velo hisgartani beyad-oyev he'emadta vamerchav raglai","choneni Adonai ki tsar-li ashesha vekha'as eini nafshi uvitni","ki khalu veyagon chayai ushnotai ba'anacha kashal ba'aoni khochi va'atsamai asheshu","mikol-tsorerai hayiti cherpa velishkhenai me'od ufachad limyuda'ai ro'ai bachuts nadedu mimeni","nishkachti kemet milev hayiti kikhli oved","ki shama'ti dibat rabim magor misaviv behivasdam yachad alai lakachat nafshi zamamu","va'ani aleikha vatachti Adonai amarti elohai ata","beyadkha itotai hatsileni miyad-oyvai umerodfai","ha'ira faneikha al-avdekha hoshi'eni vechasdekha","Adonai al-evosha ki keratikha yevoshu resha'im yidmu lishol","te'alamna siftei-shaker hadovrot al-tsadik atak bega'ava vavuz","ma rav-tuvkha asher-tsafanta lire'eikha pa'alta lachosim bakh neged benei adam","tastirem beseter paneikha merukhsei-ish titspnem besuka meriv leshonot","barukh Adonai ki hifli-chasdo li be'ir matsor","va'ani amarti vechofzi nigrazti mineged eineikha akhen shama'ta kol tachanunai beshav'i eleikha","ehevu et-Adonai kol-chasidaiv emunim notser Adonai umshalem al-yeter ose ga'ava","chizku veya'amets levavkhem kol-hamyachalim laihova f"],"en":["For the Leader. A Psalm of David.","In thee, O LORD, have I taken refuge; let me never be ashamed; Deliver me in Thy righteousness.","Incline Thine ear unto me, deliver me speedily; Be Thou to me a rock of refuge, even a fortress of defence, to save me.","For Thou art my rock and my fortress; Therefore for Thy name's sake lead me and guide me.","Bring me forth out of the net that they have hidden for me; For Thou art my stronghold.","Into Thy hand I commit my spirit; Thou hast redeemed me, O LORD, Thou God of truth.","I hate them that regard lying vanities; But I trust in the LORD.","I will be glad and rejoice in Thy lovingkindness; For Thou hast seen mine affliction, Thou hast taken cognizance of the troubles of my soul,","And Thou hast not given me over into the hand of the enemy; Thou hast set my feet in a broad place.","Be gracious unto me, O LORD, for I am in distress; Mine eye wasteth away with vexation, yea, my soul and my body.","For my life is spent in sorrow, and my years in sighing; My strength faileth because of mine iniquity, and my bones are wasted away.","Because of all mine adversaries I am become a reproach, Yea, unto my neighbours exceedingly, and a dread to mine acquaintance; They that see me without flee from me.","I am forgotten as a dead man out of mind; I am like a useless vessel.","For I have heard the whispering of many, Terror on every side; While they took counsel together against me, They devised to take away my life.","But as for me, I have trusted in Thee, O LORD; I have said: 'Thou art my God.'","My times are in Thy hand; Deliver me from the hand of mine enemies, and from them that persecute me.","Make Thy face to shine upon Thy servant; Save me in Thy lovingkindness.","O LORD, let me not be ashamed, for I have called upon Thee; Let the wicked be ashamed, let them be put to silence in the nether-world.","Let the lying lips be dumb, Which speak arrogantly against the righteous, With pride and contempt.","Oh how abundant is Thy goodness, which Thou hast laid up for them that fear Thee; Which Thou hast wrought for them that take their refuge in Thee, in the sight of the sons of men!","Thou hidest them in the covert of Thy presence from the plottings of man; Thou concealest them in a pavilion from the strife of tongues.","Blessed be the LORD; For He hath shown me His wondrous lovingkindness in an entrenched city.","As for me, I said in my haste: 'I am cut off from before Thine eyes'; Nevertheless Thou heardest the voice of my supplications when I cried unto Thee.","O love the LORD, all ye His godly ones; The LORD preserveth the faithful, And plentifully repayeth him that acteth haughtily.","Be strong, and let your heart take courage, All ye that wait for the LORD."]},{"n":32,"he":["לְדָוִד מַשְׂכִּיל אַשְׁרֵי נְֽשׂוּי־פֶּשַׁע כְּסוּי חֲטָאָֽה׃","אַשְֽׁרֵי־אָדָם לֹא יַחְשֹׁב יְהֹוָה לוֹ עָוֺן וְאֵין בְּרוּחוֹ רְמִיָּֽה׃","כִּֽי־הֶחֱרַשְׁתִּי בָּלוּ עֲצָמָי בְּשַׁאֲגָתִי כׇּל־הַיּֽוֹם׃","כִּי יוֹמָם וָלַיְלָה תִּכְבַּד עָלַי יָדֶךָ נֶהְפַּךְ לְשַׁדִּי בְּחַרְבֹנֵי קַיִץ סֶֽלָה׃","חַטָּאתִי אוֹדִיעֲךָ וַעֲוֺנִי לֹֽא־כִסִּיתִי אָמַרְתִּי אוֹדֶה עֲלֵי פְשָׁעַי לַיהֹוָה וְאַתָּה נָשָׂאתָ עֲוֺן חַטָּאתִי סֶֽלָה׃","עַל־זֹאת יִתְפַּלֵּל כׇּל־חָסִיד אֵלֶיךָ לְעֵת מְצֹא רַק לְשֵׁטֶף מַיִם רַבִּים אֵלָיו לֹא יַגִּֽיעוּ׃","אַתָּה סֵתֶר לִי מִצַּר תִּצְּרֵנִי רׇנֵּי פַלֵּט תְּסוֹבְבֵנִי סֶֽלָה׃","אַשְׂכִּֽילְךָ וְֽאוֹרְךָ בְּדֶֽרֶךְ־זוּ תֵלֵךְ אִיעֲצָה עָלֶיךָ עֵינִֽי׃","אַל־תִּהְיוּ כְּסוּס כְּפֶרֶד אֵין הָבִין בְּמֶתֶג־וָרֶסֶן עֶדְיוֹ לִבְלוֹם בַּל קְרֹב אֵלֶֽיךָ׃","רַבִּים מַכְאוֹבִים לָרָשָׁע וְהַבּוֹטֵחַ בַּֽיהֹוָה חֶסֶד יְסוֹבְבֶֽנּוּ׃","שִׂמְחוּ בַיהֹוָה וְגִילוּ צַדִּיקִים וְהַרְנִינוּ כׇּל־יִשְׁרֵי־לֵֽב׃ {פ}"],"lat":["ledavid maskil ashrei nesuy-pesha' kesuy chata'a","ashrei-adam lo yachshov Adonai lo aon ve'ein berucho remiya","ki-hecherashti balu atsamai besha'agati kol-hayom","ki yomam valayla tikhbad alai yadekha nehpakh leshadi becharvonei kayits sela","chatati odi'akha va'aoni lo-khisiti amarti ode alei fesha'ai laihova ve'ata nasata aon chatati sela","al-zot yitpalel kol-chasid eleikha le'et metso rak leshetef mayim rabim elaiv lo yagi'u","ata seter li mitsar titsreni ronei falet tesoveveni sela","askilkha veorkha bederekh-zu telekh i'atsa aleikha eini","al-tihyu kesus kefered ein havin bemeteg-varesen edyo livlom bal kerov eleikha","rabim makhovim larasha' vehaboteach baihova chesed yesovevenu","simchu vaihova vegilu tsadikim veharninu kol-yishrei-lev f"],"en":["[A Psalm] of David. Maschil. Happy is he whose transgression is forgiven, whose sin is pardoned.","Happy is the man unto whom the LORD counteth not iniquity, And in whose spirit there is no guile.","When I kept silence, my bones wore away Through my groaning all the day long.","For day and night Thy hand was heavy upon me; My sap was turned as in the droughts of summer. Selah","I acknowledged my sin unto Thee, and mine iniquity have I not hid; I said: 'I will make confession concerning my transgressions unto the LORD' — And Thou, Thou forgavest the iniquity of my sin. Selah","For this let every one that is godly pray unto Thee in a time when Thou mayest be found; Surely, when the great waters overflow, they will not reach unto him.","Thou art my hiding-place; Thou wilt preserve me from the adversary; With songs of deliverance Thou wilt compass me about. Selah","'I will instruct thee and teach thee in the way which thou shalt go; I will give counsel, Mine eye being upon thee.'","Be ye not as the horse, or as the mule, which have no understanding; Whose mouth must be held in with bit and bridle, That they come not near unto thee.","Many are the sorrows of the wicked; But he that trusteth in the LORD, mercy compasseth him about.","Be glad in the LORD, and rejoice, ye righteous; And shout for joy, all ye that are upright in heart."]},{"n":33,"he":["רַנְּנוּ צַדִּיקִים בַּֽיהֹוָה לַיְשָׁרִים נָאוָה תְהִלָּֽה׃","הוֹדוּ לַיהֹוָה בְּכִנּוֹר בְּנֵבֶל עָשׂוֹר זַמְּרוּ־לֽוֹ׃","שִֽׁירוּ־לוֹ שִׁיר חָדָשׁ הֵיטִיבוּ נַגֵּן בִּתְרוּעָֽה׃","כִּֽי־יָשָׁר דְּבַר־יְהֹוָה וְכׇל־מַעֲשֵׂהוּ בֶּאֱמוּנָֽה׃","אֹהֵב צְדָקָה וּמִשְׁפָּט חֶסֶד יְהֹוָה מָלְאָה הָאָֽרֶץ׃","בִּדְבַר יְהֹוָה שָׁמַיִם נַעֲשׂוּ וּבְרוּחַ פִּיו כׇּל־צְבָאָֽם׃","כֹּנֵס כַּנֵּד מֵי הַיָּם נֹתֵן בְּאוֹצָרוֹת תְּהוֹמֽוֹת׃","יִֽירְאוּ מֵיְהֹוָה כׇּל־הָאָרֶץ מִמֶּנּוּ יָגוּרוּ כׇּל־יֹשְׁבֵי תֵבֵֽל׃","כִּי הוּא אָמַר וַיֶּהִי הֽוּא־צִוָּה וַֽיַּעֲמֹֽד׃","יְֽהֹוָה הֵפִיר עֲצַת־גּוֹיִם הֵנִיא מַחְשְׁבוֹת עַמִּֽים׃","עֲצַת יְהֹוָה לְעוֹלָם תַּעֲמֹד מַחְשְׁבוֹת לִבּוֹ לְדֹר וָדֹֽר׃","אַשְׁרֵי הַגּוֹי אֲשֶׁר־יְהֹוָה אֱלֹהָיו הָעָם בָּחַר לְנַחֲלָה לֽוֹ׃","מִשָּׁמַיִם הִבִּיט יְהֹוָה רָאָה אֶֽת־כׇּל־בְּנֵי הָאָדָֽם׃","מִֽמְּכוֹן־שִׁבְתּוֹ הִשְׁגִּיחַ אֶל כׇּל־יֹשְׁבֵי הָאָֽרֶץ׃","הַיֹּצֵר יַחַד לִבָּם הַמֵּבִין אֶל־כׇּל־מַעֲשֵׂיהֶֽם׃","אֵֽין־הַמֶּלֶךְ נוֹשָׁע בְּרׇב־חָיִל גִּבּוֹר לֹא־יִנָּצֵל בְּרׇב־כֹּֽחַ׃","שֶׁקֶר הַסּוּס לִתְשׁוּעָה וּבְרֹב חֵילוֹ לֹא יְמַלֵּֽט׃","הִנֵּה עֵין יְהֹוָה אֶל־יְרֵאָיו לַֽמְיַחֲלִים לְחַסְדּֽוֹ׃","לְהַצִּיל מִמָּוֶת נַפְשָׁם וּלְחַיּוֹתָם בָּרָעָֽב׃","נַפְשֵׁנוּ חִכְּתָה לַֽיהֹוָה עֶזְרֵנוּ וּמָגִנֵּנוּ הֽוּא׃","כִּי־בוֹ יִשְׂמַח לִבֵּנוּ כִּי בְשֵׁם קׇדְשׁוֹ בָטָֽחְנוּ׃","יְהִי־חַסְדְּךָ יְהֹוָה עָלֵינוּ כַּאֲשֶׁר יִחַלְנוּ לָֽךְ׃ {פ}"],"lat":["ranenu tsadikim baihova laysharim nava tehila","hodu laihova bekhinor benevel asor zamru-lo","shiru-lo shir chadash heitivu nagen bitru'a","ki-yashar devar-Adonai vekhol-ma'asehu be'emuna","ohev tsedaka umishpat chesed Adonai mal'a ha'arets","bidvar Adonai shamayim na'asu uvruach piv kol-tseva'am","kones kaned mei hayam noten beotsarot tehomot","yiru meyhova kol-ha'arets mimenu yaguru kol-yoshvei tevel","ki hu amar vayehi hu-tsiva vaya'amod","Adonai hefir atsat-goyim heni machshvot amim","atsat Adonai le'olam ta'amod machshvot libo ledor vador","ashrei hagoy asher-Adonai elohaiv ha'am bachar lenachala lo","mishamayim hibit Adonai ra'a et-kol-benei ha'adam","mimkhon-shivto hishgiach el kol-yoshvei ha'arets","hayotser yachad libam hamevin el-kol-ma'aseihem","ein-hamelekh nosha' berov-chayil gibor lo-yinatsel berov-koach","sheker hasus litshu'a uvrov cheilo lo yemalet","hine ein Adonai el-yere'aiv lamyachalim lechasdo","lehatsil mimavet nafsham ulchayotam bara'av","nafshenu chikta laihova ezrenu umaginenu hu","ki-vo yismach libenu ki veshem kodsho vatachnu","yehi-chasdkha Adonai aleinu ka'asher yichalnu lakh f"],"en":["Rejoice in the LORD, O ye righteous, Praise is comely for the upright.","Give thanks unto the LORD with harp, Sing praises unto Him with the psaltery of ten strings.","Sing unto Him a new song; Play skilfully amid shouts of joy.","For the word of the LORD is upright; And all His work is done in faithfulness.","He loveth righteousness and justice; The earth is full of the lovingkindness of the LORD.","By the word of the LORD were the heavens made; And all the host of them by the breath of His mouth.","He gathereth the waters of the sea together as a heap; He layeth up the deeps in storehouses.","Let all the earth fear the LORD; Let all the inhabitants of the world stand in awe of Him.","For He spoke, and it was; He commanded, and it stood.","The LORD bringeth the counsel of the nations to nought; He maketh the thoughts of the peoples to be of no effect.","The counsel of the LORD standeth for ever, The thoughts of His heart to all generations.","Happy is the nation whose God is the LORD; The people whom He hath chosen for His own inheritance.","The LORD looketh from heaven; He beholdeth all the sons of men;","From the place of His habitation He looketh intently Upon all the inhabitants of the earth;","He that fashioneth the hearts of them all, That considereth all their doings.","A king is not saved by the multitude of a host; A mighty man is not delivered by great strength.","A horse is a vain thing for safety; Neither doth it afford escape by its great strength.","Behold, the eye of the LORD is toward them that fear Him, Toward them that wait for His mercy;","To deliver their soul from death, And to keep them alive in famine.","Our soul hath waited for the LORD; He is our help and our shield.","For in Him doth our heart rejoice, Because we have trusted in His holy name.","Let Thy mercy, O LORD, be upon us, According as we have waited for Thee."]},{"n":34,"he":["לְדָוִד בְּשַׁנּוֹתוֹ אֶת־טַעְמוֹ לִפְנֵי אֲבִימֶלֶךְ וַיְגָרְשֵׁהוּ וַיֵּלַֽךְ׃","אֲבָרְכָה אֶת־יְהֹוָה בְּכׇל־עֵת תָּמִיד תְּֽהִלָּתוֹ בְּפִֽי׃","בַּיהֹוָה תִּתְהַלֵּל נַפְשִׁי יִשְׁמְעוּ עֲנָוִים וְיִשְׂמָֽחוּ׃","גַּדְּלוּ לַיהֹוָה אִתִּי וּנְרוֹמְמָה שְׁמוֹ יַחְדָּֽו׃","דָּרַשְׁתִּי אֶת־יְהֹוָה וְעָנָנִי וּמִכׇּל־מְגוּרוֹתַי הִצִּילָֽנִי׃","הִבִּיטוּ אֵלָיו וְנָהָרוּ וּפְנֵיהֶם אַל־יֶחְפָּֽרוּ׃","זֶה עָנִי קָרָא וַיהֹוָה שָׁמֵעַ וּמִכׇּל־צָרוֹתָיו הוֹשִׁיעֽוֹ׃","חֹנֶה מַלְאַךְ־יְהֹוָה סָבִיב לִירֵאָיו וַֽיְחַלְּצֵֽם׃","טַעֲמוּ וּרְאוּ כִּֽי־טוֹב יְהֹוָה אַֽשְׁרֵי הַגֶּבֶר יֶחֱסֶה־בּֽוֹ׃","יְראוּ אֶת־יְהֹוָה קְדֹשָׁיו כִּי־אֵין מַחְסוֹר לִירֵאָֽיו׃","כְּפִירִים רָשׁוּ וְרָעֵבוּ וְדֹרְשֵׁי יְהֹוָה לֹא־יַחְסְרוּ כׇל־טֽוֹב׃","לְֽכוּ־בָנִים שִׁמְעוּ־לִי יִֽרְאַת יְהֹוָה אֲלַמֶּדְכֶֽם׃","מִֽי־הָאִישׁ הֶחָפֵץ חַיִּים אֹהֵב יָמִים לִרְאוֹת טֽוֹב׃","נְצֹר לְשׁוֹנְךָ מֵרָע וּשְׂפָתֶיךָ מִדַּבֵּר מִרְמָֽה׃","סוּר מֵרָע וַעֲשֵׂה־טוֹב בַּקֵּשׁ שָׁלוֹם וְרׇדְפֵֽהוּ׃","עֵינֵי יְהֹוָה אֶל־צַדִּיקִים וְאׇזְנָיו אֶל־שַׁוְעָתָֽם׃","פְּנֵי יְהֹוָה בְּעֹשֵׂי רָע לְהַכְרִית מֵאֶרֶץ זִכְרָֽם׃","צָעֲקוּ וַיהֹוָה שָׁמֵעַ וּמִכׇּל־צָרוֹתָם הִצִּילָֽם׃","קָרוֹב יְהֹוָה לְנִשְׁבְּרֵי־לֵב וְֽאֶת־דַּכְּאֵי־רוּחַ יוֹשִֽׁיעַ׃","רַבּוֹת רָעוֹת צַדִּיק וּמִכֻּלָּם יַצִּילֶנּוּ יְהֹוָֽה׃","שֹׁמֵר כׇּל־עַצְמוֹתָיו אַחַת מֵהֵנָּה לֹא נִשְׁבָּֽרָה׃","תְּמוֹתֵת רָשָׁע רָעָה וְשֹׂנְאֵי צַדִּיק יֶאְשָֽׁמוּ׃","פֹּדֶה יְהֹוָה נֶפֶשׁ עֲבָדָיו וְלֹא יֶאְשְׁמוּ כׇּֽל־הַחֹסִים בּֽוֹ׃ {פ}"],"lat":["ledavid beshanoto et-ta'mo lifnei avimelekh vaygarshehu vayelakh","avarkha et-Adonai bekhol-et tamid tehilato befi","baihova tithalel nafshi yishm'u anavim veyismachu","gadlu laihova iti unromema shemo yachdav","darashti et-Adonai ve'anani umikol-megurotai hitsilani","hibitu elaiv venaharu ufneihem al-yechparu","ze ani kara vaihova shamea' umikol-tsarotaiv hoshi'o","chone mal'akh-Adonai saviv lire'aiv vaychaltsem","ta'amu uru ki-tov Adonai ashrei hagever yechese-bo","yeru et-Adonai kedoshaiv ki-ein machsor lire'aiv","kefirim rashu vera'evu vedorshei Adonai lo-yachsru khol-tov","lekhu-vanim shim'u-li yir'at Adonai alamedkhem","mi-ha'ish hechafets chayim ohev yamim lirot tov","netsor leshonkha mera' usfateikha midaber mirma","sur mera' va'ase-tov bakesh shalom verodfehu","einei Adonai el-tsadikim ve'oznaiv el-shav'atam","penei Adonai be'osei ra' lehakhrit me'erets zikhram","tsa'aku vaihova shamea' umikol-tsarotam hitsilam","karov Adonai lenishbrei-lev ve'et-dak'ei-ruach yoshia'","rabot ra'ot tsadik umikulam yatsilenu Adonai","shomer kol-atsmotaiv achat mehena lo nishbara","temotet rasha' ra'a veson'ei tsadik ye'shamu","pode Adonai nefesh avadaiv velo ye'shmu kol-hachosim bo f"],"en":["[A Psalm] of David; when he changed his demeanour before Abimelech, who drove him away, and he departed.","I will bless the LORD at all times; His praise shall continually be in my mouth.","My soul shall glory in the LORD; The humble shall hear thereof, and be glad.","O magnify the LORD with me, And let us exalt His name together.","I sought the LORD, and He answered me, And delivered me from all my fears.","They looked unto Him, and were radiant; And their faces shall never be abashed.","This poor man cried, and the LORD heard, And saved him out of all his troubles.","The angel of the LORD encampeth round about them that fear Him, And delivereth them.","O consider and see that the LORD is good; Happy is the man that taketh refuge in Him.","O fear the LORD, ye His holy ones; For there is no want to them that fear Him.","The young lions do lack, and suffer hunger; But they that seek the LORD want not any good thing.","Come, ye children, hearken unto me; I will teach you the fear of the LORD.","Who is the man that desireth life, and loveth days, That he may see good therein?","Keep thy tongue from evil, And thy lips from speaking guile.","Depart from evil, and do good; Seek peace, and pursue it.","The eyes of the LORD are toward the righteous, And His ears are open unto their cry.","The face of the LORD is against them that do evil, To cut off the remembrance of them from the earth.","They cried, and the LORD heard, And delivered them out of all their troubles.","The LORD is nigh unto them that are of a broken heart, And saveth such as are of a contrite spirit.","Many are the ills of the righteous, But the LORD delivereth him out of them all.","He keepeth all his bones; Not one of them is broken.","Evil shall kill the wicked; And they that hate the righteous shall be held guilty.","The LORD redeemeth the soul of His servants; And none of them that take refuge in Him shall be desolate."]},{"n":35,"he":["לְדָוִד רִיבָה יְהֹוָה אֶת־יְרִיבַי לְחַם אֶת־לֹחֲמָֽי׃","הַחֲזֵק מָגֵן וְצִנָּה וְקוּמָה בְּעֶזְרָתִֽי׃","וְהָרֵק חֲנִית וּסְגֹר לִקְרַאת רֹדְפָי אֱמֹר לְנַפְשִׁי יְֽשֻׁעָתֵךְ אָֽנִי׃","יֵבֹשׁוּ וְיִכָּלְמוּ מְבַקְשֵׁי נַפְשִׁי יִסֹּגוּ אָחוֹר וְיַחְפְּרוּ חֹשְׁבֵי רָעָתִֽי׃","יִֽהְיוּ כְּמֹץ לִפְנֵי־רוּחַ וּמַלְאַךְ יְהֹוָה דּוֹחֶֽה׃","יְֽהִי־דַרְכָּם חֹשֶׁךְ וַחֲלַקְלַקֹּת וּמַלְאַךְ יְהֹוָה רֹדְפָֽם׃","כִּֽי־חִנָּם טָֽמְנוּ־לִי שַׁחַת רִשְׁתָּם חִנָּם חָפְרוּ לְנַפְשִֽׁי׃","תְּבוֹאֵהוּ שׁוֹאָה לֹֽא־יֵדָע וְרִשְׁתּוֹ אֲשֶׁר־טָמַן תִּלְכְּדוֹ בְּשׁוֹאָה יִפׇּל־בָּֽהּ׃","וְנַפְשִׁי תָּגִיל בַּיהֹוָה תָּשִׂישׂ בִּישׁוּעָתֽוֹ׃","כׇּל־עַצְמוֹתַי תֹּאמַרְנָה יְהֹוָה מִי־כָמוֹךָ מַצִּיל עָנִי מֵחָזָק מִמֶּנּוּ וְעָנִי וְאֶבְיוֹן מִגֹּֽזְלֽוֹ׃","יְקוּמוּן עֵדֵי חָמָס אֲשֶׁר לֹֽא־יָדַעְתִּי יִשְׁאָלֽוּנִי׃","יְשַׁלְּמוּנִי רָעָה תַּחַת טוֹבָה שְׁכוֹל לְנַפְשִֽׁי׃","וַאֲנִי בַּחֲלוֹתָם לְבוּשִׁי שָׂק עִנֵּיתִי בַצּוֹם נַפְשִׁי וּתְפִלָּתִי עַל־חֵיקִי תָשֽׁוּב׃","כְּרֵעַ־כְּאָח לִי הִתְהַלָּכְתִּי כַּאֲבֶל־אֵם קֹדֵר שַׁחֽוֹתִי׃","וּבְצַלְעִי שָׂמְחוּ וְֽנֶאֱסָפוּ נֶאֶסְפוּ עָלַי נֵכִים וְלֹא יָדַעְתִּי קָרְעוּ וְלֹא־דָֽמּוּ׃","בְּחַנְפֵי לַעֲגֵי מָעוֹג חָרֹק עָלַי שִׁנֵּֽימוֹ׃","אֲדֹנָי כַּמָּה תִרְאֶה הָשִׁיבָה נַפְשִׁי מִשֹּׁאֵיהֶם מִכְּפִירִים יְחִידָתִֽי׃","אוֹדְךָ בְּקָהָל רָב בְּעַם עָצוּם אֲהַלְלֶֽךָּ׃","אַֽל־יִשְׂמְחוּ־לִי אֹיְבַי שֶׁקֶר שֹׂנְאַי חִנָּם יִקְרְצוּ־עָֽיִן׃","כִּי לֹא שָׁלוֹם יְדַבֵּרוּ וְעַל רִגְעֵי־אֶרֶץ דִּבְרֵי מִרְמוֹת יַחֲשֹׁבֽוּן׃","וַיַּרְחִיבוּ עָלַי פִּיהֶם אָמְרוּ הֶאָח הֶאָח רָאֲתָה עֵינֵֽנוּ׃","רָאִיתָה יְהֹוָה אַֽל־תֶּחֱרַשׁ אֲדֹנָי אַל־תִּרְחַק מִמֶּֽנִּי׃","הָעִירָה וְהָקִיצָה לְמִשְׁפָּטִי אֱלֹהַי וַאדֹנָי לְרִיבִֽי׃","שׇׁפְטֵנִי כְצִדְקְךָ יְהֹוָה אֱלֹהָי וְאַל־יִשְׂמְחוּ־לִֽי׃","אַל־יֹאמְרוּ בְלִבָּם הֶאָח נַפְשֵׁנוּ אַל־יֹאמְרוּ בִּֽלַּעֲנֽוּהוּ׃","יֵבֹשׁוּ וְיַחְפְּרוּ יַחְדָּו שְׂמֵחֵי רָעָתִי יִֽלְבְּשׁוּ־בֹשֶׁת וּכְלִמָּה הַֽמַּגְדִּילִים עָלָֽי׃","יָרֹנּוּ וְיִשְׂמְחוּ חֲפֵצֵי צִדְקִי וְיֹאמְרוּ תָמִיד יִגְדַּל יְהֹוָה הֶחָפֵץ שְׁלוֹם עַבְדּֽוֹ׃","וּלְשׁוֹנִי תֶּהְגֶּה צִדְקֶךָ כׇּל־הַיּוֹם תְּהִלָּתֶֽךָ׃ {פ}"],"lat":["ledavid riva Adonai et-yerivai lecham et-lochamai","hachazek magen vetsina vekuma be'ezrati","veharek chanit usgor likrat rodfai emor lenafshi yeshu'atekh ani","yevoshu veyikalmu mevakshei nafshi yisogu achor veyachpru choshvei ra'ati","yihyu kemots lifnei-ruach umal'akh Adonai doche","yehi-darkam choshekh vachalaklakot umal'akh Adonai rodfam","ki-chinam tamnu-li shachat rishtam chinam chafru lenafshi","tevo'ehu sho'a lo-yeda' verishto asher-taman tilkdo besho'a yipol-bah","venafshi tagil baihova tasis bishu'ato","kol-atsmotai tomarna Adonai mi-khamokha matsil ani mechazak mimenu ve'ani ve'evyon migozlo","yekumun edei chamas asher lo-yada'ti yish'aluni","yeshalmuni ra'a tachat tova shekhol lenafshi","va'ani bachalotam levushi sak ineiti vatsom nafshi utfilati al-cheiki tashuv","kerea'-ke'ach li hithalakhti ka'avel-em koder shachoti","uvtsal'i samchu vene'esafu ne'esfu alai nekhim velo yada'ti kar'u velo-damu","bechanfei la'agei ma'og charok alai shineimo","adonai kama tir'e hashiva nafshi misho'eihem mikfirim yechidati","odkha bekahal rav be'am atsum ahaleleka","al-yismchu-li oyvai sheker son'ai chinam yikrtsu-ayin","ki lo shalom yedaberu ve'al rig'ei-erets divrei mirmot yachashovun","vayarchivu alai pihem amru he'ach he'ach ra'ata einenu","ra'ita Adonai al-techerash adonai al-tirchak mimeni","ha'ira vehakitsa lemishpati elohai vadonai lerivi","shofteni khetsidkkha Adonai elohai ve'al-yismchu-li","al-yomru velibam he'ach nafshenu al-yomru bila'anuhu","yevoshu veyachpru yachdav semechei ra'ati yilbshu-voshet ukhlima hamagdilim alai","yaronu veyismchu chafetsei tsidki veyomru tamid yigdal Adonai hechafets shelom avdo","ulshoni tehge tsidkekha kol-hayom tehilatekha f"],"en":["[A Psalm] of David. Strive, O LORD, with them that strive with me; Fight against them that fight against me.","Take hold of shield and buckler, And rise up to my help.","Draw out also the spear, and the battle-axe, against them that pursue me; Say unto my soul: 'I am Thy salvation.'","Let them be ashamed and brought to confusion that seek after my soul; Let them be turned back and be abashed that devise my hurt.","Let them be as chaff before the wind, The angel of the LORD thrusting them.","Let their way be dark and slippery, The angel of the LORD pursuing them.","For without cause have they hid for me the pit, even their net, Without cause have they digged for my soul. .","Let destruction come upon him unawares; And let his net that he hath hid catch himself; With destruction let him fall therein.","And my soul shall be joyful in the LORD; It shall rejoice in His salvation.","All my bones shall say: 'LORD, who is like unto Thee, Who deliverest the poor from him that is too strong for him, Yea, the poor and the needy from him that spoileth him?'","Unrighteous witnesses rise up; They ask me of things that I know not.","They repay me evil for good; Bereavement is come to my soul.","But as for me, when they were sick, my clothing was sackcloth, I afflicted my soul with fasting; And my prayer, may it return into mine own bosom.","I went about as though it had been my friend or my brother; I bowed down mournful, as one that mourneth for his mother.","But when I halt they rejoice, and gather themselves together; The abjects gather themselves together against me, and those whom I know not; They tear me, and cease not;","With the profanest mockeries of backbiting They gnash at me with their teeth.","Lord, how long wilt Thou look on? Rescue my soul from their destructions, Mine only one from the lions.","I will give Thee thanks in the great congregation; I will praise Thee among a numerous people.","Let not them that are wrongfully mine enemies rejoice over me; Neither let them wink with the eye that hate me without a cause.","For they speak not peace; But they devise deceitful matters against them that are quiet in the land.","Yea, they open their mouth wide against me; They say: 'Aha, aha, our eye hath seen it.'","Thou hast seen, O LORD; keep not silence; O Lord, be not far from me.","Rouse Thee, and awake to my judgment, Even unto my cause, my God and my Lord.","Judge me, O LORD my God, according to Thy righteousness; And let them not rejoice over me.","Let them not say in their heart: 'Aha, we have our desire'; Let them not say: 'We have swallowed him up.'","Let them be ashamed and abashed together that rejoice at my hurt; Let them be clothed with shame and confusion that magnify themselves against me. .","Let them shout for joy, and be glad, that delight in my righteousness; Yea, let them say continually: 'Magnified be the LORD, Who delighteth in the peace of His servant.'","And my tongue shall speak of Thy righteousness, And of Thy praise all the day."]},{"n":36,"he":["לַמְנַצֵּחַ לְעֶבֶד־יְהֹוָה לְדָוִֽד׃","נְאֻֽם־פֶּשַׁע לָרָשָׁע בְּקֶרֶב לִבִּי אֵֽין־פַּחַד אֱלֹהִים לְנֶגֶד עֵינָֽיו׃","כִּֽי־הֶחֱלִיק אֵלָיו בְּעֵינָיו לִמְצֹא עֲוֺנוֹ לִשְׂנֹֽא׃","דִּבְרֵי־פִיו אָוֶן וּמִרְמָה חָדַל לְהַשְׂכִּיל לְהֵיטִֽיב׃","אָוֶן יַחְשֹׁב עַֽל־מִשְׁכָּבוֹ יִתְיַצֵּב עַל־דֶּרֶךְ לֹא־טוֹב רָע לֹא יִמְאָֽס׃","יְהֹוָה בְּהַשָּׁמַיִם חַסְדֶּךָ אֱמוּנָתְךָ עַד־שְׁחָקִֽים׃","צִדְקָתְךָ כְּֽהַרְרֵי־אֵל מִשְׁפָּטֶיךָ תְּהוֹם רַבָּה אָדָֽם־וּבְהֵמָה תוֹשִׁיעַ יְהֹוָֽה׃","מַה־יָּקָר חַסְדְּךָ אֱלֹהִים וּבְנֵי אָדָם בְּצֵל כְּנָפֶיךָ יֶחֱסָיֽוּן׃","יִרְוְיֻן מִדֶּשֶׁן בֵּיתֶךָ וְנַחַל עֲדָנֶיךָ תַשְׁקֵֽם׃","כִּֽי־עִמְּךָ מְקוֹר חַיִּים בְּאוֹרְךָ נִרְאֶה־אֽוֹר׃","מְשֹׁךְ חַסְדְּךָ לְיֹדְעֶיךָ וְצִדְקָתְךָ לְיִשְׁרֵי־לֵֽב׃","אַל־תְּבוֹאֵנִי רֶגֶל גַּאֲוָה וְיַד־רְשָׁעִים אַל־תְּנִדֵֽנִי׃","שָׁם נָפְלוּ פֹּעֲלֵי אָוֶן דֹּחוּ וְלֹא־יָכְלוּ קֽוּם׃ {פ}"],"lat":["lamnatseach le'eved-Adonai ledavid","ne'um-pesha' larasha' bekerev libi ein-pachad elohim leneged einaiv","ki-hechelik elaiv be'einaiv limtso aono lisno","divrei-fiv aven umirma chadal lehaskil leheitiv","aven yachshov al-mishkavo yityatsev al-derekh lo-tov ra' lo yim'as","Adonai behashamayim chasdekha emunatkha ad-shechakim","tsidkatkha keharerei-el mishpateikha tehom raba adam-uvhema toshia' Adonai","ma-yakar chasdkha elohim uvnei adam betsel kenafeikha yechesaiun","yirvyun mideshen beitekha venachal adaneikha tashkem","ki-imkha mekor chayim beorkha nir'e-or","meshokh chasdkha leyod'eikha vetsidkatkha leyishrei-lev","al-tevo'eni regel ga'ava veyad-resha'im al-tenideni","sham naflu po'alei aven dochu velo-yakhlu kum f"],"en":["For the Leader. [A Psalm] of David the servant of the LORD.","Transgression speaketh to the wicked, methinks— There is no fear of God before his eyes.","For it flattereth him in his eyes, Until his iniquity be found, and he be hated.","The words of his mouth are iniquity and deceit; He hath left off to be wise, to do good.","He deviseth iniquity upon his bed; He setteth himself in a way that is not good; He abhorreth not evil.","Thy lovingkindness, O LORD, is in the heavens; Thy faithfulness reacheth unto the skies.","Thy righteousness is like the mighty mountains; Thy judgments are like the great deep; Man and beast Thou preservest, O LORD.","How precious is Thy lovingkindness, O God! And the children of men take refuge in the shadow of Thy wings.","They are abundantly satisfied with the fatness of Thy house; And Thou makest them drink of the river of Thy pleasures.","For with Thee is the fountain of life; In Thy light do we see light.","O continue Thy lovingkindness unto them that know Thee; And Thy righteousness to the upright in heart.","Let not the foot of pride overtake me, And let not the hand of the wicked drive me away.","There are the workers of iniquity fallen; They are thrust down, and are not able to rise."]},{"n":37,"he":["לְדָוִד אַל־תִּתְחַר בַּמְּרֵעִים אַל־תְּקַנֵּא בְּעֹשֵׂי עַוְלָֽה׃","כִּי כֶחָצִיר מְהֵרָה יִמָּלוּ וּכְיֶרֶק דֶּשֶׁא יִבּוֹלֽוּן׃","בְּטַח בַּיהֹוָה וַעֲשֵׂה־טוֹב שְׁכׇן־אֶרֶץ וּרְעֵה אֱמוּנָֽה׃","וְהִתְעַנַּג עַל־יְהֹוָה וְיִֽתֶּן־לְךָ מִשְׁאֲלֹת לִבֶּֽךָ׃","גּוֹל עַל־יְהֹוָה דַּרְכֶּךָ וּבְטַח עָלָיו וְהוּא יַעֲשֶֽׂה׃","וְהוֹצִיא כָאוֹר צִדְקֶךָ וּמִשְׁפָּטֶךָ כַּֽצׇּהֳרָֽיִם׃","דּוֹם לַיהֹוָה וְהִתְחוֹלֵֽל לוֹ אַל־תִּתְחַר בְּמַצְלִיחַ דַּרְכּוֹ בְּאִישׁ עֹשֶׂה מְזִמּֽוֹת׃","הֶרֶף מֵאַף וַעֲזֹב חֵמָה אַל־תִּתְחַר אַךְ־לְהָרֵֽעַ׃","כִּֽי־מְרֵעִים יִכָּרֵתוּן וְקֹוֵי יְהֹוָה הֵמָּה יִֽירְשׁוּ־אָֽרֶץ׃","וְעוֹד מְעַט וְאֵין רָשָׁע וְהִתְבּוֹנַנְתָּ עַל־מְקוֹמוֹ וְאֵינֶֽנּוּ׃","וַעֲנָוִים יִֽירְשׁוּ־אָרֶץ וְהִֽתְעַנְּגוּ עַל־רֹב שָׁלֽוֹם׃","זֹמֵם רָשָׁע לַצַּדִּיק וְחֹרֵק עָלָיו שִׁנָּֽיו׃","אֲדֹנָי יִשְׂחַק־לוֹ כִּי־רָאָה כִּֽי־יָבֹא יוֹמֽוֹ׃","חֶרֶב פָּתְחוּ רְשָׁעִים וְדָרְכוּ קַשְׁתָּם לְהַפִּיל עָנִי וְאֶבְיוֹן לִטְבוֹחַ יִשְׁרֵי־דָֽרֶךְ׃","חַרְבָּם תָּבוֹא בְלִבָּם וְקַשְּׁתוֹתָם תִּשָּׁבַֽרְנָה׃","טוֹב־מְעַט לַצַּדִּיק מֵהֲמוֹן רְשָׁעִים רַבִּֽים׃","כִּי זְרוֹעוֹת רְשָׁעִים תִּשָּׁבַרְנָה וְסוֹמֵךְ צַדִּיקִים יְהֹוָֽה׃","יוֹדֵעַ יְהֹוָה יְמֵי תְמִימִם וְנַחֲלָתָם לְעוֹלָם תִּהְיֶֽה׃","לֹֽא־יֵבֹשׁוּ בְּעֵת רָעָה וּבִימֵי רְעָבוֹן יִשְׂבָּֽעוּ׃","כִּי רְשָׁעִים יֹאבֵדוּ וְאֹיְבֵי יְהֹוָה כִּיקַר כָּרִים כָּלוּ בֶעָשָׁן כָּֽלוּ׃","לֹוֶה רָשָׁע וְלֹא יְשַׁלֵּם וְצַדִּיק חוֹנֵן וְנוֹתֵֽן׃","כִּי מְבֹרָכָיו יִירְשׁוּ אָרֶץ וּמְקֻלָּלָיו יִכָּרֵֽתוּ׃","מֵיְהֹוָה מִֽצְעֲדֵי־גֶבֶר כּוֹנָנוּ וְדַרְכּוֹ יֶחְפָּֽץ׃","כִּֽי־יִפֹּל לֹֽא־יוּטָל כִּֽי־יְהֹוָה סוֹמֵךְ יָדֽוֹ׃","נַעַר הָיִיתִי גַּם־זָקַנְתִּי וְֽלֹא־רָאִיתִי צַדִּיק נֶעֱזָב וְזַרְעוֹ מְבַקֶּשׁ־לָֽחֶם׃","כׇּל־הַיּוֹם חוֹנֵן וּמַלְוֶה וְזַרְעוֹ לִבְרָכָֽה׃","סוּר מֵרָע וַעֲשֵׂה־טוֹב וּשְׁכֹן לְעוֹלָֽם׃","כִּי יְהֹוָה אֹהֵב מִשְׁפָּט וְלֹא־יַעֲזֹב אֶת־חֲסִידָיו לְעוֹלָם נִשְׁמָרוּ וְזֶרַע רְשָׁעִים נִכְרָֽת׃","צַדִּיקִים יִֽירְשׁוּ־אָרֶץ וְיִשְׁכְּנוּ לָעַד עָלֶֽיהָ׃","פִּֽי־צַדִּיק יֶהְגֶּה חׇכְמָה וּלְשׁוֹנוֹ תְּדַבֵּר מִשְׁפָּֽט׃","תּוֹרַת אֱלֹהָיו בְּלִבּוֹ לֹא תִמְעַד אֲשֻׁרָֽיו׃","צוֹפֶה רָשָׁע לַצַּדִּיק וּמְבַקֵּשׁ לַהֲמִיתֽוֹ׃","יְהֹוָה לֹא־יַעַזְבֶנּוּ בְיָדוֹ וְלֹא יַרְשִׁיעֶנּוּ בְּהִשָּׁפְטֽוֹ׃","קַוֵּה אֶל־יְהֹוָה וּשְׁמֹר דַּרְכּוֹ וִֽירוֹמִמְךָ לָרֶשֶׁת אָרֶץ בְּהִכָּרֵת רְשָׁעִים תִּרְאֶֽה׃","רָאִיתִי רָשָׁע עָרִיץ וּמִתְעָרֶה כְּאֶזְרָח רַעֲנָֽן׃","וַֽיַּעֲבֹר וְהִנֵּה אֵינֶנּוּ וָאֲבַקְשֵׁהוּ וְלֹא נִמְצָֽא׃","שְׁמׇר־תָּם וּרְאֵה יָשָׁר כִּֽי־אַחֲרִית לְאִישׁ שָׁלֽוֹם׃","וּֽפֹשְׁעִים נִשְׁמְדוּ יַחְדָּו אַחֲרִית רְשָׁעִים נִכְרָֽתָה׃","וּתְשׁוּעַת צַדִּיקִים מֵיְהֹוָה מָעוּזָּם בְּעֵת צָרָֽה׃","וַיַּעְזְרֵם יְהֹוָה וַֽיְפַלְּטֵם יְפַלְּטֵם מֵרְשָׁעִים וְיוֹשִׁיעֵם כִּי־חָסוּ בֽוֹ׃ {פ}"],"lat":["ledavid al-titchar bamre'im al-tekane be'osei avla","ki khechatsir mehera yimalu ukhyerek deshe yibolun","betach baihova va'ase-tov shekhon-erets ur'e emuna","vehit'anag al-Adonai veyiten-lekha mish'alot libekha","gol al-Adonai darkekha uvtach alaiv vehu ya'ase","vehotsi khaor tsidkekha umishpatekha katsohorayim","dom laihova vehitcholel lo al-titchar bematsliach darko be'ish ose mezimot","heref me'af va'azov chema al-titchar akh-leharea'","ki-mere'im yikaretun vekovei Adonai hema yirshu-arets","ve'od me'at ve'ein rasha' vehitbonanta al-mekomo ve'einenu","va'anavim yirshu-arets vehit'angu al-rov shalom","zomem rasha' latsadik vechorek alaiv shinaiv","adonai yischak-lo ki-ra'a ki-yavo yomo","cherev patchu resha'im vedarkhu kashtam lehapil ani ve'evyon litvoach yishrei-darekh","charbam tavo velibam vekashtotam tishavarna","tov-me'at latsadik mehamon resha'im rabim","ki zero'ot resha'im tishavarna vesomekh tsadikim Adonai","yodea' Adonai yemei temimim venachalatam le'olam tihye","lo-yevoshu be'et ra'a uvimei re'avon yisba'u","ki resha'im yovedu ve'oyvei Adonai kikar karim kalu ve'ashan kalu","love rasha' velo yeshalem vetsadik chonen venoten","ki mevorakhaiv yirshu arets umkulalaiv yikaretu","meyhova mits'adei-gever konanu vedarko yechpats","ki-yipol lo-yutal ki-Adonai somekh yado","na'ar hayiti gam-zakanti velo-ra'iti tsadik ne'ezav vezar'o mevakesh-lachem","kol-hayom chonen umalve vezar'o livrakha","sur mera' va'ase-tov ushkhon le'olam","ki Adonai ohev mishpat velo-ya'azov et-chasidaiv le'olam nishmaru vezera' resha'im nikhrat","tsadikim yirshu-arets veyishknu la'ad aleiah","pi-tsadik yehge chokhma ulshono tedaber mishpat","torat elohaiv belibo lo tim'ad ashuraiv","tsofe rasha' latsadik umvakesh lahamito","Adonai lo-ya'azvenu veyado velo yarshi'enu behishafto","kave el-Adonai ushmor darko viromimkha lareshet arets behikaret resha'im tir'e","ra'iti rasha' arits umit'are ke'ezrach ra'anan","vaya'avor vehine einenu va'avakshehu velo nimtsa","shemor-tam ur'e yashar ki-acharit le'ish shalom","ufosh'im nishmdu yachdav acharit resha'im nikhrata","utshu'at tsadikim meyhova ma'uzam be'et tsara","vaya'zrem Adonai vayfaltem yefaltem mersha'im veioshi'em ki-chasu vo f"],"en":["[A Psalm] of David. Fret not thyself because of evil-doers, neither be thou envious against them that work unrighteousness.","For they shall soon wither like the grass, and fade as the green herb.","Trust in the LORD, and do good; dwell in the land, and cherish faithfulness.","So shalt thou delight thyself in the LORD; and He shall give thee the petitions of thy heart.","Commit thy way unto the LORD; trust also in Him, and He will bring it to pass.","And He will make thy righteousness to go forth as the light, and thy right as the noonday.","Resign thyself unto the LORD, and wait patiently for Him; fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass.","Cease from anger, and forsake wrath; fret not thyself, it tendeth only to evil-doing.","For evil-doers shall be cut off; but those that wait for the LORD, they shall inherit the land.","And yet a little while, and the wicked is no more; yea, thou shalt look well at his place, and he is not.","But the humble shall inherit the land, and delight themselves in the abundance of peace.","The wicked plotteth against the righteous, and gnasheth at him with his teeth.","The Lord doth laugh at him; for He seeth that his day is coming.","The wicked have drawn out the sword, and have bent their bow; to cast down the poor and needy, to slay such as are upright in the way;","Their sword shall enter into their own heart, and their bows shall be broken.","Better is a little that the righteous hath than the abundance of many wicked.","For the arms of the wicked shall be broken; but the LORD upholdeth the righteous.","The LORD knoweth the days of them that are wholehearted; and their inheritance shall be for ever.","They shall not be ashamed in the time of evil; and in the days of famine they shall be satisfied.","For the wicked shall perish, and the enemies of the LORD shall be as the fat of lambs— They shall pass away in smoke, they shall pass away.","The wicked borroweth, and payeth not; but the righteous dealeth graciously, and giveth.","For such as are blessed of Him shall inherit the land; and they that are cursed of Him shall be cut off.","It is of the LORD that a man's goings are established; and He delighted in his way.","Though he fall, he shall not be utterly cast down; for the LORD upholdeth his hand.","I have been young, and now am old; yet have I not seen the righteous forsaken, nor his seed begging bread.","All the day long he dealeth graciously, and lendeth; and his seed is blessed.","Depart from evil, and do good; and dwell for evermore.","For the LORD loveth justice, And forsaketh not His saints; they are preserved for ever; but the seed of the wicked shall be cut off.","The righteous shall inherit the land, and dwell therein for ever.","The mouth of the righteous uttereth wisdom, and his tongue speaketh justice.","The law of his God is in his heart; none of his steps slide.","The wicked watcheth the righteous, and seeketh to slay him.","The LORD will not leave him in his hand, nor suffer him to be condemned when he is judged.","Wait for the LORD, and keep His way, and He will exalt thee to inherit the land; when the wicked are cut off, thou shalt see it.","I have seen the wicked in great power, and spreading himself like a leafy tree in its native soil.","But one passed by, and, lo, he was not; yea, I sought him, but he could not be found.","Mark the man of integrity, and behold the upright; for there is a future for the man of peace.","But transgressors shall be destroyed together; the future of the wicked shall be cut off.","But the salvation of the righteous is of the LORD; He is their stronghold in the time of trouble.","And the LORD helpeth them, and delivereth them; He delivereth them from the wicked, and saveth them, because they have taken refuge in Him."]},{"n":38,"he":["מִזְמוֹר לְדָוִד לְהַזְכִּֽיר׃","יְֽהֹוָה אַל־בְּקֶצְפְּךָ תוֹכִיחֵנִי וּֽבַחֲמָתְךָ תְיַסְּרֵֽנִי׃","כִּֽי־חִצֶּיךָ נִחֲתוּ בִי וַתִּנְחַת עָלַי יָדֶֽךָ׃","אֵין־מְתֹם בִּבְשָׂרִי מִפְּנֵי זַעְמֶךָ אֵין־שָׁלוֹם בַּעֲצָמַי מִפְּנֵי חַטָּאתִֽי׃","כִּי עֲוֺנֹתַי עָבְרוּ רֹאשִׁי כְּמַשָּׂא כָבֵד יִכְבְּדוּ מִמֶּֽנִּי׃","הִבְאִישׁוּ נָמַקּוּ חַבּוּרֹתָי מִפְּנֵי אִוַּלְתִּֽי׃","נַעֲוֵיתִי שַׁחֹתִי עַד־מְאֹד כׇּל־הַיּוֹם קֹדֵר הִלָּֽכְתִּי׃","כִּֽי־כְסָלַי מָלְאוּ נִקְלֶה וְאֵין מְתֹם בִּבְשָׂרִֽי׃","נְפוּגוֹתִי וְנִדְכֵּיתִי עַד־מְאֹד שָׁאַגְתִּי מִֽנַּהֲמַת לִבִּֽי׃","אֲֽדֹנָי נֶגְדְּךָ כׇל־תַּאֲוָתִי וְאַנְחָתִי מִמְּךָ לֹֽא־נִסְתָּֽרָה׃","לִבִּי סְחַרְחַר עֲזָבַנִי כֹחִי וְֽאוֹר־עֵינַי גַּם־הֵם אֵין אִתִּֽי׃","אֹֽהֲבַי וְרֵעַי מִנֶּגֶד נִגְעִי יַעֲמֹדוּ וּקְרוֹבַי מֵרָחֹק עָמָֽדוּ׃","וַיְנַקְשׁוּ מְבַקְשֵׁי נַפְשִׁי וְדֹרְשֵׁי רָעָתִי דִּבְּרוּ הַוּוֹת וּמִרְמוֹת כׇּל־הַיּוֹם יֶהְגּֽוּ׃","וַאֲנִי כְחֵרֵשׁ לֹא אֶשְׁמָע וּכְאִלֵּם לֹא יִפְתַּח־פִּֽיו׃","וָאֱהִי כְּאִישׁ אֲשֶׁר לֹֽא־שֹׁמֵעַ וְאֵין בְּפִיו תּוֹכָחֽוֹת׃","כִּֽי־לְךָ יְהֹוָה הוֹחָלְתִּי אַתָּה תַעֲנֶה אֲדֹנָי אֱלֹהָֽי׃","כִּֽי־אָמַרְתִּי פֶּן־יִשְׂמְחוּ־לִי בְּמוֹט רַגְלִי עָלַי הִגְדִּֽילוּ׃","כִּֽי־אֲנִי לְצֶלַע נָכוֹן וּמַכְאוֹבִי נֶגְדִּי תָמִֽיד׃","כִּֽי־עֲוֺנִי אַגִּיד אֶדְאַג מֵחַטָּאתִֽי׃","וְֽאֹיְבַי חַיִּים עָצֵמוּ וְרַבּוּ שֹׂנְאַי שָֽׁקֶר׃","וּמְשַׁלְּמֵי רָעָה תַּחַת טוֹבָה יִשְׂטְנוּנִי תַּחַת (רדופי) [רׇֽדְפִי־]טֽוֹב׃","אַל־תַּעַזְבֵנִי יְהֹוָה אֱלֹהַי אַל־תִּרְחַק מִמֶּֽנִּי׃","חוּשָׁה לְעֶזְרָתִי אֲדֹנָי תְּשׁוּעָתִֽי׃ {פ}"],"lat":["mizmor ledavid lehazkir","Adonai al-beketspkha tokhicheni uvachamatkha teyasreni","ki-chitseikha nichatu vi vatinchat alai yadekha","ein-metom bivsari mipnei za'mekha ein-shalom ba'atsamai mipnei chatati","ki aonotai avru roshi kemasa khaved yikhbdu mimeni","hiv'ishu namaku chaburotai mipnei ivalti","na'aveiti shachoti ad-me'od kol-hayom koder hilakhti","ki-khesalai malu nikle ve'ein metom bivsari","nefugoti venidkeiti ad-me'od sha'agti minahamat libi","adonai negdkha khol-ta'avati ve'anchati mimkha lo-nistara","libi secharchar azavani khochi veor-einai gam-hem ein iti","ohavai vere'ai mineged nig'i ya'amodu ukrovai merachok amadu","vaynakshu mevakshei nafshi vedorshei ra'ati dibru hauot umirmot kol-hayom yehgu","va'ani khecheresh lo eshma' ukh'ilem lo yiftach-piv","va'ehi ke'ish asher lo-shomea' ve'ein befiv tokhachot","ki-lekha Adonai hochalti ata ta'ane adonai elohai","ki-amarti pen-yismchu-li bemot ragli alai higdilu","ki-ani letsela' nakhon umakhovi negdi tamid","ki-aoni agid ed'ag mechatati","ve'oyvai chayim atsemu verabu son'ai shaker","umshalmei ra'a tachat tova yistnuni tachat rdvfy rodfi-tov","al-ta'azveni Adonai elohai al-tirchak mimeni","chusha le'ezrati adonai teshu'ati f"],"en":["A Psalm of David, to make memorial.","O LORD, rebuke me not in Thine anger; neither chasten me in Thy wrath.","For Thine arrows are gone deep into me, and Thy hand is come down upon me.","There is no soundness in my flesh because of Thine indignation; neither is there any health in my bones because of my sin.","For mine iniquities are gone over my head; as a heavy burden they are too heavy for me.","My wounds are noisome, they fester, because of my foolishness.","I am bent and bowed down greatly; I go mourning all the day.","For my loins are filled with burning; and there is no soundness in my flesh.","I am benumbed and sore crushed; I groan by reason of the moaning of my heart.","Lord, all my desire is before Thee; and my sighing is not hid from Thee.","My heart fluttereth, my strength faileth me; as for the light of mine eyes, it also is gone from me.","My friends and my companions stand aloof from my plague; and my kinsmen stand afar off.","They also that seek after my life lay snares for me; and they that seek my hurt speak crafty devices, and utter deceits all the day.","But I am as a deaf man, I hear not; and I am as a dumb man that openeth not his mouth.","Yea, I am become as a man that heareth not, and in whose mouth are no arguments.","For in Thee, O LORD, do I hope; Thou wilt answer, O Lord my God.","For I said: 'Lest they rejoice over me; when my foot slippeth, they magnify themselves against me.'","For I am ready to halt, and my pain is continually before me.","For I do declare mine iniquity; I am full of care because of my sin.","But mine enemies are strong in health; and they that hate me wrongfully are multiplied.","They also that repay evil for good are adversaries unto me, because I follow the thing that is good.","Forsake me not, O LORD; O my God, be not far from me.","Make haste to help me, O Lord, my salvation."]},{"n":39,"he":["לַמְנַצֵּחַ (לידיתון) [לִֽידוּתוּן] מִזְמוֹר לְדָוִֽד׃","אָמַרְתִּי אֶשְׁמְרָה דְרָכַי מֵחֲטוֹא בִלְשׁוֹנִי אֶשְׁמְרָה לְפִי מַחְסוֹם בְּעֹד רָשָׁע לְנֶגְדִּֽי׃","נֶאֱלַמְתִּי דוּמִיָּה הֶחֱשֵׁיתִי מִטּוֹב וּכְאֵבִי נֶעְכָּֽר׃","חַם־לִבִּי בְּקִרְבִּי בַּהֲגִיגִי תִבְעַר־אֵשׁ דִּבַּרְתִּי בִּלְשׁוֹנִֽי׃","הוֹדִיעֵנִי יְהֹוָה קִצִּי וּמִדַּת יָמַי מַה־הִיא אֵדְעָה מֶה־חָדֵל אָֽנִי׃","הִנֵּה טְפָחוֹת נָתַתָּה יָמַי וְחֶלְדִּי כְאַיִן נֶגְדֶּךָ אַךְ כׇּֽל־הֶבֶל כׇּל־אָדָם נִצָּב סֶֽלָה׃","אַךְ־בְּצֶלֶם יִֽתְהַלֶּךְ־אִישׁ אַךְ־הֶבֶל יֶהֱמָיוּן יִצְבֹּר וְֽלֹא־יֵדַע מִֽי־אֹסְפָֽם׃","וְעַתָּה מַה־קִּוִּיתִי אֲדֹנָי תּוֹחַלְתִּי לְךָ הִֽיא׃","מִכׇּל־פְּשָׁעַי הַצִּילֵנִי חֶרְפַּת נָבָל אַל־תְּשִׂימֵֽנִי׃","נֶאֱלַמְתִּי לֹא אֶפְתַּח־פִּי כִּי אַתָּה עָשִֽׂיתָ׃","הָסֵר מֵעָלַי נִגְעֶךָ מִתִּגְרַת יָדְךָ אֲנִי כָלִֽיתִי׃","בְּֽתוֹכָחוֹת עַל־עָוֺן יִסַּרְתָּ אִישׁ וַתֶּמֶס כָּעָשׁ חֲמוּדוֹ אַךְ הֶבֶל כׇּל־אָדָם סֶֽלָה׃","שִׁמְעָֽה־תְפִלָּתִי יְהֹוָה וְשַׁוְעָתִי הַאֲזִינָה אֶֽל־דִּמְעָתִי אַֽל־תֶּחֱרַשׁ כִּי גֵר אָנֹכִי עִמָּךְ תּוֹשָׁב כְּכׇל־אֲבוֹתָֽי׃","הָשַׁע מִמֶּנִּי וְאַבְלִיגָה בְּטֶרֶם אֵלֵךְ וְאֵינֶֽנִּי׃ {פ}"],"lat":["lamnatseach lydytvn lidutun mizmor ledavid","amarti eshmra derakhai mechato vilshoni eshmra lefi machsom be'od rasha' lenegdi","ne'elamti dumiya hechesheiti mitov ukh'evi ne'kar","cham-libi bekirbi bahagigi tiv'ar-esh dibarti bilshoni","hodi'eni Adonai kitsi umidat yamai ma-hi ed'a me-chadel ani","hine tefachot natata yamai vecheldi khe'ayin negdekha akh kol-hevel kol-adam nitsav sela","akh-betselem yithalekh-ish akh-hevel yehemaiun yitsbor velo-yeda' mi-osfam","ve'ata ma-kiviti adonai tochalti lekha hi","mikol-pesha'ai hatsileni cherpat naval al-tesimeni","ne'elamti lo eftach-pi ki ata asita","haser me'alai nig'ekha mitigrat yadkha ani khaliti","betokhachot al-aon yisarta ish vatemes ka'ash chamudo akh hevel kol-adam sela","shim'a-tefilati Adonai veshav'ati ha'azina el-dim'ati al-techerash ki ger anokhi imakh toshav kekhol-avotai","hasha' mimeni ve'avliga beterem elekh ve'eineni f"],"en":["For the Leader, for Jeduthun. A Psalm of David.","I said: 'I will take heed to my ways, that I sin not with my tongue; I will keep a curb upon my mouth, while the wicked is before me.'","I was dumb with silence; I held my peace, had no comfort; and my pain was held in check.","My heart waxed hot within me; while I was musing, the fire kindled; Then spoke I with my tongue:","'LORD, make me to know mine end, And the measure of my days, what it is; Let me know how short-lived I am.","Behold, Thou hast made my days as hand-breadths; and mine age is as nothing before Thee; surely every man at his best estate is altogether vanity. Selah","Surely man walketh as a mere semblance; surely for vanity they are in turmoil; He heapeth up riches, and knoweth not who shall gather them.","And now, Lord, what wait I for? My hope, it is in Thee.","Deliver me from all my transgressions; make me not the reproach of the base.","I am dumb, I open not my mouth; because Thou hast done it.","Remove Thy stroke from off me; I am consumed by the blow of Thy hand.","With rebukes dost Thou chasten man for iniquity, and like a moth Thou makest his beauty to consume away; surely every man is vanity. Selah","Hear my prayer, O LORD, and give ear unto my cry; keep not silence at my tears; for I am a stranger with Thee, a sojourner, as all my fathers were.","Look away from me, that I may take comfort, before I go hence, and be no more.'"]},{"n":40,"he":["לַמְנַצֵּחַ לְדָוִד מִזְמֽוֹר׃","קַוֺּה קִוִּיתִי יְהֹוָה וַיֵּט אֵלַי וַיִּשְׁמַע שַׁוְעָתִֽי׃","וַיַּעֲלֵנִי מִבּוֹר שָׁאוֹן מִטִּיט הַיָּוֵן וַיָּקֶם עַל־סֶלַע רַגְלַי כּוֹנֵן אֲשֻׁרָֽי׃","וַיִּתֵּן בְּפִי שִׁיר חָדָשׁ תְּהִלָּה לֵאלֹהֵינוּ יִרְאוּ רַבִּים וְיִירָאוּ וְיִבְטְחוּ בַּיהֹוָֽה׃","אַשְֽׁרֵי־הַגֶּבֶר אֲשֶׁר־שָׂם יְהֹוָה מִבְטַחוֹ וְֽלֹא־פָנָה אֶל־רְהָבִים וְשָׂטֵי כָזָֽב׃","רַבּוֹת עָשִׂיתָ אַתָּה יְהֹוָה אֱלֹהַי נִפְלְאֹתֶיךָ וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ אֵין עֲרֹךְ אֵלֶיךָ אַגִּידָה וַאֲדַבֵּרָה עָצְמוּ מִסַּפֵּֽר׃","זֶבַח וּמִנְחָה לֹֽא־חָפַצְתָּ אׇזְנַיִם כָּרִיתָ לִּי עוֹלָה וַחֲטָאָה לֹא שָׁאָֽלְתָּ׃","אָז אָמַרְתִּי הִנֵּה־בָאתִי בִּמְגִלַּת־סֵפֶר כָּתוּב עָלָֽי׃","לַעֲשׂוֹת־רְצוֹנְךָ אֱלֹהַי חָפָצְתִּי וְתוֹרָתְךָ בְּתוֹךְ מֵעָֽי׃","בִּשַּׂרְתִּי צֶדֶק בְּקָהָל רָב הִנֵּה שְׂפָתַי לֹא אֶכְלָא יְהֹוָה אַתָּה יָדָֽעְתָּ׃","צִדְקָתְךָ לֹֽא־כִסִּיתִי בְּתוֹךְ לִבִּי אֱמוּנָתְךָ וּתְשׁוּעָתְךָ אָמָרְתִּי לֹא־כִחַדְתִּי חַסְדְּךָ וַאֲמִתְּךָ לְקָהָל רָֽב׃","אַתָּה יְהֹוָה לֹֽא־תִכְלָא רַחֲמֶיךָ מִמֶּנִּי חַסְדְּךָ וַאֲמִתְּךָ תָּמִיד יִצְּרֽוּנִי׃","כִּי אָפְפֽוּ־עָלַי רָעוֹת עַד־אֵין מִסְפָּר הִשִּׂיגוּנִי עֲוֺנֹתַי וְלֹא־יָכֹלְתִּי לִרְאוֹת עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי וְלִבִּי עֲזָבָֽנִי׃","רְצֵה יְהֹוָה לְהַצִּילֵנִי יְהֹוָה לְעֶזְרָתִי חֽוּשָׁה׃","יֵבֹשׁוּ וְיַחְפְּרוּ יַחַד מְבַקְשֵׁי נַפְשִׁי לִסְפּוֹתָהּ יִסֹּגוּ אָחוֹר וְיִכָּלְמוּ חֲפֵצֵי רָעָתִֽי׃","יָשֹׁמּוּ עַל־עֵקֶב בׇּשְׁתָּם הָאֹמְרִים לִי הֶאָח הֶאָֽח׃","יָשִׂישׂוּ וְיִשְׂמְחוּ בְּךָ כׇּֽל־מְבַקְשֶׁיךָ יֹאמְרוּ תָמִיד יִגְדַּל יְהֹוָה אֹהֲבֵי תְּשׁוּעָתֶֽךָ׃","וַאֲנִי עָנִי וְאֶבְיוֹן אֲדֹנָי יַחֲשׇׁב־לִי עֶזְרָתִי וּמְפַלְטִי אַתָּה אֱלֹהַי אַל־תְּאַחַֽר׃ {פ}"],"lat":["lamnatseach ledavid mizmor","kavo kiviti Adonai vayet elai vayishma' shav'ati","vaya'aleni mibor shaon mitit hayaven vayakem al-sela' raglai konen ashurai","vayiten befi shir chadash tehila leloheinu yiru rabim veyirau veyivtchu baihova","ashrei-hagever asher-sam Adonai mivtacho velo-fana el-rehavim vesatei khazav","rabot asita ata Adonai elohai nifl'oteikha umachshvoteikha eleinu ein arokh eleikha agida va'adabera atsmu misaper","zevach umincha lo-chafatsta oznayim karita li ola vachata'a lo sha'alta","az amarti hine-vati bimgilat-sefer katuv alai","la'asot-retsonkha elohai chafatsti vetoratkha betokh me'ai","bisarti tsedek bekahal rav hine sefatai lo ekhla Adonai ata yada'ta","tsidkatkha lo-khisiti betokh libi emunatkha utshu'atkha amarti lo-khichadti chasdkha va'amitkha lekahal rav","ata Adonai lo-tikhla rachameikha mimeni chasdkha va'amitkha tamid yitsruni","ki afefu-alai ra'ot ad-ein mispar hisiguni aonotai velo-yakholti lirot atsmu misa'arot roshi velibi azavani","retse Adonai lehatsileni Adonai le'ezrati chusha","yevoshu veyachpru yachad mevakshei nafshi lispotah yisogu achor veyikalmu chafetsei ra'ati","yashomu al-ekev boshtam ha'omrim li he'ach he'ach","yasisu veyismchu bekha kol-mevaksheikha yomru tamid yigdal Adonai ohavei teshu'atekha","va'ani ani ve'evyon adonai yachashov-li ezrati umfalti ata elohai al-te'achar f"],"en":["For the Leader. A Psalm of David.","I waited patiently for the LORD; and He inclined unto me, and heard my cry.","He brought me up also out of the tumultuous pit, out of the miry clay; and He set my feet upon a rock, He established my goings.","And He hath put a new song in my mouth, even praise unto our God; many shall see, and fear, and shall trust in the LORD.","Happy is the man that hath made the LORD his trust, and hath not turned unto the arrogant, nor unto such as fall away treacherously.","Many things hast Thou done, O LORD my God, even Thy wonderful works, and Thy thoughts toward us; there is none to be compared unto Thee! If I would declare and speak of them, they are more than can be told.","Sacrifice and meal-offering Thou hast no delight in; mine ears hast Thou opened; burnt-offering and sin-offering hast Thou not required.","Then said I: 'Lo, I am come with the roll of a book which is prescribed for me;","I delight to do Thy will, O my God; yea, Thy law is in my inmost parts.'","I have preached righteousness in the great congregation, Lo, I did not refrain my lips; O LORD, Thou knowest.","I have not hid Thy righteousness within my heart; I have declared Thy faithfulness and Thy salvation; I have not concealed Thy mercy and Thy truth from the great congregation.","Thou, O LORD, wilt not withhold Thy compassions from me; let Thy mercy and Thy truth continually preserve me.","For innumerable evils have compassed me about, mine iniquities have overtaken me, so that I am not able to look up; they are more than the hairs of my head, and my heart hath failed me.","Be pleased, O LORD, to deliver me; O LORD, make haste to help me.","Let them be ashamed and abashed together that seek after my soul to sweep it away; let them be turned backward and brought to confusion that delight in my hurt.","Let them be appalled by reason of their shame that say unto me: 'Aha, aha.'","Let all those that seek Thee rejoice and be glad in Thee; let such as love Thy salvation say continually: 'The LORD be magnified.'","But, as for me, that am poor and needy, the Lord will account it unto me; Thou art my help and my deliverer; O my God, tarry not."]},{"n":41,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃","אַשְׁרֵי מַשְׂכִּיל אֶל־דָּל בְּיוֹם רָעָה יְֽמַלְּטֵהוּ יְהֹוָֽה׃","יְהֹוָה יִשְׁמְרֵהוּ וִיחַיֵּהוּ (יאשר) [וְאֻשַּׁר] בָּאָרֶץ וְאַֽל־תִּתְּנֵהוּ בְּנֶפֶשׁ אֹיְבָֽיו׃","יְֽהֹוָה יִסְעָדֶנּוּ עַל־עֶרֶשׂ דְּוָי כׇּל־מִשְׁכָּבוֹ הָפַכְתָּ בְחׇלְיֽוֹ׃","אֲֽנִי־אָמַרְתִּי יְהֹוָה חׇנֵּנִי רְפָאָה נַפְשִׁי כִּי־חָטָאתִי לָֽךְ׃","אוֹיְבַי יֹאמְרוּ רַע לִי מָתַי יָמוּת וְאָבַד שְׁמֽוֹ׃","וְאִם־בָּא לִרְאוֹת שָׁוְא יְדַבֵּר לִבּוֹ יִקְבׇּץ־אָוֶן לוֹ יֵצֵא לַחוּץ יְדַבֵּֽר׃","יַחַד עָלַי יִתְלַחֲשׁוּ כׇּל־שֹׂנְאָי עָלַי יַחְשְׁבוּ רָעָה לִֽי׃","דְּֽבַר־בְּלִיַּעַל יָצוּק בּוֹ וַאֲשֶׁר שָׁכַב לֹא־יוֹסִיף לָקֽוּם׃","גַּם־אִישׁ שְׁלוֹמִי אֲשֶׁר־בָּטַחְתִּי בוֹ אוֹכֵל לַחְמִי הִגְדִּיל עָלַי עָקֵֽב׃","וְאַתָּה יְהֹוָה חׇנֵּנִי וַהֲקִימֵנִי וַאֲשַׁלְּמָה לָהֶֽם׃","בְּזֹאת יָדַעְתִּי כִּֽי־חָפַצְתָּ בִּי כִּי לֹֽא־יָרִיעַ אֹיְבִי עָלָֽי׃","וַאֲנִי בְּתֻמִּי תָּמַכְתָּ בִּי וַתַּצִּיבֵנִי לְפָנֶיךָ לְעוֹלָֽם׃","בָּרוּךְ יְהֹוָה אֱלֹהֵי יִשְׂרָאֵל מֵֽהָעוֹלָם וְעַד הָעוֹלָם אָמֵן וְאָמֵֽן׃"],"lat":["lamnatseach mizmor ledavid","ashrei maskil el-dal beiom ra'a yemaltehu Adonai","Adonai yishmrehu vichayehu yshr v'ushar ba'arets ve'al-titnehu benefesh oyvaiv","Adonai yis'adenu al-eres devai kol-mishkavo hafakhta vecholyo","ani-amarti Adonai choneni refa'a nafshi ki-chatati lakh","oyvai yomru ra' li matai yamut ve'avad shemo","ve'im-ba lirot shav yedaber libo yikbots-aven lo yetse lachuts yedaber","yachad alai yitlachashu kol-son'ai alai yachshvu ra'a li","devar-beliya'al yatsuk bo va'asher shakhav lo-yosif lakum","gam-ish shelomi asher-batachti vo okhel lachmi higdil alai akev","ve'ata Adonai choneni vahakimeni va'ashalma lahem","bezot yada'ti ki-chafatsta bi ki lo-yaria' oyvi alai","va'ani betumi tamakhta bi vatatsiveni lefaneikha le'olam","barukh Adonai elohei yisra'el meha'olam ve'ad ha'olam amen ve'amen"],"en":["For the Leader. A Psalm of David.","Happy is he that considereth the poor; the LORD will deliver him in the day of evil.","The LORD preserve him, and keep him alive, let him be called happy in the land; and deliver not Thou him unto the greed of his enemies.","The LORD support him upon the bed of illness; mayest Thou turn all his lying down in his sickness.","As for me, I said: 'O LORD, be gracious unto me; heal my soul; for I have sinned against Thee.'","Mine enemies speak evil of me: 'When shall he die, and his name perish?'","And if one come to see me, he speaketh falsehood; His heart gathereth iniquity to itself; when he goeth abroad, he speaketh of it.","All that hate me whisper together against me, against me do they devise my hurt:","'An evil thing cleaveth fast unto him; and now that he lieth, he shall rise up no more.'","Yea, mine own familiar friend, in whom I trusted, who did eat of my bread, Hath lifted up his heel against me.","But Thou, O LORD, be gracious unto me, and raise me up, that I may requite them.","By this I know that Thou delightest in me, that mine enemy doth not triumph over me.","And as for me, Thou upholdest me because of mine integrity, and settest me before Thy face for ever.","Blessed be the LORD, the God of Israel, from everlasting and to everlasting. Amen, and Amen."]},{"n":42,"he":["לַמְנַצֵּחַ מַשְׂכִּיל לִבְנֵי־קֹֽרַח׃","כְּאַיָּל תַּעֲרֹג עַל־אֲפִֽיקֵי־מָיִם כֵּן נַפְשִׁי תַעֲרֹג אֵלֶיךָ אֱלֹהִֽים׃","צָמְאָה נַפְשִׁי לֵאלֹהִים לְאֵל חָי מָתַי אָבוֹא וְאֵרָאֶה פְּנֵי אֱלֹהִֽים׃","הָֽיְתָה־לִּי דִמְעָתִי לֶחֶם יוֹמָם וָלָיְלָה בֶּאֱמֹר אֵלַי כׇּל־הַיּוֹם אַיֵּה אֱלֹהֶֽיךָ׃","אֵלֶּה אֶזְכְּרָה וְאֶשְׁפְּכָה עָלַי נַפְשִׁי כִּי אֶעֱבֹר בַּסָּךְ אֶדַּדֵּם עַד־בֵּית־אֱלֹהִים בְּקוֹל־רִנָּה וְתוֹדָה הָמוֹן חוֹגֵֽג׃","מַה־תִּשְׁתּוֹחֲחִי נַפְשִׁי וַתֶּהֱמִי עָלָי הוֹחִלִי לֵאלֹהִים כִּי־עוֹד אוֹדֶנּוּ יְשׁוּעוֹת פָּנָֽיו׃","אֱֽלֹהַי עָלַי נַפְשִׁי תִשְׁתּוֹחָח עַל־כֵּן אֶזְכׇּרְךָ מֵאֶרֶץ יַרְדֵּן וְחֶרְמוֹנִים מֵהַר מִצְעָֽר׃","תְּהוֹם־אֶל־תְּהוֹם קוֹרֵא לְקוֹל צִנּוֹרֶיךָ כׇּֽל־מִשְׁבָּרֶיךָ וְגַלֶּיךָ עָלַי עָבָֽרוּ׃","יוֹמָם יְצַוֶּה יְהֹוָה חַסְדּוֹ וּבַלַּיְלָה שִׁירֹה עִמִּי תְּפִלָּה לְאֵל חַיָּֽי׃","אוֹמְרָה לְאֵל סַלְעִי לָמָה שְׁכַחְתָּנִי לָֽמָּה־קֹדֵר אֵלֵךְ בְּלַחַץ אוֹיֵֽב׃","בְּרֶצַח בְּֽעַצְמוֹתַי חֵרְפוּנִי צוֹרְרָי בְּאׇמְרָם אֵלַי כׇּל־הַיּוֹם אַיֵּה אֱלֹהֶֽיךָ׃","מַה־תִּשְׁתּוֹחֲחִי נַפְשִׁי וּֽמַה־תֶּהֱמִי עָלָי הוֹחִילִי לֵאלֹהִים כִּי־עוֹד אוֹדֶנּוּ יְשׁוּעֹת פָּנַי וֵאלֹהָֽי׃ {פ}"],"lat":["lamnatseach maskil livnei-korach","ke'ayal ta'arog al-afikei-mayim ken nafshi ta'arog eleikha elohim","tsam'a nafshi lelohim le'el chai matai avo ve'era'e penei elohim","hayta-li dim'ati lechem yomam valayla be'emor elai kol-hayom aye eloheikha","ele ezkra ve'eshpkha alai nafshi ki e'evor basakh edadem ad-beit-elohim bekol-rina vetoda hamon chogeg","ma-tishtochachi nafshi vatehemi alai hochili lelohim ki-od odenu yeshu'ot panaiv","elohai alai nafshi tishtochach al-ken ezkorkha me'erets yarden vechermonim mehar mits'ar","tehom-el-tehom kore lekol tsinoreikha kol-mishbareikha vegaleikha alai avaru","yomam yetsave Adonai chasdo uvalayla shiro imi tefila le'el chayai","omra le'el sal'i lama shekhachtani lama-koder elekh belachats oyev","beretsach be'atsmotai cherfuni tsorerai be'omram elai kol-hayom aye eloheikha","ma-tishtochachi nafshi uma-tehemi alai hochili lelohim ki-od odenu yeshu'ot panai velohai f"],"en":["For the Leader; Maschil of the sons of Korah.","As the hart panteth after the water brooks, so panteth my soul after Thee, O God.","My soul thirsteth for God, for the living God: 'When shall I come and appear before God?'","My tears have been my food day and night, while they say unto me all the day: 'Where is Thy God?'","These things I remember, and pour out my soul within me, how I passed on with the throng, and led them to the house of God, with the voice of joy and praise, a multitude keeping holyday.","Why art thou cast down, O my soul? And why moanest thou within me? Hope thou in God; for I shall yet praise Him for the salvation of His countenance.","O my God, my soul is cast down within me; therefore do I remember Thee from the land of Jordan, and the Hermons, from the hill Mizar.","Deep calleth unto deep at the voice of Thy cataracts; all Thy waves and Thy billows are gone over me.","By day the LORD will command His lovingkindness, and in the night His song shall be with me, even a prayer unto the God of my life.","I will say unto God my Rock: 'Why hast Thou forgotten me? Why go I mourning under the oppression of the enemy?'","As with a crushing in my bones, mine adversaries taunt me; while they say unto me all the day: 'Where is Thy God?'","Why art thou cast down, O my soul? And why moanest thou within me? Hope thou in God; for I shall yet praise Him, the salvation of my countenance, and my God."]},{"n":43,"he":["שׇׁפְטֵנִי אֱלֹהִים וְרִיבָה רִיבִי מִגּוֹי לֹֽא־חָסִיד מֵאִישׁ־מִרְמָה וְעַוְלָה תְפַלְּטֵֽנִי׃","כִּי־אַתָּה אֱלֹהֵי מָעוּזִּי לָמָה זְנַחְתָּנִי לָֽמָּה־קֹדֵר אֶתְהַלֵּךְ בְּלַחַץ אוֹיֵֽב׃","שְׁלַח־אוֹרְךָ וַאֲמִתְּךָ הֵמָּה יַנְחוּנִי יְבִיאוּנִי אֶל־הַֽר־קׇדְשְׁךָ וְאֶל־מִשְׁכְּנוֹתֶֽיךָ׃","וְאָבוֹאָה אֶל־מִזְבַּח אֱלֹהִים אֶל־אֵל שִׂמְחַת גִּילִי וְאוֹדְךָ בְכִנּוֹר אֱלֹהִים אֱלֹהָֽי׃","מַה־תִּשְׁתּוֹחֲחִי נַפְשִׁי וּֽמַה־תֶּהֱמִי עָלָי הוֹחִילִי לֵאלֹהִים כִּי־עוֹד אוֹדֶנּוּ יְשׁוּעֹת פָּנַי וֵאלֹהָֽי׃ {פ}"],"lat":["shofteni elohim veriva rivi migoy lo-chasid me'ish-mirma ve'avla tefalteni","ki-ata elohei ma'uzi lama zenachtani lama-koder ethalekh belachats oyev","shelach-orkha va'amitkha hema yanchuni yeviuni el-har-kodshkha ve'el-mishknoteikha","ve'avo'a el-mizbach elohim el-el simchat gili veodkha vekhinor elohim elohai","ma-tishtochachi nafshi uma-tehemi alai hochili lelohim ki-od odenu yeshu'ot panai velohai f"],"en":["Be Thou my judge, O God, and plead my cause against an ungodly nation; O deliver me from the deceitful and unjust man.","For Thou art the God of my strength; why hast Thou cast me off? Why go I mourning under the oppression of the enemy?","O send out Thy light and Thy truth; let them lead me; Let them bring me unto Thy holy mountain, and to Thy dwelling-places.","Then will I go unto the altar of God, unto God, my exceeding joy; And praise Thee upon the harp, O God, my God.","Why art thou cast down, O my soul? And why moanest thou within me? Hope thou in God; for I shall yet praise Him, The salvation of my countenance, and my God."]},{"n":44,"he":["לַמְנַצֵּחַ לִבְנֵי־קֹרַח מַשְׂכִּֽיל׃","אֱלֹהִים בְּאׇזְנֵינוּ שָׁמַעְנוּ אֲבוֹתֵינוּ סִפְּרוּ־לָנוּ פֹּעַל פָּעַלְתָּ בִימֵיהֶם בִּימֵי קֶֽדֶם׃","אַתָּה יָדְךָ גּוֹיִם הוֹרַשְׁתָּ וַתִּטָּעֵם תָּרַע לְאֻמִּים וַֽתְּשַׁלְּחֵֽם׃","כִּי לֹא בְחַרְבָּם יָרְשׁוּ אָרֶץ וּזְרוֹעָם לֹא־הוֹשִׁיעָה לָּמוֹ כִּֽי־יְמִינְךָ וּזְרוֹעֲךָ וְאוֹר פָּנֶיךָ כִּי רְצִיתָֽם׃","אַתָּה־הוּא מַלְכִּי אֱלֹהִים צַוֵּה יְשׁוּעוֹת יַעֲקֹֽב׃","בְּךָ צָרֵינוּ נְנַגֵּחַ בְּשִׁמְךָ נָבוּס קָמֵֽינוּ׃","כִּי לֹא בְקַשְׁתִּי אֶבְטָח וְחַרְבִּי לֹא תוֹשִׁיעֵֽנִי׃","כִּי הוֹשַׁעְתָּנוּ מִצָּרֵינוּ וּמְשַׂנְאֵינוּ הֱבִישֽׁוֹתָ׃","בֵּאלֹהִים הִלַּלְנוּ כׇל־הַיּוֹם וְשִׁמְךָ לְעוֹלָם נוֹדֶה סֶֽלָה׃","אַף־זָנַחְתָּ וַתַּכְלִימֵנוּ וְלֹא־תֵצֵא בְּצִבְאוֹתֵֽינוּ׃","תְּשִׁיבֵנוּ אָחוֹר מִנִּי־צָר וּמְשַׂנְאֵינוּ שָׁסוּ לָֽמוֹ׃","תִּתְּנֵנוּ כְּצֹאן מַאֲכָל וּבַגּוֹיִם זֵרִיתָֽנוּ׃","תִּמְכֹּֽר־עַמְּךָ בְלֹא־הוֹן וְלֹֽא־רִבִּיתָ בִּמְחִירֵיהֶֽם׃","תְּשִׂימֵנוּ חֶרְפָּה לִשְׁכֵנֵינוּ לַעַג וָקֶלֶס לִסְבִיבוֹתֵֽינוּ׃","תְּשִׂימֵנוּ מָשָׁל בַּגּוֹיִם מְנֽוֹד־רֹאשׁ בַּלְאֻמִּֽים׃","כׇּל־הַיּוֹם כְּלִמָּתִי נֶגְדִּי וּבֹשֶׁת פָּנַי כִּסָּֽתְנִי׃","מִקּוֹל מְחָרֵף וּמְגַדֵּף מִפְּנֵי אוֹיֵב וּמִתְנַקֵּֽם׃","כׇּל־זֹאת בָּאַתְנוּ וְלֹא שְׁכַחֲנוּךָ וְלֹֽא־שִׁקַּרְנוּ בִּבְרִיתֶֽךָ׃","לֹא־נָסוֹג אָחוֹר לִבֵּנוּ וַתֵּט אֲשֻׁרֵינוּ מִנִּי אׇרְחֶֽךָ׃","כִּי דִכִּיתָנוּ בִּמְקוֹם תַּנִּים וַתְּכַס עָלֵינוּ בְצַלְמָֽוֶת׃","אִם־שָׁכַחְנוּ שֵׁם אֱלֹהֵינוּ וַנִּפְרֹשׂ כַּפֵּינוּ לְאֵל זָֽר׃","הֲלֹא אֱלֹהִים יַחֲקׇר־זֹאת כִּי־הוּא יֹדֵעַ תַּעֲלֻמוֹת לֵֽב׃","כִּֽי־עָלֶיךָ הֹרַגְנוּ כׇל־הַיּוֹם נֶחְשַׁבְנוּ כְּצֹאן טִבְחָֽה׃","עוּרָה לָמָּה תִישַׁן אֲדֹנָי הָקִיצָה אַל־תִּזְנַח לָנֶֽצַח׃","לָֽמָּה־פָנֶיךָ תַסְתִּיר תִּשְׁכַּח עׇנְיֵנוּ וְֽלַחֲצֵֽנוּ׃","כִּי שָׁחָה לֶעָפָר נַפְשֵׁנוּ דָּבְקָה לָאָרֶץ בִּטְנֵֽנוּ׃","קוּמָֽה עֶזְרָתָה לָּנוּ וּפְדֵנוּ לְמַעַן חַסְדֶּֽךָ׃ {פ}"],"lat":["lamnatseach livnei-korach maskil","elohim be'ozneinu shama'nu avoteinu sipru-lanu po'al pa'alta vimeihem bimei kedem","ata yadkha goyim horashta vatita'em tara' le'umim vatshalchem","ki lo vecharbam yarshu arets uzro'am lo-hoshi'a lamo ki-yeminkha uzro'akha veor paneikha ki retsitam","ata-hu malki elohim tsave yeshu'ot ya'akov","bekha tsareinu nenageach beshimkha navus kameinu","ki lo vekashti evtach vecharbi lo toshi'eni","ki hosha'tanu mitsareinu umsan'einu hevishota","belohim hilalnu khol-hayom veshimkha le'olam node sela","af-zanachta vatakhlimenu velo-tetse betsivoteinu","teshivenu achor mini-tsar umsan'einu shasu lamo","titnenu ketson ma'akhal uvagoyim zeritanu","timkor-amkha velo-hon velo-ribita bimchireihem","tesimenu cherpa lishkheneinu la'ag vakeles lisvivoteinu","tesimenu mashal bagoyim menod-rosh bal'umim","kol-hayom kelimati negdi uvoshet panai kisatni","mikol mecharef umgadef mipnei oyev umitnakem","kol-zot ba'atnu velo shekhachanukha velo-shikarnu bivritekha","lo-nasog achor libenu vatet ashureinu mini orchekha","ki dikitanu bimkom tanim vatkhas aleinu vetsalmavet","im-shakhachnu shem eloheinu vanifros kapeinu le'el zar","halo elohim yachakor-zot ki-hu yodea' ta'alumot lev","ki-aleikha horagnu khol-hayom nechshavnu ketson tivcha","ura lama tishan adonai hakitsa al-tiznach lanetsach","lama-faneikha tastir tishkach onyenu velachatsenu","ki shacha le'afar nafshenu davka la'arets bitnenu","kuma ezrata lanu ufdenu lema'an chasdekha f"],"en":["For the Leader; [a Psalm] of the sons of Korah. Maschil.","O God, we have heard with our ears, our fathers have told us; a work Thou didst in their days, in the days of old.","Thou with Thy hand didst drive out the nations, and didst plant them in; Thou didst break the peoples, and didst spread them abroad.","For not by their own sword did they get the land in possession, Neither did their own arm save them; but Thy right hand, and Thine arm, and the light of Thy countenance, because Thou wast favourable unto them.","Thou art my King, O God; command the salvation of Jacob.","Through Thee do we push down our adversaries; through Thy name do we tread them under that rise up against us.","For I trust not in my bow, neither can my sword save me.","But Thou hast saved us from our adversaries, and hast put them to shame that hate us.","In God have we gloried all the day, and we will give thanks unto Thy name for ever. Selah","Yet Thou hast cast off, and brought us to confusion; and goest not forth with our hosts.","Thou makest us to turn back from the adversary; and they that hate us spoil at their will.","Thou hast given us like sheep to be eaten; and hast scattered us among the nations.","Thou sellest Thy people for small gain, and hast not set their prices high.","Thou makest us a taunt to our neighbours, a scorn and a derision to them that are round about us.","Thou makest us a byword among the nations, a shaking of the head among the peoples.","All the day is my confusion before me, and the shame of my face hath covered me,","For the voice of him that taunteth and blasphemeth; by reason of the enemy and the revengeful.","All this is come upon us; yet have we not forgotten Thee, neither have we been false to Thy covenant.","Our heart is not turned back, neither have our steps declined from Thy path;","Though Thou hast crushed us into a place of jackals, and covered us with the shadow of death.","If we had forgotten the name of our God, or spread forth our hands to a strange god; .","Would not God search this out? For He knoweth the secrets of the heart.","Nay, but for Thy sake are we killed all the day; we are accounted as sheep for the slaughter.","Awake, why sleepest Thou, O Lord? Arouse Thyself, cast not off for ever.","Wherefore hidest Thou Thy face, and forgettest our affliction and our oppression?","For our soul is bowed down to the dust; our belly cleaveth unto the earth.","Arise for our help, and redeem us for Thy mercy's sake."]},{"n":45,"he":["לַמְנַצֵּחַ עַל־שֹׁשַׁנִּים לִבְנֵי־קֹרַח מַשְׂכִּיל שִׁיר יְדִידֹֽת׃","רָחַשׁ
