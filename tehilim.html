land, Thou hast turned the captivity of Jacob.","Thou hast forgiven the iniquity of Thy people, Thou hast pardoned all their sin. Selah .","Thou hast withdrawn all Thy wrath; Thou hast turned from the fierceness of Thine anger.","Restore us, O God of our salvation, And cause Thine indignation toward us to cease.","Wilt Thou be angry with us for ever? Wilt Thou draw out Thine anger to all generations?","Wilt Thou not quicken us again, That Thy people may rejoice in Thee?","Show us Thy mercy, O LORD, And grant us Thy salvation.","I will hear what God the LORD will speak; For He will speak peace unto His people, and to His saints; But let them not turn back to folly.","Surely His salvation is nigh them that fear Him; That glory may dwell in our land.","Mercy and truth are met together; Righteousness and peace have kissed each other.","Truth springeth out of the earth; And righteousness hath looked down from heaven.","Yea, the LORD will give that which is good; And our land shall yield her produce.","Righteousness shall go before Him, And shall make His footsteps a way."]},{"n":86,"he":["תְּפִלָּה לְדָוִד הַטֵּֽה־יְהֹוָה אׇזְנְךָ עֲנֵנִי כִּֽי־עָנִי וְאֶבְיוֹן אָֽנִי׃","שׇׁמְרָה נַפְשִׁי כִּֽי־חָסִיד אָנִי הוֹשַׁע עַבְדְּךָ אַתָּה אֱלֹהַי הַבּוֹטֵחַ אֵלֶֽיךָ׃","חׇנֵּנִי אֲדֹנָי כִּי אֵלֶיךָ אֶקְרָא כׇּל־הַיּֽוֹם׃","שַׂמֵּחַ נֶפֶשׁ עַבְדֶּךָ כִּי אֵלֶיךָ אֲדֹנָי נַפְשִׁי אֶשָּֽׂא׃","כִּֽי־אַתָּה אֲדֹנָי טוֹב וְסַלָּח וְרַב־חֶסֶד לְכׇל־קֹֽרְאֶֽיךָ׃","הַאֲזִינָה יְהֹוָה תְּפִלָּתִי וְהַקְשִׁיבָה בְּקוֹל תַּחֲנוּנוֹתָֽי׃","בְּיוֹם צָרָתִֽי אֶקְרָאֶךָּ כִּי תַעֲנֵֽנִי׃","אֵין־כָּמוֹךָ בָאֱלֹהִים אֲדֹנָי וְאֵין כְּֽמַעֲשֶֽׂיךָ׃","כׇּל־גּוֹיִם אֲשֶׁר עָשִׂיתָ יָבוֹאוּ וְיִשְׁתַּחֲווּ לְפָנֶיךָ אֲדֹנָי וִיכַבְּדוּ לִשְׁמֶֽךָ׃","כִּֽי־גָדוֹל אַתָּה וְעֹשֵׂה נִפְלָאוֹת אַתָּה אֱלֹהִים לְבַדֶּֽךָ׃","הוֹרֵנִי יְהֹוָה דַּרְכֶּךָ אֲהַלֵּךְ בַּאֲמִתֶּךָ יַחֵד לְבָבִי לְיִרְאָה שְׁמֶֽךָ׃","אוֹדְךָ אֲדֹנָי אֱלֹהַי בְּכׇל־לְבָבִי וַאֲכַבְּדָה שִׁמְךָ לְעוֹלָֽם׃","כִּֽי־חַסְדְּךָ גָּדוֹל עָלָי וְהִצַּלְתָּ נַפְשִׁי מִשְּׁאוֹל תַּחְתִּיָּֽה׃","אֱלֹהִים זֵדִים קָמוּ־עָלַי וַעֲדַת עָרִיצִים בִּקְשׁוּ נַפְשִׁי וְלֹא שָׂמוּךָ לְנֶגְדָּֽם׃","וְאַתָּה אֲדֹנָי אֵל־רַחוּם וְחַנּוּן אֶרֶךְ אַפַּיִם וְרַב־חֶסֶד וֶאֱמֶֽת׃","פְּנֵה אֵלַי וְחׇנֵּנִי תְּנָֽה־עֻזְּךָ לְעַבְדֶּךָ וְהוֹשִׁיעָה לְבֶן־אֲמָתֶֽךָ׃","עֲשֵֽׂה־עִמִּי אוֹת לְטוֹבָה וְיִרְאוּ שֹׂנְאַי וְיֵבֹשׁוּ כִּֽי־אַתָּה יְהֹוָה עֲזַרְתַּנִי וְנִחַמְתָּֽנִי׃ {פ}"],"lat":["tefila ledavid hate-Adonai oznkha aneni ki-ani ve'evyon ani","shomra nafshi ki-chasid ani hosha' avdkha ata elohai haboteach eleikha","choneni adonai ki eleikha ekra kol-hayom","sameach nefesh avdekha ki eleikha adonai nafshi esa","ki-ata adonai tov vesalach verav-chesed lekhol-kor'eikha","ha'azina Adonai tefilati vehakshiva bekol tachanunotai","beiom tsarati ekra'eka ki ta'aneni","ein-kamokha va'elohim adonai ve'ein kema'aseikha","kol-goyim asher asita yavou veyishtachavu lefaneikha adonai vikhabdu lishmekha","ki-gadol ata ve'ose niflaot ata elohim levadekha","horeni Adonai darkekha ahalekh ba'amitekha yached levavi leyir'a shemekha","odkha adonai elohai bekhol-levavi va'akhabda shimkha le'olam","ki-chasdkha gadol alai vehitsalta nafshi mishol tachtiya","elohim zedim kamu-alai va'adat aritsim bikshu nafshi velo samukha lenegdam","ve'ata adonai el-rachum vechanun erekh apayim verav-chesed ve'emet","pene elai vechoneni tena-uzkha le'avdekha vehoshi'a leven-amatekha","ase-imi ot letova veyiru son'ai veyevoshu ki-ata Adonai azartani venichamtani f"],"en":["A Prayer of David. Incline Thine ear, O LORD, and answer me; For I am poor and needy.","Keep my soul, for I am godly; O Thou my God, save Thy servant that trusteth in Thee.","Be gracious unto me, O Lord; For unto Thee do I cry all the day.","Rejoice the soul of Thy servant; For unto Thee, O Lord, do I lift up my soul.","For Thou, Lord, art good, and ready to pardon, And plenteous in mercy unto all them that call upon Thee.","Give ear, O LORD, unto my prayer; And attend unto the voice of my supplications.","In the day of my trouble I call upon Thee; For Thou wilt answer me.","There is none like unto Thee among the gods, O Lord, And there are no works like Thine.","All nations whom Thou hast made shall come and prostrate themselves before Thee, O Lord; And they shall glorify Thy name.","For Thou art great, and doest wondrous things; Thou art God alone.","Teach me, O LORD, Thy way, that I may walk in Thy truth; Make one my heart to fear Thy name. .","I will thank Thee, O Lord my God, with my whole heart; And I will glorify Thy name for evermore.","For great is Thy mercy toward me; And Thou hast delivered my soul from the lowest nether-world.","O God, the proud are risen up against me, And the company of violent men have sought after my soul, And have not set Thee before them.","But Thou, O Lord, art a God full of compassion and gracious, Slow to anger, and plenteous in mercy and truth.","O turn unto me, and be gracious unto me; Give Thy strength unto Thy servant, And save the son of Thy handmaid.","Work in my behalf a sign for good; That they that hate me may see it, and be put to shame, Because Thou, LORD, hast helped me, and comforted me."]},{"n":87,"he":["לִבְנֵי־קֹרַח מִזְמוֹר שִׁיר יְסוּדָתוֹ בְּהַרְרֵי־קֹֽדֶשׁ׃","אֹהֵב יְהֹוָה שַׁעֲרֵי צִיּוֹן מִכֹּל מִשְׁכְּנוֹת יַעֲקֹֽב׃","נִכְבָּדוֹת מְדֻבָּר בָּךְ עִיר הָאֱלֹהִים סֶֽלָה׃","אַזְכִּיר רַהַב וּבָבֶל לְֽיֹדְעָי הִנֵּה פְלֶשֶׁת וְצֹר עִם־כּוּשׁ זֶה יֻלַּד־שָֽׁם׃","וּלְצִיּוֹן יֵאָמַר אִישׁ וְאִישׁ יֻלַּד־בָּהּ וְהוּא יְכוֹנְנֶהָ עֶלְיֽוֹן׃","יְֽהֹוָה יִסְפֹּר בִּכְתוֹב עַמִּים זֶה יֻלַּד־שָׁם סֶֽלָה׃","וְשָׁרִים כְּחֹלְלִים כׇּֽל־מַעְיָנַי בָּֽךְ׃ {פ}"],"lat":["livnei-korach mizmor shir yesudato beharerei-kodesh","ohev Adonai sha'arei tsiyon mikol mishknot ya'akov","nikhbadot medubar bakh ir ha'elohim sela","azkir rahav uvavel leyod'ai hine feleshet vetsor im-kush ze yulad-sham","ultsiyon ye'amar ish ve'ish yulad-bah vehu yekhoneneah elyon","Adonai yispor bikhtov amim ze yulad-sham sela","vesharim kecholelim kol-ma'yanai bakh f"],"en":["A Psalm of the sons of Korah; a Song. His foundation is in the holy mountains.","The LORD loveth the gates of Zion more than all the dwellings of Jacob.","Glorious things are spoken of Thee, O city of God. Selah","'I will make mention of Rahab and Babylon as among them that know Me; behold Philistia, and Tyre, with Ethiopia; this one was born there.'","But of Zion it shall be said: 'This man and that was born in her; And the Most High Himself doth establish her.'","The LORD shall count in the register of the peoples: 'This one was born there.' Selah","And whether they sing or dance, all my thoughts are in Thee."]},{"n":88,"he":["שִׁיר מִזְמוֹר לִבְנֵי־קֹרַח לַמְנַצֵּחַ עַל־מָחֲלַת לְעַנּוֹת מַשְׂכִּיל לְהֵימָן הָאֶזְרָחִֽי׃","יְהֹוָה אֱלֹהֵי יְשׁוּעָתִי יוֹם־צָעַקְתִּי בַלַּיְלָה נֶגְדֶּֽךָ׃","תָּבוֹא לְפָנֶיךָ תְּפִלָּתִי הַטֵּה אׇזְנְךָ לְרִנָּתִֽי׃","כִּֽי־שָׂבְעָה בְרָעוֹת נַפְשִׁי וְחַיַּי לִשְׁאוֹל הִגִּֽיעוּ׃","נֶחְשַׁבְתִּי עִם־יוֹרְדֵי בוֹר הָיִיתִי כְּגֶבֶר אֵֽין־אֱיָֽל׃","בַּמֵּתִים חׇפְשִׁי כְּמוֹ חֲלָלִים שֹׁכְבֵי קֶבֶר אֲשֶׁר לֹא זְכַרְתָּם עוֹד וְהֵמָּה מִיָּדְךָ נִגְזָֽרוּ׃","שַׁתַּנִי בְּבוֹר תַּחְתִּיּוֹת בְּמַחֲשַׁכִּים בִּמְצֹלֽוֹת׃","עָלַי סָמְכָה חֲמָתֶךָ וְכׇל־מִשְׁבָּרֶיךָ עִנִּיתָ סֶּֽלָה׃","הִרְחַקְתָּ מְיֻדָּעַי מִמֶּנִּי שַׁתַּנִי תוֹעֵבוֹת לָמוֹ כָּלֻא וְלֹא אֵצֵֽא׃","עֵינִי דָאֲבָה מִנִּי־עֹנִי קְרָאתִיךָ יְהֹוָה בְּכׇל־יוֹם שִׁטַּחְתִּי אֵלֶיךָ כַפָּֽי׃","הֲלַמֵּתִים תַּעֲשֶׂה־פֶּלֶא אִם־רְפָאִים יָקוּמוּ יוֹדוּךָ סֶּֽלָה׃","הַיְסֻפַּר בַּקֶּבֶר חַסְדֶּךָ אֱמוּנָתְךָ בָּאֲבַדּֽוֹן׃","הֲיִוָּדַע בַּחֹשֶׁךְ פִּלְאֶךָ וְצִדְקָתְךָ בְּאֶרֶץ נְשִׁיָּֽה׃","וַאֲנִי אֵלֶיךָ יְהֹוָה שִׁוַּעְתִּי וּבַבֹּקֶר תְּֽפִלָּתִי תְקַדְּמֶֽךָּ׃","לָמָה יְהֹוָה תִּזְנַח נַפְשִׁי תַּסְתִּיר פָּנֶיךָ מִמֶּֽנִּי׃","עָנִי אֲנִי וְגֹוֵעַ מִנֹּעַר נָשָׂאתִי אֵמֶיךָ אָפֽוּנָה׃","עָלַי עָבְרוּ חֲרוֹנֶיךָ בִּעוּתֶיךָ צִמְּתוּתֻֽנִי׃","סַבּוּנִי כַמַּיִם כׇּל־הַיּוֹם הִקִּיפוּ עָלַי יָֽחַד׃","הִרְחַקְתָּ מִמֶּנִּי אֹהֵב וָרֵעַ מְֽיֻדָּעַי מַחְשָֽׁךְ׃ {פ}"],"lat":["shir mizmor livnei-korach lamnatseach al-machalat le'anot maskil leheiman ha'ezrachi","Adonai elohei yeshu'ati yom-tsa'akti valayla negdekha","tavo lefaneikha tefilati hate oznkha lerinati","ki-sav'a vera'ot nafshi vechayai lishol higi'u","nechshavti im-yordei vor hayiti kegever ein-eyal","bametim chofshi kemo chalalim shokhvei kever asher lo zekhartam od vehema miyadkha nigzaru","shatani bevor tachtiyot bemachashakim bimtsolot","alai samkha chamatekha vekhol-mishbareikha inita sela","hirchakta meyuda'ai mimeni shatani to'evot lamo kalu velo etse","eini da'ava mini-oni keratikha Adonai bekhol-yom shitachti eleikha khapai","halametim ta'ase-pele im-refa'im yakumu yodukha sela","haysupar bakever chasdekha emunatkha ba'avadon","hayivada' bachoshekh pil'ekha vetsidkatkha be'erets neshiya","va'ani eleikha Adonai shiva'ti uvaboker tefilati tekadmeka","lama Adonai tiznach nafshi tastir paneikha mimeni","ani ani vegovea' mino'ar nasati emeikha afuna","alai avru charoneikha bi'uteikha tsimtutuni","sabuni khamayim kol-hayom hikifu alai yachad","hirchakta mimeni ohev varea' meyuda'ai machshakh f"],"en":["A Song, a Psalm of the sons of Korah; for the Leader; upon Mahalath Leannoth. Maschil of Heman the Ezrahite.","O LORD, God of my salvation, What time I cry in the night before Thee,","Let my prayer come before Thee, Incline Thine ear unto my cry.","For my soul is sated with troubles, And my life draweth nigh unto the grave.","I am counted with them that go down into the pit; I am become as a man that hath no help;","Set apart among the dead, Like the slain that lie in the grave, Whom Thou rememberest no more; And they are cut off from Thy hand. .","Thou hast laid me in the nether-most pit, In dark places, in the deeps.","Thy wrath lieth hard upon me, And all Thy waves Thou pressest down. Selah","Thou hast put mine acquaintance far from me; Thou hast made me an abomination unto them; I am shut up, and I cannot come forth.","Mine eye languisheth by reason of affliction; I have called upon Thee, O LORD, every day, I have spread forth my hands unto Thee.","Wilt Thou work wonders for the dead? Or shall the shades arise and give Thee thanks? Selah","Shall Thy mercy be declared in the grave? Or Thy faithfulness in destruction?","Shall Thy wonders be known in the dark? And Thy righteousness in the land of forgetfulness?","But as for me, unto Thee, O LORD, do I cry, And in the morning doth my prayer come to meet Thee.","LORD, why castest Thou off my soul? Why hidest Thou Thy face from me?","I am afflicted and at the point of death from my youth up; I have borne Thy terrors, I am distracted.","Thy fierce wrath is gone over me; Thy terrors have cut me off.","They came round about me like water all the day; They compassed me about together.","Friend and companion hast Thou put far from me, And mine acquaintance into darkness."]},{"n":89,"he":["מַשְׂכִּיל לְאֵיתָן הָאֶזְרָחִֽי׃","חַֽסְדֵי יְהֹוָה עוֹלָם אָשִׁירָה לְדֹר וָדֹר אוֹדִיעַ אֱמוּנָתְךָ בְּפִֽי׃","כִּֽי־אָמַרְתִּי עוֹלָם חֶסֶד יִבָּנֶה שָׁמַיִם תָּכִן אֱמוּנָתְךָ בָהֶֽם׃","כָּרַתִּי בְרִית לִבְחִירִי נִשְׁבַּעְתִּי לְדָוִד עַבְדִּֽי׃","עַד־עוֹלָם אָכִין זַרְעֶךָ וּבָנִיתִי לְדֹר־וָדוֹר כִּסְאֲךָ סֶֽלָה׃","וְיוֹדוּ שָׁמַיִם פִּלְאֲךָ יְהֹוָה אַף־אֱמוּנָתְךָ בִּקְהַל קְדֹשִֽׁים׃","כִּי מִי בַשַּׁחַק יַעֲרֹךְ לַיהֹוָה יִדְמֶה לַיהֹוָה בִּבְנֵי אֵלִֽים׃","אֵל נַעֲרָץ בְּסוֹד־קְדֹשִׁים רַבָּה וְנוֹרָא עַל־כׇּל־סְבִיבָֽיו׃","יְהֹוָה אֱלֹהֵי צְבָאוֹת מִי־כָמוֹךָֽ חֲסִין יָהּ וֶאֱמוּנָתְךָ סְבִיבוֹתֶֽיךָ׃","אַתָּה מוֹשֵׁל בְּגֵאוּת הַיָּם בְּשׂוֹא גַלָּיו אַתָּה תְשַׁבְּחֵֽם׃","אַתָּה דִכִּאתָ כֶחָלָל רָהַב בִּזְרוֹעַ עֻזְּךָ פִּזַּרְתָּ אוֹיְבֶֽיךָ׃","לְךָ שָׁמַיִם אַף־לְךָ אָרֶץ תֵּבֵל וּמְלֹאָהּ אַתָּה יְסַדְתָּֽם׃","צָפוֹן וְיָמִין אַתָּה בְרָאתָם תָּבוֹר וְחֶרְמוֹן בְּשִׁמְךָ יְרַנֵּֽנוּ׃","לְךָ זְרוֹעַ עִם־גְּבוּרָה תָּעֹז יָדְךָ תָּרוּם יְמִינֶֽךָ׃","צֶדֶק וּמִשְׁפָּט מְכוֹן כִּסְאֶךָ חֶסֶד וֶאֱמֶת יְֽקַדְּמוּ פָנֶֽיךָ׃","אַשְׁרֵי הָעָם יֹדְעֵי תְרוּעָה יְהֹוָה בְּֽאוֹר־פָּנֶיךָ יְהַלֵּכֽוּן׃","בְּשִׁמְךָ יְגִילוּן כׇּל־הַיּוֹם וּבְצִדְקָתְךָ יָרֽוּמוּ׃","כִּי־תִפְאֶרֶת עֻזָּמוֹ אָתָּה וּבִרְצוֹנְךָ (תרים) [תָּרוּם] קַרְנֵֽינוּ׃","כִּי לַיהֹוָה מָגִנֵּנוּ וְלִקְדוֹשׁ יִשְׂרָאֵל מַלְכֵּֽנוּ׃","אָז דִּבַּרְתָּֽ־בְחָזוֹן לַחֲסִידֶיךָ וַתֹּאמֶר שִׁוִּיתִי עֵזֶר עַל־גִּבּוֹר הֲרִימוֹתִי בָחוּר מֵעָֽם׃","מָצָאתִי דָּוִד עַבְדִּי בְּשֶׁמֶן קׇדְשִׁי מְשַׁחְתִּֽיו׃","אֲשֶׁר יָדִי תִּכּוֹן עִמּוֹ אַף־זְרוֹעִי תְאַמְּצֶֽנּוּ׃","לֹא־יַשִּׁיא אוֹיֵב בּוֹ וּבֶן־עַוְלָה לֹא יְעַנֶּֽנּוּ׃","וְכַתּוֹתִי מִפָּנָיו צָרָיו וּמְשַׂנְאָיו אֶגּֽוֹף׃","וֶאֱֽמוּנָתִי וְחַסְדִּי עִמּוֹ וּבִשְׁמִי תָּרוּם קַרְנֽוֹ׃","וְשַׂמְתִּי בַיָּם יָדוֹ וּֽבַנְּהָרוֹת יְמִינֽוֹ׃","הוּא יִקְרָאֵנִי אָבִי אָתָּה אֵלִי וְצוּר יְשׁוּעָתִֽי׃","אַף־אָנִי בְּכוֹר אֶתְּנֵהוּ עֶלְיוֹן לְמַלְכֵי־אָֽרֶץ׃","לְעוֹלָם (אשמור) [אֶשְׁמׇר־]לוֹ חַסְדִּי וּבְרִיתִי נֶאֱמֶנֶת לֽוֹ׃","וְשַׂמְתִּי לָעַד זַרְעוֹ וְכִסְאוֹ כִּימֵי שָׁמָֽיִם׃","אִם־יַעַזְבוּ בָנָיו תּוֹרָתִי וּבְמִשְׁפָּטַי לֹא יֵלֵכֽוּן׃","אִם־חֻקֹּתַי יְחַלֵּלוּ וּמִצְוֺתַי לֹא יִשְׁמֹֽרוּ׃","וּפָקַדְתִּי בְשֵׁבֶט פִּשְׁעָם וּבִנְגָעִים עֲוֺנָֽם׃","וְחַסְדִּי לֹא־אָפִיר מֵעִמּוֹ וְלֹֽא־אֲשַׁקֵּר בֶּאֱמוּנָתִֽי׃","לֹֽא־אֲחַלֵּל בְּרִיתִי וּמוֹצָא שְׂפָתַי לֹא אֲשַׁנֶּֽה׃","אַחַת נִשְׁבַּעְתִּי בְקׇדְשִׁי אִֽם־לְדָוִד אֲכַזֵּֽב׃","זַרְעוֹ לְעוֹלָם יִהְיֶה וְכִסְאוֹ כַשֶּׁמֶשׁ נֶגְדִּֽי׃","כְּיָרֵחַ יִכּוֹן עוֹלָם וְעֵד בַּשַּׁחַק נֶאֱמָן סֶֽלָה׃","וְאַתָּה זָנַחְתָּ וַתִּמְאָס הִתְעַבַּרְתָּ עִם־מְשִׁיחֶֽךָ׃","נֵאַרְתָּה בְּרִית עַבְדֶּךָ חִלַּלְתָּ לָאָרֶץ נִזְרֽוֹ׃","פָּרַצְתָּ כׇל־גְּדֵרֹתָיו שַׂמְתָּ מִבְצָרָיו מְחִתָּֽה׃","שַׁסֻּהוּ כׇּל־עֹבְרֵי דָרֶךְ הָיָה חֶרְפָּה לִשְׁכֵנָֽיו׃","הֲרִימוֹתָ יְמִין צָרָיו הִשְׂמַחְתָּ כׇּל־אוֹיְבָֽיו׃","אַף־תָּשִׁיב צוּר חַרְבּוֹ וְלֹא הֲקֵימֹתוֹ בַּמִּלְחָמָֽה׃","הִשְׁבַּתָּ מִטְּהָרוֹ וְכִסְאוֹ לָאָרֶץ מִגַּֽרְתָּה׃","הִקְצַרְתָּ יְמֵי עֲלוּמָיו הֶעֱטִיתָ עָלָיו בּוּשָׁה סֶֽלָה׃","עַד־מָה יְהֹוָה תִּסָּתֵר לָנֶצַח תִּבְעַר כְּמוֹ־אֵשׁ חֲמָתֶֽךָ׃","זְכׇר־אֲנִי מֶה־חָלֶד עַל־מַה־שָּׁוְא בָּרָאתָ כׇל־בְּנֵֽי־אָדָֽם׃","מִי גֶבֶר יִֽחְיֶה וְלֹא יִרְאֶה־מָּוֶת יְמַלֵּט נַפְשׁוֹ מִיַּד־שְׁאוֹל סֶֽלָה׃","אַיֵּה חֲסָדֶיךָ הָרִאשֹׁנִים אֲדֹנָי נִשְׁבַּעְתָּ לְדָוִד בֶּאֱמוּנָתֶֽךָ׃","זְכֹר אֲדֹנָי חֶרְפַּת עֲבָדֶיךָ שְׂאֵתִי בְחֵיקִי כׇּל־רַבִּים עַמִּֽים׃","אֲשֶׁר חֵרְפוּ אוֹיְבֶיךָ יְהֹוָה אֲשֶׁר חֵרְפוּ עִקְּבוֹת מְשִׁיחֶֽךָ׃","בָּרוּךְ יְהֹוָה לְעוֹלָם אָמֵן וְאָמֵֽן׃"],"lat":["maskil le'eitan ha'ezrachi","chasdei Adonai olam ashira ledor vador odia' emunatkha befi","ki-amarti olam chesed yibane shamayim takhin emunatkha vahem","karati verit livchiri nishba'ti ledavid avdi","ad-olam akhin zar'ekha uvaniti ledor-vador kis'akha sela","veiodu shamayim pil'akha Adonai af-emunatkha bikhal kedoshim","ki mi vashachak ya'arokh laihova yidme laihova bivnei elim","el na'arats besod-kedoshim raba venora al-kol-sevivaiv","Adonai elohei tsevaot mi-khamokha chasin yah ve'emunatkha sevivoteikha","ata moshel begeut hayam beso galaiv ata teshabchem","ata dikita khechalal rahav bizroa' uzkha pizarta oyveikha","lekha shamayim af-lekha arets tevel umlo'ah ata yesadtam","tsafon veyamin ata veratam tavor vechermon beshimkha yeranenu","lekha zeroa' im-gevura ta'oz yadkha tarum yeminekha","tsedek umishpat mekhon kis'ekha chesed ve'emet yekadmu faneikha","ashrei ha'am yod'ei teru'a Adonai beor-paneikha yehalekhun","beshimkha yegilun kol-hayom uvtsidkatkha yarumu","ki-tif'eret uzamo ata uvirtsonkha trym tarum karneinu","ki laihova maginenu velikdosh yisra'el malkenu","az dibarta-vechazon lachasideikha vatomer shiviti ezer al-gibor harimoti vachur me'am","matsati david avdi beshemen kodshi meshachtiv","asher yadi tikon imo af-zero'i te'amtsenu","lo-yashi oyev bo uven-avla lo ye'anenu","vekhatoti mipanaiv tsaraiv umsan'aiv egof","ve'emunati vechasdi imo uvishmi tarum karno","vesamti vayam yado uvanharot yemino","hu yikra'eni avi ata eli vetsur yeshu'ati","af-ani bekhor etnehu elyon lemalkhei-arets","le'olam shmvr 'eshmor-lo chasdi uvriti ne'emenet lo","vesamti la'ad zar'o vekhiso kimei shamayim","im-ya'azvu vanaiv torati uvmishpatai lo yelekhun","im-chukotai yechalelu umitsotai lo yishmoru","ufakadti veshevet pish'am uvinga'im aonam","vechasdi lo-afir me'imo velo-ashaker be'emunati","lo-achalel beriti umotsa sefatai lo ashane","achat nishba'ti vekodshi im-ledavid akhazev","zar'o le'olam yihye vekhiso khashemesh negdi","keyareach yikon olam ve'ed bashachak ne'eman sela","ve'ata zanachta vatim'as hit'abarta im-meshichekha","ne'arta berit avdekha chilalta la'arets nizro","paratsta khol-gederotaiv samta mivtsaraiv mechita","shasuhu kol-ovrei darekh haya cherpa lishkhenaiv","harimota yemin tsaraiv hismachta kol-oyvaiv","af-tashiv tsur charbo velo hakeimoto bamilchama","hishbata mitharo vekhiso la'arets migarta","hiktsarta yemei alumaiv he'etita alaiv busha sela","ad-ma Adonai tisater lanetsach tiv'ar kemo-esh chamatekha","zekhor-ani me-chaled al-ma-shav barata khol-benei-adam","mi gever yichye velo yir'e-mavet yemalet nafsho miyad-sheol sela","aye chasadeikha harishonim adonai nishba'ta ledavid be'emunatekha","zekhor adonai cherpat avadeikha se'eti vecheiki kol-rabim amim","asher cherfu oyveikha Adonai asher cherfu ikvot meshichekha","barukh Adonai le'olam amen ve'amen"],"en":["Maschil of Ethan the Ezrahite.","I will sing of the mercies of the LORD for ever; To all generations will I make known Thy faithfulness with my mouth.","For I have said: 'For ever is mercy built; In the very heavens Thou dost establish Thy faithfulness.","I have made a covenant with My chosen, I have sworn unto David My servant:","For ever will I establish thy seed, And build up thy throne to all generations.' Selah","So shall the heavens praise Thy wonders, O LORD, Thy faithfulness also in the assembly of the holy ones.","For who in the skies can be compared unto the LORD, Who among the sons of might can be likened unto the LORD,","A God dreaded in the great council of the holy ones, And feared of all them that are about Him?","O LORD God of hosts, Who is a mighty one, like unto Thee, O LORD? And Thy faithfulness is round about Thee.","Thou rulest the proud swelling of the sea; When the waves thereof arise, Thou stillest them.","Thou didst crush Rahab, as one that is slain; Thou didst scattered Thine enemies with the arm of Thy strength.","Thine are the heavens, Thine also the earth; The world and the fulness thereof, Thou hast founded them.","The north and the south, Thou hast created them; Tabor and Hermon rejoice in Thy name.","Thine is an arm with might; Strong is Thy hand, and exalted is Thy right hand.","Righteousness and justice are the foundation of Thy throne; Mercy and truth go before Thee.","Happy is the people that know the joyful shout; They walk, O LORD, in the light of Thy countenance.","In Thy name do they rejoice all the day; And through Thy righteousness are they exalted.","For Thou art the glory of their strength; And in Thy favour our horn is exalted.","For of the LORD is our shield; And the Holy One of Israel is our king.","Then Thou spokest in vision to Thy godly ones, And saidst: 'I have laid help upon one that is mighty; I have exalted one chosen out of the people.","I have found David My servant; With My holy oil have I anointed him;","With whom My hand shall be established; Mine arm also shall strengthen him.","The enemy shall not exact from him; Nor the son of wickedness afflict him.","And I will beat to pieces his adversaries before him, And smite them that hate him.","But My faithfulness and My mercy shall be with him; And through My name shall his horn be exalted.","I will set his hand also on the sea, And his right hand on the rivers.","He shall call unto Me: Thou art my Father, My God, and the rock of my salvation. .","I also will appoint him first-born, The highest of the kings of the earth.","For ever will I keep for him My mercy, And My covenant shall stand fast with him.","His seed also will I make to endure for ever, And his throne as the days of heaven.","If his children forsake My law, And walk not in Mine ordinances; :","If they profane My statutes, And keep not My commandments;","Then will I visit their transgression with the rod, And their iniquity with strokes.","But My mercy will I not break off from him, Nor will I be false to My faithfulness.","My covenant will I not profane, Nor alter that which is gone out of My lips.","Once have I sworn by My holiness: Surely I will not be false unto David;","His seed shall endure for ever, And his throne as the sun before Me.","It shall be established for ever as the moon; And be stedfast as the witness in sky.' Selah","But Thou hast cast off and rejected, Thou hast been wroth with Thine anointed.","Thou hast abhorred the covenant of Thy servant; Thou hast profaned his crown even to the ground.","Thou hast broken down all his fences; Thou hast brought his strongholds to ruin.","All that pass by the way spoil him; He is become a taunt to his neighbours.","Thou hast exalted the right hand of his adversaries; Thou hast made all his enemies to rejoice.","Yea, Thou turnest back the edge of his sword, And hast not made him to stand in the battle.","Thou hast made his brightness to cease, And cast his throne down to the ground.","The days of his youth hast Thou shortened; Thou hast covered him with shame. Selah","How long, O LORD, wilt Thou hide Thyself for ever? How long shall Thy wrath burn like fire?","O remember how short my time is; For what vanity hast Thou created all the children of men!","What man is he that liveth and shall not see death, That shall deliver his soul from the power of the grave? Selah","Where are Thy former mercies, O Lord, Which Thou didst swear unto David in Thy faithfulness?","Remember, Lord, the taunt of Thy servants; How I do bear in my bosom [the taunt of] so many peoples;","Wherewith Thine enemies have taunted, O LORD, Wherewith they have taunted the footsteps of Thine anointed.","Blessed be the LORD for evermore. Amen, and Amen."]},{"n":90,"he":["תְּפִלָּה לְמֹשֶׁה אִֽישׁ־הָאֱלֹהִים אֲֽדֹנָי מָעוֹן אַתָּה הָיִיתָ לָּנוּ בְּדֹר וָדֹֽר׃","בְּטֶרֶם הָרִים יֻלָּדוּ וַתְּחוֹלֵֽל אֶרֶץ וְתֵבֵל וּֽמֵעוֹלָם עַד־עוֹלָם אַתָּה אֵֽל׃","תָּשֵׁב אֱנוֹשׁ עַד־דַּכָּא וַתֹּאמֶר שׁוּבוּ בְנֵֽי־אָדָֽם׃","כִּי אֶלֶף שָׁנִים בְּֽעֵינֶיךָ כְּיוֹם אֶתְמוֹל כִּי יַעֲבֹר וְאַשְׁמוּרָה בַלָּֽיְלָה׃","זְרַמְתָּם שֵׁנָה יִהְיוּ בַּבֹּקֶר כֶּחָצִיר יַחֲלֹֽף׃","בַּבֹּקֶר יָצִיץ וְחָלָף לָעֶרֶב יְמוֹלֵל וְיָבֵֽשׁ׃","כִּי־כָלִינוּ בְאַפֶּךָ וּֽבַחֲמָתְךָ נִבְהָֽלְנוּ׃","שַׁתָּ עֲוֺנֹתֵינוּ לְנֶגְדֶּךָ עֲלֻמֵנוּ לִמְאוֹר פָּנֶֽיךָ׃","כִּי כׇל־יָמֵינוּ פָּנוּ בְעֶבְרָתֶךָ כִּלִּינוּ שָׁנֵינוּ כְמוֹ־הֶֽגֶה׃","יְמֵֽי־שְׁנוֹתֵינוּ בָהֶם שִׁבְעִים שָׁנָה וְאִם בִּגְבוּרֹת שְׁמוֹנִים שָׁנָה וְרׇהְבָּם עָמָל וָאָוֶן כִּי־גָז חִישׁ וַנָּעֻֽפָה׃","מִֽי־יוֹדֵעַ עֹז אַפֶּךָ וּכְיִרְאָתְךָ עֶבְרָתֶֽךָ׃","לִמְנוֹת יָמֵינוּ כֵּן הוֹדַע וְנָבִא לְבַב חׇכְמָֽה׃","שׁוּבָה יְהֹוָה עַד־מָתָי וְהִנָּחֵם עַל־עֲבָדֶֽיךָ׃","שַׂבְּעֵנוּ בַבֹּקֶר חַסְדֶּךָ וּֽנְרַנְּנָה וְנִשְׂמְחָה בְּכׇל־יָמֵֽינוּ׃","שַׂמְּחֵנוּ כִּימוֹת עִנִּיתָנוּ שְׁנוֹת רָאִינוּ רָעָֽה׃","יֵרָאֶה אֶל־עֲבָדֶיךָ פׇעֳלֶךָ וַהֲדָרְךָ עַל־בְּנֵיהֶֽם׃","וִיהִי נֹעַם אֲדֹנָי אֱלֹהֵינוּ עָלֵינוּ וּמַעֲשֵׂה יָדֵינוּ כּוֹנְנָה עָלֵינוּ וּֽמַעֲשֵׂה יָדֵינוּ כּוֹנְנֵֽהוּ׃ {פ}"],"lat":["tefila lemoshe ish-ha'elohim adonai ma'on ata hayita lanu bedor vador","beterem harim yuladu vatcholel erets vetevel ume'olam ad-olam ata el","tashev enosh ad-daka vatomer shuvu venei-adam","ki elef shanim be'eineikha keiom etmol ki ya'avor ve'ashmura valayla","zeramtam shena yihyu baboker kechatsir yachalof","baboker yatsits vechalaf la'erev yemolel veyavesh","ki-khalinu ve'apekha uvachamatkha nivhalnu","shata aonoteinu lenegdekha alumenu limor paneikha","ki khol-yameinu panu ve'evratekha kilinu shaneinu khemo-hege","yemei-shenoteinu vahem shiv'im shana ve'im bigvurot shemonim shana verohbam amal va'aven ki-gaz chish vana'ufa","mi-yodea' oz apekha ukhyir'atkha evratekha","limnot yameinu ken hoda' venavi levav chokhma","shuva Adonai ad-matai vehinachem al-avadeikha","sab'enu vaboker chasdekha unranena venismcha bekhol-yameinu","samchenu kimot initanu shenot ra'inu ra'a","yera'e el-avadeikha fo'olekha vahadarkha al-beneihem","vihi no'am adonai eloheinu aleinu uma'ase yadeinu konena aleinu uma'ase yadeinu konenehu f"],"en":["A Prayer of Moses the man of God. Lord, Thou hast been our dwelling-place in all generations.","Before the mountains were brought forth, Or ever Thou hadst formed the earth and the world, Even from everlasting to everlasting, Thou art God.","Thou turnest man to contrition; And sayest: 'Return, ye children of men.'","For a thousand years in Thy sight Are but as yesterday when it is past, And as a watch in the night.","Thou carriest them away as with a flood; they are as a sleep; In the morning they are like grass which groweth up.","In the morning it flourisheth, and groweth up; In the evening it is cut down, and withereth.","For we are consumed in Thine anger, And by Thy wrath are we hurried away.","Thou hast set our iniquities before Thee, Our secret sins in the light of Thy countenance.","For all our days are passed away in Thy wrath; We bring our years to an end as a tale that is told.","The days of our years are threescore years and ten, Or even by reason of strength fourscore years; Yet is their pride but travail and vanity; For it is speedily gone, and we fly away.","Who knoweth the power of Thine anger, And Thy wrath according to the fear that is due unto Thee?","So teach us to number our days, That we may get us a heart of wisdom.","Return, O LORD; how long? And let it repent Thee concerning Thy servants.","O satisfy us in the morning with Thy mercy; That we may rejoice and be glad all our days.","Make us glad according to the days wherein Thou hast afflicted us, According to the years wherein we have seen evil.","Let Thy work appear unto Thy servants, And Thy glory upon their children.","And let the graciousness of the Lord our God be upon us; Establish Thou also upon us the work of our hands; Yea, the work of our hands establish Thou it."]},{"n":91,"he":["יֹשֵׁב בְּסֵתֶר עֶלְיוֹן בְּצֵל שַׁדַּי יִתְלוֹנָֽן׃","אֹמַר לַיהֹוָה מַחְסִי וּמְצוּדָתִי אֱלֹהַי אֶבְטַח־בּֽוֹ׃","כִּי הוּא יַצִּילְךָ מִפַּח יָקוּשׁ מִדֶּבֶר הַוּֽוֹת׃","בְּאֶבְרָתוֹ יָסֶךְ לָךְ וְתַחַת־כְּנָפָיו תֶּחְסֶה צִנָּה וְסֹחֵרָה אֲמִתּֽוֹ׃","לֹֽא־תִירָא מִפַּחַד לָיְלָה מֵחֵץ יָעוּף יוֹמָֽם׃","מִדֶּבֶר בָּאֹפֶל יַהֲלֹךְ מִקֶּטֶב יָשׁוּד צׇהֳרָֽיִם׃","יִפֹּל מִצִּדְּךָ אֶלֶף וּרְבָבָה מִימִינֶךָ אֵלֶיךָ לֹא יִגָּֽשׁ׃","רַק בְּעֵינֶיךָ תַבִּיט וְשִׁלֻּמַת רְשָׁעִים תִּרְאֶֽה׃","כִּֽי־אַתָּה יְהֹוָה מַחְסִי עֶלְיוֹן שַׂמְתָּ מְעוֹנֶֽךָ׃","לֹא־תְאֻנֶּה אֵלֶיךָ רָעָה וְנֶגַע לֹא־יִקְרַב בְּאׇהֳלֶֽךָ׃","כִּי מַלְאָכָיו יְצַוֶּה־לָּךְ לִשְׁמׇרְךָ בְּכׇל־דְּרָכֶֽיךָ׃","עַל־כַּפַּיִם יִשָּׂאוּנְךָ פֶּן־תִּגֹּף בָּאֶבֶן רַגְלֶֽךָ׃","עַל־שַׁחַל וָפֶתֶן תִּדְרֹךְ תִּרְמֹס כְּפִיר וְתַנִּֽין׃","כִּי בִי חָשַׁק וַאֲפַלְּטֵהוּ אֲשַׂגְּבֵהוּ כִּֽי־יָדַע שְׁמִֽי׃","יִקְרָאֵנִי וְֽאֶעֱנֵהוּ עִמּֽוֹ־אָנֹכִי בְצָרָה אֲחַלְּצֵהוּ וַאֲכַבְּדֵֽהוּ׃","אֹרֶךְ יָמִים אַשְׂבִּיעֵהוּ וְאַרְאֵהוּ בִּישׁוּעָתִֽי׃ {פ}"],"lat":["yoshev beseter elyon betsel shadai yitlonan","omar laihova machsi umtsudati elohai evtach-bo","ki hu yatsilkha mipach yakush midever hauot","be'evrato yasekh lakh vetachat-kenafaiv techse tsina vesochera amito","lo-tira mipachad layla mechets ya'uf yomam","midever ba'ofel yahalokh miketev yashud tsohorayim","yipol mitsidkha elef urvava miminekha eleikha lo yigash","rak be'eineikha tabit veshilumat resha'im tir'e","ki-ata Adonai machsi elyon samta me'onekha","lo-te'une eleikha ra'a venega' lo-yikrav be'oholekha","ki mal'akhaiv yetsave-lakh lishmorkha bekhol-derakheikha","al-kapayim yisaunkha pen-tigof ba'even raglekha","al-shachal vafeten tidrokh tirmos kefir vetanin","ki vi chashak va'afaltehu asagvehu ki-yada' shemi","yikra'eni ve'e'enehu imo-anokhi vetsara achaltsehu va'akhabdehu","orekh yamim asbi'ehu ve'ar'ehu bishu'ati f"],"en":["O thou that dwellest in the covert of the Most High, And abidest in the shadow of the Almighty;","I will say of the LORD, who is my refuge and my fortress, My God, in whom I trust,","That He will deliver thee from the snare of the fowler, And from the noisome pestilence.","He will cover thee with His pinions, And under His wings shalt thou take refuge; His truth is a shield and a buckler.","Thou shalt not be afraid of the terror by night, Nor of the arrow that flieth by day;","Of the pestilence that walketh in darkness, Nor of the destruction that wasteth at noonday.","A thousand may fall at Thy side, And ten thousand at Thy right hand; It shall not come nigh thee.","Only with thine eyes shalt thou behold, And see the recompense of the wicked.","For thou hast made the LORD who is my refuge, Even the Most High, thy habitation.","There shall no evil befall thee, Neither shall any plague come nigh thy tent.","For He will give His angels charge over thee, To keep thee in all thy ways.","They shall bear thee upon their hands, Lest thou dash thy foot against a stone.","Thou shalt tread upon the lion and asp; The young lion and the serpent shalt thou trample under feet.","'Because he hath set his love upon Me, therefore will I deliver him; I will set him on high, because he hath known My name.","He shall call upon Me, and I will answer him; I will be with him in trouble; I will rescue him, and bring him to honour.","With long life will I satisfy him, And make Him to behold My salvation.'"]},{"n":92,"he":["מִזְמוֹר שִׁיר לְיוֹם הַשַּׁבָּֽת׃","טוֹב לְהֹדוֹת לַיהֹוָה וּלְזַמֵּר לְשִׁמְךָ עֶלְיֽוֹן׃","לְהַגִּיד בַּבֹּקֶר חַסְדֶּךָ וֶאֱמוּנָתְךָ בַּלֵּילֽוֹת׃","עֲֽלֵי־עָשׂוֹר וַעֲלֵי־נָבֶל עֲלֵי הִגָּיוֹן בְּכִנּֽוֹר׃","כִּי שִׂמַּחְתַּנִי יְהֹוָה בְּפׇעֳלֶךָ בְּֽמַעֲשֵׂי יָדֶיךָ אֲרַנֵּֽן׃","מַה־גָּדְלוּ מַעֲשֶׂיךָ יְהֹוָה מְאֹד עָמְקוּ מַחְשְׁבֹתֶֽיךָ׃","אִֽישׁ־בַּעַר לֹא יֵדָע וּכְסִיל לֹא־יָבִין אֶת־זֹֽאת׃","בִּפְרֹחַ רְשָׁעִים כְּמוֹ־עֵשֶׂב וַיָּצִיצוּ כׇּל־פֹּעֲלֵי אָוֶן לְהִשָּׁמְדָם עֲדֵי־עַֽד׃","וְאַתָּה מָרוֹם לְעֹלָם יְהֹוָֽה׃","כִּי הִנֵּה אֹיְבֶיךָ יְֽהֹוָה כִּֽי־הִנֵּה אֹיְבֶיךָ יֹאבֵדוּ יִתְפָּרְדוּ כׇּל־פֹּעֲלֵי אָֽוֶן׃","וַתָּרֶם כִּרְאֵים קַרְנִי בַּלֹּתִי בְּשֶׁמֶן רַעֲנָֽן׃","וַתַּבֵּט עֵינִי בְּשׁוּרָי בַּקָּמִים עָלַי מְרֵעִים תִּשְׁמַעְנָה אׇזְנָֽי׃","צַדִּיק כַּתָּמָר יִפְרָח כְּאֶרֶז בַּלְּבָנוֹן יִשְׂגֶּֽה׃","שְׁתוּלִים בְּבֵית יְהֹוָה בְּחַצְרוֹת אֱלֹהֵינוּ יַפְרִֽיחוּ׃","עוֹד יְנוּבוּן בְּשֵׂיבָה דְּשֵׁנִים וְֽרַעֲנַנִּים יִהְיֽוּ׃","לְהַגִּיד כִּֽי־יָשָׁר יְהֹוָה צוּרִי וְֽלֹא־[עַוְלָתָה] (עלתה) בּֽוֹ׃ {פ}"],"lat":["mizmor shir leiom hashabat","tov lehodot laihova ulzamer leshimkha elyon","lehagid baboker chasdekha ve'emunatkha baleilot","alei-asor va'alei-navel alei higaion bekhinor","ki simachtani Adonai befo'olekha bema'asei yadeikha aranen","ma-gadlu ma'aseikha Adonai me'od amku machshvoteikha","ish-ba'ar lo yeda' ukhsil lo-yavin et-zot","bifroach resha'im kemo-esev vayatsitsu kol-po'alei aven lehishamdam adei-ad","ve'ata marom le'olam Adonai","ki hine oyveikha Adonai ki-hine oyveikha yovedu yitpardu kol-po'alei aven","vatarem kir'eim karni baloti beshemen ra'anan","vatabet eini beshurai bakamim alai mere'im tishma'na oznai","tsadik katamar yifrach ke'erez balvanon yisge","shetulim beveit Adonai bechatsrot eloheinu yafrichu","od yenuvun beseiva deshenim vera'ananim yihyu","lehagid ki-yashar Adonai tsuri velo-'avlatah 'lth bo f"],"en":["A Psalm, a Song. For the sabbath day.","It is a good thing to give thanks unto the LORD, And to sing praises unto Thy name, O Most High;","To declare Thy lovingkindness in the morning, And Thy faithfulness in the night seasons,","With an instrument of ten strings, and with the psaltery; With a solemn sound upon the harp.","For Thou, LORD, hast made me glad through Thy work; I will exult in the works of Thy hands.","How great are Thy works, O LORD! Thy thoughts are very deep.","A brutish man knoweth not, Neither doth a fool understand this.","When the wicked spring up as the grass, And when all the workers of iniquity do flourish; It is that they may be destroyed for ever.","But Thou, O LORD, art on high for evermore.","For, lo, Thine enemies, O LORD, For, lo, Thine enemies shall perish: All the workers of iniquity shall be scattered.","But my horn hast Thou exalted like the horn of the wild-ox; I am anointed with rich oil.","Mine eye also hath gazed on them that lie in wait for me, Mine ears have heard my desire of the evil-doers that rise up against me.","The righteous shall flourish like the palm-tree; He shall grow like a cedar in Lebanon.","Planted in the house of the LORD, They shall flourish in the courts of our God.","They shall still bring forth fruit in old age; They shall be full of sap and richness;","To declare that the LORD is upright, My Rock, in whom there is no unrighteousness."]},{"n":93,"he":["יְהֹוָה מָלָךְ גֵּאוּת לָבֵשׁ לָבֵשׁ יְהֹוָה עֹז הִתְאַזָּר אַף־תִּכּוֹן תֵּבֵל בַּל־תִּמּֽוֹט׃","נָכוֹן כִּסְאֲךָ מֵאָז מֵעוֹלָם אָֽתָּה׃","נָשְׂאוּ נְהָרוֹת יְֽהֹוָה נָשְׂאוּ נְהָרוֹת קוֹלָם יִשְׂאוּ נְהָרוֹת דׇּכְיָֽם׃","מִקֹּלוֹת מַיִם רַבִּים אַדִּירִים מִשְׁבְּרֵי־יָם אַדִּיר בַּמָּרוֹם יְהֹוָֽה׃","עֵֽדֹתֶיךָ נֶאֶמְנוּ מְאֹד לְבֵיתְךָ נַאֲוָה־קֹדֶשׁ יְהֹוָה לְאֹרֶךְ יָמִֽים׃ {פ}"],"lat":["Adonai malakh geut lavesh lavesh Adonai oz hit'azar af-tikon tevel bal-timot","nakhon kis'akha me'az me'olam ata","nasu neharot Adonai nasu neharot kolam yisu neharot dokhyam","mikolot mayim rabim adirim mishbrei-yam adir bamarom Adonai","edoteikha ne'emnu me'od leveitkha na'ava-kodesh Adonai le'orekh yamim f"],"en":["The LORD reigneth; He is clothed in majesty; The LORD is clothed, He hath girded Himself with strength; Yea, the world is established, that it cannot be moved.","Thy throne is established of old; Thou art from everlasting.","The floods have lifted up, O LORD, The floods have lifted up their voice; The floods lift up their roaring.","Above the voices of many waters, The mighty breakers of the sea, The LORD on high is mighty.","Thy testimonies are very sure, Holiness becometh Thy house, O LORD, for evermore."]},{"n":94,"he":["אֵל־נְקָמוֹת יְהֹוָה אֵל נְקָמוֹת הוֹפִֽיעַ׃","הִנָּשֵׂא שֹׁפֵט הָאָרֶץ הָשֵׁב גְּמוּל עַל־גֵּאִֽים׃","עַד־מָתַי רְשָׁעִים יְהֹוָה עַד־מָתַי רְשָׁעִים יַעֲלֹֽזוּ׃","יַבִּיעוּ יְדַבְּרוּ עָתָק יִתְאַמְּרוּ כׇּל־פֹּעֲלֵי אָֽוֶן׃","עַמְּךָ יְהֹוָה יְדַכְּאוּ וְֽנַחֲלָתְךָ יְעַנּֽוּ׃","אַלְמָנָה וְגֵר יַהֲרֹגוּ וִיתוֹמִים יְרַצֵּֽחוּ׃","וַיֹּאמְרוּ לֹא יִרְאֶה־יָּהּ וְלֹא־יָבִין אֱלֹהֵי יַעֲקֹֽב׃","בִּינוּ בֹּעֲרִים בָּעָם וּכְסִילִים מָתַי תַּשְׂכִּֽילוּ׃","הֲנֹטַֽע אֹזֶן הֲלֹא יִשְׁמָע אִֽם־יֹצֵֽר עַיִן הֲלֹא יַבִּֽיט׃","הֲיֹסֵר גּוֹיִם הֲלֹא יוֹכִיחַ הַֽמְלַמֵּד אָדָם דָּֽעַת׃","יְֽהֹוָה יֹדֵעַ מַחְשְׁבוֹת אָדָם כִּי־הֵמָּה הָֽבֶל׃","אַשְׁרֵי הַגֶּבֶר אֲשֶׁר־תְּיַסְּרֶנּוּ יָּהּ וּֽמִתּוֹרָתְךָ תְלַמְּדֶֽנּוּ׃","לְהַשְׁקִיט לוֹ מִימֵי רָע עַד יִכָּרֶה לָרָשָׁע שָֽׁחַת׃","כִּי לֹא־יִטֹּשׁ יְהֹוָה עַמּוֹ וְנַחֲלָתוֹ לֹא יַעֲזֹֽב׃","כִּֽי־עַד־צֶדֶק יָשׁוּב מִשְׁפָּט וְאַחֲרָיו כׇּל־יִשְׁרֵי־לֵֽב׃","מִֽי־יָקוּם לִי עִם־מְרֵעִים מִי־יִתְיַצֵּב לִי עִם־פֹּעֲלֵי אָֽוֶן׃","לוּלֵי יְהֹוָה עֶזְרָתָה לִּי כִּמְעַט שָׁכְנָה דוּמָה נַפְשִֽׁי׃","אִם־אָמַרְתִּי מָטָה רַגְלִי חַסְדְּךָ יְהֹוָה יִסְעָדֵֽנִי׃","בְּרֹב שַׂרְעַפַּי בְּקִרְבִּי תַּנְחוּמֶיךָ יְֽשַׁעַשְׁעוּ נַפְשִֽׁי׃","הַֽיְחׇבְרְךָ כִּסֵּא הַוּוֹת יֹצֵר עָמָל עֲלֵי־חֹֽק׃","יָגוֹדּוּ עַל־נֶפֶשׁ צַדִּיק וְדָם נָקִי יַרְשִֽׁיעוּ׃","וַיְהִי יְהֹוָה לִי לְמִשְׂגָּב וֵאלֹהַי לְצוּר מַחְסִֽי׃","וַיָּשֶׁב עֲלֵיהֶם אֶת־אוֹנָם וּבְרָעָתָם יַצְמִיתֵם יַצְמִיתֵם יְהֹוָה אֱלֹהֵֽינוּ׃ {פ}"],"lat":["el-nekamot Adonai el nekamot hofia'","hinase shofet ha'arets hashev gemul al-ge'im","ad-matai resha'im Adonai ad-matai resha'im ya'alozu","yabi'u yedabru atak yit'amru kol-po'alei aven","amkha Adonai yedaku venachalatkha ye'anu","almana veger yaharogu vitomim yeratsechu","vayomru lo yir'e-yah velo-yavin elohei ya'akov","binu bo'arim ba'am ukhsilim matai taskilu","hanota' ozen halo yishma' im-yotser ayin halo yabit","hayoser goyim halo yokhiach hamlamed adam da'at","Adonai yodea' machshvot adam ki-hema havel","ashrei hagever asher-teyasrenu yah umitoratkha telamdenu","lehashkit lo mimei ra' ad yikare larasha' shachat","ki lo-yitosh Adonai amo venachalato lo ya'azov","ki-ad-tsedek yashuv mishpat ve'acharaiv kol-yishrei-lev","mi-yakum li im-mere'im mi-yityatsev li im-po'alei aven","lulei Adonai ezrata li kim'at shakhna duma nafshi","im-amarti mata ragli chasdkha Adonai yis'adeni","berov sar'apai bekirbi tanchumeikha yesha'ash'u nafshi","haychovrkha kise hauot yotser amal alei-chok","yagodu al-nefesh tsadik vedam naki yarshi'u","vayhi Adonai li lemisgav velohai letsur machsi","vayashev aleihem et-onam uvra'atam yatsmitem yatsmitem Adonai eloheinu f"],"en":["O LORD, Thou God to whom vengeance belongeth, Thou God to whom vengeance belongeth, shine forth.","Lift up Thyself, Thou Judge of the earth; Render to the proud their recompense.","LORD, how long shall the wicked, How long shall the wicked exult?","They gush out, they speak arrogancy; All the workers of iniquity bear themselves loftily.","They crush Thy people, O LORD, And afflict Thy heritage.","They slay the widow and the stranger, And murder the fatherless.","And they say: 'The LORD will not see, Neither will the God of Jacob give heed.'","Consider, ye brutish among the people; And ye fools, when will ye understand?","He that planted the ear, shall He not hear? He that formed the eye, shall He not see?","He that instructeth nations, shall not He correct? Even He that teacheth man knowledge?","The LORD knoweth the thoughts of man, That they are vanity.","Happy is the man whom Thou instructest, O LORD, And teachest out of Thy law;","That Thou mayest give him rest from the days of evil, Until the pit be digged for the wicked.","For the LORD will not cast off His people, Neither will He forsake His inheritance.","For right shall return unto justice, And all the upright in heart shall follow it.","Who will rise up for me against the evil-doers? Who will stand up for me against the workers of iniquity?","Unless the LORD had been my help, My soul had soon dwelt in silence.","If I say: 'My foot slippeth', Thy mercy, O LORD, holdeth me up.","When my cares are many within me, Thy comforts delight my soul.","Shall the seat of wickedness have fellowship with Thee, Which frameth mischief by statute?","They gather themselves together against the soul of the righteous, And condemn innocent blood.","But the LORD hath been my high tower, And my God the rock of my refuge.","And He hath brought upon them their own iniquity, And will cut them off in their own evil; The LORD our God will cut them off."]},{"n":95,"he":["לְכוּ נְרַנְּנָה לַיהֹוָה נָרִיעָה לְצוּר יִשְׁעֵֽנוּ׃","נְקַדְּמָה פָנָיו בְּתוֹדָה בִּזְמִרוֹת נָרִיעַֽ לֽוֹ׃","כִּי אֵל גָּדוֹל יְהֹוָה וּמֶלֶךְ גָּדוֹל עַל־כׇּל־אֱלֹהִֽים׃","אֲשֶׁר בְּיָדוֹ מֶחְקְרֵי־אָרֶץ וְתוֹעֲפֹת הָרִים לֽוֹ׃","אֲשֶׁר־לוֹ הַיָּם וְהוּא עָשָׂהוּ וְיַבֶּשֶׁת יָדָיו יָצָֽרוּ׃","בֹּאוּ נִשְׁתַּחֲוֶה וְנִכְרָעָה נִבְרְכָה לִֽפְנֵי־יְהֹוָה עֹשֵֽׂנוּ׃","כִּי־הוּא אֱלֹהֵינוּ וַאֲנַחְנוּ עַם מַרְעִיתוֹ וְצֹאן יָדוֹ הַיּוֹם אִֽם־בְּקֹלוֹ תִשְׁמָֽעוּ׃","אַל־תַּקְשׁוּ לְבַבְכֶם כִּמְרִיבָה כְּיוֹם מַסָּה בַּמִּדְבָּֽר׃","אֲשֶׁר נִסּוּנִי אֲבֽוֹתֵיכֶם בְּחָנוּנִי גַּם־רָאוּ פׇעֳלִֽי׃","אַרְבָּעִים שָׁנָה אָקוּט בְּדוֹר וָאֹמַר עַם תֹּעֵי לֵבָב הֵם וְהֵם לֹא־יָדְעוּ דְרָכָֽי׃","אֲשֶׁר־נִשְׁבַּעְתִּי בְאַפִּי אִם־יְבֹאוּן אֶל־מְנוּחָתִֽי׃ {פ}"],"lat":["lekhu neranena laihova nari'a letsur yish'enu","nekadma fanaiv betoda bizmirot naria' lo","ki el gadol Adonai umelekh gadol al-kol-elohim","asher beyado mechkrei-arets veto'afot harim lo","asher-lo hayam vehu asahu veyabeshet yadaiv yatsaru","bou nishtachave venikhra'a nivrkha lifnei-Adonai osenu","ki-hu eloheinu va'anachnu am mar'ito vetson yado hayom im-bekolo tishma'u","al-takshu levavkhem kimriva keiom masa bamidbar","asher nisuni avoteikhem bechanuni gam-rau fo'oli","arba'im shana akut bedor va'omar am to'ei levav hem vehem lo-yad'u derakhai","asher-nishba'ti ve'api im-yevoun el-menuchati f"],"en":["O come, let us sing unto the LORD; Let us shout for joy to the Rock of our salvation.","Let us come before His presence with thanksgiving, Let us shout for joy unto Him with psalms.","For the LORD is a great God, And a great King above all gods;","In whose hand are the depths of the earth; The heights of the mountains are His also.","The sea is His, and He made it; And His hands formed the dry land.","O come, let us bow down and bend the knee; Let us kneel before the LORD our Maker;","For He is our God, And we are the people of His pasture, and the flock of His hand. To-day, if ye would but hearken to His voice!","'Harden not your heart, as at Meribah, As in the day of Massah in the wilderness;","When your fathers tried Me, Proved Me, even though they saw My work.","For forty years was I wearied with that generation, And said: It is a people that do err in their heart, And they have not known My ways;","Wherefore I swore in My wrath, That they should not enter into My rest.'"]},{"n":96,"he":["שִׁירוּ לַיהֹוָה שִׁיר חָדָשׁ שִׁירוּ לַיהֹוָה כׇּל־הָאָֽרֶץ׃","שִׁירוּ לַיהֹוָה בָּרְכוּ שְׁמוֹ בַּשְּׂרוּ מִיּֽוֹם־לְיוֹם יְשׁוּעָתֽוֹ׃","סַפְּרוּ בַגּוֹיִם כְּבוֹדוֹ בְּכׇל־הָעַמִּים נִפְלְאוֹתָֽיו׃","כִּי־גָדוֹל יְהֹוָה וּמְהֻלָּל מְאֹד נוֹרָא הוּא עַל־כׇּל־אֱלֹהִֽים׃","כִּי כׇּל־אֱלֹהֵי הָעַמִּים אֱלִילִים וַיהֹוָה שָׁמַיִם עָשָֽׂה׃","הוֹד־וְהָדָר לְפָנָיו עֹז וְתִפְאֶרֶת בְּמִקְדָּשֽׁוֹ׃","הָבוּ לַיהֹוָה מִשְׁפְּחוֹת עַמִּים הָבוּ לַיהֹוָה כָּבוֹד וָעֹֽז׃","הָבוּ לַיהֹוָה כְּבוֹד שְׁמוֹ שְׂאֽוּ־מִנְחָה וּבֹאוּ לְחַצְרוֹתָֽיו׃","הִשְׁתַּחֲווּ לַיהֹוָה בְּהַדְרַת־קֹדֶשׁ חִילוּ מִפָּנָיו כׇּל־הָאָֽרֶץ׃","אִמְרוּ בַגּוֹיִם יְהֹוָה מָלָךְ אַף־תִּכּוֹן תֵּבֵל בַּל־תִּמּוֹט יָדִין עַמִּים בְּמֵישָׁרִֽים׃","יִשְׂמְחוּ הַשָּׁמַיִם וְתָגֵל הָאָרֶץ יִֽרְעַם הַיָּם וּמְלֹאֽוֹ׃","יַעֲלֹז שָׂדַי וְכׇל־אֲשֶׁר־בּוֹ אָז יְרַנְּנוּ כׇּל־עֲצֵי־יָֽעַר׃","לִפְנֵי יְהֹוָה כִּי בָא כִּי בָא לִשְׁפֹּט הָאָרֶץ יִשְׁפֹּֽט־תֵּבֵל בְּצֶדֶק וְעַמִּים בֶּאֱמוּנָתֽוֹ׃ {פ}"],"lat":["shiru laihova shir chadash shiru laihova kol-ha'arets","shiru laihova barkhu shemo basru miyom-leiom yeshu'ato","sapru vagoyim kevodo bekhol-ha'amim niflotaiv","ki-gadol Adonai umhulal me'od nora hu al-kol-elohim","ki kol-elohei ha'amim elilim vaihova shamayim asa","hod-vehadar lefanaiv oz vetif'eret bemikdasho","havu laihova mishpchot amim havu laihova kavod va'oz","havu laihova kevod shemo seu-mincha uvou lechatsrotaiv","hishtachavu laihova behadrat-kodesh chilu mipanaiv kol-ha'arets","imru vagoyim Adonai malakh af-tikon tevel bal-timot yadin amim bemeisharim","yismchu hashamayim vetagel ha'arets yir'am hayam umloo","ya'aloz sadai vekhol-asher-bo az yeranenu kol-atsei-ya'ar","lifnei Adonai ki va ki va lishpot ha'arets yishpot-tevel betsedek ve'amim be'emunato f"],"en":["O sing unto the LORD a new song; Sing unto the LORD, all the earth.","Sing unto the LORD, bless His name; Proclaim His salvation from day to day.","Declare His glory among the nations, His marvellous works among all the peoples.","For great is the LORD, and highly to be praised; He is to be feared above all gods. .","For all the gods of the peoples are things of nought; But the LORD made the heavens.","Honour and majesty are before Him; Strength and beauty are in His sanctuary.","Ascribe unto the LORD, ye kindreds of the peoples, Ascribe unto the LORD glory and strength.","Ascribe unto the LORD the glory due unto His name; Bring an offering, and come into His courts.","O worship the LORD in the beauty of holiness; Tremble before Him, all the earth.","Say among the nations: 'The LORD reigneth.' The world also is established that it cannot be moved; He will judge the peoples with equity.","Let the heavens be glad, and let the earth rejoice; Let the sea roar, and the fulness thereof;","Let the field exult; and all that is therein; Then shall all the trees of the wood sing for joy;","Before the LORD, for He is come; For He is come to judge the earth; He will judge the world with righteousness, And the peoples in His faithfulness."]},{"n":97,"he":["יְהֹוָה מָלָךְ תָּגֵל הָאָרֶץ יִשְׂמְחוּ אִיִּים רַבִּֽים׃","עָנָן וַעֲרָפֶל סְבִיבָיו צֶדֶק וּמִשְׁפָּט מְכוֹן כִּסְאֽוֹ׃","אֵשׁ לְפָנָיו תֵּלֵךְ וּתְלַהֵט סָבִיב צָרָֽיו׃","הֵאִירוּ בְרָקָיו תֵּבֵל רָאֲתָה וַתָּחֵל הָאָֽרֶץ׃","הָרִים כַּדּוֹנַג נָמַסּוּ מִלִּפְנֵי יְהֹוָה מִלִּפְנֵי אֲדוֹן כׇּל־הָאָֽרֶץ׃","הִגִּידוּ הַשָּׁמַיִם צִדְקוֹ וְרָאוּ כׇל־הָעַמִּים כְּבוֹדֽוֹ׃","יֵבֹשׁוּ כׇּל־עֹבְדֵי פֶסֶל הַמִּֽתְהַלְלִים בָּאֱלִילִים הִשְׁתַּחֲווּ־לוֹ כׇּל־אֱלֹהִֽים׃","שָׁמְעָה וַתִּשְׂמַח צִיּוֹן וַתָּגֵלְנָה בְּנוֹת יְהוּדָה לְמַעַן מִשְׁפָּטֶיךָ יְהֹוָֽה׃","כִּֽי־אַתָּה יְהֹוָה עֶלְיוֹן עַל־כׇּל־הָאָרֶץ מְאֹד נַעֲלֵיתָ עַל־כׇּל־אֱלֹהִֽים׃","אֹֽהֲבֵי יְהֹוָה שִׂנְאוּ־רָע שֹׁמֵר נַפְשׁוֹת חֲסִידָיו מִיַּד רְשָׁעִים יַצִּילֵֽם׃","אוֹר זָרֻעַ לַצַּדִּיק וּֽלְיִשְׁרֵי־לֵב שִׂמְחָֽה׃","שִׂמְחוּ צַדִּיקִים בַּיהֹוָה וְהוֹדוּ לְזֵכֶר קׇדְשֽׁוֹ׃ {פ}"],"lat":["Adonai malakh tagel ha'arets yismchu iyim rabim","anan va'arafel sevivaiv tsedek umishpat mekhon kiso","esh lefanaiv telekh utlahet saviv tsaraiv","he'iru verakaiv tevel ra'ata vatachel ha'arets","harim kadonag namasu milifnei Adonai milifnei adon kol-ha'arets","higidu hashamayim tsidko verau khol-ha'amim kevodo","yevoshu kol-ovdei fesel hamithalelim ba'elilim hishtachavu-lo kol-elohim","sham'a vatismach tsiyon vatagelna benot yehuda lema'an mishpateikha Adonai","ki-ata Adonai elyon al-kol-ha'arets me'od na'aleita al-kol-elohim","ohavei Adonai sinu-ra' shomer nafshot chasidaiv miyad resha'im yatsilem","or zarua' latsadik ulyishrei-lev simcha","simchu tsadikim baihova vehodu lezekher kodsho f"],"en":["The LORD reigneth; let the earth rejoice; Let the multitude of isles be glad.","Clouds and darkness are round about Him; Righteousness and justice are the foundation of His throne.","A fire goeth before Him, And burneth up His adversaries round about.","His lightnings lighted up the world; The earth saw, and trembled.","The mountains melted like wax at the presence of the LORD, At the presence of the Lord of the whole earth.","The heavens declared His righteousness, And all the peoples saw His glory.","Ashamed be all they that serve graven images, That boast themselves of things of nought; Bow down to Him, all ye gods.","Zion heard and was glad, And the daughters of Judah rejoiced; Because of Thy judgments, O LORD.","For Thou, LORD, art most high above all the earth; Thou art exalted far above all gods.","O ye that love the LORD, hate evil; He preserveth the souls of His saints; He delivered them out of the hand of the wicked.","Light is sown for the righteous, And gladness for the upright in heart.","Be glad in the LORD, ye righteous; And give thanks to His holy name."]},{"n":98,"he":["מִזְמוֹר שִׁירוּ לַיהֹוָה שִׁיר חָדָשׁ כִּֽי־נִפְלָאוֹת עָשָׂה הוֹשִׁיעָה־לּוֹ יְמִינוֹ וּזְרוֹעַ קׇדְשֽׁוֹ׃","הוֹדִיעַ יְהֹוָה יְשׁוּעָתוֹ לְעֵינֵי הַגּוֹיִם גִּלָּה צִדְקָתֽוֹ׃","זָכַר חַסְדּוֹ וֶאֱֽמוּנָתוֹ לְבֵית יִשְׂרָאֵל רָאוּ כׇל־אַפְסֵי־אָרֶץ אֵת יְשׁוּעַת אֱלֹהֵֽינוּ׃","הָרִיעוּ לַיהֹוָה כׇּל־הָאָרֶץ פִּצְחוּ וְרַנְּנוּ וְזַמֵּֽרוּ׃","זַמְּרוּ לַיהֹוָה בְּכִנּוֹר בְּכִנּוֹר וְקוֹל זִמְרָֽה׃","בַּחֲצֹצְרוֹת וְקוֹל שׁוֹפָר הָרִיעוּ לִפְנֵי הַמֶּלֶךְ יְהֹוָֽה׃","יִרְעַם הַיָּם וּמְלֹאוֹ תֵּבֵל וְיֹשְׁבֵי בָֽהּ׃","נְהָרוֹת יִמְחֲאוּ־כָף יַחַד הָרִים יְרַנֵּֽנוּ׃","לִפְֽנֵי־יְהֹוָה כִּי בָא לִשְׁפֹּט הָאָרֶץ יִשְׁפֹּֽט־תֵּבֵל בְּצֶדֶק וְעַמִּים בְּמֵישָׁרִֽים׃ {פ}"],"lat":["mizmor shiru laihova shir chadash ki-niflaot asa hoshi'a-lo yemino uzroa' kodsho","hodia' Adonai yeshu'ato le'einei hagoyim gila tsidkato","zakhar chasdo ve'emunato leveit yisra'el rau khol-afsei-arets et yeshu'at eloheinu","hari'u laihova kol-ha'arets pitschu veranenu vezameru","zamru laihova bekhinor bekhinor vekol zimra","bachatsotsrot vekol shofar hari'u lifnei hamelekh Adonai","yir'am hayam umloo tevel veyoshvei vah","neharot yimchau-khaf yachad harim yeranenu","lifnei-Adonai ki va lishpot ha'arets yishpot-tevel betsedek ve'amim bemeisharim f"],"en":["A Psalm. O sing unto the LORD a new song; For He hath done marvellous things; His right hand, and His holy arm, hath wrought salvation for Him.","The LORD hath made known His salvation; His righteousness hath He revealed in the sight of the nations.","He hath remembered His mercy and His faithfulness toward the house of Israel; All the ends of the earth have seen the salvation of our God.","Shout unto the LORD, all the earth; Break forth and sing for joy, yea, sing praises.","Sing praises unto the LORD with the harp; With the harp and the voice of melody.","With trumpets and sound of the horn Shout ye before the King, the LORD.","Let the sea roar, and the fulness thereof; The world, and they that dwell therein;","Let the floods clap their hands; Let the mountains sing for joy together;","Before the LORD, for He is come to judge the earth; He will judge the world with righteousness, And the peoples with equity."]},{"n":99,"he":["יְהֹוָה מָלָךְ יִרְגְּזוּ עַמִּים יֹשֵׁב כְּרוּבִים תָּנוּט הָאָֽרֶץ׃","יְהֹוָה בְּצִיּוֹן גָּדוֹל וְרָם הוּא עַל־כׇּל־הָעַמִּֽים׃","יוֹדוּ שִׁמְךָ גָּדוֹל וְנוֹרָא קָדוֹשׁ הֽוּא׃","וְעֹז מֶלֶךְ מִשְׁפָּט אָהֵב אַתָּה כּוֹנַנְתָּ מֵישָׁרִים מִשְׁפָּט וּצְדָקָה בְּיַעֲקֹב אַתָּה עָשִֽׂיתָ׃","רוֹמְמוּ יְהֹוָה אֱלֹהֵינוּ וְֽהִשְׁתַּחֲווּ לַהֲדֹם רַגְלָיו קָדוֹשׁ הֽוּא׃","מֹשֶׁה וְאַהֲרֹן בְּֽכֹהֲנָיו וּשְׁמוּאֵל בְּקֹרְאֵי שְׁמוֹ קֹרִאים אֶל־יְהֹוָה וְהוּא יַעֲנֵֽם׃","בְּעַמּוּד עָנָן יְדַבֵּר אֲלֵיהֶם שָׁמְרוּ עֵדֹתָיו וְחֹק נָֽתַן־לָֽמוֹ׃","יְהֹוָה אֱלֹהֵינוּ אַתָּה עֲנִיתָם אֵל נֹשֵׂא הָיִיתָ לָהֶם וְנֹקֵם עַל־עֲלִילוֹתָֽם׃","רוֹמְמוּ יְהֹוָה אֱלֹהֵינוּ וְֽהִשְׁתַּחֲווּ לְהַר קׇדְשׁוֹ כִּי־קָדוֹשׁ יְהֹוָה אֱלֹהֵֽינוּ׃ {פ}"],"lat":["Adonai malakh yirgzu amim yoshev keruvim tanut ha'arets","Adonai betsiyon gadol veram hu al-kol-ha'amim","yodu shimkha gadol venora kadosh hu","ve'oz melekh mishpat ahev ata konanta meisharim mishpat utsdaka beya'akov ata asita","romemu Adonai eloheinu vehishtachavu lahadom raglaiv kadosh hu","moshe ve'aharon bekhohanaiv ushmu'el bekor'ei shemo korim el-Adonai vehu ya'anem","be'amud anan yedaber aleihem shamru edotaiv vechok natan-lamo","Adonai eloheinu ata anitam el nose hayita lahem venokem al-alilotam","romemu Adonai eloheinu vehishtachavu lehar kodsho ki-kadosh Adonai eloheinu f"],"en":["The LORD reigneth; let the peoples tremble; He is enthroned upon the cherubim; let the earth quake.","The LORD is great in Zion; And He is high above all the peoples.","Let them praise Thy name as great and awful; Holy is He.","The strength also of the king who loveth justice— Thou hast established equity, Thou hast executed justice and righteousness in Jacob.","Exalt ye the LORD our God, And prostrate yourselves at His footstool; Holy is He.","Moses and Aaron among His priests, And Samuel among them that call upon His name, Did call upon the LORD, and He answered them.","He spoke unto them in the pillar of cloud; They kept His testimonies, and the statute that He gave them.","O LORD our God, Thou didst answer them; A forgiving God wast Thou unto them, Though Thou tookest vengeance of their misdeeds.","Exalt ye the LORD our God, And worship at His holy hill; For the LORD our God is holy."]},{"n":100,"he":["מִזְמוֹר לְתוֹדָה הָרִיעוּ לַיהֹוָה כׇּל־הָאָֽרֶץ׃","עִבְדוּ אֶת־יְהֹוָה בְּשִׂמְחָה בֹּאוּ לְפָנָיו בִּרְנָנָֽה׃","דְּעוּ כִּֽי־יְהֹוָה הוּא אֱלֹהִים הֽוּא־עָשָׂנוּ (ולא) [וְלוֹ] אֲנַחְנוּ עַמּוֹ וְצֹאן מַרְעִיתֽוֹ׃","בֹּאוּ שְׁעָרָיו בְּתוֹדָה חֲצֵרֹתָיו בִּתְהִלָּה הוֹדוּ־לוֹ בָּרְכוּ שְׁמֽוֹ׃","כִּי־טוֹב יְהֹוָה לְעוֹלָם חַסְדּוֹ וְעַד־דֹּר וָדֹר אֱמוּנָתֽוֹ׃ {פ}"],"lat":["mizmor letoda hari'u laihova kol-ha'arets","ivdu et-Adonai besimcha bou lefanaiv birnana","de'u ki-Adonai hu elohim hu-asanu vl vlo anachnu amo vetson mar'ito","bou she'araiv betoda chatserotaiv bithila hodu-lo barkhu shemo","ki-tov Adonai le'olam chasdo ve'ad-dor vador emunato f"],"en":["A Psalm of thanksgiving. Shout unto the LORD, all the earth.","Serve the LORD with gladness; come before His presence with singing.","Know ye that the LORD He is God; it is He that hath made us, and we are His, His people, and the flock of His pasture.","Enter into His gates with thanksgiving, and into His courts with praise; give thanks unto Him, and bless His name.","For the LORD is good; His mercy endureth for ever; and His faithfulness unto all generations."]},{"n":101,"he":["לְדָוִד מִזְמוֹר חֶֽסֶד־וּמִשְׁפָּט אָשִׁירָה לְךָ יְהֹוָה אֲזַמֵּֽרָה׃","אַשְׂכִּילָה בְּדֶרֶךְ תָּמִים מָתַי תָּבוֹא אֵלָי אֶתְהַלֵּךְ בְּתׇם־לְבָבִי בְּקֶרֶב בֵּיתִֽי׃","לֹֽא־אָשִׁית לְנֶגֶד עֵינַי דְּֽבַר־בְּלִיָּעַל עֲשֹֽׂה־סֵטִים שָׂנֵאתִי לֹא יִדְבַּק בִּֽי׃","לֵבָב עִקֵּשׁ יָסוּר מִמֶּנִּי רָע לֹא אֵדָֽע׃","(מלושני) [מְלׇשְׁנִי] בַסֵּתֶר רֵעֵהוּ אוֹתוֹ אַצְמִית גְּֽבַהּ־עֵינַיִם וּרְחַב לֵבָב אֹתוֹ לֹא אוּכָֽל׃","עֵינַי בְּנֶֽאֶמְנֵי־אֶרֶץ לָשֶׁבֶת עִמָּדִי הֹלֵךְ בְּדֶרֶךְ תָּמִים הוּא יְשָׁרְתֵֽנִי׃","לֹֽא־יֵשֵׁב בְּקֶרֶב בֵּיתִי עֹשֵׂה רְמִיָּה דֹּבֵר שְׁקָרִים לֹא־יִכּוֹן לְנֶגֶד עֵינָֽי׃","לַבְּקָרִים אַצְמִית כׇּל־רִשְׁעֵי־אָרֶץ לְהַכְרִית מֵעִיר־יְהֹוָה כׇּל־פֹּעֲלֵי אָֽוֶן׃ {פ}"],"lat":["ledavid mizmor chesed-umishpat ashira lekha Adonai azamera","askila bederekh tamim matai tavo elai ethalekh betom-levavi bekerev beiti","lo-ashit leneged einai devar-beliya'al aso-setim saneti lo yidbak bi","levav ikesh yasur mimeni ra' lo eda'","mlvshny mloshni vaseter re'ehu oto atsmit gevah-einayim urchav levav oto lo ukhal","einai bene'emnei-erets lashevet imadi holekh bederekh tamim hu yesharteni","lo-yeshev bekerev beiti ose remiya dover shekarim lo-yikon leneged einai","labkarim atsmit kol-rish'ei-arets lehakhrit me'ir-Adonai kol-po'alei aven f"],"en":["A Psalm of David. I will sing of mercy and justice; unto Thee, O LORD, will I sing praises.","I will give heed unto the way of integrity; oh when wilt Thou come unto me? I will walk within my house in the integrity of my heart.","I will set no base thing before mine eyes; I hate the doing of things crooked; it shall not cleave unto me.","A perverse heart shall depart from me; I will know no evil thing.","Whoso slandereth his neighbour in secret, him will I destroy; Whoso is haughty of eye and proud of heart, him will I not suffer.","Mine eyes are upon the faithful of the land, that they may dwell with me; he that walketh in a way of integrity, he shall minister unto me.","He that worketh deceit shall not dwell within my house; he that speaketh falsehood shall not be established before mine eyes.","Morning by morning will I destroy all the wicked of the land; to cut off all the workers of iniquity from the city of the LORD."]},{"n":102,"he":["תְּפִלָּה לְעָנִי כִֽי־יַעֲטֹף וְלִפְנֵי יְהֹוָה יִשְׁפֹּךְ שִׂיחֽוֹ׃","יְהֹוָה שִׁמְעָה תְפִלָּתִי וְשַׁוְעָתִי אֵלֶיךָ תָבֽוֹא׃","אַל־תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי בְּיוֹם צַר־לִי הַטֵּֽה־אֵלַי אׇזְנֶךָ בְּיוֹם אֶקְרָא מַהֵר עֲנֵֽנִי׃","כִּֽי־כָלוּ בְעָשָׁן יָמָי וְעַצְמוֹתַי כְּמוֹקֵד נִחָֽרוּ׃","הוּכָּה־כָעֵשֶׂב וַיִּבַשׁ לִבִּי כִּֽי־שָׁכַחְתִּי מֵאֲכֹל לַחְמִֽי׃","מִקּוֹל אַנְחָתִי דָּבְקָה עַצְמִי לִבְשָׂרִֽי׃","דָּמִיתִי לִקְאַת מִדְבָּר הָיִיתִי כְּכוֹס חֳרָבֽוֹת׃","שָׁקַדְתִּי וָאֶהְיֶה כְּצִפּוֹר בּוֹדֵד עַל־גָּֽג׃","כׇּל־הַיּוֹם חֵרְפוּנִי אוֹיְבָי מְהוֹלָלַי בִּי נִשְׁבָּֽעוּ׃","כִּי־אֵפֶר כַּלֶּחֶם אָכָלְתִּי וְשִׁקֻּוַי בִּבְכִי מָסָֽכְתִּי׃","מִפְּנֵֽי־זַעַמְךָ וְקִצְפֶּךָ כִּי נְשָׂאתַנִי וַתַּשְׁלִיכֵֽנִי׃","יָמַי כְּצֵל נָטוּי וַאֲנִי כָּעֵשֶׂב אִיבָֽשׁ׃","וְאַתָּה יְהֹוָה לְעוֹלָם תֵּשֵׁב וְזִכְרְךָ לְדֹר וָדֹֽר׃","אַתָּה תָקוּם תְּרַחֵם צִיּוֹן כִּי־עֵת לְחֶֽנְנָהּ כִּי־בָא מוֹעֵֽד׃","כִּי־רָצוּ עֲבָדֶיךָ אֶת־אֲבָנֶיהָ וְֽאֶת־עֲפָרָהּ יְחֹנֵֽנוּ׃","וְיִֽירְאוּ גוֹיִם אֶת־שֵׁם יְהֹוָה וְֽכׇל־מַלְכֵי הָאָרֶץ אֶת־כְּבוֹדֶֽךָ׃","כִּי־בָנָה יְהֹוָה צִיּוֹן נִרְאָה בִּכְבוֹדֽוֹ׃","פָּנָה אֶל־תְּפִלַּת הָעַרְעָר וְלֹא־בָזָה אֶת־תְּפִלָּתָֽם׃","תִּכָּתֶב זֹאת לְדוֹר אַחֲרוֹן וְעַם נִבְרָא יְהַלֶּל־יָֽהּ׃","כִּֽי־הִשְׁקִיף מִמְּרוֹם קׇדְשׁוֹ יְהֹוָה מִשָּׁמַיִם אֶל־אֶרֶץ הִבִּֽיט׃","לִשְׁמֹעַ אֶנְקַת אָסִיר לְפַתֵּחַ בְּנֵי תְמוּתָֽה׃","לְסַפֵּר בְּצִיּוֹן שֵׁם יְהֹוָה וּתְהִלָּתוֹ בִּירוּשָׁלָֽ͏ִם׃","בְּהִקָּבֵץ עַמִּים יַחְדָּו וּמַמְלָכוֹת לַעֲבֹד אֶת־יְהֹוָֽה׃","עִנָּה בַדֶּרֶךְ (כחו) [כֹּחִי] קִצַּר יָמָֽי׃","אֹמַר אֵלִי אַֽל־תַּעֲלֵנִי בַּחֲצִי יָמָי בְּדוֹר דּוֹרִים שְׁנוֹתֶֽיךָ׃","לְפָנִים הָאָרֶץ יָסַדְתָּ וּֽמַעֲשֵׂה יָדֶיךָ שָׁמָֽיִם׃","הֵמָּה יֹאבֵדוּ וְאַתָּה תַעֲמֹד וְכֻלָּם כַּבֶּגֶד יִבְלוּ כַּלְּבוּשׁ תַּחֲלִיפֵם וְֽיַחֲלֹֽפוּ׃","וְאַתָּה־הוּא וּשְׁנוֹתֶיךָ לֹא יִתָּֽמּוּ׃","בְּנֵֽי־עֲבָדֶיךָ יִשְׁכּוֹנוּ וְזַרְעָם לְפָנֶיךָ יִכּֽוֹן׃ {פ}"],"lat":["tefila le'ani khi-ya'atof velifnei Adonai yishpokh sicho","Adonai shim'a tefilati veshav'ati eleikha tavo","al-taster paneikha mimeni beiom tsar-li hate-elai oznekha beiom ekra maher aneni","ki-khalu ve'ashan yamai ve'atsmotai kemoked nicharu","huka-kha'esev vayivash libi ki-shakhachti me'akhol lachmi","mikol anchati davka atsmi livsari","damiti lik'at midbar hayiti kekhos choravot","shakadti va'ehye ketsipor boded al-gag","kol-hayom cherfuni oyvai meholalai bi nishba'u","ki-efer kalechem akhalti veshikuvai bivkhi masakhti","mipnei-za'amkha vekitspekha ki nesatani vatashlikheni","yamai ketsel natuy va'ani ka'esev ivash","ve'ata Adonai le'olam teshev vezikhrkha ledor vador","ata takum terachem tsiyon ki-et lechenenah ki-va mo'ed","ki-ratsu avadeikha et-avaneiah ve'et-afarah yechonenu","veyiru goyim et-shem Adonai vekhol-malkhei ha'arets et-kevodekha","ki-vana Adonai tsiyon nir'a bikhvodo","pana el-tefilat ha'ar'ar velo-vaza et-tefilatam","tikatev zot ledor acharon ve'am nivra yehalel-yah","ki-hishkif mimrom kodsho Adonai mishamayim el-erets hibit","lishmoa' enkat asir lefateach benei temuta","lesaper betsiyon shem Adonai uthilato birushalam","behikavets amim yachdav umamlakhot la'avod et-Adonai","ina vaderekh khchv kochi kitsar yamai","omar eli al-ta'aleni bachatsi yamai bedor dorim shenoteikha","lefanim ha'arets yasadta uma'ase yadeikha shamayim","hema yovedu ve'ata ta'amod vekhulam kabeged yivlu kalvush tachalifem veyachalofu","ve'ata-hu ushnoteikha lo yitamu","benei-avadeikha yishkonu vezar'am lefaneikha yikon f"],"en":["A Prayer of the afflicted, when he fainteth, and poureth out his complaint before the LORD.","O LORD, hear my prayer, and let my cry come unto Thee.","Hide not Thy face from me in the day of my distress; incline Thine ear unto me; in the day when I call answer me speedily.","For my days are consumed like smoke, and my bones are burned as a hearth.","My heart is smitten like grass, and withered; for I forget to eat my bread.","By reason of the voice of my sighing My bones cleave to my flesh.","I am like a pelican of the wilderness; I am become as an owl of the waste places.","I watch, and am become like a sparrow that is alone upon the housetop.","Mine enemies taunt me all the day; they that are mad against me do curse by me.","For I have eaten ashes like bread, and mingled my drink with weeping,","Because of Thine indignation and Thy wrath; for Thou hast taken me up, and cast me away.","My days are like a lengthening shadow; and I am withered like grass.","But Thou, O LORD, sittest enthroned for ever; and Thy name is unto all generations.","Thou wilt arise, and have compassion upon Zion; for it is time to be gracious unto her, for the appointed time is come.","For Thy servants take pleasure in her stones, and love her dust.","So the nations will fear the name of the LORD, and all the kings of the earth Thy glory;","When the LORD hath built up Zion, when He hath appeared in His glory;","When He hath regarded the prayer of the destitute, And hath not despised their prayer.","This shall be written for the generation to come; And a people which shall be created shall praise the LORD.","For He hath looked down from the height of His sanctuary; From heaven did the LORD behold the earth;","To hear the groaning of the prisoner; To loose those that are appointed to death;","That men may tell of the name of the LORD in Zion, And His praise in Jerusalem; .","When the peoples are gathered together, And the kingdoms, to serve the LORD.","He weakened my strength in the way; He shortened my days.","I say: 'O my God, take me not away in the midst of my days, Thou whose years endure throughout all generations.","Of old Thou didst lay the foundation of the earth; And the heavens are the work of Thy hands.","They shall perish, but Thou shalt endure; Yea, all of them shall wax old like a garment; As a vesture shalt Thou change them, and they shall pass away;","But Thou art the selfsame, And Thy years shall have no end.","The children of Thy servants shall dwell securely, And their seed shall be established before Thee.'"]},{"n":103,"he":["לְדָוִד בָּרְכִי נַפְשִׁי אֶת־יְהֹוָה וְכׇל־קְרָבַי אֶת־שֵׁם קׇדְשֽׁוֹ׃","בָּרְכִי נַפְשִׁי אֶת־יְהֹוָה וְאַל־תִּשְׁכְּחִי כׇּל־גְּמוּלָֽיו׃","הַסֹּלֵחַ לְכׇל־עֲוֺנֵכִי הָרֹפֵא לְכׇל־תַּחֲלוּאָֽיְכִי׃","הַגּוֹאֵל מִשַּׁחַת חַיָּיְכִי הַֽמְעַטְּרֵכִי חֶסֶד וְרַחֲמִֽים׃","הַמַּשְׂבִּיעַ בַּטּוֹב עֶדְיֵךְ תִּתְחַדֵּשׁ כַּנֶּשֶׁר נְעוּרָֽיְכִי׃","עֹשֵׂה צְדָקוֹת יְהֹוָה וּמִשְׁפָּטִים לְכׇל־עֲשׁוּקִֽים׃","יוֹדִיעַ דְּרָכָיו לְמֹשֶׁה לִבְנֵי יִשְׂרָאֵל עֲלִילוֹתָֽיו׃","רַחוּם וְחַנּוּן יְהֹוָה אֶרֶךְ אַפַּיִם וְרַב־חָֽסֶד׃","לֹא־לָנֶצַח יָרִיב וְלֹא לְעוֹלָם יִטּֽוֹר׃","לֹא כַחֲטָאֵינוּ עָשָׂה לָנוּ וְלֹא כַעֲוֺנֹתֵינוּ גָּמַל עָלֵֽינוּ׃","כִּי כִגְבֹהַּ שָׁמַיִם עַל־הָאָרֶץ גָּבַר חַסְדּוֹ עַל־יְרֵאָֽיו׃","כִּרְחֹק מִזְרָח מִֽמַּעֲרָב הִֽרְחִיק מִמֶּנּוּ אֶת־פְּשָׁעֵֽינוּ׃","כְּרַחֵם אָב עַל־בָּנִים רִחַם יְהֹוָה עַל־יְרֵאָֽיו׃","כִּי־הוּא יָדַע יִצְרֵנוּ זָכוּר כִּי־עָפָר אֲנָֽחְנוּ׃","אֱנוֹשׁ כֶּחָצִיר יָמָיו כְּצִיץ הַשָּׂדֶה כֵּן יָצִֽיץ׃","כִּי רוּחַ עָֽבְרָה־בּוֹ וְאֵינֶנּוּ וְלֹֽא־יַכִּירֶנּוּ עוֹד מְקוֹמֽוֹ׃","וְחֶסֶד יְהֹוָה מֵעוֹלָם וְעַד־עוֹלָם עַל־יְרֵאָיו וְצִדְקָתוֹ לִבְנֵי בָנִֽים׃","לְשֹׁמְרֵי בְרִיתוֹ וּלְזֹכְרֵי פִקֻּדָיו לַעֲשׂוֹתָֽם׃","יְֽהֹוָה בַּשָּׁמַיִם הֵכִין כִּסְאוֹ וּמַלְכוּתוֹ בַּכֹּל מָשָֽׁלָה׃","בָּרְכוּ יְהֹוָה מַלְאָכָיו גִּבֹּרֵי כֹחַ עֹשֵׂי דְבָרוֹ לִשְׁמֹעַ בְּקוֹל דְּבָרֽוֹ׃","בָּרְכוּ יְהֹוָה כׇּל־צְבָאָיו מְשָׁרְתָיו עֹשֵׂי רְצוֹנֽוֹ׃","בָּרְכוּ יְהֹוָה כׇּֽל־מַעֲשָׂיו בְּכׇל־מְקֹמוֹת מֶמְשַׁלְתּוֹ בָּרְכִי נַפְשִׁי אֶת־יְהֹוָֽה׃ {פ}"],"lat":["ledavid barkhi nafshi et-Adonai vekhol-keravai et-shem kodsho","barkhi nafshi et-Adonai ve'al-tishkchi kol-gemulaiv","hasoleach lekhol-aonekhi harofe lekhol-tachalu'aykhi","hago'el mishachat chayaykhi ham'atrekhi chesed verachamim","hamasbia' batov edyekh titchadesh kanesher ne'uraykhi","ose tsedakot Adonai umishpatim lekhol-ashukim","yodia' derakhaiv lemoshe livnei yisra'el alilotaiv","rachum vechanun Adonai erekh apayim verav-chased","lo-lanetsach yariv velo le'olam yitor","lo khachata'einu asa lanu velo kha'aonoteinu gamal aleinu","ki khigvoah shamayim al-ha'arets gavar chasdo al-yere'aiv","kirchok mizrach mima'arav hirchik mimenu et-pesha'einu","kerachem av al-banim richam Adonai al-yere'aiv","ki-hu yada' yitsrenu zakhur ki-afar anachnu","enosh kechatsir yamaiv ketsits hasade ken yatsits","ki ruach avra-bo ve'einenu velo-yakirenu od mekomo","vechesed Adonai me'olam ve'ad-olam al-yere'aiv vetsidkato livnei vanim","leshomrei verito ulzokhrei fikudaiv la'asotam","Adonai bashamayim hekhin kiso umalkhuto bakol mashala","barkhu Adonai mal'akhaiv giborei khoach osei devaro lishmoa' bekol devaro","barkhu Adonai kol-tseva'aiv meshartaiv osei retsono","barkhu Adonai kol-ma'asaiv bekhol-mekomot memshalto barkhi nafshi et-Adonai f"],"en":["[A Psalm] of David. Bless the LORD, O my soul; And all that is within me, bless His holy name.","Bless the LORD, O my soul, And forget not all His benefits;","Who forgiveth all thine iniquity; Who healeth all Thy diseases;","Who redeemeth Thy life from the pit; Who encompasseth thee with lovingkindness and tender mercies;","Who satisfieth thine old age with good things; So that Thy youth is renewed like the eagle.","The LORD executeth righteousness, And acts of justice for all that are oppressed.","He made known His ways unto Moses, His doings unto the children of Israel.","The LORD is full of compassion and gracious, Slow to anger, and plenteous in mercy.","He will not always contend; Neither will He keep His anger for ever.","He hath not dealt with us after our sins, Nor requited us according to our iniquities.","For as the heaven is high above the earth, So great is His mercy toward them that fear Him.","As far as the east is from the west, So far hath He removed our transgressions from us.","Like as a father hath compassion upon his children, So hath the LORD compassion upon them that fear Him. .","For He knoweth our frame; He remembereth that we are dust.","As for man, his days are as grass; As a flower of the field, so he flourisheth.","For the wind passeth over it, and it is gone; And the place thereof knoweth it no more.","But the mercy of the LORD is from everlasting to everlasting upon them that fear Him, And His righteousness unto children's children;","To such as keep His covenant, And to those that remember His precepts to do them.","The LORD hath established His throne in the heavens; And His kingdom ruleth over all.","Bless the LORD, ye angels of His, Ye mighty in strength, that fulfil His word, Hearkening unto the voice of His word.","Bless the LORD, all ye His hosts; Ye ministers of His, that do His pleasure.","Bless the LORD, all ye His works, In all places of His dominion; Bless the LORD, O my soul."]},{"n":104,"he":["בָּרְכִי נַפְשִׁי אֶת־יְהֹוָה יְהֹוָה אֱלֹהַי גָּדַלְתָּ מְּאֹד הוֹד וְהָדָר לָבָֽשְׁתָּ׃","עֹֽטֶה־אוֹר כַּשַּׂלְמָה נוֹטֶה שָׁמַיִם כַּיְרִיעָֽה׃","הַמְקָרֶה בַמַּיִם עֲֽלִיּוֹתָיו הַשָּׂם־עָבִים רְכוּבוֹ הַֽמְהַלֵּךְ עַל־כַּנְפֵי־רֽוּחַ׃","עֹשֶׂה מַלְאָכָיו רוּחוֹת מְשָׁרְתָיו אֵשׁ לֹהֵֽט׃","יָֽסַד־אֶרֶץ עַל־מְכוֹנֶיהָ בַּל־תִּמּוֹט עוֹלָם וָעֶֽד׃","תְּהוֹם כַּלְּבוּשׁ כִּסִּיתוֹ עַל־הָרִים יַעַמְדוּ־מָֽיִם׃","מִן־גַּעֲרָתְךָ יְנוּסוּן מִן־קוֹל רַעַמְךָ יֵחָפֵזֽוּן׃","יַעֲלוּ הָרִים יֵרְדוּ בְקָעוֹת אֶל־מְקוֹם זֶה יָסַדְתָּ לָהֶֽם׃","גְּֽבוּל־שַׂמְתָּ בַּל־יַעֲבֹרוּן בַּל־יְשֻׁבוּן לְכַסּוֹת הָאָֽרֶץ׃","הַֽמְשַׁלֵּחַ מַעְיָנִים בַּנְּחָלִים בֵּין הָרִים יְהַלֵּכֽוּן׃","יַשְׁקוּ כׇּל־חַיְתוֹ שָׂדָי יִשְׁבְּרוּ פְרָאִים צְמָאָֽם׃","עֲלֵיהֶם עוֹף־הַשָּׁמַיִם יִשְׁכּוֹן מִבֵּין עֳפָאיִם יִתְּנוּ־קֽוֹל׃","מַשְׁקֶה הָרִים מֵעֲלִיּוֹתָיו מִפְּרִי מַעֲשֶׂיךָ תִּשְׂבַּע הָאָֽרֶץ׃","מַצְמִיחַ חָצִיר לַבְּהֵמָה וְעֵשֶׂב לַעֲבֹדַת הָאָדָם לְהוֹצִיא לֶחֶם מִן־הָאָֽרֶץ׃","וְיַיִן יְשַׂמַּח לְֽבַב־אֱנוֹשׁ לְהַצְהִיל פָּנִים מִשָּׁמֶן וְלֶחֶם לְֽבַב־אֱנוֹשׁ יִסְעָֽד׃","יִשְׂבְּעוּ עֲצֵי יְהֹוָה אַֽרְזֵי לְבָנוֹן אֲשֶׁר נָטָֽע׃","אֲשֶׁר־שָׁם צִפֳּרִים יְקַנֵּנוּ חֲסִידָה בְּרוֹשִׁים בֵּיתָֽהּ׃","הָרִים הַגְּבֹהִים לַיְּעֵלִים סְלָעִים מַחְסֶה לַֽשְׁפַנִּֽים׃","עָשָׂה יָרֵחַ לְמוֹעֲדִים שֶׁמֶשׁ יָדַע מְבוֹאֽוֹ׃","תָּֽשֶׁת־חֹשֶׁךְ וִיהִי לָיְלָה בּוֹ־תִרְמֹשׂ כׇּל־חַיְתוֹ־יָֽעַר׃","הַכְּפִירִים שֹׁאֲגִים לַטָּרֶף וּלְבַקֵּשׁ מֵאֵל אׇכְלָֽם׃","תִּזְרַח הַשֶּׁמֶשׁ יֵאָסֵפוּן וְאֶל־מְעוֹנֹתָם יִרְבָּצֽוּן׃","יֵצֵא אָדָם לְפׇעֳלוֹ וְֽלַעֲבֹדָתוֹ עֲדֵי־עָֽרֶב׃","מָה־רַבּוּ מַעֲשֶׂיךָ יְֽהֹוָה כֻּלָּם בְּחׇכְמָה עָשִׂיתָ מָלְאָה הָאָרֶץ קִנְיָנֶֽךָ׃","זֶה הַיָּם גָּדוֹל וּרְחַב יָדָיִם שָֽׁם־רֶמֶשׂ וְאֵין מִסְפָּר חַיּוֹת קְטַנּוֹת עִם־גְּדֹלֽוֹת׃","שָׁם אֳנִיּוֹת יְהַלֵּכוּן לִוְיָתָן זֶֽה־יָצַרְתָּ לְשַֽׂחֶק־בּֽוֹ׃","כֻּלָּם אֵלֶיךָ יְשַׂבֵּרוּן לָתֵת אׇכְלָם בְּעִתּֽוֹ׃","תִּתֵּן לָהֶם יִלְקֹטוּן תִּפְתַּח יָדְךָ יִשְׂבְּעוּן טֽוֹב׃","תַּסְתִּיר פָּנֶיךָ יִֽבָּהֵלוּן תֹּסֵף רוּחָם יִגְוָעוּן וְֽאֶל־עֲפָרָם יְשׁוּבֽוּן׃","תְּשַׁלַּח רוּחֲךָ יִבָּרֵאוּן וּתְחַדֵּשׁ פְּנֵי אֲדָמָֽה׃","יְהִי כְבוֹד יְהֹוָה לְעוֹלָם יִשְׂמַח יְהֹוָה בְּמַעֲשָֽׂיו׃","הַמַּבִּיט לָאָרֶץ וַתִּרְעָד יִגַּע בֶּהָרִים וְֽיֶעֱשָֽׁנוּ׃","אָשִׁירָה לַיהֹוָה בְּחַיָּי אֲזַמְּרָה לֵאלֹהַי בְּעוֹדִֽי׃","יֶעֱרַב עָלָיו שִׂיחִי אָנֹכִי אֶשְׂמַח בַּיהֹוָֽה׃","יִתַּמּוּ חַטָּאִים מִן־הָאָרֶץ וּרְשָׁעִים עוֹד אֵינָם בָּרְכִי נַפְשִׁי אֶת־יְהֹוָה הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["barkhi nafshi et-Adonai Adonai elohai gadalta me'od hod vehadar lavashta","ote-or kasalma note shamayim kayri'a","hamkare vamayim aliyotaiv hasam-avim rekhuvo hamhalekh al-kanfei-ruach","ose mal'akhaiv ruchot meshartaiv esh lohet","yasad-erets al-mekhoneiah bal-timot olam va'ed","tehom kalvush kisito al-harim ya'amdu-mayim","min-ga'aratkha yenusun min-kol ra'amkha yechafezun","ya'alu harim yerdu veka'ot el-mekom ze yasadta lahem","gevul-samta bal-ya'avorun bal-yeshuvun lekhasot ha'arets","hamshaleach ma'yanim banchalim bein harim yehalekhun","yashku kol-chayto sadai yishbru fera'im tsema'am","aleihem of-hashamayim yishkon mibein ofayim yitnu-kol","mashke harim me'aliyotaiv mipri ma'aseikha tisba' ha'arets","matsmiach chatsir labhema ve'esev la'avodat ha'adam lehotsi lechem min-ha'arets","veyayin yesamach levav-enosh lehatshil panim mishamen velechem levav-enosh yis'ad","yisb'u atsei Adonai arzei levanon asher nata'","asher-sham tsiporim yekanenu chasida beroshim beitah","harim hagvohim lay'elim sela'im machse lashfanim","asa yareach lemo'adim shemesh yada' mevoo","tashet-choshekh vihi layla bo-tirmos kol-chayto-ya'ar","hakfirim sho'agim lataref ulvakesh me'el okhlam","tizrach hashemesh ye'asefun ve'el-me'onotam yirbatsun","yetse adam lefo'olo vela'avodato adei-arev","ma-rabu ma'aseikha Adonai kulam bechokhma asita mal'a ha'arets kinyanekha","ze hayam gadol urchav yadayim sham-remes ve'ein mispar chayot ketanot im-gedolot","sham oniyot yehalekhun livyatan ze-yatsarta lesachek-bo","kulam eleikha yesaberun latet okhlam be'ito","titen lahem yilkotun tiftach yadkha yisb'un tov","tastir paneikha yibahelun tosef rucham yigva'un ve'el-afaram yeshuvun","teshalach ruchakha yibareun utchadesh penei adama","yehi khevod Adonai le'olam yismach Adonai bema'asaiv","hamabit la'arets vatir'ad yiga' beharim veye'eshanu","ashira laihova bechayai azamra lelohai be'odi","ye'erav alaiv sichi anokhi esmach baihova","yitamu chata'im min-ha'arets ursha'im od einam barkhi nafshi et-Adonai halelu-yah f"],"en":["Bless the LORD, O my soul. O LORD my God, Thou art very great; Thou art clothed with glory and majesty.","Who coverest Thyself with light as with a garment, who stretchest out the heavens like a curtain;","Who layest the beams of Thine upper chambers in the waters, who makest the clouds Thy chariot, who walkest upon the wings of the wind;","Who makest winds Thy messengers, the flaming fire Thy ministers.","Who didst establish the earth upon its foundations, that it should not be moved for ever and ever;","Thou didst cover it with the deep as with a vesture; the waters stood above the mountains.","At Thy rebuke they fled, at the voice of Thy thunder they hasted away—","The mountains rose, the valleys sank down— Unto the place which Thou hadst founded for them;","Thou didst set a bound which they should not pass over, That they might not return to cover the earth.","Who sendest forth springs into the valleys; They run between the mountains;","They give drink to every beast of the field, The wild asses quench their thirst. .","Beside them dwell the fowl of the heaven, From among the branches they sing.","Who waterest the mountains from Thine upper chambers; The earth is full of the fruit of Thy works.","Who causeth the grass to spring up for the cattle, And herb for the service of man; To bring forth bread out of the earth,","And wine that maketh glad the heart of man, Making the face brighter than oil, And bread that stayeth man's heart.","The trees of the LORD have their fill, The cedars of Lebanon, which He hath planted;","Wherein the birds make their nests; As for the stork, the fir-trees are her house.","The high mountains are for the wild goats; The rocks are a refuge for the conies.","Who appointedst the moon for seasons; The sun knoweth his going down.","Thou makest darkness, and it is night, Wherein all the beasts of the forest do creep forth.","The young lions roar after their prey, And seek their food from God.","The sun ariseth, they slink away, And couch in their dens.","Man goeth forth unto his work And to his labour until the evening.","How manifold are Thy works, O LORD! In wisdom hast Thou made them all; The earth is full of Thy creatures.","Yonder sea, great and wide, Therein are creeping things innumerable, Living creatures, both small and great.","There go the ships; There is leviathan, whom Thou hast formed to sport therein.","All of them wait for Thee, That Thou mayest give them their food in due season.","Thou givest it unto them, they gather it; Thou openest Thy hand, they are satisfied with good.","Thou hidest Thy face, they vanish; Thou withdrawest their breath, they perish, And return to their dust.","Thou sendest forth Thy spirit, they are created; and Thou renewest the face of the earth.","May the glory of the LORD endure for ever; let the LORD rejoice in His works!","Who looketh on the earth, and it trembleth; He toucheth the mountains, and they smoke.","I will sing unto the LORD as long as I live; I will sing praise to my God while I have any being.","Let my musing be sweet unto Him; as for me, I will rejoice in the LORD.","Let sinners cease out of the earth, and let the wicked be no more. Bless the LORD, O my soul. Hallelujah."]},{"n":105,"he":["הוֹדוּ לַיהֹוָה קִרְאוּ בִשְׁמוֹ הוֹדִיעוּ בָעַמִּים עֲלִילוֹתָֽיו׃","שִֽׁירוּ־לוֹ זַמְּרוּ־לוֹ שִׂיחוּ בְּכׇל־נִפְלְאוֹתָֽיו׃","הִֽתְהַלְלוּ בְּשֵׁם קׇדְשׁוֹ יִשְׂמַח לֵב מְבַקְשֵׁי יְהֹוָֽה׃","דִּרְשׁוּ יְהֹוָה וְעֻזּוֹ בַּקְּשׁוּ פָנָיו תָּמִֽיד׃","זִכְרוּ נִפְלְאוֹתָיו אֲשֶׁר־עָשָׂה מֹפְתָיו וּמִשְׁפְּטֵי־פִֽיו׃","זֶרַע אַבְרָהָם עַבְדּוֹ בְּנֵי יַעֲקֹב בְּחִירָֽיו׃","הוּא יְהֹוָה אֱלֹהֵינוּ בְּכׇל־הָאָרֶץ מִשְׁפָּטָֽיו׃","זָכַר לְעוֹלָם בְּרִיתוֹ דָּבָר צִוָּה לְאֶלֶף דּֽוֹר׃","אֲשֶׁר כָּרַת אֶת־אַבְרָהָם וּשְׁבוּעָתוֹ לְיִשְׂחָֽק׃","וַיַּעֲמִידֶהָ לְיַעֲקֹב לְחֹק לְיִשְׂרָאֵל בְּרִית עוֹלָֽם׃","לֵאמֹר לְךָ אֶתֵּן אֶת־אֶֽרֶץ־כְּנָעַן חֶבֶל נַחֲלַתְכֶֽם׃","בִּֽהְיוֹתָם מְתֵי מִסְפָּר כִּמְעַט וְגָרִים בָּֽהּ׃","וַיִּֽתְהַלְּכוּ מִגּוֹי אֶל־גּוֹי מִמַּמְלָכָה אֶל־עַם אַחֵֽר׃","לֹא־הִנִּיחַ אָדָם לְעׇשְׁקָם וַיּוֹכַח עֲלֵיהֶם מְלָכִֽים׃","אַֽל־תִּגְּעוּ בִמְשִׁיחָי וְלִנְבִיאַי אַל־תָּרֵֽעוּ׃","וַיִּקְרָא רָעָב עַל־הָאָרֶץ כׇּֽל־מַטֵּה־לֶחֶם שָׁבָֽר׃","שָׁלַח לִפְנֵיהֶם אִישׁ לְעֶבֶד נִמְכַּר יוֹסֵֽף׃","עִנּוּ בַכֶּבֶל (רגליו) [רַגְלוֹ] בַּרְזֶל בָּאָה נַפְשֽׁוֹ׃","עַד־עֵת בֹּא־דְבָרוֹ אִמְרַת יְהֹוָה צְרָפָֽתְהוּ׃","שָׁלַח מֶלֶךְ וַיַּתִּירֵהוּ מֹשֵׁל עַמִּים וַֽיְפַתְּחֵֽהוּ׃","שָׂמוֹ אָדוֹן לְבֵיתוֹ וּמֹשֵׁל בְּכׇל־קִנְיָנֽוֹ׃","לֶאְסֹר שָׂרָיו בְּנַפְשׁוֹ וּזְקֵנָיו יְחַכֵּֽם׃","וַיָּבֹא יִשְׂרָאֵל מִצְרָיִם וְיַעֲקֹב גָּר בְּאֶֽרֶץ־חָֽם׃","וַיֶּפֶר אֶת־עַמּוֹ מְאֹד וַיַּעֲצִמֵהוּ מִצָּרָֽיו׃","הָפַךְ לִבָּם לִשְׂנֹא עַמּוֹ לְהִתְנַכֵּל בַּעֲבָדָֽיו׃","שָׁלַח מֹשֶׁה עַבְדּוֹ אַהֲרֹן אֲשֶׁר בָּחַר־בּֽוֹ׃","שָֽׂמוּ־בָם דִּבְרֵי אֹתוֹתָיו וּמֹפְתִים בְּאֶרֶץ חָֽם׃","שָׁלַֽח חֹשֶׁךְ וַיַּחְשִׁךְ וְלֹא־מָרוּ אֶת־[דְּבָרֽוֹ] (דבריו)׃","הָפַךְ אֶת־מֵימֵיהֶם לְדָם וַיָּמֶת אֶת־דְּגָתָֽם׃","שָׁרַץ אַרְצָם צְפַרְדְּעִים בְּחַדְרֵי מַלְכֵיהֶֽם׃","אָמַר וַיָּבֹא עָרֹב כִּנִּים בְּכׇל־גְּבוּלָֽם׃","נָתַן גִּשְׁמֵיהֶם בָּרָד אֵשׁ לֶהָבוֹת בְּאַרְצָֽם׃","וַיַּךְ גַּפְנָם וּתְאֵנָתָם וַיְשַׁבֵּר עֵץ גְּבוּלָֽם׃","אָמַר וַיָּבֹא אַרְבֶּה וְיֶלֶק וְאֵין מִסְפָּֽר׃","וַיֹּאכַל כׇּל־עֵשֶׂב בְּאַרְצָם וַיֹּאכַל פְּרִי אַדְמָתָֽם׃","וַיַּךְ כׇּל־בְּכוֹר בְּאַרְצָם רֵאשִׁית לְכׇל־אוֹנָֽם׃","וַֽיּוֹצִיאֵם בְּכֶסֶף וְזָהָב וְאֵין בִּשְׁבָטָיו כּוֹשֵֽׁל׃","שָׂמַח מִצְרַיִם בְּצֵאתָם כִּֽי־נָפַל פַּחְדָּם עֲלֵיהֶֽם׃","פָּרַשׂ עָנָן לְמָסָךְ וְאֵשׁ לְהָאִיר לָֽיְלָה׃","שָׁאַל וַיָּבֵא שְׂלָו וְלֶחֶם שָׁמַיִם יַשְׂבִּיעֵֽם׃","פָּתַח צוּר וַיָּזוּבוּ מָיִם הָלְכוּ בַּצִּיּוֹת נָהָֽר׃","כִּֽי־זָכַר אֶת־דְּבַר קׇדְשׁוֹ אֶֽת־אַבְרָהָם עַבְדּֽוֹ׃","וַיּוֹצִא עַמּוֹ בְשָׂשׂוֹן בְּרִנָּה אֶת־בְּחִירָֽיו׃","וַיִּתֵּן לָהֶם אַרְצוֹת גּוֹיִם וַעֲמַל לְאֻמִּים יִירָֽשׁוּ׃","בַּעֲבוּר יִשְׁמְרוּ חֻקָּיו וְתוֹרֹתָיו יִנְצֹרוּ הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["hodu laihova kiru vishmo hodi'u va'amim alilotaiv","shiru-lo zamru-lo sichu bekhol-niflotaiv","hithalelu beshem kodsho yismach lev mevakshei Adonai","dirshu Adonai ve'uzo bakshu fanaiv tamid","zikhru niflotaiv asher-asa moftaiv umishptei-fiv","zera' avraham avdo benei ya'akov bechiraiv","hu Adonai eloheinu bekhol-ha'arets mishpataiv","zakhar le'olam berito davar tsiva le'elef dor","asher karat et-avraham ushvu'ato leyischak","vaya'amideah leya'akov lechok leyisra'el berit olam","lemor lekha eten et-erets-kena'an chevel nachalatkhem","bihyotam metei mispar kim'at vegarim bah","vayithalkhu migoy el-goy mimamlakha el-am acher","lo-hiniach adam le'oshkam vayokhach aleihem melakhim","al-tig'u vimshichai velinvi'ai al-tare'u","vayikra ra'av al-ha'arets kol-mate-lechem shavar","shalach lifneihem ish le'eved nimkar yosef","inu vakevel rglyv raglo barzel ba'a nafsho","ad-et bo-devaro imrat Adonai tserafathu","shalach melekh vayatirehu moshel amim vayfatchehu","samo adon leveito umoshel bekhol-kinyano","le'sor saraiv benafsho uzkenaiv yechakem","vayavo yisra'el mitsrayim veya'akov gar be'erets-cham","vayefer et-amo me'od vaya'atsimehu mitsaraiv","hafakh libam lisno amo lehitnakel ba'avadaiv","shalach moshe avdo aharon asher bachar-bo","samu-vam divrei ototaiv umoftim be'erets cham","shalach choshekh vayachshikh velo-maru et-dvaro dvryv","hafakh et-meimeihem ledam vayamet et-degatam","sharats artsam tsefard'im bechadrei malkheihem","amar vayavo arov kinim bekhol-gevulam","natan gishmeihem barad esh lehavot be'artsam","vayakh gafnam ut'enatam vayshaber ets gevulam","amar vayavo arbe veyelek ve'ein mispar","vayokhal kol-esev be'artsam vayokhal peri admatam","vayakh kol-bekhor be'artsam reshit lekhol-onam","vayotsi'em bekhesef vezahav ve'ein bishvataiv koshel","samach mitsrayim betsetam ki-nafal pachdam aleihem","paras anan lemasakh ve'esh leha'ir layla","sha'al vayave selav velechem shamayim yasbi'em","patach tsur vayazuvu mayim halkhu batsiyot nahar","ki-zakhar et-devar kodsho et-avraham avdo","vayotsi amo vesason berina et-bechiraiv","vayiten lahem artsot goyim va'amal le'umim yirashu","ba'avur yishmru chukaiv vetorotaiv yintsoru halelu-yah f"],"en":["O give thanks unto the LORD, call upon His name; Make known His doings among the peoples.","Sing unto Him, sing praises unto Him; Speak ye of all His marvellous works.","Glory ye in His holy name; Let the heart of them rejoice that seek the LORD.","Seek ye the LORD and His strength; Seek His face continually.","Remember His marvellous works that He hath done, His wonders, and the judgments of His mouth;","O ye seed of Abraham His servant, Ye children of Jacob, His chosen ones.","He is the LORD our God; His judgments are in all the earth.","He hath remembered His covenant for ever, The word which He commanded to a thousand generations;","[The covenant] which He made with Abraham, And His oath unto Isaac;","And He established it unto Jacob for a statute, To Israel for an everlasting covenant;","Saying: 'Unto thee will I give the land of Canaan, The lot of your inheritance.'","When they were but a few men in number. Yea, very few, and sojourners in it,","And when they went about from nation to nation, From one kingdom to another people,","He suffered no man to do them wrong, Yea, for their sake He reproved kings:","'Touch not Mine anointed ones, And do My prophets no harm.'","And He called a famine upon the land; He broke the whole staff of bread.","He sent a man before them; Joseph was sold for a servant;","His feet they hurt with fetters, His person was laid in iron;","Until the time that his word came to pass, The word of the LORD tested him.","The king sent and loosed him; Even the ruler of the peoples, and set him free.","He made him lord of his house, And ruler of all his possessions;","To bind his princes at his pleasure, And teach his elders wisdom.","Israel also came into Egypt; And Jacob sojourned in the land of Ham.","And He increased His people greatly, And made them too mighty for their adversaries.","He turned their heart to hate His people, To deal craftily with His servants.","He sent Moses His servant, And Aaron whom He had chosen.","They wrought among them His manifold signs, And wonders in the land of Ham.","He sent darkness, and it was dark; And they rebelled not against His word.",
