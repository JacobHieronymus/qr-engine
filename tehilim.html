"He turned their waters into blood, And slew their fish.","Their land swarmed with frogs, In the chambers of their kings.","He spoke, and there came swarms of flies, And gnats in all their borders.","He gave them hail for rain, And flaming fire in their land.","He smote their vines also and their fig-trees; And broke the trees of their borders.","He spoke, and the locust came, And the canker-worm without number,","And did eat up every herb in their land, And did eat up the fruit of their ground.","He smote also all the first-born in their land, The first-fruits of all their strength.","And He brought them forth with silver and gold; And there was none that stumbled among His tribes.","Egypt was glad when they departed; For the fear of them had fallen upon them.","He spread a cloud for a screen; And fire to give light in the night.","They asked, and He brought quails, And gave them in plenty the bread of heaven.","He opened the rock, and waters gushed out; They ran, a river in the dry places.","For He remembered His holy word Unto Abraham His servant;","And He brought forth His people with joy, His chosen ones with singing.","And He gave them the lands of the nations, And they took the labour of the peoples in possession;","That they might keep His statutes, And observe His laws. Hallelujah."]},{"n":106,"he":["הַלְלוּ־יָהּ הוֹדוּ לַיהֹוָה כִּי־טוֹב כִּי לְעוֹלָם חַסְדּֽוֹ׃","מִי יְמַלֵּל גְּבוּרוֹת יְהֹוָה יַשְׁמִיעַ כׇּל־תְּהִלָּתֽוֹ׃","אַשְׁרֵי שֹׁמְרֵי מִשְׁפָּט עֹשֵׂה צְדָקָה בְכׇל־עֵֽת׃","זׇכְרֵנִי יְהֹוָה בִּרְצוֹן עַמֶּךָ פׇּקְדֵנִי בִּישׁוּעָתֶֽךָ׃","לִרְאוֹת בְּטוֹבַת בְּחִירֶיךָ לִשְׂמֹחַ בְּשִׂמְחַת גּוֹיֶךָ לְהִתְהַלֵּל עִם־נַחֲלָתֶֽךָ׃","חָטָאנוּ עִם־אֲבוֹתֵינוּ הֶעֱוִינוּ הִרְשָֽׁעְנוּ׃","אֲבוֹתֵינוּ בְמִצְרַיִם לֹא־הִשְׂכִּילוּ נִפְלְאוֹתֶיךָ לֹא זָכְרוּ אֶת־רֹב חֲסָדֶיךָ וַיַּמְרוּ עַל־יָם בְּיַם־סֽוּף׃","וַֽיּוֹשִׁיעֵם לְמַעַן שְׁמוֹ לְהוֹדִיעַ אֶת־גְּבוּרָתֽוֹ׃","וַיִּגְעַר בְּיַם־סוּף וַֽיֶּחֱרָב וַיּוֹלִיכֵם בַּתְּהֹמוֹת כַּמִּדְבָּֽר׃","וַֽיּוֹשִׁיעֵם מִיַּד שׂוֹנֵא וַיִּגְאָלֵם מִיַּד אוֹיֵֽב׃","וַיְכַסּוּ־מַיִם צָרֵיהֶם אֶחָד מֵהֶם לֹא נוֹתָֽר׃","וַיַּאֲמִינוּ בִדְבָרָיו יָשִׁירוּ תְּהִלָּתֽוֹ׃","מִהֲרוּ שָׁכְחוּ מַעֲשָׂיו לֹא־חִכּוּ לַעֲצָתֽוֹ׃","וַיִּתְאַוּוּ תַאֲוָה בַּמִּדְבָּר וַיְנַסּוּ־אֵל בִּישִׁימֽוֹן׃","וַיִּתֵּן לָהֶם שֶׁאֱלָתָם וַיְשַׁלַּח רָזוֹן בְּנַפְשָֽׁם׃","וַיְקַנְאוּ לְמֹשֶׁה בַּֽמַּחֲנֶה לְאַהֲרֹן קְדוֹשׁ יְהֹוָֽה׃","תִּפְתַּח־אֶרֶץ וַתִּבְלַע דָּתָן וַתְּכַס עַל־עֲדַת אֲבִירָֽם׃","וַתִּבְעַר־אֵשׁ בַּעֲדָתָם לֶהָבָה תְּלַהֵט רְשָׁעִֽים׃","יַעֲשׂוּ־עֵגֶל בְּחֹרֵב וַיִּשְׁתַּחֲווּ לְמַסֵּכָֽה׃","וַיָּמִירוּ אֶת־כְּבוֹדָם בְּתַבְנִית שׁוֹר אֹכֵל עֵֽשֶׂב׃","שָׁכְחוּ אֵל מוֹשִׁיעָם עֹשֶׂה גְדֹלוֹת בְּמִצְרָֽיִם׃","נִפְלָאוֹת בְּאֶרֶץ חָם נוֹרָאוֹת עַל־יַם־סֽוּף׃","וַיֹּאמֶר לְֽהַשְׁמִידָם לוּלֵי מֹשֶׁה בְחִירוֹ עָמַד בַּפֶּרֶץ לְפָנָיו לְהָשִׁיב חֲמָתוֹ מֵהַשְׁחִֽית׃","וַֽיִּמְאֲסוּ בְּאֶרֶץ חֶמְדָּה לֹא־הֶאֱמִינוּ לִדְבָרֽוֹ׃","וַיֵּרָגְנוּ בְאׇהֳלֵיהֶם לֹא שָׁמְעוּ בְּקוֹל יְהֹוָֽה׃","וַיִּשָּׂא יָדוֹ לָהֶם לְהַפִּיל אוֹתָם בַּמִּדְבָּֽר׃","וּלְהַפִּיל זַרְעָם בַּגּוֹיִם וּלְזָרוֹתָם בָּאֲרָצֽוֹת׃","וַיִּצָּמְדוּ לְבַעַל פְּעוֹר וַיֹּאכְלוּ זִבְחֵי מֵתִֽים׃","וַיַּכְעִיסוּ בְּמַעַלְלֵיהֶם וַתִּפְרׇץ־בָּם מַגֵּפָֽה׃","וַיַּעֲמֹד פִּֽינְחָס וַיְפַלֵּל וַתֵּעָצַר הַמַּגֵּפָֽה׃","וַתֵּחָשֶׁב לוֹ לִצְדָקָה לְדֹר וָדֹר עַד־עוֹלָֽם׃","וַיַּקְצִיפוּ עַל־מֵי מְרִיבָה וַיֵּרַע לְמֹשֶׁה בַּעֲבוּרָֽם׃","כִּי־הִמְרוּ אֶת־רוּחוֹ וַיְבַטֵּא בִּשְׂפָתָֽיו׃","לֹֽא־הִשְׁמִידוּ אֶת־הָעַמִּים אֲשֶׁר אָמַר יְהֹוָה לָהֶֽם׃","וַיִּתְעָרְבוּ בַגּוֹיִם וַֽיִּלְמְדוּ מַעֲשֵׂיהֶֽם׃","וַיַּעַבְדוּ אֶת־עֲצַבֵּיהֶם וַיִּהְיוּ לָהֶם לְמוֹקֵֽשׁ׃","וַיִּזְבְּחוּ אֶת־בְּנֵיהֶם וְאֶת־בְּנוֹתֵיהֶם לַשֵּׁדִֽים׃","וַיִּשְׁפְּכוּ דָם נָקִי דַּם־בְּנֵיהֶם וּֽבְנוֹתֵיהֶם אֲשֶׁר זִבְּחוּ לַעֲצַבֵּי כְנָעַן וַתֶּחֱנַף הָאָרֶץ בַּדָּמִֽים׃","וַיִּטְמְאוּ בְמַעֲשֵׂיהֶם וַיִּזְנוּ בְּמַעַלְלֵיהֶֽם׃","וַיִּחַר־אַף יְהֹוָה בְּעַמּוֹ וַיְתָעֵב אֶת־נַחֲלָתֽוֹ׃","וַיִּתְּנֵם בְּיַד־גּוֹיִם וַֽיִּמְשְׁלוּ בָהֶם שֹׂנְאֵיהֶֽם׃","וַיִּלְחָצוּם אוֹיְבֵיהֶם וַיִּכָּנְעוּ תַּחַת יָדָֽם׃","פְּעָמִים רַבּוֹת יַצִּילֵם וְהֵמָּה יַמְרוּ בַעֲצָתָם וַיָּמֹכּוּ בַּעֲוֺנָֽם׃","וַיַּרְא בַּצַּר לָהֶם בְּשׇׁמְעוֹ אֶת־רִנָּתָֽם׃","וַיִּזְכֹּר לָהֶם בְּרִיתוֹ וַיִּנָּחֵם כְּרֹב חֲסָדָֽו׃","וַיִּתֵּן אוֹתָם לְרַחֲמִים לִפְנֵי כׇּל־שׁוֹבֵיהֶֽם׃","הֽוֹשִׁיעֵנוּ יְהֹוָה אֱלֹהֵינוּ וְקַבְּצֵנוּ מִֽן־הַגּוֹיִם לְהֹדוֹת לְשֵׁם קׇדְשֶׁךָ לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶֽךָ׃","בָּרֽוּךְ־יְהֹוָה אֱלֹהֵי יִשְׂרָאֵל מִן־הָעוֹלָם וְעַד הָעוֹלָם וְאָמַר כׇּל־הָעָם אָמֵן הַֽלְלוּ־יָֽהּ׃"],"lat":["halelu-yah hodu laihova ki-tov ki le'olam chasdo","mi yemalel gevurot Adonai yashmia' kol-tehilato","ashrei shomrei mishpat ose tsedaka vekhol-et","zokhreni Adonai birtson amekha pokdeni bishu'atekha","lirot betovat bechireikha lismoach besimchat goyekha lehithalel im-nachalatekha","chatanu im-avoteinu he'evinu hirsha'nu","avoteinu vemitsrayim lo-hiskilu nifloteikha lo zakhru et-rov chasadeikha vayamru al-yam beyam-suf","vayoshi'em lema'an shemo lehodia' et-gevurato","vayig'ar beyam-suf vayecherav vayolikhem bathomot kamidbar","vayoshi'em miyad sone vayig'alem miyad oyev","vaykhasu-mayim tsareihem echad mehem lo notar","vaya'aminu vidvaraiv yashiru tehilato","miharu shakhchu ma'asaiv lo-chiku la'atsato","vayit'auu ta'ava bamidbar vaynasu-el bishimon","vayiten lahem she'elatam vayshalach razon benafsham","vaykanu lemoshe bamachane le'aharon kedosh Adonai","tiftach-erets vativla' datan vatkhas al-adat aviram","vativ'ar-esh ba'adatam lehava telahet resha'im","ya'asu-egel bechorev vayishtachavu lemasekha","vayamiru et-kevodam betavnit shor okhel esev","shakhchu el moshi'am ose gedolot bemitsrayim","niflaot be'erets cham noraot al-yam-suf","vayomer lehashmidam lulei moshe vechiro amad baperets lefanaiv lehashiv chamato mehashchit","vayim'asu be'erets chemda lo-he'eminu lidvaro","vayeragnu ve'oholeihem lo sham'u bekol Adonai","vayisa yado lahem lehapil otam bamidbar","ulhapil zar'am bagoyim ulzarotam ba'aratsot","vayitsamdu leva'al pe'or vayokhlu zivchei metim","vayakh'isu bema'aleleihem vatifrots-bam magefa","vaya'amod pinchas vayfalel vate'atsar hamagefa","vatechashev lo litsdaka ledor vador ad-olam","vayaktsifu al-mei meriva vayera' lemoshe ba'avuram","ki-himru et-rucho vayvate bisfataiv","lo-hishmidu et-ha'amim asher amar Adonai lahem","vayit'arvu vagoyim vayilmdu ma'aseihem","vaya'avdu et-atsabeihem vayihyu lahem lemokesh","vayizbchu et-beneihem ve'et-benoteihem lashedim","vayishpkhu dam naki dam-beneihem uvnoteihem asher zibchu la'atsabei khena'an vatechenaf ha'arets badamim","vayitmu vema'aseihem vayiznu bema'aleleihem","vayichar-af Adonai be'amo vayta'ev et-nachalato","vayitnem beyad-goyim vayimshlu vahem son'eihem","vayilchatsum oyveihem vayikan'u tachat yadam","pe'amim rabot yatsilem vehema yamru va'atsatam vayamoku ba'aonam","vayar batsar lahem beshom'o et-rinatam","vayizkor lahem berito vayinachem kerov chasadav","vayiten otam lerachamim lifnei kol-shoveihem","hoshi'enu Adonai eloheinu vekabtsenu min-hagoyim lehodot leshem kodshekha lehishtabeach bithilatekha","barukh-Adonai elohei yisra'el min-ha'olam ve'ad ha'olam ve'amar kol-ha'am amen halelu-yah"],"en":["Hallelujah. O give thanks unto the LORD; for He is good; for His mercy endureth for ever.","Who can express the mighty acts of the LORD, or make all His praise to be heard?","Happy are they that keep justice, that do righteousness at all times.","Remember me, O LORD, when Thou favourest Thy people; O think of me at Thy salvation;","That I may behold the prosperity of Thy chosen, that I may rejoice in the gladness of Thy nation, that I may glory with Thine inheritance.","We have sinned with our fathers, we have done iniquitously, we have dealt wickedly.","Our fathers in Egypt gave no heed unto Thy wonders; they remembered not the multitude of Thy mercies; but were rebellious at the sea, even at the Red Sea.","Nevertheless He saved them for His name's sake, that He might make His mighty power to be known.","And He rebuked the Red Sea, and it was dried up; and He led them through the depths, as through a wilderness.","And He saved them from the hand of him that hated them, And redeemed them from the hand of the enemy.","And the waters covered their adversaries; There was not one of them left.","Then believed they His words; They sang His praise.","They soon forgot His works; They waited not for His counsel;","But lusted exceedingly in the wilderness, And tried God in the desert.","And He gave them their request; But sent leanness into their soul.","They were jealous also of Moses in the camp, And of Aaron the holy one of the LORD.","The earth opened and swallowed up Dathan, And covered the company of Abiram.","And a fire was kindled in their company; The flame burned up the wicked.","They made a calf in Horeb, And worshipped a molten image.","Thus they exchanged their glory For the likeness of an ox that eateth grass.","They forgot God their saviour, Who had done great things in Egypt;","Wondrous works in the land of Ham, Terrible things by the Red Sea.","Therefore He said that He would destroy them, Had not Moses His chosen stood before Him in the breach, To turn back His wrath, lest He should destroy them.","Moreover, they scorned the desirable land, They believed not His word;","And they murmured in their tents, They hearkened not unto the voice of the LORD.","Therefore He swore concerning them, That He would overthrow them in the wilderness;","And that He would cast out their seed among the nations, And scatter them in the lands.","They joined themselves also unto Baal of Peor, And ate the sacrifices of the dead.","Thus they provoked Him with their doings, And the plague broke in upon them.","Then stood up Phinehas, and wrought judgment, And so the plague was stayed.","And that was counted unto him for righteousness, Unto all generations for ever.","They angered Him also at the waters of Meribah, And it went ill with Moses because of them;","For they embittered his spirit, And he spoke rashly with his lips.","They did not destroy the peoples, As the LORD commanded them;","But mingled themselves with the nations, And learned their works;","And they served their idols, Which became a snare unto them;","Yea, they sacrificed their sons and their daughters unto demons,","And shed innocent blood, even the blood of their sons and of their daughters, Whom they sacrificed unto the idols of Canaan; And the land was polluted with blood.","Thus were they defiled with their works, And went astray in their doings.","Therefore was the wrath of the LORD kindled against His people, And He abhorred His inheritance.","And He gave them into the hand of the nations; And they that hated them ruled over them.","Their enemies also oppressed them, And they were subdued under their hand.","Many times did He deliver them; But they were rebellious in their counsel, And sank low through their iniquity.","Nevertheless He looked upon their distress, When He heard their cry;","And He remembered for them His covenant, And repented according to the multitude of His mercies.","He made them also to be pitied Of all those that carried them captive.","Save us, O LORD our God, And gather us from among the nations, That we may give thanks unto Thy holy name, That we may triumph in Thy praise.","Blessed be the LORD, the God of Israel, from everlasting even to everlasting, and let all the people say: 'Amen.' Hallelujah."]},{"n":107,"he":["הֹדוּ לַיהֹוָה כִּי־טוֹב כִּי לְעוֹלָם חַסְדּֽוֹ׃","יֹאמְרוּ גְּאוּלֵי יְהֹוָה אֲשֶׁר גְּאָלָם מִיַּד־צָֽר׃","וּֽמֵאֲרָצוֹת קִבְּצָם מִמִּזְרָח וּמִֽמַּעֲרָב מִצָּפוֹן וּמִיָּֽם׃","תָּעוּ בַמִּדְבָּר בִּישִׁימוֹן דָּרֶךְ עִיר מוֹשָׁב לֹא מָצָֽאוּ׃","רְעֵבִים גַּם־צְמֵאִים נַפְשָׁם בָּהֶם תִּתְעַטָּֽף׃","וַיִּצְעֲקוּ אֶל־יְהֹוָה בַּצַּר לָהֶם מִמְּצוּקוֹתֵיהֶם יַצִּילֵֽם׃","וַֽיַּדְרִיכֵם בְּדֶרֶךְ יְשָׁרָה לָלֶכֶת אֶל־עִיר מוֹשָֽׁב׃","יוֹדוּ לַיהֹוָה חַסְדּוֹ וְנִפְלְאוֹתָיו לִבְנֵי אָדָֽם׃","כִּֽי־הִשְׂבִּיעַ נֶפֶשׁ שֹׁקֵקָה וְנֶפֶשׁ רְעֵבָה מִלֵּא־טֽוֹב׃","יֹשְׁבֵי חֹשֶׁךְ וְצַלְמָוֶת אֲסִירֵי עֳנִי וּבַרְזֶֽל׃","כִּֽי־הִמְרוּ אִמְרֵי־אֵל וַעֲצַת עֶלְיוֹן נָאָֽצוּ׃","וַיַּכְנַע בֶּעָמָל לִבָּם כָּשְׁלוּ וְאֵין עֹזֵֽר׃","וַיִּזְעֲקוּ אֶל־יְהֹוָה בַּצַּר לָהֶם מִמְּצֻקוֹתֵיהֶם יוֹשִׁיעֵֽם׃","יוֹצִיאֵם מֵחֹשֶׁךְ וְצַלְמָוֶת וּמוֹסְרוֹתֵיהֶם יְנַתֵּֽק׃","יוֹדוּ לַיהֹוָה חַסְדּוֹ וְנִפְלְאוֹתָיו לִבְנֵי אָדָֽם׃","כִּי־שִׁבַּר דַּלְתוֹת נְחֹשֶׁת וּבְרִיחֵי בַרְזֶל גִּדֵּֽעַ׃","אֱוִלִים מִדֶּרֶךְ פִּשְׁעָם וּֽמֵעֲוֺנֹתֵיהֶם יִתְעַנּֽוּ׃","כׇּל־אֹכֶל תְּתַעֵב נַפְשָׁם וַיַּגִּיעוּ עַד־שַׁעֲרֵי מָֽוֶת׃","וַיִּזְעֲקוּ אֶל־יְהֹוָה בַּצַּר לָהֶם מִמְּצֻקוֹתֵיהֶם יוֹשִׁיעֵֽם׃","יִשְׁלַח דְּבָרוֹ וְיִרְפָּאֵם וִימַלֵּט מִשְּׁחִֽיתוֹתָֽם׃","יוֹדוּ לַיהֹוָה חַסְדּוֹ וְנִפְלְאוֹתָיו לִבְנֵי אָדָֽם׃","וְיִזְבְּחוּ זִבְחֵי תוֹדָה וִיסַפְּרוּ מַעֲשָׂיו בְּרִנָּֽה׃","׆ יוֹרְדֵי הַיָּם בׇּאֳנִיּוֹת עֹשֵׂי מְלָאכָה בְּמַיִם רַבִּֽים׃","׆ הֵמָּה רָאוּ מַעֲשֵׂי יְהֹוָה וְנִפְלְאוֹתָיו בִּמְצוּלָֽה׃","׆ וַיֹּאמֶר וַֽיַּעֲמֵד רוּחַ סְעָרָה וַתְּרוֹמֵם גַּלָּֽיו׃","׆ יַעֲלוּ שָׁמַיִם יֵרְדוּ תְהוֹמוֹת נַפְשָׁם בְּרָעָה תִתְמוֹגָֽג׃","׆ יָחוֹגּוּ וְיָנוּעוּ כַּשִּׁכּוֹר וְכׇל־חׇכְמָתָם תִּתְבַּלָּֽע׃","׆ וַיִּצְעֲקוּ אֶל־יְהֹוָה בַּצַּר לָהֶם וּֽמִמְּצוּקֹתֵיהֶם יוֹצִיאֵֽם׃","יָקֵם סְעָרָה לִדְמָמָה וַיֶּחֱשׁוּ גַּלֵּיהֶֽם׃","וַיִּשְׂמְחוּ כִֽי־יִשְׁתֹּקוּ וַיַּנְחֵם אֶל־מְחוֹז חֶפְצָֽם׃","יוֹדוּ לַיהֹוָה חַסְדּוֹ וְנִפְלְאוֹתָיו לִבְנֵי אָדָֽם׃","וִֽירוֹמְמוּהוּ בִּקְהַל־עָם וּבְמוֹשַׁב זְקֵנִים יְהַלְלֽוּהוּ׃","יָשֵׂם נְהָרוֹת לְמִדְבָּר וּמֹצָאֵי מַיִם לְצִמָּאֽוֹן׃","אֶרֶץ פְּרִי לִמְלֵחָה מֵרָעַת יוֹשְׁבֵי בָֽהּ׃","יָשֵׂם מִדְבָּר לַאֲגַם־מַיִם וְאֶרֶץ צִיָּה לְמֹצָאֵי מָֽיִם׃","וַיּוֹשֶׁב שָׁם רְעֵבִים וַיְכוֹנְנוּ עִיר מוֹשָֽׁב׃","וַיִּזְרְעוּ שָׂדוֹת וַיִּטְּעוּ כְרָמִים וַיַּעֲשׂוּ פְּרִי תְבוּאָֽה׃","וַיְבָרְכֵם וַיִּרְבּוּ מְאֹד וּבְהֶמְתָּם לֹא יַמְעִֽיט׃","וַיִּמְעֲטוּ וַיָּשֹׁחוּ מֵעֹצֶר רָעָה וְיָגֽוֹן׃","׆ שֹׁפֵךְ בּוּז עַל־נְדִיבִים וַיַּתְעֵם בְּתֹהוּ לֹא־דָֽרֶךְ׃","וַיְשַׂגֵּב אֶבְיוֹן מֵעוֹנִי וַיָּשֶׂם כַּצֹּאן מִשְׁפָּחֽוֹת׃","יִרְאוּ יְשָׁרִים וְיִשְׂמָחוּ וְכׇל־עַוְלָה קָפְצָה פִּֽיהָ׃","מִי־חָכָם וְיִשְׁמׇר־אֵלֶּה וְיִתְבּוֹנְנוּ חַֽסְדֵי יְהֹוָֽה׃ {פ}"],"lat":["hodu laihova ki-tov ki le'olam chasdo","yomru geulei Adonai asher ge'alam miyad-tsar","ume'aratsot kibtsam mimizrach umima'arav mitsafon umiyam","ta'u vamidbar bishimon darekh ir moshav lo matsau","re'evim gam-tseme'im nafsham bahem tit'ataf","vayits'aku el-Adonai batsar lahem mimtsukoteihem yatsilem","vayadrikhem bederekh yeshara lalekhet el-ir moshav","yodu laihova chasdo veniflotaiv livnei adam","ki-hisbia' nefesh shokeka venefesh re'eva mile-tov","yoshvei choshekh vetsalmavet asirei oni uvarzel","ki-himru imrei-el va'atsat elyon na'atsu","vayakhna' be'amal libam kashlu ve'ein ozer","vayiz'aku el-Adonai batsar lahem mimtsukoteihem yoshi'em","yotsi'em mechoshekh vetsalmavet umosroteihem yenatek","yodu laihova chasdo veniflotaiv livnei adam","ki-shibar daltot nechoshet uvrichei varzel gidea'","evilim miderekh pish'am ume'aonoteihem yit'anu","kol-okhel teta'ev nafsham vayagi'u ad-sha'arei mavet","vayiz'aku el-Adonai batsar lahem mimtsukoteihem yoshi'em","yishlach devaro veyirpa'em vimalet mishchitotam","yodu laihova chasdo veniflotaiv livnei adam","veyizbchu zivchei toda visapru ma'asaiv berina","yordei hayam bo'oniyot osei melakha bemayim rabim","hema rau ma'asei Adonai veniflotaiv bimtsula","vayomer vaya'amed ruach se'ara vatromem galaiv","ya'alu shamayim yerdu tehomot nafsham bera'a titmogag","yachogu veyanu'u kashikor vekhol-chokhmatam titbala'","vayits'aku el-Adonai batsar lahem umimtsukoteihem yotsi'em","yakem se'ara lidmama vayecheshu galeihem","vayismchu khi-yishtoku vayanchem el-mechoz cheftsam","yodu laihova chasdo veniflotaiv livnei adam","viromemuhu bikhal-am uvmoshav zekenim yehaleluhu","yasem neharot lemidbar umotsa'ei mayim letsimaon","erets peri limlecha mera'at yoshvei vah","yasem midbar la'agam-mayim ve'erets tsiya lemotsa'ei mayim","vayoshev sham re'evim vaykhonenu ir moshav","vayizr'u sadot vayit'u kheramim vaya'asu peri tevu'a","vayvarkhem vayirbu me'od uvhemtam lo yam'it","vayim'atu vayashochu me'otser ra'a veyagon","shofekh buz al-nedivim vayat'em betohu lo-darekh","vaysagev evyon me'oni vayasem katson mishpachot","yiru yesharim veyismachu vekhol-avla kaftsa piah","mi-chakham veyishmor-ele veyitbonenu chasdei Adonai f"],"en":["'O give thanks unto the LORD, for He is good, For His mercy endureth for ever.'","So let the redeemed of the LORD say, Whom He hath redeemed from the hand of the adversary;","And gathered them out of the lands, From the east and from the west, From the north and from the sea.","They wandered in the wilderness in a desert way; They found no city of habitation.","Hungry and thirsty, Their soul fainted in them.","Then they cried unto the LORD in their trouble, And He delivered them out of their distresses.","And He led them by a straight way, That they might go to a city of habitation.","Let them give thanks unto the LORD for His mercy, And for His wonderful works to the children of men!","For He hath satisfied the longing soul, And the hungry soul He hath filled with good.","Such as sat in darkness and in the shadow of death, Being bound in affliction and iron—","Because they rebelled against the words of God, And contemned the counsel of the Most High.","Therefore He humbled their heart with travail, They stumbled, and there was none to help—","They cried unto the LORD in their trouble, And He saved them out of their distresses.","He brought them out of darkness and the shadow of death, And broke their bands in sunder. .","Let them give thanks unto the LORD for His mercy, And for His wonderful works to the children of men!","For He hath broken the gates of brass, And cut the bars of iron in sunder.","Crazed because of the way of their transgression, And afflicted because of their iniquities—","Their soul abhorred all manner of food, And they drew near unto the gates of death—","They cried unto the LORD in their trouble, And He saved them out of their distresses;","He sent His word, and healed them, And delivered them from their graves.","Let them give thanks unto the LORD for His mercy, And for His wonderful works to the children of men!","And let them offer the sacrifices of thanksgiving, And declare His works with singing.","They that go down to the sea in ships, That do business in great waters—","These saw the works of the LORD, And His wonders in the deep;","For He commanded, and raised the stormy wind, Which lifted up the waves thereof;","They mounted up to the heaven, they went down to the deeps; Their soul melted away because of trouble;","They reeled to and fro, and staggered like a drunken man, And all their wisdom was swallowed up—","They cried unto the LORD in their trouble, And He brought them out of their distresses.","He made the storm a calm, So that the waves thereof were still.","Then were they glad because they were quiet, And He led them unto their desired haven.","Let them give thanks unto the LORD for His mercy, And for His wonderful works to the children of men!","Let them exalt Him also in the assembly of the people, And praise Him in the seat of the elders.","He turneth rivers into a wilderness, And watersprings into a thirsty ground;","A fruitful land into a salt waste, For the wickedness of them that dwell therein.","He turneth a wilderness into a pool of water, And a dry land into watersprings.","And there He maketh the hungry to dwell, And they establish a city of habitation;","And sow fields, and plant vineyards, Which yield fruits of increase.","He blesseth them also, so that they are multiplied greatly, And suffereth not their cattle to decrease.","Again, they are minished and dwindle away Through oppression of evil and sorrow.","He poureth contempt upon princes, And causeth them to wander in the waste, where there is no way.","Yet setteth He the needy on high from affliction, And maketh his families like a flock.","The upright see it, and are glad; And all iniquity stoppeth her mouth.","Whoso is wise, let him observe these things, And let them consider the mercies of the LORD."]},{"n":108,"he":["שִׁיר מִזְמוֹר לְדָוִֽד׃","נָכוֹן לִבִּי אֱלֹהִים אָשִׁירָה וַאֲזַמְּרָה אַף־כְּבוֹדִֽי׃","עוּרָֽה הַנֵּבֶל וְכִנּוֹר אָעִירָה שָּֽׁחַר׃","אוֹדְךָ בָעַמִּים יְהֹוָה וַאֲזַמֶּרְךָ בַּלְאֻמִּֽים׃","כִּי־גָדוֹל מֵעַל־שָׁמַיִם חַסְדֶּךָ וְֽעַד־שְׁחָקִים אֲמִתֶּֽךָ׃","רוּמָה עַל־שָׁמַיִם אֱלֹהִים וְעַל כׇּל־הָאָרֶץ כְּבוֹדֶֽךָ׃","לְמַעַן יֵחָלְצוּן יְדִידֶיךָ הוֹשִׁיעָה יְמִֽינְךָ וַעֲנֵֽנִי׃","אֱלֹהִים דִּבֶּר בְּקׇדְשׁוֹ אֶעְלֹזָה אֲחַלְּקָה שְׁכֶם וְעֵמֶק סֻכּוֹת אֲמַדֵּֽד׃","לִי גִלְעָד לִי מְנַשֶּׁה וְאֶפְרַיִם מָעוֹז רֹאשִׁי יְהוּדָה מְחֹקְקִֽי׃","מוֹאָב סִיר רַחְצִי עַל־אֱדוֹם אַשְׁלִיךְ נַעֲלִי עֲלֵי־פְלֶשֶׁת אֶתְרוֹעָֽע׃","מִי יֹבִלֵנִי עִיר מִבְצָר מִי נָחַנִי עַד־אֱדֽוֹם׃","הֲלֹֽא־אֱלֹהִים זְנַחְתָּנוּ וְֽלֹא־תֵצֵא אֱלֹהִים בְּצִבְאֹתֵֽינוּ׃","הָבָה־לָּנוּ עֶזְרָת מִצָּר וְשָׁוְא תְּשׁוּעַת אָדָֽם׃","בֵּאלֹהִים נַֽעֲשֶׂה־חָיִל וְהוּא יָבוּס צָרֵֽינוּ׃ {פ}"],"lat":["shir mizmor ledavid","nakhon libi elohim ashira va'azamra af-kevodi","ura hanevel vekhinor a'ira shachar","odkha va'amim Adonai va'azamerkha bal'umim","ki-gadol me'al-shamayim chasdekha ve'ad-shechakim amitekha","ruma al-shamayim elohim ve'al kol-ha'arets kevodekha","lema'an yechaltsun yedideikha hoshi'a yeminkha va'aneni","elohim diber bekodsho e'loza achalka shekhem ve'emek sukot amaded","li gil'ad li menashe ve'efrayim ma'oz roshi yehuda mechokeki","mo'av sir rachtsi al-edom ashlikh na'ali alei-feleshet etro'a'","mi yovileni ir mivtsar mi nachani ad-edom","halo-elohim zenachtanu velo-tetse elohim betsiv'oteinu","hava-lanu ezrat mitsar veshav teshu'at adam","belohim na'ase-chayil vehu yavus tsareinu f"],"en":["A Song, a Psalm of David.","My heart is steadfast, O God; I will sing, yea, I will sing praises, even with my glory.","Awake, psaltery and harp; I will awake the dawn.","I will give thanks unto Thee, O LORD, among the peoples; And I will sing praises unto Thee among the nations.","For Thy mercy is great above the heavens, And Thy truth reacheth unto the skies.","Be Thou exalted, O God, above the heavens; And Thy glory be above all the earth.","That Thy beloved may be delivered, Save with Thy right hand, and answer me.","God spoke in His holiness, that I would exult; That I would divide Shechem, and mete out the valley of Succoth.","Gilead is mine, Manasseh is mine; Ephraim also is the defence of my head; Judah is my sceptre.","Moab is my washpot; Upon Edom do I cast my shoe; Over Philistia do I cry aloud.","Who will bring me into the fortified city? Who will lead me unto Edom?","Hast not Thou cast us off, O God? And Thou goest not forth, O God, with our hosts?","Give us help against the adversary; For vain is the help of man.","Through God we shall do valiantly; For He it is that will tread down our adversaries."]},{"n":109,"he":["לַמְנַצֵּחַ לְדָוִד מִזְמוֹר אֱלֹהֵי תְהִלָּתִי אַֽל־תֶּחֱרַֽשׁ׃","כִּי פִי רָשָׁע וּֽפִי־מִרְמָה עָלַי פָּתָחוּ דִּבְּרוּ אִתִּי לְשׁוֹן שָֽׁקֶר׃","וְדִבְרֵי שִׂנְאָה סְבָבוּנִי וַיִּֽלָּחֲמוּנִי חִנָּֽם׃","תַּֽחַת־אַהֲבָתִי יִשְׂטְנוּנִי וַאֲנִי תְפִלָּֽה׃","וַיָּשִׂימוּ עָלַי רָעָה תַּחַת טוֹבָה וְשִׂנְאָה תַּחַת אַהֲבָתִֽי׃","הַפְקֵד עָלָיו רָשָׁע וְשָׂטָן יַעֲמֹד עַל־יְמִינֽוֹ׃","בְּהִשָּׁפְטוֹ יֵצֵא רָשָׁע וּתְפִלָּתוֹ תִּֽהְיֶה לַחֲטָאָֽה׃","יִֽהְיוּ־יָמָיו מְעַטִּים פְּקֻדָּתוֹ יִקַּח אַחֵֽר׃","יִֽהְיוּ־בָנָיו יְתוֹמִים וְאִשְׁתּוֹ אַלְמָנָֽה׃","וְנוֹעַ יָנוּעוּ בָנָיו וְשִׁאֵלוּ וְדָרְשׁוּ מֵחׇרְבֽוֹתֵיהֶֽם׃","יְנַקֵּשׁ נוֹשֶׁה לְכׇל־אֲשֶׁר־לוֹ וְיָבֹזּוּ זָרִים יְגִיעֽוֹ׃","אַל־יְהִי־לוֹ מֹשֵׁךְ חָסֶד וְֽאַל־יְהִי חוֹנֵן לִֽיתוֹמָֽיו׃","יְהִי־אַחֲרִיתוֹ לְהַכְרִית בְּדוֹר אַחֵר יִמַּח שְׁמָֽם׃","יִזָּכֵר עֲוֺן אֲבֹתָיו אֶל־יְהֹוָה וְחַטַּאת אִמּוֹ אַל־תִּמָּֽח׃","יִהְיוּ נֶגֶד־יְהֹוָה תָּמִיד וְיַכְרֵת מֵאֶרֶץ זִכְרָֽם׃","יַעַן אֲשֶׁר לֹא זָכַר עֲשׂוֹת חָסֶד וַיִּרְדֹּף אִישׁ־עָנִי וְאֶבְיוֹן וְנִכְאֵה לֵבָב לְמוֹתֵֽת׃","וַיֶּאֱהַב קְלָלָה וַתְּבוֹאֵהוּ וְֽלֹא־חָפֵץ בִּבְרָכָה וַתִּרְחַק מִמֶּֽנּוּ׃","וַיִּלְבַּשׁ קְלָלָה כְּמַדּוֹ וַתָּבֹא כַמַּיִם בְּקִרְבּוֹ וְכַשֶּׁמֶן בְּעַצְמוֹתָֽיו׃","תְּהִי־לוֹ כְּבֶגֶד יַעְטֶה וּלְמֵזַח תָּמִיד יַחְגְּרֶֽהָ׃","זֹאת פְּעֻלַּת שֹׂטְנַי מֵאֵת יְהֹוָה וְהַדֹּבְרִים רָע עַל־נַפְשִֽׁי׃","וְאַתָּה יֱהֹוִה אֲדֹנָי עֲֽשֵׂה־אִתִּי לְמַעַן שְׁמֶךָ כִּי־טוֹב חַסְדְּךָ הַצִּילֵֽנִי׃","כִּי־עָנִי וְאֶבְיוֹן אָנֹכִי וְלִבִּי חָלַל בְּקִרְבִּֽי׃","כְּצֵל־כִּנְטוֹתוֹ נֶהֱלָכְתִּי נִנְעַרְתִּי כָּאַרְבֶּֽה׃","בִּרְכַּי כָּשְׁלוּ מִצּוֹם וּבְשָׂרִי כָּחַשׁ מִשָּֽׁמֶן׃","וַאֲנִי הָיִיתִי חֶרְפָּה לָהֶם יִרְאוּנִי יְנִיעוּן רֹאשָֽׁם׃","עׇזְרֵנִי יְהֹוָה אֱלֹהָי הוֹשִׁיעֵנִי כְחַסְדֶּֽךָ׃","וְֽיֵדְעוּ כִּי־יָדְךָ זֹּאת אַתָּה יְהֹוָה עֲשִׂיתָֽהּ׃","יְקַֽלְלוּ־הֵמָּה וְאַתָּה תְבָרֵךְ קָמוּ וַיֵּבֹשׁוּ וְֽעַבְדְּךָ יִשְׂמָֽח׃","יִלְבְּשׁוּ שׂוֹטְנַי כְּלִמָּה וְיַעֲטוּ כַמְעִיל בׇּשְׁתָּֽם׃","אוֹדֶה יְהֹוָה מְאֹד בְּפִי וּבְתוֹךְ רַבִּים אֲהַלְלֶֽנּוּ׃","כִּֽי־יַעֲמֹד לִימִין אֶבְיוֹן לְהוֹשִׁיעַ מִשֹּׁפְטֵי נַפְשֽׁוֹ׃ {פ}"],"lat":["lamnatseach ledavid mizmor elohei tehilati al-techerash","ki fi rasha' ufi-mirma alai patachu dibru iti leshon shaker","vedivrei sin'a sevavuni vayilachamuni chinam","tachat-ahavati yistnuni va'ani tefila","vayasimu alai ra'a tachat tova vesin'a tachat ahavati","hafked alaiv rasha' vesatan ya'amod al-yemino","behishafto yetse rasha' utfilato tihye lachata'a","yihyu-yamaiv me'atim pekudato yikach acher","yihyu-vanaiv yetomim ve'ishto almana","venoa' yanu'u vanaiv veshi'elu vedarshu mechorvoteihem","yenakesh noshe lekhol-asher-lo veyavozu zarim yegi'o","al-yehi-lo moshekh chased ve'al-yehi chonen litomaiv","yehi-acharito lehakhrit bedor acher yimach shemam","yizakher aon avotaiv el-Adonai vechatat imo al-timach","yihyu neged-Adonai tamid veyakhret me'erets zikhram","ya'an asher lo zakhar asot chased vayirdof ish-ani ve'evyon venikh'e levav lemotet","vaye'ehav kelala vatvo'ehu velo-chafets bivrakha vatirchak mimenu","vayilbash kelala kemado vatavo khamayim bekirbo vekhashemen be'atsmotaiv","tehi-lo keveged ya'te ulmezach tamid yachgreah","zot pe'ulat sotnai me'et Adonai vehadovrim ra' al-nafshi","ve'ata Adonai adonai ase-iti lema'an shemekha ki-tov chasdkha hatsileni","ki-ani ve'evyon anokhi velibi chalal bekirbi","ketsel-kintoto nehelakhti nin'arti ka'arbe","birkai kashlu mitsom uvsari kachash mishamen","va'ani hayiti cherpa lahem yiruni yeni'un rosham","ozreni Adonai elohai hoshi'eni khechasdekha","veyed'u ki-yadkha zot ata Adonai asitah","yekalelu-hema ve'ata tevarekh kamu vayevoshu ve'avdkha yismach","yilbshu sotnai kelima veya'atu kham'il boshtam","ode Adonai me'od befi uvtokh rabim ahalelenu","ki-ya'amod limin evyon lehoshia' mishoftei nafsho f"],"en":["For the Leader. A Psalm of David. O God of my praise, keep not silence;","For the mouth of the wicked and the mouth of deceit have they opened against me; They have spoken unto me with a lying tongue.","They compassed me about also with words of hatred, And fought against me without a cause.","In return for my love they are my adversaries; But I am all prayer.","And they have laid upon me evil for good, And hatred for my love:","’Set Thou a wicked man over him; And let an adversary stand at his right hand.","When he is judged, let him go forth condemned; And let his prayer be turned into sin.","Let his days be few; Let another take his charge.","Let his children be fatherless, And his wife a widow.","Let his children be vagabonds, and beg; And let them seek their bread out of their desolate places.","Let the creditor distrain all that he hath; And let strangers make spoil of his labour.","Let there be none to extend kindness unto him; Neither let there be any to be gracious unto his fatherless children.","Let his posterity be cut off; In the generation following let their name be blotted out.","Let the iniquity of his fathers be brought to remembrance unto the LORD; And let not the sin of his mother be blotted out.","Let them be before the LORD continually, That He may cut off the memory of them from the earth.","Because that he remembered not to do kindness, But persecuted the poor and needy man, And the broken in heart he was ready to slay.","Yea, he loved cursing, and it came unto him; And he delighted not in blessing, and it is far from him.","He clothed himself also with cursing as with his raiment, And it is come into his inward parts like water, And like oil into his bones.","Let it be unto him as the garment which he putteth on, And for the girdle wherewith he is girded continually.'","This would mine adversaries effect from the LORD, And they that speak evil against my soul.","But Thou, O GOD the Lord, deal with me for Thy name's sake; Because Thy mercy is good, deliver Thou me.","For I am poor and needy, And my heart is wounded within me.","I am gone like the shadow when it lengtheneth; I am shaken off as the locust.","My knees totter through fasting; And my flesh is lean, and hath no fatness.","I am become also a taunt unto them; When they see me, they shake their head.","Help me, O LORD my God; O save me according to Thy mercy;","That they may know that this is Thy hand; That Thou, LORD, hast done it.","Let them curse, but bless Thou; When they arise, they shall be put to shame, but Thy servant shall rejoice.","Mine adversaries shall be clothed with confusion, And shall put on their own shame as a robe.","I will give great thanks unto the LORD with my mouth; Yea, I will praise Him among the multitude;","Because He standeth at the right hand of the needy, To save him from them that judge his soul."]},{"n":110,"he":["לְדָוִד מִזְמוֹר נְאֻם יְהֹוָה לַֽאדֹנִי שֵׁב לִֽימִינִי עַד־אָשִׁית אֹיְבֶיךָ הֲדֹם לְרַגְלֶֽיךָ׃","מַטֵּֽה־עֻזְּךָ יִשְׁלַח יְהֹוָה מִצִּיּוֹן רְדֵה בְּקֶרֶב אֹיְבֶֽיךָ׃","עַמְּךָ נְדָבֹת בְּיוֹם חֵילֶךָ בְּֽהַדְרֵי־קֹדֶשׁ מֵרֶחֶם מִשְׁחָר לְךָ טַל יַלְדֻתֶֽיךָ׃","נִשְׁבַּע יְהֹוָה וְלֹא יִנָּחֵם אַתָּֽה־כֹהֵן לְעוֹלָם עַל־דִּבְרָתִי מַלְכִּי־צֶֽדֶק׃","אֲדֹנָי עַל־יְמִֽינְךָ מָחַץ בְּיוֹם־אַפּוֹ מְלָכִֽים׃","יָדִין בַּגּוֹיִם מָלֵא גְוִיּוֹת מָחַץ רֹאשׁ עַל־אֶרֶץ רַבָּֽה׃","מִנַּחַל בַּדֶּרֶךְ יִשְׁתֶּה עַל־כֵּן יָרִים רֹֽאשׁ׃ {פ}"],"lat":["ledavid mizmor ne'um Adonai ladoni shev limini ad-ashit oyveikha hadom leragleikha","mate-uzkha yishlach Adonai mitsiyon rede bekerev oyveikha","amkha nedavot beiom cheilekha behadrei-kodesh merechem mishchar lekha tal yalduteikha","nishba' Adonai velo yinachem ata-khohen le'olam al-divrati malki-tsedek","adonai al-yeminkha machats beiom-apo melakhim","yadin bagoyim male geviyot machats rosh al-erets raba","minachal baderekh yishte al-ken yarim rosh f"],"en":["A Psalm of David. The LORD saith unto my lord: ‘Sit thou at My right hand, until I make thine enemies thy footstool.'","The rod of Thy strength the LORD will send out of Zion: 'Rule thou in the midst of thine enemies.'","Thy people offer themselves willingly in the day of thy warfare; in adornments of holiness, from the womb of the dawn, Thine is the dew of thy youth.","The LORD hath sworn, and will not repent: 'Thou art a priest for ever After the manner of Melchizedek.'","The Lord at thy right hand Doth crush kings in the day of His wrath.","He will judge among the nations; He filleth it with the dead bodies, He crusheth the head over a wide land.","He will drink of the brook in the way; Therefore will he lift up the head."]},{"n":111,"he":["הַלְלוּ־יָהּ אוֹדֶה יְהֹוָה בְּכׇל־לֵבָב בְּסוֹד יְשָׁרִים וְעֵדָֽה׃","גְּדֹלִים מַעֲשֵׂי יְהֹוָה דְּרוּשִׁים לְכׇל־חֶפְצֵיהֶֽם׃","הוֹד־וְהָדָר פׇּעֳלוֹ וְצִדְקָתוֹ עֹמֶדֶת לָעַֽד׃","זֵכֶר עָשָׂה לְנִפְלְאוֹתָיו חַנּוּן וְרַחוּם יְהֹוָֽה׃","טֶרֶף נָתַן לִירֵאָיו יִזְכֹּר לְעוֹלָם בְּרִיתֽוֹ׃","כֹּחַ מַעֲשָׂיו הִגִּיד לְעַמּוֹ לָתֵת לָהֶם נַחֲלַת גּוֹיִֽם׃","מַעֲשֵׂי יָדָיו אֱמֶת וּמִשְׁפָּט נֶאֱמָנִים כׇּל־פִּקּוּדָֽיו׃","סְמוּכִים לָעַד לְעוֹלָם עֲשׂוּיִם בֶּאֱמֶת וְיָשָֽׁר׃","פְּדוּת שָׁלַח לְעַמּוֹ צִוָּֽה־לְעוֹלָם בְּרִיתוֹ קָדוֹשׁ וְנוֹרָא שְׁמֽוֹ׃","רֵאשִׁית חׇכְמָה יִרְאַת יְהֹוָה שֵׂכֶל טוֹב לְכׇל־עֹֽשֵׂיהֶם תְּהִלָּתוֹ עֹמֶדֶת לָעַֽד׃ {פ}"],"lat":["halelu-yah ode Adonai bekhol-levav besod yesharim ve'eda","gedolim ma'asei Adonai derushim lekhol-cheftseihem","hod-vehadar po'olo vetsidkato omedet la'ad","zekher asa leniflotaiv chanun verachum Adonai","teref natan lire'aiv yizkor le'olam berito","koach ma'asaiv higid le'amo latet lahem nachalat goyim","ma'asei yadaiv emet umishpat ne'emanim kol-pikudaiv","semukhim la'ad le'olam asuyim be'emet veyashar","pedut shalach le'amo tsiva-le'olam berito kadosh venora shemo","reshit chokhma yir'at Adonai sekhel tov lekhol-oseihem tehilato omedet la'ad f"],"en":["Hallelujah. I will give thanks unto the LORD with my whole heart, . In the council of the upright, and in the congregation.","The works of the LORD are great, Sought out of all them that have delight therein.","His work is glory and majesty; And His righteousness endureth for ever.","He hath made a memorial for His wonderful works; The LORD is gracious and full of compassion.","He hath given food unto them that fear Him; He will ever be mindful of His covenant.","He hath declared to His people the power of His works, In giving them the heritage of the nations.","The works of His hands are truth and justice; All His precepts are sure.","They are established for ever and ever, They are done in truth and uprightness.","He hath sent redemption unto His people; He hath commanded His covenant for ever; Holy and awful is His name.","The fear of the LORD is the beginning of wisdom; A good understanding have all they that do thereafter; His praise endureth for ever."]},{"n":112,"he":["הַלְלוּ־יָהּ אַשְׁרֵי־אִישׁ יָרֵא אֶת־יְהֹוָה בְּמִצְוֺתָיו חָפֵץ מְאֹֽד׃","גִּבּוֹר בָּאָרֶץ יִהְיֶה זַרְעוֹ דּוֹר יְשָׁרִים יְבֹרָֽךְ׃","הוֹן־וָעֹשֶׁר בְּבֵיתוֹ וְצִדְקָתוֹ עֹמֶדֶת לָעַֽד׃","זָרַח בַּחֹשֶׁךְ אוֹר לַיְשָׁרִים חַנּוּן וְרַחוּם וְצַדִּֽיק׃","טֽוֹב־אִישׁ חוֹנֵן וּמַלְוֶה יְכַלְכֵּל דְּבָרָיו בְּמִשְׁפָּֽט׃","כִּֽי־לְעוֹלָם לֹֽא־יִמּוֹט לְזֵכֶר עוֹלָם יִהְיֶה צַדִּֽיק׃","מִשְּׁמוּעָה רָעָה לֹא יִירָא נָכוֹן לִבּוֹ בָּטֻחַ בַּיהֹוָֽה׃","סָמוּךְ לִבּוֹ לֹא יִירָא עַד אֲשֶׁר־יִרְאֶה בְצָרָֽיו׃","פִּזַּר נָתַן לָאֶבְיוֹנִים צִדְקָתוֹ עֹמֶדֶת לָעַד קַרְנוֹ תָּרוּם בְּכָבֽוֹד׃","רָשָׁע יִרְאֶה וְכָעָס שִׁנָּיו יַחֲרֹק וְנָמָס תַּאֲוַת רְשָׁעִים תֹּאבֵֽד׃ {פ}"],"lat":["halelu-yah ashrei-ish yare et-Adonai bemitsotaiv chafets me'od","gibor ba'arets yihye zar'o dor yesharim yevorakh","hon-va'osher beveito vetsidkato omedet la'ad","zarach bachoshekh or laysharim chanun verachum vetsadik","tov-ish chonen umalve yekhalkel devaraiv bemishpat","ki-le'olam lo-yimot lezekher olam yihye tsadik","mishmu'a ra'a lo yira nakhon libo batuach baihova","samukh libo lo yira ad asher-yir'e vetsaraiv","pizar natan la'evyonim tsidkato omedet la'ad karno tarum bekhavod","rasha' yir'e vekha'as shinaiv yacharok venamas ta'avat resha'im toved f"],"en":["Hallelujah. Happy is the man that feareth the LORD, That delighteth greatly in His commandments.","His seed shall be mighty upon earth; The generation of the upright shall be blessed.","Wealth and riches are in his house; And his merit endureth for ever.","Unto the upright He shineth as a light in the darkness, Gracious, and full of compassion, and righteous.","Well is it with the man that dealeth graciously and lendeth, That ordereth his affairs rightfully.","For he shall never be moved; The righteous shall be had in everlasting remembrance.","He shall not be afraid of evil tidings; His heart is stedfast, trusting in the LORD.","His heart is established, he shall not be afraid, Until he gaze upon his adversaries.","He hath scattered abroad, he hath given to the needy; His righteousness endureth for ever; His horn shall be exalted in honour.","The wicked shall see it, and be vexed; he shall gnash with his teeth, and melt away; the desire of the wicked shall perish."]},{"n":113,"he":["הַלְלוּ־יָהּ הַלְלוּ עַבְדֵי יְהֹוָה הַֽלְלוּ אֶת־שֵׁם יְהֹוָֽה׃","יְהִי שֵׁם יְהֹוָה מְבֹרָךְ מֵעַתָּה וְעַד־עוֹלָֽם׃","מִמִּזְרַח־שֶׁמֶשׁ עַד־מְבוֹאוֹ מְהֻלָּל שֵׁם יְהֹוָֽה׃","רָם עַל־כׇּל־גּוֹיִם יְהֹוָה עַל הַשָּׁמַיִם כְּבוֹדֽוֹ׃","מִי כַּיהֹוָה אֱלֹהֵינוּ הַֽמַּגְבִּיהִי לָשָֽׁבֶת׃","הַֽמַּשְׁפִּילִי לִרְאוֹת בַּשָּׁמַיִם וּבָאָֽרֶץ׃","מְקִימִי מֵעָפָר דָּל מֵאַשְׁפֹּת יָרִים אֶבְיֽוֹן׃","לְהוֹשִׁיבִי עִם־נְדִיבִים עִם נְדִיבֵי עַמּֽוֹ׃","מֽוֹשִׁיבִי עֲקֶרֶת הַבַּיִת אֵֽם־הַבָּנִים שְׂמֵחָה הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["halelu-yah halelu avdei Adonai halelu et-shem Adonai","yehi shem Adonai mevorakh me'ata ve'ad-olam","mimizrach-shemesh ad-mevoo mehulal shem Adonai","ram al-kol-goyim Adonai al hashamayim kevodo","mi kaihova eloheinu hamagbihi lashavet","hamashpili lirot bashamayim uva'arets","mekimi me'afar dal me'ashpot yarim evyon","lehoshivi im-nedivim im nedivei amo","moshivi akeret habayit em-habanim semecha halelu-yah f"],"en":["Hallelujah. Praise, O ye servants of the LORD, Praise the name of the LORD.","Blessed be the name of the LORD From this time forth and for ever.","From the rising of the sun unto the going down thereof The LORD'S name is to be praised.","The LORD is high above all nations, His glory is above the heavens.","Who is like unto the LORD our God, That is enthroned on high,","That looketh down low Upon heaven and upon the earth?","Who raiseth up the poor out of the dust, And lifteth up the needy out of the dunghill;","That He may set him with princes, Even with the princes of His people.","Who maketh the barren woman to dwell in her house As a joyful mother of children. Hallelujah."]},{"n":114,"he":["בְּצֵאת יִשְׂרָאֵל מִמִּצְרָיִם בֵּית יַעֲקֹב מֵעַם לֹעֵֽז׃","הָיְתָה יְהוּדָה לְקׇדְשׁוֹ יִשְׂרָאֵל מַמְשְׁלוֹתָֽיו׃","הַיָּם רָאָה וַיָּנֹס הַיַּרְדֵּן יִסֹּב לְאָחֽוֹר׃","הֶהָרִים רָקְדוּ כְאֵילִים גְּבָעוֹת כִּבְנֵי־צֹֽאן׃","מַה־לְּךָ הַיָּם כִּי תָנוּס הַיַּרְדֵּן תִּסֹּב לְאָחֽוֹר׃","הֶהָרִים תִּרְקְדוּ כְאֵילִים גְּבָעוֹת כִּבְנֵי־צֹֽאן׃","מִלִּפְנֵי אָדוֹן חוּלִי אָרֶץ מִלִּפְנֵי אֱלוֹהַּ יַעֲקֹֽב׃","הַהֹפְכִי הַצּוּר אֲגַם־מָיִם חַלָּמִישׁ לְמַעְיְנוֹ־מָֽיִם׃"],"lat":["betset yisra'el mimitsrayim beit ya'akov me'am lo'ez","hayta yehuda lekodsho yisra'el mamshlotaiv","hayam ra'a vayanos hayarden yisov le'achor","heharim rakdu khe'eilim geva'ot kivnei-tson","ma-lekha hayam ki tanus hayarden tisov le'achor","heharim tirkdu khe'eilim geva'ot kivnei-tson","milifnei adon chuli arets milifnei eloah ya'akov","hahofkhi hatsur agam-mayim chalamish lema'yno-mayim"],"en":["When Israel came forth out of Egypt, The house of Jacob from a people of strange language;","Judah became His sanctuary, Israel His dominion.","The sea saw it, and fled; The Jordan turned backward.","The mountains skipped like rams, The hills like young sheep.","What aileth thee, O thou sea, that thou fleest? Thou Jordan, that thou turnest backward?","Ye mountains, that ye skip like rams; Ye hills, like young sheep?","Tremble, thou earth, at the presence of the Lord, At the presence of the God of Jacob;","Who turned the rock into a pool of water, The flint into a fountain of waters."]},{"n":115,"he":["לֹא לָנוּ יְהֹוָה לֹא־לָנוּ כִּֽי־לְשִׁמְךָ תֵּן כָּבוֹד עַל־חַסְדְּךָ עַל־אֲמִתֶּֽךָ׃","לָמָּה יֹאמְרוּ הַגּוֹיִם אַיֵּה־נָא אֱלֹהֵיהֶֽם׃","וֵאלֹהֵינוּ בַשָּׁמָיִם כֹּל אֲשֶׁר־חָפֵץ עָשָֽׂה׃","עֲֽצַבֵּיהֶם כֶּסֶף וְזָהָב מַעֲשֵׂה יְדֵי אָדָֽם׃","פֶּֽה־לָהֶם וְלֹא יְדַבֵּרוּ עֵינַיִם לָהֶם וְלֹא יִרְאֽוּ׃","אׇזְנַיִם לָהֶם וְלֹא יִשְׁמָעוּ אַף לָהֶם וְלֹא יְרִיחֽוּן׃","יְדֵיהֶם וְלֹא יְמִישׁוּן רַגְלֵיהֶם וְלֹא יְהַלֵּכוּ לֹא־יֶהְגּוּ בִּגְרוֹנָֽם׃","כְּמוֹהֶם יִהְיוּ עֹשֵׂיהֶם כֹּל אֲשֶׁר־בֹּטֵחַ בָּהֶֽם׃","יִשְׂרָאֵל בְּטַח בַּיהֹוָה עֶזְרָם וּמָגִנָּם הֽוּא׃","בֵּית אַהֲרֹן בִּטְחוּ בַיהֹוָה עֶזְרָם וּמָגִנָּם הֽוּא׃","יִרְאֵי יְהֹוָה בִּטְחוּ בַיהֹוָה עֶזְרָם וּמָגִנָּם הֽוּא׃","יְהֹוָה זְכָרָנוּ יְבָרֵךְ יְבָרֵךְ אֶת־בֵּית יִשְׂרָאֵל יְבָרֵךְ אֶת־בֵּית אַהֲרֹֽן׃","יְבָרֵךְ יִרְאֵי יְהֹוָה הַקְּטַנִּים עִם־הַגְּדֹלִֽים׃","יֹסֵף יְהֹוָה עֲלֵיכֶם עֲלֵיכֶם וְעַל־בְּנֵיכֶֽם׃","בְּרוּכִים אַתֶּם לַיהֹוָה עֹשֵׂה שָׁמַיִם וָאָֽרֶץ׃","הַשָּׁמַיִם שָׁמַיִם לַיהֹוָה וְהָאָרֶץ נָתַן לִבְנֵי־אָדָֽם׃","לֹא הַמֵּתִים יְהַֽלְלוּ־יָהּ וְלֹא כׇּל־יֹרְדֵי דוּמָֽה׃","וַאֲנַחְנוּ נְבָרֵךְ יָהּ מֵעַתָּה וְעַד־עוֹלָם הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["lo lanu Adonai lo-lanu ki-leshimkha ten kavod al-chasdkha al-amitekha","lama yomru hagoyim aye-na eloheihem","veloheinu vashamayim kol asher-chafets asa","atsabeihem kesef vezahav ma'ase yedei adam","pe-lahem velo yedaberu einayim lahem velo yiru","oznayim lahem velo yishma'u af lahem velo yerichun","yedeihem velo yemishun ragleihem velo yehalekhu lo-yehgu bigronam","kemohem yihyu oseihem kol asher-boteach bahem","yisra'el betach baihova ezram umaginam hu","beit aharon bitchu vaihova ezram umaginam hu","yir'ei Adonai bitchu vaihova ezram umaginam hu","Adonai zekharanu yevarekh yevarekh et-beit yisra'el yevarekh et-beit aharon","yevarekh yir'ei Adonai haktanim im-hagdolim","yosef Adonai aleikhem aleikhem ve'al-beneikhem","berukhim atem laihova ose shamayim va'arets","hashamayim shamayim laihova veha'arets natan livnei-adam","lo hametim yehalelu-yah velo kol-yordei duma","va'anachnu nevarekh yah me'ata ve'ad-olam halelu-yah f"],"en":["Not unto us, O LORD, not unto us, But unto Thy name give glory, For Thy mercy, and for Thy truth's sake.","Wherefore should the nations say: 'Where is now their God?'","But our God is in the heavens; Whatsoever pleased Him He hath done.","Their idols are silver and gold, The work of men's hands.","They have mouths, but they speak not; Eyes have they, but they see not;","They have ears, but they hear not; Noses have they, but they smell not;","They have hands, but they handle not; Feet have they, but they walk not; Neither speak they with their throat. .","They that make them shall be like unto them; Yea, every one that trusteth in them.","O Israel, trust thou in the LORD! He is their help and their shield!","O house of Aaron, trust ye in the LORD! He is their help and their shield!","Ye that fear the LORD, trust in the LORD! He is their help and their shield.","The LORD hath been mindful of us, He will bless— He will bless the house of Israel; He will bless the house of Aaron.","He will bless them that fear the LORD, Both small and great.","The LORD increase you more and more, You and your children.","Blessed be ye of the LORD Who made heaven and earth.","The heavens are the heavens of the LORD; But the earth hath He given to the children of men.","The dead praise not the LORD, Neither any that go down into silence;","But we will bless the LORD From this time forth and for ever. Hallelujah."]},{"n":116,"he":["אָהַבְתִּי כִּי־יִשְׁמַע יְהֹוָה אֶת־קוֹלִי תַּחֲנוּנָֽי׃","כִּֽי־הִטָּה אׇזְנוֹ לִי וּבְיָמַי אֶקְרָֽא׃","אֲפָפוּנִי חֶבְלֵי־מָוֶת וּמְצָרֵי שְׁאוֹל מְצָאוּנִי צָרָה וְיָגוֹן אֶמְצָֽא׃","וּבְשֵֽׁם־יְהֹוָה אֶקְרָא אָנָּה יְהֹוָה מַלְּטָה נַפְשִֽׁי׃","חַנּוּן יְהֹוָה וְצַדִּיק וֵאלֹהֵינוּ מְרַחֵֽם׃","שֹׁמֵר פְּתָאיִם יְהֹוָה דַּלֹּתִי וְלִי יְהוֹשִֽׁיעַ׃","שׁוּבִי נַפְשִׁי לִמְנוּחָיְכִי כִּֽי־יְהֹוָה גָּמַל עָלָֽיְכִי׃","כִּי חִלַּצְתָּ נַפְשִׁי מִמָּוֶת אֶת־עֵינִי מִן־דִּמְעָה אֶת־רַגְלִי מִדֶּֽחִי׃","אֶתְהַלֵּךְ לִפְנֵי יְהֹוָה בְּאַרְצוֹת הַחַיִּֽים׃","הֶאֱמַנְתִּי כִּי אֲדַבֵּר אֲנִי עָנִיתִי מְאֹֽד׃","אֲנִי אָמַרְתִּי בְחׇפְזִי כׇּֽל־הָאָדָם כֹּזֵֽב׃","מָה־אָשִׁיב לַיהֹוָה כׇּֽל־תַּגְמוּלוֹהִי עָלָֽי׃","כּוֹס־יְשׁוּעוֹת אֶשָּׂא וּבְשֵׁם יְהֹוָה אֶקְרָֽא׃","נְדָרַי לַיהֹוָה אֲשַׁלֵּם נֶגְדָה־נָּא לְכׇל־עַמּֽוֹ׃","יָקָר בְּעֵינֵי יְהֹוָה הַמָּוְתָה לַחֲסִידָֽיו׃","אָנָּה יְהֹוָה כִּי־אֲנִי עַבְדֶּךָ אֲֽנִי־עַבְדְּךָ בֶּן־אֲמָתֶךָ פִּתַּחְתָּ לְמֽוֹסֵרָֽי׃","לְֽךָ־אֶזְבַּח זֶבַח תּוֹדָה וּבְשֵׁם יְהֹוָה אֶקְרָֽא׃","נְדָרַי לַיהֹוָה אֲשַׁלֵּם נֶגְדָה־נָּא לְכׇל־עַמּֽוֹ׃","בְּחַצְרוֹת בֵּית יְהֹוָה בְּֽתוֹכֵכִי יְֽרוּשָׁלָ͏ִם הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["ahavti ki-yishma' Adonai et-koli tachanunai","ki-hita ozno li uvyamai ekra","afafuni chevlei-mavet umtsarei sheol metsauni tsara veyagon emtsa","uvshem-Adonai ekra ana Adonai malta nafshi","chanun Adonai vetsadik veloheinu merachem","shomer petayim Adonai daloti veli yehoshia'","shuvi nafshi limnuchaykhi ki-Adonai gamal alaykhi","ki chilatsta nafshi mimavet et-eini min-dim'a et-ragli midechi","ethalekh lifnei Adonai be'artsot hachayim","he'emanti ki adaber ani aniti me'od","ani amarti vechofzi kol-ha'adam kozev","ma-ashiv laihova kol-tagmulohi alai","kos-yeshu'ot esa uvshem Adonai ekra","nedarai laihova ashalem negda-na lekhol-amo","yakar be'einei Adonai hamavta lachasidaiv","ana Adonai ki-ani avdekha ani-avdkha ben-amatekha pitachta lemoserai","lekha-ezbach zevach toda uvshem Adonai ekra","nedarai laihova ashalem negda-na lekhol-amo","bechatsrot beit Adonai betokhekhi yerushalam halelu-yah f"],"en":["I love that the LORD should hear my voice and my supplications.","Because He hath inclined His ear unto me, Therefore will I call upon Him all my days.","The cords of death compassed me, And the straits of the nether-world got hold upon me; I found trouble and sorrow.","But I called upon the name of the LORD: 'I beseech thee, O LORD, deliver my soul.'","Gracious is the LORD, and righteous; Yea, our God is compassionate.","The LORD preserveth the simple; I was brought low, and He saved me.","Return, O my soul, unto Thy rest; For the LORD hath dealt bountifully with thee.","For thou hast delivered my soul from death, Mine eyes from tears, And my feet from stumbling.","I shall walk before the LORD In the lands of the living.","I trusted even when I spoke: 'I am greatly afflicted.'","I said in my haste: 'All men are liars.'","How can I repay unto the LORD All His bountiful dealings toward me?","I will lift up the cup of salvation, And call upon the name of the LORD.","My vows will I pay unto the LORD, Yea, in the presence of all His people.","Precious in the sight of the LORD Is the death of His saints.","I beseech Thee, O LORD, for I am Thy servant; I am Thy servant, the son of Thy handmaid; Thou hast loosed my bands.","I will offer to thee the sacrifice of thanksgiving, And will call upon the name of the LORD.","I will pay my vows unto the LORD, Yea, in the presence of all His people;","In the courts of the LORD’S house, In the midst of thee, O Jerusalem. Hallelujah."]},{"n":117,"he":["הַֽלְלוּ אֶת־יְהֹוָה כׇּל־גּוֹיִם שַׁבְּחוּהוּ כׇּל־הָאֻמִּֽים׃","כִּי־גָבַר עָלֵינוּ חַסְדּוֹ וֶאֱמֶת־יְהֹוָה לְעוֹלָם הַֽלְלוּ־יָֽהּ׃ {פ}"],"lat":["halelu et-Adonai kol-goyim shabchuhu kol-ha'umim","ki-gavar aleinu chasdo ve'emet-Adonai le'olam halelu-yah f"],"en":["O praise the LORD, all ye nations; Laud Him, all ye peoples.","For His mercy is great toward us; And the truth of the LORD endureth for ever. Hallelujah."]},{"n":118,"he":["הוֹדוּ לַיהֹוָה כִּי־טוֹב כִּי לְעוֹלָם חַסְדּֽוֹ׃","יֹאמַר־נָא יִשְׂרָאֵל כִּי לְעוֹלָם חַסְדּֽוֹ׃","יֹאמְרוּ־נָא בֵֽית־אַהֲרֹן כִּי לְעוֹלָם חַסְדּֽוֹ׃","יֹאמְרוּ־נָא יִרְאֵי יְהֹוָה כִּי לְעוֹלָם חַסְדּֽוֹ׃","מִֽן־הַמֵּצַר קָרָאתִי יָּהּ עָנָנִי בַמֶּרְחָב יָֽהּ׃","יְהֹוָה לִי לֹא אִירָא מַה־יַּעֲשֶׂה לִי אָדָֽם׃","יְהֹוָה לִי בְּעֹזְרָי וַאֲנִי אֶרְאֶה בְשֹׂנְאָֽי׃","טוֹב לַחֲסוֹת בַּיהֹוָה מִבְּטֹחַ בָּאָדָֽם׃","טוֹב לַחֲסוֹת בַּיהֹוָה מִבְּטֹחַ בִּנְדִיבִֽים׃","כׇּל־גּוֹיִם סְבָבוּנִי בְּשֵׁם יְהֹוָה כִּי אֲמִילַֽם׃","סַבּוּנִי גַם־סְבָבוּנִי בְּשֵׁם יְהֹוָה כִּי אֲמִילַֽם׃","סַבּוּנִי כִדְבוֹרִים דֹּעֲכוּ כְּאֵשׁ קוֹצִים בְּשֵׁם יְהֹוָה כִּי אֲמִילַֽם׃","דַּחֹה דְחִיתַנִי לִנְפֹּל וַיהֹוָה עֲזָרָֽנִי׃","עׇזִּי וְזִמְרָת יָהּ וַֽיְהִי־לִי לִישׁוּעָֽה׃","קוֹל רִנָּה וִישׁוּעָה בְּאׇהֳלֵי צַדִּיקִים יְמִין יְהֹוָה עֹשָׂה חָֽיִל׃","יְמִין יְהֹוָה רוֹמֵמָה יְמִין יְהֹוָה עֹשָׂה חָֽיִל׃","לֹא־אָמוּת כִּֽי־אֶחְיֶה וַאֲסַפֵּר מַעֲשֵׂי יָֽהּ׃","יַסֹּר יִסְּרַנִּי יָּהּ וְלַמָּוֶת לֹא נְתָנָֽנִי׃","פִּתְחוּ־לִי שַׁעֲרֵי־צֶדֶק אָבֹא־בָם אוֹדֶה יָֽהּ׃","זֶה־הַשַּׁעַר לַיהֹוָה צַדִּיקִים יָבֹאוּ בֽוֹ׃","אוֹדְךָ כִּי עֲנִיתָנִי וַתְּהִי־לִי לִישׁוּעָֽה׃","אֶבֶן מָאֲסוּ הַבּוֹנִים הָיְתָה לְרֹאשׁ פִּנָּֽה׃","מֵאֵת יְהֹוָה הָיְתָה זֹּאת הִיא נִפְלָאת בְּעֵינֵֽינוּ׃","זֶה־הַיּוֹם עָשָׂה יְהֹוָה נָגִילָה וְנִשְׂמְחָה בֽוֹ׃","אָנָּא יְהֹוָה הוֹשִׁיעָה נָּא אָנָּא יְהֹוָה הַצְלִיחָה נָּֽא׃","בָּרוּךְ הַבָּא בְּשֵׁם יְהֹוָה בֵּרַכְנוּכֶם מִבֵּית יְהֹוָֽה׃","אֵל יְהֹוָה וַיָּאֶר לָנוּ אִסְרוּ־חַג בַּעֲבֹתִים עַד־קַרְנוֹת הַמִּזְבֵּֽחַ׃","אֵלִי אַתָּה וְאוֹדֶךָּ אֱלֹהַי אֲרוֹמְמֶֽךָּ׃","הוֹדוּ לַיהֹוָה כִּי־טוֹב כִּי לְעוֹלָם חַסְדּֽוֹ׃ {פ}"],"lat":["hodu laihova ki-tov ki le'olam chasdo","yomar-na yisra'el ki le'olam chasdo","yomru-na veit-aharon ki le'olam chasdo","yomru-na yir'ei Adonai ki le'olam chasdo","min-hametsar karati yah anani vamerchav yah","Adonai li lo ira ma-ya'ase li adam","Adonai li be'ozrai va'ani er'e veson'ai","tov lachasot baihova mibtoach ba'adam","tov lachasot baihova mibtoach bindivim","kol-goyim sevavuni beshem Adonai ki amilam","sabuni gam-sevavuni beshem Adonai ki amilam","sabuni khidvorim do'akhu ke'esh kotsim beshem Adonai ki amilam","dacho dechitani linpol vaihova azarani","ozi vezimrat yah vayhi-li lishu'a","kol rina vishu'a be'oholei tsadikim yemin Adonai osa chayil","yemin Adonai romema yemin Adonai osa chayil","lo-amut ki-echye va'asaper ma'asei yah","yasor yisrani yah velamavet lo netanani","pitchu-li sha'arei-tsedek avo-vam ode yah","ze-hasha'ar laihova tsadikim yavou vo","odkha ki anitani vathi-li lishu'a","even ma'asu habonim hayta lerosh pina","me'et Adonai hayta zot hi niflat be'eineinu","ze-hayom asa Adonai nagila venismcha vo","ana Adonai hoshi'a na ana Adonai hatslicha na","barukh haba beshem Adonai berakhnukhem mibeit Adonai","el Adonai vaya'er lanu isru-chag ba'avotim ad-karnot hamizbeach","eli ata veodeka elohai aromemeka","hodu laihova ki-tov ki le'olam chasdo f"],"en":["'O give thanks unto the LORD, for He is good, For His mercy endureth for ever.","So let Israel now say, For His mercy endureth for ever,","So let the house of Aaron now say, For His mercy endureth for ever.","So let them now that fear the LORD say, For His mercy endureth for ever.","Out of my straits I called upon the LORD; He answered me with great enlargement.","The LORD is for me; I will not fear; What can man do unto me?","The LORD is for me as my helper; And I shall gaze upon them that hate me.","It is better to take refuge in the LORD Than to trust in man.","It is better to take refuge in the LORD Than to trust in princes.","All nations compass me about; Verily, in the name of the LORD I will cut them off.","They compass me about, yea, they compass me about; Verily, in the name of the LORD I will cut them off.","They compass me about like bees; They are quenched as the fire of thorns; Verily, in the name of the LORD I will cut them off.","Thou didst thrust sore at me that I might fall; But the LORD helped me.","The LORD is my strength and song; And He is become my salvation.","The voice of rejoicing and salvation is in the tents of the righteous; The right hand of the LORD doeth valiantly.","The right hand of the LORD is exalted; The right hand of the LORD doeth valiantly.","I shall not die, but live, And declare the works of the LORD.","The LORD hath chastened me sore; But He hath not given me over unto death.","Open to me the gates of righteousness; I will enter into them, I will give thanks unto the LORD.","This is the gate of the LORD; The righteous shall enter into it.","I will give thanks unto Thee, for Thou hast answered me, And art become my salvation.","The stone which the builders rejected Is become the chief corner-stone.","This is the LORD’S doing; It is marvellous in our eyes.","This is the day which the LORD hath made; We will rejoice and be glad in it.","We beseech Thee, O LORD, save now! We beseech Thee, O LORD, make us now to prosper!","Blessed be he that cometh in the name of the LORD; We bless you out of the house of the LORD.","The LORD is God, and hath given us light; Order the festival procession with boughs, even unto the horns of the altar.","Thou art my God, and I will give thanks unto Thee; Thou art my God, I will exalt Thee.","O give thanks unto the LORD, for He is good, For His mercy endureth for ever."]},{"n":119,"he":["אַשְׁרֵי תְמִֽימֵי־דָרֶךְ הַהֹלְכִים בְּתוֹרַת יְהֹוָֽה׃","אַשְׁרֵי נֹצְרֵי עֵדֹתָיו בְּכׇל־לֵב יִדְרְשֽׁוּהוּ׃","אַף לֹא־פָעֲלוּ עַוְלָה בִּדְרָכָיו הָלָֽכוּ׃","אַתָּה צִוִּיתָה פִקֻּדֶיךָ לִשְׁמֹר מְאֹֽד׃","אַחֲלַי יִכֹּנוּ דְרָכָי לִשְׁמֹר חֻקֶּֽיךָ׃","אָז לֹא־אֵבוֹשׁ בְּהַבִּיטִי אֶל־כׇּל־מִצְוֺתֶֽיךָ׃","אוֹדְךָ בְּיֹשֶׁר לֵבָב בְּלׇמְדִי מִשְׁפְּטֵי צִדְקֶֽךָ׃","אֶת־חֻקֶּיךָ אֶשְׁמֹר אַֽל־תַּעַזְבֵנִי עַד־מְאֹֽד׃ {פ}","בַּמֶּה יְזַכֶּה־נַּעַר אֶת־אׇרְחוֹ לִשְׁמֹר כִּדְבָרֶֽךָ׃","בְּכׇל־לִבִּי דְרַשְׁתִּיךָ אַל־תַּשְׁגֵּנִי מִמִּצְוֺתֶֽיךָ׃","בְּלִבִּי צָפַנְתִּי אִמְרָתֶךָ לְמַעַן לֹא אֶחֱטָא־לָֽךְ׃","בָּרוּךְ אַתָּה יְהֹוָה לַמְּדֵנִי חֻקֶּֽיךָ׃","בִּשְׂפָתַי סִפַּרְתִּי כֹּל מִשְׁפְּטֵי־פִֽיךָ׃","בְּדֶרֶךְ עֵדְוֺתֶיךָ שַּׂשְׂתִּי כְּעַל כׇּל־הֽוֹן׃","בְּפִקּוּדֶיךָ אָשִׂיחָה וְאַבִּיטָה אֹֽרְחֹתֶֽיךָ׃","בְּחֻקֹּתֶיךָ אֶֽשְׁתַּעֲשָׁע לֹא אֶשְׁכַּח דְּבָרֶֽךָ׃ {פ}","גְּמֹל עַל־עַבְדְּךָ אֶחְיֶה וְאֶשְׁמְרָה דְבָרֶֽךָ׃","גַּל־עֵינַי וְאַבִּיטָה נִפְלָאוֹת מִתּוֹרָתֶֽךָ׃","גֵּר אָנֹכִי בָאָרֶץ אַל־תַּסְתֵּר מִמֶּנִּי מִצְוֺתֶֽיךָ׃","גָּרְסָה נַפְשִׁי לְתַאֲבָה אֶֽל־מִשְׁפָּטֶיךָ בְכׇל־עֵֽת׃","גָּעַרְתָּ זֵדִים אֲרוּרִים הַשֹּׁגִים מִמִּצְוֺתֶֽיךָ׃","גַּל מֵעָלַי חֶרְפָּה וָבוּז כִּי עֵדֹתֶיךָ נָצָֽרְתִּי׃","גַּם יָשְׁבוּ שָׂרִים בִּי נִדְבָּרוּ עַבְדְּךָ יָשִׂיחַ בְּחֻקֶּֽיךָ׃","גַּֽם־עֵדֹתֶיךָ שַׁעֲשֻׁעָי אַנְשֵׁי עֲצָתִֽי׃ {פ}","דָּבְקָה לֶעָפָר נַפְשִׁי חַיֵּנִי כִּדְבָרֶֽךָ׃","דְּרָכַי סִפַּרְתִּי וַֽתַּעֲנֵנִי לַמְּדֵנִי חֻקֶּֽיךָ׃","דֶּרֶךְ־פִּקּוּדֶיךָ הֲבִינֵנִי וְאָשִׂיחָה בְּנִפְלְאוֹתֶֽיךָ׃","דָּלְפָה נַפְשִׁי מִתּוּגָה קַיְּמֵנִי כִּדְבָרֶֽךָ׃","דֶּֽרֶךְ־שֶׁקֶר הָסֵר מִמֶּנִּי וְֽתוֹרָתְךָ חׇנֵּֽנִי׃","דֶּֽרֶךְ־אֱמוּנָה בָחָרְתִּי מִשְׁפָּטֶיךָ שִׁוִּֽיתִי׃","דָּבַקְתִּי בְעֵדְוֺתֶיךָ יְהֹוָה אַל־תְּבִישֵֽׁנִי׃","דֶּֽרֶךְ־מִצְוֺתֶיךָ אָרוּץ כִּי תַרְחִיב לִבִּֽי׃ {פ}","הוֹרֵנִי יְהֹוָה דֶּרֶךְ חֻקֶּיךָ וְאֶצְּרֶנָּה עֵֽקֶב׃","הֲבִינֵנִי וְאֶצְּרָה תוֹרָתֶךָ וְאֶשְׁמְרֶנָּה בְכׇל־לֵֽב׃","הַדְרִיכֵנִי בִּנְתִיב מִצְוֺתֶיךָ כִּי־בוֹ חָפָֽצְתִּי׃","הַט־לִבִּי אֶל־עֵדְוֺתֶיךָ וְאַל אֶל־בָּֽצַע׃","הַעֲבֵר עֵינַי מֵרְאוֹת שָׁוְא בִּדְרָכֶךָ חַיֵּֽנִי׃","הָקֵם לְעַבְדְּךָ אִמְרָתֶךָ אֲשֶׁר לְיִרְאָתֶֽךָ׃","הַעֲבֵר חֶרְפָּתִי אֲשֶׁר יָגֹרְתִּי כִּי מִשְׁפָּטֶיךָ טוֹבִֽים׃","הִנֵּה תָּאַבְתִּי לְפִקֻּדֶיךָ בְּצִדְקָתְךָ חַיֵּֽנִי׃ {פ}","וִיבֹאֻנִי חֲסָדֶךָ יְהֹוָה תְּשׁוּעָתְךָ כְּאִמְרָתֶֽךָ׃","וְאֶעֱנֶה חֹרְפִי דָבָר כִּֽי־בָטַחְתִּי בִּדְבָרֶֽךָ׃","וְֽאַל־תַּצֵּל מִפִּי דְבַר־אֱמֶת עַד־מְאֹד כִּי לְמִשְׁפָּטֶךָ יִחָֽלְתִּי׃","וְאֶשְׁמְרָה תוֹרָתְךָ תָמִיד לְעוֹלָם וָעֶֽד׃","וְאֶתְהַלְּכָה בָרְחָבָה כִּי פִקֻּדֶיךָ דָרָֽשְׁתִּי׃","וַאֲדַבְּרָה בְעֵדֹתֶיךָ נֶגֶד מְלָכִים וְלֹא אֵבֽוֹשׁ׃","וְאֶשְׁתַּעֲשַׁע בְּמִצְוֺתֶיךָ אֲשֶׁר אָהָֽבְתִּי׃","וְאֶשָּֽׂא־כַפַּי אֶֽל־מִצְוֺתֶיךָ אֲשֶׁר אָהָבְתִּי וְאָשִׂיחָה בְחֻקֶּֽיךָ׃ {פ}","זְכֹר־דָּבָר לְעַבְדֶּךָ עַל אֲשֶׁר יִחַלְתָּֽנִי׃","זֹאת נֶחָמָתִי בְעׇנְיִי כִּי אִמְרָתְךָ חִיָּֽתְנִי׃","זֵדִים הֱלִיצֻנִי עַד־מְאֹד מִתּוֹרָתְךָ לֹא נָטִֽיתִי׃","זָכַרְתִּי מִשְׁפָּטֶיךָ מֵעוֹלָם יְהֹוָה וָאֶתְנֶחָֽם׃","זַלְעָפָה אֲחָזַתְנִי מֵרְשָׁעִים עֹזְבֵי תּוֹרָתֶֽךָ׃","זְמִרוֹת הָיוּ־לִי חֻקֶּיךָ בְּבֵית מְגוּרָֽי׃","זָכַרְתִּי בַלַּיְלָה שִׁמְךָ יְהֹוָה וָאֶשְׁמְרָה תּוֹרָתֶֽךָ׃","זֹאת הָיְתָה־לִּי כִּי פִקֻּדֶיךָ נָצָֽרְתִּי׃ {פ}","חֶלְקִי יְהֹוָה אָמַרְתִּי לִשְׁמֹר דְּבָרֶֽיךָ׃","חִלִּיתִי פָנֶיךָ בְכׇל־לֵב חׇנֵּנִי כְּאִמְרָתֶֽךָ׃","חִשַּׁבְתִּי דְרָכָי וָאָשִׁיבָה רַגְלַי אֶל־עֵדֹתֶֽיךָ׃","חַשְׁתִּי וְלֹא הִתְמַהְמָהְתִּי לִשְׁמֹר מִצְוֺתֶֽיךָ׃","חֶבְלֵי רְשָׁעִים עִוְּדֻנִי תּוֹרָתְךָ לֹא שָׁכָֽחְתִּי׃","חֲצֽוֹת־לַיְלָה אָקוּם לְהוֹדוֹת לָךְ עַל מִשְׁפְּטֵי צִדְקֶֽךָ׃","חָבֵר אָנִי לְכׇל־אֲשֶׁר יְרֵאוּךָ וּלְשֹׁמְרֵי פִּקּוּדֶֽיךָ׃","חַסְדְּךָ יְהֹוָה מָלְאָה הָאָרֶץ חֻקֶּיךָ לַמְּדֵֽנִי׃ {פ}","טוֹב עָשִׂיתָ עִֽם־עַבְדְּךָ יְהֹוָה כִּדְבָרֶֽךָ׃","טוּב טַעַם וָדַעַת לַמְּדֵנִי כִּי בְמִצְוֺתֶיךָ הֶאֱמָֽנְתִּי׃","טֶרֶם אֶעֱנֶה אֲנִי שֹׁגֵג וְעַתָּה אִמְרָתְךָ שָׁמָֽרְתִּי׃","טוֹב־אַתָּה וּמֵטִיב לַמְּדֵנִי חֻקֶּֽיךָ׃","טָפְלוּ עָלַי שֶׁקֶר זֵדִים אֲנִי בְּכׇל־לֵב אֶצֹּר פִּקּוּדֶֽיךָ׃","טָפַשׁ כַּחֵלֶב לִבָּם אֲנִי תּוֹרָתְךָ שִׁעֲשָֽׁעְתִּי׃","טֽוֹב־לִי כִי־עֻנֵּיתִי לְמַעַן אֶלְמַד חֻקֶּֽיךָ׃","טֽוֹב־לִי תוֹרַת־פִּיךָ מֵאַלְפֵי זָהָב וָכָֽסֶף׃ {פ}","יָדֶיךָ עָשׂוּנִי וַֽיְכוֹנְנוּנִי הֲבִינֵנִי וְאֶלְמְדָה מִצְוֺתֶֽיךָ׃","יְרֵאֶיךָ יִרְאוּנִי וְיִשְׂמָחוּ כִּי לִדְבָרְךָ יִחָֽלְתִּי׃","יָדַעְתִּי יְהֹוָה כִּי־צֶדֶק מִשְׁפָּטֶיךָ וֶאֱמוּנָה עִנִּיתָֽנִי׃","יְהִי־נָא חַסְדְּךָ לְנַחֲמֵנִי כְּאִמְרָתְךָ לְעַבְדֶּֽךָ׃","יְבֹאוּנִי רַחֲמֶיךָ וְאֶחְיֶה כִּי־תוֹרָתְךָ שַׁעֲשֻׁעָֽי׃","יֵבֹשׁוּ זֵדִים כִּי־שֶׁקֶר עִוְּתוּנִי אֲנִי אָשִׂיחַ בְּפִקּוּדֶֽיךָ׃","יָשׁוּבוּ לִי יְרֵאֶיךָ (וידעו) [וְיֹדְעֵי] עֵדֹתֶֽיךָ׃","יְהִי־לִבִּי תָמִים בְּחֻקֶּיךָ לְמַעַן לֹא אֵבֽוֹשׁ׃ {פ}","כָּלְתָה לִתְשׁוּעָתְךָ נַפְשִׁי לִדְבָרְךָ יִחָֽלְתִּי׃","כָּלוּ עֵינַי לְאִמְרָתֶךָ לֵאמֹר מָתַי תְּֽנַחֲמֵֽנִי׃","כִּֽי־הָיִיתִי כְּנֹאד בְּקִיטוֹר חֻקֶּיךָ לֹא שָׁכָֽחְתִּי׃","כַּמָּה יְמֵֽי־עַבְדֶּךָ מָתַי תַּעֲשֶׂה בְרֹדְפַי מִשְׁפָּֽט׃","כָּרוּ־לִי זֵדִים שִׁיחוֹת אֲשֶׁר לֹא כְתוֹרָתֶֽךָ׃","כׇּל־מִצְוֺתֶיךָ אֱמוּנָה שֶׁקֶר רְדָפוּנִי עׇזְרֵֽנִי׃","כִּמְעַט כִּלּוּנִי בָאָרֶץ וַאֲנִי לֹא־עָזַבְתִּי פִקֻּדֶֽיךָ׃","כְּחַסְדְּךָ חַיֵּנִי וְאֶשְׁמְרָה עֵדוּת פִּֽיךָ׃ {פ}","לְעוֹלָם יְהֹוָה דְּבָרְךָ נִצָּב בַּשָּׁמָֽיִם׃","לְדֹר וָדֹר אֱמוּנָתֶךָ כּוֹנַנְתָּֽ אֶרֶץ וַֽתַּעֲמֹֽד׃","לְֽמִשְׁפָּטֶיךָ עָמְדוּ הַיּוֹם כִּי הַכֹּל עֲבָדֶֽיךָ׃","לוּלֵי תוֹרָתְךָ שַׁעֲשֻׁעָי אָז אָבַדְתִּי בְעׇנְיִֽי׃","לְעוֹלָם לֹא־אֶשְׁכַּח פִּקּוּדֶיךָ כִּי בָם חִיִּיתָֽנִי׃","לְֽךָ־אֲנִי הוֹשִׁיעֵנִי כִּי פִקּוּדֶיךָ דָרָֽשְׁתִּי׃","לִי קִוּוּ רְשָׁעִים לְאַבְּדֵנִי עֵדֹתֶיךָ אֶתְבּוֹנָֽן׃","לְֽכׇל־תִּכְלָה רָאִיתִי קֵץ רְחָבָה מִצְוָתְךָ מְאֹֽד׃ {פ}","מָה־אָהַבְתִּי תוֹרָתֶךָ כׇּל־הַיּוֹם הִיא שִׂיחָתִֽי׃","מֵֽאֹיְבַי תְּחַכְּמֵנִי מִצְוֺתֶךָ כִּי לְעוֹלָם הִיא־לִֽי׃","מִכׇּל־מְלַמְּדַי הִשְׂכַּלְתִּי כִּי עֵדְוֺתֶיךָ שִׂיחָה לִֽי׃","מִזְּקֵנִים אֶתְבּוֹנָן כִּי פִקּוּדֶיךָ נָצָֽרְתִּי׃","מִכׇּל־אֹרַח רָע כָּלִאתִי רַגְלָי לְמַעַן אֶשְׁמֹר דְּבָרֶֽךָ׃","מִמִּשְׁפָּטֶיךָ לֹא־סָרְתִּי כִּי־אַתָּה הוֹרֵתָֽנִי׃","מַה־נִּמְלְצוּ לְחִכִּי אִמְרָתֶךָ מִדְּבַשׁ לְפִֽי׃","מִפִּקּוּדֶיךָ אֶתְבּוֹנָן עַל־כֵּן שָׂנֵאתִי כׇּל־אֹרַח שָֽׁקֶר׃ {פ}","נֵר־לְרַגְלִי דְבָרֶךָ וְאוֹר לִנְתִיבָתִֽי׃","נִשְׁבַּעְתִּי וָאֲקַיֵּמָה לִשְׁמֹר מִשְׁפְּטֵי צִדְקֶֽךָ׃","נַעֲנֵיתִי עַד־מְאֹד יְהֹוָה חַיֵּנִי כִדְבָרֶֽךָ׃","נִדְבוֹת פִּי רְצֵה־נָא יְהֹוָה וּֽמִשְׁפָּטֶיךָ לַמְּדֵֽנִי׃","נַפְשִׁי בְכַפִּי תָמִיד וְתוֹרָתְךָ לֹא שָׁכָֽחְתִּי׃","נָתְנוּ רְשָׁעִים פַּח לִי וּמִפִּקּוּדֶיךָ לֹא תָעִֽיתִי׃","נָחַלְתִּי עֵדְוֺתֶיךָ לְעוֹלָם כִּֽי־שְׂשׂוֹן לִבִּי הֵֽמָּה׃","נָטִיתִי לִבִּי לַעֲשׂוֹת חֻקֶּיךָ לְעוֹלָם עֵֽקֶב׃ {פ}","סֵעֲפִים שָׂנֵאתִי וְֽתוֹרָתְךָ אָהָֽבְתִּי׃","סִתְרִי וּמָגִנִּי אָתָּה לִדְבָרְךָ יִחָֽלְתִּי׃","סוּרוּ־מִמֶּנִּי מְרֵעִים וְאֶצְּרָה מִצְוֺת אֱלֹהָֽי׃","סׇמְכֵנִי כְאִמְרָתְךָ וְאֶחְיֶה וְאַל־תְּבִישֵׁנִי מִשִּׂבְרִֽי׃","סְעָדֵנִי וְאִוָּשֵׁעָה וְאֶשְׁעָה בְחֻקֶּיךָ תָמִֽיד׃","סָלִיתָ כׇּל־שׁוֹגִים מֵחֻקֶּיךָ כִּי־שֶׁקֶר תַּרְמִיתָֽם׃","סִגִים הִשְׁבַּתָּ כׇל־רִשְׁעֵי־אָרֶץ לָכֵן אָהַבְתִּי עֵדֹתֶֽיךָ׃","סָמַר מִפַּחְדְּךָ בְשָׂרִי וּֽמִמִּשְׁפָּטֶיךָ יָרֵֽאתִי׃ {פ}","עָשִׂיתִי מִשְׁפָּט וָצֶדֶק בַּל־תַּנִּיחֵנִי לְעֹשְׁקָֽי׃","עֲרֹב עַבְדְּךָ לְטוֹב אַֽל־יַעַשְׁקֻנִי זֵדִֽים׃","עֵינַי כָּלוּ לִישׁוּעָתֶךָ וּלְאִמְרַת צִדְקֶֽךָ׃","עֲשֵׂה עִם־עַבְדְּךָ כְחַסְדֶּךָ וְחֻקֶּיךָ לַמְּדֵֽנִי׃","עַבְדְּךָ־אָנִי הֲבִינֵנִי וְאֵדְעָה עֵדֹתֶֽיךָ׃","עֵת לַעֲשׂוֹת לַיהֹוָה הֵפֵרוּ תּוֹרָתֶֽךָ׃","עַל־כֵּן אָהַבְתִּי מִצְוֺתֶיךָ מִזָּהָב וּמִפָּֽז׃","עַל־כֵּן כׇּל־פִּקּוּדֵי כֹל יִשָּׁרְתִּי כׇּל־אֹרַח שֶׁקֶר שָׂנֵֽאתִי׃ {פ}","פְּלָאוֹת עֵדְוֺתֶיךָ עַל־כֵּן נְצָרָתַם נַפְשִֽׁי׃","פֵּתַח דְּבָרֶיךָ יָאִיר מֵבִין פְּתָיִֽים׃","פִּֽי־פָעַרְתִּי וָאֶשְׁאָפָה כִּי לְמִצְוֺתֶיךָ יָאָֽבְתִּי׃","פְּנֵה־אֵלַי וְחׇנֵּנִי כְּמִשְׁפָּט לְאֹהֲבֵי שְׁמֶֽךָ׃","פְּעָמַי הָכֵן בְּאִמְרָתֶךָ וְֽאַל־תַּשְׁלֶט־בִּי כׇל־אָֽוֶן׃","פְּדֵנִי מֵעֹשֶׁק אָדָם וְאֶשְׁמְרָה פִּקּוּדֶֽיךָ׃","פָּנֶיךָ הָאֵר בְּעַבְדֶּךָ וְלַמְּדֵנִי אֶת־חֻקֶּֽיךָ׃","פַּלְגֵי־מַיִם יָרְדוּ עֵינָי עַל לֹא־שָׁמְרוּ תוֹרָתֶֽךָ׃ {פ}","צַדִּיק אַתָּה יְהֹוָה וְיָשָׁר מִשְׁפָּטֶֽיךָ׃","צִוִּיתָ צֶדֶק עֵדֹתֶיךָ וֶאֱמוּנָה מְאֹֽד׃","צִמְּתַתְנִי קִנְאָתִי כִּֽי־שָׁכְחוּ דְבָרֶיךָ צָרָֽי׃","צְרוּפָה אִמְרָתְךָ מְאֹד וְֽעַבְדְּךָ אֲהֵבָֽהּ׃","צָעִיר אָנֹכִי וְנִבְזֶה פִּקֻּדֶיךָ לֹא שָׁכָֽחְתִּי׃","צִדְקָתְךָ צֶדֶק לְעוֹלָם וְֽתוֹרָתְךָ אֱמֶֽת׃","צַר־וּמָצוֹק מְצָאוּנִי מִצְוֺתֶיךָ שַׁעֲשֻׁעָֽי׃","צֶדֶק עֵדְוֺתֶיךָ לְעוֹלָם הֲבִינֵנִי וְאֶחְיֶֽה׃ {פ}","קָרָאתִי בְכׇל־לֵב עֲנֵנִי יְהֹוָה חֻקֶּיךָ אֶצֹּֽרָה׃","קְרָאתִיךָ הוֹשִׁיעֵנִי וְאֶשְׁמְרָה עֵדֹתֶֽיךָ׃","קִדַּמְתִּי בַנֶּשֶׁף וָאֲשַׁוֵּעָה (לדבריך) [לִדְבָרְךָ] יִחָֽלְתִּי׃","קִדְּמוּ עֵינַי אַשְׁמֻרוֹת לָשִׂיחַ בְּאִמְרָתֶֽךָ׃","קוֹלִי שִׁמְעָה כְחַסְדֶּךָ יְהֹוָה כְּֽמִשְׁפָּטֶךָ חַיֵּֽנִי׃","קָרְבוּ רֹדְפֵי זִמָּה מִתּוֹרָתְךָ רָחָֽקוּ׃","קָרוֹב אַתָּה יְהֹוָה וְֽכׇל־מִצְוֺתֶיךָ אֱמֶֽת׃","קֶדֶם יָדַעְתִּי מֵעֵדֹתֶיךָ כִּי לְעוֹלָם יְסַדְתָּֽם׃ {פ}","רְאֵה־עׇנְיִי וְחַלְּצֵנִי כִּי־תוֹרָתְךָ לֹא שָׁכָֽחְתִּי׃","רִיבָה רִיבִי וּגְאָלֵנִי לְאִמְרָתְךָ חַיֵּֽנִי׃","רָחוֹק מֵרְשָׁעִים יְשׁוּעָה כִּי־חֻקֶּיךָ לֹא דָרָֽשׁוּ׃","רַחֲמֶיךָ רַבִּים יְהֹוָה כְּֽמִשְׁפָּטֶיךָ חַיֵּֽנִי׃","רַבִּים רֹדְפַי וְצָרָי מֵעֵדְוֺתֶיךָ לֹא נָטִֽיתִי׃","רָאִיתִי בֹגְדִים וָאֶתְקוֹטָטָה אֲשֶׁר אִמְרָתְךָ לֹא שָׁמָֽרוּ׃","רְאֵה כִּי־פִקּוּדֶיךָ אָהָבְתִּי יְהֹוָה כְּֽחַסְדְּךָ חַיֵּֽנִי׃","רֹאשׁ־דְּבָרְךָ אֱמֶת וּלְעוֹלָם כׇּל־מִשְׁפַּט צִדְקֶֽךָ׃ {פ}","שָׂרִים רְדָפוּנִי חִנָּם (ומדבריך) [וּמִדְּבָרְךָ] פָּחַד לִבִּֽי׃","שָׂשׂ אָנֹכִי עַל־אִמְרָתֶךָ כְּמוֹצֵא שָׁלָל רָֽב׃","שֶׁקֶר שָׂנֵאתִי וַאֲתַעֵבָה תּוֹרָתְךָ אָהָֽבְתִּי׃","שֶׁבַע בַּיּוֹם הִלַּלְתִּיךָ עַל מִשְׁפְּטֵי צִדְקֶֽךָ׃","שָׁלוֹם רָב לְאֹהֲבֵי תוֹרָתֶךָ וְאֵֽין־לָמוֹ מִכְשֽׁוֹל׃","שִׂבַּרְתִּי לִישׁוּעָתְךָ יְהֹוָה וּֽמִצְוֺתֶיךָ עָשִֽׂיתִי׃","שָֽׁמְרָה נַפְשִׁי עֵדֹתֶיךָ וָאֹהֲבֵם מְאֹֽד׃","שָׁמַרְתִּי פִקּוּדֶיךָ וְעֵדֹתֶיךָ כִּי כׇל־דְּרָכַי נֶגְדֶּֽךָ׃ {פ}","תִּקְרַב רִנָּתִי לְפָנֶיךָ יְהֹוָה כִּדְבָרְךָ הֲבִינֵֽנִי׃","תָּבוֹא תְחִנָּתִי לְפָנֶיךָ כְּאִמְרָתְךָ הַצִּילֵֽנִי׃","תַּבַּעְנָה שְׂפָתַי תְּהִלָּה כִּי תְלַמְּדֵנִי חֻקֶּֽיךָ׃","תַּעַן לְשׁוֹנִי אִמְרָתֶךָ כִּי כׇל־מִצְוֺתֶיךָ צֶּֽדֶק׃","תְּהִי־יָדְךָ לְעׇזְרֵנִי כִּי פִקּוּדֶיךָ בָחָֽרְתִּי׃", sheker saneti va'ata'eva toratkha ahavti","sheva' bayom hilaltikha al mishptei tsidkekha","shalom rav le'ohavei toratekha ve'ein-lamo mikhshol","sibarti lishu'atkha Adonai umitsoteikha asiti","shamra nafshi edoteikha va'ohavem me'od","shamarti fikudeikha ve'edoteikha ki khol-derakhai negdekha f","tikrav rinati lefaneikha Adonai kidvarkha havineni","tavo techinati lefaneikha ke'imratkha hatsileni","taba'na sefatai tehila ki telamdeni chukeikha","ta'an leshoni imratekha ki khol-mitsoteikha tsedek","tehi-yadkha le'ozreni ki fikudeikha vacharti","ta'avti lishu'atkha Adonai vetoratkha sha'ashu'ai","techi-nafshi uthaleleka umishpatekha ya'zruni","ta'iti kese oved bakesh avdekha ki mitsoteikha lo shakhachti f"],"en":["ALEPH. Happy are they that are upright in the way, who walk in the law of the LORD.","Happy are they that keep His testimonies, that seek Him with the whole heart.","Yea, they do no unrighteousness; they walk in His ways.","Thou hast ordained Thy precepts, that we should observe them diligently.","Oh that my ways were directed to observe Thy statutes!","Then should I not be ashamed, when I have regard unto all Thy commandments.","I will give thanks unto Thee with uprightness of heart, when I learn Thy righteous ordinances. .","I will observe Thy statutes; O forsake me not utterly.","BETH. Wherewithal shall a young man keep his way pure? By taking heed thereto according to Thy word.","With my whole heart have I sought Thee; O let me not err from Thy commandments.","Thy word have I laid up in my heart, that I might not sin against Thee.","Blessed art Thou, O LORD; Teach me Thy statutes.","With my lips have I told All the ordinances of Thy mouth.","I have rejoiced in the way of Thy testimonies, As much as in all riches.","I will meditate in Thy precepts, And have respect unto Thy ways.","I will delight myself in Thy statutes; I will not forget Thy word.","GIMEL. Deal bountifully with Thy servant that I may live, and I will observe Thy word.","Open Thou mine eyes, that I may behold wondrous things out of Thy law.","I am a sojourner in the earth; hide not Thy commandments from me.","My soul breaketh for the longing that it hath unto Thine ordinances at all times.","Thou hast rebuked the proud that are cursed, that do err from Thy commandments.","Take away from me reproach and contempt; for I have kept Thy testimonies.","Even though princes sit and talk against me, Thy servant doth meditate in Thy statutes.","Yea, Thy testimonies are my delight, they are my counsellors. DALETH.","My soul cleaveth unto the dust; quicken Thou me according to Thy word.","I told of my ways, and Thou didst answer me; teach me Thy statutes.","Make me to understand the way of Thy precepts, that I may talk of Thy wondrous works.","My soul melteth away for heaviness; sustain me according unto Thy word.","Remove from me the way of falsehood; and grant me Thy law graciously.","I have chosen the way of faithfulness; Thine ordinances have I set [before me].","I cleave unto Thy testimonies; O LORD, put me not to shame.","I will run the way of Thy commandments, For Thou dost enlarge my heart.","HE. Teach me, O LORD, the way of Thy statutes; And I will keep it at every step.","Give me understanding, that I keep Thy law and observe it with my whole heart.","Make me to tread in the path of Thy commandments; for therein do I delight.","Incline my heart unto Thy testimonies, and not to covetousness.","Turn away mine eyes from beholding vanity, and quicken me in Thy ways.","Confirm Thy word unto Thy servant, which pertaineth unto the fear of Thee.","Turn away my reproach which I dread; for Thine ordinances are good.","Behold, I have longed after Thy precepts; quicken me in Thy righteousness.","VAV. Let Thy mercies also come unto me, O LORD, even Thy salvation, according to Thy word;","That I may have an answer for him that taunteth me; for I trust in Thy word.","And take not the word of truth utterly out of my mouth; for I hope in Thine ordinances;","So shall I observe Thy law continually for ever and ever;","And I will walk at ease, for I have sought Thy precepts;","I will also speak of Thy testimonies before kings, and will not be ashamed.","And I will delight myself in Thy commandments, which I have loved.","I will lift up my hands also unto Thy commandments, which I have loved; And I will meditate in Thy statutes.","ZAIN. Remember the word unto Thy servant, Because Thou hast made me to hope.","This is my comfort in my affliction, that Thy word hath quickened me.","The proud have had me greatly in derision; yet have I not turned aside from Thy law.","I have remembered Thine ordinances which are of old, O LORD, and have comforted myself. .","Burning indignation hath taken hold upon me, because of the wicked that forsake Thy law.","Thy statutes have been my songs in the house of my pilgrimage.","I have remembered Thy name, O LORD, in the night, and have observed Thy law.","This I have had, that I have kept Thy precepts.","HETH. My portion is the LORD, I have said that I would observe Thy words.","I have entreated Thy favour with my whole heart; be gracious unto me according to Thy word.","I considered my ways, and turned my feet unto Thy testimonies.","I made haste, and delayed not, to observe Thy commandments.","The bands of the wicked have enclosed me; but I have not forgotten Thy law.","At midnight I will rise to give thanks unto Thee because of Thy righteous ordinances.","I am a companion of all them that fear Thee, and of them that observe Thy precepts.","The earth, O LORD, is full of Thy mercy; teach me Thy statutes.","TETH. Thou hast dealt well with Thy servant, O LORD, according unto Thy word.","Teach me good discernment and knowledge; for I have believed in Thy commandments.","Before I was afflicted, I did err; But now I observe Thy word.","Thou art good, and doest good; Teach me Thy statutes.","The proud have forged a lie against me; But I with my whole heart will keep Thy precepts.","Their heart is gross like fat; But I delight in Thy law.","It is good for me that I have been afflicted, In order that I might learn Thy statutes.","The law of Thy mouth is better unto me Than thousands of gold and silver.","JOD. Thy hands have made me and fashioned me; Give me understanding, that I may learn Thy commandments.","They that fear Thee shall see me and be glad, because I have hope in Thy word.","I know, O LORD, that Thy judgments are righteous, and that in faithfulness Thou hast afflicted me. .","Let, I pray Thee, Thy lovingkindness be ready to comfort me, According to Thy promise unto Thy servant.","Let Thy tender mercies come unto me, that I may live; for Thy law is my delight.","Let the proud be put to shame, for they have distorted my cause with falsehood; but I will meditate in Thy precepts.","Let those that fear Thee return unto me, and they that know Thy testimonies.","Let my heart be undivided in Thy statutes, in order that I may not be put to shame.","CAPH. My soul pineth for Thy salvation; in Thy word do I hope.","Mine eyes fail for Thy word, Saying: 'When wilt Thou comfort me?'","For I am become like a wine-skin in the smoke; yet do I not forget Thy statutes.","How many are the days of Thy servant? When wilt Thou execute judgment on them that persecute me?","The proud have digged pits for me, which is not according to Thy law.","All Thy commandments are faithful; they persecute me for nought; help Thou me.","They had almost consumed me upon earth; but as for me, I forsook not Thy precepts.","Quicken me after Thy lovingkindness, and I will observe the testimony of Thy mouth.","LAMED. For ever, O LORD, Thy word standeth fast in heaven.","Thy faithfulness is unto all generations; Thou hast established the earth, and it standeth.","They stand this day according to Thine ordinances; for all things are Thy servants.","Unless Thy law had been my delight, I should then have perished in mine affliction.","I will never forget Thy precepts; for with them Thou hast quickened me.","I am Thine, save me; for I have sought Thy precepts.","The wicked have waited for me to destroy me; but I will consider Thy testimonies.","I have seen an end to every purpose; but Thy commandment is exceeding broad.","MEM. O how love I Thy law! It is my meditation all the day.","Thy commandments make me wiser than mine enemies: For they are ever with me.","I have more understanding than all my teachers; For Thy testimonies are my meditation.","I understand more than mine elders, because I have keep Thy precepts.","I have refrained my feet from every evil way, in order that I might observe Thy word.","I have not turned aside from Thine ordinances; For Thou hast instructed me.","How sweet are Thy words unto my palate! Yea, sweeter than honey to my mouth!","From Thy precepts I get understanding; Therefore I hate every false way.","NUN. Thy word is a lamp unto my feet, And a light unto my path.","I have sworn, and have confirmed it, To observe Thy righteous ordinances.","I am afflicted very much; Quicken me, O LORD, according unto Thy word.","Accept, I beseech Thee, the freewill-offerings of my mouth, O LORD, And teach me Thine ordinances.","My soul is continually in my hand; yet have I not forgotten Thy law.","The wicked have laid a snare for me; yet went I not astray from Thy precepts.","Thy testimonies have I taken as a heritage for ever; for they are the rejoicing of my heart.","I have inclined my heart to perform Thy statutes, for ever, at every step.","SAMECH. I hate them that are of a double mind; but Thy law do I love.","Thou art my covert and my shield; in Thy word do I hope.","Depart from me, ye evildoers; that I may keep the commandments of my God.","Uphold me according unto Thy word, that I may live; and put me not to shame in my hope.","Support Thou me, and I shall be saved; and I will occupy myself with Thy statutes continually.","Thou hast made light of all them that err from Thy statutes; for their deceit is vain.","Thou puttest away all the wicked of the earth like dross; therefore I love Thy testimonies.","My flesh shuddereth for fear of Thee; And I am afraid of Thy judgments.","AIN. I have done justice and righteousness; Leave me not to mine oppressors.","Be surety for Thy servant for good; Let not the proud oppress me.","Mine eyes fail for Thy salvation, and for Thy righteous word.","Deal with Thy servant according unto Thy mercy, and teach me Thy statutes.","I am Thy servant, give me understanding, that I may know Thy testimonies.","It is time for the LORD to work; They have made void Thy law.","Therefore I love Thy commandments Above gold, yea, above fine gold.","Therefore I esteem all [Thy] precepts concerning all things to be right; Every false way I hate.","PE. Thy testimonies are wonderful; Therefore doth my soul keep them.","The opening of Thy words giveth light; it giveth understanding unto the simple.","I opened wide my mouth, and panted; For I longed for Thy commandments.","Turn Thee towards me, and be gracious unto me, As is Thy wont to do unto those that love Thy name.","Order my footsteps by Thy word; And let not any iniquity have dominion over me.","Redeem me from the oppression of man, And I will observe Thy precepts.","Make Thy face to shine upon Thy servant; And teach me Thy statutes.","Mine eyes run down with rivers of water, Because they observe not Thy law.","TZADE. Righteous art Thou, O LORD, And upright are Thy judgments.","Thou hast commanded Thy testimonies in righteousness and exceeding faithfulness.","My zeal hath undone me, because mine adversaries have forgotten Thy words.","Thy word is tried to the uttermost, and Thy servant loveth it.","I am small and despised; yet have I not forgotten Thy precepts.","Thy righteousness is an everlasting righteousness, and Thy law is truth.","Trouble and anguish have overtaken me; yet Thy commandments are my delight.","Thy testimonies are righteous for ever; give me understanding, and I shall live.","KOPH. I have called with my whole heart; answer me, O LORD; I will keep Thy statutes.","I have called Thee, save me, and I will observe Thy testimonies.","I rose early at dawn, and cried; I hoped in Thy word.","Mine eyes forestalled the night-watches, that I might meditate in Thy word.","Hear my voice according unto Thy lovingkindness; Quicken me, O LORD, as Thou art wont.","They draw nigh that follow after wickedness; they are far from Thy law.","Thou art nigh, O LORD; and all Thy commandments are truth.","Of old have I known from Thy testimonies that Thou hast founded them for ever.","RESH. O see mine affliction, and rescue me; For I do not forget Thy law.","Plead Thou my cause, and redeem me; Quicken me according to Thy word.","Salvation is far from the wicked; For they seek not Thy statutes.","Great are Thy compassions, O LORD; Quicken me as Thou art wont.","Many are my persecutors and mine adversaries; Yet have I not turned aside from Thy testimonies.","I beheld them that were faithless, and strove with them; Because they observed not Thy word.","O see how I love Thy precepts; Quicken me, O LORD, according to Thy lovingkindness.","The beginning of Thy word is truth; And all Thy righteous ordinance endureth for ever.","SCHIN. Princes have persecuted me without a cause; But my heart standeth in awe of Thy words.","I rejoice at Thy word, As one that findeth great spoil.","I hate and abhor falsehood; Thy law do I love. .","Seven times a day do I praise Thee, because of Thy righteous ordinances.","Great peace have they that love Thy law; And there is no stumbling for them.","I have hoped for Thy salvation, O LORD, And have done Thy commandments.","My soul hath observed Thy testimonies; And I love them exceedingly.","I have observed Thy precepts and Thy testimonies; For all my ways are before Thee.","TAV. Let my cry come near before Thee, O LORD; Give me understanding according to Thy word.","Let my supplication come before Thee; deliver me according to Thy word.","Let my lips utter praise: Because Thou teachest me Thy statutes.","Let my tongue sing of Thy word; For all Thy commandments are righteousness.","Let Thy hand be ready to help me; For I have chosen Thy precepts.","I have longed for Thy salvation, O LORD; And Thy law is my delight.","Let my soul live, and it shall praise Thee; And let Thine ordinances help me.","I have gone astray like a lost sheep; seek Thy servant; For I have not forgotten Thy commandments."]},{"n":120,"he":["שִׁיר הַֽמַּעֲלוֹת אֶל־יְהֹוָה בַּצָּרָתָה לִּי קָרָאתִי וַֽיַּעֲנֵֽנִי׃","יְֽהֹוָה הַצִּילָה נַפְשִׁי מִשְּׂפַת־שֶׁקֶר מִלָּשׁוֹן רְמִיָּֽה׃","מַה־יִּתֵּן לְךָ וּמַה־יֹּסִיף לָךְ לָשׁוֹן רְמִיָּֽה׃","חִצֵּי גִבּוֹר שְׁנוּנִים עִם גַּחֲלֵי רְתָמִֽים׃","אֽוֹיָה־לִי כִּי־גַרְתִּי מֶשֶׁךְ שָׁכַנְתִּי עִֽם־אׇהֳלֵי קֵדָֽר׃","רַבַּת שָֽׁכְנָה־לָּהּ נַפְשִׁי עִם שׂוֹנֵא שָׁלֽוֹם׃","אֲֽנִי־שָׁלוֹם וְכִי אֲדַבֵּר הֵמָּה לַמִּלְחָמָֽה׃ {פ}"],"lat":["shir hama'alot el-Adonai batsarata li karati vaya'aneni","Adonai hatsila nafshi misfat-sheker milashon remiya","ma-yiten lekha uma-yosif lakh lashon remiya","chitsei gibor shenunim im gachalei retamim","oya-li ki-garti meshekh shakhanti im-oholei kedar","rabat shakhna-lah nafshi im sone shalom","ani-shalom vekhi adaber hema lamilchama f"],"en":["A Song of Ascents. In my distress I called unto the LORD, And He answered me.","O LORD, deliver my soul from lying lips, From a deceitful tongue.","What shall be given unto thee, and what shall be done more unto thee, Thou deceitful tongue?","Sharp arrows of the mighty, With coals of broom.","Woe is me, that I sojourn with Meshech, That I dwell beside the tents of Kedar!","My soul hath full long had her dwelling With him that hateth peace.","I am all peace; But when I speak, they are for war."]},{"n":121,"he":["שִׁיר לַֽמַּעֲלוֹת אֶשָּׂא עֵינַי אֶל־הֶהָרִים מֵאַיִן יָבֹא עֶזְרִֽי׃","עֶזְרִי מֵעִם יְהֹוָה עֹשֵׂה שָׁמַיִם וָאָֽרֶץ׃","אַל־יִתֵּן לַמּוֹט רַגְלֶךָ אַל־יָנוּם שֹׁמְרֶֽךָ׃","הִנֵּה לֹֽא־יָנוּם וְלֹא יִישָׁן שׁוֹמֵר יִשְׂרָאֵֽל׃","יְהֹוָה שֹׁמְרֶךָ יְהֹוָה צִלְּךָ עַל־יַד יְמִינֶֽךָ׃","יוֹמָם הַשֶּׁמֶשׁ לֹֽא־יַכֶּכָּה וְיָרֵחַ בַּלָּֽיְלָה׃","יְֽהֹוָה יִשְׁמׇרְךָ מִכׇּל־רָע יִשְׁמֹר אֶת־נַפְשֶֽׁךָ׃","יְֽהֹוָה יִשְׁמׇר־צֵאתְךָ וּבוֹאֶךָ מֵעַתָּה וְעַד־עוֹלָֽם׃ {פ}"],"lat":["shir lama'alot esa einai el-heharim me'ayin yavo ezri","ezri me'im Adonai ose shamayim va'arets","al-yiten lamot raglekha al-yanum shomrekha","hine lo-yanum velo yishan shomer yisra'el","Adonai shomrekha Adonai tsilkha al-yad yeminekha","yomam hashemesh lo-yakeka veyareach balayla","Adonai yishmorkha mikol-ra' yishmor et-nafshekha","Adonai yishmor-tsetkha uvo'ekha me'ata ve'ad-olam f"],"en":["A Song of Ascents. I will lift up mine eyes unto the mountains: From whence shall my help come?","My help cometh from the LORD, Who made heaven and earth.","He will not suffer thy foot to be moved; He that keepeth thee will not slumber.","Behold, He that keepeth Israel Doth neither slumber nor sleep.","The LORD is thy keeper; The LORD is thy shade upon thy right hand.","The sun shall not smite thee by day, Nor the moon by night.","The LORD shall keep thee from all evil; He shall keep thy soul.","The LORD shall guard thy going out and thy coming in, From this time forth and for ever."]},{"n":122,"he":["שִׁיר הַֽמַּעֲלוֹת לְדָוִד שָׂמַחְתִּי בְּאֹמְרִים לִי בֵּית יְהֹוָה נֵלֵֽךְ׃","עֹמְדוֹת הָיוּ רַגְלֵינוּ בִּשְׁעָרַיִךְ יְרוּשָׁלָֽ͏ִם׃","יְרוּשָׁלַ͏ִם הַבְּנוּיָה כְּעִיר שֶׁחֻבְּרָה־לָּהּ יַחְדָּֽו׃","שֶׁשָּׁם עָלוּ שְׁבָטִים שִׁבְטֵי־יָהּ עֵדוּת לְיִשְׂרָאֵל לְהֹדוֹת לְשֵׁם יְהֹוָֽה׃","כִּי שָׁמָּה יָשְׁבוּ כִסְאוֹת לְמִשְׁפָּט כִּסְאוֹת לְבֵית דָּוִֽד׃","שַׁאֲלוּ שְׁלוֹם יְרוּשָׁלָ͏ִם יִשְׁלָיוּ אֹהֲבָֽיִךְ׃","יְהִי־שָׁלוֹם בְּחֵילֵךְ שַׁלְוָה בְּאַרְמְנוֹתָֽיִךְ׃","לְמַעַן אַחַי וְרֵעָי אֲדַבְּרָה־נָּא שָׁלוֹם בָּֽךְ׃","לְמַעַן בֵּית־יְהֹוָה אֱלֹהֵינוּ אֲבַקְשָׁה טוֹב לָֽךְ׃ {פ}"],"lat":["shir hama'alot ledavid samachti be'omrim li beit Adonai nelekh","omdot haiu ragleinu bish'arayikh yerushalam","yerushalam habnuya ke'ir shechubra-lah yachdav","shesham alu sh
