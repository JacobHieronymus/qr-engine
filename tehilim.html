 לִבִּי דָּבָר טוֹב אֹמֵר אָנִי מַעֲשַׂי לְמֶלֶךְ לְשׁוֹנִי עֵט סוֹפֵר מָהִֽיר׃","יׇפְיָפִיתָ מִבְּנֵי אָדָם הוּצַק חֵן בְּשִׂפְתוֹתֶיךָ עַל־כֵּן בֵּרַכְךָ אֱלֹהִים לְעוֹלָֽם׃","חֲגֽוֹר־חַרְבְּךָ עַל־יָרֵךְ גִּבּוֹר הוֹדְךָ וַהֲדָרֶֽךָ׃","וַהֲדָרְךָ צְלַח רְכַב עַֽל־דְּבַר־אֱמֶת וְעַנְוָה־צֶדֶק וְתוֹרְךָ נוֹרָאוֹת יְמִינֶֽךָ׃","חִצֶּיךָ שְׁנוּנִים עַמִּים תַּחְתֶּיךָ יִפְּלוּ בְּלֵב אוֹיְבֵי הַמֶּֽלֶךְ׃","כִּסְאֲךָ אֱלֹהִים עוֹלָם וָעֶד שֵׁבֶט מִישֹׁר שֵׁבֶט מַלְכוּתֶֽךָ׃","אָהַבְתָּ צֶּדֶק וַתִּשְׂנָא־רֶשַׁע עַל־כֵּן מְשָׁחֲךָ אֱלֹהִים אֱלֹהֶיךָ שֶׁמֶן שָׂשׂוֹן מֵחֲבֵרֶֽךָ׃","מֹר־וַאֲהָלוֹת קְצִיעוֹת כׇּל־בִּגְדֹתֶיךָ מִֽן־הֵיכְלֵי שֵׁן מִנִּי שִׂמְּחֽוּךָ׃","בְּנוֹת מְלָכִים בְּיִקְּרוֹתֶיךָ נִצְּבָה שֵׁגַל לִימִינְךָ בְּכֶתֶם אוֹפִֽיר׃","שִׁמְעִי־בַת וּרְאִי וְהַטִּי אׇזְנֵךְ וְשִׁכְחִי עַמֵּךְ וּבֵית אָבִֽיךְ׃","וְיִתְאָו הַמֶּלֶךְ יׇפְיֵךְ כִּי־הוּא אֲדֹנַיִךְ וְהִשְׁתַּֽחֲוִי־לֽוֹ׃","וּבַֽת־צֹר בְּמִנְחָה פָּנַיִךְ יְחַלּוּ עֲשִׁירֵי עָֽם׃","כׇּל־כְּבוּדָּה בַת־מֶלֶךְ פְּנִימָה מִֽמִּשְׁבְּצוֹת זָהָב לְבוּשָֽׁהּ׃","לִרְקָמוֹת תּוּבַל לַמֶּלֶךְ בְּתוּלוֹת אַחֲרֶיהָ רֵעוֹתֶיהָ מוּבָאוֹת לָֽךְ׃","תּוּבַלְנָה בִּשְׂמָחֹת וָגִיל תְּבֹאֶינָה בְּהֵיכַל מֶֽלֶךְ׃","תַּחַת אֲבֹתֶיךָ יִהְיוּ בָנֶיךָ תְּשִׁיתֵמוֹ לְשָׂרִים בְּכׇל־הָאָֽרֶץ׃","אַזְכִּירָה שִׁמְךָ בְּכׇל־דֹּר וָדֹר עַל־כֵּן עַמִּים יְהוֹדוּךָ לְעֹלָם וָעֶֽד׃ {פ}"],"lat":["lamnatseach al-shoshanim livnei-korach maskil shir yedidot","rachash libi davar tov omer ani ma'asai lemelekh leshoni et sofer mahir","yofyafita mibnei adam hutsak chen besiftoteikha al-ken berakhkha elohim le'olam","chagor-charbkha al-yarekh gibor hodkha vahadarekha","vahadarkha tselach rekhav al-devar-emet ve'anva-tsedek vetorkha noraot yeminekha","chitseikha shenunim amim tachteikha yiplu belev oyvei hamelekh","kis'akha elohim olam va'ed shevet mishor shevet malkhutekha","ahavta tsedek vatisna-resha' al-ken meshachakha elohim eloheikha shemen sason mechaverekha","mor-va'ahalot ketsi'ot kol-bigdoteikha min-heikhlei shen mini simchukha","benot melakhim beyikroteikha nitsva shegal liminkha bekhetem ofir","shim'i-vat ur'i vehati oznekh veshikhchi amekh uveit avikh","veyit'av hamelekh yofyekh ki-hu adonayikh vehishtachavi-lo","uvat-tsor bemincha panayikh yechalu ashirei am","kol-kevuda vat-melekh penima mimishbtsot zahav levushah","lirkamot tuval lamelekh betulot achareiah re'oteiah muvaot lakh","tuvalna bismachot vagil tevo'eina beheikhal melekh","tachat avoteikha yihyu vaneikha teshitemo lesarim bekhol-ha'arets","azkira shimkha bekhol-dor vador al-ken amim yehodukha le'olam va'ed f"],"en":["For the Leader; upon Shoshannim; [a Psalm] of the sons of Korah. Maschil. A Song of loves.","My heart overfloweth with a goodly matter; I say: 'My work is concerning a king'; My tongue is the pen of a ready writer.","Thou art fairer than the children of men; Grace is poured upon thy lips; Therefore God hath blessed thee for ever.","Gird thy sword upon thy thigh, O mighty one, Thy glory and thy majesty.","And in thy majesty prosper, ride on, In behalf of truth and meekness and righteousness; And let thy right hand teach thee tremendous things.","Thine arrows are sharp— The peoples fall under thee— [They sink] into the heart of the king's enemies.","Thy throne given of God is for ever and ever; A sceptre of equity is the sceptre of thy kingdom.","Thou hast loved righteousness, and hated wickedness; Therefore God, thy God, hath anointed thee With the oil of gladness above thy fellows.","Myrrh, and aloes, and cassia are all thy garments; Out of ivory palaces stringed instruments have made thee glad.","Kings' daughters are among thy favourites; At thy right hand doth stand the queen in gold of Ophir.","'Hearken, O daughter, and consider, and incline thine ear; Forget also thine own people, and thy father's house;","So shall the king desire thy beauty; For he is thy lord; and do homage unto him. .","And, O daughter of Tyre, the richest of the people Shall entreat thy favour with a gift.'","All glorious is the king's daughter within the palace; Her raiment is of chequer work inwrought with gold.","She shall be led unto the king on richly woven stuff; The virgins her companions in her train being brought unto thee.","They shall be led with gladness and rejoicing; They shall enter into the king's palace.","Instead of thy fathers shall be thy sons, Whom thou shalt make princes in all the land.","I will make thy name to be remembered in all generations; Therefore shall the peoples praise thee for ever and ever."]},{"n":46,"he":["לַמְנַצֵּחַ לִבְנֵי־קֹרַח עַֽל־עֲלָמוֹת שִֽׁיר׃","אֱלֹהִים לָנוּ מַחֲסֶה וָעֹז עֶזְרָה בְצָרוֹת נִמְצָא מְאֹֽד׃","עַל־כֵּן לֹֽא־נִירָא בְּהָמִיר אָרֶץ וּבְמוֹט הָרִים בְּלֵב יַמִּֽים׃","יֶהֱמוּ יֶחְמְרוּ מֵימָיו יִרְעֲשֽׁוּ־הָרִים בְּגַאֲוָתוֹ סֶֽלָה׃","נָהָר פְּלָגָיו יְשַׂמְּחוּ עִיר־אֱלֹהִים קְדֹשׁ מִשְׁכְּנֵי עֶלְיֽוֹן׃","אֱלֹהִים בְּקִרְבָּהּ בַּל־תִּמּוֹט יַעְזְרֶהָ אֱלֹהִים לִפְנוֹת בֹּֽקֶר׃","הָמוּ גוֹיִם מָטוּ מַמְלָכוֹת נָתַן בְּקוֹלוֹ תָּמוּג אָֽרֶץ׃","יְהֹוָה צְבָאוֹת עִמָּנוּ מִשְׂגָּֽב־לָנוּ אֱלֹהֵי יַעֲקֹב סֶֽלָה׃","לְֽכוּ־חֲזוּ מִפְעֲלוֹת יְהֹוָה אֲשֶׁר־שָׂם שַׁמּוֹת בָּאָֽרֶץ׃","מַשְׁבִּית מִלְחָמוֹת עַד־קְצֵה הָאָרֶץ קֶשֶׁת יְשַׁבֵּר וְקִצֵּץ חֲנִית עֲגָלוֹת יִשְׂרֹף בָּאֵֽשׁ׃","הַרְפּוּ וּדְעוּ כִּֽי־אָנֹכִי אֱלֹהִים אָרוּם בַּגּוֹיִם אָרוּם בָּאָֽרֶץ׃","יְהֹוָה צְבָאוֹת עִמָּנוּ מִשְׂגָּֽב־לָנוּ אֱלֹהֵי יַעֲקֹב סֶֽלָה׃ {פ}"],"lat":["lamnatseach livnei-korach al-alamot shir","elohim lanu machase va'oz ezra vetsarot nimtsa me'od","al-ken lo-nira behamir arets uvmot harim belev yamim","yehemu yechmru meimaiv yir'ashu-harim bega'avato sela","nahar pelagaiv yesamchu ir-elohim kedosh mishknei elyon","elohim bekirbah bal-timot ya'zreah elohim lifnot boker","hamu goyim matu mamlakhot natan bekolo tamug arets","Adonai tsevaot imanu misgav-lanu elohei ya'akov sela","lekhu-chazu mif'alot Adonai asher-sam shamot ba'arets","mashbit milchamot ad-ketse ha'arets keshet yeshaber vekitsets chanit agalot yisrof ba'esh","harpu ud'u ki-anokhi elohim arum bagoyim arum ba'arets","Adonai tsevaot imanu misgav-lanu elohei ya'akov sela f"],"en":["For the Leader; [a Psalm] of the sons of Korah; upon Alamoth. A Song.","God is our refuge and strength, A very present help in trouble.","Therefore will we not fear, though the earth do change, And though the mountains be moved into the heart of the seas;","Though the waters thereof roar and foam, Though the mountains shake at the swelling thereof. Selah","There is a river, the streams whereof make glad the city of God, The holiest dwelling-place of the Most High.","God is in the midst of her, she shall not be moved; God shall help her, at the approach of morning.","Nations were in tumult, kingdoms were moved; He uttered His voice, the earth melted.","The LORD of hosts is with us; The God of Jacob is our high tower. Selah","Come, behold the works of the LORD, Who hath made desolations in the earth.","He maketh wars to cease unto the end of the earth; He breaketh the bow, and cutteth the spear in sunder; He burneth the chariots in the fire.","'Let be, and know that I am God; I will be exalted among the nations, I will be exalted in the earth.'","The LORD of hosts is with us; The God of Jacob is our high tower. Selah"]},{"n":47,"he":["לַמְנַצֵּחַ לִבְנֵי־קֹרַח מִזְמֽוֹר׃","כׇּֽל־הָעַמִּים תִּקְעוּ־כָף הָרִיעוּ לֵאלֹהִים בְּקוֹל רִנָּֽה׃","כִּֽי־יְהֹוָה עֶלְיוֹן נוֹרָא מֶלֶךְ גָּדוֹל עַל־כׇּל־הָאָֽרֶץ׃","יַדְבֵּר עַמִּים תַּחְתֵּינוּ וּלְאֻמִּים תַּחַת רַגְלֵֽינוּ׃","יִבְחַר־לָנוּ אֶת־נַחֲלָתֵנוּ אֶת־גְּאוֹן יַעֲקֹב אֲשֶׁר־אָהֵב סֶֽלָה׃","עָלָה אֱלֹהִים בִּתְרוּעָה יְהֹוָה בְּקוֹל שׁוֹפָֽר׃","זַמְּרוּ אֱלֹהִים זַמֵּרוּ זַמְּרוּ לְמַלְכֵּנוּ זַמֵּֽרוּ׃","כִּי מֶלֶךְ כׇּל־הָאָרֶץ אֱלֹהִים זַמְּרוּ מַשְׂכִּֽיל׃","מָלַךְ אֱלֹהִים עַל־גּוֹיִם אֱלֹהִים יָשַׁב עַל־כִּסֵּא קׇדְשֽׁוֹ׃","נְדִיבֵי עַמִּים נֶאֱסָפוּ עַם אֱלֹהֵי אַבְרָהָם כִּי לֵאלֹהִים מָֽגִנֵּי־אֶרֶץ מְאֹד נַעֲלָֽה׃ {פ}"],"lat":["lamnatseach livnei-korach mizmor","kol-ha'amim tik'u-khaf hari'u lelohim bekol rina","ki-Adonai elyon nora melekh gadol al-kol-ha'arets","yadber amim tachteinu ul'umim tachat ragleinu","yivchar-lanu et-nachalatenu et-geon ya'akov asher-ahev sela","ala elohim bitru'a Adonai bekol shofar","zamru elohim zameru zamru lemalkenu zameru","ki melekh kol-ha'arets elohim zamru maskil","malakh elohim al-goyim elohim yashav al-kise kodsho","nedivei amim ne'esafu am elohei avraham ki lelohim maginei-erets me'od na'ala f"],"en":["For the Leader; a Psalm for the sons of Korah.","O clap your hands, all ye peoples; shout unto God with the voice of triumph. .","For the LORD is most high, awful; a great King over all the earth.","He subdueth peoples under us, and nations under our feet.","He chooseth our inheritance for us, the pride of Jacob whom He loveth. Selah","God is gone up amidst shouting, the LORD amidst the sound of the horn.","Sing praises to God, sing praises; sing praises unto our King, sing praises.","For God is the King of all the earth; sing ye praises in a skilful song.","God reigneth over the nations; God sitteth upon His holy throne.","The princes of the peoples are gathered together, the people of the God of Abraham; for unto God belong the shields of the earth; He is greatly exalted."]},{"n":48,"he":["שִׁיר מִזְמוֹר לִבְנֵי־קֹֽרַח׃","גָּדוֹל יְהֹוָה וּמְהֻלָּל מְאֹד בְּעִיר אֱלֹהֵינוּ הַר־קׇדְשֽׁוֹ׃","יְפֵה נוֹף מְשׂוֹשׂ כׇּל־הָאָרֶץ הַר־צִיּוֹן יַרְכְּתֵי צָפוֹן קִרְיַת מֶלֶךְ רָֽב׃","אֱלֹהִים בְּאַרְמְנוֹתֶיהָ נוֹדַע לְמִשְׂגָּֽב׃","כִּֽי־הִנֵּה הַמְּלָכִים נוֹעֲדוּ עָבְרוּ יַחְדָּֽו׃","הֵמָּה רָאוּ כֵּן תָּמָהוּ נִבְהֲלוּ נֶחְפָּֽזוּ׃","רְעָדָה אֲחָזָתַם שָׁם חִיל כַּיּוֹלֵדָֽה׃","בְּרוּחַ קָדִים תְּשַׁבֵּר אֳנִיּוֹת תַּרְשִֽׁישׁ׃","כַּאֲשֶׁר שָׁמַעְנוּ כֵּן רָאִינוּ בְּעִיר־יְהֹוָה צְבָאוֹת בְּעִיר אֱלֹהֵינוּ אֱלֹהִים יְכוֹנְנֶהָ עַד־עוֹלָם סֶֽלָה׃","דִּמִּינוּ אֱלֹהִים חַסְדֶּךָ בְּקֶרֶב הֵיכָלֶֽךָ׃","כְּשִׁמְךָ אֱלֹהִים כֵּן תְּהִלָּתְךָ עַל־קַצְוֵי־אֶרֶץ צֶדֶק מָלְאָה יְמִינֶֽךָ׃","יִשְׂמַח הַר־צִיּוֹן תָּגֵלְנָה בְּנוֹת יְהוּדָה לְמַעַן מִשְׁפָּטֶֽיךָ׃","סֹבּוּ צִיּוֹן וְהַקִּיפוּהָ סִפְרוּ מִגְדָּלֶֽיהָ׃","שִׁיתוּ לִבְּכֶם לְֽחֵילָהֿ פַּסְּגוּ אַרְמְנוֹתֶיהָ לְמַעַן תְּסַפְּרוּ לְדוֹר אַחֲרֽוֹן׃","כִּי זֶה אֱלֹהִים אֱלֹהֵינוּ עוֹלָם וָעֶד הוּא יְנַהֲגֵנוּ עַל־מֽוּת׃ {פ}"],"lat":["shir mizmor livnei-korach","gadol Adonai umhulal me'od be'ir eloheinu har-kodsho","yefe nof mesos kol-ha'arets har-tsiyon yarktei tsafon kiryat melekh rav","elohim be'armnoteiah noda' lemisgav","ki-hine hamlakhim no'adu avru yachdav","hema rau ken tamahu nivhalu nechpazu","re'ada achazatam sham chil kayoleda","beruach kadim teshaber oniyot tarshish","ka'asher shama'nu ken ra'inu be'ir-Adonai tsevaot be'ir eloheinu elohim yekhoneneah ad-olam sela","diminu elohim chasdekha bekerev heikhalekha","keshimkha elohim ken tehilatkha al-katsvei-erets tsedek mal'a yeminekha","yismach har-tsiyon tagelna benot yehuda lema'an mishpateikha","sobu tsiyon vehakifuah sifru migdaleiah","shitu libkhem lecheilah pasgu armnoteiah lema'an tesapru ledor acharon","ki ze elohim eloheinu olam va'ed hu yenahagenu al-mut f"],"en":["A Song; a Psalm of the sons of Korah.","Great is the LORD, and highly to be praised, In the city of our God, His holy mountain,","Fair in situation, the joy of the whole earth; Even mount Zion, the uttermost parts of the north, The city of the great King.","God in her palaces Hath made Himself known for a stronghold.","For, lo, the kings assembled themselves, They came onward together.","They saw, straightway they were amazed; They were affrighted, they hasted away.","Trembling took hold of them there, Pangs, as of a woman in travail.","With the east wind Thou breakest the ships of Tarshish.","As we have heard, so have we seen In the city of the LORD of hosts, in the city of our God— God establish it for ever. Selah","We have thought on Thy lovingkindness, O God, In the midst of Thy temple.","As is Thy name, O God, So is Thy praise unto the ends of the earth; Thy right hand is full of righteousness.","Let mount Zion be glad, Let the daughters of Judah rejoice, Because of Thy judgments.","Walk about Zion, and go round about her; Count the towers thereof.","Mark ye well her ramparts, Traverse her palaces; That ye may tell it to the generation following. .","For such is God, our God, for ever and ever; He will guide us eternally."]},{"n":49,"he":["לַמְנַצֵּחַ לִבְנֵי־קֹרַח מִזְמֽוֹר׃","שִׁמְעוּ־זֹאת כׇּל־הָעַמִּים הַאֲזִינוּ כׇּל־יֹשְׁבֵי חָֽלֶד׃","גַּם־בְּנֵי אָדָם גַּם־בְּנֵי־אִישׁ יַחַד עָשִׁיר וְאֶבְיֽוֹן׃","פִּי יְדַבֵּר חׇכְמוֹת וְהָגוּת לִבִּי תְבוּנֽוֹת׃","אַטֶּה לְמָשָׁל אׇזְנִי אֶפְתַּח בְּכִנּוֹר חִידָתִֽי׃","לָמָּה אִירָא בִּימֵי רָע עֲוֺן עֲקֵבַי יְסוּבֵּֽנִי׃","הַבֹּטְחִים עַל־חֵילָם וּבְרֹב עׇשְׁרָם יִתְהַלָּֽלוּ׃","אָח לֹא־פָדֹה יִפְדֶּה אִישׁ לֹא־יִתֵּן לֵאלֹהִים כׇּפְרֽוֹ׃","וְיֵקַר פִּדְיוֹן נַפְשָׁם וְחָדַל לְעוֹלָֽם׃","וִיחִי־עוֹד לָנֶצַח לֹא יִרְאֶה הַשָּֽׁחַת׃","כִּי יִרְאֶה חֲכָמִים יָמוּתוּ יַחַד כְּסִיל וָבַעַר יֹאבֵדוּ וְעָזְבוּ לַאֲחֵרִים חֵילָֽם׃","קִרְבָּם בָּתֵּימוֹ לְֽעוֹלָם מִשְׁכְּנֹתָם לְדוֹר וָדֹר קָרְאוּ בִשְׁמוֹתָם עֲלֵי אֲדָמֽוֹת׃","וְאָדָם בִּיקָר בַּל־יָלִין נִמְשַׁל כַּבְּהֵמוֹת נִדְמֽוּ׃","זֶה דַרְכָּם כֵּסֶל לָמוֹ וְאַחֲרֵיהֶם בְּפִיהֶם יִרְצוּ סֶֽלָה׃","כַּצֹּאן לִשְׁאוֹל שַׁתּוּ מָוֶת יִרְעֵם וַיִּרְדּוּ־בָם יְשָׁרִים לַבֹּקֶר (וצירם) [וְצוּרָם] לְבַלּוֹת שְׁאוֹל מִזְּבֻל לֽוֹ׃","אַךְ־אֱלֹהִים יִפְדֶּה נַפְשִׁי מִֽיַּד־שְׁאוֹל כִּי יִקָּחֵנִי סֶֽלָה׃","אַל־תִּירָא כִּֽי־יַעֲשִׁר אִישׁ כִּי־יִרְבֶּה כְּבוֹד בֵּיתֽוֹ׃","כִּי לֹא בְמוֹתוֹ יִקַּח הַכֹּל לֹֽא־יֵרֵד אַחֲרָיו כְּבוֹדֽוֹ׃","כִּֽי־נַפְשׁוֹ בְּחַיָּיו יְבָרֵךְ וְיוֹדֻךָ כִּי־תֵיטִיב לָֽךְ׃","תָּבוֹא עַד־דּוֹר אֲבוֹתָיו עַד־נֵצַח לֹא יִרְאוּ־אֽוֹר׃","אָדָם בִּיקָר וְלֹא יָבִין נִמְשַׁל כַּבְּהֵמוֹת נִדְמֽוּ׃ {פ}"],"lat":["lamnatseach livnei-korach mizmor","shim'u-zot kol-ha'amim ha'azinu kol-yoshvei chaled","gam-benei adam gam-benei-ish yachad ashir ve'evyon","pi yedaber chokhmot vehagut libi tevunot","ate lemashal ozni eftach bekhinor chidati","lama ira bimei ra' aon akevai yesubeni","habotchim al-cheilam uvrov oshram yithalalu","ach lo-fado yifde ish lo-yiten lelohim kofro","veyekar pidyon nafsham vechadal le'olam","vichi-od lanetsach lo yir'e hashachat","ki yir'e chakhamim yamutu yachad kesil vava'ar yovedu ve'azvu la'acherim cheilam","kirbam bateimo le'olam mishknotam ledor vador karu vishmotam alei adamot","ve'adam bikar bal-yalin nimshal kabhemot nidmu","ze darkam kesel lamo ve'achareihem befihem yirtsu sela","katson lishol shatu mavet yir'em vayirdu-vam yesharim laboker vtsyrm vtsuram levalot sheol mizvul lo","akh-elohim yifde nafshi miyad-sheol ki yikacheni sela","al-tira ki-ya'ashir ish ki-yirbe kevod beito","ki lo vemoto yikach hakol lo-yered acharaiv kevodo","ki-nafsho bechayaiv yevarekh veiodukha ki-teitiv lakh","tavo ad-dor avotaiv ad-netsach lo yiru-or","adam bikar velo yavin nimshal kabhemot nidmu f"],"en":["For the Leader; a Psalm for the sons of Korah.","Hear this, all ye peoples; Give ear, all ye inhabitants of the world,","Both low and high, Rich and poor together.","My mouth shall speak wisdom, and the meditation of my heart shall be understanding.","I will incline mine ear to a parable; I will open my dark saying upon the harp.","Wherefore should I fear in the days of evil, when the iniquity of my supplanters compasseth me about,","Of them that trust in their wealth, and boast themselves in the multitude of their riches?","No man can by any means redeem his brother, nor give to God a ransom for him—","For too costly is the redemption of their soul, and must be let alone for ever—","That he should still live always, that he should not see the pit.","For he seeth that wise men die, The fool and the brutish together perish, And leave their wealth to others.","Their inward thought is, that their houses shall continue for ever, And their dwelling-places to all generations; They call their lands after their own names.","But man abideth not in honour; He is like the beasts that perish.","This is the way of them that are foolish, and of those who after them approve their sayings. Selah","Like sheep they are appointed for the nether-world; death shall be their shepherd; and the upright shall have dominion over them in the morning; And their form shall be for the nether-world to wear away, That there be no habitation for it.","But God will redeem my soul from the power of the nether-world; For He shall receive me. Selah","Be not thou afraid when one waxeth rich, When the wealth of his house is increased;","For when he dieth he shall carry nothing away; His wealth shall not descend after him.","Though while he lived he blessed his soul: 'Men will praise thee, when thou shalt do well to thyself';","It shall go to the generation of his fathers; They shall never see the light. .","Man that is in honour understandeth not; He is like the beasts that perish."]},{"n":50,"he":["מִזְמוֹר לְאָסָף אֵל אֱֽלֹהִים יְֽהֹוָה דִּבֶּר וַיִּקְרָא־אָרֶץ מִמִּזְרַח־שֶׁמֶשׁ עַד־מְבֹאֽוֹ׃","מִצִּיּוֹן מִכְלַל־יֹפִי אֱלֹהִים הוֹפִֽיעַ׃","יָבֹא אֱלֹהֵינוּ וְֽאַל־יֶחֱרַשׁ אֵשׁ־לְפָנָיו תֹּאכֵל וּסְבִיבָיו נִשְׂעֲרָה מְאֹֽד׃","יִקְרָא אֶל־הַשָּׁמַיִם מֵעָל וְאֶל־הָאָרֶץ לָדִין עַמּֽוֹ׃","אִסְפוּ־לִי חֲסִידָי כֹּרְתֵי בְרִיתִי עֲלֵי־זָֽבַח׃","וַיַּגִּידוּ שָׁמַיִם צִדְקוֹ כִּֽי־אֱלֹהִים שֹׁפֵט הוּא סֶֽלָה׃","שִׁמְעָה עַמִּי וַאֲדַבֵּרָה יִשְׂרָאֵל וְאָעִידָה בָּךְ אֱלֹהִים אֱלֹהֶיךָ אָנֹֽכִי׃","לֹא עַל־זְבָחֶיךָ אוֹכִיחֶךָ וְעוֹלֹתֶיךָ לְנֶגְדִּי תָמִֽיד׃","לֹא־אֶקַּח מִבֵּיתְךָ פָר מִמִּכְלְאֹתֶיךָ עַתּוּדִֽים׃","כִּי־לִי כׇל־חַיְתוֹ־יָעַר בְּהֵמוֹת בְּהַרְרֵי־אָֽלֶף׃","יָדַעְתִּי כׇּל־עוֹף הָרִים וְזִיז שָׂדַי עִמָּדִֽי׃","אִם־אֶרְעַב לֹא־אֹמַר לָךְ כִּי־לִי תֵבֵל וּמְלֹאָֽהּ׃","הַאוֹכַל בְּשַׂר אַבִּירִים וְדַם עַתּוּדִים אֶשְׁתֶּֽה׃","זְבַח לֵאלֹהִים תּוֹדָה וְשַׁלֵּם לְעֶלְיוֹן נְדָרֶֽיךָ׃","וּקְרָאֵנִי בְּיוֹם צָרָה אֲחַלֶּצְךָ וּֽתְכַבְּדֵֽנִי׃","וְלָרָשָׁע אָמַר אֱלֹהִים מַה־לְּךָ לְסַפֵּר חֻקָּי וַתִּשָּׂא בְרִיתִי עֲלֵי־פִֽיךָ׃","וְאַתָּה שָׂנֵאתָ מוּסָר וַתַּשְׁלֵךְ דְּבָרַי אַחֲרֶֽיךָ׃","אִם־רָאִיתָ גַנָּב וַתִּרֶץ עִמּוֹ וְעִם מְנָאֲפִים חֶלְקֶֽךָ׃","פִּיךָ שָׁלַחְתָּ בְרָעָה וּלְשׁוֹנְךָ תַּצְמִיד מִרְמָֽה׃","תֵּשֵׁב בְּאָחִיךָ תְדַבֵּר בְּבֶֽן־אִמְּךָ תִּתֶּן־דֹּֽפִי׃","אֵלֶּה עָשִׂיתָ וְֽהֶחֱרַשְׁתִּי דִּמִּיתָ הֱיֽוֹת־אֶהְיֶה כָמוֹךָ אוֹכִיחֲךָ וְאֶעֶרְכָה לְעֵינֶֽיךָ׃","בִּינוּ־נָא זֹאת שֹׁכְחֵי אֱלוֹהַּ פֶּן־אֶטְרֹף וְאֵין מַצִּֽיל׃","זֹבֵחַ תּוֹדָה יְֽכַבְּדָנְנִי וְשָׂם דֶּרֶךְ אַרְאֶנּוּ בְּיֵשַׁע אֱלֹהִֽים׃ {פ}"],"lat":["mizmor le'asaf el elohim Adonai diber vayikra-arets mimizrach-shemesh ad-mevoo","mitsiyon mikhlal-yofi elohim hofia'","yavo eloheinu ve'al-yecherash esh-lefanaiv tokhel usvivaiv nis'ara me'od","yikra el-hashamayim me'al ve'el-ha'arets ladin amo","isfu-li chasidai kortei veriti alei-zavach","vayagidu shamayim tsidko ki-elohim shofet hu sela","shim'a ami va'adabera yisra'el ve'a'ida bakh elohim eloheikha anokhi","lo al-zevacheikha okhichekha ve'oloteikha lenegdi tamid","lo-ekach mibeitkha far mimikhl'oteikha atudim","ki-li khol-chayto-ya'ar behemot beharerei-alef","yada'ti kol-of harim veziz sadai imadi","im-er'av lo-omar lakh ki-li tevel umlo'ah","haokhal besar abirim vedam atudim eshte","zevach lelohim toda veshalem le'elyon nedareikha","ukra'eni beiom tsara achaletskha utkhabdeni","velarasha' amar elohim ma-lekha lesaper chukai vatisa veriti alei-fikha","ve'ata saneta musar vatashlekh devarai achareikha","im-ra'ita ganav vatirets imo ve'im mena'afim chelkekha","pikha shalachta vera'a ulshonkha tatsmid mirma","teshev be'achikha tedaber beven-imkha titen-dofi","ele asita vehecherashti dimita heiot-ehye khamokha okhichakha ve'e'erkha le'eineikha","binu-na zot shokhchei eloah pen-etrof ve'ein matsil","zoveach toda yekhabdaneni vesam derekh ar'enu beyesha' elohim f"],"en":["A Psalm of Asaph. God, God, the LORD, hath spoken, and called the earth From the rising of the sun unto the going down thereof.","Out of Zion, the perfection of beauty, God hath shined forth.","Our God cometh, and doth not keep silence; a fire devoureth before Him, And round about Him it stormeth mightily.","He calleth to the heavens above, and to the earth, that He may judge His people:","'Gather My saints together unto Me; those that have made a covenant with Me by sacrifice.'","And the heavens declare His righteousness; for God, He is judge. Selah","'Hear, O My people, and I will speak; O Israel, and I will testify against thee: God, thy God, am I.","I will not reprove thee for thy sacrifices; and thy burnt-offerings are continually before Me.","I will take no bullock out of thy house, nor he-goats out of thy folds.","For every beast of the forest is Mine, and the cattle upon a thousand hills.","I know all the fowls of the mountains; and the wild beasts of the field are Mine.","If I were hungry, I would not tell thee; for the world is Mine, and the fulness thereof.","Do I eat the flesh of bulls, or drink the blood of goats?","Offer unto God the sacrifice of thanksgiving; and pay thy vows unto the Most High;","And call upon Me in the day of trouble; I will deliver thee, and thou shalt honour Me.'","But unto the wicked God saith: 'What hast thou to do to declare My statutes, And that thou hast taken My covenant in thy mouth?","Seeing thou hatest instruction, and castest My words behind thee.","When thou sawest a thief, thou hadst company with him, and with adulterers was thy portion.","Thou hast let loose thy mouth for evil, and thy tongue frameth deceit. .","Thou sittest and speakest against thy brother; Thou slanderest thine own mother's son.","These things hast thou done, and should I have kept silence? Thou hadst thought that I was altogether such a one as thyself; but I will reprove thee, and set the cause before thine eyes.","Now consider this, ye that forget God, lest I tear in pieces, and there be none to deliver.","Whoso offereth the sacrifice of thanksgiving honoureth Me; and to him that ordereth his way aright Will I show the salvation of God.'"]},{"n":51,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃","בְּֽבוֹא־אֵלָיו נָתָן הַנָּבִיא כַּאֲשֶׁר־בָּא אֶל־בַּת־שָֽׁבַע׃","חׇנֵּנִי אֱלֹהִים כְּחַסְדֶּךָ כְּרֹב רַחֲמֶיךָ מְחֵה פְשָׁעָֽי׃","(הרבה) [הֶרֶב] כַּבְּסֵנִי מֵעֲוֺנִי וּֽמֵחַטָּאתִי טַהֲרֵֽנִי׃","כִּֽי־פְשָׁעַי אֲנִי אֵדָע וְחַטָּאתִי נֶגְדִּי תָמִֽיד׃","לְךָ לְבַדְּךָ חָטָאתִי וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי לְמַעַן תִּצְדַּק בְּדׇבְרֶךָ תִּזְכֶּה בְשׇׁפְטֶֽךָ׃","הֵן־בְּעָווֹן חוֹלָלְתִּי וּבְחֵטְא יֶחֱמַתְנִי אִמִּֽי׃","הֵן־אֱמֶת חָפַצְתָּ בַטֻּחוֹת וּבְסָתֻם חׇכְמָה תוֹדִיעֵֽנִי׃","תְּחַטְּאֵנִי בְאֵזוֹב וְאֶטְהָר תְּכַבְּסֵנִי וּמִשֶּׁלֶג אַלְבִּֽין׃","תַּשְׁמִיעֵנִי שָׂשׂוֹן וְשִׂמְחָה תָּגֵלְנָה עֲצָמוֹת דִּכִּֽיתָ׃","הַסְתֵּר פָּנֶיךָ מֵחֲטָאָי וְֽכׇל־עֲוֺנֹתַי מְחֵֽה׃","לֵב טָהוֹר בְּרָא־לִי אֱלֹהִים וְרוּחַ נָכוֹן חַדֵּשׁ בְּקִרְבִּֽי׃","אַל־תַּשְׁלִיכֵנִי מִלְּפָנֶיךָ וְרוּחַ קׇדְשְׁךָ אַל־תִּקַּח מִמֶּֽנִּי׃","הָשִׁיבָה לִּי שְׂשׂוֹן יִשְׁעֶךָ וְרוּחַ נְדִיבָה תִסְמְכֵֽנִי׃","אֲלַמְּדָה פֹשְׁעִים דְּרָכֶיךָ וְחַטָּאִים אֵלֶיךָ יָשֽׁוּבוּ׃","הַצִּילֵנִי מִדָּמִים אֱֽלֹהִים אֱלֹהֵי תְשׁוּעָתִי תְּרַנֵּן לְשׁוֹנִי צִדְקָתֶֽךָ׃","אֲדֹנָי שְׂפָתַי תִּפְתָּח וּפִי יַגִּיד תְּהִלָּתֶֽךָ׃","כִּי לֹא־תַחְפֹּץ זֶבַח וְאֶתֵּנָה עוֹלָה לֹא תִרְצֶֽה׃","זִבְחֵי אֱלֹהִים רוּחַ נִשְׁבָּרָה לֵב־נִשְׁבָּר וְנִדְכֶּה אֱלֹהִים לֹא תִבְזֶֽה׃","הֵיטִיבָה בִרְצוֹנְךָ אֶת־צִיּוֹן תִּבְנֶה חוֹמוֹת יְרוּשָׁלָֽ͏ִם׃","אָז תַּחְפֹּץ זִבְחֵי־צֶדֶק עוֹלָה וְכָלִיל אָז יַעֲלוּ עַל־מִזְבַּחֲךָ פָרִֽים׃ {פ}"],"lat":["lamnatseach mizmor ledavid","bevo-elaiv natan hanavi ka'asher-ba el-bat-shava'","choneni elohim kechasdekha kerov rachameikha meche fesha'ai","hrvh herev kabseni me'aoni umechatati tahareni","ki-fesha'ai ani eda' vechatati negdi tamid","lekha levadkha chatati vehara' be'eineikha asiti lema'an titsdak bedovrekha tizke veshoftekha","hen-be'avon cholalti uvchet yechematni imi","hen-emet chafatsta vatuchot uvsatum chokhma todi'eni","techat'eni ve'ezov ve'ethar tekhabseni umisheleg albin","tashmi'eni sason vesimcha tagelna atsamot dikita","haster paneikha mechata'ai vekhol-aonotai meche","lev tahor bera-li elohim veruach nakhon chadesh bekirbi","al-tashlikheni milfaneikha veruach kodshkha al-tikach mimeni","hashiva li seson yish'ekha veruach nediva tismkheni","alamda fosh'im derakheikha vechata'im eleikha yashuvu","hatsileni midamim elohim elohei teshu'ati teranen leshoni tsidkatekha","adonai sefatai tiftach ufi yagid tehilatekha","ki lo-tachpots zevach ve'etena ola lo tirtse","zivchei elohim ruach nishbara lev-nishbar venidke elohim lo tivze","heitiva virtsonkha et-tsiyon tivne chomot yerushalam","az tachpots zivchei-tsedek ola vekhalil az ya'alu al-mizbachakha farim f"],"en":["For the Leader. A Psalm of David;","when Nathan the prophet came unto him, after he had gone in to Bath-sheba.","Be gracious unto me, O God, according to Thy mercy; According to the multitude of Thy compassions blot out my transgressions.","Wash me thoroughly from mine iniquity, And cleanse me from my sin.","For I know my transgressions; And my sin is ever before me.","Against Thee, Thee only, have I sinned, And done that which is evil in Thy sight; That Thou mayest be justified when Thou speakest, And be in the right when Thou judgest.","Behold, I was brought forth in iniquity, and in sin did my mother conceive me.","Behold, Thou desirest truth in the inward parts; make me, therefore, to know wisdom in mine inmost heart.","Purge me with hyssop, and I shall be clean; wash me, and I shall be whiter than snow.","Make me to hear joy and gladness; that the bones which Thou hast crushed may rejoice.","Hide Thy face from my sins, and blot out all mine iniquities.","Create me a clean heart, O God; and renew a stedfast spirit within me.","Cast me not away from Thy presence; and take not Thy holy spirit from me.","Restore unto me the joy of Thy salvation; and let a willing spirit uphold me.","Then will I teach transgressors Thy ways; and sinners shall return unto Thee. .","Deliver me from bloodguiltiness, O God, Thou God of my salvation; so shall my tongue sing aloud of Thy righteousness.","O Lord, open Thou my lips; and my mouth shall declare Thy praise.","For Thou delightest not in sacrifice, else would I give it; Thou hast no pleasure in burnt-offering.","The sacrifices of God are a broken spirit; a broken and a contrite heart, O God, Thou wilt not despise.","Do good in Thy favour unto Zion; build Thou the walls of Jerusalem.","Then wilt Thou delight in the sacrifices of righteousness, in burnt-offering and whole offering; Then will they offer bullocks upon Thine altar."]},{"n":52,"he":["לַמְנַצֵּחַ מַשְׂכִּיל לְדָוִֽד׃","בְּבוֹא דּוֹאֵג הָאֲדֹמִי וַיַּגֵּד לְשָׁאוּל וַיֹּאמֶר לוֹ בָּא דָוִד אֶל־בֵּית אֲחִימֶֽלֶךְ׃","מַה־תִּתְהַלֵּל בְּרָעָה הַגִּבּוֹר חֶסֶד אֵל כׇּל־הַיּֽוֹם׃","הַוּוֹת תַּחְשֹׁב לְשׁוֹנֶךָ כְּתַעַר מְלֻטָּשׁ עֹשֵׂה רְמִיָּֽה׃","אָהַבְתָּ רָּע מִטּוֹב שֶׁקֶר מִדַּבֵּר צֶדֶק סֶֽלָה׃","אָהַבְתָּ כׇֽל־דִּבְרֵי־בָלַע לְשׁוֹן מִרְמָֽה׃","גַּם־אֵל יִתׇּצְךָ לָנֶצַח יַחְתְּךָ וְיִסָּחֲךָ מֵאֹהֶל וְשֵׁרֶשְׁךָ מֵאֶרֶץ חַיִּים סֶֽלָה׃","וְיִרְאוּ צַדִּיקִים וְיִירָאוּ וְעָלָיו יִשְׂחָֽקוּ׃","הִנֵּה הַגֶּבֶר לֹא יָשִׂים אֱלֹהִים מָעוּזּוֹ וַיִּבְטַח בְּרֹב עׇשְׁרוֹ יָעֹז בְּהַוָּתֽוֹ׃","וַאֲנִי כְּזַיִת רַעֲנָן בְּבֵית אֱלֹהִים בָּטַחְתִּי בְחֶסֶד־אֱלֹהִים עוֹלָם וָעֶֽד׃","אוֹדְךָ לְעוֹלָם כִּי עָשִׂיתָ וַאֲקַוֶּה שִׁמְךָ כִי־טוֹב נֶגֶד חֲסִידֶֽיךָ׃ {פ}"],"lat":["lamnatseach maskil ledavid","bevo do'eg ha'adomi vayaged leshaul vayomer lo ba david el-beit achimelekh","ma-tithalel bera'a hagibor chesed el kol-hayom","hauot tachshov leshonekha keta'ar melutash ose remiya","ahavta ra' mitov sheker midaber tsedek sela","ahavta khol-divrei-vala' leshon mirma","gam-el yitotskha lanetsach yachtkha veyisachakha me'ohel veshereshkha me'erets chayim sela","veyiru tsadikim veyirau ve'alaiv yischaku","hine hagever lo yasim elohim ma'uzo vayivtach berov oshro ya'oz behavato","va'ani kezayit ra'anan beveit elohim batachti vechesed-elohim olam va'ed","odkha le'olam ki asita va'akave shimkha khi-tov neged chasideikha f"],"en":["For the Leader. Maschil of David;","when Doeg the Edomite came and told Saul, and said unto him: 'David is come to the house of Ahimelech.'","Why boastest thou thyself of evil, O mighty man? The mercy of God endureth continually.","Thy tongue deviseth destruction; Like a sharp razor, working deceitfully.","Thou lovest evil more than good; Falsehood rather than speaking righteousness. Selah","Thou lovest all devouring words, The deceitful tongue.","God will likewise break thee for ever, He will take thee up, and pluck thee out of thy tent, And root thee out of the land of the living. Selah","The righteous also shall see, and fear, And shall laugh at him:","'Lo, this is the man that made not God his stronghold; But trusted in the abundance of his riches, And strengthened himself in his wickedness.'","But as for me, I am like a leafy olive-tree in the house of God; I trust in the mercy of God for ever and ever.","I will give Thee thanks for ever, because Thou hast done it; And I will wait for Thy name, for it is good, in the presence of Thy saints."]},{"n":53,"he":["לַמְנַצֵּחַ עַֽל־מָחֲלַת מַשְׂכִּיל לְדָוִֽד׃","אָמַר נָבָל בְּלִבּוֹ אֵין אֱלֹהִים הִֽשְׁחִיתוּ וְהִֽתְעִיבוּ עָוֶל אֵין עֹֽשֵׂה־טֽוֹב׃","אֱֽלֹהִים מִשָּׁמַיִם הִשְׁקִיף עַֽל־בְּנֵי־אָדָם לִרְאוֹת הֲיֵשׁ מַשְׂכִּיל דֹּרֵשׁ אֶת־אֱלֹהִֽים׃","כֻּלּוֹ סָג יַחְדָּו נֶאֱלָחוּ אֵין עֹֽשֵׂה־טוֹב אֵין גַּם־אֶחָֽד׃","הֲלֹא יָדְעוּ פֹּעֲלֵי אָוֶן אֹכְלֵי עַמִּי אָכְלוּ לֶחֶם אֱלֹהִים לֹא קָרָֽאוּ׃","שָׁם פָּחֲדוּ פַחַד לֹא־הָיָה פָחַד כִּֽי־אֱלֹהִים פִּזַּר עַצְמוֹת חֹנָךְ הֱבִשֹׁתָה כִּֽי־אֱלֹהִים מְאָסָֽם׃","מִי־יִתֵּן מִצִּיּוֹן יְשֻׁעוֹת יִשְׂרָאֵל בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ יָגֵל יַעֲקֹב יִשְׂמַח יִשְׂרָאֵֽל׃ {פ}"],"lat":["lamnatseach al-machalat maskil ledavid","amar naval belibo ein elohim hishchitu vehit'ivu avel ein ose-tov","elohim mishamayim hishkif al-benei-adam lirot hayesh maskil doresh et-elohim","kulo sag yachdav ne'elachu ein ose-tov ein gam-echad","halo yad'u po'alei aven okhlei ami akhlu lechem elohim lo karau","sham pachadu fachad lo-haya fachad ki-elohim pizar atsmot chonakh hevishota ki-elohim me'asam","mi-yiten mitsiyon yeshu'ot yisra'el beshuv elohim shevut amo yagel ya'akov yismach yisra'el f"],"en":["For the Leader; upon Mahalath. Maschil of David.","The fool hath said in his heart: 'There is no God'; They have dealt corruptly, and have done abominable iniquity; There is none that doeth good.","God looked forth from heaven upon the children of men, To see if there were any man of understanding, that did seek after God.","Every one of them is unclean, they are together become impure; There is none that doeth good, no, not one.","’Shall not the workers of iniquity know it, Who eat up My people as they eat bread, And call not upon God?'","There are they in great fear, where no fear was; For God hath scattered the bones of him that encampeth against thee; Thou hast put them to shame, because God hath rejected them.","Oh that the salvation of Israel were come out of Zion! When God turneth the captivity of His people, Let Jacob rejoice, let Israel be glad."]},{"n":54,"he":["לַמְנַצֵּחַ בִּנְגִינֹת מַשְׂכִּיל לְדָוִֽד׃","בְּבֹא הַזִּיפִים וַיֹּאמְרוּ לְשָׁאוּל הֲלֹא דָוִד מִסְתַּתֵּר עִמָּֽנוּ׃","אֱלֹהִים בְּשִׁמְךָ הוֹשִׁיעֵנִי וּבִגְבוּרָתְךָ תְדִינֵֽנִי׃","אֱלֹהִים שְׁמַע תְּפִלָּתִי הַאֲזִינָה לְאִמְרֵי־פִֽי׃","כִּי זָרִים קָמוּ עָלַי וְֽעָרִיצִים בִּקְשׁוּ נַפְשִׁי לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם סֶֽלָה׃","הִנֵּה אֱלֹהִים עֹזֵר לִי אֲדֹנָי בְּֽסֹמְכֵי נַפְשִֽׁי׃","(ישוב) [יָשִׁיב] הָרַע לְשֹׁרְרָי בַּאֲמִתְּךָ הַצְמִיתֵֽם׃","בִּנְדָבָה אֶזְבְּחָה־לָּךְ אוֹדֶה־שִּׁמְךָ יְהֹוָה כִּי־טֽוֹב׃","כִּי מִכׇּל־צָרָה הִצִּילָנִי וּבְאֹיְבַי רָאֲתָה עֵינִֽי׃ {פ}"],"lat":["lamnatseach binginot maskil ledavid","bevo hazifim vayomru leshaul halo david mistater imanu","elohim beshimkha hoshi'eni uvigvuratkha tedineni","elohim shema' tefilati ha'azina le'imrei-fi","ki zarim kamu alai ve'aritsim bikshu nafshi lo samu elohim lenegdam sela","hine elohim ozer li adonai besomkhei nafshi","yshvv yashiv hara' leshorerai ba'amitkha hatsmitem","bindava ezbcha-lakh ode-shimkha Adonai ki-tov","ki mikol-tsara hitsilani uv'oyvai ra'ata eini f"],"en":["For the Leader; with string-music. Maschil of David:","when the Ziphites came and said to Saul: 'Doth not David hide himself with us?'","O God, save me by Thy name, And right me by Thy might.","O God, hear my prayer; give ear to the words of my mouth.","For strangers are risen up against me, And violent men have sought after my soul; They have not set God before them. Selah","Behold, God is my helper; The Lord is for me as the upholder of my soul.","He will requite the evil unto them that lie in wait for me; Destroy Thou them in Thy truth.","With a freewill-offering will I sacrifice unto Thee; I will give thanks unto Thy name, O LORD, for it is good.","For He hath delivered me out of all trouble; And mine eye hath gazed upon mine enemies."]},{"n":55,"he":["לַמְנַצֵּחַ בִּנְגִינֹת מַשְׂכִּיל לְדָוִֽד׃","הַאֲזִינָה אֱלֹהִים תְּפִלָּתִי וְאַל־תִּתְעַלַּם מִתְּחִנָּתִֽי׃","הַקְשִׁיבָה לִּי וַעֲנֵנִי אָרִיד בְּשִׂיחִי וְאָהִֽימָה׃","מִקּוֹל אוֹיֵב מִפְּנֵי עָקַת רָשָׁע כִּֽי־יָמִיטוּ עָלַי אָוֶן וּבְאַף יִשְׂטְמֽוּנִי׃","לִבִּי יָחִיל בְּקִרְבִּי וְאֵימוֹת מָוֶת נָפְלוּ עָלָֽי׃","יִרְאָה וָרַעַד יָבֹא בִי וַתְּכַסֵּנִי פַּלָּצֽוּת׃","וָאֹמַר מִֽי־יִתֶּן־לִי אֵבֶר כַּיּוֹנָה אָעוּפָה וְאֶשְׁכֹּֽנָה׃","הִנֵּה אַרְחִיק נְדֹד אָלִין בַּמִּדְבָּר סֶֽלָה׃","אָחִישָׁה מִפְלָט לִי מֵרוּחַ סֹעָה מִסָּֽעַר׃","בַּלַּע אֲדֹנָי פַּלַּג לְשׁוֹנָם כִּֽי־רָאִיתִי חָמָס וְרִיב בָּעִֽיר׃","יוֹמָם וָלַיְלָה יְסוֹבְבֻהָ עַל־חוֹמֹתֶיהָ וְאָוֶן וְעָמָל בְּקִרְבָּֽהּ׃","הַוּוֹת בְּקִרְבָּהּ וְֽלֹא־יָמִישׁ מֵרְחֹבָהּ תֹּךְ וּמִרְמָֽה׃","כִּי לֹֽא־אוֹיֵב יְחָֽרְפֵנִי וְאֶשָּׂא לֹא־מְשַׂנְאִי עָלַי הִגְדִּיל וְאֶסָּתֵר מִמֶּֽנּוּ׃","וְאַתָּה אֱנוֹשׁ כְּעֶרְכִּי אַלּוּפִי וּמְיֻדָּעִֽי׃","אֲשֶׁר יַחְדָּו נַמְתִּיק סוֹד בְּבֵית אֱלֹהִים נְהַלֵּךְ בְּרָֽגֶשׁ׃","(ישימות) [יַשִּׁי מָוֶת ] עָלֵימוֹ יֵרְדוּ שְׁאוֹל חַיִּים כִּֽי־רָעוֹת בִּמְגוּרָם בְּקִרְבָּֽם׃","אֲנִי אֶל־אֱלֹהִים אֶקְרָא וַיהֹוָה יוֹשִׁיעֵֽנִי׃","עֶרֶב וָבֹקֶר וְצׇהֳרַיִם אָשִׂיחָה וְאֶהֱמֶה וַיִּשְׁמַע קוֹלִֽי׃","פָּדָה בְשָׁלוֹם נַפְשִׁי מִקְּרׇב־לִי כִּֽי־בְרַבִּים הָיוּ עִמָּדִֽי׃","יִשְׁמַע אֵל וְֽיַעֲנֵם וְיֹשֵׁב קֶדֶם סֶלָה אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ וְלֹא יָרְאוּ אֱלֹהִֽים׃","שָׁלַח יָדָיו בִּשְׁלֹמָיו חִלֵּל בְּרִיתֽוֹ׃","חָלְקוּ מַחְמָאֹת פִּיו וּֽקְרָב־לִבּוֹ רַכּוּ דְבָרָיו מִשֶּׁמֶן וְהֵמָּה פְתִחֽוֹת׃","הַשְׁלֵךְ עַל־יְהֹוָה יְהָבְךָ וְהוּא יְכַלְכְּלֶךָ לֹא־יִתֵּן לְעוֹלָם מוֹט לַצַּדִּֽיק׃","וְאַתָּה אֱלֹהִים תּוֹרִדֵם לִבְאֵר שַׁחַת אַנְשֵׁי דָמִים וּמִרְמָה לֹא־יֶחֱצוּ יְמֵיהֶם וַאֲנִי אֶבְטַח־בָּֽךְ׃ {פ}"],"lat":["lamnatseach binginot maskil ledavid","ha'azina elohim tefilati ve'al-tit'alam mitchinati","hakshiva li va'aneni arid besichi ve'ahima","mikol oyev mipnei akat rasha' ki-yamitu alai aven uv'af yistmuni","libi yachil bekirbi ve'eimot mavet naflu alai","yir'a vara'ad yavo vi vatkhaseni palatsut","va'omar mi-yiten-li ever kayona a'ufa ve'eshkona","hine archik nedod alin bamidbar sela","achisha miflat li meruach so'a misa'ar","bala' adonai palag leshonam ki-ra'iti chamas veriv ba'ir","yomam valayla yesovevuah al-chomoteiah ve'aven ve'amal bekirbah","hauot bekirbah velo-yamish merchovah tokh umirma","ki lo-oyev yecharfeni ve'esa lo-mesan'i alai higdil ve'esater mimenu","ve'ata enosh ke'erki alufi umyuda'i","asher yachdav namtik sod beveit elohim nehalekh beragesh","yshymvt yashi mavet aleimo yerdu sheol chayim ki-ra'ot bimguram bekirbam","ani el-elohim ekra vaihova yoshi'eni","erev vavoker vetsohorayim asicha ve'eheme vayishma' koli","pada veshalom nafshi mikrov-li ki-verabim haiu imadi","yishma' el veya'anem veyoshev kedem sela asher ein chalifot lamo velo yaru elohim","shalach yadaiv bishlomaiv chilel berito","chalku machma'ot piv ukrav-libo raku devaraiv mishemen vehema fetichot","hashlekh al-Adonai yehavkha vehu yekhalklekha lo-yiten le'olam mot latsadik","ve'ata elohim toridem liv'er shachat anshei damim umirma lo-yechetsu yemeihem va'ani evtach-bakh f"],"en":["For the Leader; with string-music. Maschil of David.","Give ear, O God, to my prayer; And hide not Thyself from my supplication.","Attend unto me, and hear me; I am distraught in my complaint, and will moan;","Because of the voice of the enemy, because of the oppression of the wicked; For they cast mischief upon me, and in anger they persecute me.","My heart doth writhe within me; and the terrors of death are fallen upon me.","Fear and trembling come upon me, and horror hath overwhelmed me.","And I said: 'Oh that I had wings like a dove! Then would I fly away, and be at rest.","Lo, then would I wander far off, I would lodge in the wilderness. Selah","I would haste me to a shelter from the stormy wind and tempest.'","Destroy, O Lord, and divide their tongue; For I have seen violence and strife in the city.","Day and night they go about it upon the walls thereof; iniquity also and mischief are in the midst of it.","Wickedness is in the midst thereof; oppression and guile depart not from her broad place.","For it was not an enemy that taunted me, Then I could have borne it; Neither was it mine adversary that did magnify himself against me, Then I would have hid myself from him.","But it was thou, a man mine equal, My companion, and my familiar friend;","We took sweet counsel together, In the house of God we walked with the throng.","May He incite death against them, Let them go down alive into the nether-world; For evil is in their dwelling, and within them.","As for me, I will call upon God; And the LORD shall save me.","Evening, and morning, and at noon, will I complain, and moan; And He hath heard my voice.","He hath redeemed my soul in peace so that none came nigh me; For they were many that strove with me.","God shall hear, and humble them, even He that is enthroned of old, Selah, such as have no changes, and fear not God.","He hath put forth his hands against them that were at peace with him; He hath profaned his covenant.","Smoother than cream were the speeches of his mouth, But his heart was war; His words were softer than oil, Yet were they keen-edged swords.","Cast thy burden upon the LORD, and He will sustain thee; He will never suffer the righteous to be moved.","But Thou, O God, wilt bring them down into the nethermost pit; Men of blood and deceit shall not live out half their days; But as for me, I will trust in Thee."]},{"n":56,"he":["לַמְנַצֵּחַ עַל־יוֹנַת אֵלֶם רְחֹקִים לְדָוִד מִכְתָּם בֶּאֱחֹז אוֹתוֹ פְלִשְׁתִּים בְּגַֽת׃","חׇנֵּנִי אֱלֹהִים כִּֽי־שְׁאָפַנִי אֱנוֹשׁ כׇּל־הַיּוֹם לֹחֵם יִלְחָצֵֽנִי׃","שָׁאֲפוּ שׁוֹרְרַי כׇּל־הַיּוֹם כִּֽי־רַבִּים לֹחֲמִים לִי מָרֽוֹם׃","יוֹם אִירָא אֲנִי אֵלֶיךָ אֶבְטָֽח׃","בֵּאלֹהִים אֲהַלֵּל דְּבָרוֹ בֵּאלֹהִים בָּטַחְתִּי לֹא אִירָא מַה־יַּעֲשֶׂה בָשָׂר לִֽי׃","כׇּל־הַיּוֹם דְּבָרַי יְעַצֵּבוּ עָלַי כׇּל־מַחְשְׁבֹתָם לָרָֽע׃","יָגוּרוּ (יצפינו) [יִצְפּוֹנוּ] הֵמָּה עֲקֵבַי יִשְׁמֹרוּ כַּאֲשֶׁר קִוּוּ נַפְשִֽׁי׃","עַל־אָוֶן פַּלֶּט־לָמוֹ בְּאַף עַמִּים הוֹרֵד אֱלֹהִֽים׃","נֹדִי סָפַרְתָּה אָתָּה שִׂימָה דִמְעָתִי בְנֹאדֶךָ הֲלֹא בְּסִפְרָתֶֽךָ׃","אָז יָשׁוּבוּ אוֹיְבַי אָחוֹר בְּיוֹם אֶקְרָא זֶֽה־יָדַעְתִּי כִּֽי־אֱלֹהִים לִֽי׃","בֵּאלֹהִים אֲהַלֵּל דָּבָר בַּיהֹוָה אֲהַלֵּל דָּבָֽר׃","בֵּאלֹהִים בָּטַחְתִּי לֹּא אִירָא מַה־יַּעֲשֶׂה אָדָם לִֽי׃","עָלַי אֱלֹהִים נְדָרֶיךָ אֲשַׁלֵּם תּוֹדֹת לָֽךְ׃","כִּי הִצַּלְתָּ נַפְשִׁי מִמָּוֶת הֲלֹא רַגְלַי מִדֶּחִי לְהִֽתְהַלֵּךְ לִפְנֵי אֱלֹהִים בְּאוֹר הַחַיִּֽים׃ {פ}"],"lat":["lamnatseach al-yonat elem rechokim ledavid mikhtam be'echoz oto felishtim begat","choneni elohim ki-she'afani enosh kol-hayom lochem yilchatseni","sha'afu shorerai kol-hayom ki-rabim lochamim li marom","yom ira ani eleikha evtach","belohim ahalel devaro belohim batachti lo ira ma-ya'ase vasar li","kol-hayom devarai ye'atsevu alai kol-machshvotam lara'","yaguru ytsfynv yitsponu hema akevai yishmoru ka'asher kiuu nafshi","al-aven palet-lamo be'af amim hored elohim","nodi safarta ata sima dim'ati venodekha halo besifratekha","az yashuvu oyvai achor beiom ekra ze-yada'ti ki-elohim li","belohim ahalel davar baihova ahalel davar","belohim batachti lo ira ma-ya'ase adam li","alai elohim nedareikha ashalem todot lakh","ki hitsalta nafshi mimavet halo raglai midechi lehithalekh lifnei elohim beor hachayim f"],"en":["For the Leader; upon Jonath-elem-rehokim. [A Psalm] of David; Michtam; when the Philistines took him in Gath. .","Be gracious unto me, O God, for man would swallow me up; All the day he fighting oppresseth me.","They that lie in wait for me would swallow me up all the day; For they are many that fight against me, O Most High,","In the day that I am afraid, I will put my trust in Thee.","In God—I will praise His word— In God do I trust, I will not be afraid; What can flesh do unto me?","All the day they trouble mine affairs; All their thoughts are against me for evil.","They gather themselves together, they hide themselves, They mark my steps; According as they have waited for my soul.","Because of iniquity cast them out; In anger bring down the peoples, O God.","Thou has counted my wanderings; Put Thou my tears into Thy bottle; Are they not in Thy book?","Then shall mine enemies turn back in the day that I call; This I know, that God is for me.","In God—I will praise His word— In the LORD—I will praise His word—","In God do I trust, I will not be afraid; What can man do unto me?","Thy vows are upon me, O God; I will render thank-offerings unto Thee.","For thou hast delivered my soul from death; Hast Thou not delivered my feet from stumbling? That I may walk before God in the light of the living?"]},{"n":57,"he":["לַמְנַצֵּחַ אַל־תַּשְׁחֵת לְדָוִד מִכְתָּם בְּבׇרְחוֹ מִפְּנֵי־שָׁאוּל בַּמְּעָרָֽה׃","חׇנֵּנִי אֱלֹהִים חׇנֵּנִי כִּי בְךָ חָסָיָה נַפְשִׁי וּבְצֵֽל־כְּנָפֶיךָ אֶחְסֶה עַד יַעֲבֹר הַוּֽוֹת׃","אֶקְרָא לֵאלֹהִים עֶלְיוֹן לָאֵל גֹּמֵר עָלָֽי׃","יִשְׁלַח מִשָּׁמַיִם וְֽיוֹשִׁיעֵנִי חֵרֵף שֹׁאֲפִי סֶלָה יִשְׁלַח אֱלֹהִים חַסְדּוֹ וַאֲמִתּֽוֹ׃","נַפְשִׁי בְּתוֹךְ לְבָאִם אֶשְׁכְּבָה לֹהֲטִים בְּֽנֵי־אָדָם שִׁנֵּיהֶם חֲנִית וְחִצִּים וּלְשׁוֹנָם חֶרֶב חַדָּֽה׃","רוּמָה עַל־הַשָּׁמַיִם אֱלֹהִים עַל כׇּל־הָאָרֶץ כְּבוֹדֶֽךָ׃","רֶשֶׁת הֵכִינוּ לִפְעָמַי כָּפַף נַפְשִׁי כָּרוּ לְפָנַי שִׁיחָה נָפְלוּ בְתוֹכָהּ סֶֽלָה׃","נָכוֹן לִבִּי אֱלֹהִים נָכוֹן לִבִּי אָשִׁירָה וַאֲזַמֵּֽרָה׃","עוּרָה כְבוֹדִי עוּרָֽה הַנֵּבֶל וְכִנּוֹר אָעִירָה שָּֽׁחַר׃","אוֹדְךָ בָעַמִּים אֲדֹנָי אֲזַמֶּרְךָ בַּלְאֻמִּֽים׃","כִּֽי־גָדֹל עַד־שָׁמַיִם חַסְדֶּךָ וְֽעַד־שְׁחָקִים אֲמִתֶּֽךָ׃","רוּמָה עַל־שָׁמַיִם אֱלֹהִים עַל כׇּל־הָאָרֶץ כְּבוֹדֶֽךָ׃ {פ}"],"lat":["lamnatseach al-tashchet ledavid mikhtam bevorcho mipnei-shaul bam'ara","choneni elohim choneni ki vekha chasaya nafshi uvtsel-kenafeikha echse ad ya'avor hauot","ekra lelohim elyon la'el gomer alai","yishlach mishamayim veioshi'eni cheref sho'afi sela yishlach elohim chasdo va'amito","nafshi betokh leva'im eshkva lohatim benei-adam shineihem chanit vechitsim ulshonam cherev chada","ruma al-hashamayim elohim al kol-ha'arets kevodekha","reshet hekhinu lif'amai kafaf nafshi karu lefanai shicha naflu vetokhah sela","nakhon libi elohim nakhon libi ashira va'azamera","ura khevodi ura hanevel vekhinor a'ira shachar","odkha va'amim adonai azamerkha bal'umim","ki-gadol ad-shamayim chasdekha ve'ad-shechakim amitekha","ruma al-shamayim elohim al kol-ha'arets kevodekha f"],"en":["For the Leader; Al-tashheth. [A Psalm] of David; Michtam; when he fled from Saul, in the cave.","Be gracious unto me, O God, be gracious unto me, for in Thee hath my soul taken refuge; yea, in the shadow of Thy wings will I take refuge, until calamities be overpast.","I will cry unto God Most high; unto God that accomplisheth it for me.","He will send from heaven, and save me, when he that would swallow me up taunteth, Selah; God shall send forth His mercy and His truth.","My soul is among lions, I do lie down among them that are aflame; Even the sons of men, whose teeth are spears and arrows, And their tongue a sharp sword.","Be Thou exalted, O God, above the heavens; Thy glory be above all the earth.","They have prepared a net for my steps, My soul is bowed down; They have digged a pit before me, They are fallen into the midst thereof themselves. Selah","My heart is stedfast, O God, my heart is stedfast; I will sing, yea, I will sing praises.","Awake, my glory; awake, psaltery and harp; I will awake the dawn.","I will give thanks unto Thee, O Lord, among the peoples; I will sing praises unto Thee among the nations.","For Thy mercy is great unto the heavens, And Thy truth unto the skies.","Be Thou exalted, O God, above the heavens; Thy glory be above all the earth."]},{"n":58,"he":["לַמְנַצֵּחַ אַל־תַּשְׁחֵת לְדָוִד מִכְתָּֽם׃","הַאֻמְנָם אֵלֶם צֶדֶק תְּדַבֵּרוּן מֵישָׁרִים תִּשְׁפְּטוּ בְּנֵי אָדָֽם׃","אַף־בְּלֵב עוֹלֹת תִּפְעָלוּן בָּאָרֶץ חֲמַס יְדֵיכֶם תְּפַלֵּסֽוּן׃","זֹרוּ רְשָׁעִים מֵרָחֶם תָּעוּ מִבֶּטֶן דֹּבְרֵי כָזָֽב׃","חֲמַת־לָמוֹ כִּדְמוּת חֲמַת־נָחָשׁ כְּמוֹ־פֶתֶן חֵרֵשׁ יַאְטֵם אׇזְנֽוֹ׃","אֲשֶׁר לֹֽא־יִשְׁמַע לְקוֹל מְלַחֲשִׁים חוֹבֵר חֲבָרִים מְחֻכָּֽם׃","אֱֽלֹהִים הֲרׇס־שִׁנֵּימֽוֹ בְּפִימוֹ מַלְתְּעוֹת כְּפִירִים נְתֹץ יְהֹוָֽה׃","יִמָּאֲסוּ כְמוֹ־מַיִם יִתְהַלְּכוּ־לָמוֹ יִדְרֹךְ חִצָּו כְּמוֹ יִתְמֹלָֽלוּ׃","כְּמוֹ שַׁבְּלוּל תֶּמֶס יַהֲלֹךְ נֵפֶל אֵשֶׁת בַּל־חָזוּ שָֽׁמֶשׁ׃","בְּטֶרֶם יָבִינוּ סִּירֹתֵכֶם אָטָד כְּמוֹ־חַי כְּמוֹ־חָרוֹן יִשְׂעָרֶֽנּוּ׃","יִשְׂמַח צַדִּיק כִּי־חָזָה נָקָם פְּעָמָיו יִרְחַץ בְּדַם הָרָשָֽׁע׃","וְיֹאמַר אָדָם אַךְ־פְּרִי לַצַּדִּיק אַךְ יֵשׁ־אֱלֹהִים שֹׁפְטִים בָּאָֽרֶץ׃ {פ}"],"lat":["lamnatseach al-tashchet ledavid mikhtam","ha'umnam elem tsedek tedaberun meisharim tishptu benei adam","af-belev olot tif'alun ba'arets chamas yedeikhem tefalesun","zoru resha'im merachem ta'u mibeten dovrei khazav","chamat-lamo kidmut chamat-nachash kemo-feten cheresh ya'tem ozno","asher lo-yishma' lekol melachashim chover chavarim mechukam","elohim haros-shineimo befimo malt'ot kefirim netots Adonai","yima'asu khemo-mayim yithalkhu-lamo yidrokh chitsav kemo yitmolalu","kemo shablul temes yahalokh nefel eshet bal-chazu shamesh","beterem yavinu sirotekhem atad kemo-chai kemo-charon yis'arenu","yismach tsadik ki-chaza nakam pe'amaiv yirchats bedam harasha'","veyomar adam akh-peri latsadik akh yesh-elohim shoftim ba'arets f"],"en":["For the Leader; Al-tashheth. [A Psalm] of David; Michtam.","Do ye indeed speak as a righteous company? Do ye judge with equity the sons of men?","Yea, in heart ye work wickedness; Ye weigh out in the earth the violence of your hands.","The wicked are estranged from the womb; The speakers of lies go astray as soon as they are born.","Their venom is like the venom of a serpent; They are like the deaf asp that stoppeth her ear;","Which hearkeneth not to the voice of charmers, Or of the most cunning binder of spells.","Break their teeth, O God, in their mouth; Break out the cheek-teeth of the young lions, O LORD.","Let them melt away as water that runneth apace; When he aimeth his arrows, let them be as though they were cut off.","Let them be as a snail which melteth and passeth away; Like the untimely births of a woman, that have not seen the sun.","Before your pots can feel the thorns, He will sweep it away with a whirlwind, the raw and the burning alike.","The righteous shall rejoice when he seeth the vengeance; He shall wash his feet in the blood of the wicked.","And men shall say: 'Verily there is a reward for the righteous; Verily there is a God that judgeth in the earth.'"]},{"n":59,"he":["לַמְנַצֵּחַ אַל־תַּשְׁחֵת לְדָוִד מִכְתָּם בִּשְׁלֹחַ שָׁאוּל וַֽיִּשְׁמְרוּ אֶת־הַבַּיִת לַהֲמִיתֽוֹ׃","הַצִּילֵנִי מֵאֹיְבַי אֱלֹהָי מִֽמִּתְקוֹמְמַי תְּשַׂגְּבֵֽנִי׃","הַצִּילֵנִי מִפֹּעֲלֵי אָוֶן וּֽמֵאַנְשֵׁי דָמִים הוֹשִׁיעֵֽנִי׃","כִּי הִנֵּה אָרְבוּ לְנַפְשִׁי יָגוּרוּ עָלַי עַזִּים לֹֽא־פִשְׁעִי וְלֹא־חַטָּאתִי יְהֹוָֽה׃","בְּֽלִי־עָוֺן יְרֻצוּן וְיִכּוֹנָנוּ עוּרָה לִקְרָאתִי וּרְאֵֽה׃","וְאַתָּה יְהֹוָֽה־אֱלֹהִים צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל הָקִיצָה לִפְקֹד כׇּֽל־הַגּוֹיִם אַל־תָּחֹן כׇּל־בֹּגְדֵי אָוֶן סֶֽלָה׃","יָשׁוּבוּ לָעֶרֶב יֶהֱמוּ כַכָּלֶב וִיסוֹבְבוּ עִֽיר׃","הִנֵּה יַבִּיעוּן בְּפִיהֶם חֲרָבוֹת בְּשִׂפְתֽוֹתֵיהֶם כִּי־מִי שֹׁמֵֽעַ׃","וְאַתָּה יְהֹוָה תִּשְׂחַק־לָמוֹ תִּלְעַג לְכׇל־גּוֹיִֽם׃","עֻזּוֹ אֵלֶיךָ אֶשְׁמֹרָה כִּֽי־אֱלֹהִים מִשְׂגַּבִּֽי׃","אֱלֹהֵי (חסדו) [חַסְדִּי] יְקַדְּמֵנִי אֱלֹהִים יַרְאֵנִי בְשֹׁרְרָֽי׃","אַל־תַּהַרְגֵם פֶּֽן־יִשְׁכְּחוּ עַמִּי הֲנִיעֵמוֹ בְחֵילְךָ וְהוֹרִידֵמוֹ מָגִנֵּנוּ אֲדֹנָֽי׃","חַטַּאת־פִּימוֹ דְּֽבַר־שְׂפָתֵימוֹ וְיִלָּכְדוּ בִגְאוֹנָם וּמֵאָלָה וּמִכַּחַשׁ יְסַפֵּֽרוּ׃","כַּלֵּה בְחֵמָה כַּלֵּה וְֽאֵינֵמוֹ וְֽיֵדְעוּ כִּֽי־אֱלֹהִים מֹשֵׁל בְּֽיַעֲקֹב לְאַפְסֵי הָאָרֶץ סֶֽלָה׃","וְיָשֻׁבוּ לָעֶרֶב יֶהֱמוּ כַכָּלֶב וִיסוֹבְבוּ עִֽיר׃","הֵמָּה (ינועון) [יְנִיעוּן] לֶאֱכֹל אִם־לֹא יִשְׂבְּעוּ וַיָּלִֽינוּ׃","וַאֲנִי אָשִׁיר עֻזֶּךָ וַאֲרַנֵּן לַבֹּקֶר חַסְדֶּךָ כִּֽי־הָיִיתָ מִשְׂגָּב לִי וּמָנוֹס בְּיוֹם צַר־לִֽי׃","עֻזִּי אֵלֶיךָ אֲזַמֵּרָה כִּֽי־אֱלֹהִים מִשְׂגַּבִּי אֱלֹהֵי חַסְדִּֽי׃ {פ}"],"lat":["lamnatseach al-tashchet ledavid mikhtam bishloach shaul vayishmru et-habayit lahamito","hatsileni me'oyvai elohai mimitkomemai tesagveni","hatsileni mipo'alei aven ume'anshei damim hoshi'eni","ki hine arvu lenafshi yaguru alai azim lo-fish'i velo-chatati Adonai","beli-aon yerutsun veyikonanu ura likrati ur'e","ve'ata Adonai-elohim tsevaot elohei yisra'el hakitsa lifkod kol-hagoyim al-tachon kol-bogdei aven sela","yashuvu la'erev yehemu khakalev visovevu ir","hine yabi'un befihem charavot besiftoteihem ki-mi shomea'","ve'ata Adonai tischak-lamo til'ag lekhol-goyim","uzo eleikha eshmora ki-elohim misgabi","elohei chsdv chasdi yekadmeni elohim yar'eni veshorerai","al-tahargem pen-yishkchu ami hani'emo vecheilkha vehoridemo maginenu adonai","chatat-pimo devar-sefateimo veyilakhdu vigonam ume'ala umikachash yesaperu","kale vechema kale ve'einemo veyed'u ki-elohim moshel beya'akov le'afsei ha'arets sela","veyashuvu la'erev yehemu khakalev visovevu ir","hema ynv'vn yni'un le'ekhol im-lo yisb'u vayalinu","va'ani ashir uzekha va'aranen laboker chasdekha ki-hayita misgav li umanos beiom tsar-li","uzi eleikha azamera ki-elohim misgabi elohei chasdi f"],"en":["For the Leader; Al-tashheth. [A Psalm] of David; Michtam; when Saul sent, and they watched the house to kill him.","Deliver me from mine enemies, O my God; set me on high from them that rise up against me.","Deliver me from the workers of iniquity, and save me from the men of blood.","For, lo, they lie in wait for my soul; the impudent gather themselves together against me; not for my transgression, nor for my sin, O LORD.","Without my fault, they run and prepare themselves; awake Thou to help me, and behold.","Thou therefore, O LORD God of hosts, the God of Israel, arouse Thyself to punish all the nations; show no mercy to any iniquitous traitors. Selah","They return at evening, they howl like a dog, and go round about the city.","Behold, they belch out with their mouth; swords are in their lips: 'For who doth hear?'","But Thou, O LORD, shalt laugh at them; Thou shalt have all the nations in derision.","Because of his strength, I will wait for Thee; for God is my high tower.","The God of my mercy will come to meet me; God will let me gaze upon mine adversaries.","Slay them not, lest my people forget, make them wander to and fro by Thy power, and bring them down, O Lord our shield.","For the sin of their mouth, and the words of their lips, let them even be taken in their pride, and for cursing and lying which they speak.","Consume them in wrath, consume them, that they be no more; and let them know that God ruleth in Jacob, unto the ends of the earth. Selah","And they return at evening, they howl like a dog, and go round about the city;","They wander up and down to devour, and tarry all night if they have not their fill.","But as for me, I will sing of Thy strength; yea, I will sing aloud of Thy mercy in the morning; for Thou hast been my high tower, and a refuge in the day of my distress.","O my strength, unto Thee will I sing praises; for God is my high tower, the God of my mercy."]},{"n":60,"he":["לַמְנַצֵּחַ עַל־שׁוּשַׁן עֵדוּת מִכְתָּם לְדָוִד לְלַמֵּֽד׃","בְּהַצּוֹתוֹ אֶת־אֲרַם נַהֲרַיִם וְאֶת־אֲרַם צוֹבָה וַיָּשׇׁב יוֹאָב וַיַּךְ אֶת־אֱדוֹם בְּגֵיא־מֶלַח שְׁנֵים עָשָׂר אָֽלֶף׃","אֱלֹהִים זְנַחְתָּנוּ פְרַצְתָּנוּ אָנַפְתָּ תְּשׁוֹבֵֽב לָֽנוּ׃","הִרְעַשְׁתָּה אֶרֶץ פְּצַמְתָּהּ רְפָה שְׁבָרֶיהָ כִי־מָֽטָה׃","הִרְאִיתָ עַמְּךָ קָשָׁה הִשְׁקִיתָנוּ יַיִן תַּרְעֵלָֽה׃","נָתַתָּה לִּירֵאֶיךָ נֵּס לְהִתְנוֹסֵס מִפְּנֵי קֹשֶׁט סֶֽלָה׃","לְמַעַן יֵחָלְצוּן יְדִידֶיךָ הוֹשִׁיעָה יְמִינְךָ (ועננו) [וַעֲנֵֽנִי]׃","אֱלֹהִים דִּבֶּר בְּקׇדְשׁוֹ אֶעְלֹזָה אֲחַלְּקָה שְׁכֶם וְעֵמֶק סֻכּוֹת אֲמַדֵּֽד׃","לִי גִלְעָד וְלִי מְנַשֶּׁה וְאֶפְרַיִם מָעוֹז רֹאשִׁי יְהוּדָה מְחֹֽקְקִֽי׃","מוֹאָב סִיר רַחְצִי עַל־אֱדוֹם אַשְׁלִיךְ נַעֲלִי עָלַי פְּלֶשֶׁת הִתְרוֹעָֽעִי׃","מִי יֹבִלֵנִי עִיר מָצוֹר מִי נָחַנִי עַד־אֱדֽוֹם׃","הֲלֹֽא־אַתָּה אֱלֹהִים זְנַחְתָּנוּ וְֽלֹא־תֵצֵא אֱלֹהִים בְּצִבְאוֹתֵֽינוּ׃","הָֽבָה־לָּנוּ עֶזְרָת מִצָּר וְשָׁוְא תְּשׁוּעַת אָדָֽם׃","בֵּאלֹהִים נַֽעֲשֶׂה־חָיִל וְהוּא יָבוּס צָרֵֽינוּ׃ {פ}"],"lat":["lamnatseach al-shushan edut mikhtam ledavid lelamed","behatsoto et-aram naharayim ve'et-aram tsova vayashov yo'av vayakh et-edom begei-melach sheneim asar alef","elohim zenachtanu feratstanu anafta teshovev lanu","hir'ashta erets petsamtah refa shevareiah khi-mata","hir'ita amkha kasha hishkitanu yayin tar'ela","natata lire'eikha nes lehitnoses mipnei koshet sela","lema'an yechaltsun yedideikha hoshi'a yeminkha v'nnv va'aneni","elohim diber bekodsho e'loza achalka shekhem ve'emek sukot amaded","li gil'ad veli menashe ve'efrayim ma'oz roshi yehuda mechokeki","mo'av sir rachtsi al-edom ashlikh na'ali alai peleshet hitro'a'i","mi yovileni ir matsor mi nachani ad-edom","halo-ata elohim zenachtanu velo-tetse elohim betsivoteinu","hava-lanu ezrat mitsar veshav teshu'at adam","belohim na'ase-chayil vehu yavus tsareinu f"],"en":["For the Leader; upon Shushan Eduth; Michtam of David, to teach;","when he strove with Aram-naharaim and with Aram-zobah, and Joab returned, and smote of Edom in the Valley of Salt twelve thousand.","O God, Thou hast cast us off, Thou hast broken us down; Thou hast been angry; O restore us.","Thou hast made the land to shake, Thou hast cleft it; Heal the breaches thereof; for it tottereth.","Thou hast made Thy people to see hard things; Thou hast made us to drink the wine of staggering.","Thou hast given a banner to them that fear Thee, That it may be displayed because of the truth. Selah","That Thy beloved may be delivered, Save with Thy right hand, and answer me.","God spoke in His holiness, that I would exult; That I would divide Shechem, and mete out the valley of Succoth.","Gilead is mine, and Manasseh is mine; Ephraim also is the defence of my head; Judah is my sceptre.","Moab is my washpot; Upon Edom do I cast my shoe; Philistia, cry aloud because of me!","Who will bring me into the fortified city? Who will lead me unto Edom?","Hast not Thou, O God, cast us off? And Thou goest not forth, O God, with our hosts.","Give us help against the adversary; For vain is the help of man.","Through God we shall do valiantly; For He it is that will tread down our adversaries."]},{"n":61,"he":["לַמְנַצֵּחַ עַֽל־נְגִינַת לְדָוִֽד׃","שִׁמְעָה אֱלֹהִים רִנָּתִי הַקְשִׁיבָה תְּפִלָּתִֽי׃","מִקְצֵה הָאָרֶץ אֵלֶיךָ אֶקְרָא בַּעֲטֹף לִבִּי בְּצוּר־יָרוּם מִמֶּנִּי תַנְחֵֽנִי׃","כִּֽי־הָיִיתָ מַחְסֶה לִי מִגְדַּל־עֹז מִפְּנֵי אוֹיֵֽב׃","אָגוּרָה בְאׇהׇלְךָ עוֹלָמִים אֶחֱסֶה בְסֵתֶר כְּנָפֶיךָ סֶּֽלָה׃","כִּֽי־אַתָּה אֱלֹהִים שָׁמַעְתָּ לִנְדָרָי נָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶֽךָ׃","יָמִים עַל־יְמֵי־מֶלֶךְ תּוֹסִיף שְׁנוֹתָיו כְּמוֹ־דֹר וָדֹֽר׃","יֵשֵׁב עוֹלָם לִפְנֵי אֱלֹהִים חֶסֶד וֶאֱמֶת מַן יִנְצְרֻֽהוּ׃","כֵּן אֲזַמְּרָה שִׁמְךָ לָעַד לְֽשַׁלְּמִי נְדָרַי יוֹם יֽוֹם׃ {פ}"],"lat":["lamnatseach al-neginat ledavid","shim'a elohim rinati hakshiva tefilati","miktse ha'arets eleikha ekra ba'atof libi betsur-yarum mimeni tancheni","ki-hayita machse li migdal-oz mipnei oyev","agura ve'oholkha olamim echese veseter kenafeikha sela","ki-ata elohim shama'ta lindarai natata yerushat yir'ei shemekha","yamim al-yemei-melekh tosif shenotaiv kemo-dor vador","yeshev olam lifnei elohim chesed ve'emet man yintsruhu","ken azamra shimkha la'ad leshalmi nedarai yom yom f"],"en":["For the Leader; with string-music. [A Psalm] of David.","Hear my cry, O God; Attend unto my prayer.","From the end of the earth will I call unto Thee, when my heart fainteth; Lead me to a rock that is too high for me.","For Thou hast been a refuge for me, A tower of strength in the face of the enemy.","I will dwell in Thy Tent for ever; I will take refuge in the covert of Thy wings. Selah","For Thou, O God, hast heard my vows; Thou hast granted the heritage of those that fear Thy name. .","Mayest Thou add days unto the king's days! May his years be as many generations!","May he be enthroned before God for ever! Appoint mercy and truth, that they may preserve him.","So will I sing praise unto Thy name for ever, That I may daily perform my vows."]},{"n":62,"he":["לַמְנַצֵּחַ עַֽל־יְדוּתוּן מִזְמוֹר לְדָוִֽד׃","אַךְ אֶל־אֱלֹהִים דּֽוּמִיָּה נַפְשִׁי מִמֶּנּוּ יְשׁוּעָתִֽי׃","אַךְ־הוּא צוּרִי וִישׁוּעָתִי מִשְׂגַּבִּי לֹא־אֶמּוֹט רַבָּֽה׃","עַד־אָנָה תְּהוֹתְתוּ עַל־אִישׁ תְּרָצְּחוּ כֻלְּכֶם כְּקִיר נָטוּי גָּדֵר הַדְּחוּיָֽה׃","אַךְ מִשְּׂאֵתוֹ יָעֲצוּ לְהַדִּיחַ יִרְצוּ כָזָב בְּפִיו יְבָרֵכוּ וּבְקִרְבָּם יְקַֽלְלוּ־סֶֽלָה׃","אַךְ לֵאלֹהִים דּוֹמִּי נַפְשִׁי כִּֽי־מִמֶּנּוּ תִּקְוָתִֽי׃","אַךְ־הוּא צוּרִי וִישׁוּעָתִי מִשְׂגַּבִּי לֹא אֶמּֽוֹט׃","עַל־אֱלֹהִים יִשְׁעִי וּכְבוֹדִי צוּר־עֻזִּי מַחְסִי בֵּאלֹהִֽים׃","בִּטְחוּ־בוֹ בְכׇל־עֵת עָם שִׁפְכֽוּ־לְפָנָיו לְבַבְכֶם אֱלֹהִים מַחֲסֶה־לָּנוּ סֶֽלָה׃","אַךְ הֶבֶל בְּנֵֽי־אָדָם כָּזָב בְּנֵי־אִישׁ בְּמֹאזְנַיִם לַעֲלוֹת הֵמָּה מֵהֶבֶל יָֽחַד׃","אַל־תִּבְטְחוּ בְעֹשֶׁק וּבְגָזֵל אַל־תֶּהְבָּלוּ חַיִל כִּֽי־יָנוּב אַל־תָּשִׁיתוּ לֵֽב׃","אַחַת דִּבֶּר אֱלֹהִים שְׁתַּֽיִם־זוּ שָׁמָעְתִּי כִּי עֹז לֵֽאלֹהִֽים׃","וּלְךָֽ־אֲדֹנָי חָסֶד כִּֽי־אַתָּה תְשַׁלֵּם לְאִישׁ כְּֽמַעֲשֵֽׂהוּ׃ {פ}"],"lat":["lamnatseach al-yedutun mizmor ledavid","akh el-elohim dumiya nafshi mimenu yeshu'ati","akh-hu tsuri vishu'ati misgabi lo-emot raba","ad-ana tehotetu al-ish teratschu khulkhem kekir natuy gader hadchuya","akh mis'eto ya'atsu lehadiach yirtsu khazav befiv yevarekhu uvkirbam yekalelu-sela","akh lelohim domi nafshi ki-mimenu tikvati","akh-hu tsuri vishu'ati misgabi lo emot","al-elohim yish'i ukhvodi tsur-uzi machsi belohim","bitchu-vo vekhol-et am shifkhu-lefanaiv levavkhem elohim machase-lanu sela","akh hevel benei-adam kazav benei-ish bemoznayim la'alot hema mehevel yachad","al-tivtchu ve'oshek uvgazel al-tehbalu chayil ki-yanuv al-tashitu lev","achat diber elohim shetayim-zu shama'ti ki oz lelohim","ulkha-adonai chased ki-ata teshalem le'ish kema'asehu f"],"en":["For the Leader; for Jeduthun. A Psalm of David.","Only for God doth my soul wait in stillness; From Him cometh my salvation.","He only is my rock and my salvation, My high tower, I shall not be greatly moved.","How long will ye set upon a man, That ye may slay him, all of you, As a leaning wall, a tottering fence?","They only devise to thrust him down from his height, delighting in lies; They bless with their mouth, but they curse inwardly. Selah","Only for God wait thou in stillness, my soul; For from Him cometh my hope.","He only is my rock and my salvation, My high tower, I shall not be moved.","Upon God resteth my salvation and my glory; The rock of my strength, and my refuge, is in God.","Trust in Him at all times, ye people; Pour out your heart before Him; God is a refuge for us. Selah","Men of low degree are vanity, and men of high degree are a lie; If they be laid in the balances, they are together lighter than vanity.","Trust not in oppression, And put not vain hope in robbery; If riches increase, set not your heart thereon.","God hath spoken once, Twice have I heard this: That strength belongeth unto God;","Also unto Thee, O Lord, belongeth mercy; For Thou renderest to every man according to his work."]},{"n":63,"he":["מִזְמוֹר לְדָוִד בִּהְיוֹתוֹ בְּמִדְבַּר יְהוּדָֽה׃","אֱלֹהִים אֵלִי אַתָּה אֲֽשַׁחֲרֶךָּ צָמְאָה לְךָ נַפְשִׁי כָּמַהּ לְךָ בְשָׂרִי בְּאֶרֶץ־צִיָּה וְעָיֵף בְּלִי־מָֽיִם׃","כֵּן בַּקֹּדֶשׁ חֲזִיתִךָ לִרְאוֹת עֻזְּךָ וּכְבוֹדֶֽךָ׃","כִּי־טוֹב חַסְדְּךָ מֵחַיִּים שְׂפָתַי יְשַׁבְּחֽוּנְךָ׃","כֵּן אֲבָרֶכְךָ בְחַיָּי בְּשִׁמְךָ אֶשָּׂא כַפָּֽי׃","כְּמוֹ חֵלֶב וָדֶשֶׁן תִּשְׂבַּע נַפְשִׁי וְשִׂפְתֵי רְנָנוֹת יְהַלֶּל־פִּֽי׃","אִם־זְכַרְתִּיךָ עַל־יְצוּעָי בְּאַשְׁמֻרוֹת אֶהְגֶּה־בָּֽךְ׃","כִּֽי־הָיִיתָ עֶזְרָתָה לִּי וּבְצֵל כְּנָפֶיךָ אֲרַנֵּֽן׃","דָּבְקָה נַפְשִׁי אַחֲרֶיךָ בִּי תָּמְכָה יְמִינֶֽךָ׃","וְהֵמָּה לְשׁוֹאָה יְבַקְשׁוּ נַפְשִׁי יָבֹאוּ בְּֽתַחְתִּיּוֹת הָאָֽרֶץ׃","יַגִּירֻהוּ עַל־יְדֵי־חָרֶב מְנָת שֻׁעָלִים יִהְיֽוּ׃","וְהַמֶּלֶךְ יִשְׂמַח בֵּאלֹהִים יִתְהַלֵּל כׇּל־הַנִּשְׁבָּע בּוֹ כִּי יִסָּכֵר פִּי דוֹבְרֵי־שָֽׁקֶר׃ {פ}"],"lat":["mizmor ledavid bihyoto bemidbar yehuda","elohim eli ata ashachareka tsam'a lekha nafshi kamah lekha vesari be'erets-tsiya ve'ayef beli-mayim","ken bakodesh chazitikha lirot uzkha ukhvodekha","ki-tov chasdkha mechayim sefatai yeshabchunkha","ken avarekhkha vechayai beshimkha esa khapai","kemo chelev vadeshen tisba' nafshi vesiftei renanot yehalel-pi","im-zekhartikha al-yetsu'ai be'ashmurot ehge-bakh","ki-hayita ezrata li uvtsel kenafeikha aranen","davka nafshi achareikha bi tamkha yeminekha","vehema lesho'a yevakshu nafshi yavou betachtiyot ha'arets","yagiruhu al-yedei-charev menat shu'alim yihyu","vehamelekh yismach belohim yithalel kol-hanishba' bo ki yisakher pi dovrei-shaker f"],"en":["A Psalm of David, when he was in the wilderness of Judah.","O God, Thou art my God, earnestly will I seek Thee; My soul thirsteth for Thee, my flesh longeth for Thee, In a dry and weary land, where no water is.","So have I looked for Thee in the sanctuary, To see Thy power and Thy glory. .","For Thy lovingkindness is better than life; My lips shall praise Thee.","So will I bless Thee as long as I live; In Thy name will I lift up my hands.","My soul is satisfied as with marrow and fatness; And my mouth doth praise Thee with joyful lips;","When I remember Thee upon my couch, And meditate on Thee in the night-watches.","For Thou hast been my help, And in the shadow of Thy wings do I rejoice.","My soul cleaveth unto Thee; Thy right hand holdeth me fast.","But those that seek my soul, to destroy it, Shall go into the nethermost parts of the earth.","They shall be hurled to the power of the sword; They shall be a portion for foxes.","But the king shall rejoice in God; Every one that sweareth by Him shall glory; For the mouth of them that speak lies shall be stopped."]},{"n":64,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִֽד׃","שְׁמַע־אֱלֹהִים קוֹלִי בְשִׂיחִי מִפַּחַד אוֹיֵב תִּצֹּר חַיָּֽי׃","תַּסְתִּירֵנִי מִסּוֹד מְרֵעִים מֵרִגְשַׁת פֹּעֲלֵי אָֽוֶן׃","אֲשֶׁר שָׁנְנוּ כַחֶרֶב לְשׁוֹנָם דָּרְכוּ חִצָּם דָּבָר מָֽר׃","לִירֹת בַּמִּסְתָּרִים תָּם פִּתְאֹם יֹרֻהוּ וְלֹא יִירָֽאוּ׃","יְחַזְּקוּ־לָמוֹ דָּבָר רָע יְֽסַפְּרוּ לִטְמוֹן מוֹקְשִׁים אָמְרוּ מִי יִרְאֶה־לָּֽמוֹ׃","יַחְפְּֽשׂוּ־עוֹלֹת תַּמְנוּ חֵפֶשׂ מְחֻפָּשׂ וְקֶרֶב אִישׁ וְלֵב עָמֹֽק׃","וַיֹּרֵם אֱלֹהִים חֵץ פִּתְאוֹם הָיוּ מַכּוֹתָֽם׃","וַיַּכְשִׁילוּהוּ עָלֵימוֹ לְשׁוֹנָם יִתְנֹדְדוּ כׇּל־רֹאֵה בָֽם׃","וַיִּֽירְאוּ כׇּל־אָדָם וַיַּגִּידוּ פֹּעַל אֱלֹהִים וּֽמַעֲשֵׂהוּ הִשְׂכִּֽילוּ׃","יִשְׂמַח צַדִּיק בַּיהֹוָה וְחָסָה בוֹ וְיִתְהַלְלוּ כׇּל־יִשְׁרֵי־לֵֽב׃ {פ}"],"lat":["lamnatseach mizmor ledavid","shema'-elohim koli vesichi mipachad oyev titsor chayai","tastireni misod mere'im merigshat po'alei aven","asher shanenu khacherev leshonam darkhu chitsam davar mar","lirot bamistarim tam pit'om yoruhu velo yirau","yechazku-lamo davar ra' yesapru litmon mokshim amru mi yir'e-lamo","yachpsu-olot tamnu chefes mechupas vekerev ish velev amok","vayorem elohim chets pitom haiu makotam","vayakhshiluhu aleimo leshonam yitnodedu kol-ro'e vam","vayiru kol-adam vayagidu po'al elohim uma'asehu hiskilu","yismach tsadik baihova vechasa vo veyithalelu kol-yishrei-lev f"],"en":["For the Leader. A Psalm of David.","Hear my voice, O God, in my complaint; preserve my life from the terror of the enemy.","Hide me from the council of evil-doers; from the tumult of the workers of iniquity;","Who have whet their tongue like a sword, and have aimed their arrow, a poisoned word;","That they may shoot in secret places at the blameless; suddenly do they shoot at him, and fear not.","They encourage one another in an evil matter; they converse of laying snares secretly; they ask, who would see them.","They search out iniquities, they have accomplished a diligent search; even in the inward thought of every one, and the deep heart.","But God doth shoot at them with an arrow suddenly; thence are their wounds.","So they make their own tongue a stumbling unto themselves; all that see them shake the head.","And all men fear; and they declare the work of God, and understand His doing.","The righteous shall be glad in the LORD, and shall take refuge in Him; and all the upright in heart shall glory."]},{"n":65,"he":["לַמְנַצֵּחַ מִזְמוֹר לְדָוִד שִֽׁיר׃","לְךָ דֻֽמִיָּה תְהִלָּה אֱלֹהִים בְּצִיּוֹן וּלְךָ יְשֻׁלַּם־נֶֽדֶר׃","שֹׁמֵעַ תְּפִלָּה עָדֶיךָ כׇּל־בָּשָׂר יָבֹֽאוּ׃","דִּבְרֵי עֲוֺנֹת גָּבְרוּ מֶנִּי פְּשָׁעֵינוּ אַתָּה תְכַפְּרֵֽם׃","אַשְׁרֵי תִּבְחַר וּתְקָרֵב יִשְׁכֹּן חֲצֵרֶיךָ נִשְׂבְּעָה בְּטוּב בֵּיתֶךָ קְדֹשׁ הֵיכָלֶֽךָ׃","נוֹרָאוֹת בְּצֶדֶק תַּעֲנֵנוּ אֱלֹהֵי יִשְׁעֵנוּ מִבְטָח כׇּל־קַצְוֵי־אֶרֶץ וְיָם רְחֹקִֽים׃","מֵכִין הָרִים בְּכֹחוֹ נֶאְזָר בִּגְבוּרָֽה׃","מַשְׁבִּיחַ שְׁאוֹן יַמִּים שְׁאוֹן גַּלֵּיהֶם וַהֲמוֹן לְאֻמִּֽים׃","וַיִּירְאוּ יֹשְׁבֵי קְצָוֺת מֵאוֹתֹתֶיךָ מוֹצָֽאֵי־בֹקֶר וָעֶרֶב תַּרְנִֽין׃","פָּקַֽדְתָּ־הָאָרֶץ וַתְּשֹׁקְקֶהָ רַבַּת תַּעְשְׁרֶנָּה פֶּלֶג אֱלֹהִים מָלֵא מָיִם תָּכִין דְּגָנָם כִּי־כֵן תְּכִינֶֽהָ׃","תְּלָמֶיהָ רַוֵּה נַחֵת גְּדוּדֶהָ בִּרְבִיבִים תְּמֹגְגֶנָּה צִמְחָהּ תְּבָרֵֽךְ׃","עִטַּרְתָּ שְׁנַת טוֹבָתֶךָ וּמַעְגָּלֶיךָ יִרְעֲפוּן דָּֽשֶׁן׃","יִרְעֲפוּ נְאוֹת מִדְבָּר וְגִיל גְּבָעוֹת תַּחְגֹּֽרְנָה׃","לָבְשׁוּ כָרִים הַצֹּאן וַעֲמָקִים יַֽעַטְפוּ־בָר יִתְרוֹעֲעוּ אַף־יָשִֽׁירוּ׃ {פ}"],"lat":["lamnatseach mizmor ledavid shir","lekha dumiya tehila elohim betsiyon ulkha yeshulam-neder","shomea' tefila adeikha kol-basar yavou","divrei aonot gavru meni pesha'einu ata tekhaprem","ashrei tivchar utkarev yishkon chatsereikha nisb'a betuv beitekha kedosh heikhalekha","noraot betsedek ta'anenu elohei yish'enu mivtach kol-katsvei-erets veyam rechokim","mekhin harim bekhocho ne'zar bigvura","mashbiach sheon yamim sheon galeihem vahamon le'umim","vayiru yoshvei ketsaot meototeikha motsa'ei-voker va'erev tarnin","pakadta-ha'arets vatshokekeah rabat ta'shrena peleg elohim male mayim takhin deganam ki-khen tekhineah","telameiah rave nachet gedudeah birvivim temogegena tsimchah tevarekh","itarta shenat tovatekha uma'galeikha yir'afun dashen","yir'afu neot midbar vegil geva'ot tachgorna","lavshu kharim hatson va'amakim ya'atfu-var yitro'a'u af-yashiru f"],"en":["For the Leader. A Psalm. A Song of David.","Praise waiteth for Thee, O God, in Zion; and unto Thee the vow is performed.","O Thou that hearest prayer, unto Thee doth all flesh come.","The tale of iniquities is too heavy for me; as for our transgressions, Thou wilt pardon them.","Happy is the man whom Thou choosest, and bringest near, that he may dwell in Thy courts; may we be satisfied with the goodness of Thy house, the holy place of Thy temple!","With wondrous works dost Thou answer us in righteousness, O God of our salvation; Thou the confidence of all the ends of the earth, and of the far distant seas;","Who by Thy strength settest fast the mountains, who art girded about with might;","Who stillest the roaring of the seas, the roaring of their waves, and the tumult of the peoples;","So that they that dwell in the uttermost parts stand in awe of Thy signs; Thou makest the outgoings of the morning and evening to rejoice.","Thou hast remembered the earth, and watered her, greatly enriching her, with the river of God that is full of water; Thou preparest them corn, for so preparest Thou her.","Watering her ridges abundantly, settling down the furrows thereof, Thou makest her soft with showers; Thou blessest the growth thereof.","Thou crownest the year with Thy goodness; and Thy paths drop fatness.","The pastures of the wilderness do drop; and the hills are girded with joy.","The meadows are clothed with flocks; the valleys also are covered over with corn; they shout for joy, yea, they sing."]},{"n":66,"he":["לַמְנַצֵּחַ שִׁיר מִזְמוֹר הָרִיעוּ לֵאלֹהִים כׇּל־הָאָֽרֶץ׃","זַמְּרוּ כְבֽוֹד־שְׁמוֹ שִׂימוּ כָבוֹד תְּהִלָּתֽוֹ׃","אִמְרוּ לֵאלֹהִים מַה־נּוֹרָא מַעֲשֶׂיךָ בְּרֹב עֻזְּךָ יְֽכַחֲשׁוּ לְךָ אֹיְבֶֽיךָ׃","כׇּל־הָאָרֶץ יִשְׁתַּחֲווּ לְךָ וִיזַמְּרוּ־לָךְ יְזַמְּרוּ שִׁמְךָ סֶֽלָה׃","לְכוּ וּרְאוּ מִפְעֲלוֹת אֱלֹהִים נוֹרָא עֲלִילָה עַל־בְּנֵי אָדָֽם׃","הָפַךְ יָם לְֽיַבָּשָׁה בַּנָּהָר יַעַבְרוּ בְרָגֶל שָׁם נִשְׂמְחָה־בּֽוֹ׃","מֹשֵׁל בִּגְבוּרָתוֹ עוֹלָם עֵינָיו בַּגּוֹיִם תִּצְפֶּינָה הַסּוֹרְרִים אַל־[יָרוּמוּ] (ירימו) לָמוֹ סֶֽלָה׃","בָּרְכוּ עַמִּים אֱלֹהֵינוּ וְהַשְׁמִיעוּ קוֹל תְּהִלָּתֽוֹ׃","הַשָּׂם נַפְשֵׁנוּ בַּחַיִּים וְלֹֽא־נָתַן לַמּוֹט רַגְלֵֽנוּ׃","כִּֽי־בְחַנְתָּנוּ אֱלֹהִים צְרַפְתָּנוּ כִּצְרׇף־כָּֽסֶף׃","הֲבֵאתָנוּ בַמְּצוּדָה שַׂמְתָּ מוּעָקָה בְמׇתְנֵֽינוּ׃","הִרְכַּבְתָּֽ אֱנוֹשׁ לְרֹאשֵׁנוּ בָּֽאנוּ־בָאֵשׁ וּבַמַּיִם וַתּוֹצִיאֵנוּ לָרְוָיָֽה׃","אָבוֹא בֵיתְךָ בְעוֹלוֹת אֲשַׁלֵּם לְךָ נְדָרָֽי׃","אֲשֶׁר־פָּצוּ שְׂפָתָי וְדִבֶּר־פִּי בַּצַּר־לִֽי׃","עֹלוֹת מֵיחִים אַֽעֲלֶה־לָּךְ עִם־קְטֹרֶת אֵילִים אֶעֱשֶֽׂה־בָקָר עִם־עַתּוּדִים סֶֽלָה׃","לְכוּ־שִׁמְעוּ וַאֲסַפְּרָה כׇּל־יִרְאֵי אֱלֹהִים אֲשֶׁר עָשָׂה לְנַפְשִֽׁי׃","אֵלָיו פִּֽי־קָרָאתִי וְרוֹמַם תַּחַת לְשׁוֹנִֽי׃","אָוֶן אִם־רָאִיתִי בְלִבִּי לֹא יִשְׁמַע אֲדֹנָֽי׃","אָכֵן שָׁמַע אֱלֹהִים הִקְשִׁיב בְּקוֹל תְּפִלָּתִֽי׃","בָּרוּךְ אֱלֹהִים אֲשֶׁר לֹֽא־הֵסִיר־תְּפִלָּתִי וְחַסְדּוֹ מֵאִתִּֽי׃ {פ}"],"lat":["lamnatseach shir mizmor hari'u lelohim kol-ha'arets","zamru khevod-shemo simu khavod tehilato","imru lelohim ma-nora ma'aseikha berov uzkha yekhachashu lekha oyveikha","kol-ha'arets yishtachavu lekha vizamru-lakh yezamru shimkha sela","lekhu uru mif'alot elohim nora alila al-benei adam","hafakh yam leyabasha banahar ya'avru veragel sham nismcha-bo","moshel bigvurato olam einaiv bagoyim titspeina hasorerim al-yarumu yrymv lamo sela","barkhu amim eloheinu vehashmi'u kol tehilato","hasam nafshenu bachayim velo-natan lamot raglenu","ki-vechantanu elohim tseraftanu kitsrof-kasef","havetanu vamtsuda samta mu'aka vemotneinu","hirkavta enosh leroshenu banu-va'esh uvamayim vatotsi'enu larvaya","avo veitkha ve'olot ashalem lekha nedarai","asher-patsu sefatai vediber-pi batsar-li","olot meichim a'ale-lakh im-ketoret eilim e'ese-vakar im-atudim sela","lekhu-shim'u va'asapra kol-yir'ei elohim asher asa lenafshi","elaiv pi-karati veromam tachat leshoni","aven im-ra'iti velibi lo yishma' adonai","akhen shama' elohim hikshiv bekol tefilati","barukh elohim asher lo-hesir-tefilati vechasdo me'iti f"],"en":["For the Leader. A Song, a Psalm. Shout unto God, all the earth;","Sing praises unto the glory of His name; Make His praise glorious.","Say unto God: 'How tremendous is Thy work! Through the greatness of Thy power shall Thine enemies dwindle away before Thee.","All the earth shall worship Thee, And shall sing praises unto Thee; They shall sing praises to Thy name.' Selah","Come, and see the works of God; He is terrible in His doing toward the children of men.","He turned the sea into dry land; They went through the river on foot; There let us rejoice in Him!","Who ruleth by His might for ever; His eyes keep watch upon the nations; Let not the rebellious exalt themselves. Selah","Bless our God, ye peoples, And make the voice of His praise to be heard;","Who hath set our soul in life, And suffered not our foot to be moved,","For Thou, O God, hast tried us; Thou hast refined us, as silver is refined.","Thou didst bring us into the hold; Thou didst lay constraint upon our loins.","Thou hast caused men to ride over our heads; We went through fire and through water; But Thou didst bring us out unto abundance.","I will come into Thy house with burnt-offerings, I will perform unto Thee my vows,","Which my lips have uttered, And my mouth hath spoken, when I was in distress.","I will offer unto Thee burnt-offerings of fatlings, With the sweet smoke of rams; I will offer bullocks with goats. Selah","Come, and hearken, all ye that fear God, And I will declare what He hath done for my soul.","I cried unto Him with my mouth, And He was extolled with my tongue.","If I had regarded iniquity in my heart, The Lord would not hear;","But verily God hath heard; He hath attended to the voice of my prayer.","Blessed be God, Who hath not turned away my prayer, nor His mercy from me."]},{"n":67,"he":["לַמְנַצֵּחַ בִּנְגִינֹת מִזְמוֹר שִֽׁיר׃","אֱֽלֹהִים יְחׇנֵּנוּ וִיבָרְכֵנוּ יָאֵֽר־פָּנָיו אִתָּנוּ סֶֽלָה׃","לָדַעַת בָּאָרֶץ דַּרְכֶּךָ בְּכׇל־גּוֹיִם יְשׁוּעָתֶֽךָ׃","יוֹדוּךָ עַמִּים אֱלֹהִים יוֹדוּךָ עַמִּים כֻּלָּֽם׃","יִשְׂמְחוּ וִירַנְּנוּ לְאֻמִּים כִּֽי־תִשְׁפֹּט עַמִּים מִישֹׁר וּלְאֻמִּים בָּאָרֶץ תַּנְחֵם סֶֽלָה׃","יוֹדוּךָ עַמִּים אֱלֹהִים יוֹדוּךָ עַמִּים כֻּלָּֽם׃","אֶרֶץ נָתְנָה יְבוּלָהּ יְבָרְכֵנוּ אֱלֹהִים אֱלֹהֵֽינוּ׃","יְבָרְכֵנוּ אֱלֹהִים וְיִֽירְאוּ אוֹתוֹ כׇּל־אַפְסֵי־אָֽרֶץ׃ {פ}"],"lat":["lamnatseach binginot mizmor shir","elohim yechonenu vivarkhenu ya'er-panaiv itanu sela","lada'at ba'arets darkekha bekhol-goyim yeshu'atekha","yodukha amim elohim yodukha amim kulam","yismchu viranenu le'umim ki-tishpot amim mishor ul'umim ba'arets tanchem sela","yodukha amim elohim yodukha amim kulam","erets natna yevulah yevarkhenu elohim eloheinu","yevarkhenu elohim veyiru oto kol-afsei-arets f"],"en":["For the Leader; with string-music. A Psalm, a Song.","God be gracious unto us, and bless us; May He cause His face to shine toward us; Selah","That Thy way may be known upon earth, Thy salvation among all nations.","Let the peoples give thanks unto Thee, O God; Let the peoples give thanks unto Thee, all of them. .","O let the nations be glad and sing for joy; For Thou wilt judge the peoples with equity, And lead the nations upon earth. Selah","Let the peoples give thanks unto Thee, O God; Let the peoples give thanks unto Thee, all of them.","The earth hath yielded her increase; May God, our own God, bless us.","May God bless us; And let all the ends of the earth fear Him."]},{"n":68,"he":["לַמְנַצֵּחַ לְדָוִד מִזְמוֹר שִֽׁיר׃","יָקוּם אֱלֹהִים יָפוּצוּ אוֹיְבָיו וְיָנוּסוּ מְשַׂנְאָיו מִפָּנָֽיו׃","כְּהִנְדֹּף עָשָׁן תִּנְדֹּף כְּהִמֵּס דּוֹנַג מִפְּנֵי־אֵשׁ יֹאבְדוּ רְשָׁעִים מִפְּנֵי אֱלֹהִֽים׃","וְֽצַדִּיקִים יִשְׂמְחוּ יַעַלְצוּ לִפְנֵי אֱלֹהִים וְיָשִׂישׂוּ בְשִׂמְחָֽה׃","שִׁירוּ לֵאלֹהִים זַמְּרוּ שְׁמוֹ סֹלּוּ לָרֹכֵב בָּעֲרָבוֹת בְּיָהּ שְׁמוֹ וְעִלְזוּ לְפָנָֽיו׃","אֲבִי יְתוֹמִים וְדַיַּן אַלְמָנוֹת אֱלֹהִים בִּמְעוֹן קׇדְשֽׁוֹ׃","אֱלֹהִים מוֹשִׁיב יְחִידִים בַּיְתָה מוֹצִיא אֲסִירִים בַּכּוֹשָׁרוֹת אַךְ סוֹרְרִים שָׁכְנוּ צְחִיחָֽה׃","אֱֽלֹהִים בְּצֵאתְךָ לִפְנֵי עַמֶּךָ בְּצַעְדְּךָ בִישִׁימוֹן סֶֽלָה׃","אֶרֶץ רָעָשָׁה אַף־שָׁמַיִם נָטְפוּ מִפְּנֵי אֱלֹהִים זֶה סִינַי מִפְּנֵי אֱלֹהִים אֱלֹהֵי יִשְׂרָאֵֽל׃","גֶּשֶׁם נְדָבוֹת תָּנִיף אֱלֹהִים נַחֲלָתְךָ וְנִלְאָה אַתָּה כוֹנַנְתָּֽהּ׃","חַיָּתְךָ יָשְׁבוּ־בָהּ תָּכִֽין־בְּטוֹבָתְךָ לֶֽעָנִי אֱלֹהִֽים׃","אֲדֹנָי יִתֶּן־אֹמֶר הַֽמְבַשְּׂרוֹת צָבָא רָֽב׃","מַלְכֵי צְבָאוֹת יִדֹּדוּן יִדֹּדוּן וּנְוַת־בַּיִת תְּחַלֵּק שָׁלָֽל׃","אִֽם־תִּשְׁכְּבוּן בֵּין שְׁפַתָּיִם כַּנְפֵי יוֹנָה נֶחְפָּה בַכֶּסֶף וְאֶבְרוֹתֶיהָ בִּירַקְרַק חָרֽוּץ׃","בְּפָרֵשׂ שַׁדַּי מְלָכִים בָּהּ תַּשְׁלֵג בְּצַלְמֽוֹן׃","הַר־אֱלֹהִים הַר־בָּשָׁן הַר גַּבְנֻנִּים הַר־בָּשָֽׁן׃","לָמָּה תְּֽרַצְּדוּן הָרִים גַּבְנֻנִּים הָהָר חָמַד אֱלֹהִים לְשִׁבְתּוֹ אַף־יְהֹוָה יִשְׁכֹּן לָנֶֽצַח׃","רֶכֶב אֱלֹהִים רִבֹּתַיִם אַלְפֵי שִׁנְאָן אֲדֹנָי בָֿם סִינַי בַּקֹּֽדֶשׁ׃","עָלִיתָ לַמָּרוֹם שָׁבִיתָ שֶּׁבִי לָקַחְתָּ מַתָּנוֹת בָּאָדָם וְאַף סוֹרְרִים לִשְׁכֹּן יָהּ אֱלֹהִֽים׃","בָּרוּךְ אֲדֹנָי יוֹם יוֹם יַעֲמׇס־לָנוּ הָאֵל יְֽשׁוּעָתֵנוּ סֶֽלָה׃","הָאֵל לָנוּ אֵל לְֽמוֹשָׁעוֹת וְלֵיהֹוִה אֲדֹנָי לַמָּוֶת תֹּצָאֽוֹת׃","אַךְ־אֱלֹהִים יִמְחַץ רֹאשׁ אֹיְבָיו קׇדְקֹד שֵׂעָר מִתְהַלֵּךְ בַּאֲשָׁמָֽיו׃","אָמַר אֲדֹנָי מִבָּשָׁן אָשִׁיב אָשִׁיב מִֽמְּצֻלוֹת יָֽם׃","לְמַעַן תִּמְחַץ רַגְלְךָ בְּדָם לְשׁוֹן כְּלָבֶיךָ מֵאֹיְבִים מִנֵּֽהוּ׃","רָאוּ הֲלִיכוֹתֶיךָ אֱלֹהִים הֲלִיכוֹת אֵלִי מַלְכִּי בַקֹּֽדֶשׁ׃","קִדְּמוּ שָׁרִים אַחַר נֹגְנִים בְּתוֹךְ עֲלָמוֹת תּוֹפֵפֽוֹת׃","בְּֽמַקְהֵלוֹת בָּרְכוּ אֱלֹהִים אֲדֹנָי מִמְּקוֹר יִשְׂרָאֵֽל׃","שָׁם בִּנְיָמִן צָעִיר רֹדֵם שָׂרֵי יְהוּדָה רִגְמָתָם שָׂרֵי זְבֻלוּן שָׂרֵי נַפְתָּלִֽי׃","צִוָּה אֱלֹהֶיךָ עֻזֶּךָ עוּזָּה אֱלֹהִים זוּ פָּעַלְתָּ לָּֽנוּ׃","מֵהֵיכָלֶךָ עַל־יְרוּשָׁלָ͏ִם לְךָ יוֹבִילוּ מְלָכִים שָֽׁי׃","גְּעַר חַיַּת קָנֶה עֲדַת אַבִּירִים בְּעֶגְלֵי עַמִּים מִתְרַפֵּס בְּרַצֵּי־כָסֶף בִּזַּר עַמִּים קְרָבוֹת יֶחְפָּֽצוּ׃","יֶאֱתָיוּ חַשְׁמַנִּים מִנִּי מִצְרָיִם כּוּשׁ תָּרִיץ יָדָיו לֵאלֹהִֽים׃","מַמְלְכוֹת הָאָרֶץ שִׁירוּ לֵאלֹהִים זַמְּרוּ אֲדֹנָי סֶֽלָה׃","לָרֹכֵב בִּשְׁמֵי שְׁמֵי־קֶדֶם הֵן יִתֵּן בְּקוֹלוֹ קוֹל עֹֽז׃","תְּנוּ עֹז לֵאלֹהִים עַֽל־יִשְׂרָאֵל גַּאֲוָתוֹ וְעֻזּוֹ בַּשְּׁחָקִֽים׃","נוֹרָא אֱלֹהִים מִֽמִּקְדָּשֶׁיךָ אֵל יִשְׂרָאֵל הוּא נֹתֵן עֹז וְתַעֲצֻמוֹת לָעָם בָּרוּךְ אֱלֹהִֽים׃ {פ}"],"lat":["lamnatseach ledavid mizmor shir","yakum elohim yafutsu oyvaiv veyanusu mesan'aiv mipanaiv","kehindof ashan tindof kehimes donag mipnei-esh yovdu resha'im mipnei elohim","vetsadikim yismchu ya'altsu lifnei elohim veyasisu vesimcha","shiru lelohim zamru shemo solu larokhev ba'aravot beyah shemo ve'ilzu lefanaiv","avi yetomim vedayan almanot elohim bim'on kodsho","elohim moshiv yechidim bayta motsi asirim bakosharot akh sorerim shakhnu tsechicha","elohim betsetkha lifnei amekha betsa'dkha vishimon sela","erets ra'asha af-shamayim natfu mipnei elohim ze sinai mipnei elohim elohei yisra'el","geshem nedavot tanif elohim nachalatkha venil'a ata khonantah","chayatkha yashvu-vah takhin-betovatkha le'ani elohim","adonai yiten-omer hamvasrot tsava rav","malkhei tsevaot yidodun yidodun unvat-bayit techalek shalal","im-tishkvun bein shefatayim kanfei yona nechpa vakesef ve'evroteiah birakrak charuts","befares shadai melakhim bah tashleg betsalmon","har-elohim har-bashan har gavnunim har-bashan","lama teratsdun harim gavnunim hahar chamad elohim leshivto af-Adonai yishkon lanetsach","rekhev elohim ribotayim alfei shin'an adonai vam sinai bakodesh","alita lamarom shavita shevi lakachta matanot ba'adam ve'af sorerim lishkon yah elohim","barukh adonai yom yom ya'amos-lanu ha'el yeshu'atenu sela","ha'el lanu el lemosha'ot veleihovi adonai lamavet totsaot","akh-elohim yimchats rosh oyvaiv kodkod se'ar mithalekh ba'ashamaiv","amar adonai mibashan ashiv ashiv mimtsulot yam","lema'an timchats raglkha bedam leshon kelaveikha me'oyvim minehu","rau halikhoteikha elohim halikhot eli malki vakodesh","kidmu sharim achar nognim betokh alamot tofefot","bemakhelot barkhu elohim adonai mimkor yisra'el","sham binyamin tsa'ir rodem sarei yehuda rigmatam sarei zevulun sarei naftali","tsiva eloheikha uzekha uza elohim zu pa'alta lanu","meheikhalekha al-yerushalam lekha yovilu melakhim shai","ge'ar chayat kane adat abirim be'eglei amim mitrapes beratsei-khasef bizar amim keravot yechpatsu","ye'etaiu chashmanim mini mitsrayim kush tarits yadaiv lelohim","mamlkhot ha'arets shiru lelohim zamru adonai sela","larokhev bishmei shemei-kedem hen yiten bekolo kol oz","tenu oz lelohim al-yisra'el ga'avato ve'uzo bashchakim","nora elohim mimikdasheikha el yisra'el hu noten oz veta'atsumot la'am barukh elohim f"],"en":["For the Leader. A Psalm of David, a Song.","Let God arise, let His enemies be scattered; And let them that hate Him flee before Him.","As smoke is driven away, so drive them away; As wax melteth before the fire, So let the wicked perish at the presence of God.","But let the righteous be glad, let them exult before God; Yea, let them rejoice with gladness
